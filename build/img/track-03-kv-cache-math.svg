<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"><rect width="760" height="400" fill="#0d0d0d"/>
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#e8e8e8}
.t{font-size:19px;font-weight:bold}.s{font-size:13.5px}.xs{font-size:12px;fill:#8a8a8a}
.b{fill:#161616;stroke:#3a3a3a;stroke-width:1.4}
.acc{fill:none;stroke:#f0b429;stroke-width:2;marker-end:url(#ah)}
.acc2{fill:none;stroke:#8a8a8a;stroke-width:1.5;marker-end:url(#ah2)}
.teal{fill:#2dd4bf}.amber{fill:#f0b429}.red{fill:#e5484d}.blue{fill:#4aa8ff}
</style>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
<marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/></marker>
</defs>
<text x="30" y="38" class="t">Where 320 KB per token comes from</text>
<text x="30" y="62" class="xs">one token, one layer, then times 80 layers</text>
<rect x="40" y="110" width="120" height="120" rx="10" class="b" stroke="#2dd4bf" style="stroke:#2dd4bf"/>
<text x="100" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#2dd4bf">2</text>
<text x="100" y="185" text-anchor="middle" class="xs">K and V</text>
<text x="100" y="203" text-anchor="middle" class="xs">matrices</text>
<text x="182" y="180" text-anchor="middle" font-size="24" fill="#8a8a8a">x</text>
<rect x="205" y="110" width="120" height="120" rx="10" class="b" stroke="#4aa8ff" style="stroke:#4aa8ff"/>
<text x="265" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#4aa8ff">8</text>
<text x="265" y="185" text-anchor="middle" class="xs">KV heads</text>
<text x="265" y="203" text-anchor="middle" class="xs">(GQA)</text>
<text x="347" y="180" text-anchor="middle" font-size="24" fill="#8a8a8a">x</text>
<rect x="370" y="110" width="120" height="120" rx="10" class="b" stroke="#f0b429" style="stroke:#f0b429"/>
<text x="430" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#f0b429">128</text>
<text x="430" y="185" text-anchor="middle" class="xs">head dim</text>
<text x="512" y="180" text-anchor="middle" font-size="24" fill="#8a8a8a">x</text>
<rect x="535" y="110" width="120" height="120" rx="10" class="b" stroke="#e5484d" style="stroke:#e5484d"/>
<text x="595" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#e5484d">2 B</text>
<text x="595" y="185" text-anchor="middle" class="xs">BF16</text>
<text x="595" y="203" text-anchor="middle" class="xs">bytes</text>
<text x="380" y="290" text-anchor="middle" class="s">= 2 x 8 x 128 x 2 B = 4,096 bytes per layer</text>
<text x="380" y="318" text-anchor="middle" class="s" fill="#f0b429">x 80 layers = 327,680 bytes = 320 KB per token</text>
<text x="380" y="352" text-anchor="middle" class="xs">32k context x 320 KB = ~10 GB per sequence: that is your batch cap</text>
</svg>