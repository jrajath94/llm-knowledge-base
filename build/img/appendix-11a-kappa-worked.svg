<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Diagram of the kappa worked example: 75 percent raw agreement, 60 percent expected by chance, kappa 0.375.">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Kappa: the worked example</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Raw agreement 75% looks good. Chance alone explains 60%. Kappa = 0.375.</text>
<rect x="90" y="215" width="150" height="255" rx="8" fill="#5aa9e6" opacity="0.9"/>
<text x="165" y="203" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#ececec">0.75</text>
<text x="165" y="496" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Raw agreement p_o</text>
<rect x="320" y="266" width="150" height="204" rx="8" fill="#e6a75a" opacity="0.9"/>
<text x="395" y="254" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#ececec">0.6</text>
<text x="395" y="496" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Expected by chance p_e</text>
<rect x="550" y="343" width="150" height="127" rx="8" fill="#7fd08a" opacity="0.9"/>
<text x="625" y="331" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#ececec">0.375</text>
<text x="625" y="496" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Kappa</text>
<text x="400" y="120" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#ececec">kappa = (p_o - p_e) / (1 - p_e)</text>
<text x="400" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#ececec">= (0.75 - 0.60) / (1 - 0.60) = 0.375</text>
<text x="400" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">The 37.5 point gap is chance agreement the raw number hid.</text>
</svg>