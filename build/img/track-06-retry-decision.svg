<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 600' width='100%' role='img'>
<title>Retries with judgment: classify, then decide</title>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a8a8'/></marker></defs>
<text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Retries with judgment: classify, then decide</text>
<text x='480' y='64' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#a8a8a8' text-anchor='middle'>Not every error deserves a retry. Follow the tree.</text>
<rect x='380' y='90' width='200' height='90' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='480.0' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Tool call fails</text>
<polygon points='480,205.0 630.0,260 480,315.0 330.0,260' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='480' y='258' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Error type?</text>
<rect x='60' y='400' width='220' height='110' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='170.0' y='430' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Transient</text>
<text x='170.0' y='452' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>rate limit, timeout:</text>
<text x='170.0' y='471' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>wait, then retry</text>
<text x='170.0' y='490' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>with backoff</text>
<rect x='370' y='400' width='220' height='110' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='480.0' y='430' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Agent mistake</text>
<text x='480.0' y='452' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>bad args, wrong tool:</text>
<text x='480.0' y='471' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>fix the call,</text>
<text x='480.0' y='490' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>then retry once</text>
<rect x='680' y='400' width='220' height='110' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/>
<text x='790.0' y='430' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Do not retry</text>
<text x='790.0' y='452' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>auth, config, budget:</text>
<text x='790.0' y='471' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>stop and alert</text>
<text x='790.0' y='490' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>a human</text>
<line x1='380' y1='220' x2='170' y2='400' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<line x1='480' y1='315' x2='480' y2='400' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<line x1='580' y1='220' x2='790' y2='400' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<text x='480' y='560' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>Rule: two failures of the same kind in a row means escalate, not a third retry.</text>
</svg>