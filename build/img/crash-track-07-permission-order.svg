<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 4.5. The permission check goes BEFORE retrieval</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Enforcement lives with the data flow, not with the suggestion.</text>
<text x="24" y="100" font-size="14" font-weight="bold" fill="#e57ea6">WRONG: filter after retrieval</text>
<rect x="60" y="115" width="180" height="60" fill="#2a1414" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="150" y="150" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Retrieve</text>
<rect x="300" y="115" width="180" height="60" fill="#2a1414" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="390" y="150" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Model reads all</text>
<rect x="540" y="115" width="180" height="60" fill="#2a1414" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="630" y="150" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Filter "for display"</text>
<line x1="240" y1="145" x2="290" y2="145" stroke="#e57ea6" stroke-width="2"/>
<polygon points="290,139 290,151 300,145" fill="#e57ea6"/>
<line x1="480" y1="145" x2="530" y2="145" stroke="#e57ea6" stroke-width="2"/>
<polygon points="530,139 530,151 540,145" fill="#e57ea6"/>
<text x="440" y="210" font-size="13" fill="#e57ea6" text-anchor="middle">The model already saw restricted data. Incident, not a feature.</text>
<text x="24" y="270" font-size="14" font-weight="bold" fill="#7bc98a">RIGHT: check before retrieval</text>
<rect x="60" y="285" width="180" height="60" fill="#142a1a" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="150" y="320" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Permission check</text>
<rect x="300" y="285" width="180" height="60" fill="#142a1a" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="390" y="320" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Retrieve allowed</text>
<rect x="540" y="285" width="180" height="60" fill="#142a1a" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="630" y="320" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Model sees allowed</text>
<line x1="240" y1="315" x2="290" y2="315" stroke="#7bc98a" stroke-width="2"/>
<polygon points="290,309 290,321 300,315" fill="#7bc98a"/>
<line x1="480" y1="315" x2="530" y2="315" stroke="#7bc98a" stroke-width="2"/>
<polygon points="530,309 530,321 540,315" fill="#7bc98a"/>
<text x="440" y="400" font-size="13" fill="#ececec" text-anchor="middle">Filter by the requesting user’s permissions before the model sees anything.</text>
<text x="440" y="430" font-size="13" fill="#8a8a8a" text-anchor="middle">Test with a low-privilege test user. The demo ran as admin.</text>
</svg>
