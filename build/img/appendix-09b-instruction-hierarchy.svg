<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-label="Pyramid diagram of the instruction hierarchy: system, developer, user, tool output.">
<rect width="800" height="620" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Instruction hierarchy: rank wins</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">When instructions conflict, the higher rank wins.</text>
<rect x="230" y="80" width="340" height="70" rx="8" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="400" y="110" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#5aa9e6">1. System</text>
<text x="400" y="134" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">platform rules</text>
<rect x="180" y="166" width="440" height="70" rx="8" fill="#161616" stroke="#e6a75a" stroke-width="2"/>
<text x="400" y="196" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#e6a75a">2. Developer</text>
<text x="400" y="220" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">application rules</text>
<rect x="130" y="252" width="540" height="70" rx="8" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="400" y="282" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#7fd08a">3. User</text>
<text x="400" y="306" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">the person asking</text>
<rect x="80" y="338" width="640" height="70" rx="8" fill="#161616" stroke="#a8a8a8" stroke-width="2"/>
<text x="400" y="368" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#a8a8a8">4. Tool output</text>
<text x="400" y="392" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">web pages, tool results</text>
<rect x="150" y="506" width="500" height="44" rx="8" fill="none" stroke="#e67e7e" stroke-width="2"/>
<text x="400" y="534" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#e67e7e">Tool output is data, never instructions.</text>
<text x="400" y="574" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">A web page telling the agent to exfiltrate data is rank 4. It loses to every higher rank.</text>
</svg>