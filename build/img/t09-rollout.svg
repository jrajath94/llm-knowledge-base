<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t09ro-title t09ro-desc">
<title id="t09ro-title">Rollout: shadow, canary, full</title>
<desc id="t09ro-desc">Three stages of traffic. Shadow: the new model scores live traffic but its answers are discarded; 0 percent user impact. Canary: 5 percent of users get the new model. Full: 100 percent. A rollback arrow returns from canary to the old model when metrics drop.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">ROLLOUT STAGES</text>
<rect x="30" y="90" width="250" height="110" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="155.0" y="124" class="box" fill="#ececec">shadow</text>
<text x="155.0" y="146" class="d">0% users see it</text>
<text x="155.0" y="164" class="d">scores discarded</text>
<rect x="330" y="90" width="250" height="110" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="455.0" y="124" class="box" fill="#ececec">canary</text>
<text x="455.0" y="146" class="d">5% of users</text>
<text x="455.0" y="164" class="d">watch metrics</text>
<rect x="630" y="90" width="250" height="110" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="755.0" y="124" class="box" fill="#ececec">full</text>
<text x="755.0" y="146" class="d">100% of users</text>
<text x="755.0" y="164" class="d">the new default</text>
<line x1="280" y1="145" x2="330" y2="145" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09ro-ah)"/>
<line x1="580" y1="145" x2="630" y2="145" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09ro-ah)"/>
<line x1="455" y1="200" x2="155" y2="200" stroke="#ff7a7a" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#t09ro-ah)"/>
<text x="280" y="192" class="dl" fill="#ff7a7a">rollback</text>
<text x="30" y="280" class="capl">How to read: left to right = more risk. Move right only when metrics hold.</text>
<text x="30" y="302" class="dl">Shadow catches crashes. Canary catches metric drops. Full is the point of no return.</text>
<text x="30" y="344" class="dl" fill="#ff7a7a">What breaks: skipping canary. A bad model then hits 100 percent of users at once.</text>
</g>
<defs><marker id="t09ro-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>