<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="540" fill="#0d0d0d"/>
<text x="450" y="34" text-anchor="middle" fill="#ececec" font-size="20" font-weight="600">3D parallelism: one axis per parallelism type</text>
<text x="450" y="58" text-anchor="middle" fill="#a8a8a8" font-size="13">16 GPUs: DP=2, TP=4, PP=2 (2 pipeline stages)</text>

<!-- GPU grid: 4 cols (TP) x 2 rows (DP) per stage; two stages -->
<g font-size="11">
<!-- stage 0 -->
<text x="215" y="100" text-anchor="middle" fill="#6cb2ff" font-size="14" font-weight="600">pipeline stage 0 (layers 0-15)</text>
<rect x="45" y="115" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="85" y="139" text-anchor="middle" fill="#ececec">GPU 0</text>
<text x="85" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp0</text>
<rect x="130" y="115" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="170" y="139" text-anchor="middle" fill="#ececec">GPU 1</text>
<text x="170" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp1</text>
<rect x="215" y="115" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="255" y="139" text-anchor="middle" fill="#ececec">GPU 2</text>
<text x="255" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp2</text>
<rect x="300" y="115" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="340" y="139" text-anchor="middle" fill="#ececec">GPU 3</text>
<text x="340" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp3</text>

<rect x="45" y="185" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="85" y="209" text-anchor="middle" fill="#ececec">GPU 4</text>
<text x="85" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp0</text>
<rect x="130" y="185" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="170" y="209" text-anchor="middle" fill="#ececec">GPU 5</text>
<text x="170" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp1</text>
<rect x="215" y="185" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="255" y="209" text-anchor="middle" fill="#ececec">GPU 6</text>
<text x="255" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp2</text>
<rect x="300" y="185" width="80" height="60" rx="5" fill="#1a2a1a" stroke="#2e9e5b"/>
<text x="340" y="209" text-anchor="middle" fill="#ececec">GPU 7</text>
<text x="340" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp3</text>

<!-- stage 1 -->
<text x="685" y="100" text-anchor="middle" fill="#f0b429" font-size="14" font-weight="600">pipeline stage 1 (layers 16-31)</text>
<rect x="515" y="115" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="555" y="139" text-anchor="middle" fill="#ececec">GPU 8</text>
<text x="555" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp0</text>
<rect x="600" y="115" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="640" y="139" text-anchor="middle" fill="#ececec">GPU 9</text>
<text x="640" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp1</text>
<rect x="685" y="115" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="725" y="139" text-anchor="middle" fill="#ececec">GPU 10</text>
<text x="725" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp2</text>
<rect x="770" y="115" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="810" y="139" text-anchor="middle" fill="#ececec">GPU 11</text>
<text x="810" y="156" text-anchor="middle" fill="#a8a8a8">dp0 tp3</text>

<rect x="515" y="185" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="555" y="209" text-anchor="middle" fill="#ececec">GPU 12</text>
<text x="555" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp0</text>
<rect x="600" y="185" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="640" y="209" text-anchor="middle" fill="#ececec">GPU 13</text>
<text x="640" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp1</text>
<rect x="685" y="185" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="725" y="209" text-anchor="middle" fill="#ececec">GPU 14</text>
<text x="725" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp2</text>
<rect x="770" y="185" width="80" height="60" rx="5" fill="#2a1f0d" stroke="#f0b429"/>
<text x="810" y="209" text-anchor="middle" fill="#ececec">GPU 15</text>
<text x="810" y="226" text-anchor="middle" fill="#a8a8a8">dp1 tp3</text>
</g>

<!-- PP arrows between stages -->
<path d="M 385 145 L 505 145" stroke="#a8a8a8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="445" y="136" text-anchor="middle" fill="#a8a8a8" font-size="11">activations</text>
<path d="M 505 215 L 385 215" stroke="#a8a8a8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="445" y="232" text-anchor="middle" fill="#a8a8a8" font-size="11">gradients</text>

<!-- TP brace -->
<text x="212" y="275" text-anchor="middle" fill="#7fd08a" font-size="12">tensor parallelism: shards each layer across 4 GPUs</text>
<text x="212" y="295" text-anchor="middle" fill="#a8a8a8" font-size="12">all-reduce inside the node, over fast NVLink</text>

<!-- DP brace -->
<text x="688" y="275" text-anchor="middle" fill="#6cb2ff" font-size="12">data parallelism: 2 replicas, different microbatches</text>
<text x="688" y="295" text-anchor="middle" fill="#a8a8a8" font-size="12">gradients all-reduced across nodes, once per step</text>

<!-- bottom: the rule -->
<rect x="60" y="330" width="780" height="170" rx="8" fill="#141414" stroke="#3a3a3a"/>
<text x="450" y="358" text-anchor="middle" fill="#ececec" font-size="14" font-weight="600">the mapping rule</text>
<text x="450" y="384" text-anchor="middle" fill="#a8a8a8" font-size="13">map tensor parallelism inside the node (fastest link),</text>
<text x="450" y="406" text-anchor="middle" fill="#a8a8a8" font-size="13">data parallelism across nodes (tolerates slower links),</text>
<text x="450" y="428" text-anchor="middle" fill="#a8a8a8" font-size="13">pipeline stages where it cuts memory without extra collectives.</text>
<text x="450" y="462" text-anchor="middle" fill="#e08080" font-size="13">copy a TP-inside, DP-across plan onto a TPU pod and you waste the mesh:</text>
<text x="450" y="484" text-anchor="middle" fill="#e08080" font-size="13">every link there is fast, so the plan must follow the torus, not the node.</text>

<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#a8a8a8"/>
</marker>
</defs>
</svg>
