<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 460' width='100%' role='img' aria-label='Three doors contamination walks through after decontamination'>
<rect x='0' y='0' width='960' height='460' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Three doors contamination walks through after decontamination</text>
<rect x='24' y='76' width='912' height='92' rx='10' fill='#141414' stroke='#e57373' stroke-width='2'/>
<text x='48' y='110' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#e57373' text-anchor='start'>Door 1: the generator</text>
<text x='48' y='136' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>A model that memorized a benchmark writes your synthetic QA. The n-gram filter sees fresh text</text>
<text x='48' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>and waves it through.</text>
<rect x='24' y='184' width='912' height='92' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/>
<text x='48' y='218' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#f0b429' text-anchor='start'>Door 2: the open web</text>
<text x='48' y='244' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>Benchmarks are discussed, solved, and explained online after the crawl. Recent web data absorbs</text>
<text x='48' y='266' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>all of it.</text>
<rect x='24' y='292' width='912' height='92' rx='10' fill='#141414' stroke='#b388eb' stroke-width='2'/>
<text x='48' y='326' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#b388eb' text-anchor='start'>Door 3: the QA pre-mix</text>
<text x='48' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>Instruction datasets are often built by repurposing benchmarks. The pairs leak straight into the</text>
<text x='48' y='374' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>mixture.</text>
<rect x='24' y='408' width='912' height='36' rx='8' fill='#0b0f0b' stroke='#1f3a24'/>
<text x='480' y='432' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#7fd08a' text-anchor='middle'>Defense: re-run decontamination on every data addition, against every eval you will report.</text>
</svg>
