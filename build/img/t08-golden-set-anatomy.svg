<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t08gs-title t08gs-desc">
<title id="t08gs-title">Anatomy of a golden dataset</title>
<desc id="t08gs-desc">One golden item sits in the center: a request, a human-verified reference answer, a dataset version, and labeler agreement. Four practices surround it: collect from production, label with humans, keep it hygienic, and size it for the signal.</desc>
<style>
  .t08gs text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .t08gs .h { font-size: 20px; font-weight: bold; text-anchor: middle; }
  .t08gs .ph { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .t08gs .d { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; }
  .t08gs .fld { font-size: 12px; fill: #a8a8a8; }
  .t08gs .val { font-size: 12.5px; }
</style>
<g class="t08gs">
<rect x="0" y="0" width="940" height="470" fill="#0d0d0d"/>
<text x="470" y="32" class="h">Anatomy of a golden dataset: one item, four practices</text>

<!-- center item card -->
<g>
<rect x="330" y="120" width="280" height="220" rx="10" fill="#141310" stroke="#f0b429" stroke-width="2.5"/>
<text x="470" y="150" class="ph" fill="#f0b429">ONE GOLDEN ITEM</text>
<text x="350" y="182" class="fld">request:</text>
<text x="350" y="202" class="val">"How do I get a refund</text>
<text x="350" y="220" class="val">for a duplicate charge?"</text>
<text x="350" y="250" class="fld">reference answer:</text>
<text x="350" y="270" class="val">human-written, verified</text>
<text x="350" y="300" class="fld">dataset version: v12</text>
<text x="350" y="322" class="fld">labeler agreement: 2 of 2</text>
</g>

<!-- four practices -->
<g>
<rect x="20" y="60" width="270" height="150" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="155" y="88" class="ph">1. Collect from production</text>
<text x="155" y="114" class="d">Sample real requests from traces.</text>
<text x="155" y="132" class="d">Stratify: top intents, long tail,</text>
<text x="155" y="150" class="d">failure modes, adversarial cases.</text>
<text x="155" y="172" class="d">Never from imagination.</text>
</g>
<g>
<rect x="650" y="60" width="270" height="150" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="785" y="88" class="ph">2. Label with humans</text>
<text x="785" y="114" class="d">A human writes or verifies</text>
<text x="785" y="132" class="d">every reference answer.</text>
<text x="785" y="154" class="d">Two labelers on a sample;</text>
<text x="785" y="172" class="d">agreement catches ambiguity.</text>
</g>
<g>
<rect x="20" y="250" width="270" height="160" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="155" y="278" class="ph">3. Keep it hygienic</text>
<text x="155" y="304" class="d">Never trains anything.</text>
<text x="155" y="322" class="d">Versioned: every score carries</text>
<text x="155" y="340" class="d">the dataset version.</text>
<text x="155" y="362" class="d">Refreshed monthly from</text>
<text x="155" y="380" class="d">new production failures.</text>
</g>
<g>
<rect x="650" y="250" width="270" height="160" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="785" y="278" class="ph">4. Size for the signal</text>
<text x="785" y="304" class="d">n = 200: fast iteration,</text>
<text x="785" y="322" class="d">detects big changes (about 5 pts).</text>
<text x="785" y="344" class="d">n = 800+: release decisions,</text>
<text x="785" y="362" class="d">detects small changes (about 2.5 pts).</text>
<text x="785" y="384" class="d">Small sets, big changes only.</text>
</g>

<!-- connectors -->
<g stroke="#a8a8a8" stroke-width="1.2" fill="none" stroke-dasharray="5,4">
<line x1="290" y1="120" x2="330" y2="160"/>
<line x1="650" y1="120" x2="610" y2="160"/>
<line x1="290" y1="330" x2="330" y2="310"/>
<line x1="650" y1="330" x2="610" y2="310"/>
</g>

<text x="470" y="440" class="d" style="font-style:italic">"Golden" means trusted: every item passed human review.</text>
</g>
</svg>
