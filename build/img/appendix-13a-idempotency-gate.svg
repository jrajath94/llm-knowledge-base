<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Flowchart of the idempotency gate: first delivery applies the effect and records the key; a redelivery is skipped.">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">The idempotency gate</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Apply the side effect, then record the key. Redeliveries hit the gate and stop.</text>
<rect x="90" y="110" width="240" height="90" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="210" y="146" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#ececec">First delivery</text>
<text x="210" y="172" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">key not seen</text>
<rect x="470" y="110" width="240" height="90" rx="10" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="590" y="146" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#ececec">Redelivery</text>
<text x="590" y="172" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">key already seen</text>
<line x1="210" y1="200" x2="210" y2="240" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="204,232 216,232 210,240" fill="#a8a8a8"/>
<line x1="590" y1="200" x2="590" y2="240" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="584,232 596,232 590,240" fill="#a8a8a8"/>
<rect x="90" y="240" width="240" height="110" rx="10" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="210" y="278" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#7fd08a">Apply side effect,</text>
<text x="210" y="304" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#7fd08a">then record the key</text>
<rect x="470" y="240" width="240" height="110" rx="10" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="590" y="282" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#e67e7e">Skip: no effect</text>
<text x="590" y="308" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">payload appears once</text>
<text x="400" y="410" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Recording before acknowledging upstream is what makes a crash safe.</text>
<text x="400" y="436" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">An unacknowledged message gets redelivered, and the redelivery hits the gate.</text>
<text x="400" y="480" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">The rule for ML systems: every training-data pipeline, every feature write, every billing event.</text>
</svg>