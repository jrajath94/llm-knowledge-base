<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-label="Skip or flag decision flow for unlabelable items">
<rect width="760" height="600" fill="#0d0d0d"/>
<text x="380" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Skip or flag: the unlabelable-item flow</text>
<text x="380" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">A flag for review costs less than a confident wrong label.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<!-- Diamond 1 -->
<polygon points="380,95 500,160 380,225 260,160" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="380" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0b429">Does the rubric</text>
<text x="380" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0b429">cover this case?</text>

<!-- no -> FLAG (left) -->
<text x="245" y="130" text-anchor="middle" font-size="11.5" fill="#a8a8a8">no</text>
<line x1="260" y1="160" x2="180" y2="160" stroke="#e08080" stroke-width="2"/>
<polygon points="180,160 188,154 188,166" fill="#e08080"/>
<rect x="60" y="120" width="120" height="80" rx="10" fill="#3a1f1f" stroke="#e08080" stroke-width="1.5"/>
<text x="120" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#e08080">FLAG</text>
<text x="120" y="170" text-anchor="middle" font-size="11" fill="#a8a8a8">for review</text>

<!-- yes -> down to diamond 2 -->
<text x="515" y="200" text-anchor="middle" font-size="11.5" fill="#a8a8a8">yes</text>
<line x1="500" y1="160" x2="560" y2="160" stroke="#555" stroke-width="2"/>
<line x1="560" y1="160" x2="560" y2="250" stroke="#555" stroke-width="2"/>
<polygon points="560,250 554,242 566,242" fill="#555"/>

<!-- Diamond 2 -->
<polygon points="560,250 680,315 560,380 440,315" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="560" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0b429">Do you have the</text>
<text x="560" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0b429">expertise?</text>

<!-- no -> SKIP (left) -->
<text x="425" y="290" text-anchor="middle" font-size="11.5" fill="#a8a8a8">no</text>
<line x1="440" y1="315" x2="370" y2="315" stroke="#e08080" stroke-width="2"/>
<polygon points="370,315 378,309 378,321" fill="#e08080"/>
<rect x="250" y="275" width="120" height="80" rx="10" fill="#3a1f1f" stroke="#e08080" stroke-width="1.5"/>
<text x="310" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#e08080">SKIP</text>
<text x="310" y="325" text-anchor="middle" font-size="11" fill="#a8a8a8">this item</text>

<!-- yes -> LABEL (right) -->
<text x="695" y="290" text-anchor="middle" font-size="11.5" fill="#a8a8a8">yes</text>
<line x1="680" y1="315" x2="730" y2="315" stroke="#555" stroke-width="2"/>
<polygon points="730,315 722,309 722,321" fill="#555"/>
</g>

<rect x="620" y="275" width="120" height="80" rx="10" fill="#1f3a24" stroke="#7fd08a" stroke-width="1.5"/>
<text x="680" y="305" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#7fd08a">LABEL</text>
<text x="680" y="325" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a8a8">it</text>

<rect x="30" y="420" width="700" height="80" rx="10" fill="#141414" stroke="#6cb2ff" stroke-width="1"/>
<text x="380" y="450" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Flagged items feed the adjudication queue in section 1.3. Skipped items return to the pool</text>
<text x="380" y="472" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">for a labeler with the right expertise. Neither becomes a confident wrong label.</text>

<text x="380" y="530" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">Every unlabeled edge case becomes a coin flip, and coin flips become noise your reward model then learns.</text>
<text x="380" y="562" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">The edge-case playbook exists so the common cases never reach this flow at all.</text>
</svg>
