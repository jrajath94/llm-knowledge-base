<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Flowchart of gold item seeding: 5 percent of items are gold, accuracy below 80 percent triggers pause and retraining.">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Gold items keep labelers honest</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Seed ~5% gold items into every batch. Below the 80% bar: pause and retrain.</text>
<rect x="250" y="110" width="300" height="90" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="400" y="146" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#ececec">Production batch</text>
<text x="400" y="172" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">~5% are gold items (answers known)</text>
<line x1="400" y1="200" x2="400" y2="230" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="394,222 406,222 400,230" fill="#a8a8a8"/>
<rect x="250" y="230" width="300" height="90" rx="10" fill="#161616" stroke="#e6a75a" stroke-width="2"/>
<text x="400" y="266" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#ececec">Measure gold accuracy</text>
<text x="400" y="292" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">invisibly, on every batch</text>
<line x1="400" y1="320" x2="400" y2="350" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="394,342 406,342 400,350" fill="#a8a8a8"/>
<rect x="140" y="350" width="220" height="90" rx="10" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="250" y="386" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#7fd08a">At or above 80%</text>
<text x="250" y="412" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">keep labeling</text>
<rect x="440" y="350" width="220" height="90" rx="10" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="550" y="386" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#e67e7e">Below 80%</text>
<text x="550" y="412" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">pause, then retrain</text>
<line x1="400" y1="320" x2="250" y2="350" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="400" y1="320" x2="550" y2="350" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="400" y="490" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">This is how you catch guideline drift: the slow reinterpretation of the rubric over weeks.</text>
</svg>