<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Bar chart of pass at 1, pass at 5, and pass squared for an agent with 3 successes in 10 tries">
<rect width="800" height="500" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Same agent, three numbers, three stories</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Agent attempts a task n = 10 times and succeeds c = 3 times. Each metric answers a different question.</text>

<!-- Axes -->
<line x1="90" y1="120" x2="90" y2="400" stroke="#555" stroke-width="1.5"/>
<line x1="90" y1="400" x2="740" y2="400" stroke="#555" stroke-width="1.5"/>
<text x="60" y="405" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">0</text>
<text x="60" y="335" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">0.25</text>
<text x="60" y="265" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">0.50</text>
<text x="60" y="195" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">0.75</text>
<text x="60" y="128" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">1.00</text>
<line x1="84" y1="330" x2="90" y2="330" stroke="#555" stroke-width="1"/>
<line x1="84" y1="260" x2="90" y2="260" stroke="#555" stroke-width="1"/>
<line x1="84" y1="190" x2="90" y2="190" stroke="#555" stroke-width="1"/>
<line x1="84" y1="122" x2="90" y2="122" stroke="#555" stroke-width="1"/>

<!-- Bar 1: pass@1 = 0.30 -> height 0.30*278 = 83 -->
<rect x="150" y="317" width="110" height="83" fill="#6cb2ff" rx="4"/>
<text x="205" y="312" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#6cb2ff">0.30</text>
<text x="205" y="422" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#ececec">pass@1</text>
<text x="205" y="442" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">Typical run: 30%.</text>
<text x="205" y="460" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">c / n</text>

<!-- Bar 2: pass@5 = 0.9167 -> height 255 -->
<rect x="345" y="145" width="110" height="255" fill="#f0b429" rx="4"/>
<text x="400" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#f0b429">0.92</text>
<text x="400" y="422" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#ececec">pass@5</text>
<text x="400" y="442" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">92% ceiling with 5 tries.</text>
<text x="400" y="460" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">1 - C(7,5)/C(10,5)</text>

<!-- Bar 3: pass^2 = 0.0667 -> height 19 -->
<rect x="540" y="381" width="110" height="19" fill="#e08080" rx="4"/>
<text x="595" y="376" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#e08080">0.067</text>
<text x="595" y="422" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#ececec">pass^2</text>
<text x="595" y="442" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">Under 7%: two clean</text>
<text x="595" y="460" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">runs in a row. C(3,2)/C(10,2)</text>

<text x="400" y="488" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">High ceiling with terrible consistency: the naive "any of 5 passed" reading hides a 30% typical run.</text>
</svg>
