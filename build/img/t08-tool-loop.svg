<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t08tl-title t08tl-desc">
<title id="t08tl-title">The tool-calling loop as a state machine</title>
<desc id="t08tl-desc">Five states in a loop. Plan: the model picks the next tool. Call: your code runs it. Observe: the result returns as text. Check: is the task done? If yes, answer. If no and steps remain, plan again. A step counter stops infinite loops at 10 steps.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="460" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">TOOL-CALLING LOOP (THE AGENT HEARTBEAT)</text>
<rect x="60" y="90" width="170" height="80" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="145.0" y="124" class="box" fill="#ececec">plan</text>
<text x="145.0" y="146" class="d">model picks a tool</text>
<rect x="330" y="90" width="170" height="80" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="415.0" y="124" class="box" fill="#ececec">call</text>
<text x="415.0" y="146" class="d">your code runs it</text>
<rect x="600" y="90" width="170" height="80" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="685.0" y="124" class="box" fill="#ececec">observe</text>
<text x="685.0" y="146" class="d">result becomes text</text>
<line x1="230" y1="130" x2="330" y2="130" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t08tl-ah)"/>
<line x1="500" y1="130" x2="600" y2="130" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t08tl-ah)"/>
<rect x="330" y="250" width="170" height="80" rx="10" fill="#111111" stroke="#c79bff" stroke-width="1.5"/>
<text x="415.0" y="284" class="box" fill="#ececec">done?</text>
<text x="415.0" y="306" class="d">task complete?</text>
<line x1="685" y1="170" x2="685" y2="250" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t08tl-ah)"/>
<line x1="415" y1="290" x2="145" y2="290" stroke="#a8a8a8" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#t08tl-ah)"/>
<text x="230" y="282" class="dl" fill="#a8a8a8">no, plan again</text>
<rect x="600" y="250" width="170" height="80" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="685.0" y="284" class="box" fill="#ececec">answer</text>
<text x="685.0" y="306" class="d">final reply</text>
<line x1="500" y1="290" x2="600" y2="290" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t08tl-ah)"/>
<text x="550.0" y="284.0" class="d">yes</text>
<rect x="60" y="360" width="850" height="60" rx="8" fill="#161616" stroke="#262626" stroke-width="1.5"/>
<text x="80" y="385" class="dl" fill="#ff7a7a">Guard: a step counter stops the loop at 10 steps.</text>
<text x="80" y="407" class="dl" fill="#a8a8a8">Without it, one confused model can call tools forever and burn your budget.</text>
</g>
<defs><marker id="t08tl-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>