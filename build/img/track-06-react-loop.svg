<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' width='100%' role='img'>
<title>The ReAct loop</title>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a8a8'/></marker></defs>
<text x='380' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The ReAct loop</text>
<text x='380' y='64' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#a8a8a8' text-anchor='middle'>One model, one loop, one budget. Thought, action, observation, repeat.</text>
<rect x='275.0' y='105.0' width='210' height='110' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='380.0' y='135.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Thought</text>
<text x='380.0' y='157.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>The model reasons</text>
<text x='380.0' y='176.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>about the next step</text>
<rect x='404.9038105676658' y='330.0' width='210' height='110' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='509.9038105676658' y='360.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Action</text>
<text x='509.9038105676658' y='382.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>The model calls</text>
<text x='509.9038105676658' y='401.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>one tool</text>
<rect x='145.09618943233423' y='330.00000000000006' width='210' height='110' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='250.09618943233423' y='360.00000000000006' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Observation</text>
<text x='250.09618943233423' y='382.00000000000006' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>The tool returns</text>
<text x='250.09618943233423' y='401.00000000000006' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>a result</text>
<line x1='503.17945403390866' y1='137.45776718754283' x2='591.0156838582312' y2='289.5945799885661' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<line x1='467.8362298243225' y1='502.9476528238911' x2='292.16377017567754' y2='502.9476528238911' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<line x1='168.9843161417688' y1='289.5945799885662' x2='256.8205459660913' y2='137.45776718754283' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<text x='380' y='530' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>The loop stops when the task is done or the step budget runs out.</text>
</svg>