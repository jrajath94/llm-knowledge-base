<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t08rl-title t08rl-desc">
<title id="t08rl-title">The retrieval loop: build time and query time</title>
<desc id="t08rl-desc">Two lanes. Build time: documents are chunked, embedded into vectors, and stored in an index. Query time: the question is embedded the same way, the index returns the nearest vectors, the top chunks are packed into the prompt, and the model generates the answer.</desc>
<style>
  .t08rl text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .t08rl .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .t08rl .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .t08rl .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .t08rl .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
</style>
<g class="t08rl">
<rect x="0" y="0" width="940" height="460" fill="#0d0d0d"/>

<!-- BUILD TIME -->
<text x="30" y="40" class="lane">BUILD TIME (once)</text>
<g>
<rect x="30" y="60" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="105" y="95" class="box">Documents</text>
<text x="105" y="118" class="d">your 10,000 tokens</text>
<text x="105" y="136" class="d">of product docs</text>
</g>
<g>
<rect x="215" y="60" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="290" y="95" class="box">Chunk</text>
<text x="290" y="118" class="d">cut into pieces</text>
<text x="290" y="136" class="d">the index can search</text>
</g>
<g>
<rect x="400" y="60" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="475" y="95" class="box">Embed</text>
<text x="475" y="118" class="d">each chunk becomes</text>
<text x="475" y="136" class="d">a meaning-vector</text>
</g>
<g>
<rect x="585" y="60" width="150" height="90" rx="10" fill="#111111" stroke="#f0b429" stroke-width="2"/>
<text x="660" y="95" class="box" fill="#f0b429">Index</text>
<text x="660" y="118" class="d">the searchable store</text>
<text x="660" y="136" class="d">of chunk vectors</text>
</g>
<g stroke="#a8a8a8" stroke-width="1.5" fill="none">
<line x1="180" y1="105" x2="213" y2="105"/><polygon points="213,105 205,100 205,110" fill="#a8a8a8" stroke="none"/>
<line x1="365" y1="105" x2="398" y2="105"/><polygon points="398,105 390,100 390,110" fill="#a8a8a8" stroke="none"/>
<line x1="550" y1="105" x2="583" y2="105"/><polygon points="583,105 575,100 575,110" fill="#a8a8a8" stroke="none"/>
</g>

<!-- QUERY TIME -->
<text x="30" y="210" class="lane">QUERY TIME (every request)</text>
<g>
<rect x="30" y="230" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="105" y="265" class="box">Question</text>
<text x="105" y="288" class="d">the user's request</text>
</g>
<g>
<rect x="215" y="230" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="290" y="265" class="box">Embed</text>
<text x="290" y="288" class="d">same embedder,</text>
<text x="290" y="306" class="d">same vector space</text>
</g>
<g>
<rect x="400" y="230" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="475" y="265" class="box">Search index</text>
<text x="475" y="288" class="d">nearest neighbors:</text>
<text x="475" y="306" class="d">similarity search</text>
</g>
<g>
<rect x="585" y="230" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="660" y="265" class="box">Pack prompt</text>
<text x="660" y="288" class="d">top chunks + question</text>
<text x="660" y="306" class="d">into the context</text>
</g>
<g>
<rect x="770" y="230" width="150" height="90" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="845" y="265" class="box">Generate</text>
<text x="845" y="288" class="d">the model reads,</text>
<text x="845" y="306" class="d">then answers</text>
</g>
<g stroke="#a8a8a8" stroke-width="1.5" fill="none">
<line x1="180" y1="275" x2="213" y2="275"/><polygon points="213,275 205,270 205,280" fill="#a8a8a8" stroke="none"/>
<line x1="365" y1="275" x2="398" y2="275"/><polygon points="398,275 390,270 390,280" fill="#a8a8a8" stroke="none"/>
<line x1="550" y1="275" x2="583" y2="275"/><polygon points="583,275 575,270 575,280" fill="#a8a8a8" stroke="none"/>
<line x1="735" y1="275" x2="768" y2="275"/><polygon points="768,275 760,270 760,280" fill="#a8a8a8" stroke="none"/>
</g>

<!-- connector: index serves queries -->
<path d="M 660 150 C 660 200, 475 200, 475 228" stroke="#f0b429" stroke-width="1.5" fill="none" stroke-dasharray="6,4"/>
<polygon points="475,228 469,218 481,219" fill="#f0b429"/>

<text x="470" y="380" class="cap">Build time prepares the index. Query time asks it one question: which stored vectors are closest to this one?</text>
<text x="470" y="404" class="cap">Retrieve, pack, generate. Every number in this chapter improves one of those three steps.</text>
</g>
</svg>
