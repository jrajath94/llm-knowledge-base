<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="500" fill="#0d0d0d"/>
<text x="450" y="34" text-anchor="middle" fill="#ececec" font-size="20" font-weight="600">What a rollout worker carries in GPU memory</text>
<text x="450" y="58" text-anchor="middle" fill="#a8a8a8" font-size="13">worked 7B example: weights + KV cache + overhead</text>

<!-- ROLLOUT WORKER -->
<text x="225" y="96" text-anchor="middle" fill="#6cb2ff" font-size="15" font-weight="600">rollout worker: 33 GB</text>
<g font-size="12">
<rect x="60" y="115" width="330" height="70" rx="6" fill="#6cb2ff" opacity="0.75"/>
<text x="225" y="142" text-anchor="middle" fill="#0d0d0d" font-weight="600">weights: 14 GB</text>
<text x="225" y="162" text-anchor="middle" fill="#0d0d0d">7B params x 2 bytes</text>

<rect x="60" y="190" width="330" height="110" rx="6" fill="#f0b429" opacity="0.75"/>
<text x="225" y="217" text-anchor="middle" fill="#0d0d0d" font-weight="600">KV cache: ~17 GB (52%)</text>
<text x="225" y="237" text-anchor="middle" fill="#0d0d0d">2 x layers x KV heads x head dim</text>
<text x="225" y="257" text-anchor="middle" fill="#0d0d0d">x bytes x batch x seq len</text>
<text x="225" y="282" text-anchor="middle" fill="#0d0d0d" font-size="11">the moving part: grows with batch x length</text>

<rect x="60" y="305" width="330" height="50" rx="6" fill="#3a3a3a"/>
<text x="225" y="334" text-anchor="middle" fill="#ececec">overhead: ~2 GB</text>
</g>
<text x="225" y="384" text-anchor="middle" fill="#7fd08a" font-size="12">no gradients, no optimizer states:</text>
<text x="225" y="404" text-anchor="middle" fill="#7fd08a" font-size="12">the worker never trains</text>

<line x1="460" y1="90" x2="460" y2="420" stroke="#3a3a3a"/>

<!-- TRAINER -->
<text x="680" y="96" text-anchor="middle" fill="#e08080" font-size="15" font-weight="600">trainer: ~6x weight memory</text>
<g font-size="12">
<rect x="515" y="115" width="330" height="60" rx="6" fill="#6cb2ff" opacity="0.75"/>
<text x="680" y="140" text-anchor="middle" fill="#0d0d0d" font-weight="600">weights: 14 GB</text>

<rect x="515" y="180" width="330" height="60" rx="6" fill="#e08080" opacity="0.75"/>
<text x="680" y="205" text-anchor="middle" fill="#0d0d0d" font-weight="600">gradients: 14 GB</text>

<rect x="515" y="245" width="330" height="80" rx="6" fill="#e08080" opacity="0.55"/>
<text x="680" y="270" text-anchor="middle" fill="#0d0d0d" font-weight="600">optimizer states: ~56 GB</text>
<text x="680" y="290" text-anchor="middle" fill="#0d0d0d">Adam in fp32: 8 bytes per param</text>

<rect x="515" y="330" width="330" height="50" rx="6" fill="#f0b429" opacity="0.75"/>
<text x="680" y="358" text-anchor="middle" fill="#0d0d0d" font-weight="600">activations</text>
</g>
<text x="680" y="410" text-anchor="middle" fill="#a8a8a8" font-size="12">memory-heavy, scales with model size</text>

<text x="450" y="452" text-anchor="middle" fill="#ececec" font-size="13">the asymmetry is why disaggregation wins: memory-light rollout pool, memory-heavy trainer pool</text>
<text x="450" y="476" text-anchor="middle" fill="#a8a8a8" font-size="13">the model fixes the weights; your batch geometry sets the KV cache</text>
</svg>
