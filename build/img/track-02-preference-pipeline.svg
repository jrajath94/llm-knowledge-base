<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" role="img" aria-label="Preference data pipeline with quality gates and quarantine">
<rect width="780" height="380" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
<marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/></marker>
</defs>
<text x="24" y="34" class="t">Preference data pipeline: gates catch bad pairs before training</text><rect x="30" y="70" width="110" height="90" rx="8" class="box"/><text x="85" y="106" text-anchor="middle" class="s">Sample</text><text x="85" y="126" text-anchor="middle" class="s">prompts</text><rect x="170" y="70" width="110" height="90" rx="8" class="box"/><text x="225" y="106" text-anchor="middle" class="s">Generate</text><text x="225" y="126" text-anchor="middle" class="s">pairs</text><rect x="310" y="70" width="110" height="90" rx="8" class="box"/><text x="365" y="106" text-anchor="middle" class="s">Labelers</text><text x="365" y="126" text-anchor="middle" class="s">rank</text><rect x="450" y="70" width="110" height="90" rx="8" class="box"/><text x="505" y="106" text-anchor="middle" class="s">Agreement</text><text x="505" y="126" text-anchor="middle" class="s">gate</text><rect x="650" y="70" width="110" height="90" rx="8" class="box"/><text x="705" y="106" text-anchor="middle" class="s">Training</text><text x="705" y="126" text-anchor="middle" class="s">set</text><path d="M 140 115 L 170 115" class="arr"/><path d="M 280 115 L 310 115" class="arr"/><path d="M 420 115 L 450 115" class="arr"/><path d="M 560 115 L 590 115" class="arr"/><rect x="450" y="230" width="110" height="90" rx="8" class="box" stroke="#e5484d"/><text x="505" y="266" text-anchor="middle" class="s" fill="#e5484d">Quarantine</text><text x="505" y="288" text-anchor="middle" class="ss">failed pairs wait</text><path d="M 505 160 L 505 230" class="arr2"/><text x="515" y="200" class="ss">fails gate</text><text x="30" y="345" class="s">Quarantined pairs are never silently dropped.</text><text x="30" y="367" class="s">They become triage material for rubric fixes.</text></svg>