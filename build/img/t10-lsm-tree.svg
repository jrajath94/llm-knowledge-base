<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" role="img" aria-labelledby="t10lsm-title t10lsm-desc">
<title id="t10lsm-title">LSM tree: writes are fast, reads merge levels</title>
<desc id="t10lsm-desc">Writes land in the memtable in RAM. When full, the memtable flushes to disk as an SSTable at level 0. Compaction merges levels down: L0 to L1 to L2 to L3, each level 10x bigger. Reads check the memtable, then each level, newest first.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="700" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">LSM TREE (WRITE-OPTIMIZED STORAGE)</text>
<rect x="370" y="70" width="200" height="80" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="470.0" y="104" class="box" fill="#ececec">memtable</text>
<text x="470.0" y="126" class="d">in RAM</text>
<text x="470.0" y="144" class="d">writes land here</text>
<rect x="370" y="200" width="200" height="64" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="470.0" y="234" class="box" fill="#ececec">L0: 4 SSTables</text>
<rect x="370" y="300" width="200" height="64" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="470.0" y="334" class="box" fill="#ececec">L1: 40 SSTables</text>
<rect x="370" y="400" width="200" height="64" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="470.0" y="434" class="box" fill="#ececec">L2: 400 SSTables</text>
<rect x="370" y="500" width="200" height="64" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="470.0" y="534" class="box" fill="#ececec">L3: 4000 SSTables</text>
<line x1="470" y1="150" x2="470" y2="200" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10lsm-ah)"/>
<text x="486" y="178" class="dl" fill="#a8a8a8">flush</text>
<line x1="470" y1="264" x2="470" y2="300" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10lsm-ah)"/>
<text x="486" y="286.0" class="dl" fill="#a8a8a8">compact</text>
<line x1="470" y1="364" x2="470" y2="400" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10lsm-ah)"/>
<text x="486" y="386.0" class="dl" fill="#a8a8a8">compact</text>
<line x1="470" y1="464" x2="470" y2="500" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10lsm-ah)"/>
<text x="486" y="486.0" class="dl" fill="#a8a8a8">compact</text>
<text x="30" y="300" class="dl" fill="#f0b429">read path:</text>
<text x="30" y="322" class="dl" fill="#a8a8a8">memtable, then</text>
<text x="30" y="344" class="dl" fill="#a8a8a8">L0, L1, L2, L3,</text>
<text x="30" y="366" class="dl" fill="#a8a8a8">newest first</text>
<text x="620" y="300" class="dl" fill="#a8a8a8">each level</text>
<text x="620" y="322" class="dl" fill="#a8a8a8">about 10x</text>
<text x="620" y="344" class="dl" fill="#a8a8a8">bigger</text>
<text x="30" y="620" class="capl">How to read: top to bottom = new to old. Each level is about 10x bigger.</text>
<text x="30" y="644" class="dl" fill="#ff7a7a">What breaks: write amplification. One write is rewritten at every compaction.</text>
</g>
<defs><marker id="t10lsm-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>