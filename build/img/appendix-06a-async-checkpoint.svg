<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img' aria-label='Async checkpointing: stage fast, write in the background'>
<rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Async checkpointing: stage fast, write in the background</text>
<text x='24' y='100' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start'>training</text>
<rect x='180' y='78' width='660' height='40' rx='7' fill='#2e9e5b' opacity='0.85'/>
<text x='510' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#0d0d0d' text-anchor='middle'>training continues at full speed</text>
<text x='24' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start'>stage</text>
<rect x='180' y='158' width='90' height='40' rx='7' fill='#f0b429' opacity='0.9'/>
<text x='225' y='184' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#0d0d0d' text-anchor='middle'>fast copy</text>
<text x='24' y='260' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start'>write</text>
<rect x='270' y='238' width='570' height='40' rx='7' fill='#6cb2ff' opacity='0.85'/>
<text x='555' y='264' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#0d0d0d' text-anchor='middle'>background thread writes staged copy to storage</text>
<text x='24' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>The GPU sits idle only during the short staging pause, not the full disk write.</text>
<text x='24' y='356' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>One in-flight write at a time, or the staging buffer gets clobbered.</text>
</svg>
