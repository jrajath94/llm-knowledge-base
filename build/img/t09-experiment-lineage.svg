<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t09el-title t09el-desc">
<title id="t09el-title">Experiment lineage: everything a run needs to repeat it</title>
<desc id="t09el-desc">Four inputs point into a run box: code version, data snapshot, hyperparameters, and environment. The run emits metrics, a model artifact, and logs. An arrow carries the artifact to the registry. Missing any input means the run cannot be repeated.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">EXPERIMENT LINEAGE (REPEAT ANY RUN)</text>
<rect x="30" y="80" width="190" height="70" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="125.0" y="114" class="box" fill="#ececec">code v1.2.3</text>
<line x1="125" y1="150" x2="470" y2="210" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<rect x="250" y="80" width="190" height="70" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="345.0" y="114" class="box" fill="#ececec">data snapshot</text>
<line x1="345" y1="150" x2="470" y2="210" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<rect x="470" y="80" width="190" height="70" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="565.0" y="114" class="box" fill="#ececec">hyperparams</text>
<line x1="565" y1="150" x2="470" y2="210" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<rect x="690" y="80" width="190" height="70" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="785.0" y="114" class="box" fill="#ececec">environment</text>
<line x1="785" y1="150" x2="470" y2="210" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<rect x="350" y="210" width="240" height="90" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="470.0" y="244" class="box" fill="#ececec">run #4821</text>
<text x="470.0" y="266" class="d">train + evaluate</text>
<rect x="120" y="340" width="200" height="70" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="220.0" y="374" class="box" fill="#ececec">metrics</text>
<text x="220.0" y="396" class="d">acc 0.91, auc 0.94</text>
<rect x="370" y="340" width="200" height="70" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="470.0" y="374" class="box" fill="#ececec">artifact</text>
<text x="470.0" y="396" class="d">model.pkl 2.1 GB</text>
<rect x="620" y="340" width="200" height="70" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="720.0" y="374" class="box" fill="#ececec">logs</text>
<text x="720.0" y="396" class="d">stdout, traces</text>
<line x1="470" y1="300" x2="220" y2="340" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<line x1="470" y1="300" x2="470" y2="340" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<line x1="470" y1="300" x2="720" y2="340" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09el-ah)"/>
<text x="30" y="300" class="dl" fill="#a8a8a8">outputs</text>
</g>
<defs><marker id="t09el-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>