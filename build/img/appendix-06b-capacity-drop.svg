<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="520" fill="#0d0d0d"/>
<text x="450" y="34" text-anchor="middle" fill="#ececec" font-size="20" font-weight="600">Capacity factor: why tokens get dropped</text>
<text x="450" y="58" text-anchor="middle" fill="#a8a8a8" font-size="13">each expert holds a fixed buffer; overflow is dropped in training</text>

<g font-size="11">
<!-- Expert 0: normal -->
<rect x="40" y="100" width="95" height="300" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="87" y="122" text-anchor="middle" fill="#ececec">expert 0</text>
<rect x="50" y="132" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="50" y="152" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="50" y="172" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="50" y="192" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="50" y="212" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="50" y="232" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<text x="87" y="272" text-anchor="middle" fill="#a8a8a8">4 of 6 slots</text>
<text x="87" y="290" text-anchor="middle" fill="#a8a8a8">no drops</text>

<!-- Expert 1: hot, overflow -->
<rect x="165" y="100" width="95" height="300" rx="6" fill="#1a1a1a" stroke="#e08080" stroke-width="2"/>
<text x="212" y="122" text-anchor="middle" fill="#e08080" font-weight="600">expert 1: hot</text>
<rect x="175" y="132" width="75" height="18" rx="3" fill="#e08080" opacity="0.8"/>
<rect x="175" y="152" width="75" height="18" rx="3" fill="#e08080" opacity="0.8"/>
<rect x="175" y="172" width="75" height="18" rx="3" fill="#e08080" opacity="0.8"/>
<rect x="175" y="192" width="75" height="18" rx="3" fill="#e08080" opacity="0.8"/>
<rect x="175" y="212" width="75" height="18" rx="3" fill="#e08080" opacity="0.8"/>
<rect x="175" y="232" width="75" height="18" rx="3" fill="#e08080" opacity="0.8"/>
<text x="212" y="272" text-anchor="middle" fill="#e08080">buffer full</text>
<text x="212" y="290" text-anchor="middle" fill="#e08080">10 tokens want in</text>
<!-- dropped tokens -->
<g fill="#e08080">
<circle cx="185" cy="320" r="6"/><text x="185" y="324" text-anchor="middle" font-size="9" fill="#0d0d0d">x</text>
<circle cx="205" cy="320" r="6"/><text x="205" y="324" text-anchor="middle" font-size="9" fill="#0d0d0d">x</text>
<circle cx="225" cy="320" r="6"/><text x="225" y="324" text-anchor="middle" font-size="9" fill="#0d0d0d">x</text>
<circle cx="245" cy="320" r="6"/><text x="245" y="324" text-anchor="middle" font-size="9" fill="#0d0d0d">x</text>
</g>
<text x="212" y="348" text-anchor="middle" fill="#e08080">4 dropped</text>

<!-- Expert 2: normal -->
<rect x="290" y="100" width="95" height="300" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="337" y="122" text-anchor="middle" fill="#ececec">expert 2</text>
<rect x="300" y="132" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="300" y="152" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="300" y="172" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="300" y="192" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="300" y="212" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="300" y="232" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<text x="337" y="272" text-anchor="middle" fill="#a8a8a8">3 of 6 slots</text>
<text x="337" y="290" text-anchor="middle" fill="#a8a8a8">no drops</text>

<!-- Expert 3: idle -->
<rect x="415" y="100" width="95" height="300" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="462" y="122" text-anchor="middle" fill="#ececec">expert 3</text>
<rect x="425" y="132" width="75" height="18" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="425" y="152" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="425" y="172" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="425" y="192" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="425" y="212" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<rect x="425" y="232" width="75" height="18" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<text x="462" y="272" text-anchor="middle" fill="#a8a8a8">1 of 6 slots</text>
<text x="462" y="290" text-anchor="middle" fill="#a8a8a8">wasted GPU</text>
</g>

<!-- right panel: the fix -->
<rect x="560" y="100" width="300" height="300" rx="6" fill="#141414" stroke="#3a3a3a"/>
<text x="710" y="126" text-anchor="middle" fill="#ececec" font-size="14" font-weight="600">the fix: balance the router</text>
<text x="580" y="160" fill="#f0b429" font-size="13">1. auxiliary loss</text>
<text x="580" y="182" fill="#a8a8a8" font-size="12">penalize uneven token counts</text>
<text x="580" y="204" fill="#a8a8a8" font-size="12">during training</text>
<text x="580" y="238" fill="#f0b429" font-size="13">2. bias nudge</text>
<text x="580" y="260" fill="#a8a8a8" font-size="12">add a per-expert bias, raise it</text>
<text x="580" y="282" fill="#a8a8a8" font-size="12">when an expert starves</text>
<text x="580" y="316" fill="#f0b429" font-size="13">3. drop the excess</text>
<text x="580" y="338" fill="#a8a8a8" font-size="12">fixed buffers keep memory</text>
<text x="580" y="360" fill="#a8a8a8" font-size="12">predictable in training</text>

<text x="450" y="440" text-anchor="middle" fill="#ececec" font-size="13">the step waits for the slowest expert, so one hot expert sets the pace for all</text>
<text x="450" y="464" text-anchor="middle" fill="#a8a8a8" font-size="13">in serving there is no dropping: the same skew becomes tail latency instead</text>
</svg>
