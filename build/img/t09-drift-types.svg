<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="t09dt-title t09dt-desc">
<title id="t09dt-title">Three kinds of drift</title>
<desc id="t09dt-desc">Three panels. Data drift: the input histogram shifts right, the decision boundary stays. Concept drift: the inputs stay, the boundary moves. Label drift: the share of positive labels drops from 30 to 10 percent. Each panel names the detector: PSI/KS test, accuracy drop, label rate monitor.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="460" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">THREE KINDS OF DRIFT</text>
<rect x="30" y="70" width="270" height="300" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="165" y="105" class="box" fill="#6ab0ff">data drift</text>
<text x="165" y="130" class="d">inputs move</text>
<rect x="70" y="290" width="80" height="40" rx="4" fill="#555555"/>
<rect x="170" y="272" width="80" height="58" rx="4" fill="#6ab0ff"/>
<text x="165" y="360" class="capl" fill="#a8a8a8">detector: PSI / KS test</text>
<rect x="330" y="70" width="270" height="300" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="465" y="105" class="box" fill="#f0b429">concept drift</text>
<text x="465" y="130" class="d">rules change</text>
<rect x="370" y="290" width="80" height="40" rx="4" fill="#555555"/>
<rect x="470" y="272" width="80" height="58" rx="4" fill="#f0b429"/>
<text x="465" y="360" class="capl" fill="#a8a8a8">detector: accuracy drop</text>
<rect x="630" y="70" width="270" height="300" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="765" y="105" class="box" fill="#7fd67f">label drift</text>
<text x="765" y="130" class="d">labels shift</text>
<rect x="670" y="290" width="80" height="40" rx="4" fill="#555555"/>
<rect x="770" y="272" width="80" height="58" rx="4" fill="#7fd67f"/>
<text x="765" y="360" class="capl" fill="#a8a8a8">detector: label rate</text>
<text x="30" y="420" class="capl">How to read: gray bars = training time. Colored bars = now. A moved bar is drift.</text>
</g>
<defs><marker id="t09dt-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>