<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="sans-serif">
<rect width="700" height="400" fill="#ffffff"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">Triton Kernel: Fused Softmax</text>
<rect x="50" y="100" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="125.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Load</text>
<text x="125.0" y="148" text-anchor="middle" font-size="11" fill="#555">From HBM</text>
<rect x="250" y="100" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="325.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Compute</text>
<text x="325.0" y="148" text-anchor="middle" font-size="11" fill="#555">In SRAM</text>
<rect x="450" y="100" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="525.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Store</text>
<text x="525.0" y="148" text-anchor="middle" font-size="11" fill="#555">To HBM</text>
<line x1="200" y1="135" x2="250" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="400" y1="135" x2="450" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="350" y="220" text-anchor="middle" font-size="12" fill="#555">Fuse: keep data in SRAM. Avoid HBM round-trips.</text>
</svg>
