<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='100%' role='img' aria-label='The hierarchy rule: put collectives on the fabric they can afford'>
<rect x='0' y='0' width='960' height='430' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>The hierarchy rule: put collectives on the fabric they can afford</text>
<rect x='24' y='76' width='440' height='220' rx='10' fill='#141414' stroke='#6cb2ff' stroke-width='2'/>
<text x='244' y='114' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#6cb2ff' text-anchor='middle'>Scale-up: NVLink</text>
<text x='244' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>inside the node</text>
<text x='244' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>tensor-parallel all-reduce</text>
<text x='244' y='208' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>expert-parallel all-to-all</text>
<text x='244' y='244' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>latency-critical, high-volume</text>
<rect x='496' y='76' width='440' height='220' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/>
<text x='716' y='114' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#f0b429' text-anchor='middle'>Scale-out: InfiniBand</text>
<text x='716' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>between nodes</text>
<text x='716' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>data-parallel gradient reduction</text>
<text x='716' y='208' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>pipeline point-to-point</text>
<text x='716' y='244' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>checkpoint writes to storage</text>
<text x='716' y='270' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>bandwidth-tolerant, lower-volume</text>
<text x='24' y='350' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>The 18x cliff is why tensor parallelism stays inside the node and data parallelism spans nodes.</text>
<text x='24' y='376' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>The collectives with the most bytes per second get the fast fabric.</text>
</svg>
