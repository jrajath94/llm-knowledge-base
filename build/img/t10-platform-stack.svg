<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 520' width='100%' role='img'>
<title>Platform stack</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>What this engineer builds: the AI platform stack</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>One kind improves the model. This track is for the kind that makes the model usable at scale.</text>
<rect x='140' y='110' width='680' height='62' rx='8' fill='#1565c0' fill-opacity='0.16' stroke='#1565c0' stroke-width='2'/>
<text x='170' y='136' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>Model-serving platforms</text>
<text x='170' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>HTTP/gRPC service: batching, caching, routing, autoscaling</text>
<rect x='140' y='182' width='680' height='62' rx='8' fill='#f0b429' fill-opacity='0.16' stroke='#f0b429' stroke-width='2'/>
<text x='170' y='208' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>Batch inference pipelines</text>
<text x='170' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>nightly jobs that run the model over stored data</text>
<rect x='140' y='254' width='680' height='62' rx='8' fill='#2e9e5b' fill-opacity='0.16' stroke='#2e9e5b' stroke-width='2'/>
<text x='170' y='280' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>Data + feature pipelines</text>
<text x='170' y='302' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>the paths the model eats from: freshness, schemas, joins</text>
<rect x='140' y='326' width='680' height='62' rx='8' fill='#8e24aa' fill-opacity='0.16' stroke='#8e24aa' stroke-width='2'/>
<text x='170' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>Evaluation + monitoring</text>
<text x='170' y='374' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>regression suites, drift alarms, quality dashboards</text>
<rect x='140' y='398' width='680' height='62' rx='8' fill='#c0392b' fill-opacity='0.16' stroke='#c0392b' stroke-width='2'/>
<text x='170' y='424' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>Cost + capacity controls</text>
<text x='170' y='446' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>GPU budgets, quotas, queueing: the scarcest resource first</text>
<text x='480' y='492' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: each layer is a system with an SLO. The model is the guest; the platform is the host.</text>
</svg>