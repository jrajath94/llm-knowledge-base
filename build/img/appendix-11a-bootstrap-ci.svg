<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" role="img" aria-label="Bootstrap confidence interval flow: 60 per-item differences, resample 10000 times, 95 percent interval 0.08 to 0.58">
<rect width="820" height="540" fill="#0d0d0d"/>
<text x="410" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Bootstrap CI: from 60 differences to one interval</text>
<text x="410" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Two system prompts, 60 questions, judge scores 1 to 5. Mean gap: 0.33. Is it real?</text>

<g font-family="system-ui,-apple-system,sans-serif">
<rect x="30" y="95" width="180" height="110" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="120" y="125" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6cb2ff">1. Differences</text>
<text x="120" y="149" text-anchor="middle" font-size="11.5" fill="#ececec">per item: d = B - A</text>
<text x="120" y="169" text-anchor="middle" font-size="11.5" fill="#ececec">60 numbers,</text>
<text x="120" y="187" text-anchor="middle" font-size="11.5" fill="#ececec">mean 0.33</text>

<line x1="210" y1="150" x2="245" y2="150" stroke="#555" stroke-width="2"/>
<polygon points="245,150 237,144 237,156" fill="#555"/>

<rect x="245" y="95" width="200" height="110" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="345" y="125" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#f0b429">2. Resample</text>
<text x="345" y="149" text-anchor="middle" font-size="11.5" fill="#ececec">draw 60 with replacement,</text>
<text x="345" y="169" text-anchor="middle" font-size="11.5" fill="#ececec">take the mean,</text>
<text x="345" y="187" text-anchor="middle" font-size="11.5" fill="#ececec">repeat 10,000 times</text>

<line x1="445" y1="150" x2="480" y2="150" stroke="#555" stroke-width="2"/>
<polygon points="480,150 472,144 472,156" fill="#555"/>

<rect x="480" y="95" width="200" height="110" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="580" y="125" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#f0b429">3. Percentiles</text>
<text x="580" y="149" text-anchor="middle" font-size="11.5" fill="#ececec">2.5th and 97.5th</text>
<text x="580" y="169" text-anchor="middle" font-size="11.5" fill="#ececec">percentile of the</text>
<text x="580" y="187" text-anchor="middle" font-size="11.5" fill="#ececec">10,000 means</text>

<line x1="680" y1="150" x2="715" y2="150" stroke="#555" stroke-width="2"/>
<polygon points="715,150 707,144 707,156" fill="#555"/>
</g>

<!-- Number line -->
<g font-family="system-ui,-apple-system,sans-serif">
<text x="410" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">95% confidence interval: [0.08, 0.58]</text>
<line x1="110" y1="300" x2="710" y2="300" stroke="#555" stroke-width="2"/>
<text x="110" y="325" text-anchor="middle" font-size="11.5" fill="#a8a8a8">-0.2</text>
<text x="219" y="325" text-anchor="middle" font-size="11.5" fill="#a8a8a8">0</text>
<text x="382" y="325" text-anchor="middle" font-size="11.5" fill="#a8a8a8">0.3</text>
<text x="546" y="325" text-anchor="middle" font-size="11.5" fill="#a8a8a8">0.6</text>
<text x="710" y="325" text-anchor="middle" font-size="11.5" fill="#a8a8a8">0.9</text>
<line x1="219" y1="292" x2="219" y2="308" stroke="#e08080" stroke-width="2"/>
<text x="219" y="285" text-anchor="middle" font-size="11" fill="#e08080">zero</text>
<rect x="263" y="290" width="272" height="20" rx="10" fill="#7fd08a" opacity="0.65"/>
<text x="263" y="285" text-anchor="middle" font-size="11" fill="#7fd08a">0.08</text>
<text x="535" y="285" text-anchor="middle" font-size="11" fill="#7fd08a">0.58</text>
<circle cx="399" cy="300" r="6" fill="#f0b429"/>
<text x="399" y="285" text-anchor="middle" font-size="11" fill="#f0b429">mean 0.33</text>
</g>

<rect x="60" y="360" width="700" height="70" rx="10" fill="#1f3a24" stroke="#7fd08a" stroke-width="1"/>
<text x="410" y="388" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#7fd08a">Zero is outside the interval: the gap is significant at the 5% level.</text>
<rect x="60" y="445" width="700" height="70" rx="10" fill="#141414" stroke="#f0b429" stroke-width="1"/>
<text x="410" y="473" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#f0b429">But the true gap could be 0.08: small on a 1 to 5 scale.</text>
<text x="410" y="495" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">Significance tells you the gap is probably real. The interval tells you whether it is big enough to care about.</text>
</svg>
