<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="460" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.11. The weekly status word</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Status word first, same format every week. Never bury it.</text>
<rect x="24" y="100" width="272" height="170" fill="#1c1c1c" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="160" y="150" font-size="20" font-weight="bold" fill="#ececec" text-anchor="middle">GREEN</text>
<text x="160" y="190" font-size="12" fill="#8a8a8a" text-anchor="middle">on track</text>
<text x="160" y="215" font-size="12" fill="#ececec" text-anchor="middle">ship it</text>
<rect x="306" y="100" width="272" height="170" fill="#1c1c1c" stroke="#f0b429" stroke-width="1.5" rx="6"/>
<text x="442" y="150" font-size="20" font-weight="bold" fill="#ececec" text-anchor="middle">YELLOW</text>
<text x="442" y="190" font-size="12" fill="#8a8a8a" text-anchor="middle">risk, with a mitigation plan</text>
<text x="442" y="215" font-size="12" fill="#ececec" text-anchor="middle">competence, not failure</text>
<rect x="588" y="100" width="272" height="170" fill="#1c1c1c" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="724" y="150" font-size="20" font-weight="bold" fill="#ececec" text-anchor="middle">RED</text>
<text x="724" y="190" font-size="12" fill="#8a8a8a" text-anchor="middle">blocked or breached</text>
<text x="724" y="215" font-size="12" fill="#ececec" text-anchor="middle">early, from you first</text>
<text x="440" y="340" font-size="13" fill="#ececec" text-anchor="middle">Regularity builds trust faster than good news.</text>
<text x="440" y="368" font-size="13" fill="#8a8a8a" text-anchor="middle">Never let the customer discover a problem before you tell them.</text>
</svg>
