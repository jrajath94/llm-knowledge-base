<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Bar chart of the Dominant Resource Fairness worked example: tenant A dominant share 12.5 percent memory, tenant B 25 percent memory.">
<rect width="800" height="600" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Dominant Resource Fairness: the worked example</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Cluster: 8 CPUs, 32 GB. Each tenant's dominant share decides its priority.</text>
<text x="400" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ececec">Cluster: 8 CPUs and 32 GB of memory</text>
<rect x="150" y="360" width="150" height="100" rx="8" fill="#5aa9e6" opacity="0.9"/>
<text x="225" y="348" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#ececec">12.5%</text>
<text x="225" y="486" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Tenant A: 2 CPU + 4 GB per task</text>
<text x="225" y="510" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">dominant: memory 4/32</text>
<rect x="410" y="260" width="150" height="200" rx="8" fill="#e6a75a" opacity="0.9"/>
<text x="485" y="248" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#ececec">25.0%</text>
<text x="485" y="486" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Tenant B: 1 CPU + 8 GB per task</text>
<text x="485" y="510" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">dominant: memory 8/32</text>
<line x1="120" y1="460" x2="680" y2="460" stroke="#555" stroke-width="1.5"/>
<text x="400" y="552" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">DRF equalizes the dominant shares, so neither tenant starves on the resource it needs most.</text>
</svg>