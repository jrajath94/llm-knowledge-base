<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' width='100%' role='img'>
<title>Evals as customer contracts</title>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a8a8'/></marker></defs>
<text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Evals as customer contracts</text>
<text x='480' y='64' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#a8a8a8' text-anchor='middle'>Each acceptance criterion is a metric plus a threshold plus a test set.</text>
<rect x='90' y='110' width='240' height='110' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='210.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Metric</text>
<text x='210.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'></text>
<rect x='360' y='110' width='240' height='110' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='480.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Threshold</text>
<text x='480.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'></text>
<rect x='630' y='110' width='240' height='110' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='750.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Test set</text>
<text x='750.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'></text>
<line x1='330' y1='165' x2='360' y2='165' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<line x1='600' y1='165' x2='630' y2='165' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<rect x='90' y='280' width='780' height='120' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='480.0' y='310' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Acceptance criterion</text>
<text x='480.0' y='332' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>example: 90% of 200 real tickets routed</text>
<text x='480.0' y='351' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>to the right queue, measured weekly</text>
<line x1='480' y1='220' x2='480' y2='280' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<text x='480' y='470' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>Pass the criterion and the customer signs. Miss it and you both know exactly why.</text>
</svg>