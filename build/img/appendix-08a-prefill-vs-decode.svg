<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="800" height="520" fill="#0d0d0d"/>
<text x="400" y="36" text-anchor="middle" fill="#ececec" font-size="22" font-weight="700">Prefill vs decode: opposite bottlenecks</text>
<text x="400" y="60" text-anchor="middle" fill="#a8a8a8" font-size="14">On one shared fleet, the two phases fight</text>
<!-- prefill column -->
<rect x="60" y="100" width="320" height="340" rx="10" fill="#6cb2ff" opacity="0.12" stroke="#6cb2ff" stroke-width="2"/>
<text x="220" y="140" text-anchor="middle" fill="#6cb2ff" font-size="20" font-weight="700">Prefill</text>
<text x="220" y="168" text-anchor="middle" fill="#ececec" font-size="14">compute-bound</text>
<g fill="#ececec" font-size="14">
<text x="90" y="210">Chews the whole prompt</text>
<text x="90" y="234">at once.</text>
<text x="90" y="272">Big matrix multiplies.</text>
<text x="90" y="296">GPU compute units busy.</text>
<text x="90" y="334">Loves large batches.</text>
<text x="90" y="372">A burst of long prompts</text>
<text x="90" y="396">stalls everything else.</text>
</g>
<!-- decode column -->
<rect x="420" y="100" width="320" height="340" rx="10" fill="#f0b429" opacity="0.12" stroke="#f0b429" stroke-width="2"/>
<text x="580" y="140" text-anchor="middle" fill="#f0b429" font-size="20" font-weight="700">Decode</text>
<text x="580" y="168" text-anchor="middle" fill="#ececec" font-size="14">memory-bound</text>
<g fill="#ececec" font-size="14">
<text x="450" y="210">One token at a time.</text>
<text x="450" y="248">Each token reads every</text>
<text x="450" y="272">weight from memory.</text>
<text x="450" y="310">Throttled by memory</text>
<text x="450" y="334">bandwidth, not compute.</text>
<text x="450" y="372">Decode-heavy traffic leaves</text>
<text x="450" y="396">prefill capacity idle.</text>
</g>
<text x="400" y="482" text-anchor="middle" fill="#ececec" font-size="15">Splitting them lets each pool run at the utilization its phase allows.</text>
</svg>
