<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-label="Pipeline diagram of the PII lifecycle: detect, tokenize or redact, field-level logging, 30-day purge, training scrub, aggregates.">
<rect width="860" height="640" fill="#0d0d0d"/>
<text x="430" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">The PII lifecycle</text>
<text x="430" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Assume some PII always slips through. Scrub at every stage.</text>
<rect x="30" y="130" width="260" height="140" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="160" y="164" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#5aa9e6">1. Detect</text>
<text x="160" y="188" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">every prompt passes detection</text>
<text x="160" y="205" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">on arrival</text>
<line x1="290" y1="200" x2="302" y2="200" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="290,194 290,206 302,200" fill="#a8a8a8"/>
<rect x="310" y="130" width="260" height="140" rx="10" fill="#161616" stroke="#e6a75a" stroke-width="2"/>
<text x="440" y="164" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#e6a75a">2. Tokenize or redact</text>
<text x="440" y="188" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">vault tokens for needed PII;</text>
<text x="440" y="205" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">redact the rest</text>
<line x1="570" y1="200" x2="582" y2="200" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="570,194 570,206 582,200" fill="#a8a8a8"/>
<rect x="590" y="130" width="260" height="140" rx="10" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="720" y="164" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#7fd08a">3. Log</text>
<text x="720" y="188" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">field-level policy:</text>
<text x="720" y="205" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">keep safe fields, scrub risky ones</text>
<rect x="30" y="300" width="260" height="140" rx="10" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="160" y="334" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#e67e7e">4. Purge</text>
<text x="160" y="358" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">raw trajectories live 30 days,</text>
<text x="160" y="375" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">then purge everywhere</text>
<line x1="290" y1="370" x2="302" y2="370" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="290,364 290,376 302,370" fill="#a8a8a8"/>
<rect x="310" y="300" width="260" height="140" rx="10" fill="#161616" stroke="#e6d75a" stroke-width="2"/>
<text x="440" y="334" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#e6d75a">5. Training scrub</text>
<text x="440" y="358" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">second scrub plus a human audit</text>
<text x="440" y="375" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">of 200 samples</text>
<line x1="570" y1="370" x2="582" y2="370" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="570,364 570,376 582,370" fill="#a8a8a8"/>
<rect x="590" y="300" width="260" height="140" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="720" y="334" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#5aa9e6">6. Analytics</text>
<text x="720" y="358" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">aggregates, not raw text,</text>
<text x="720" y="375" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">kept long-term</text>
<line x1="760" y1="270" x2="760" y2="300" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="754,290 766,290 760,302" fill="#a8a8a8"/>
<text x="430" y="492" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">The pipeline runs in order: detect, then tokenize or redact, then log with field-level policies.</text>
<text x="430" y="518" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Raw trajectories purge after 30 days everywhere, including backups.</text>
<text x="430" y="544" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Anything bound for training gets a second scrub plus a human audit of 200 samples.</text>
</svg>