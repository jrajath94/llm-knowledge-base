<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="800" height="480" fill="#0d0d0d"/>
<text x="400" y="36" text-anchor="middle" fill="#ececec" font-size="22" font-weight="700">Keep rate: the economics of synthetic data</text>
<text x="400" y="60" text-anchor="middle" fill="#a8a8a8" font-size="14">Discarded tokens dominate the bill</text>
<!-- generated bar -->
<rect x="80" y="110" width="640" height="60" fill="#6cb2ff" opacity="0.3"/>
<text x="400" y="135" text-anchor="middle" fill="#ececec" font-size="16" font-weight="700">1B tokens generated</text>
<text x="400" y="157" text-anchor="middle" fill="#a8a8a8" font-size="13">Model drafts at full speed. Most of it is unusable.</text>
<!-- funnel -->
<polygon points="80,170 720,170 470,260 330,260" fill="#262626" stroke="#a8a8a8" stroke-width="2"/>
<text x="400" y="222" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="700">checker: keep the correct 10%</text>
<!-- banked bar -->
<rect x="330" y="260" width="140" height="60" fill="#7fd08a" opacity="0.35"/>
<text x="400" y="285" text-anchor="middle" fill="#7fd08a" font-size="15" font-weight="700">100M banked</text>
<text x="400" y="306" text-anchor="middle" fill="#a8a8a8" font-size="12">keep rate 10%</text>
<!-- discarded arrow -->
<line x1="600" y1="215" x2="700" y2="215" stroke="#e08080" stroke-width="2"/>
<polygon points="700,215 688,207 688,223" fill="#e08080"/>
<rect x="600" y="240" width="140" height="60" fill="#e08080" opacity="0.25"/>
<text x="670" y="265" text-anchor="middle" fill="#e08080" font-size="15" font-weight="700">900M discarded</text>
<text x="670" y="286" text-anchor="middle" fill="#a8a8a8" font-size="12">the price of filtering</text>
<!-- bottom line -->
<text x="400" y="380" text-anchor="middle" fill="#ececec" font-size="15">Watch the keep rate. Each STaR iteration raises the next keep rate.</text>
<text x="400" y="408" text-anchor="middle" fill="#a8a8a8" font-size="14">Compounding is the whole game: better generator, higher keep rate, better data.</text>
</svg>
