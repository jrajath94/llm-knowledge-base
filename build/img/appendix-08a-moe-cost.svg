<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="800" height="500" fill="#0d0d0d"/>
<text x="400" y="36" text-anchor="middle" fill="#ececec" font-size="22" font-weight="700">MoE: where the cost really goes</text>
<text x="400" y="60" text-anchor="middle" fill="#a8a8a8" font-size="14">Not compute. Memory, network, and the load-balance tax.</text>
<!-- compute crossed out -->
<rect x="60" y="110" width="200" height="120" rx="10" fill="#262626" stroke="#a8a8a8" stroke-width="2"/>
<text x="160" y="150" text-anchor="middle" fill="#a8a8a8" font-size="17" font-weight="700">compute</text>
<text x="160" y="176" text-anchor="middle" fill="#a8a8a8" font-size="13">37B active per token</text>
<text x="160" y="196" text-anchor="middle" fill="#a8a8a8" font-size="13">fixed by top-k</text>
<line x1="80" y1="130" x2="240" y2="210" stroke="#e08080" stroke-width="3"/>
<!-- memory -->
<rect x="300" y="110" width="200" height="120" rx="10" fill="#e08080" opacity="0.2" stroke="#e08080" stroke-width="2"/>
<text x="400" y="150" text-anchor="middle" fill="#e08080" font-size="17" font-weight="700">memory</text>
<text x="400" y="176" text-anchor="middle" fill="#ececec" font-size="13">all 671B params live</text>
<text x="400" y="196" text-anchor="middle" fill="#ececec" font-size="13">on GPUs, always</text>
<!-- network -->
<rect x="540" y="110" width="200" height="120" rx="10" fill="#f0b429" opacity="0.2" stroke="#f0b429" stroke-width="2"/>
<text x="640" y="150" text-anchor="middle" fill="#f0b429" font-size="17" font-weight="700">network</text>
<text x="640" y="176" text-anchor="middle" fill="#ececec" font-size="13">dispatch + combine</text>
<text x="640" y="196" text-anchor="middle" fill="#ececec" font-size="13">all-to-all, every layer</text>
<!-- load balance tax -->
<rect x="180" y="270" width="440" height="130" rx="10" fill="#6cb2ff" opacity="0.15" stroke="#6cb2ff" stroke-width="2"/>
<text x="400" y="305" text-anchor="middle" fill="#6cb2ff" font-size="17" font-weight="700">load-balance tax</text>
<text x="400" y="332" text-anchor="middle" fill="#ececec" font-size="13">One hot expert sets the pace for the whole layer.</text>
<text x="400" y="354" text-anchor="middle" fill="#ececec" font-size="13">The overloaded GPU is the straggler. Everyone waits.</text>
<text x="400" y="376" text-anchor="middle" fill="#a8a8a8" font-size="13">Fix: spread the load (EPLB replicas, Waterfill, LPLB).</text>
<text x="400" y="450" text-anchor="middle" fill="#ececec" font-size="15">Size MoE fleets for memory and network first. FLOPS last.</text>
</svg>
