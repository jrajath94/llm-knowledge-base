<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.9. The eval-as-contract: five parts</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">All five are agreed before building. All five are co-signed.</text>
<rect x="24" y="90" width="156" height="250" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
<text x="102" y="125" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Golden set</text>
<text x="102" y="155" font-size="12" fill="#8a8a8a" text-anchor="middle">100-300 versioned</text>
<text x="102" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">real customer cases</text>
<rect x="190" y="90" width="156" height="250" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
<text x="268" y="125" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Grader</text>
<text x="268" y="155" font-size="12" fill="#8a8a8a" text-anchor="middle">deterministic code first;</text>
<text x="268" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">model judge only if code</text>
<text x="268" y="195" font-size="12" fill="#8a8a8a" text-anchor="middle">cannot decide</text>
<rect x="356" y="90" width="156" height="250" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
<text x="434" y="125" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Threshold</text>
<text x="434" y="155" font-size="12" fill="#8a8a8a" text-anchor="middle">pass bar plus a</text>
<text x="434" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">no-critical-failure rule</text>
<rect x="522" y="90" width="156" height="250" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
<text x="600" y="125" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Taxonomy</text>
<text x="600" y="155" font-size="12" fill="#8a8a8a" text-anchor="middle">every miss categorized;</text>
<text x="600" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">filed where the customer</text>
<text x="600" y="195" font-size="12" fill="#8a8a8a" text-anchor="middle">will look</text>
<rect x="688" y="90" width="156" height="250" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
<text x="766" y="125" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Re-run rule</text>
<text x="766" y="155" font-size="12" fill="#8a8a8a" text-anchor="middle">re-run on every change;</text>
<text x="766" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">the contract stays live</text>
<text x="440" y="400" font-size="13" fill="#ececec" text-anchor="middle">An eval the customer did not sign is a wish.</text>
</svg>
