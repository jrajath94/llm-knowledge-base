<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="440" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 4.4. The demo-to-acceptance gap</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">The demo number flatters. The acceptance number decides.</text>
<rect x="90" y="98" width="150" height="282" fill="#7aa2f7" rx="6" opacity="0.9"/>
<text x="165" y="86" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">94%</text>
<text x="165" y="405" font-size="13" fill="#8a8a8a" text-anchor="middle">Demo set</text>
<rect x="330" y="146" width="150" height="234" fill="#f0b429" rx="6" opacity="0.9"/>
<text x="405" y="134" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">78%</text>
<text x="405" y="405" font-size="13" fill="#8a8a8a" text-anchor="middle">Acceptance eval</text>
<line x1="280" y1="160" x2="320" y2="160" stroke="#e57ea6" stroke-width="2"/>
<polygon points="320,154 320,166 330,160" fill="#e57ea6"/>
<text x="300" y="140" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="middle">gap: 16 points</text>
<text x="560" y="150" font-size="13" fill="#ececec">Typical gap: <tspan font-weight="bold">10-30 points</tspan>.</text>
<text x="560" y="175" font-size="13" fill="#ececec">The demo runs on cases chosen to look good.</text>
<text x="560" y="200" font-size="13" fill="#ececec">The acceptance eval runs on real customer cases.</text>
<text x="560" y="240" font-size="13" fill="#e57ea6">Never quote the demo number after the acceptance eval exists.</text>
</svg>
