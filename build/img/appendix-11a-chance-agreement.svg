<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Chance agreement: two 80 percent accept rates overlap to produce 68 percent agreement by luck alone">
<rect width="800" height="500" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Raw agreement flatters: chance does the rest</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Humans accept 80% of candidates. The judge also accepts 80%. Even a judge that understands nothing agrees 68% of the time.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<!-- Human bar -->
<text x="60" y="120" font-size="14" font-weight="bold" fill="#ececec">Human accepts</text>
<rect x="60" y="135" width="560" height="44" rx="6" fill="#1a2a3a" stroke="#6cb2ff" stroke-width="1.2"/>
<rect x="60" y="135" width="448" height="44" rx="6" fill="#6cb2ff" opacity="0.55"/>
<text x="620" y="163" font-size="13" fill="#a8a8a8">80%</text>

<!-- Judge bar -->
<text x="60" y="215" font-size="14" font-weight="bold" fill="#ececec">Judge accepts</text>
<rect x="60" y="230" width="560" height="44" rx="6" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.2"/>
<rect x="60" y="230" width="448" height="44" rx="6" fill="#f0b429" opacity="0.55"/>
<text x="620" y="258" font-size="13" fill="#a8a8a8">80%</text>

<!-- Overlap -->
<text x="60" y="315" font-size="14" font-weight="bold" fill="#ececec">Overlap by chance alone</text>
<rect x="60" y="330" width="560" height="44" rx="6" fill="#141414" stroke="#555" stroke-width="1.2"/>
<rect x="60" y="330" width="381" height="44" rx="6" fill="#e08080" opacity="0.5"/>
<text x="455" y="358" font-size="13" font-weight="bold" fill="#e08080">68% agree, 0.80 x 0.80</text>
</g>

<rect x="60" y="400" width="680" height="70" rx="10" fill="#141414" stroke="#2e9e5b" stroke-width="1"/>
<text x="400" y="428" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="bold" fill="#2e9e5b">Cohen's kappa subtracts the chance agreement.</text>
<text x="400" y="452" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">It answers the honest question: how much does this judge agree beyond luck?</text>
</svg>
