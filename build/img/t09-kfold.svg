<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t09kf-title t09kf-desc">
<title id="t09kf-title">K-fold cross validation: every row is tested once</title>
<desc id="t09kf-desc">Five rows, one per fold. Each row is split into 5 blocks. In row 1, block 1 is the test set (gold) and the rest are training (blue). In row 2, block 2 is the test set. Every block is the test set exactly once. The final score is the mean of the 5 test scores.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">5-FOLD CROSS VALIDATION</text>
<text x="30" y="112" class="dl">fold 1</text>
<rect x="130" y="90" width="140" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="200" y="112" class="tl" fill="#0d0d0d">test</text>
<rect x="278" y="90" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="426" y="90" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="574" y="90" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="722" y="90" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="164" class="dl">fold 2</text>
<rect x="130" y="142" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="278" y="142" width="140" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="348" y="164" class="tl" fill="#0d0d0d">test</text>
<rect x="426" y="142" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="574" y="142" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="722" y="142" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="216" class="dl">fold 3</text>
<rect x="130" y="194" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="278" y="194" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="426" y="194" width="140" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="496" y="216" class="tl" fill="#0d0d0d">test</text>
<rect x="574" y="194" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="722" y="194" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="268" class="dl">fold 4</text>
<rect x="130" y="246" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="278" y="246" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="426" y="246" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="574" y="246" width="140" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="644" y="268" class="tl" fill="#0d0d0d">test</text>
<rect x="722" y="246" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="320" class="dl">fold 5</text>
<rect x="130" y="298" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="278" y="298" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="426" y="298" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="574" y="298" width="140" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<rect x="722" y="298" width="140" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="792" y="320" class="tl" fill="#0d0d0d">test</text>
<text x="130" y="380" class="dl" fill="#7fd67f">final score = mean of the 5 test scores</text>
<text x="130" y="402" class="dl" fill="#a8a8a8">spread of the 5 scores = how much you trust the mean</text>
<text x="30" y="60" class="dl"></text>
</g>
<defs><marker id="t09kf-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>