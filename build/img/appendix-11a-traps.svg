<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-label="Four traps that inflate eval wins: multiple comparisons, test-set overfitting, judge shopping, cluster structure">
<rect width="820" height="560" fill="#0d0d0d"/>
<text x="410" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Four traps that inflate wins</text>
<text x="410" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Four mistakes show up in almost every eval postmortem. All four are cheap to prevent.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<g>
<rect x="30" y="85" width="370" height="200" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.2"/>
<text x="50" y="115" font-size="14" font-weight="bold" fill="#e08080">1. Multiple comparisons</text>
<text x="50" y="140" font-size="12" fill="#ececec">Test 20 metrics and one looks</text>
<text x="50" y="160" font-size="12" fill="#ececec">significant by luck at the 5% level.</text>
<text x="50" y="190" font-size="12" font-weight="bold" fill="#7fd08a">Fix: Bonferroni correction.</text>
<text x="50" y="212" font-size="11.5" fill="#a8a8a8">Divide the significance bar by the</text>
<text x="50" y="230" font-size="11.5" fill="#a8a8a8">number of tests. Deliberately strict.</text>
</g>
<g>
<rect x="420" y="85" width="370" height="200" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.2"/>
<text x="440" y="115" font-size="14" font-weight="bold" fill="#e08080">2. Test-set overfitting</text>
<text x="440" y="140" font-size="12" fill="#ececec">Tune the prompt on the same 60</text>
<text x="440" y="160" font-size="12" fill="#ececec">questions you report on: you measure</text>
<text x="440" y="180" font-size="12" fill="#ececec">memory of tuning, not quality.</text>
<text x="440" y="210" font-size="12" font-weight="bold" fill="#7fd08a">Fix: a hold-out set.</text>
<text x="440" y="232" font-size="11.5" fill="#a8a8a8">Never look at it until the final number.</text>
</g>
<g>
<rect x="30" y="305" width="370" height="200" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.2"/>
<text x="50" y="335" font-size="14" font-weight="bold" fill="#e08080">3. Judge shopping</text>
<text x="50" y="360" font-size="12" fill="#ececec">The LLM judge favors longer answers,</text>
<text x="50" y="380" font-size="12" fill="#ececec">its own style, or the answer shown second.</text>
<text x="50" y="410" font-size="12" font-weight="bold" fill="#7fd08a">Fix: calibrate first.</text>
<text x="50" y="432" font-size="11.5" fill="#a8a8a8">Average across judges, randomize order,</text>
<text x="50" y="450" font-size="11.5" fill="#a8a8a8">calibrate the judge (Chapter 2).</text>
</g>
<g>
<rect x="420" y="305" width="370" height="200" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.2"/>
<text x="440" y="335" font-size="14" font-weight="bold" fill="#e08080">4. Cluster structure</text>
<text x="440" y="360" font-size="12" fill="#ececec">5 answers per prompt, one judge for all:</text>
<text x="440" y="380" font-size="12" fill="#ececec">the 5 ratings are not independent.</text>
<text x="440" y="410" font-size="12" font-weight="bold" fill="#7fd08a">Fix: resample by prompt.</text>
<text x="440" y="432" font-size="11.5" fill="#a8a8a8">Resampling ratings as independent makes</text>
<text x="440" y="450" font-size="11.5" fill="#a8a8a8">the interval artificially narrow.</text>
</g>
</g>
<text x="410" y="535" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">Each trap has the same shape: a quiet assumption of independence that was never true.</text>
</svg>
