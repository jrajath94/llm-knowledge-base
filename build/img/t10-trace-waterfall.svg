<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t10tr-title t10tr-desc">
<title id="t10tr-title">Distributed trace: one request, four spans</title>
<desc id="t10tr-desc">A waterfall with a millisecond scale. Gateway span: 0 to 320 ms. Auth span: 10 to 60 ms inside it. Service span: 70 to 300 ms. Database span: 90 to 280 ms inside the service. The database span is the longest, so it is the bottleneck.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">DISTRIBUTED TRACE WATERFALL</text>
<line x1="220" y1="70" x2="860" y2="70" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="220.0" y1="64" x2="220.0" y2="76" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="220.0" y="58" class="tl" fill="#a8a8a8">0ms</text>
<line x1="408.2352941176471" y1="64" x2="408.2352941176471" y2="76" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="408.2352941176471" y="58" class="tl" fill="#a8a8a8">100ms</text>
<line x1="596.4705882352941" y1="64" x2="596.4705882352941" y2="76" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="596.4705882352941" y="58" class="tl" fill="#a8a8a8">200ms</text>
<line x1="784.7058823529412" y1="64" x2="784.7058823529412" y2="76" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="784.7058823529412" y="58" class="tl" fill="#a8a8a8">300ms</text>
<text x="30" y="110" class="dl">gateway</text>
<rect x="220.0" y="90" width="602.3529411764706" height="30" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="162" class="dl">auth</text>
<rect x="238.8235294117647" y="142" width="94.11764705882352" height="30" rx="4" fill="#7fd67f" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="214" class="dl">service</text>
<rect x="351.7647058823529" y="194" width="432.94117647058823" height="30" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="266" class="dl">database</text>
<rect x="389.4117647058823" y="246" width="357.6470588235294" height="30" rx="4" fill="#ff7a7a" stroke="#262626" stroke-width="1.5"/>
<text x="30" y="360" class="capl">How to read: bar position = when it ran. Bar length = how long it took.</text>
<text x="30" y="382" class="dl">The red database bar is longest: it is the bottleneck. Optimize there.</text>
<text x="30" y="404" class="dl" fill="#ff7a7a">What breaks: missing trace IDs. Without one ID across services, you cannot build this.</text>
</g>
<defs><marker id="t10tr-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>