<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t10ll-title t10ll-desc">
<title id="t10ll-title">Little's Law: L = lambda x W, with numbers</title>
<desc id="t10ll-desc">A queue diagram. Arrivals at 200 requests per second. Each request spends 0.05 seconds in the system. Little's Law says 10 requests are in the system on average: L = 200 x 0.05 = 10. Ten boxes are drawn inside the system boundary.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">LITTLE'S LAW (L = λW)</text>
<text x="60" y="130" class="dl" fill="#6ab0ff">arrivals</text>
<text x="60" y="152" class="box" fill="#6ab0ff">λ = 200 req/s</text>
<rect x="300" y="80" width="340" height="220" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="470" y="110" class="box" fill="#f0b429">the system</text>
<rect x="330" y="140" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="388" y="140" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="446" y="140" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="504" y="140" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="562" y="140" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="330" y="202" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="388" y="202" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="446" y="202" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="504" y="202" width="46" height="48" rx="6" fill="#6ab0ff"/>
<rect x="562" y="202" width="46" height="48" rx="6" fill="#6ab0ff"/>
<text x="470" y="280" class="dl" fill="#f0b429">L = 10 requests inside</text>
<text x="700" y="130" class="dl" fill="#7fd67f">time inside</text>
<text x="700" y="152" class="box" fill="#7fd67f">W = 0.05 s</text>
<line x1="200" y1="190" x2="300" y2="190" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10ll-ah)"/>
<line x1="640" y1="190" x2="700" y2="190" stroke="#a8a8a8" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#t10ll-ah)"/>
<rect x="30" y="340" width="880" height="70" rx="8" fill="#161616" stroke="#262626" stroke-width="1.5"/>
<text x="50" y="366" class="dl">L = λ × W = 200 × 0.05 = 10 requests. No measurement needed, just arithmetic.</text>
<text x="50" y="388" class="dl" fill="#a8a8a8">Use it to size queues, thread pools, and connection pools before you load-test.</text>
</g>
<defs><marker id="t10ll-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>