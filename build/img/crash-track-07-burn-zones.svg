<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.7. Burn-rate zones: what each zone triggers</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Burn rate = observed failures over allowed failures.</text>
<rect x="24" y="110" width="832" height="64" fill="#1c1c1c" rx="6"/>
<rect x="24" y="110" width="10" height="64" fill="#7bc98a"/>
<text x="60" y="138" font-size="15" font-weight="bold" fill="#ececec">below 1.0</text>
<text x="60" y="160" font-size="13" fill="#8a8a8a">on track: the budget survives</text>
<rect x="24" y="190" width="832" height="64" fill="#1c1c1c" rx="6"/>
<rect x="24" y="190" width="10" height="64" fill="#f0b429"/>
<text x="60" y="218" font-size="15" font-weight="bold" fill="#ececec">1.0 - 2.0</text>
<text x="60" y="240" font-size="13" fill="#8a8a8a">freeze: non-urgent deploys stop</text>
<rect x="24" y="270" width="832" height="64" fill="#1c1c1c" rx="6"/>
<rect x="24" y="270" width="10" height="64" fill="#e57ea6"/>
<text x="60" y="298" font-size="15" font-weight="bold" fill="#ececec">above 2.0</text>
<text x="60" y="320" font-size="13" fill="#8a8a8a">page: the on-call gets paged</text>
<text x="24" y="400" font-size="13" fill="#ececec">Example: 0.3% observed over 0.1% allowed = <tspan font-weight="bold">3x</tspan>. The agreed line triggers.</text>
<text x="24" y="425" font-size="13" fill="#8a8a8a">Alert on burn rate, not raw counts.</text>
</svg>
