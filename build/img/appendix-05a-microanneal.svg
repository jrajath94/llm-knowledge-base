<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img' aria-label='Microanneal: turn data curation into a measurement'>
<rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Microanneal: turn data curation into a measurement</text>
<rect x='24' y='80' width='280' height='120' rx='10' fill='#141414' stroke='#6cb2ff' stroke-width='2'/>
<text x='164' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ececec' text-anchor='middle'>small domain dataset</text>
<text x='164' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the candidate data</text>
<line x1='304' y1='140' x2='380' y2='140' stroke='#a8a8a8' stroke-width='3'/>
<polygon points='384,140 374,132 374,148' fill='#a8a8a8'/>
<rect x='384' y='80' width='280' height='120' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/>
<text x='524' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ececec' text-anchor='middle'>short anneal</text>
<text x='524' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>train briefly on it</text>
<line x1='664' y1='140' x2='740' y2='140' stroke='#a8a8a8' stroke-width='3'/>
<polygon points='744,140 734,132 734,148' fill='#a8a8a8'/>
<rect x='744' y='80' width='192' height='120' rx='10' fill='#141414' stroke='#7fd08a' stroke-width='2'/>
<text x='840' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ececec' text-anchor='middle'>eval delta</text>
<text x='840' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>read the number</text>
<text x='24' y='260' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Value a dataset by the eval gain it produces, not by staring at samples.</text>
<text x='24' y='286' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>An argument becomes a measurement.</text>
</svg>
