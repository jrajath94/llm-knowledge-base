<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t08cq-title t08cq-desc">
<title id="t08cq-title">Cost versus quality: pick a point on the frontier</title>
<desc id="t08cq-desc">Scatter plot. X axis: cost per 1,000 requests. Y axis: answer quality score. Five models plotted. The top-left edge is the frontier: no model there is both cheaper and better. Points below the frontier are bad deals.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="470" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">COST VS QUALITY FRONTIER</text>
<line x1="90" y1="380" x2="790" y2="380" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="90" y1="380" x2="90" y2="100" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="440.0" y="410" class="capl">cost per 1K requests (log scale)</text>
<text x="30" y="240.0" class="capl">quality score</text>
<circle cx="133.29937689700816" cy="314.6666666666667" r="10" fill="#a8a8a8" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="133.29937689700816" y="296.6666666666667" class="tl" fill="#a8a8a8">small</text>
<circle cx="299.64179514583583" cy="202.66666666666669" r="10" fill="#6ab0ff" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="299.64179514583583" y="184.66666666666669" class="tl" fill="#6ab0ff">medium</text>
<circle cx="528.4012462059836" cy="137.33333333333331" r="10" fill="#f0b429" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="528.4012462059836" y="119.33333333333331" class="tl" fill="#f0b429">large</text>
<circle cx="737.1417951458359" cy="118.66666666666669" r="10" fill="#ff7a7a" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="737.1417951458359" y="100.66666666666669" class="tl" fill="#ff7a7a">xl</text>
<circle cx="550.7804747767129" cy="240.0" r="10" fill="#555555" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="550.7804747767129" y="222.0" class="tl" fill="#555555">old-large</text>
<line x1="133.29937689700816" y1="314.6666666666667" x2="299.6417951458358" y2="202.66666666666669" stroke="#7fd67f" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="299.6417951458358" y1="202.66666666666669" x2="528.4012462059835" y2="137.33333333333331" stroke="#7fd67f" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="528.4012462059835" y1="137.33333333333331" x2="737.1417951458359" y2="118.66666666666669" stroke="#7fd67f" stroke-width="2" stroke-dasharray="6,5"/>
<text x="560" y="120" class="dl" fill="#7fd67f">frontier: no bad deals</text>
<text x="420" y="250" class="dl" fill="#777777">old-large: dominated</text>
<text x="30" y="440" class="capl">How to read: top-left is best. The dashed line is the frontier. Never pick below it.</text>
</g>
<defs><marker id="t08cq-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>