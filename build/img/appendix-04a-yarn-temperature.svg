<rect x='144' y='30' width='28' height='90' rx='4' fill='#6cb2ff' opacity='0.9'/>
<rect x='184' y='102' width='28' height='18' rx='4' fill='#6cb2ff' opacity='0.9'/>
<rect x='224' y='102' width='28' height='18' rx='4' fill='#6cb2ff' opacity='0.9'/>
<rect x='264' y='102' width='28' height='18' rx='4' fill='#6cb2ff' opacity='0.9'/>
<rect x='304' y='102' width='28' height='18' rx='4' fill='#6cb2ff' opacity='0.9'/>
<text x='480' y='80' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>Long context: attention flattens.</text>
<rect x='480' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='520' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='560' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='600' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='640' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='680' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='720' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<rect x='760' y='86' width='28' height='34' rx='4' fill='#e57373' opacity='0.9'/>
<text x='24' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Fix: divide logits by t, where 1/t = 0.1 ln s + 1. This re-sharpens the distribution.</text>
<text x='24' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>YaRN applies it by scaling q and k by sqrt(1/t): zero extra compute at inference.</text>
</svg>
