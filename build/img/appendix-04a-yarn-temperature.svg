<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img' aria-label='YaRN temperature: longer contexts flatten attention'>
<rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>YaRN temperature: longer contexts flatten attention</text>
<text x='24' y='80' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>Short context: attention is sharp.</text>
<rect x='24' y='102' width='28' height='18' rx='4' fill='#6cb2ff' opacity='0.9'/>
