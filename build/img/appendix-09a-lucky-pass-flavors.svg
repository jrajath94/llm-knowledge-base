<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-label="Three flavors of lucky passes: guessing, shortcutting, memorization">
<rect width="800" height="470" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Lucky passes: three flavors</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">The grader says pass, but the agent got lucky. Each flavor needs a different defense.</text>

<!-- Guessing -->
<g>
<rect x="30" y="80" width="230" height="220" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="145" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#f0b429">1. Guessing</text>
<text x="145" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Agent picks an answer from</text>
<text x="145" y="160" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">a small set and gets it</text>
<text x="145" y="180" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">right by chance.</text>
<text x="145" y="214" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">Example: 4-choice question,</text>
<text x="145" y="234" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">25% pass with zero reasoning.</text>
<text x="145" y="268" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#7fd08a">Defense: pass^k</text>
<text x="145" y="288" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">k independent successes</text>
<text x="145" y="306" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">in a row crush chance.</text>
</g>

<!-- Shortcutting -->
<g>
<rect x="285" y="80" width="230" height="220" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="400" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#6cb2ff">2. Shortcutting</text>
<text x="400" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Grader checks something</text>
<text x="400" y="160" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">correlated with the answer,</text>
<text x="400" y="180" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">not the answer itself.</text>
<text x="400" y="214" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">Example: file exists, but its</text>
<text x="400" y="234" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">contents were never checked.</text>
<text x="400" y="268" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#7fd08a">Defense: trajectory checks</text>
<text x="400" y="288" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">milestone evidence shows</text>
<text x="400" y="306" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">the work really happened.</text>
</g>

<!-- Memorization -->
<g>
<rect x="540" y="80" width="230" height="220" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.5"/>
<text x="655" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#e08080">3. Memorization</text>
<text x="655" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Task leaked into training</text>
<text x="655" y="160" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">data. Agent recites the</text>
<text x="655" y="180" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">answer instead of reasoning.</text>
<text x="655" y="214" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">Example: public benchmark</text>
<text x="655" y="234" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">with published solutions.</text>
<text x="655" y="268" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#7fd08a">Defense: task volume</text>
<text x="655" y="288" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">auto-generated evals make</text>
<text x="655" y="306" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">memorization worthless.</text>
</g>

<!-- Summary bar -->
<rect x="30" y="330" width="740" height="105" rx="10" fill="#141414" stroke="#2e9e5b" stroke-width="1"/>
<text x="400" y="360" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#2e9e5b">One fight, three weapons</text>
<text x="400" y="386" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Statistics (pass@k done right) beats guessing. Process evidence (trajectory checks) beats shortcutting.</text>
<text x="400" y="410" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Task volume (auto-generated evals) beats memorization. Use all three, because luck wears three faces.</text>
</svg>
