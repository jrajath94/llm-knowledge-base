<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 480' role='img'><rect x='0' y='0' width='880' height='480' fill='#0d0d0d' rx='8'/><text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Decontamination: n-gram overlap keeps benchmarks out</text><text x='24' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#8a8a8a'>if the model trains on the test, the score means nothing</text><rect x='40' y='110' width='200' height='90' fill='#101826' stroke='#6cb2ff' stroke-width='1.5' rx='6'/><text x='140.0' y='145.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#ececec' text-anchor='middle'>benchmark item</text><text x='140.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>"What is the capital</text><text x='140.0' y='180.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>of Assyria?"</text><line x1='240' y1='155' x2='300' y2='155' stroke='#8a8a8a' stroke-width='2'/><polygon points='300,155 292,151 292,159' fill='#8a8a8a'/><rect x='300' y='110' width='220' height='90' fill='#1c1607' stroke='#f0b429' stroke-width='1.5' rx='6'/><text x='410.0' y='145.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#ececec' text-anchor='middle'>cut into 13-grams</text><text x='410.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>"capital of Assyria",</text><text x='410.0' y='180.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>"of Assyria ?"...</text><line x1='520' y1='155' x2='580' y2='155' stroke='#8a8a8a' stroke-width='2'/><polygon points='580,155 572,151 572,159' fill='#8a8a8a'/><rect x='580' y='110' width='260' height='90' fill='#0d1c1a' stroke='#4db6ac' stroke-width='1.5' rx='6'/><text x='710.0' y='145.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#ececec' text-anchor='middle'>check the web crawl</text><text x='710.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>any 13-gram appears</text><text x='710.0' y='180.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>in training text?</text><line x1='710' y1='200' x2='710' y2='260' stroke='#8a8a8a' stroke-width='2'/><polygon points='710,260 702,256 702,264' fill='#8a8a8a'/><rect x='560' y='270' width='140' height='80' fill='#1c1212' stroke='#e57373' stroke-width='1.5' rx='6'/><text x='630.0' y='300.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#ececec' text-anchor='middle'>match found</text><text x='630.0' y='320.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>remove the text</text><rect x='730' y='270' width='110' height='80' fill='#0f1c12' stroke='#7fd08a' stroke-width='1.5' rx='6'/><text x='785.0' y='300.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#ececec' text-anchor='middle'>no match</text><text x='785.0' y='320.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>keep it</text><line x1='700' y1='310' x2='730' y2='310' stroke='#8a8a8a' stroke-width='2'/><text x='40' y='420' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Two doors: paraphrased copies slip past the filter, and benchmarks published after the crawl</text><text x='40' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>leak in through time. N-gram checks close only the first door.</text></svg>