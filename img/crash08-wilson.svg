<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.5. Wilson intervals: n=200 gives +/-5 points, n=800 gives +/-2.5</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">small evals lie by omission</text>
<text x="24" y="170" font-size="13" fill="#ececec" text-anchor="start">n=200</text>
<rect x="120" y="140" width="560" height="44" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<rect x="358.0" y="140" width="140.0" height="44" fill="#6cb2ff" rx="4" opacity="0.7"/>
<line x1="428.0" y1="132" x2="428.0" y2="192" stroke="#7dd87d" stroke-width="2"/>
<text x="506.0" y="168" font-size="12" fill="#a8a8a8" text-anchor="start">+/-5.0 pts</text>
<text x="24" y="260" font-size="13" fill="#ececec" text-anchor="start">n=800</text>
<rect x="120" y="230" width="560" height="44" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<rect x="393.0" y="230" width="70.0" height="44" fill="#6cb2ff" rx="4" opacity="0.7"/>
<line x1="428.0" y1="222" x2="428.0" y2="282" stroke="#7dd87d" stroke-width="2"/>
<text x="471.0" y="258" font-size="12" fill="#a8a8a8" text-anchor="start">+/-2.5 pts</text>
<text x="24" y="380" font-size="12" fill="#a8a8a8" text-anchor="start">An eval of 200 items cannot distinguish 72% from 77%. Size the eval to the decision: the smaller the delta</text>
<text x="24" y="398" font-size="12" fill="#a8a8a8" text-anchor="start">that matters, the larger the n.</text>
<text x="24" y="440" font-size="12" fill="#a8a8a8" text-anchor="start">Report the interval with the point estimate, always. A bare 74% is a rumor with a decimal.</text>
</svg>