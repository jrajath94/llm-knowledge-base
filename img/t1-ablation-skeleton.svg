<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 343" role="img" aria-label="The confounder trap, in one picture">
<rect width="900" height="343" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The confounder trap, in one picture</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A hidden difference rides along with the change you meant to test. The delta becomes uninterpretable.</text>
<text x="50.0" y="97.0" text-anchor="start" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">What you think you tested</text>
<rect x="40.0" y="111.0" width="180.0" height="70.0" rx="6" fill="#141414" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="130.0" y="139.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">old data</text>
<text x="130.0" y="157.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">100B tokens</text>
<text x="240.0" y="151.0" text-anchor="middle" fill="#8a8a8a" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">vs</text>
<rect x="260.0" y="111.0" width="180.0" height="70.0" rx="6" fill="#141414" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="350.0" y="139.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">new data</text>
<text x="350.0" y="157.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">100B tokens</text>
<text x="50.0" y="219.0" text-anchor="start" fill="#2dd4bf" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Clean comparison.</text>
<text x="480.0" y="97.0" text-anchor="start" fill="#e5484d" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">What you actually tested</text>
<rect x="470.0" y="111.0" width="180.0" height="70.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.5"/>
<text x="560.0" y="139.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">old data</text>
<text x="560.0" y="157.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">100B tokens</text>
<text x="670.0" y="151.0" text-anchor="middle" fill="#8a8a8a" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">vs</text>
<rect x="690.0" y="111.0" width="180.0" height="70.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.5"/>
<text x="780.0" y="139.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">new data</text>
<text x="780.0" y="157.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">130B tokens</text>
<text x="480.0" y="219.0" text-anchor="start" fill="#e5484d" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">You compared data AND compute. Oops.</text>
<rect x="40.0" y="241.0" width="820.0" height="64.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="267.0" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Compute mismatch is the most common confounder in the field.</text>
<text x="60.0" y="289.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">If compute differed, you compared budgets, not ideas. Match FLOPs first (Chapter 5's golden rule).</text>
</svg>
