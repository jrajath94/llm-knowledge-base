<text x='340' y='196' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Names, emails,</text>
<text x='340' y='214' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>keys out</text>
<line x1='430' y1='195' x2='470' y2='195' stroke='#8a8a8a' stroke-width='2'/>
