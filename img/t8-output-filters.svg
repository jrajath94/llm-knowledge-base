<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 430' width='100%' role='img'>
<title>Output filtering and PII redaction</title>
<text x='460' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Output filtering and PII redaction</text>
