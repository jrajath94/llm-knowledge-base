<text x='125' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Model</text>
<text x='125' y='196' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>response</text>
<line x1='210' y1='195' x2='250' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='241.8,198.7 250,195 241.8,191.3' fill='#8a8a8a'/>
<rect x='250' y='150' width='180' height='90' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
