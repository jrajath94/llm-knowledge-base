<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.3. Tool anatomy: what a tool must declare</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">a tool is a contract, not a function</text>
<rect x="24" y="110" width="832" height="68" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">NAME + DESCRIPTION</text>
<text x="440.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the model reads this to decide when to call it; write for the model, not for you</text>
<rect x="24" y="190" width="832" height="68" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="216" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INPUT SCHEMA</text>
<text x="440.0" y="234" font-size="11" fill="#a8a8a8" text-anchor="middle">typed parameters with examples; the model fills what the schema shows</text>
<rect x="24" y="270" width="832" height="68" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="296" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">IDEMPOTENCY</text>
<text x="440.0" y="314" font-size="11" fill="#a8a8a8" text-anchor="middle">safe to retry? declare it; the retry logic depends on the answer</text>
<rect x="24" y="350" width="832" height="68" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="376" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">TIMEOUTS + ERROR CONTRACT</text>
<text x="440.0" y="394" font-size="11" fill="#a8a8a8" text-anchor="middle">how long before giving up, and what a failure looks like as data</text>
<rect x="24" y="430" width="832" height="68" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="456" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SIDE EFFECTS</text>
<text x="440.0" y="474" font-size="11" fill="#a8a8a8" text-anchor="middle">what it changes in the world; this decides the review gate it needs</text>
<text x="24" y="528" font-size="12" fill="#a8a8a8" text-anchor="start">The tool description is a UI for the model. Vague tools get vague calls; precise tools get precise calls.</text>
</svg>