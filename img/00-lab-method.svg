<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 340' width='100%' role='img'><rect x='0' y='0' width='960' height='340' rx='12' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>How to run a lab</text><text x='24' y='56' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>one loop, four moves, repeated until it clicks</text><rect x='40' y='100' width='190' height='130' rx='10' fill='#111111' stroke='#1565c0' stroke-width='2'/><text x='135.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Run it</text><text x='135.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>get the baseline first</text><line x1='230' y1='165' x2='250' y2='165' stroke='#a8a8a8' stroke-width='2'/><polygon points='250,165 241,160 241,170' fill='#a8a8a8'/><rect x='250' y='100' width='190' height='130' rx='10' fill='#111111' stroke='#f0b429' stroke-width='2'/><text x='345.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Change one variable</text><text x='345.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>nothing else moves</text><line x1='440' y1='165' x2='460' y2='165' stroke='#a8a8a8' stroke-width='2'/><polygon points='460,165 451,160 451,170' fill='#a8a8a8'/><rect x='460' y='100' width='190' height='130' rx='10' fill='#111111' stroke='#2e7d32' stroke-width='2'/><text x='555.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Observe</text><text x='555.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>write down what changed</text><line x1='650' y1='165' x2='670' y2='165' stroke='#a8a8a8' stroke-width='2'/><polygon points='670,165 661,160 661,170' fill='#a8a8a8'/><rect x='670' y='100' width='190' height='130' rx='10' fill='#111111' stroke='#c62828' stroke-width='2'/><text x='765.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Break one thing</text><text x='765.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>on purpose, then fix it</text><path d='M 870 230 C 870 300, 90 300, 90 245' fill='none' stroke='#a8a8a8' stroke-width='2' stroke-dasharray='6 5'/><polygon points='90,245 99,250 81,250' fill='#a8a8a8'/><text x='480' y='305' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Repeat the loop. Understanding forms in the repetitions, not in the first run.</text></svg>