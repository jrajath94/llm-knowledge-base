<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why RAG and ReAct mattered"><rect x="22" y="14" width="916" height="240" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Moved the field from &quot;bigger parametric memory&quot; to &quot;models that use external</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">resources&quot;</text><path d="M 53.7 111.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="116" font-size="13.5" font-weight="700" fill="#ececec">RAG:</text><text x="122.020859375" y="116" font-size="13.5" fill="#a8a8a8">the default enterprise architecture. Update the index, not the weights; citations make outputs</text><text x="80" y="135" font-size="13.5" fill="#a8a8a8">auditable.</text><path d="M 53.7 161.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="166" font-size="13.5" font-weight="700" fill="#ececec">ReAct:</text><text x="134.55265625" y="166" font-size="13.5" fill="#a8a8a8">the default agent pattern: every agent harness is a ReAct loop with more tools and better</text><text x="80" y="185" font-size="13.5" fill="#a8a8a8">control flow.</text><path d="M 53.7 211.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="216" font-size="13.5" font-weight="700" fill="#ececec">Knowledge cutoff:</text><text x="223.1590625" y="216" font-size="13.5" fill="#a8a8a8">solved structurally, not by retraining.</text><path d="M 53.7 242.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="247" font-size="13.5" font-weight="700" fill="#ececec">Reasoning plus acting:</text><text x="258.383515625" y="247" font-size="13.5" fill="#a8a8a8">one loop instead of two separate systems.</text></svg>