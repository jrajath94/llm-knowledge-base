<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="100%" style="max-width:760px" role="img" aria-label="Transfer size and time over NVLink and InfiniBand for 2k to 32k prompts; the two gates">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="304" fill="none"/>
<text class="t" x="24" y="30">KV transfer math: the disaggregation go/no-go</text>
<text class="big" x="24" y="88">Transfer bytes per request = prompt tokens x 320 KiB/token (70B-class)</text>
<text class="m" x="200" y="120">over NVLink (~450 GB/s)</text>
<text class="m" x="460" y="120">over IB NDR (~50 GB/s)</text>
<text class="num" x="44" y="146">2k tokens</text>
<text class="big" x="180" y="146">640 MB</text>
<text class="num" x="360" y="146">~1.5 ms</text>
<text class="r" x="600" y="146">~13 ms</text>
<text class="num" x="44" y="176">8k tokens</text>
<text class="big" x="180" y="176">2.56 GB</text>
<text class="num" x="360" y="176">~6 ms</text>
<text class="r" x="600" y="176">~54 ms</text>
<text class="num" x="44" y="206">32k tokens</text>
<text class="big" x="180" y="206">10.2 GB</text>
<text class="num" x="360" y="206">~24 ms</text>
<text class="r" x="600" y="206">~215 ms</text>
<text class="num" x="24" y="252">Intra-node transfer is nearly free; cross-node is not. At 32k over InfiniBand, ~215 ms can blow a tight TTFT SLO by itself.</text>
<text class="big" x="24" y="280">The two gates: under a quarter of the TTFT budget, AND cheaper than the prefill/decode interference it removes.</text>
</svg>
