<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 303" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="RAG-Sequence: marginalizing over retrieved documents"><rect x="22" y="14" width="916" height="275" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">P(y|x) = sum over top-k of P_ret(z|x) * P_gen(y|x,z)</text><rect x="243.55296093750002" y="94" width="472.89407812499996" height="68" rx="8" fill="#0d0d0d" stroke="#6cb2ff" stroke-opacity="0.45"/><text x="261.5529609375" y="124" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">scores [3.1, 2.0, 1.2, 0.5, 0.1]</text><text x="261.5529609375" y="148" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">softmax -&gt; [0.55, 0.18, 0.08, 0.04, 0.02]</text><text x="38" y="180" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">P_ret(z|x)</text><text x="242" y="180" font-size="13" fill="#a8a8a8">softmax of query-passage dot products; q, d are BERT-base 768-dim encoders</text><text x="38" y="203" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">P_gen</text><text x="242" y="203" font-size="13" fill="#a8a8a8">BART-large conditioned on input plus passage; runs once per passage (5x here)</text><text x="38" y="226" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">mixture</text><text x="242" y="226" font-size="13" fill="#a8a8a8">final token distribution is the score-weighted mixture of the 5 runs</text><text x="38" y="249" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">intuition</text><text x="242" y="249" font-size="13" fill="#a8a8a8">a passage that scores high but generates poorly still contributes little: likelihood</text><text x="242" y="266" font-size="13" fill="#a8a8a8">multiplies weight</text></svg>