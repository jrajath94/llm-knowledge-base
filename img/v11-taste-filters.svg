<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Research taste: three filters before committing months"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">RESEARCH TASTE</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The highest-leverage skill: working on the right problem multiplies everything</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Importance:</text><text x="177.11562500000002" y="94" font-size="13.5" fill="#a8a8a8">&quot;If this works, who cares, and how much?&quot;</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Tractability:</text><text x="175.957578125" y="125" font-size="13.5" fill="#a8a8a8">&quot;Can I make measurable progress in 3 months with the compute I have?&quot;</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Neglect:</text><text x="148.455546875" y="156" font-size="13.5" fill="#a8a8a8">&quot;Why has nobody done this, and is the reason a real barrier or just inattention?&quot;</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">The skill:</text><text x="153.669921875" y="187" font-size="13.5" fill="#a8a8a8">fail ideas fast, in days not months. A problem passing all three is rare and precious.</text></svg>