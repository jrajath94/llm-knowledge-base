<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Charis SIL',Georgia,serif">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" />
</marker>
</defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Feature Store: Offline and Online</text>
<rect x="50" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="125.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Raw Events</text>
<text x="125.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Kafka, logs</text>
<rect x="250" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="325.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Batch</text>
<text x="325.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Nightly jobs</text>
<rect x="450" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="525.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Offline Store</text>
<text x="525.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Training data</text>
<rect x="250" y="250" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="325.0" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Stream</text>
<text x="325.0" y="298" text-anchor="middle" font-size="11" fill="#a8a8a8">Real-time</text>
<rect x="450" y="250" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="525.0" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Online Store</text>
<text x="525.0" y="298" text-anchor="middle" font-size="11" fill="#a8a8a8">Serving</text>
<rect x="650" y="175" width="120" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="710.0" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Model</text>
<text x="710.0" y="223" text-anchor="middle" font-size="11" fill="#a8a8a8">Train/serve</text>
<line x1="200" y1="135" x2="250" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="400" y1="135" x2="450" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="600" y1="135" x2="650" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="600" y1="285" x2="650" y2="285" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="400" y1="285" x2="450" y2="285" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="325" y1="170" x2="325" y2="250" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="400" y="350" text-anchor="middle" font-size="12" fill="#a8a8a8">Offline for training. Online for serving. Same definitions, no skew.</text>
</svg>