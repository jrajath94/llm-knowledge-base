<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="700" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">How to read a benchmark honestly</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Every claim has a question; the question is the benchmark</text>
<rect x="24" y="88" width="190" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="109" font-size="12" fill="#ececec" text-anchor="start">Claim</text>
<rect x="214" y="88" width="300" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="224" y="109" font-size="12" fill="#ececec" text-anchor="start">What to ask</text>
<rect x="514" y="88" width="362" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="524" y="109" font-size="12" fill="#ececec" text-anchor="start">Why it matters</text>
<rect x="24" y="122" width="190" height="96" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="146" font-size="11" fill="#ececec" text-anchor="start">&quot;4000 tokens/s&quot;</text>
<rect x="214" y="122" width="300" height="96" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="224" y="146" font-size="11" fill="#a8a8a8" text-anchor="start">At what batch size and sequence length?</text>
<rect x="514" y="122" width="362" height="96" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="524" y="146" font-size="11" fill="#a8a8a8" text-anchor="start">Batch 64 at 128 tokens is a different universe from</text>
<text x="524" y="163" font-size="11" fill="#a8a8a8" text-anchor="start">batch 4 at 4k tokens.</text>
<rect x="24" y="218" width="190" height="96" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="242" font-size="11" fill="#ececec" text-anchor="start">&quot;2.5x faster&quot;</text>
<rect x="214" y="218" width="300" height="96" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="224" y="242" font-size="11" fill="#a8a8a8" text-anchor="start">Faster than what baseline, on what hardware?</text>
<rect x="514" y="218" width="362" height="96" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="524" y="242" font-size="11" fill="#a8a8a8" text-anchor="start">Beating a naive baseline on different GPUs proves</text>
<text x="524" y="259" font-size="11" fill="#a8a8a8" text-anchor="start">nothing.</text>
<rect x="24" y="314" width="190" height="96" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="338" font-size="11" fill="#ececec" text-anchor="start">&quot;p99 under 1s&quot;</text>
<rect x="214" y="314" width="300" height="96" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="224" y="338" font-size="11" fill="#a8a8a8" text-anchor="start">At what concurrency and prompt mix?</text>
<rect x="514" y="314" width="362" height="96" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="524" y="338" font-size="11" fill="#a8a8a8" text-anchor="start">p99 at 10 req/s says nothing about p99 at 200 req/s.</text>
<rect x="24" y="410" width="190" height="96" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="434" font-size="11" fill="#ececec" text-anchor="start">&quot;INT4, no quality loss&quot;</text>
<rect x="214" y="410" width="300" height="96" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="224" y="434" font-size="11" fill="#a8a8a8" text-anchor="start">Which evals, and was the sampler fixed?</text>
<rect x="514" y="410" width="362" height="96" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="524" y="434" font-size="11" fill="#a8a8a8" text-anchor="start">Perplexity alone hides reasoning damage (Chapter 5).</text>
<rect x="24" y="532" width="852" height="120" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="564" font-size="14" font-weight="bold" fill="#e57ea6" text-anchor="middle">Warning</text>
<text x="48" y="592" font-size="11" fill="#a8a8a8" text-anchor="start">Treat any vendor speedup claim as a rumor until you have the batch size, sequence lengths, sampler and</text>
<text x="48" y="609" font-size="11" fill="#a8a8a8" text-anchor="start">seed, hardware, and the baseline it beat. If the benchmark section cannot name its baseline, walk away.</text>
</svg>