<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 631" role="img" aria-label="Extrapolation discipline: the log-log fit and the 10x wall">
<rect width="900" height="631" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Extrapolation discipline: the log-log fit and the 10x wall</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Fitting a power law is easy. Trusting it is the skill.</text>
<line x1="90.0" y1="409.0" x2="620.0" y2="409.0" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="90.0" y1="409.0" x2="90.0" y2="119.0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="82.0" y="429.0" text-anchor="end" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">log(C)</text>
<text x="90.0" y="111.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">log(L)</text>
<text x="355.0" y="449.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Fit on the solid points -&gt; check one held-out point -&gt; only then extend the dotted line</text>
<line x1="127.9" y1="141.6" x2="139.2" y2="143.0" stroke="#2dd4bf" stroke-width="2"/>
<line x1="139.2" y1="143.0" x2="150.6" y2="144.3" stroke="#2dd4bf" stroke-width="2"/>
<line x1="150.6" y1="144.3" x2="161.9" y2="145.7" stroke="#2dd4bf" stroke-width="2"/>
<line x1="161.9" y1="145.7" x2="173.3" y2="147.0" stroke="#2dd4bf" stroke-width="2"/>
<line x1="173.3" y1="147.0" x2="184.6" y2="148.4" stroke="#2dd4bf" stroke-width="2"/>
<line x1="184.6" y1="148.4" x2="196.0" y2="149.7" stroke="#2dd4bf" stroke-width="2"/>
<line x1="196.0" y1="149.7" x2="207.4" y2="151.1" stroke="#2dd4bf" stroke-width="2"/>
<line x1="207.4" y1="151.1" x2="218.7" y2="152.4" stroke="#2dd4bf" stroke-width="2"/>
<line x1="218.7" y1="152.4" x2="230.1" y2="153.8" stroke="#2dd4bf" stroke-width="2"/>
<line x1="230.1" y1="153.8" x2="241.4" y2="155.1" stroke="#2dd4bf" stroke-width="2"/>
<line x1="241.4" y1="155.1" x2="252.8" y2="156.5" stroke="#2dd4bf" stroke-width="2"/>
<line x1="252.8" y1="156.5" x2="264.1" y2="157.8" stroke="#2dd4bf" stroke-width="2"/>
<line x1="264.1" y1="157.8" x2="275.5" y2="159.2" stroke="#2dd4bf" stroke-width="2"/>
<line x1="275.5" y1="159.2" x2="286.9" y2="160.5" stroke="#2dd4bf" stroke-width="2"/>
<line x1="286.9" y1="160.5" x2="298.2" y2="161.9" stroke="#2dd4bf" stroke-width="2"/>
<line x1="298.2" y1="161.9" x2="309.6" y2="163.2" stroke="#2dd4bf" stroke-width="2"/>
<line x1="309.6" y1="163.2" x2="320.9" y2="164.6" stroke="#2dd4bf" stroke-width="2"/>
<line x1="320.9" y1="164.6" x2="332.3" y2="165.9" stroke="#2dd4bf" stroke-width="2"/>
<line x1="332.3" y1="165.9" x2="343.6" y2="167.3" stroke="#2dd4bf" stroke-width="2"/>
<line x1="343.6" y1="167.3" x2="355.0" y2="168.6" stroke="#2dd4bf" stroke-width="2"/>
<line x1="355.0" y1="168.6" x2="366.4" y2="170.0" stroke="#2dd4bf" stroke-width="2"/>
<circle cx="150.6" cy="144.6" r="5" fill="#f0b429"/>
<circle cx="211.1" cy="150.2" r="5" fill="#f0b429"/>
<circle cx="271.7" cy="159.6" r="5" fill="#f0b429"/>
<circle cx="332.3" cy="165.2" r="5" fill="#f0b429"/>
<text x="144.6" y="128.6" text-anchor="end" fill="#f0b429" font-size="10.5" font-family="Charis SIL, Georgia, serif">small runs (fitted)</text>
<rect x="378.3" y="165.8" width="14.0" height="14.0" rx="6" fill="none" stroke="#4caf50" stroke-width="2.5"/>
<text x="385.3" y="198.8" text-anchor="middle" fill="#4caf50" font-size="10.5" font-family="Charis SIL, Georgia, serif">held-out largest run:</text>
<text x="385.3" y="214.8" text-anchor="middle" fill="#4caf50" font-size="10.5" font-family="Charis SIL, Georgia, serif">measure the error here</text>
<rect x="461.0" y="119.0" width="159.0" height="300.0" rx="6" fill="#2a1414" stroke="none" stroke-width="1"/>
<line x1="385.3" y1="172.2" x2="589.7" y2="196.5" stroke="#e5484d" stroke-width="2" stroke-dasharray="5,4"/>
<text x="540.5" y="387.0" text-anchor="middle" fill="#e5484d" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">DANGER: past ~10x your</text>
<text x="540.5" y="405.0" text-anchor="middle" fill="#e5484d" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">largest fitted run</text>
<text x="40.0" y="479.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">- Fit in log space: power laws are straight lines in log-log space.</text>
<text x="40.0" y="503.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">- Hold out the largest run. That error is your honest extrapolation uncertainty.</text>
<text x="40.0" y="527.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">- Never extrapolate further than about 10x past your largest fitted run without new data.</text>
<text x="40.0" y="551.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">- Laws predict loss, not task scores. A predicted 0.05 loss improvement is not '+2 benchmark points'.</text>
<text x="40.0" y="575.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">- Watch for breaks: change the data mix and the constants refit. The law is a property of the setup.</text>
</svg>
