<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="t08cl-title t08cl-desc">
<title id="t08cl-title">Three cache layers in front of the model</title>
<desc id="t08cl-desc">Three boxes in a row. Prompt cache: identical prompts, 90 percent hit rate on repeated system prompts. Semantic cache: similar questions, 60 percent hit rate, needs a similarity threshold. KV cache: inside generation, reuses attention math for the shared prefix.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="420" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">CACHE LAYERS (CHEAPEST FIRST)</text>
<rect x="30" y="70" width="270" height="150" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="165.0" y="104" class="box" fill="#ececec">1. prompt cache</text>
<text x="165.0" y="126" class="d">exact prompt repeats</text>
<text x="165.0" y="144" class="d">hit rate about 90%</text>
<text x="165" y="250" class="cap" fill="#a8a8a8">saves full call</text>
<rect x="330" y="70" width="270" height="150" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="465.0" y="104" class="box" fill="#ececec">2. semantic cache</text>
<text x="465.0" y="126" class="d">similar past questions</text>
<text x="465.0" y="144" class="d">hit rate about 60%</text>
<text x="465" y="250" class="cap" fill="#a8a8a8">needs threshold</text>
<rect x="630" y="70" width="270" height="150" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="765.0" y="104" class="box" fill="#ececec">3. KV cache</text>
<text x="765.0" y="126" class="d">shared prefix tokens</text>
<text x="765.0" y="144" class="d">always on</text>
<text x="765" y="250" class="cap" fill="#a8a8a8">saves recompute</text>
<line x1="300" y1="145" x2="330" y2="145" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t08cl-ah)"/>
<line x1="600" y1="145" x2="630" y2="145" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t08cl-ah)"/>
<text x="30" y="320" class="dl">Order matters: check prompt cache, then semantic cache, then call the model.</text>
<text x="30" y="342" class="dl">A wrong semantic-cache hit is worse than a miss: it returns a confident wrong answer.</text>
<text x="30" y="384" class="capl">How to read: left to right = order of checks. Color = layer. Text = what it saves.</text>
</g>
<defs><marker id="t08cl-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>