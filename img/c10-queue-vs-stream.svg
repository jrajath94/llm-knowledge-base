<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 381" role="img" aria-label="Queue vs stream: delivery vs history">
<rect width="900" height="381" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Queue vs stream: delivery vs history</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A queue deletes after delivery. A stream keeps the log so new consumers can replay from any point.</text>
<rect x="30.0" y="77.0" width="420.0" height="210.0" rx="6" fill="#111111" stroke="#e5484d" stroke-width="1.5"/>
<text x="48.0" y="105.0" text-anchor="start" fill="#e5484d" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">QUEUE: at-least-once delivery</text>
<text x="48.0" y="129.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">producer -&gt; queue -&gt; one consumer</text>
<text x="48.0" y="149.2" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">message is DELETED once delivered</text>
<text x="48.0" y="169.4" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">scale = more consumers (competing)</text>
<rect x="48.0" y="245.0" width="384.0" height="28.0" rx="6" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="264.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">no rewind</text>
<rect x="465.0" y="77.0" width="420.0" height="210.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="483.0" y="105.0" text-anchor="start" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">STREAM: ordered, replayable log</text>
<text x="483.0" y="129.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">producer -&gt; append-only partitions</text>
<text x="483.0" y="149.2" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">offset committed by each consumer group</text>
<text x="483.0" y="169.4" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">scale = more partitions (ordered within</text>
<text x="483.0" y="185.6" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">each)</text>
<rect x="483.0" y="245.0" width="384.0" height="28.0" rx="6" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
<text x="495.0" y="264.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">rewind by resetting the offset</text>
<text x="40.0" y="315.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Both need idempotent consumers: at-least-once means duplicates arrive. Exactly-once is a property of</text>
<text x="40.0" y="331.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">the whole pipeline (broker plus consumer transaction), never of the broker alone.</text>
</svg>
