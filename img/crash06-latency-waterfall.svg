<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.2. Step latency: 150ms + 300 x 7ms + 200ms = 2450ms</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">12 steps at 2.45s is 29.4 seconds of wall clock</text>
<rect x="90" y="150" width="39.183673469387756" height="70" fill="#6cb2ff" rx="4" opacity="0.85"/>
<text x="109.59183673469389" y="138" font-size="11" font-weight="bold" fill="#6cb2ff" text-anchor="middle">model 150ms</text>
<rect x="129.18367346938777" y="150" width="548.5714285714286" height="70" fill="#f0b429" rx="4" opacity="0.85"/>
<text x="403.46938775510205" y="190.0" font-size="11" font-weight="bold" fill="#0b0e13" text-anchor="middle">300 tokens x 7ms</text>
<rect x="677.7551020408164" y="150" width="52.244897959183675" height="70" fill="#4fd1a5" rx="4" opacity="0.85"/>
<text x="703.8775510204082" y="138" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">overhead 200ms</text>
<text x="90" y="250" font-size="13" fill="#ececec" text-anchor="start">one step: 2,450 ms</text>
<text x="90" y="278" font-size="13" fill="#e57ea6" text-anchor="start">12 steps: 29.4 s wall clock</text>
<text x="24" y="400" font-size="12" fill="#a8a8a8" text-anchor="start">The decode term dominates: 300 output tokens at 7ms each is 2.1 of the 2.45 seconds. Shorter outputs beat</text>
<text x="24" y="418" font-size="12" fill="#a8a8a8" text-anchor="start">a faster model: budget output length before you chase TTFT.</text>
<text x="24" y="460" font-size="12" fill="#a8a8a8" text-anchor="start">Budget per step before you build, then measure: the waterfall tells you which segment to attack first.</text>
</svg>