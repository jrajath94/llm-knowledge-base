<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 360' width='100%' role='img'><text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>The study loop: how a chapter becomes understanding</text><rect x='40' y='68' width='260' height='84' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='170' y='102' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Read the chapter</text><text x='170' y='126' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>one idea, from zero</text><rect x='350' y='68' width='260' height='84' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='480' y='102' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Work it by hand</text><text x='480' y='126' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the worked example's numbers</text><rect x='660' y='68' width='260' height='84' rx='10' fill='#0d0d0d' stroke='#2e7d32' stroke-width='2'/><text x='790' y='102' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Run the lab</text><text x='790' y='126' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>change one variable, observe</text><rect x='660' y='208' width='260' height='84' rx='10' fill='#0d0d0d' stroke='#00838f' stroke-width='2'/><text x='790' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Re-explain aloud</text><text x='790' y='266' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>from memory, in plain words</text><rect x='350' y='208' width='260' height='84' rx='10' fill='#0d0d0d' stroke='#e65100' stroke-width='2'/><text x='480' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Find the gap</text><text x='480' y='266' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>what you could not say</text><rect x='40' y='208' width='260' height='84' rx='10' fill='#0d0d0d' stroke='#c62828' stroke-width='2'/><text x='170' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Re-read / retry</text><text x='170' y='266' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>target only the gap</text><line x1='305' y1='110' x2='345' y2='110' stroke='#f0b429' stroke-width='3'/><polygon points='345,110 336,105 336,115' fill='#f0b429'/><line x1='615' y1='110' x2='655' y2='110' stroke='#f0b429' stroke-width='3'/><polygon points='655,110 646,105 646,115' fill='#f0b429'/><line x1='790' y1='157' x2='790' y2='203' stroke='#f0b429' stroke-width='3'/><polygon points='790,203 781,198 781,208' fill='#f0b429'/><line x1='655' y1='250' x2='615' y2='250' stroke='#f0b429' stroke-width='3'/><polygon points='615,250 624,245 624,255' fill='#f0b429'/><line x1='345' y1='250' x2='305' y2='250' stroke='#f0b429' stroke-width='3'/><polygon points='305,250 314,245 314,255' fill='#f0b429'/><line x1='170' y1='203' x2='170' y2='157' stroke='#f0b429' stroke-width='3'/><polygon points='170,157 165,166 175,166' fill='#f0b429'/><text x='480' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Done means: define every term, redo the numbers, explain the diagram, answer the design prompts.</text></svg>