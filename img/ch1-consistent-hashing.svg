<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img' aria-label='Consistent hashing ring: keys map to the next node clockwise; adding a node moves only nearby keys'>
<text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec'>Consistent hashing: the ring owns the keys, not a table</text>
<text x='20' y='54' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Hash every node and every key onto one circle. Each key belongs to the first node clockwise from it.</text>

<!-- BEFORE ring -->
<circle cx='240' cy='250' r='150' fill='none' stroke='#262626' stroke-width='2'/>
<text x='240' y='92' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>before: 4 nodes</text>
<!-- nodes A B C D at 90deg intervals, starting top going clockwise -->
<circle cx='240' cy='100' r='14' fill='#64b5f6'/><text x='240' y='105' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>A</text>
<circle cx='390' cy='250' r='14' fill='#64b5f6'/><text x='390' y='255' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>B</text>
<circle cx='240' cy='400' r='14' fill='#64b5f6'/><text x='240' y='405' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>C</text>
<circle cx='90' cy='250' r='14' fill='#64b5f6'/><text x='90' y='255' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>D</text>
<!-- keys as dots: k1 near top-right (owned by B), k2 right (B), k3 bottom-right (C), k4 left (D), k5 top-left (A) -->
<circle cx='330' cy='150' r='7' fill='#f0b429'/><text x='344' y='154' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k1&#8594;B</text>
<circle cx='368' cy='300' r='7' fill='#f0b429'/><text x='330' y='330' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k2&#8594;B</text>
<circle cx='300' cy='370' r='7' fill='#f0b429'/><text x='312' y='392' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k3&#8594;C</text>
<circle cx='130' cy='330' r='7' fill='#f0b429'/><text x='100' y='362' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k4&#8594;D</text>
<circle cx='150' cy='140' r='7' fill='#f0b429'/><text x='120' y='128' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k5&#8594;A</text>

<text x='480' y='255' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='26' fill='#f0b429' text-anchor='middle'>&#8594;</text>
<text x='480' y='280' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>add node E</text>

<!-- AFTER ring -->
<circle cx='720' cy='250' r='150' fill='none' stroke='#262626' stroke-width='2'/>
<text x='720' y='92' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>after: E joins between D and A</text>
<circle cx='720' cy='100' r='14' fill='#64b5f6'/><text x='720' y='105' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>A</text>
<circle cx='870' cy='250' r='14' fill='#64b5f6'/><text x='870' y='255' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>B</text>
<circle cx='720' cy='400' r='14' fill='#64b5f6'/><text x='720' y='405' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>C</text>
<circle cx='570' cy='250' r='14' fill='#64b5f6'/><text x='570' y='255' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>D</text>
<!-- E at top-left arc between D and A -->
<circle cx='614' cy='144' r='14' fill='#7bc96f'/><text x='614' y='149' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#000' text-anchor='middle'>E</text>
<!-- keys: k5 was owned by A, now owned by E (moved). Others unchanged. -->
<circle cx='810' cy='150' r='7' fill='#f0b429'/><text x='824' y='154' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k1&#8594;B</text>
<circle cx='848' cy='300' r='7' fill='#f0b429'/><text x='810' y='330' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k2&#8594;B</text>
<circle cx='780' cy='370' r='7' fill='#f0b429'/><text x='792' y='392' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k3&#8594;C</text>
<circle cx='610' cy='330' r='7' fill='#f0b429'/><text x='580' y='362' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8'>k4&#8594;D</text>
<circle cx='630' cy='140' r='7' fill='#e06c60'/><text x='596' y='122' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#e06c60'>k5&#8594;E (moved)</text>

<text x='20' y='448' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Only the keys on the arc E claimed change owners. With plain mod-N hashing, nearly every key would move.</text>
</svg>
