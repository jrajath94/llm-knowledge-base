<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Failure math: MTBF falls as GPU count rises; the checkpoint is mostly optimizer state</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">per-GPU-hour failure rate ~1.97e-5 from the Llama 3 run (419 unexpected / 16,384 x 54 x 24)</text>
<text x="24" y="110" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">MTBF vs fleet size (inverse scaling)</text>
<text x="24" y="157" font-size="12" fill="#a8a8a8" text-anchor="start">1,000 GPUs</text>
<rect x="220" y="140" width="560.0" height="26" fill="#6cb2ff" rx="3" opacity="0.9"/>
<text x="790.0" y="158" font-size="12" fill="#ececec" text-anchor="start">~50.7 h</text>
<text x="24" y="203" font-size="12" fill="#a8a8a8" text-anchor="start">16,384 GPUs</text>
<rect x="220" y="186" width="34.24063116370809" height="26" fill="#e57ea6" rx="3" opacity="0.9"/>
<text x="264.2406311637081" y="204" font-size="12" fill="#ececec" text-anchor="start">~3.1 h</text>
<text x="24" y="270" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">Checkpoint anatomy, 70B + Adam + BF16 (700 GB total)</text>
<rect x="24" y="300" width="140.0" height="40" fill="#6cb2ff" rx="4" opacity="0.85"/>
<rect x="164.0" y="300" width="560.0" height="40" fill="#b388ff" rx="4" opacity="0.85"/>
<text x="94.0" y="325" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">params 140 GB</text>
<text x="444.0" y="325" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">Adam state 560 GB (4:1)</text>
<text x="24" y="362" font-size="12" fill="#e57ea6" text-anchor="start">Any scheme that saves only parameters is not a resume; it is a restart with amnesia.</text>
<text x="24" y="400" font-size="12" fill="#a8a8a8" text-anchor="start">Llama 3 scale: 16,384 H100s, 54 days, 466 interruptions (47 planned, 419 unexpected): about one</text>
<text x="24" y="417" font-size="12" fill="#a8a8a8" text-anchor="start">failure every 3 hours. Effective training time stayed above 90% via automation.</text>
</svg>