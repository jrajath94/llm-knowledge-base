<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" style="max-width:760px" role="img" aria-label="Flowchart: eval score jumps after a data change, run n-gram overlap, overlap found means leaked, no overlap means a real gain.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">Rule 8: the contamination check</text>
<rect x="250" y="55" width="260" height="60" rx="8" class="pick"/>
<text x="380" y="80" text-anchor="middle" class="big">Eval score jumps</text>
<text x="380" y="100" text-anchor="middle" class="m">after a data change</text>
<path class="arr" d="M380 115 L380 145"/>
<rect x="230" y="145" width="300" height="64" rx="8" class="box"/>
<text x="380" y="170" text-anchor="middle" class="big">Run n-gram overlap check</text>
<text x="380" y="190" text-anchor="middle" class="m">train vs eval items</text>
<path class="arr" d="M380 209 L380 240"/>
<rect x="280" y="240" width="200" height="52" rx="8" class="box"/>
<text x="380" y="270" text-anchor="middle" class="big">Overlap found?</text>
<path class="arr" d="M280 266 L150 266"/>
<text x="205" y="250" text-anchor="middle" class="lbl">yes</text>
<rect x="40" y="240" width="220" height="84" rx="8" class="box"/>
<text x="150" y="268" text-anchor="middle" class="big">LEAKED</text>
<text x="150" y="290" text-anchor="middle" class="m">do not celebrate</text>
<text x="150" y="308" text-anchor="middle" class="m">fix the data</text>
<path class="arr" d="M480 266 L610 266"/>
<text x="555" y="250" text-anchor="middle" class="lbl">no</text>
<rect x="500" y="240" width="220" height="84" rx="8" class="box"/>
<text x="610" y="268" text-anchor="middle" class="big">REAL GAIN</text>
<text x="610" y="290" text-anchor="middle" class="m">the jump survived</text>
<text x="610" y="308" text-anchor="middle" class="m">the check</text>
</svg>