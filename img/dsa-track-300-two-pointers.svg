<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 520" role="img" aria-label="Two pointers on a sorted array: target 9">
<rect width="900" height="520" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Two pointers on a sorted array: target 9</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">The pointers start at both ends. The sum tells you which pointer to move.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<text x="40" y="124" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">step 1</text>
<rect x="120" y="90" width="64" height="48" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="152.0" y="120" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">1</text>
<text x="152.0" y="162" text-anchor="middle" fill="#6aa8ff" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">left</text>
<rect x="192" y="90" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="224.0" y="120" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">2</text>
<rect x="264" y="90" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="296.0" y="120" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">3</text>
<rect x="336" y="90" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="368.0" y="120" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">4</text>
<rect x="408" y="90" width="64" height="48" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="440.0" y="120" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">6</text>
<text x="440.0" y="162" text-anchor="middle" fill="#6aa8ff" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">right</text>
<text x="500" y="120" text-anchor="start" fill="#6aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif">1 + 6 = 7 &lt; 9: move left right</text>
<text x="40" y="244" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">step 2</text>
<rect x="120" y="210" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="152.0" y="240" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">1</text>
<rect x="192" y="210" width="64" height="48" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="224.0" y="240" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">2</text>
<text x="224.0" y="282" text-anchor="middle" fill="#6aa8ff" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">left</text>
<rect x="264" y="210" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="296.0" y="240" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">3</text>
<rect x="336" y="210" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="368.0" y="240" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">4</text>
<rect x="408" y="210" width="64" height="48" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="440.0" y="240" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">6</text>
<text x="440.0" y="282" text-anchor="middle" fill="#6aa8ff" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">right</text>
<text x="500" y="240" text-anchor="start" fill="#6aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif">2 + 6 = 8 &lt; 9: move left right</text>
<text x="40" y="364" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">step 3</text>
<rect x="120" y="330" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="152.0" y="360" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">1</text>
<rect x="192" y="330" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="224.0" y="360" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">2</text>
<rect x="264" y="330" width="64" height="48" rx="6" fill="#1a1a1a" stroke="#7bc96f"/>
<text x="296.0" y="360" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">3</text>
<text x="296.0" y="402" text-anchor="middle" fill="#7bc96f" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">left</text>
<rect x="336" y="330" width="64" height="48" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="368.0" y="360" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">4</text>
<rect x="408" y="330" width="64" height="48" rx="6" fill="#1a1a1a" stroke="#7bc96f"/>
<text x="440.0" y="360" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">6</text>
<text x="440.0" y="402" text-anchor="middle" fill="#7bc96f" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">right</text>
<text x="500" y="360" text-anchor="start" fill="#7bc96f" font-size="13" font-family="Charis SIL, Georgia, serif">3 + 6 = 9: match found</text>
<text x="40" y="460" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Why it works: the array is sorted, so a small sum means the left value is too small.</text>
<text x="40" y="482" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Each step removes one candidate. No pair is ever checked twice: O(n) time.</text>
</svg>
