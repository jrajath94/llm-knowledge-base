<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 560" role="img" aria-label="One tree, three visit orders">
<rect width="900" height="560" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">One tree, three visit orders</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">The order changes which node you record: before, between, or after its children.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<line x1="450" y1="130" x2="300" y2="230" stroke="#3a3a3a" stroke-width="2"/>
<line x1="450" y1="130" x2="600" y2="230" stroke="#3a3a3a" stroke-width="2"/>
<line x1="300" y1="230" x2="220" y2="330" stroke="#3a3a3a" stroke-width="2"/>
<line x1="300" y1="230" x2="380" y2="330" stroke="#3a3a3a" stroke-width="2"/>
<line x1="600" y1="230" x2="540" y2="330" stroke="#3a3a3a" stroke-width="2"/>
<circle cx="450" cy="130" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="450" y="136" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">1</text>
<circle cx="300" cy="230" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="300" y="236" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">2</text>
<circle cx="600" cy="230" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="600" y="236" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">3</text>
<circle cx="220" cy="330" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="220" y="336" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">4</text>
<circle cx="380" cy="330" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="380" y="336" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">5</text>
<circle cx="540" cy="330" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="540" y="336" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">6</text>
<text x="450" y="400" text-anchor="start" fill="#e06c75" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">preorder: visit node, then left, then right</text>
<text x="450" y="424" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">1  2  4  5  3  6</text>
<text x="450" y="458" text-anchor="start" fill="#6aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">inorder: visit left, then node, then right</text>
<text x="450" y="482" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">4  2  5  1  6  3</text>
<text x="450" y="516" text-anchor="start" fill="#7bc96f" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">postorder: visit children first, node last</text>
<text x="450" y="540" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif">4  5  2  6  3  1</text>
</svg>
