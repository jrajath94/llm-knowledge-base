<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The mitigation stack: five layers, each catching what the last missed</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">no single layer survives the skilled adversary; the stack might</text>
<rect x="140" y="100" width="600" height="60" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="125" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SYSTEM PROMPT</text>
<text x="440" y="144" font-size="11" fill="#a8a8a8" text-anchor="middle">the model&#x27;s standing orders; cheapest to change, first to fall</text>
<line x1="440" y1="160" x2="440" y2="178" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,178 436.33015592246386,169.78219953718923 443.66984407753614,169.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="178" width="600" height="60" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="203" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INPUT FILTER</text>
<text x="440" y="222" font-size="11" fill="#a8a8a8" text-anchor="middle">classifiers and rules on the way in; blocks known patterns</text>
<line x1="440" y1="238" x2="440" y2="256" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,256 436.33015592246386,247.78219953718923 443.66984407753614,247.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="256" width="600" height="60" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="281" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">MODEL ITSELF</text>
<text x="440" y="300" font-size="11" fill="#a8a8a8" text-anchor="middle">alignment training; the layer that generalizes to novel attacks</text>
<line x1="440" y1="316" x2="440" y2="334" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,334 436.33015592246386,325.78219953718923 443.66984407753614,325.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="334" width="600" height="60" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="359" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">OUTPUT FILTER</text>
<text x="440" y="378" font-size="11" fill="#a8a8a8" text-anchor="middle">classifiers and rules on the way out; the last deterministic gate</text>
<line x1="440" y1="394" x2="440" y2="412" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,412 436.33015592246386,403.78219953718923 443.66984407753614,403.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="412" width="600" height="60" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="437" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">MONITORING</text>
<text x="440" y="456" font-size="11" fill="#a8a8a8" text-anchor="middle">logging, alerting, and human review; catches what ships anyway</text>
<text x="140" y="480" font-size="12" fill="#a8a8a8" text-anchor="start">attack pressure flows down</text>
<line x1="120" y1="470" x2="120" y2="430" stroke="#e57ea6" stroke-width="2"/>
<polygon points="120,430 123.66984407753613,438.21780046281077 116.33015592246387,438.21780046281077" fill="#e57ea6"/>
<text x="24" y="530" font-size="12" fill="#a8a8a8" text-anchor="start">Defense in depth is not a slogan: measure the break rate with each layer on and off, so you know which layer</text>
<text x="24" y="547" font-size="12" fill="#a8a8a8" text-anchor="start">is actually load-bearing.</text>
</svg>