y='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>derivative near zero, gradients die</text><text x='240' y='384' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#e57ea6' text-anchor='middle'>in deep stacks the dying compounds</text><text x='720' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>ReLU: derivative 1 or 0, nothing in between</text><line x1='570' y1='300' x2='720' y2='300' stroke='#4fd1a5' stroke-width='4'/><line x1='720' y1='300' x2='870' y2='140' stroke='#4fd1a5' stroke-width='4'/><line x1='570' y1='300' x2='870' y2='300' stroke='#3a3a3a' stroke-width='2'/><text x='645' y='284' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>deriv 0</text><text x='800' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>deriv 1</text><rect x='540' y='356' width='360' height='56' rx='8' fill='#141414' stroke='#e57373' stroke-width='1.5'/><text x='720' y='378' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#e57373' text-anchor='middle'>Dead ReLU: input always negative -&gt; output always 0</text><text x='720' y='400' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>no gradient -&gt; no update -&gt; never recovers</text></svg>