fill="#a8a8a8" text-anchor="end">exp 20%</text><text x="112" y="265" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="end">act 23%</text><text x="754" y="252" font-size="13" font-weight="700" fill="#ececec" text-anchor="start">+0.0112</text><text x="38" y="300" font-size="14" font-weight="700" fill="#ececec" text-anchor="start">PSI = 0.0223 + 0.0077 + 0.0112 = 0.041. Below 0.1: no significant change.</text><text x="38" y="326" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="start">Gray: expected share. Gold: actual share. Small gaps mean a calm week.</text></svg>