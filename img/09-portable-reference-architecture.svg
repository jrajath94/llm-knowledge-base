<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="800" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The portable reference architecture</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Reconstructed from RRK ch 5: read top to bottom as the request&#x27;s journey, bottom to top as the dependencies</text>
<rect x="140" y="94" width="620" height="48" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="124" font-size="12" font-weight="bold" fill="#8a8a8a" text-anchor="middle">USER REQUEST</text>
<line x1="450.0" y1="142" x2="450.0" y2="154" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,154 446.33015592246386,145.78219953718923 453.66984407753614,145.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="154" width="620" height="56" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="178" font-size="12" font-weight="bold" fill="#6cb2ff" text-anchor="middle">API GATEWAY</text>
<text x="450.0" y="196" font-size="10" fill="#a8a8a8" text-anchor="middle">auth, rate limits, tenant routing</text>
<line x1="450.0" y1="210" x2="450.0" y2="222" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,222 446.33015592246386,213.78219953718923 453.66984407753614,213.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="222" width="620" height="56" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="246" font-size="12" font-weight="bold" fill="#4fd1a5" text-anchor="middle">ORCHESTRATOR</text>
<text x="450.0" y="264" font-size="10" fill="#a8a8a8" text-anchor="middle">the agent loop (Path A): plans, calls tools</text>
<line x1="450.0" y1="278" x2="450.0" y2="290" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,290 446.33015592246386,281.78219953718923 453.66984407753614,281.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="290" width="620" height="56" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="314" font-size="12" font-weight="bold" fill="#f0b429" text-anchor="middle">TOOL BUS</text>
<text x="450.0" y="332" font-size="10" fill="#a8a8a8" text-anchor="middle">search, SQL, internal APIs (each with timeouts)</text>
<line x1="450.0" y1="346" x2="450.0" y2="358" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,358 446.33015592246386,349.78219953718923 453.66984407753614,349.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="358" width="620" height="56" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="382" font-size="12" font-weight="bold" fill="#b388ff" text-anchor="middle">RETRIEVAL</text>
<text x="450.0" y="400" font-size="10" fill="#a8a8a8" text-anchor="middle">embed, vector search, rerank (Path B)</text>
<line x1="450.0" y1="414" x2="450.0" y2="426" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,426 446.33015592246386,417.78219953718923 453.66984407753614,417.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="426" width="620" height="56" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="450" font-size="12" font-weight="bold" fill="#e57ea6" text-anchor="middle">GUARDRAILS</text>
<text x="450.0" y="468" font-size="10" fill="#a8a8a8" text-anchor="middle">input screen, PII redact, permission filter (Path D)</text>
<line x1="450.0" y1="482" x2="450.0" y2="494" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,494 446.33015592246386,485.78219953718923 453.66984407753614,485.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="494" width="620" height="56" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="518" font-size="12" font-weight="bold" fill="#7dd87d" text-anchor="middle">MODEL SERVING</text>
<text x="450.0" y="536" font-size="10" fill="#a8a8a8" text-anchor="middle">batched, quantized, spec-decoded (Volume 8)</text>
<line x1="450.0" y1="550" x2="450.0" y2="562" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,562 446.33015592246386,553.7821995371892 453.66984407753614,553.7821995371892" fill="#8a8a8a"/>
<rect x="140" y="562" width="620" height="56" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="586" font-size="12" font-weight="bold" fill="#f0b429" text-anchor="middle">OBSERVABILITY</text>
<text x="450.0" y="604" font-size="10" fill="#a8a8a8" text-anchor="middle">traces, token/cost meters, eval scores (Path C)</text>
<line x1="450.0" y1="618" x2="450.0" y2="630" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450.0,630 446.33015592246386,621.7821995371892 453.66984407753614,621.7821995371892" fill="#8a8a8a"/>
<rect x="140" y="630" width="620" height="56" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="654" font-size="12" font-weight="bold" fill="#6cb2ff" text-anchor="middle">DATA PLANE</text>
<text x="450.0" y="672" font-size="10" fill="#a8a8a8" text-anchor="middle">sessions, memory, audit log, golden sets</text>
</svg>