<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 460' width='100%' role='img'><rect x='0' y='0' width='960' height='460' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>When memory runs out: three eviction policies</text><text x='40' y='100' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>Sliding window</text><rect x='180' y='90' width='650' height='26' rx='6' fill='#141414' stroke='#3a3a3a'/><rect x='537.5' y='90' width='292.5' height='26' rx='6' fill='#1565c0' opacity='0.8'/><text x='683.75' y='108' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#ececec' text-anchor='middle'>keep last N</text><text x='40' y='170' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>StreamingLLM</text><rect x='180' y='160' width='650' height='26' rx='6' fill='#141414' stroke='#3a3a3a'/><rect x='180' y='160' width='52.0' height='26' rx='6' fill='#f0b429' opacity='0.8'/><rect x='537.5' y='160' width='292.5' height='26' rx='6' fill='#1565c0' opacity='0.8'/><text x='206.0' y='178' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#ececec' text-anchor='middle'>sinks</text><text x='683.75' y='178' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#ececec' text-anchor='middle'>keep last N</text><text x='40' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>H2O</text><rect x='180' y='230' width='650' height='26' rx='6' fill='#141414' stroke='#3a3a3a'/><rect x='180' y='230' width='65.0' height='26' rx='6' fill='#2e9e5b' opacity='0.8'/><rect x='537.5' y='230' width='65.0' height='26' rx='6' fill='#2e9e5b' opacity='0.8'/><text x='700.0' y='248' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#ececec' text-anchor='middle'>20% budget: recent + heavy hitters</text><text x='480' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Every policy keeps the recent past. They differ in what else survives:</text><text x='480' y='350' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>nothing (sliding), the first tokens (StreamingLLM sinks), or the most-attended tokens (H2O).</text><text x='480' y='396' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Eviction is lossy by design. The policy is the bet on what the future will ask about.</text></svg>