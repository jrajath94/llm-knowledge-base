<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The one join that makes drift detectable"><rect x="22" y="14" width="916" height="300" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">MONITORING</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Log every prediction so the outcome can be joined back later</text><rect x="38" y="96" width="211.4532625" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Log</text><text x="54" y="144" font-size="12" fill="#a8a8a8">every prediction with its</text><text x="54" y="160" font-size="12" fill="#a8a8a8">features and the model</text><text x="54" y="176" font-size="12" fill="#a8a8a8">version</text><line x1="259.4532625" y1="144.0" x2="273.4532625" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="273.4532625,139.0 281.4532625,144.0 273.4532625,149.0" fill="#a8a8a8"/><rect x="289.4532625" y="96" width="232.89238749999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="309.4532625" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="309.4532625" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="329.4532625" y="123" font-size="13.5" font-weight="700" fill="#ececec">Wait</text><text x="305.4532625" y="144" font-size="12" fill="#a8a8a8">collect the eventual</text><text x="305.4532625" y="160" font-size="12" fill="#a8a8a8">outcome where observable</text><line x1="532.34565" y1="144.0" x2="546.34565" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="546.34565,139.0 554.34565,144.0 546.34565,149.0" fill="#a8a8a8"/><rect x="562.34565" y="96" width="223.13304999999997" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="582.34565" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="582.34565" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="602.34565" y="123" font-size="13.5" font-weight="700" fill="#ececec">Join</text><text x="578.34565" y="144" font-size="12" fill="#a8a8a8">prediction + features +</text><text x="578.34565" y="160" font-size="12" fill="#a8a8a8">version + outcome in one</text><text x="578.34565" y="176" font-size="12" fill="#a8a8a8">row</text><rect x="38" y="216" width="210.331525" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="238" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="243" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="243" font-size="13.5" font-weight="700" fill="#ececec">Detect</text><text x="54" y="264" font-size="12" fill="#a8a8a8">without that join, drift is</text><text x="54" y="280" font-size="12" fill="#a8a8a8">undetectable</text></svg>