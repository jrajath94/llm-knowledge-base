<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-label="Collective hang diagnosis flowchart">
<rect width="720" height="530" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Hang diagnosis: separate the three causes in order</text>
<rect class="box" x="260" y="50" width="200" height="64" rx="8"/>
<text class="t" x="360" y="74" text-anchor="middle">the job stops moving</text>
<text class="s" x="360" y="94" text-anchor="middle">GPUs at 0%, logs just stop</text>
<line x1="260" y1="50" x2="260" y2="114" stroke="#e5484d" stroke-width="4"/>
<path d="M360,114 L360,140" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<polygon points="280,140 380,182 280,224 180,182" fill="#0d0d0d" stroke="#f0b429" stroke-width="2"/>
<text x="280" y="176" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">did every rank</text>
<text x="280" y="193" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">enter the collective?</text>
<text x="176" y="182" text-anchor="end" fill="#e5484d" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">no</text>
<text x="384" y="182" text-anchor="start" fill="#3fb950" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">yes</text>
<rect class="box" x="10" y="142" width="160" height="80" rx="8"/>
<text class="t" x="90" y="166" text-anchor="middle">rank never entered</text>
<text class="s" x="90" y="186" text-anchor="middle">collective inside a</text>
<text class="s" x="90" y="203" text-anchor="middle">conditional path</text>
<line x1="10" y1="142" x2="10" y2="222" stroke="#e5484d" stroke-width="4"/>
<path d="M180,182 L170,182" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<polygon points="560,140 660,182 560,224 460,182" fill="#0d0d0d" stroke="#f0b429" stroke-width="2"/>
<text x="560" y="176" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">is the network</text>
<text x="560" y="193" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">stalled?</text>
<text x="456" y="182" text-anchor="end" fill="#e5484d" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">yes</text>
<text x="664" y="182" text-anchor="start" fill="#3fb950" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">no</text>
<path d="M380,182 L460,182" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="470" y="250" width="180" height="80" rx="8"/>
<text class="t" x="560" y="274" text-anchor="middle">sick fabric</text>
<text class="s" x="560" y="294" text-anchor="middle">dropped or stalled</text>
<text class="s" x="560" y="311" text-anchor="middle">traffic</text>
<line x1="470" y1="250" x2="470" y2="330" stroke="#e5484d" stroke-width="4"/>
<path d="M560,224 L560,250" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<rect class="box" x="190" y="250" width="180" height="80" rx="8"/>
<text class="t" x="280" y="274" text-anchor="middle">mismatched operation</text>
<text class="s" x="280" y="294" text-anchor="middle">different sizes or dtypes</text>
<text class="s" x="280" y="311" text-anchor="middle">across ranks</text>
<line x1="190" y1="250" x2="190" y2="330" stroke="#f0b429" stroke-width="4"/>
<path d="M280,224 L280,250" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M660,182 L690,182" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M690,182 L690,350" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M690,350 L280,350" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M280,350 L280,330" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="360" y="380" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">NCCL_DEBUG=INFO: read what each rank thinks it is doing</text>
<text x="360" y="406" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">NCCL_TIMEOUT: shorten while debugging so hangs fail fast</text>
<text x="360" y="432" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">NCCL_ALGO / NCCL_PROTO: force Tree/LL or Ring/Simple to isolate</text>
<text x="360" y="458" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">NCCL Flight Recorder: which rank, which op, fastest path</text>
<text x="360" y="505" text-anchor="middle" fill="#e5484d" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">classic trap: a collective inside an if only some ranks take</text>
</svg>