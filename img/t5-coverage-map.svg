<svg xmlns="http://www.w3.org/2000/svg" width="720" height="377" viewBox="0 0 720 377" role="img" aria-label="Capability-risk coverage map">
<rect width="720" height="377" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Task selection: cover the overlap</text>
<circle cx="280" cy="180" r="120" fill="none" stroke="#f0b429" stroke-width="2"/>
<circle cx="440" cy="180" r="120" fill="none" stroke="#e5484d" stroke-width="2"/>
<text x="75" y="130" text-anchor="middle" fill="#f0b429" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">capability map</text>
<text x="75" y="152" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">what the model</text>
<text x="75" y="168" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">must be able to do</text>
<text x="645" y="130" text-anchor="middle" fill="#e5484d" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">risk map</text>
<text x="645" y="152" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">where the harm</text>
<text x="645" y="168" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">lives</text>
<text x="360" y="200" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">test tasks live</text>
<text x="360" y="220" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">in the overlap</text>
<text x="360" y="330" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">sample tasks from the overlap, not from either map alone</text>
<text x="360" y="352" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a task outside the overlap is either untested capability or untested risk</text>
</svg>