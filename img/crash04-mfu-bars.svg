<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">MFU: achieved model FLOPs over hardware peak (70B, 8x H100, BF16)</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">MFU counts only useful math; comm, recompute, and bubbles are not in the numerator</text>
<line x1="90" y1="330" x2="730" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="90" y1="100" x2="90" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="90" y="180.5" width="640" height="34.5" fill="#7dd87d" rx="2" opacity="0.18"/>
<text x="98" y="201.75" font-size="11" fill="#7dd87d" text-anchor="start">healthy 50-65%</text>
<rect x="90" y="238.0" width="640" height="92.0" fill="#e57ea6" rx="2" opacity="0.14"/>
<text x="722" y="318" font-size="11" fill="#e57ea6" text-anchor="end">below 40%: profile now</text>
<rect x="150" y="281.24" width="110" height="48.76" fill="#e57ea6" rx="4" opacity="0.9"/>
<text x="205" y="273.24" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">21.2%</text>
<text x="205" y="350" font-size="11" fill="#a8a8a8" text-anchor="middle">4,000 tok/s</text>
<rect x="350" y="215.0" width="110" height="115.0" fill="#7dd87d" rx="4" opacity="0.9"/>
<text x="405" y="207.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">50.0%</text>
<text x="405" y="350" font-size="11" fill="#a8a8a8" text-anchor="middle">9,423 tok/s</text>
<rect x="550" y="183.49" width="110" height="146.51" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="605" y="175.49" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">63.7%</text>
<text x="605" y="350" font-size="11" fill="#a8a8a8" text-anchor="middle">12,000 tok/s</text>
<text x="24" y="372" font-size="12" fill="#a8a8a8" text-anchor="start">MFU = (6 x N x tok/s / n_gpus) / peak. A healthy 70B run on 8 H100s beats 9,423 tok/s (50%). A</text>
<text x="24" y="389" font-size="12" fill="#a8a8a8" text-anchor="start">measured 21% means something is badly wrong.</text>
</svg>