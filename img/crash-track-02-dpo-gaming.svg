,294 " fill="none" stroke="#e57373" stroke-width="2.5"/><text class="b" x="470" y="262">chosen (held-out)</text><text class="r" x="560" y="300">rejected</text><line x1="440" y1="230" x2="440" y2="300" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="200" y1="180" x2="200" y2="230" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="5,4"/><text class="g" x="330" y="215">gap grows</text><text class="m" x="375" y="95" font-weight="700" fill="#ececec">Loss falls. Chosen log-probs fall too.</text><text class="m" x="375" y="117">The gap grows by pushing rejected</text><text class="m" x="375" y="137">down, not by lifting chosen up.</text><text class="r" x="375" y="169" font-weight="700">That checkpoint is poison.</text></svg>
