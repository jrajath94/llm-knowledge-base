<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="100%" style="max-width:680px" role="img" aria-label="Preemption storm feedback loop: over-admission fills the KV pool, evictions force recompute, the queue grows">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">The preemption storm feeds itself</text>
<text class="m" x="24" y="52">More admitted sequences than KV blocks. The fix is admission control, not hardware.</text>
<rect class="box" x="30" y="110" width="220" height="64" rx="8" stroke="#e57373"/>
<text class="big" x="140" y="148" text-anchor="middle">Over-admission</text>
<rect class="box" x="400" y="110" width="220" height="64" rx="8" stroke="#e57373"/>
<text class="big" x="510" y="148" text-anchor="middle">KV pool fills</text>
<rect class="box" x="400" y="250" width="220" height="64" rx="8" stroke="#e57373"/>
<text class="big" x="510" y="288" text-anchor="middle">Evictions</text>
<rect class="box" x="30" y="250" width="220" height="64" rx="8" stroke="#e57373"/>
<text class="big" x="140" y="278" text-anchor="middle">Recompute burns FLOPs,</text>
<text class="big" x="140" y="298" text-anchor="middle">zero new tokens</text>
<line class="arr" x1="250" y1="142" x2="400" y2="142"/>
<line class="arr" x1="510" y1="174" x2="510" y2="250"/>
<line class="arr" x1="400" y1="282" x2="250" y2="282"/>
<line class="arr" x1="140" y1="250" x2="140" y2="174"/>
<text class="m" x="258" y="166">queue grows,</text>
<text class="m" x="258" y="184">pressure rises</text>
<rect class="box" x="24" y="330" width="632" height="40" rx="8"/>
<text class="m" x="40" y="355">Throughput looks busy while goodput collapses. The graphs lie; the users wait.</text>
</svg>
