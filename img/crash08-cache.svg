<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="540" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.4. Cache strategy: exact first, semantic second</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">cosine &gt; 0.95 plus a TTL</text>
<rect x="24" y="110" width="400" height="140" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">EXACT CACHE</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">byte-identical prompt: return the stored answer, zero</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">model cost</text>
<rect x="456" y="110" width="400" height="140" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SEMANTIC CACHE</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">cosine &gt; 0.95 on the embedding AND inside the TTL;</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">paraphrases hit, drift does not</text>
<rect x="24" y="290" width="832" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="316" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INVALIDATION</text>
<text x="440.0" y="334" font-size="11" fill="#a8a8a8" text-anchor="middle">corpus updates evict affected keys; the TTL is the backstop, not the strategy</text>
<text x="24" y="460" font-size="12" fill="#a8a8a8" text-anchor="start">A cache without invalidation is a stale-answer machine. The TTL bounds the damage; invalidation prevents it.</text>
</svg>