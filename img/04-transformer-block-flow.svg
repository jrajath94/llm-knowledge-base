<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 590' width='100%' role='img'><rect x='0' y='0' width='960' height='590' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>One pre-norm transformer block, end to end</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Follow the numbers 1 to 6. Residuals are the safety rails.</text><rect x='330' y='90' width='300' height='52' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><circle cx='286' cy='116' r='16' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='1.5'/><text x='286' y='121' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>1</text><text x='480.0' y='114' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>x_in</text><text x='480.0' y='132' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>[B, S, d]</text><line x1='480.0' y1='142' x2='480.0' y2='162' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='480.0,162 474.0,153 486.0,153' fill='#8a8a8a'/><rect x='330' y='162' width='300' height='52' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><circle cx='286' cy='188' r='16' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='1.5'/><text x='286' y='193' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>2</text><text x='480.0' y='186' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Norm + Attention</text><text x='480.0' y='204' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>mix across positions</text><line x1='480.0' y1='214' x2='480.0' y2='234' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='480.0,234 474.0,225 486.0,225' fill='#8a8a8a'/><rect x='330' y='234' width='300' height='52' rx='8' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><circle cx='286' cy='260' r='16' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='1.5'/><text x='286' y='265' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>3</text><text x='480.0' y='258' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>+ x_in  (residual)</text><text x='480.0' y='276' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>nothing can be lost</text><line x1='480.0' y1='286' x2='480.0' y2='306' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='480.0,306 474.0,297 486.0,297' fill='#8a8a8a'/><rect x='330' y='306' width='300' height='52' rx='8' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><circle cx='286' cy='332' r='16' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='1.5'/><text x='286' y='337' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>4</text><text x='480.0' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Norm + MLP</text><text x='480.0' y='348' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>mix within position</text><line x1='480.0' y1='358' x2='480.0' y2='378' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='480.0,378 474.0,369 486.0,369' fill='#8a8a8a'/><rect x='330' y='378' width='300' height='52' rx='8' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><circle cx='286' cy='404' r='16' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='1.5'/><text x='286' y='409' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>5</text><text x='480.0' y='402' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>+ step-3 out (residual)</text><text x='480.0' y='420' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>gradient highway</text><line x1='480.0' y1='430' x2='480.0' y2='450' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='480.0,450 474.0,441 486.0,441' fill='#8a8a8a'/><rect x='330' y='450' width='300' height='52' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><circle cx='286' cy='476' r='16' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='1.5'/><text x='286' y='481' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>6</text><text x='480.0' y='474' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>x_out</text><text x='480.0' y='492' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>[B, S, d]</text><text x='760' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Why pre-norm:</text><text x='760' y='170' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Norm before each sublayer</text><text x='760' y='192' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>keeps activations calm.</text><text x='760' y='236' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Residual adds mean the</text><text x='760' y='258' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>block only has to learn</text><text x='760' y='280' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>a correction, never the</text><text x='760' y='302' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>whole transform.</text><text x='760' y='346' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Delete a residual and</text><text x='760' y='368' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>deep stacks stop training.</text><text x='480' y='560' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>Stack this block N times. Everything else in the chapter is inside steps 2 and 4.</text></svg>