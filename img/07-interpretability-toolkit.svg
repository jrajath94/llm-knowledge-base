<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="680" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The interpretability toolkit</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Four methods, one shared standard of evidence</text>
<rect x="250" y="88" width="400" height="90" fill="#141414" stroke="#ececec" stroke-width="1.5" rx="6"/>
<text x="450.0" y="125.0" font-size="15" font-weight="bold" fill="#ececec" text-anchor="middle">Mechanistic explanation</text>
<text x="450.0" y="147.0" font-size="11" fill="#a8a8a8" text-anchor="middle">features, computations, behavior: linked causally</text>
<rect x="24" y="208" width="414" height="164" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="231" y="238" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Probing</text>
<text x="231" y="262" font-size="11" fill="#4fd1a5" text-anchor="middle">read-only</text>
<text x="231" y="288" font-size="12" fill="#ececec" text-anchor="middle">&quot;Is the information there?&quot;</text>
<text x="44" y="316" font-size="11" fill="#a8a8a8" text-anchor="start">Cheapest, weakest: presence is not use.</text>
<line x1="450" y1="178" x2="231" y2="208" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="231,208 238.6436974921495,203.248801346133 239.6398313172031,210.52057826902416" fill="#8a8a8a"/>
<rect x="462" y="208" width="414" height="164" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="669" y="238" font-size="14" font-weight="bold" fill="#6cb2ff" text-anchor="middle">Sparse autoencoders</text>
<text x="669" y="262" font-size="11" fill="#6cb2ff" text-anchor="middle">read-only, finer</text>
<text x="669" y="288" font-size="12" fill="#ececec" text-anchor="middle">&quot;What are the features?&quot;</text>
<text x="482" y="316" font-size="11" fill="#a8a8a8" text-anchor="start">Splits polysemantic activations into monosemantic</text>
<text x="482" y="333" font-size="11" fill="#a8a8a8" text-anchor="start">directions.</text>
<line x1="450" y1="178" x2="669" y2="208" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="669,208 660.3601686827969,210.52057826902416 661.3563025078505,203.248801346133" fill="#8a8a8a"/>
<rect x="24" y="398" width="414" height="164" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="231" y="428" font-size="14" font-weight="bold" fill="#b388ff" text-anchor="middle">Circuits</text>
<text x="231" y="452" font-size="11" fill="#b388ff" text-anchor="middle">structure</text>
<text x="231" y="478" font-size="12" fill="#ececec" text-anchor="middle">&quot;How do features connect?&quot;</text>
<text x="44" y="506" font-size="11" fill="#a8a8a8" text-anchor="start">Traces computations across layers and heads.</text>
<line x1="450" y1="178" x2="231" y2="398" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="231,398 234.19673482109198,389.58686226883106 239.39848678603354,394.7649699066593" fill="#8a8a8a"/>
<rect x="462" y="398" width="414" height="164" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="669" y="428" font-size="14" font-weight="bold" fill="#f0b429" text-anchor="middle">Steering</text>
<text x="669" y="452" font-size="11" fill="#f0b429" text-anchor="middle">write</text>
<text x="669" y="478" font-size="12" fill="#ececec" text-anchor="middle">&quot;Does this cause that?&quot;</text>
<text x="482" y="506" font-size="11" fill="#a8a8a8" text-anchor="start">Intervenes on activations and watches behavior move.</text>
<line x1="450" y1="178" x2="669" y2="398" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="669,398 660.6015132139664,394.7649699066593 665.8032651789081,389.58686226883106" fill="#8a8a8a"/>
<rect x="24" y="588" width="852" height="84" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6"/>
<text x="450.0" y="622.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Standard of evidence: correlation plus intervention</text>
<text x="450.0" y="644.0" font-size="11" fill="#a8a8a8" text-anchor="middle">Correlation alone is a hypothesis; intervention is the test. Steering is the intervention half.</text>
</svg>