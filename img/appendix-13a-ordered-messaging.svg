<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="Ordered messaging: messages with the same key go to the same partition, order within a partition, parallelism across entities">
<rect width="840" height="520" fill="#0d0d0d"/>
<text x="420" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Ordered messaging: order per partition, not global</text>
<text x="420" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">The broker guarantees order within one partition, not across partitions.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<rect x="60" y="90" width="180" height="120" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="150" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#6cb2ff">Producer</text>
<text x="150" y="146" text-anchor="middle" font-size="11.5" fill="#ececec">writes messages</text>
<text x="150" y="166" text-anchor="middle" font-size="11.5" fill="#ececec">with keys</text>

<line x1="240" y1="150" x2="290" y2="150" stroke="#555" stroke-width="2"/>
<polygon points="290,150 282,144 282,156" fill="#555"/>

<rect x="290" y="90" width="220" height="120" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="400" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#f0b429">Router</text>
<text x="400" y="146" text-anchor="middle" font-size="11.5" fill="#ececec">same key =</text>
<text x="400" y="166" text-anchor="middle" font-size="11.5" fill="#ececec">same partition</text>

<g>
<line x1="510" y1="120" x2="560" y2="120" stroke="#555" stroke-width="2"/>
<polygon points="560,120 552,114 552,126" fill="#555"/>
<rect x="560" y="90" width="220" height="60" rx="10" fill="#1f3a24" stroke="#7fd08a" stroke-width="1.5"/>
<text x="670" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7fd08a">Partition 1: user-42</text>
<text x="670" y="136" text-anchor="middle" font-size="11.5" fill="#ececec">edits in order: 1, 2, 3</text>

<line x1="510" y1="180" x2="560" y2="180" stroke="#555" stroke-width="2"/>
<polygon points="560,180 552,174 552,186" fill="#555"/>
<rect x="560" y="150" width="220" height="60" rx="10" fill="#1a2a3a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="670" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6cb2ff">Partition 2: user-77</text>
<text x="670" y="196" text-anchor="middle" font-size="11.5" fill="#ececec">edits in order: 1, 2, 4</text>
</g>
</g>

<rect x="60" y="240" width="720" height="90" rx="10" fill="#141414" stroke="#e08080" stroke-width="1"/>
<text x="420" y="272" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#e08080">The gap is information.</text>
<text x="420" y="298" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">A consumer that sees sequence numbers 1, 2, 4 knows message 3 is late or lost. It can wait briefly, request a resend, or proceed by policy.</text>

<rect x="60" y="350" width="720" height="130" rx="10" fill="#141414" stroke="#2e9e5b" stroke-width="1"/>
<text x="420" y="382" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#2e9e5b">You rarely need global order. You need per-entity order.</text>
<text x="420" y="408" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Partitioning by entity key gives per-entity order, with parallelism across entities.</text>
<text x="420" y="432" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">One giant ordered stream is one partition and one consumer: correct and slow.</text>
<text x="420" y="456" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">Without sequence numbers, a missing message is invisible.</text>
</svg>
