<svg xmlns='http://www.w3.org/2000/svg' width='700' height='400' viewBox='0 0 700 400' font-family='DejaVu Sans'>
<rect width='700' height='400' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Curse of dimensionality: nearest stops meaning nearest</text>
<line x1='90' y1='320' x2='640' y2='320' stroke='#e8e8e8' stroke-width='2'/>
<line x1='90' y1='320' x2='90' y2='90' stroke='#e8e8e8' stroke-width='2'/>
<text x='365' y='348' font-size='12' fill='#9a9a9a' text-anchor='middle'>dimensions</text>
<text x='52' y='200' font-size='12' fill='#9a9a9a' text-anchor='middle'>dmax/dmin</text>
<polyline points='110,110 130,122 150,134 170,146 190,157 210,169 230,180 250,190 270,201 290,211 310,220 330,230 350,239 370,248 390,256 410,265 430,272 450,280 470,287 490,293 510,299 530,304 550,309 570,314 590,317 610,319' fill='none' stroke='#ff7b8a' stroke-width='2.5'/>
<line x1='110' y1='320' x2='620' y2='320' stroke='#9a9a9a' stroke-width='1.5' stroke-dasharray='5,4'/>
<text x='480' y='300' font-size='12' fill='#ff7b8a' text-anchor='start'>ratio -> 1</text>
<text x='350' y='70' font-size='12' fill='#9a9a9a' text-anchor='middle'>Bigger k will not fix it. The neighborhood itself becomes meaningless.</text>
<text x='350' y='380' font-size='12' fill='#9a9a9a' text-anchor='middle'>Fixes: dimensionality reduction, feature selection, or a non-distance model.</text>
</svg>