<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 390' width='100%' role='img'>
<text x='22' y='32' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>How a role track works</text>
<text x='22' y='56' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>One spine, ten tracks. Each track re-orders the spine, then goes deeper.</text>
<rect x='22' y='100' width='200' height='200' rx='10' fill='#1565c0' fill-opacity='0.18' stroke='#1565c0' stroke-width='2'/>
<text x='122' y='138' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>The spine</text>
<text x='122' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>16 base volumes</text>
<text x='122' y='196' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>the shared</text>
<text x='122' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>foundation</text>
<rect x='342' y='100' width='240' height='200' rx='10' fill='#f0b429' fill-opacity='0.18' stroke='#f0b429' stroke-width='2'/>
<text x='462' y='138' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Reading path</text>
<text x='462' y='224' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>the same volumes,</text>
<text x='462' y='244' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>in the track's order</text>
<text x='462' y='264' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>spine worked first</text>
<rect x='360' y='152' width='68' height='30' rx='15' fill='#f0b429' fill-opacity='0.35' stroke='#f0b429' stroke-width='1.5'/>
<text x='394' y='173' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 7</text>
<rect x='438' y='152' width='68' height='30' rx='15' fill='#f0b429' fill-opacity='0.35' stroke='#f0b429' stroke-width='1.5'/>
<text x='472' y='173' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 4</text>
<rect x='516' y='152' width='68' height='30' rx='15' fill='#f0b429' fill-opacity='0.35' stroke='#f0b429' stroke-width='1.5'/>
<text x='550' y='173' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 8</text>
<text x='462' y='198' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>example order</text>
<rect x='702' y='100' width='236' height='200' rx='10' fill='#2e7d32' fill-opacity='0.18' stroke='#2e7d32' stroke-width='2'/>
<text x='820' y='138' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Specialist chapters</text>
<text x='820' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>deeper than the base</text>
<text x='820' y='188' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>volumes on the role's</text>
<text x='820' y='208' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>core problems</text>
<text x='820' y='232' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>worked in order</text>
<path d='M222 200 L340 200' stroke='#8a8a8a' stroke-width='2'/><path d='M332 194 L340 200 L332 206' fill='none' stroke='#8a8a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
<text x='281' y='226' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>re-orders</text>
<text x='281' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the volumes</text>
<path d='M582 200 L700 200' stroke='#8a8a8a' stroke-width='2'/><path d='M692 194 L700 200 L692 206' fill='none' stroke='#8a8a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
<text x='641' y='226' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>goes deeper</text>
<text x='641' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>than the base</text>
<text x='22' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>A track is a reading order plus specialist chapters. Crash packs review the track later; they do not replace it.</text>
</svg>