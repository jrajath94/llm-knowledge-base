<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='600' >Fragmentation: the waste that paging removes</text><text x='20' y='62' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='600' >contiguous reservation (max length up front)</text><rect x='20' y='76' width='191' height='54' fill='#4db6ac' fill-opacity='0.35' stroke='#4db6ac' stroke-width='2'/><rect x='211' y='76' width='369' height='54' fill='#3a3a3a' stroke='#6a6a6a' stroke-width='2'/><line x1='225' y1='76' x2='239' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='253' y1='76' x2='267' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='281' y1='76' x2='295' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='309' y1='76' x2='323' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='337' y1='76' x2='351' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='365' y1='76' x2='379' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='393' y1='76' x2='407' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='421' y1='76' x2='435' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='449' y1='76' x2='463' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='477' y1='76' x2='491' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='505' y1='76' x2='519' y2='130' stroke='#6a6a6a' stroke-width='2'/><line x1='533' y1='76' x2='547' y2='130' stroke='#6a6a6a' stroke-width='2'/><text x='20' y='152' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#4db6ac' text-anchor='start' >700 tokens used</text><text x='560' y='152' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='end' >1,348 reserved but empty = 66% waste</text><text x='620' y='62' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='600' >paged (16-token blocks, on demand)</text><rect x='620' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='656' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='692' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='728' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='764' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='800' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='836' y='76' width='30' height='54' rx='5' fill='#4db6ac' fill-opacity='0.30' stroke='#4db6ac' stroke-width='2'/><rect x='872' y='76' width='30' height='54' rx='5' fill='#3a3a3a' fill-opacity='0.30' stroke='#3a3a3a' stroke-width='2' stroke-dasharray='6,4'/><rect x='908' y='76' width='30' height='54' rx='5' fill='#3a3a3a' fill-opacity='0.30' stroke='#3a3a3a' stroke-width='2' stroke-dasharray='6,4'/><rect x='944' y='76' width='30' height='54' rx='5' fill='#3a3a3a' fill-opacity='0.30' stroke='#3a3a3a' stroke-width='2' stroke-dasharray='6,4'/><text x='620' y='152' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='start' >blocks allocated on demand, freed when the sequence ends</text><text x='20' y='200' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start' >Why it hurts: the reserved-but-empty memory cannot hold other sequences, so waste caps the batch size.</text><text x='20' y='224' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start' >Paging does not shrink the KV cache. It only stops the reservation from wasting the space around it.</text><text x='20' y='248' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start' >That waste, plus the bytes themselves, is the cost problem the next two chapters solve.</text></svg>