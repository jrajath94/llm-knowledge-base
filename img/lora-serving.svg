<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 320' width='100%' style='max-width:900px;background-color:transparent' role='img'><style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.g{fill:#f0b429}.b{fill:#6cb2ff}.r{fill:#e57373}.gr{fill:#7fc97f}</style><rect x='30' y='60' width='220' height='150' rx='8' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='140' y='110' font-size='15' text-anchor='middle' font-weight='700'>Base model</text><text x='140' y='132' font-size='13' text-anchor='middle' class='m'>7B weights, 14 GB</text><text x='140' y='152' font-size='13' text-anchor='middle' class='m'>loaded ONCE</text><rect x='270' y='60' width='130' height='40' rx='6' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='335' y='85' font-size='13' text-anchor='middle' font-weight='700' fill='#6cb2ff'>LoRA-A</text><line x1='250' y1='135' x2='270' y2='80' stroke='#6cb2ff' stroke-width='1.5'/><rect x='270' y='110' width='130' height='40' rx='6' fill='#141414' stroke='#7fc97f' stroke-width='2'/><text x='335' y='135' font-size='13' text-anchor='middle' font-weight='700' fill='#7fc97f'>LoRA-B</text><line x1='250' y1='135' x2='270' y2='130' stroke='#7fc97f' stroke-width='1.5'/><rect x='270' y='160' width='130' height='40' rx='6' fill='#141414' stroke='#e57373' stroke-width='2'/><text x='335' y='185' font-size='13' text-anchor='middle' font-weight='700' fill='#e57373'>LoRA-C</text><line x1='250' y1='135' x2='270' y2='180' stroke='#e57373' stroke-width='1.5'/><text x='335' y='235' font-size='12' text-anchor='middle' class='m'>~16 MB each (rank 16)</text><text x='335' y='252' font-size='12' text-anchor='middle' class='m'>hot on GPU, cold spill to CPU (LRU)</text><rect x='440' y='70' width='110' height='30' rx='15' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='495' y='90' font-size='12' text-anchor='middle' class='m'>req 1 (A)</text><line x1='550' y1='85' x2='600' y2='135' stroke='#6cb2ff' stroke-width='1.5' marker-end='url(#ah)'/><rect x='440' y='110' width='110' height='30' rx='15' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='495' y='130' font-size='12' text-anchor='middle' class='m'>req 2 (B)</text><line x1='550' y1='125' x2='600' y2='135' stroke='#7fc97f' stroke-width='1.5' marker-end='url(#ah)'/><rect x='440' y='150' width='110' height='30' rx='15' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='495' y='170' font-size='12' text-anchor='middle' class='m'>req 3 (A)</text><line x1='550' y1='165' x2='600' y2='135' stroke='#6cb2ff' stroke-width='1.5' marker-end='url(#ah)'/><defs><marker id='ah' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6' fill='none' stroke='#a8a8a8' stroke-width='1.5'/></marker></defs><rect x='600' y='100' width='100' height='70' rx='8' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='650' y='128' font-size='13' text-anchor='middle' font-weight='700'>one</text><text x='650' y='146' font-size='13' text-anchor='middle' font-weight='700'>batched</text><text x='650' y='164' font-size='13' text-anchor='middle' font-weight='700'>forward</text><text x='30' y='300' font-size='13' class='m'>Rule: heterogeneous adapters batch together. Warm adapters before traffic; a cold adapter pays a CPU fetch as a latency spike.</text></svg>