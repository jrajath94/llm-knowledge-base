<svg xmlns='http://www.w3.org/2000/svg' width='700' height='420' viewBox='0 0 700 420' font-family='DejaVu Sans'>
<rect width='700' height='420' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>PSD means the quadratic is a bowl: one global minimum, no saddles</text>
<path d='M95,140 Q185,290 275,140' fill='none' stroke='#7fd08a' stroke-width='2.5'/>
<path d='M95,140 Q185,290 275,140 L275,100 L95,100 Z' fill='#7fd08a' opacity='0.12'/>
<circle cx='185' cy='215' r='6' fill='#7fd08a'/>
<text x='185' y='380' font-size='12' fill='#7fd08a' text-anchor='middle' font-weight='bold'>PSD: v^T A v >= 0</text>
<text x='185' y='400' font-size='12' fill='#9a9a9a' text-anchor='middle'>one global minimum</text>
<path d='M420,180 Q515,300 610,180' fill='none' stroke='#ff7b8a' stroke-width='2.5'/>
<path d='M420,180 Q515,60 610,180' fill='none' stroke='#ff7b8a' stroke-width='2.5'/>
<circle cx='515' cy='180' r='5' fill='#ff7b8a'/>
<text x='515' y='380' font-size='12' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>indefinite: not PSD</text>
<text x='515' y='400' font-size='12' fill='#9a9a9a' text-anchor='middle'>saddle trap</text>
<text x='350' y='70' font-size='12' fill='#9a9a9a' text-anchor='middle'>Covariance matrices and X^T X are PSD. That is why least squares has one answer.</text>
</svg>