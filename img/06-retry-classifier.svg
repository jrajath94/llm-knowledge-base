<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 560' width='100%' role='img'><title>Retry vs escalate classifier</title><text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Every failure is classified before any retry</text><rect x='380' y='60' width='200' height='80' rx='10' fill='#7b61b8' fill-opacity='0.22' stroke='#7b61b8' stroke-width='2'/><text x='480.0' y='104.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Failure on a step</text><line x1='480' y1='140' x2='480' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='473,161 480,165 473,169' fill='#8a8a8a'/><rect x='300' y='170' width='360' height='90' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/><text x='480.0' y='213.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Same action 3+ times?</text><text x='480.0' y='237.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>STUCK: never retry</text><text x='480' y='290' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>break the loop: replan, compact, or hand to a human</text><line x1='480' y1='260' x2='480' y2='300' stroke='#8a8a8a' stroke-width='2'/><polygon points='473,296 480,300 473,304' fill='#8a8a8a'/><rect x='90' y='320' width='780' height='64' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/><text x='480.0' y='356.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Timeout, rate limit</text><text x='880' y='355' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='end'>TRANSIENT: retry with backoff</text><rect x='90' y='398' width='780' height='64' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/><text x='480.0' y='434.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Bad args, wrong tool, parse</text><text x='880' y='433' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='end'>AGENT ERROR: self-correct once, then escalate</text><rect x='90' y='476' width='780' height='64' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/><text x='480.0' y='512.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Anything else</text><text x='880' y='511' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='end'>UNKNOWN: escalate</text><text x='480' y='545' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The stuck check runs first: a stuck loop mislabeled transient retries forever.</text></svg>