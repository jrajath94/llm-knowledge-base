<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img'><rect x='0' y='0' width='960' height='470' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>The KV cache grows one row per step</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Prefill once, then each new token appends its K and V and reuses the rest.</text><text x='140' y='100' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>step t=1</text><rect x='60' y='130' width='160' height='38' rx='6' fill='#2a2113' stroke='#f0b429' stroke-width='2.5'/><text x='140' y='155' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#ececec' text-anchor='middle'>K,V of tok 1  new</text><text x='140' y='194' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cache: 1 rows</text><line x1='230' y1='200' x2='270' y2='200' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='270,200 263,192 263,208' fill='#8a8a8a'/><text x='360' y='100' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>step t=2</text><rect x='280' y='130' width='160' height='38' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='360' y='155' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>K,V of tok 1</text><rect x='280' y='176' width='160' height='38' rx='6' fill='#2a2113' stroke='#f0b429' stroke-width='2.5'/><text x='360' y='201' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#ececec' text-anchor='middle'>K,V of tok 2  new</text><text x='360' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cache: 2 rows</text><line x1='450' y1='200' x2='490' y2='200' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='490,200 483,192 483,208' fill='#8a8a8a'/><text x='580' y='100' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>step t=3</text><rect x='500' y='130' width='160' height='38' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='580' y='155' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>K,V of tok 1</text><rect x='500' y='176' width='160' height='38' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='580' y='201' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>K,V of tok 2</text><rect x='500' y='222' width='160' height='38' rx='6' fill='#2a2113' stroke='#f0b429' stroke-width='2.5'/><text x='580' y='247' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#ececec' text-anchor='middle'>K,V of tok 3  new</text><text x='580' y='286' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cache: 3 rows</text><line x1='670' y1='200' x2='710' y2='200' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='710,200 703,192 703,208' fill='#8a8a8a'/><text x='800' y='100' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>step t=4</text><rect x='720' y='130' width='160' height='38' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='800' y='155' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>K,V of tok 1</text><rect x='720' y='176' width='160' height='38' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='800' y='201' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>K,V of tok 2</text><rect x='720' y='222' width='160' height='38' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='800' y='247' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>K,V of tok 3</text><rect x='720' y='268' width='160' height='38' rx='6' fill='#2a2113' stroke='#f0b429' stroke-width='2.5'/><text x='800' y='293' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#ececec' text-anchor='middle'>K,V of tok 4  new</text><text x='800' y='332' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cache: 4 rows</text><text x='480' y='420' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>Without the cache, step t would recompute K,V for all t tokens: O(t^2) per step.</text><text x='480' y='444' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>With the cache, each step costs O(t): read the cache, append one row.</text></svg>