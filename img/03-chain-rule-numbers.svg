<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Blame flows backward, one multiplication per hop</text><rect x='30' y='90' width='180' height='64' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='120' y='128' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>x = 2</text><rect x='240' y='90' width='180' height='64' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='330' y='128' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>w = 3</text><rect x='450' y='90' width='180' height='64' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2.5'/><text x='540' y='128' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>y = w x = 6</text><rect x='660' y='90' width='180' height='64' rx='10' fill='#0d0d0d' stroke='#e57373' stroke-width='2.5'/><text x='750' y='128' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>L = (y - t)^2 = 4</text><line x1='210' y1='122' x2='240' y2='122' stroke='#8a8a8a' stroke-width='3'/><polygon points='240.0,122.0 232.3,126.6 232.3,117.4' fill='#8a8a8a'/><line x1='420' y1='122' x2='450' y2='122' stroke='#8a8a8a' stroke-width='3'/><polygon points='450.0,122.0 442.3,126.6 442.3,117.4' fill='#8a8a8a'/><line x1='630' y1='122' x2='660' y2='122' stroke='#8a8a8a' stroke-width='3'/><polygon points='660.0,122.0 652.3,126.6 652.3,117.4' fill='#8a8a8a'/><text x='750' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>target t = 4</text><text x='480' y='212' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>Each factor is local</text><line x1='700' y1='248' x2='560' y2='248' stroke='#f0b429' stroke-width='3'/><polygon points='560.0,248.0 567.7,243.4 567.7,252.6' fill='#f0b429'/><text x='630' y='234' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#f0b429' text-anchor='middle'>dL/dy = 4</text><text x='630' y='274' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#8a8a8a' text-anchor='middle'>only involves the loss</text><line x1='480' y1='314' x2='340' y2='314' stroke='#f0b429' stroke-width='3'/><polygon points='340.0,314.0 347.7,309.4 347.7,318.6' fill='#f0b429'/><text x='410' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#f0b429' text-anchor='middle'>dy/dw = x = 2</text><text x='410' y='340' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#8a8a8a' text-anchor='middle'>only involves the neuron</text><text x='480' y='382' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>dL/dw = 4 x 2 = 8. That is the entire idea of backpropagation.</text></svg>