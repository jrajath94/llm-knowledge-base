<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 246" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Drift comes in three shapes: name the shape before you act"><rect x="22" y="14" width="916" height="218" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">DRIFT</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The model did not change. The world did. Three shapes, three responses:</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Data drift:</text><text x="163.95101562500003" y="94" font-size="13.5" fill="#a8a8a8">the inputs change. Fraud model trained on desktop logins; now most logins come from</text><text x="80" y="113" font-size="13.5" fill="#a8a8a8">phones.</text><path d="M 53.7 139.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="144" font-size="13.5" font-weight="700" fill="#ececec">Concept drift:</text><text x="190.13890625" y="144" font-size="13.5" fill="#a8a8a8">the right answer changes for the same inputs. &quot;Likely to buy&quot; meant something different</text><text x="80" y="163" font-size="13.5" fill="#a8a8a8">before the price hike.</text><path d="M 53.7 189.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="194" font-size="13.5" font-weight="700" fill="#ececec">Label drift:</text><text x="169.23078125" y="194" font-size="13.5" fill="#a8a8a8">the mix of outcomes changes. Chargebacks double after a holiday weekend.</text><path d="M 53.7 220.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="225" font-size="13.5" font-weight="700" fill="#ececec">Training/serving skew:</text><text x="256.191875" y="225" font-size="13.5" fill="#a8a8a8">drift&#x27;s cousin: the gap exists from day one instead of growing over time.</text></svg>