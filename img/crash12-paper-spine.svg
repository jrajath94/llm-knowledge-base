<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 300' width='100%' style='max-width:960px;background-color:transparent' role='img'>
<style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.y{fill:#f0b429}.b{fill:#6cb2ff}.g{fill:#7fc97f}.r{fill:#e57373}.p{fill:#c39bd3}</style>
<text x='20' y='28' font-size='18' font-weight='600'>The paper spine: 2017 to 2025, each paper assumes the previous one's world</text>
<line x1='40' y1='150' x2='920' y2='150' stroke='#5a5a5a' stroke-width='2'/>
<!-- year ticks: 2017->x=40, 2026->x=920 ; 9 years -->
<text x='40' y='172' font-size='12' text-anchor='middle' class='m'>2017</text>
<text x='138' y='172' font-size='12' text-anchor='middle' class='m'>2018</text>
<text x='236' y='172' font-size='12' text-anchor='middle' class='m'>2019</text>
<text x='333' y='172' font-size='12' text-anchor='middle' class='m'>2020</text>
<text x='431' y='172' font-size='12' text-anchor='middle' class='m'>2021</text>
<text x='529' y='172' font-size='12' text-anchor='middle' class='m'>2022</text>
<text x='627' y='172' font-size='12' text-anchor='middle' class='m'>2023</text>
<text x='724' y='172' font-size='12' text-anchor='middle' class='m'>2024</text>
<text x='822' y='172' font-size='12' text-anchor='middle' class='m'>2025</text>
<g font-size='12' text-anchor='middle'>
<circle cx='40' cy='150' r='6' fill='#6cb2ff'/><text x='40' y='120' class='b' font-weight='700'>Attention Is</text><text x='40' y='136' class='b' font-weight='700'>All You Need</text>
<circle cx='138' cy='150' r='6' fill='#6cb2ff'/><text x='138' y='120' class='b' font-weight='700'>BERT</text><text x='138' y='136' class='m'>bidirectional</text>
<circle cx='333' cy='150' r='6' fill='#f0b429'/><text x='333' y='120' class='y' font-weight='700'>GPT-3</text><text x='333' y='136' class='m'>in-context learning</text>
<circle cx='431' cy='150' r='6' fill='#6cb2ff'/><text x='431' y='120' class='b' font-weight='700'>RoFormer</text><text x='431' y='136' class='m'>RoPE positions</text>
<circle cx='505' cy='150' r='6' fill='#7fc97f'/><text x='498' y='98' class='g' font-weight='700'>FlashAttention</text><text x='498' y='114' class='m'>memory wall</text>
<circle cx='529' cy='150' r='6' fill='#f0b429'/><text x='518' y='196' class='y' font-weight='700'>Chinchilla</text><text x='518' y='212' class='m'>20 tok/param</text>
<circle cx='553' cy='150' r='6' fill='#e57373'/><text x='553' y='126' class='r' font-weight='700'>InstructGPT</text><text x='553' y='142' class='m'>RLHF</text>
<circle cx='577' cy='150' r='6' fill='#e57373'/><text x='590' y='196' class='r' font-weight='700'>Const. AI</text><text x='590' y='212' class='m'>self-critique</text>
<circle cx='601' cy='150' r='6' fill='#c39bd3'/><text x='606' y='98' class='p' font-weight='700'>CoT</text><text x='606' y='114' class='m'>reasoning traces</text>
<circle cx='627' cy='150' r='6' fill='#6cb2ff'/><text x='627' y='196' class='b' font-weight='700'>LLaMA</text><text x='627' y='212' class='m'>open weights</text>
<circle cx='651' cy='150' r='6' fill='#e57373'/><text x='654' y='126' class='r' font-weight='700'>DPO</text><text x='654' y='142' class='m'>no reward model</text>
<circle cx='822' cy='150' r='6' fill='#f0b429'/><text x='822' y='120' class='y' font-weight='700'>DeepSeek-R1</text><text x='822' y='136' class='m'>pure-RL reasoning</text>
</g>
<g font-size='12'>
<rect x='40' y='240' width='14' height='14' fill='#6cb2ff'/><text x='62' y='252' class='m'>architecture</text>
<rect x='190' y='240' width='14' height='14' fill='#f0b429'/><text x='212' y='252' class='m'>scale</text>
<rect x='300' y='240' width='14' height='14' fill='#7fc97f'/><text x='322' y='252' class='m'>efficiency</text>
<rect x='420' y='240' width='14' height='14' fill='#e57373'/><text x='442' y='252' class='m'>alignment</text>
<rect x='540' y='240' width='14' height='14' fill='#c39bd3'/><text x='562' y='252' class='m'>reasoning</text>
</g>
<text x='20' y='288' font-size='12' class='m'>Read left to right: Mixture of Experts (2017/2024) runs underneath as the capacity thread. The 2022 cluster is the field's busiest year: efficiency, scale laws, and alignment all landed at once.</text>
</svg>
