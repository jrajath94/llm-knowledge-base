<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 470" role="img" aria-label="DDP versus FSDP: where the model weights live">
<rect width="900" height="470" fill="#0d0d0d"/>
<text x="450" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">DDP vs FSDP: where the model weights live</text>
<text x="450" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">DDP copies the full model to every GPU. FSDP shards it across GPUs and rebuilds layers on demand.</text>
<text x="225" y="75" text-anchor="middle" fill="#4aa8ff" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">DDP: full copy per GPU</text>
<rect x="85" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#4aa8ff" stroke-width="2"/>
<text x="120.0" y="121" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 0</text>
<text x="120.0" y="141" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">full model</text>
<rect x="165" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#4aa8ff" stroke-width="2"/>
<text x="200.0" y="121" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 1</text>
<text x="200.0" y="141" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">full model</text>
<rect x="245" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#4aa8ff" stroke-width="2"/>
<text x="280.0" y="121" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 2</text>
<text x="280.0" y="141" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">full model</text>
<rect x="325" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#4aa8ff" stroke-width="2"/>
<text x="360.0" y="121" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 3</text>
<text x="360.0" y="141" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">full model</text>
<text x="225" y="245" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">gradients averaged with all-reduce</text>
<text x="225" y="265" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">memory per GPU: the whole model</text>
<text x="675" y="75" text-anchor="middle" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">FSDP: one shard per GPU</text>
<rect x="535" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#2dd4bf" stroke-width="2"/>
<text x="570" y="145" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 0</text>
<rect x="543" y="160" width="54" height="34" rx="4" fill="#2dd4bf" opacity="0.85"/>
<text x="570" y="182" text-anchor="middle" fill="#0d0d0d" font-size="10" font-family="Charis SIL, Georgia, serif" font-weight="bold">shard 1/4</text>
<rect x="615" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#2dd4bf" stroke-width="2"/>
<text x="650" y="145" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 1</text>
<rect x="623" y="160" width="54" height="34" rx="4" fill="#2dd4bf" opacity="0.85"/>
<text x="650" y="182" text-anchor="middle" fill="#0d0d0d" font-size="10" font-family="Charis SIL, Georgia, serif" font-weight="bold">shard 2/4</text>
<rect x="695" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#2dd4bf" stroke-width="2"/>
<text x="730" y="145" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 2</text>
<rect x="703" y="160" width="54" height="34" rx="4" fill="#2dd4bf" opacity="0.85"/>
<text x="730" y="182" text-anchor="middle" fill="#0d0d0d" font-size="10" font-family="Charis SIL, Georgia, serif" font-weight="bold">shard 3/4</text>
<rect x="775" y="95" width="70" height="120" rx="6" fill="#1a1a1a" stroke="#2dd4bf" stroke-width="2"/>
<text x="810" y="145" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">GPU 3</text>
<rect x="783" y="160" width="54" height="34" rx="4" fill="#2dd4bf" opacity="0.85"/>
<text x="810" y="182" text-anchor="middle" fill="#0d0d0d" font-size="10" font-family="Charis SIL, Georgia, serif" font-weight="bold">shard 4/4</text>
<text x="675" y="245" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">layers rebuilt with all-gather, then freed</text>
<text x="675" y="265" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">memory per GPU: one shard</text>
<text x="450" y="320" text-anchor="middle" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">DDP (data parallel): each GPU holds a full model copy and sees different data.</text>
<text x="450" y="345" text-anchor="middle" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">FSDP (sharded): the model is split across GPUs, so bigger models fit.</text>
<text x="450" y="375" text-anchor="middle" fill="#f0b429" font-size="12" font-family="Charis SIL, Georgia, serif">Rule of thumb: DDP while the model fits on one GPU. FSDP when it does not.</text>
<text x="450" y="410" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Tensor parallel splits single layers across GPUs. Pipeline parallel splits layers into stages. Vol 6 covers all four.</text>
</svg>