<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='100%' role='img'><rect x='0' y='0' width='960' height='440' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>The quadratic bill: attention memory grows as n squared</text><rect x='120' y='300' width='150' height='30' rx='6' fill='#1565c0' opacity='0.85'/><text x='195' y='288' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>67 MB / head</text><text x='195' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>n = 4096</text><rect x='380' y='298.0952380952381' width='150' height='31.90476190476191' rx='6' fill='#ffb74d' opacity='0.85'/><text x='455' y='286.0952380952381' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>268 MB / head</text><text x='455' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>n = 8192</text><rect x='640' y='80.0' width='150' height='250.0' rx='6' fill='#e57373' opacity='0.85'/><text x='715' y='68.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>2.1 GB / layer</text><text x='715' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>x 32 heads</text><text x='480' y='400' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>FP16 scores, one layer. Double the sequence, quadruple the memory. This is why long context is expensive.</text></svg>