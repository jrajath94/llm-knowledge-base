<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t10bs-title t10bs-desc">
<title id="t10bs-title">Batch versus stream: hourly chunks against a live pipe</title>
<desc id="t10bs-desc">Two timelines. Batch: the day is cut into 24 hourly chunks; each chunk is processed after the hour ends; results land one hour late. Stream: events flow through a pipe continuously; results land in seconds. A latency arrow shows 1 hour versus 5 seconds.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">BATCH VS STREAM</text>
<text x="30" y="100" class="dl" fill="#6ab0ff">batch</text>
<rect x="150" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="192" y="145" class="tl" fill="#a8a8a8">0:00</text>
<rect x="245" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="287" y="145" class="tl" fill="#a8a8a8">1:00</text>
<rect x="340" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="382" y="145" class="tl" fill="#a8a8a8">2:00</text>
<rect x="435" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="477" y="145" class="tl" fill="#a8a8a8">3:00</text>
<rect x="530" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="572" y="145" class="tl" fill="#a8a8a8">4:00</text>
<rect x="625" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="667" y="145" class="tl" fill="#a8a8a8">5:00</text>
<rect x="720" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="762" y="145" class="tl" fill="#a8a8a8">6:00</text>
<rect x="815" y="80" width="85" height="50" rx="6" fill="#6ab0ff" opacity="0.85"/>
<text x="857" y="145" class="tl" fill="#a8a8a8">7:00</text>
<text x="150" y="175" class="dl" fill="#6ab0ff">results land ~1 hour late</text>
<text x="30" y="260" class="dl" fill="#7fd67f">stream</text>
<rect x="150" y="240" width="740" height="50" rx="25" fill="#0d0d0d" stroke="#7fd67f" stroke-width="1.5"/>
<circle cx="170" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="230" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="290" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="350" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="410" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="470" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="530" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="590" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="650" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="710" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="770" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<circle cx="830" cy="265" r="8" fill="#7fd67f" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="150" y="315" class="dl" fill="#7fd67f">results land in ~5 seconds</text>
<text x="30" y="380" class="capl">How to read: blue blocks are hourly batches. The green pipe never stops.</text>
<text x="30" y="402" class="dl">Rule: use batch for reports, stream for alerts. Cost follows latency.</text>
</g>
<defs><marker id="t10bs-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>