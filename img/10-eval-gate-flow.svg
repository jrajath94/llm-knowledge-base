<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Flowchart from model candidate through three gates to deploy or block"><rect x="22" y="14" width="916" height="372" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 5</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The eval gate: a candidate passes or it does not ship</text><rect x="38" y="110" width="150" height="90" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="113" y="158" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="middle">Candidate</text><line x1="188" y1="155" x2="234" y2="155" stroke="#f0b429" stroke-width="2"/><path d="M 226 151 L 234 155 L 226 159" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="234" y="110" width="150" height="90" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="309" y="158" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="middle">Data tests</text><line x1="384" y1="155" x2="430" y2="155" stroke="#f0b429" stroke-width="2"/><path d="M 422 151 L 430 155 L 422 159" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="430" y="110" width="150" height="90" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="505" y="158" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="middle">Training tests</text><line x1="580" y1="155" x2="626" y2="155" stroke="#f0b429" stroke-width="2"/><path d="M 618 151 L 626 155 L 618 159" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="626" y="110" width="150" height="90" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="701" y="158" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="middle">Eval gates</text><line x1="701" y1="200" x2="701" y2="250" stroke="#f0b429" stroke-width="2"/><path d="M 693 246 L 701 250 L 693 254" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="626" y="250" width="150" height="70" rx="8" fill="#1a2e1a" stroke="#3f7a3f"/><text x="701" y="290" font-size="13.5" font-weight="700" fill="#9fe09f" text-anchor="middle">PASS: deploy</text><line x1="776" y1="155" x2="860" y2="155" stroke="#e06c6c" stroke-width="2"/><path d="M 852 151 L 860 155 L 852 159" stroke="#e06c6c" stroke-width="2" fill="none"/><rect x="860" y="110" width="62" height="90" rx="8" fill="#2e1a1a" stroke="#7a3f3f"/><text x="891" y="150" font-size="13.5" font-weight="700" fill="#e09f9f" text-anchor="middle">FAIL</text><text x="891" y="172" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">block</text><text x="38" y="350" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">No gates, no CD: just faster hoping. Every gate needs an owner and a threshold.</text></svg>