<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
<rect width="560" height="280" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>The queue bound: 100 req/s x 2 s = 200</text><text x='60' y='100' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='start'>request 1..200: queue</text><text x='60' y='130' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='start' font-weight='bold'>request 201: REJECT fast, 429 or 503</text><text x='60' y='175' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>A queue past 200 means the 201st request waits past its deadline.</text><text x='60' y='200' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>Queueing it wastes its time and the consumer's memory.</text><text x='20' y='250' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Rejecting fast lets the caller retry elsewhere or degrade gracefully.</text></svg>