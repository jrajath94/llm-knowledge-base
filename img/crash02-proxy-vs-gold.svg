<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 420' width='100%' style='max-width:860px;background-color:transparent' role='img'>
<style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.y{fill:#f0b429}.r{fill:#e57373}.g{fill:#7fc97f}</style>
<text x='20' y='30' font-size='17' font-weight='600'>Overoptimization: proxy reward vs gold quality</text>
<line x1='80' y1='60' x2='80' y2='340' stroke='#5a5a5a' stroke-width='1.5'/>
<line x1='80' y1='340' x2='680' y2='340' stroke='#5a5a5a' stroke-width='1.5'/>
<text x='380' y='372' font-size='13' text-anchor='middle' class='m'>training steps</text>
<text x='28' y='200' font-size='13' text-anchor='middle' class='m' transform='rotate(-90 28 200)'>score</text>
<path d='M100,280 C220,240 400,180 660,80' fill='none' stroke='#f0b429' stroke-width='3'/>
<path d='M100,280 C220,230 300,140 380,150 C480,165 560,260 640,300' fill='none' stroke='#7fc97f' stroke-width='3'/>
<line x1='380' y1='150' x2='380' y2='340' stroke='#e57373' stroke-width='2' stroke-dasharray='6 4'/>
<circle cx='380' cy='150' r='7' fill='#e57373' stroke='#0d0d0d' stroke-width='2'/>
<text x='380' y='130' font-size='13' text-anchor='middle' fill='#e57373' font-weight='700'>gold peak: stop here</text>
<text x='600' y='70' font-size='13' class='y'>proxy reward</text>
<text x='600' y='88' font-size='12' class='m'>keeps climbing</text>
<text x='560' y='290' font-size='13' class='g'>gold quality</text>
<text x='560' y='308' font-size='12' class='m'>peaks, then falls</text>
<text x='150' y='250' font-size='12' class='m'>gap grows two checkpoints</text>
<text x='150' y='266' font-size='12' class='m'>in a row = past the peak</text>
</svg>
