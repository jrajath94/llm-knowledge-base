<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="300" fill="#0d0d0d" rx="8"/>
  <!-- Panel 1: stale knowledge -->
  <rect x="20" y="20" width="273" height="260" fill="#141414" stroke="#262626" rx="6"/>
  <text x="40" y="52" fill="#f0b429" font-size="15" font-weight="700">1. Stale knowledge</text>
  <rect x="60" y="70" width="193" height="100" fill="#1a1a1a" stroke="#3a3a3a" rx="4"/>
  <line x1="115" y1="70" x2="115" y2="170" stroke="#f0b429" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="58" y="192" fill="#a8a8a8" font-size="12">Training data ends here</text>
  <text x="140" y="192" fill="#a8a8a8" font-size="12">The world moves on</text>
  <text x="40" y="228" fill="#ececec" font-size="13">Q: Who won the 2026 final?</text>
  <text x="40" y="254" fill="#6cb2ff" font-size="13">A: I do not know. My data ends in 2024.</text>
  <!-- Panel 2: no actions -->
  <rect x="313" y="20" width="273" height="260" fill="#141414" stroke="#262626" rx="6"/>
  <text x="333" y="52" fill="#f0b429" font-size="15" font-weight="700">2. No actions</text>
  <rect x="393" y="68" width="113" height="48" fill="#1f2a33" stroke="#6cb2ff" rx="6"/>
  <text x="449" y="98" fill="#ececec" font-size="14" text-anchor="middle">LLM</text>
  <line x1="420" y1="116" x2="365" y2="150" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="450" y1="116" x2="450" y2="150" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="480" y1="116" x2="535" y2="150" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="323" y="150" width="84" height="42" fill="#1a1a1a" stroke="#3a3a3a" rx="4"/>
  <text x="365" y="176" fill="#a8a8a8" font-size="11" text-anchor="middle">database</text>
  <rect x="408" y="150" width="84" height="42" fill="#1a1a1a" stroke="#3a3a3a" rx="4"/>
  <text x="450" y="176" fill="#a8a8a8" font-size="11" text-anchor="middle">browser</text>
  <rect x="493" y="150" width="84" height="42" fill="#1a1a1a" stroke="#3a3a3a" rx="4"/>
  <text x="535" y="176" fill="#a8a8a8" font-size="11" text-anchor="middle">files</text>
  <line x1="330" y1="205" x2="570" y2="140" stroke="#c0392b" stroke-width="3"/>
  <text x="333" y="238" fill="#ececec" font-size="13">It can only write text.</text>
  <text x="333" y="262" fill="#ececec" font-size="13">It cannot click, query, or run.</text>
  <!-- Panel 3: no private data -->
  <rect x="606" y="20" width="274" height="260" fill="#141414" stroke="#262626" rx="6"/>
  <text x="626" y="52" fill="#f0b429" font-size="15" font-weight="700">3. No private data</text>
  <rect x="646" y="68" width="150" height="102" fill="#1a1a1a" stroke="#3a3a3a" rx="4"/>
  <text x="721" y="98" fill="#a8a8a8" font-size="12" text-anchor="middle">team docs</text>
  <text x="721" y="120" fill="#a8a8a8" font-size="12" text-anchor="middle">private wiki</text>
  <text x="721" y="142" fill="#a8a8a8" font-size="12" text-anchor="middle">your files</text>
  <circle cx="796" cy="170" r="24" fill="#0d0d0d" stroke="#f0b429" stroke-width="3"/>
  <rect x="789" y="170" width="14" height="12" fill="#f0b429"/>
  <path d="M789 170 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#f0b429" stroke-width="3"/>
  <text x="626" y="228" fill="#ececec" font-size="13">Q: What did we decide yesterday?</text>
  <text x="626" y="254" fill="#6cb2ff" font-size="13">A: That was never in my training.</text>
</svg>
