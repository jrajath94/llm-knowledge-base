<svg xmlns="http://www.w3.org/2000/svg" width="720" height="459" viewBox="0 0 720 459" role="img" aria-label="Layer failure and coverage mapping">
<rect width="720" height="459" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Every layer breaks: who covers the gap</text>
<text x="30" y="84" text-anchor="start" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">refusal training</text>
<path d="M190,80 L215,80" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<text x="225" y="76" text-anchor="start" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">jailbreaks bypass the refusal</text>
<path d="M470,80 L495,80" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<text x="505" y="76" text-anchor="start" fill="#3fb950" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">output filter, monitoring</text>
<text x="30" y="150" text-anchor="start" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">input filter</text>
<path d="M190,146 L215,146" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<text x="225" y="142" text-anchor="start" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">paraphrase slips past the classifier</text>
<path d="M470,146 L495,146" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<text x="505" y="142" text-anchor="start" fill="#3fb950" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">the model's own refusal training</text>
<text x="30" y="216" text-anchor="start" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">output filter</text>
<path d="M190,212 L215,212" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<text x="225" y="208" text-anchor="start" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">evasions tuned against it; loose thresholds</text>
<path d="M470,212 L495,212" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<text x="505" y="208" text-anchor="start" fill="#3fb950" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">monitoring, human review queues</text>
<text x="30" y="282" text-anchor="start" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">system prompt</text>
<path d="M190,278 L215,278" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<text x="225" y="274" text-anchor="start" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">injection overrides instructions</text>
<path d="M470,278 L495,278" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<text x="505" y="274" text-anchor="start" fill="#3fb950" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">instruction hierarchy, secret minimization</text>
<text x="30" y="348" text-anchor="start" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">monitoring</text>
<path d="M190,344 L215,344" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<text x="225" y="340" text-anchor="start" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">sampling misses rare events; alert fatigue</text>
<path d="M470,344 L495,344" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<text x="505" y="340" text-anchor="start" fill="#3fb950" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">risk-tuned sampling, versioned thresholds</text>
<text x="360" y="412" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">no layer's failure mode is covered by itself</text>
<text x="360" y="434" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">draw this table for your specific system before you ship</text>
</svg>