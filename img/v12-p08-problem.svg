<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 8: the problem InstructGPT solved"><rect x="22" y="14" width="435.0" height="238" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">GPT-3 was a text-completion engine,</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">not an assistant</text><circle cx="44" cy="103.5" r="3.2" fill="#e07878"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">prompt with a question, get more questions,</text><text x="56" y="126" font-size="13.5" fill="#a8a8a8">rambling, confident unhelpfulness</text><circle cx="44" cy="147.5" r="3.2" fill="#e07878"/><text x="56" y="152" font-size="13.5" fill="#a8a8a8">next-token prediction does not encode &quot;be</text><text x="56" y="170" font-size="13.5" fill="#a8a8a8">helpful, follow the instruction&quot;</text><circle cx="44" cy="191.5" r="3.2" fill="#e07878"/><text x="56" y="196" font-size="13.5" fill="#a8a8a8">bigger did not fix it: a bigger completion engine</text><text x="56" y="214" font-size="13.5" fill="#a8a8a8">is still a completion engine</text><rect x="503.0" y="14" width="435.0" height="238" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">Can human judgments about which</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">response is better be turned into a</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">training signal that reshapes behavior?</text><line x1="467.0" y1="133.0" x2="487.0" y2="133.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,128.0 495.0,133.0 487.0,138.0" fill="#a8a8a8"/></svg>