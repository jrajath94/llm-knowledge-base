<text x='716' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Productionizing</text>
<line x1='784' y1='195' x2='804' y2='195' stroke='#8a8a8a' stroke-width='2'/>
