<text x='560' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Inference serving</text>
<line x1='628' y1='195' x2='648' y2='195' stroke='#8a8a8a' stroke-width='2'/>
