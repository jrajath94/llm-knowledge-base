<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450">
  <defs><style>.t{font:bold 22px sans-serif;fill:#1a1a1a}.b{font:bold 14px sans-serif;fill:#fff}.l{font:12px sans-serif;fill:#333}.a{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a5)}</style>
  <marker id="a5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#333"/></marker></defs>
  <rect width="960" height="450" fill="#fafafa"/>
  <text x="480" y="35" text-anchor="middle" class="t">RAG: Retrieve, Then Generate</text>
  <g>
    <rect x="30" y="80" width="120" height="60" rx="6" fill="#1976d2"/><text x="90" y="105" text-anchor="middle" class="b">Query</text><text x="90" y="125" text-anchor="middle" class="b" font-size="11">user question</text>
    <line x1="150" y1="110" x2="180" y2="110" class="a"/>
    <rect x="180" y="80" width="120" height="60" rx="6" fill="#7b1fa2"/><text x="240" y="105" text-anchor="middle" class="b">Embed</text><text x="240" y="125" text-anchor="middle" class="b" font-size="11">vector</text>
    <line x1="300" y1="110" x2="330" y2="110" class="a"/>
    <rect x="330" y="80" width="140" height="60" rx="6" fill="#f57c00"/><text x="400" y="105" text-anchor="middle" class="b">Vector Search</text><text x="400" y="125" text-anchor="middle" class="b" font-size="11">top-k chunks</text>
    <line x1="470" y1="110" x2="500" y2="110" class="a"/>
    <rect x="500" y="80" width="120" height="60" rx="6" fill="#c2185b"/><text x="560" y="105" text-anchor="middle" class="b">Rerank</text><text x="560" y="125" text-anchor="middle" class="b" font-size="11">cross-encoder</text>
    <line x1="620" y1="110" x2="650" y2="110" class="a"/>
    <rect x="650" y="80" width="140" height="60" rx="6" fill="#388e3c"/><text x="720" y="105" text-anchor="middle" class="b">Generate</text><text x="720" y="125" text-anchor="middle" class="b" font-size="11">with context</text>
    <line x1="790" y1="110" x2="820" y2="110" class="a"/>
    <rect x="820" y="80" width="110" height="60" rx="6" fill="#5d4037"/><text x="875" y="105" text-anchor="middle" class="b">Cite</text><text x="875" y="125" text-anchor="middle" class="b" font-size="11">sources</text>
  </g>
  <g>
    <rect x="30" y="180" width="900" height="100" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="480" y="205" text-anchor="middle" font-weight="bold" font-size="15">Chunking decides recall: 512 tokens, 50 overlap</text>
    <text x="480" y="230" text-anchor="middle" class="l">Too big: dilutes signal. Too small: loses context. Overlap prevents split answers.</text>
    <text x="480" y="255" text-anchor="middle" class="l">Hybrid: BM25 (keywords) + dense (meaning). Rerank top-50 → top-5.</text>
  </g>
  <g>
    <rect x="30" y="300" width="440" height="100" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="250" y="325" text-anchor="middle" font-weight="bold" font-size="14">Failure: Retrieved but ignored</text>
    <text x="250" y="350" text-anchor="middle" class="l">Model has prior. Context contradicts.</text>
    <text x="250" y="370" text-anchor="middle" class="l">Fix: "Answer ONLY from context."</text>
  </g>
  <g>
    <rect x="490" y="300" width="440" height="100" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <text x="710" y="325" text-anchor="middle" font-weight="bold" font-size="14">Failure: Nothing retrieved</text>
    <text x="710" y="350" text-anchor="middle" class="l">Query ≠ document language.</text>
    <text x="710" y="370" text-anchor="middle" class="l">Fix: HyDE, query rewrite.</text>
  </g>
</svg>
