<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="640" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The agent loop is a cost loop</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Path A bridge: every iteration is a full forward pass over the entire history</text>
<rect x="24" y="94" width="852" height="108" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="128" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">Cost per loop iteration (Volume 8)</text>
<text x="48" y="156" font-size="11" fill="#a8a8a8" text-anchor="start">Every iteration is a full forward pass over the entire history, so history growth is cost growth.</text>
<rect x="24" y="214" width="852" height="108" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="248" font-size="13" font-weight="bold" fill="#f0b429" text-anchor="start">Latency per loop (Volume 8, Ch 6)</text>
<text x="48" y="276" font-size="11" fill="#a8a8a8" text-anchor="start">RRK&#x27;s 6 steps at 2 seconds is a 12-second feature: a TTFT/TPOT budgeting exercise. Measure it, do not</text>
<text x="48" y="293" font-size="11" fill="#a8a8a8" text-anchor="start">guess it.</text>
<rect x="24" y="334" width="852" height="108" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="368" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="start">KV cache growth (Volumes 4, 8)</text>
<text x="48" y="396" font-size="11" fill="#a8a8a8" text-anchor="start">A 10-step agent with 2k tokens of history per step holds far more KV memory than a single chat turn:</text>
<text x="48" y="413" font-size="11" fill="#a8a8a8" text-anchor="start">long-horizon agents are where paged memory earns its keep.</text>
<rect x="24" y="454" width="852" height="108" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="488" font-size="13" font-weight="bold" fill="#b388ff" text-anchor="start">Planning depth (Volume 7)</text>
<text x="48" y="516" font-size="11" fill="#a8a8a8" text-anchor="start">Bounding planning depth is the same instinct as KL constraints in RL: keep the policy near what you can</text>
<text x="48" y="533" font-size="11" fill="#a8a8a8" text-anchor="start">verify.</text>
</svg>