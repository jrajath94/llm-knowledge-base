<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t09fp-title t09fp-desc">
<title id="t09fp-title">Feature pipeline: one definition, two stores</title>
<desc id="t09fp-desc">Raw events flow into a transform step. The transform writes to two stores: the offline store for training and the online store for serving. Training reads the offline store. Serving reads the online store. One shared definition file feeds both, which prevents skew.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">FEATURE PIPELINE (ONE DEFINITION, TWO STORES)</text>
<rect x="30" y="90" width="170" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="115.0" y="124" class="box" fill="#ececec">raw events</text>
<text x="115.0" y="146" class="d">clicks, orders</text>
<text x="115.0" y="164" class="d">append-only log</text>
<rect x="300" y="90" width="170" height="90" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="385.0" y="124" class="box" fill="#ececec">transform</text>
<text x="385.0" y="146" class="d">shared SQL/Python</text>
<text x="385.0" y="164" class="d">one definition</text>
<rect x="570" y="60" width="170" height="90" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="655.0" y="94" class="box" fill="#ececec">offline store</text>
<text x="655.0" y="116" class="d">parquet / warehouse</text>
<text x="655.0" y="134" class="d">for training</text>
<rect x="570" y="200" width="170" height="90" rx="10" fill="#111111" stroke="#ff7a7a" stroke-width="1.5"/>
<text x="655.0" y="234" class="box" fill="#ececec">online store</text>
<text x="655.0" y="256" class="d">low-latency KV</text>
<text x="655.0" y="274" class="d">for serving</text>
<rect x="790" y="60" width="120" height="90" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="850.0" y="94" class="box" fill="#ececec">training</text>
<text x="850.0" y="116" class="d">batch</text>
<rect x="790" y="200" width="120" height="90" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="850.0" y="234" class="box" fill="#ececec">serving</text>
<text x="850.0" y="256" class="d">real-time</text>
<line x1="200" y1="135" x2="300" y2="135" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09fp-ah)"/>
<line x1="470" y1="110" x2="570" y2="105" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09fp-ah)"/>
<line x1="470" y1="160" x2="570" y2="245" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09fp-ah)"/>
<line x1="740" y1="105" x2="790" y2="105" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09fp-ah)"/>
<line x1="740" y1="245" x2="790" y2="245" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09fp-ah)"/>
<text x="30" y="350" class="capl">How to read: left to right = data flow. The fork in the middle is the key idea.</text>
<text x="30" y="372" class="dl">Both stores come from one transform. If they diverge, you get training-serving skew.</text>
<text x="30" y="414" class="dl" fill="#ff7a7a">What breaks: the online store lags. Serving then scores on stale features.</text>
</g>
<defs><marker id="t09fp-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>