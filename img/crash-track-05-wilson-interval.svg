<text x="280" y="36" text-anchor="middle" class="t">Wilson interval: 20/20 is not 100%</text>
<text x="280" y="58" text-anchor="middle" class="xs">20 hits out of 20 tries. 95% confidence.</text>
<line x1="80" y1="150" x2="500" y2="150" stroke="#1a1a1a" stroke-width="2"/>
