<text x="387.30000000000007" y="242" text-anchor="middle" class="s">Wilson: [0.839, 1.000]</text>
<text x="280" y="262" text-anchor="middle" class="xs">The honest bar is wide. 20 successes buy less certainty than you feel.</text>
