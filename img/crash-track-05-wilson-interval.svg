<text x="220.00000000000014" y="176" text-anchor="middle" class="xs">0.8</text>
<line x1="360.0000000000001" y1="144" x2="360.0000000000001" y2="156" stroke="#1a1a1a"/>
<text x="360.0000000000001" y="176" text-anchor="middle" class="xs">0.9</text>
<line x1="500.0000000000001" y1="144" x2="500.0000000000001" y2="156" stroke="#1a1a1a"/>
<text x="500.0000000000001" y="176" text-anchor="middle" class="xs">1.0</text>
<circle cx="500.0000000000001" cy="110" r="7" fill="#dc2626"/>
