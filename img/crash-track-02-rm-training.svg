<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" style="max-width:680px" role="img" aria-label="Reward model training loop: preference pairs train the reward model with the Bradley-Terry loss; the model scores rollouts for PPO and is refreshed with on-policy samples">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Reward model training and refresh loop</text>
<rect class="box" x="24" y="70" width="180" height="80" rx="8"/>
<text class="big" x="114" y="96" text-anchor="middle">Preference pairs</text>
<text class="m" x="114" y="118" text-anchor="middle">prompt + chosen</text>
<text class="m" x="114" y="136" text-anchor="middle">+ rejected</text>
<line class="arr" x1="204" y1="110" x2="252" y2="110"/>
<rect class="box" x="252" y="70" width="180" height="80" rx="8"/>
<text class="big" x="342" y="96" text-anchor="middle">Bradley-Terry loss</text>
<text class="m" x="342" y="118" text-anchor="middle">-log sigmoid(r_w - r_l)</text>
<text class="m" x="342" y="136" text-anchor="middle">trains the scorer</text>
<line class="arr" x1="432" y1="110" x2="480" y2="110"/>
<rect class="box" x="480" y="70" width="176" height="80" rx="8"/>
<text class="big" x="568" y="96" text-anchor="middle">Reward model</text>
<text class="m" x="568" y="118" text-anchor="middle">one scalar score</text>
<text class="m" x="568" y="136" text-anchor="middle">per response</text>
<line class="arr" x1="568" y1="150" x2="568" y2="200"/>
<rect class="box" x="480" y="200" width="176" height="80" rx="8"/>
<text class="big" x="568" y="226" text-anchor="middle">PPO scores rollouts</text>
<text class="m" x="568" y="248" text-anchor="middle">policy updates</text>
<text class="m" x="568" y="266" text-anchor="middle">against the scores</text>
<path d="M 480 252 C 390 296, 300 296, 230 250" class="arr"/>
<rect class="box" x="24" y="200" width="200" height="80" rx="8" stroke="#f0b429"/>
<text class="big" x="124" y="226" text-anchor="middle">Refresh every few rounds</text>
<text class="m" x="124" y="248" text-anchor="middle">sample the CURRENT policy,</text>
<text class="m" x="124" y="266" text-anchor="middle">label, retrain (T.1.3 rule 1)</text>
<line class="arr" x1="124" y1="200" x2="124" y2="150"/>
<text class="m" x="24" y="330">A stale reward model misranks the current policy. PPO then optimizes the misranking.</text>
<text class="m" x="24" y="352">The reward model must chase the policy, not the other way around.</text></svg>
