<text x="24" y="590" font-size="13" fill="#ececec">ICI bandwidth is uniform across the mesh, so collectives stay within a few hops.</text>
<text x="24" y="616" font-size="13" fill="#f0b429">Rule of thumb: name JAX mesh axes to match the torus instead of fighting it.</text>
