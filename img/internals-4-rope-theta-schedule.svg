<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-label="RoPE theta schedule across dimension pairs">
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#ececec}
    .m{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#a8a8a8}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
  <text x="20" y="30" class="t" font-size="17" font-weight="700">RoPE theta schedule: one speed per dimension pair</text>
  <text x="20" y="54" class="m mono" font-size="13">theta_i = 10000^(-2i/d), d = 128 head dim, 64 pairs</text>
  <!-- axes -->
  <line x1="70" y1="330" x2="640" y2="330" stroke="#262626"/>
  <line x1="70" y1="330" x2="70" y2="90" stroke="#262626"/>
  <text x="355" y="365" class="m" font-size="13" text-anchor="middle">dimension pair i (0 = first pair, 63 = last pair)</text>
  <text x="30" y="210" class="m" font-size="13" text-anchor="middle" transform="rotate(-90 30 210)">log10 wavelength (tokens)</text>
  <!-- y ticks: log10(lambda) = 0.798 + i/16 ; plot y = 330 - (val-0.798)*57 -->
  <g class="m mono" font-size="11">
    <text x="60" y="334" text-anchor="end">0.8</text>
    <text x="60" y="277" text-anchor="end">1.8</text>
    <text x="60" y="220" text-anchor="end">2.8</text>
    <text x="60" y="163" text-anchor="end">3.8</text>
    <text x="60" y="106" text-anchor="end">4.8</text>
  </g>
  <g stroke="#1c1c1c">
    <line x1="70" y1="273" x2="640" y2="273"/>
    <line x1="70" y1="216" x2="640" y2="216"/>
    <line x1="70" y1="159" x2="640" y2="159"/>
    <line x1="70" y1="102" x2="640" y2="102"/>
  </g>
  <!-- the line: x(i)=70+i*(570/63), y=330-(i/16)*57 -->
  <polyline points="70,330 640,106" fill="none" stroke="#f0b429" stroke-width="2.5"/>
  <!-- endpoint dots -->
  <circle cx="70" cy="330" r="5" fill="#f0b429"/>
  <circle cx="640" cy="106" r="5" fill="#f0b429"/>
  <!-- annotations -->
  <text x="70" y="352" class="m mono" font-size="11">i=0: wavelength ~6 tokens</text>
  <text x="640" y="352" class="m mono" font-size="11" text-anchor="end">i=63: wavelength ~54k tokens</text>
  <rect x="95" y="100" width="220" height="66" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="110" y="126" class="t" font-size="12" font-weight="700">fast pairs (left)</text>
  <text x="110" y="146" class="m" font-size="12">spin quickly with position:</text>
  <text x="110" y="162" class="m" font-size="12">resolve exact nearby offsets</text>
  <rect x="395" y="240" width="220" height="66" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="410" y="266" class="t" font-size="12" font-weight="700">slow pairs (right)</text>
  <text x="410" y="286" class="m" font-size="12">barely turn: carry coarse</text>
  <text x="410" y="302" class="m" font-size="12">long-range distance</text>
  <text x="20" y="388" class="m" font-size="12">Straight line on a log axis: the schedule is geometric, the same shape as the sinusoidal encoding it replaced.</text>
</svg>
