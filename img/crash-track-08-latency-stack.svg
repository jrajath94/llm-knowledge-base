<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260">
<rect width="560" height="260" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Where the seconds go: TTFT vs total latency</text><rect x='60' y='90' width='90' height='44' fill='#f0b429' opacity='0.75'/><text x='105.0' y='117' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>TTFT &lt; 1s</text><text x='105.0' y='152' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>what users feel</text><rect x='150' y='90' width='260' height='44' fill='#e57ea6' opacity='0.75'/><text x='280.0' y='117' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>decode</text><text x='280.0' y='152' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>tokens stream out</text><rect x='410' y='90' width='120' height='44' fill='#9a9a9a' opacity='0.75'/><text x='470.0' y='117' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>tail p95 &lt; 8s</text><text x='470.0' y='152' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>governs the tail</text><text x='60' y='200' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>A 2s gap with no tokens is a tracked stall, even if the total looks fine.</text><text x='60' y='226' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Measure TTFT separately from total latency. Track tail per component.</text></svg>