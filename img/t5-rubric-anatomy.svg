<svg xmlns="http://www.w3.org/2000/svg" width="720" height="361" viewBox="0 0 720 361" role="img" aria-label="Rubric anatomy with anchored examples">
<rect width="720" height="361" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Rubric anatomy: three parts, each doing one job</text>
<rect class="box" x="30" y="60" width="200" height="150" rx="8"/>
<text class="t" x="130" y="84" text-anchor="middle">criteria</text>
<text class="s" x="130" y="104" text-anchor="middle">what "good" looks like</text>
<text class="s" x="130" y="121" text-anchor="middle">named, observable,</text>
<text class="s" x="130" y="138" text-anchor="middle">one idea each</text>
<line x1="30" y1="60" x2="30" y2="210" stroke="#f0b429" stroke-width="4"/>
<path d="M230,135 L260,135" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="260" y="60" width="200" height="150" rx="8"/>
<text class="t" x="360" y="84" text-anchor="middle">levels</text>
<text class="s" x="360" y="104" text-anchor="middle">1 to 5, each with</text>
<text class="s" x="360" y="121" text-anchor="middle">a written description</text>
<text class="s" x="360" y="138" text-anchor="middle">anchored with examples</text>
<line x1="260" y1="60" x2="260" y2="210" stroke="#58a6ff" stroke-width="4"/>
<path d="M460,135 L490,135" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="490" y="60" width="200" height="150" rx="8"/>
<text class="t" x="590" y="84" text-anchor="middle">decision rules</text>
<text class="s" x="590" y="104" text-anchor="middle">the edge cases,</text>
<text class="s" x="590" y="121" text-anchor="middle">written down before</text>
<text class="s" x="590" y="138" text-anchor="middle">grading starts</text>
<line x1="490" y1="60" x2="490" y2="210" stroke="#3fb950" stroke-width="4"/>
<rect class="box" x="130" y="240" width="460" height="96" rx="8"/>
<text x="360" y="268" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">anchored example</text>
<text x="360" y="292" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">level 3 is not "okay": it is two worked answers the judges studied</text>
<text x="360" y="312" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">unanchored levels drift. Anchored levels grade the same twice.</text>
</svg>