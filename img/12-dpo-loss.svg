<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img"><rect x="8" y="8" width="944" height="384" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="28" y="36" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">PAPER 10 · DPO</text><text x="28" y="62" font-size="16" font-weight="700" fill="#ececec">One loss replaces reward model plus PPO</text><rect x="40" y="88" width="420" height="250" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="250" y="118" font-size="13" font-weight="700" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">PPO / RLHF</text><text x="250" y="150" font-size="13" font-weight="400" fill="#777" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">✕  reward model</text><text x="250" y="186" font-size="13" font-weight="400" fill="#777" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">✕  value network</text><text x="250" y="222" font-size="13" font-weight="400" fill="#777" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">✕  sampling loop</text><text x="250" y="258" font-size="13" font-weight="400" fill="#777" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">✕  PPO updates</text><text x="250" y="294" font-size="13" font-weight="400" fill="#777" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">✕  KL tuning</text><rect x="500" y="88" width="420" height="250" rx="8" fill="#1d1d1d" stroke="#7fd08a"/><text x="710" y="118" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">DPO</text><text x="710" y="155" font-size="14.5" font-weight="700" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">−log σ( β·log π(yw)/πref  −  β·log π(yl)/πref )</text><text x="710" y="195" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">push chosen up · push rejected down</text><text x="710" y="220" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">KL constraint baked in via πref</text><text x="710" y="262" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">one model · one loss · supervised infra</text><text x="710" y="292" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">no sampling · no value net · stable</text><line x1="460" y1="210" x2="492" y2="210" stroke="#7fd08a" stroke-width="2.5"/><polygon points="492,210 483,206 483,214" fill="#7fd08a"/><text x="480" y="362" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">same optimum as the KL-constrained RL objective, solved in closed form</text></svg>