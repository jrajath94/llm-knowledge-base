<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.6. Guardrail layering: four gates around the pipeline</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">each gate catches a different failure</text>
<rect x="140" y="110" width="600" height="60" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="135" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INPUT</text>
<text x="440" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">PII scrub, injection patterns, policy check on the way in</text>
<line x1="440" y1="170" x2="440" y2="188" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,188 436.33015592246386,179.78219953718923 443.66984407753614,179.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="188" width="600" height="60" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="213" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">RETRIEVAL</text>
<text x="440" y="232" font-size="11" fill="#a8a8a8" text-anchor="middle">source allowlist, freshness check, injection scan on documents</text>
<line x1="440" y1="248" x2="440" y2="266" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,266 436.33015592246386,257.78219953718923 443.66984407753614,257.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="266" width="600" height="60" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="291" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">GENERATION</text>
<text x="440" y="310" font-size="11" fill="#a8a8a8" text-anchor="middle">the model with its system prompt and tool contracts</text>
<line x1="440" y1="326" x2="440" y2="344" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,344 436.33015592246386,335.78219953718923 443.66984407753614,335.78219953718923" fill="#8a8a8a"/>
<rect x="140" y="344" width="600" height="60" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="369" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">OUTPUT</text>
<text x="440" y="388" font-size="11" fill="#a8a8a8" text-anchor="middle">citation check, policy check, formatting validation on the way out</text>
<text x="24" y="500" font-size="12" fill="#a8a8a8" text-anchor="start">No single gate catches everything: the input gate never sees a retrieved injection, the output gate never sees</text>
<text x="24" y="517" font-size="12" fill="#a8a8a8" text-anchor="start">a poisoned source.</text>
</svg>