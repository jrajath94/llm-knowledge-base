<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Incident severity ladder: S1 to S4">
<rect width="560" height="360" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1a1a1a} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#6b7280} .b{font-weight:700}</style>
<text x="280" y="36" text-anchor="middle" class="t">Incident severity: S1 to S4</text>
<text x="280" y="58" text-anchor="middle" class="xs">Severity sets the clock. The clock sets the response.</text>
<rect x="60" y="92" width="70" height="52" rx="6" fill="#dc2626"/>
<text x="95" y="125" text-anchor="middle" class="s b" fill="#fff">S1</text>
<rect x="140" y="92" width="360" height="52" rx="6" fill="#f3f4f6"/>
<text x="160" y="116" class="s">Active harm at scale</text>
<text x="160" y="134" class="xs">Response: Page now</text>
<rect x="60" y="154" width="70" height="52" rx="6" fill="#d97706"/>
<text x="95" y="187" text-anchor="middle" class="s b" fill="#fff">S2</text>
<rect x="140" y="154" width="360" height="52" rx="6" fill="#f3f4f6"/>
<text x="160" y="178" class="s">Harm likely, not yet widespread</text>
<text x="160" y="196" class="xs">Response: Same day</text>
<rect x="60" y="216" width="70" height="52" rx="6" fill="#2563eb"/>
<text x="95" y="249" text-anchor="middle" class="s b" fill="#fff">S3</text>
<rect x="140" y="216" width="360" height="52" rx="6" fill="#f3f4f6"/>
<text x="160" y="240" class="s">Potential harm, contained</text>
<text x="160" y="258" class="xs">Response: Normal cycle</text>
<rect x="60" y="278" width="70" height="52" rx="6" fill="#6b7280"/>
<text x="95" y="311" text-anchor="middle" class="s b" fill="#fff">S4</text>
<rect x="140" y="278" width="360" height="52" rx="6" fill="#f3f4f6"/>
<text x="160" y="302" class="s">Low risk, log and watch</text>
<text x="160" y="320" class="xs">Response: Log it</text>
</svg>
