<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 547" role="img" aria-label="The day the run dies: the first hour">
<rect width="900" height="547" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The day the run dies: the first hour</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A 2,000-GPU run starts diverging at step 40,000. Alerts fire. This is the job.</text>
<circle cx="450.0" cy="97.0" r="8" fill="#2dd4bf"/>
<line x1="450.0" y1="105.0" x2="450.0" y2="165.0" stroke="#3a3a3a" stroke-width="3"/>
<rect x="474.0" y="77.0" width="380.0" height="68.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="490.0" y="103.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">1. Read the curve</text>
<text x="490.0" y="123.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Spike (recoverable) or divergence (fatal)?</text>
<text x="490.0" y="137.8" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Chapter 8 teaches the signatures.</text>
<circle cx="450.0" cy="185.0" r="8" fill="#2dd4bf"/>
<line x1="450.0" y1="193.0" x2="450.0" y2="253.0" stroke="#3a3a3a" stroke-width="3"/>
<rect x="474.0" y="165.0" width="380.0" height="68.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="490.0" y="191.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">2. Check the checkpoint</text>
<text x="490.0" y="211.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Roll back to the last good weights if the spike</text>
<text x="490.0" y="225.8" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">is transient.</text>
<circle cx="450.0" cy="273.0" r="8" fill="#4aa8ff"/>
<line x1="450.0" y1="281.0" x2="450.0" y2="341.0" stroke="#3a3a3a" stroke-width="3"/>
<rect x="474.0" y="253.0" width="380.0" height="68.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="490.0" y="279.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">3. Find the cause</text>
<text x="490.0" y="299.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Bad data shard, flaky node, or LR schedule bug.</text>
<text x="490.0" y="313.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Inspect, do not guess.</text>
<circle cx="450.0" cy="361.0" r="8" fill="#ff9f43"/>
<line x1="450.0" y1="369.0" x2="450.0" y2="429.0" stroke="#3a3a3a" stroke-width="3"/>
<rect x="474.0" y="341.0" width="380.0" height="68.0" rx="6" fill="#111111" stroke="#ff9f43" stroke-width="1.5"/>
<text x="490.0" y="367.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">4. Decide</text>
<text x="490.0" y="387.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Resume, restart, or redesign. A restart with no</text>
<text x="490.0" y="401.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">fix burns money twice.</text>
<circle cx="450.0" cy="449.0" r="8" fill="#b388ff"/>
<rect x="474.0" y="429.0" width="380.0" height="68.0" rx="6" fill="#111111" stroke="#b388ff" stroke-width="1.5"/>
<text x="490.0" y="455.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">5. Write the post-mortem</text>
<text x="490.0" y="475.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">One page: what happened, the signature, what</text>
<text x="490.0" y="489.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">changed. Knowledge compounds.</text>
</svg>
