<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="100%" style="max-width:760px" role="img" aria-label="Q1 claim as falsifiable sentence, Q2 evidence as compute ablations seeds, Q3 what changes in my work; two stop rules">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="298" fill="none"/>
<text class="t" x="24" y="30">The 90-minute first pass: three questions before page 4</text>
<rect x="24" y="56" width="216" height="96" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.8"/>
<text class="big g" x="40" y="86">Q1</text>
<text class="num" x="40" y="110">What is the claim,</text>
<text class="m" x="40" y="132">stated as a falsifiable sentence?</text>
<path class="arr" d="M240 104 L268 104"/>
<rect x="268" y="56" width="216" height="96" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.8"/>
<text class="big g" x="284" y="86">Q2</text>
<text class="num" x="284" y="108">What is the evidence?</text>
<text class="m" x="284" y="130">compute, ablations,</text>
<text class="m" x="284" y="150">seeds: not adjectives</text>
<path class="arr" d="M484 104 L512 104"/>
<rect x="512" y="56" width="216" height="96" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.8"/>
<text class="big g" x="528" y="86">Q3</text>
<text class="num" x="528" y="110">What would change in my work</text>
<text class="m" x="528" y="132">if the claim were true?</text>
<text class="big g" x="24" y="196">Stop rules</text>
<text class="num" x="24" y="222">Cannot answer Q1 -&gt; the paper has no claim to evaluate.</text>
<text class="num" x="24" y="248">Q3 answer is "nothing" -&gt; stop reading and move on.</text>
<text class="m" x="24" y="274">90 minutes, three questions, then decide: reproduce at proxy scale or file it.</text>
</svg>
