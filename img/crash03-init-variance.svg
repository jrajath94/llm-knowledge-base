<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="100%" style="max-width:700px" role="img" aria-label="Xavier-scaled ReLU variance collapses to about 0.001 after 10 layers while He-scaled variance holds at 1.0">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="356" fill="none"/>
<text class="t" x="24" y="30">Xavier vs He through 10 ReLU layers</text>
<line x1="90" y1="250" x2="660" y2="250" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="90" y1="250" x2="90" y2="60" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="m" x="375" y="282" text-anchor="middle">layers</text>
<text class="m" x="46" y="155" text-anchor="middle" transform="rotate(-90 46 155)">variance (log)</text>
<polyline points="90,60 147,74 204,89 261,103 318,117 375,131 432,146 489,160 546,174 603,189 660,203" fill="none" stroke="#e57373" stroke-width="3"/>
<circle cx="660" cy="203" r="6" fill="#e57373"/>
<text class="r" x="652.0" y="188.98924794039107" text-anchor="end">~0.001</text>
<text class="r" x="480" y="150">Xavier + ReLU collapses</text>
<polyline points="90,60 147,60 204,60 261,60 318,60 375,60 432,60 489,60 546,60 603,60 660,60" fill="none" stroke="#7fc97f" stroke-width="3"/>
<text class="gr" x="480" y="120">He: holds at 1.0</text>
<text class="num" x="24" y="312">Xavier under-scales ReLU by the missing factor of 2: the signal decays layer by layer.</text>
<text class="m" x="24" y="334">Sanity check at init: dead ReLU should be ~50%. Far from 50% means wrong scale, not bad luck.</text>
</svg>
