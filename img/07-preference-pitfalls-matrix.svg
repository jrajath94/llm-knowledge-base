<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="700" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Classic preference-data pitfalls</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">What happens, how it shows up in the model, and the fix</text>
<rect x="24" y="82" width="180" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="103" font-size="12" fill="#ececec" text-anchor="start">Pitfall</text>
<rect x="204" y="82" width="330" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="214" y="103" font-size="12" fill="#ececec" text-anchor="start">How it shows up</text>
<rect x="534" y="82" width="342" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="544" y="103" font-size="12" fill="#ececec" text-anchor="start">Fix</text>
<rect x="24" y="116" width="180" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="140" font-size="11" fill="#ececec" text-anchor="start">Verbosity bias</text>
<rect x="204" y="116" width="330" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="214" y="140" font-size="11" fill="#a8a8a8" text-anchor="start">Labelers use length as a proxy for effort; the</text>
<text x="214" y="157" font-size="11" fill="#a8a8a8" text-anchor="start">model pads</text>
<rect x="534" y="116" width="342" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="544" y="140" font-size="11" fill="#a8a8a8" text-anchor="start">Length-controlled comparisons; penalize padding</text>
<rect x="24" y="216" width="180" height="100" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="240" font-size="11" fill="#ececec" text-anchor="start">Sycophancy</text>
<rect x="204" y="216" width="330" height="100" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="214" y="240" font-size="11" fill="#a8a8a8" text-anchor="start">Labelers prefer answers that agree; the model</text>
<text x="214" y="257" font-size="11" fill="#a8a8a8" text-anchor="start">validates false beliefs</text>
<rect x="534" y="216" width="342" height="100" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="544" y="240" font-size="11" fill="#a8a8a8" text-anchor="start">Rubric: honesty outranks agreement</text>
<rect x="24" y="316" width="180" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="340" font-size="11" fill="#ececec" text-anchor="start">Guideline drift</text>
<rect x="204" y="316" width="330" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="214" y="340" font-size="11" fill="#a8a8a8" text-anchor="start">Rubric interpretation shifts over weeks; the RM</text>
<text x="214" y="357" font-size="11" fill="#a8a8a8" text-anchor="start">learns a blurry average</text>
<rect x="534" y="316" width="342" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="544" y="340" font-size="11" fill="#a8a8a8" text-anchor="start">Version the rubric; recalibrate labelers</text>
<rect x="24" y="416" width="180" height="100" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="440" font-size="11" fill="#ececec" text-anchor="start">Demographic skew</text>
<rect x="204" y="416" width="330" height="100" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="214" y="440" font-size="11" fill="#a8a8a8" text-anchor="start">A small homogeneous pool bakes in one culture&#x27;s</text>
<text x="214" y="457" font-size="11" fill="#a8a8a8" text-anchor="start">taste</text>
<rect x="534" y="416" width="342" height="100" fill="#161616" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="544" y="440" font-size="11" fill="#a8a8a8" text-anchor="start">Diversify the pool; slice evals by group</text>
<rect x="24" y="516" width="180" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="540" font-size="11" fill="#ececec" text-anchor="start">Cost pressure</text>
<rect x="204" y="516" width="330" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="214" y="540" font-size="11" fill="#a8a8a8" text-anchor="start">Going faster trades quality for volume; DPO fits</text>
<text x="214" y="557" font-size="11" fill="#a8a8a8" text-anchor="start">noise hard</text>
<rect x="534" y="516" width="342" height="100" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="544" y="540" font-size="11" fill="#a8a8a8" text-anchor="start">Pay for quality; track agreement per batch</text>
<text x="24" y="664" font-size="12" fill="#f0b429" text-anchor="start">Key line from the chapter: data beats algorithm. Fix the verbosity bias and the labels before swapping PPO for DPO.</text>
</svg>