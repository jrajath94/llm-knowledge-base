<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Diagram of the independence assumption: three blind labelers versus three labelers sharing one misunderstanding.">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Independence is the load-bearing assumption</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Three blind labelers who share one misunderstanding agree confidently and wrongly.</text>
<text x="220" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#7fd08a">Blind and independent</text>
<text x="580" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#e67e7e">Shared misunderstanding</text>
<circle cx="145" cy="180" r="38" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="145" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">L1</text>
<circle cx="480" cy="180" r="38" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="480" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">L1</text>
<circle cx="245" cy="180" r="38" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="245" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">L2</text>
<circle cx="580" cy="180" r="38" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="580" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">L2</text>
<circle cx="345" cy="180" r="38" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="345" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">L3</text>
<circle cx="680" cy="180" r="38" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="680" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">L3</text>
<line x1="480" y1="136" x2="680" y2="136" stroke="#e67e7e" stroke-width="2" stroke-dasharray="6,4"/>
<text x="580" y="122" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#e67e7e">same wrong rule</text>
<text x="220" y="260" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#7fd08a">errors are independent</text>
<text x="220" y="284" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">majority vote works</text>
<text x="580" y="260" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#e67e7e">errors are correlated</text>
<text x="580" y="284" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">majority agrees, confidently wrong</text>
<text x="400" y="360" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Blind labeling plus gold items is what keeps the assumption honest.</text>
<text x="400" y="390" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">If all three share the same misunderstanding, the 84% math collapses.</text>
</svg>