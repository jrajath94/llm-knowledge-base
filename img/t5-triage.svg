<svg xmlns="http://www.w3.org/2000/svg" width="720" height="373" viewBox="0 0 720 373" role="img" aria-label="Triage severity scale and first-hour checklist">
<rect width="720" height="373" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Triage: the first hour is a checklist, not a panic</text>
<rect class="box" x="60" y="58" width="600" height="56" rx="8"/>
<line x1="60" y1="58" x2="60" y2="114" stroke="#e5484d" stroke-width="4"/>
<text x="86" y="80" text-anchor="start" fill="#e5484d" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">S1</text>
<text x="130" y="80" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">active, ongoing harm at scale</text>
<text x="130" y="100" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">page on-call + safety lead now</text>
<rect class="box" x="60" y="124" width="600" height="56" rx="8"/>
<line x1="60" y1="124" x2="60" y2="180" stroke="#f0b429" stroke-width="4"/>
<text x="86" y="146" text-anchor="start" fill="#f0b429" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">S2</text>
<text x="130" y="146" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">serious but bounded</text>
<text x="130" y="166" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">same-day response, fix within the week</text>
<rect class="box" x="60" y="190" width="600" height="56" rx="8"/>
<line x1="60" y1="190" x2="60" y2="246" stroke="#58a6ff" stroke-width="4"/>
<text x="86" y="212" text-anchor="start" fill="#58a6ff" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">S3</text>
<text x="130" y="212" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">concerning but rare or low-impact</text>
<text x="130" y="232" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">fix in the normal cycle</text>
<rect class="box" x="60" y="256" width="600" height="56" rx="8"/>
<line x1="60" y1="256" x2="60" y2="312" stroke="#8a8a8a" stroke-width="4"/>
<text x="86" y="278" text-anchor="start" fill="#8a8a8a" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">S4</text>
<text x="130" y="278" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">paper cut</text>
<text x="130" y="298" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">log it, fix when nearby work touches it</text>
<text x="360" y="348" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">first hour: reproduce, record prompts + version, assess blast radius, decide hold or rollback</text>
</svg>