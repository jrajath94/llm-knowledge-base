<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Judge monitoring dashboard loop">
<rect width="720" height="350" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Judge monitoring: three panels, one loop</text>
<rect class="box" x="30" y="60" width="215" height="120" rx="8"/>
<line x1="30" y1="60" x2="30" y2="180" stroke="#f0b429" stroke-width="4"/>
<text x="137" y="92" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">rolling agreement</text>
<text x="137" y="118" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">judge vs human</text>
<text x="137" y="138" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">spot checks</text>
<rect class="box" x="257" y="60" width="215" height="120" rx="8"/>
<line x1="257" y1="60" x2="257" y2="180" stroke="#58a6ff" stroke-width="4"/>
<text x="364" y="92" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">score distribution</text>
<text x="364" y="118" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">drift over time</text>
<text x="364" y="138" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">mean, spread, shape</text>
<rect class="box" x="484" y="60" width="215" height="120" rx="8"/>
<line x1="484" y1="60" x2="484" y2="180" stroke="#3fb950" stroke-width="4"/>
<text x="591" y="92" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">disagreement review</text>
<text x="591" y="118" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">queue of hard cases</text>
<text x="591" y="138" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">re-grade, recalibrate</text>
<path d="M245,200 L245,225" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M472,200 L472,225" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="220" y="225" width="280" height="64" rx="8"/>
<text x="360" y="251" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">recalibrate the judge</text>
<text x="360" y="271" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">update rubric, re-anchor levels</text>
<path d="M220,257 L150,257" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M150,257 L150,180" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M500,257 L570,257" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M570,257 L570,180" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="360" y="325" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a judge that is never re-checked is a judge you are no longer measuring</text>
</svg>