<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" style="max-width:760px" role="img" aria-label="Straggler tax: per-rank step times; one slow rank makes every step as slow as itself">
<style>
 text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
 .m{fill:#a8a8a8;font-size:12px}
 .t{font-size:14px;font-weight:700}
 .g{fill:#f0b429}
 .bar{fill:#6cb2ff;opacity:0.85}
 .bad{fill:#e57373;opacity:0.9}
 .med{stroke:#f0b429;stroke-width:2;stroke-dasharray:6 4}
 .lbl{font-size:11px;fill:#a8a8a8}
</style>
<rect x="0" y="0" width="760" height="360" fill="none"/>
<text class="t" x="30" y="30">One slow rank taxes every step</text>
<text class="m" x="30" y="50">per-rank step times, 8 ranks, median 2.0 s</text>
<!-- y axis: 0 at y=300, scale 100px per second -->
<g>
 <rect class="bar" x="60"  y="100" width="56" height="200"/>
 <rect class="bar" x="126" y="104" width="56" height="196"/>
 <rect class="bar" x="192" y="98"  width="56" height="202"/>
 <rect class="bar" x="258" y="102" width="56" height="198"/>
 <rect class="bad" x="324" y="52"  width="56" height="248"/>
 <rect class="bar" x="390" y="101" width="56" height="199"/>
 <rect class="bar" x="456" y="99"  width="56" height="201"/>
 <rect class="bar" x="522" y="103" width="56" height="197"/>
 <line class="med" x1="40" y1="100" x2="600" y2="100"/>
 <text class="g" x="608" y="104" font-size="12">median 2.0 s</text>
</g>
<text class="lbl" x="60" y="322">r0</text><text class="lbl" x="126" y="322">r1</text><text class="lbl" x="192" y="322">r2</text><text class="lbl" x="258" y="322">r3</text><text class="lbl" x="324" y="322" fill="#e57373" font-weight="700">r4 SICK</text><text class="lbl" x="390" y="322">r5</text><text class="lbl" x="456" y="322">r6</text><text class="lbl" x="522" y="322">r7</text>
<text class="t" x="30" y="350" font-size="13">Synchronous training finishes each step when the slowest rank finishes: r4 at 3.1 s (1.54x) makes all 8 ranks wait. Straggler factor = max / median. Above 1.1x investigate, above 1.3x act.</text>
</svg>
