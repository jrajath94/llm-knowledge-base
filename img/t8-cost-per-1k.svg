<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 480' width='100%' role='img'>
<title>Cost per 1K requests</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The $/1K requests math, worked</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Support copilot: 2,000 input tokens + 500 output tokens per request. Premium tier: $2.50 / $10.00 per million.</text>
<rect x='120' y='140' width='320' height='70' rx='6' fill='#1565c0' fill-opacity='0.70'/>
<text x='280' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='middle'>Input: 2M tokens x $2.50</text>
<text x='280' y='192' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='middle'>= $5.00 per 1K requests</text>
<rect x='520' y='140' width='320' height='70' rx='6' fill='#f0b429' fill-opacity='0.70'/>
<text x='680' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='middle'>Output: 0.5M tokens x $10.00</text>
<text x='680' y='192' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='middle'>= $5.00 per 1K requests</text>
<rect x='300' y='260' width='360' height='80' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='480' y='286' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Total: $10.00 per 1K requests</text>
<text x='480' y='306' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$0.01 per request; scale by</text>
<text x='480' y='324' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>traffic before anything else</text>
<text x='480' y='390' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cost per request = (Tin / 1e6 x Pin) + (Tout / 1e6 x Pout). Input usually dominates at 4:1 token ratios.</text>
<text x='480' y='420' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: write the math before the architecture. The four cost levers in 5.2 move these two terms.</text>
</svg>