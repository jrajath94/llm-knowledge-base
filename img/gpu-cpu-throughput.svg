<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" style="max-width:700px" role="img" aria-label="Bar comparison: server CPU about 2 TFLOPS vs H100 about 2000 TFLOPS">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="240" fill="none"/>
<text class="t" x="24" y="30">Why ML lives on GPUs: the throughput gap</text>
<text class="m" x="24" y="62">CPU: dozens of clever cores, low-latency sequential work</text>
<rect x="24" y="76" width="6" height="26" rx="3" fill="#8a8a8a"/>
<text class="num" x="40" y="95">server CPU  ~ 1-2 TFLOPS (a 1000x shorter bar)</text>
<text class="m" x="24" y="132">GPU: thousands of simple cores, one program on millions of threads</text>
<rect x="24" y="142" width="640" height="30" rx="4" fill="#f0b429"/>
<text class="big" x="30" y="163">H100  ~ 2,000 TFLOPS (FP8)</text>
<text class="m" x="24" y="200">A frontier training run needs ~10^25 FLOPs. At 2 TFLOPS that is thousands of years.</text>
<text class="m" x="24" y="220">At 2,000 TFLOPS it is weeks. Same arithmetic, a thousand-fold throughput gap.</text>
</svg>
