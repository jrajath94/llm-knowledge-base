<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="620" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The throughput math, worked</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">14 GB model on a GPU with 2 TB/s of memory bandwidth (illustrative)</text>
<rect x="24" y="94" width="852" height="110" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="126" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace" fill="#ececec" text-anchor="middle">time per decode step = model bytes / memory bandwidth</text>
<text x="48" y="158" font-size="11" fill="#a8a8a8" text-anchor="start">Decode is memory-bound, so this division sets the floor: no kernel trick beats the bus. Worked: 14 GB /</text>
<text x="48" y="175" font-size="11" fill="#a8a8a8" text-anchor="start">2 TB/s = 0.007 s, about 7 ms per step.</text>
<text x="24" y="268" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">Batch 1</text>
<rect x="200" y="244" width="20.0" height="34" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="232.0" y="267" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">about 140 tokens/s</text>
<text x="24" y="296" font-size="11" fill="#8a8a8a" text-anchor="start">one token per 7 ms</text>
<text x="24" y="352" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">Batch 32</text>
<rect x="200" y="328" width="560" height="34" fill="#7dd87d" rx="4" opacity="1"/>
<text x="772" y="351" font-size="13" font-weight="bold" fill="#7dd87d" text-anchor="start">about 4000 tokens/s</text>
<text x="24" y="380" font-size="11" fill="#8a8a8a" text-anchor="start">32 tokens per ~8 ms (a little overhead): 28x the throughput</text>
<text x="24" y="432" font-size="12" fill="#f0b429" text-anchor="start">Same weights, same memory reads, 28x the throughput. The ceiling is KV cache memory: every sequence in the batch holds</text>
<text x="24" y="449" font-size="12" fill="#f0b429" text-anchor="start">its own KV cache, and the batch cannot exceed GPU memory.</text>
</svg>