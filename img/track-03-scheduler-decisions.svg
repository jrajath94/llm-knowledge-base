<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540"><rect width="700" height="540" fill="#0d0d0d"/>
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#e8e8e8}
.t{font-size:19px;font-weight:bold}.s{font-size:13.5px}.xs{font-size:12px;fill:#8a8a8a}
.b{fill:#161616;stroke:#3a3a3a;stroke-width:1.4}
.acc{fill:none;stroke:#f0b429;stroke-width:2;marker-end:url(#ah)}
.acc2{fill:none;stroke:#8a8a8a;stroke-width:1.5;marker-end:url(#ah2)}
</style>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
<marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/></marker>
</defs>
<text x="30" y="38" class="t">The scheduler decides three things, every step</text>
<rect x="230" y="60" width="240" height="60" rx="10" class="b"/>
<text x="350.0" y="90" text-anchor="middle" class="s" font-weight="bold" fill="#e8e8e8">New step starts</text>
<polygon points="350,144 520,200 350,256 180,200" fill="#161616" stroke="#3a3a3a" stroke-width="1.4"/>
<text x="350" y="205" text-anchor="middle" class="s">KV budget left?</text>
<polygon points="350,284 520,340 350,396 180,340" fill="#161616" stroke="#3a3a3a" stroke-width="1.4"/>
<text x="350" y="345" text-anchor="middle" class="s">Pool nearly empty?</text>
<rect x="230" y="450" width="240" height="56" rx="10" class="b"/>
<text x="350.0" y="480" text-anchor="middle" class="s" font-weight="bold" fill="#2dd4bf">Advance one step</text>
<text x="350.0" y="502" text-anchor="middle" class="xs">chunk or token per request</text>
<path d="M 350 120 L 350 142" class="acc2"/>
<path d="M 350 256 L 350 282" class="acc2"/>
<path d="M 350 396 L 350 448" class="acc2"/>
<path d="M 180 200 L 90 200 L 90 478 L 228 478" class="acc"/>
<path d="M 180 340 L 130 340 L 130 478 L 228 478" class="acc"/>
<text x="120" y="192" class="s" fill="#f0b429">yes: admit</text>
<text x="140" y="332" class="s" fill="#f0b429">yes: preempt newest</text>
<text x="420" y="205" class="s" fill="#8a8a8a">no</text>
<text x="420" y="345" class="s" fill="#8a8a8a">no</text>
<text x="540" y="205" class="xs">no: queue waits</text>
<text x="540" y="345" class="xs">no: keep running</text>
</svg>