<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 482" role="img" aria-label="Chapter 4: Daily Temperatures — the worked example, traced">
<rect width="900" height="482" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 4: Daily Temperatures — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 30. temps = [73, 74, 75, 71, 69, 72, 76, 73]. Stack holds indices waiting for a warmer day.</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="120.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=0, 73</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">stack [0]</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">push: no warmer day known yet</text>
<text x="48.0" y="149.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=1, 74</text>
<text x="128.0" y="150.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">74 &gt; 73: pop 0, ans[0]=1; stack [1]</text>
<text x="488.0" y="150.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">day 0's answer is found by day 1</text>
<rect x="40.0" y="159.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="178.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=2, 75</text>
<text x="128.0" y="179.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">75 &gt; 74: pop 1, ans[1]=1; stack [2]</text>
<text x="488.0" y="179.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">day 1's answer is found by day 2</text>
<text x="48.0" y="207.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=3, 71</text>
<text x="128.0" y="208.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">71 &lt; 75: stack [2, 3]</text>
<text x="488.0" y="208.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">colder: push and wait</text>
<rect x="40.0" y="217.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="236.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=4, 69</text>
<text x="128.0" y="237.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">69 &lt; 71: stack [2, 3, 4]</text>
<text x="488.0" y="237.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">colder: push and wait</text>
<text x="48.0" y="274.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=5, 72</text>
<text x="128.0" y="266.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">72 &gt; 69: pop 4, ans[4]=1; 72 &gt; 71: pop 3,</text>
<text x="128.0" y="283.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">ans[3]=2; stack [2, 5]</text>
<text x="488.0" y="266.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">one day resolves two waiters</text>
<rect x="40.0" y="292.0" width="820.0" height="46.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="320.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=6, 76</text>
<text x="128.0" y="312.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">76 &gt; 72: pop 5, ans[5]=1; 76 &gt; 75: pop 2,</text>
<text x="128.0" y="329.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">ans[2]=4; stack [6]</text>
<text x="488.0" y="312.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">the big day resolves everyone</text>
<text x="48.0" y="366.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=7, 73</text>
<text x="128.0" y="358.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">73 &lt; 76: stack [6, 7]; ans = [1, 1, 4, 2, 1,</text>
<text x="128.0" y="375.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">1, 0, 0]</text>
<text x="488.0" y="358.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">no warmer day: answers stay 0</text>
<line x1="40.0" y1="384.0" x2="860.0" y2="384.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="394.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="416.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">The stack is a waiting room in decreasing order. Each index is pushed and popped once: O(n) total,</text>
<text x="58.0" y="432.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">not O(n) per day.</text>
</svg>
