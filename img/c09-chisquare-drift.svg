<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 389" role="img" aria-label="Chi-square drift: category shares the numeric detectors cannot see">
<rect width="900" height="389" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chi-square drift: category shares the numeric detectors cannot see</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A plan tier can flip from 20% to 60% of traffic while every numeric drift check stays green.</text>
