<text x="341.6" y="194.0" text-anchor="start" fill="#e5484d" font-size="11" font-family="Charis SIL, Georgia, serif">serve 28%</text>
<text x="40.0" y="241.0" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">enterprise</text>
