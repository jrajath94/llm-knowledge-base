<line x1="160.0" y1="69.0" x2="160.0" y2="277.0" stroke="#6f6f6f" stroke-width="1"/>
<text x="40.0" y="319.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">The chi-square verdict: the mix moved. Mass left basic and landed on enterprise. Find out why before</text>
<text x="40.0" y="335.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">retraining: retraining bakes the breakage in. Same p-value caveat as KS at large n: read the</text>
<text x="40.0" y="351.4" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">statistic, calibrated against history, not the p-value.</text>
