<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The straggler tax</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">one slow rank out of a thousand costs 30% of total throughput</text>
<text x="24" y="94" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">999 ranks at 2.0 s/step, 1 rank at 2.6 s/step</text>
<rect x="24" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="54" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="94" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="124" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="164" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="194" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="234" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="264" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="304" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="334" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="374" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="404" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="444" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="474" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="514" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="544" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="584" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="614" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="654" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="684" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="724" y="112" width="60" height="40" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="754" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.0s</text>
<rect x="794" y="112" width="60" height="40" fill="#e57ea6" rx="4" opacity="1"/>
<text x="824" y="137" font-size="11" font-weight="bold" fill="#0d0d0d" text-anchor="middle">2.6s</text>
<text x="24" y="184" font-size="13" fill="#e57ea6" text-anchor="start">every step takes 2.6 s. The barrier waits for the slowest rank.</text>
<text x="24" y="208" font-size="13" fill="#a8a8a8" text-anchor="start">The loss curve looks normal. The only symptom is a run slower than it should be, and nobody can say why.</text>
<rect x="24" y="242" width="200" height="64" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="124" y="268" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">compute</text>
<text x="124" y="288" font-size="10" fill="#8a8a8a" text-anchor="middle">thermal throttling, degraded card</text>
<rect x="236" y="242" width="200" height="64" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="4" opacity="1"/>
<text x="336" y="268" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">input</text>
<text x="336" y="288" font-size="10" fill="#8a8a8a" text-anchor="middle">slow storage path, too few loader workers</text>
<rect x="448" y="242" width="200" height="64" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="4" opacity="1"/>
<text x="548" y="268" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">host-to-device</text>
<text x="548" y="288" font-size="10" fill="#8a8a8a" text-anchor="middle">NUMA misplacement, missing pinned memory</text>
<rect x="660" y="242" width="200" height="64" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="4" opacity="1"/>
<text x="760" y="268" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">network fail-slow</text>
<text x="760" y="288" font-size="10" fill="#8a8a8a" text-anchor="middle">degraded NIC, still works, just slowly</text>
<text x="24" y="334" font-size="13" fill="#f0b429" text-anchor="start">Fail-slow is the nastiest: the NCCL timeout never fires because the job is making progress. Compare peers, not thresholds.</text>
</svg>