<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Daly checkpoint interval with failure timeline">
<rect width="720" height="360" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The Daly interval: checkpoint often enough, not too often</text>
<rect class="box" x="60" y="60" width="600" height="90" rx="8"/>
<text x="360" y="92" text-anchor="middle" fill="#ececec" font-size="16" font-weight="700" font-family="Charis SIL, Georgia, serif">interval  =  sqrt( 2 x save_cost x MTBF )</text>
<text x="360" y="122" text-anchor="middle" fill="#f0b429" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">sqrt( 2 x 90 s x 50 h )  =  sqrt(2 x 90 x 180,000)  ~  1.6 hours</text>
<text x="60" y="190" text-anchor="start" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">time -></text>
<line x1="60" y1="200" x2="200" y2="200" stroke="#555" stroke-width="3"/>
<line x1="60" y1="188" x2="60" y2="212" stroke="#f0b429" stroke-width="3"/>
<text x="60" y="226" text-anchor="middle" fill="#f0b429" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">ckpt</text>
<line x1="200" y1="200" x2="340" y2="200" stroke="#555" stroke-width="3"/>
<line x1="200" y1="188" x2="200" y2="212" stroke="#f0b429" stroke-width="3"/>
<text x="200" y="226" text-anchor="middle" fill="#f0b429" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">ckpt</text>
<line x1="340" y1="200" x2="480" y2="200" stroke="#555" stroke-width="3"/>
<line x1="340" y1="188" x2="340" y2="212" stroke="#f0b429" stroke-width="3"/>
<text x="340" y="226" text-anchor="middle" fill="#f0b429" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">ckpt</text>
<line x1="480" y1="200" x2="620" y2="200" stroke="#555" stroke-width="3"/>
<line x1="480" y1="188" x2="480" y2="212" stroke="#f0b429" stroke-width="3"/>
<text x="480" y="226" text-anchor="middle" fill="#f0b429" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">ckpt</text>
<rect x="340" y="170" width="90" height="30" fill="#e5484d" opacity="0.35"/>
<text x="385" y="162" text-anchor="middle" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">failure: lost work</text>
<line x1="430" y1="170" x2="430" y2="212" stroke="#e5484d" stroke-width="2" stroke-dasharray="4,3"/>
<text x="430" y="226" text-anchor="middle" fill="#e5484d" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">restore</text>
<text x="360" y="270" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">save more often and the write overhead eats you</text>
<text x="360" y="292" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">save less often and each failure wastes more work</text>
<text x="360" y="314" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">the Daly point is where the two costs balance</text>
</svg>