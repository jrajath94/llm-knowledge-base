<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Reading a significance result without fooling yourself</text><rect x='330' y='70' width='300' height='70' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='480.0' y='97.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>95% CI on the difference</text><text x='480.0' y='127.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>covers zero?</text><line x1='380' y1='140' x2='220' y2='190' stroke='#f0b429' stroke-width='3'/><polygon points='220.0,190.0 226.0,183.3 228.7,192.1' fill='#f0b429'/><line x1='580' y1='140' x2='740' y2='190' stroke='#f0b429' stroke-width='3'/><polygon points='740.0,190.0 731.3,192.1 734.0,183.3' fill='#f0b429'/><text x='300' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>yes</text><text x='660' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>no</text><rect x='60' y='196' width='320' height='140' rx='10' fill='#0d0d0d' stroke='#e57373' stroke-width='2'/><text x='220' y='228' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#e57373' text-anchor='middle'>Not proven</text><text x='220' y='254' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the data cannot tell</text><text x='220' y='278' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>collect more data,</text><text x='220' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>or shrink the noise</text><rect x='580' y='196' width='320' height='140' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='740' y='228' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#4fd1a5' text-anchor='middle'>Proven win</text><text x='740' y='254' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the interval clears zero,</text><text x='740' y='278' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>report the interval,</text><text x='740' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>not just the delta</text><text x='480' y='372' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>'Not significant' means 'cannot tell', never 'no difference.'</text></svg>