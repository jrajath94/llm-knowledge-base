<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="After Kaplan: the scaling lineage"><rect x="22" y="14" width="916" height="372" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">WHAT CAME NEXT</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">After Kaplan: the scaling lineage</text><rect x="38" y="96" width="251.36917499999998" height="78" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="52" y="120" font-size="13.5" font-weight="700" fill="#ececec">Kaplan laws (2020)</text><text x="52" y="140" font-size="12" fill="#a8a8a8">L(N,D) power laws; 0.73 / 0.27</text><text x="52" y="156" font-size="12" fill="#a8a8a8">split</text><line x1="301.369175" y1="135.0" x2="315.369175" y2="135.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="315.369175,130.0 323.369175,135.0 315.369175,140.0" fill="#a8a8a8"/><rect x="333.369175" y="96" width="224.79483749999997" height="78" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="347.369175" y="120" font-size="13.5" font-weight="700" fill="#ececec">Chinchilla (2022)</text><text x="347.369175" y="140" font-size="12" fill="#a8a8a8">Paper 7: the correction, 20</text><text x="347.369175" y="156" font-size="12" fill="#a8a8a8">tokens/param</text><line x1="570.1640124999999" y1="135.0" x2="584.1640124999999" y2="135.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="584.1640124999999,130.0 592.1640124999999,135.0 584.1640124999999,140.0" fill="#a8a8a8"/><rect x="602.1640124999999" y="96" width="231.39693749999998" height="78" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="616.1640124999999" y="120" font-size="13.5" font-weight="700" fill="#ececec">LLaMA (2023)</text><text x="616.1640124999999" y="140" font-size="12" fill="#a8a8a8">Paper 11: 13B on 1T tokens</text><text x="616.1640124999999" y="156" font-size="12" fill="#a8a8a8">beats 175B GPT-3</text><rect x="38" y="200" width="269.170396875" height="78" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="52" y="224" font-size="13.5" font-weight="700" fill="#ececec">Over-training era (2023+)</text><text x="52" y="244" font-size="12" fill="#a8a8a8">train small models long for</text><text x="52" y="260" font-size="12" fill="#a8a8a8">cheap inference</text><line x1="319.170396875" y1="239.0" x2="333.170396875" y2="239.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="333.170396875,234.0 341.170396875,239.0 333.170396875,244.0" fill="#a8a8a8"/><rect x="351.170396875" y="200" width="255.829021875" height="78" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="365.170396875" y="224" font-size="13.5" font-weight="700" fill="#ececec">Data-constrained (2023)</text><text x="365.170396875" y="244" font-size="12" fill="#a8a8a8">Muennighoff: tokens can be</text><text x="365.170396875" y="260" font-size="12" fill="#a8a8a8">repeated ~4x</text><rect x="38" y="304" width="267.92586562500003" height="78" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="52" y="328" font-size="13.5" font-weight="700" fill="#ececec">Inference scaling (2024+)</text><text x="52" y="348" font-size="12" fill="#a8a8a8">a new axis: test-time compute</text></svg>