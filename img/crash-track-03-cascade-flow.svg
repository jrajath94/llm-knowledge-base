<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="100%" style="max-width:680px" role="img" aria-label="Cascade flow: small model answers first, a judge escalates only the hard requests to the big model">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Cascade: the small model answers everything first</text>
<text class="m" x="24" y="52">A router is the same idea with more tiers or per-request model choice.</text>
<rect class="box" x="20" y="140" width="110" height="56" rx="8"/>
<text class="big" x="75" y="172" text-anchor="middle">Request</text>
<line class="arr" x1="130" y1="168" x2="160" y2="168"/>
<rect class="box" x="160" y="140" width="150" height="56" rx="8" stroke="#6cb2ff"/>
<text class="big" x="235" y="164" text-anchor="middle">Small model</text>
<text class="b" x="235" y="184" text-anchor="middle">$0.22/1M</text>
<line class="arr" x1="310" y1="168" x2="340" y2="168"/>
<polygon points="400,140 460,168 400,196 340,168" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
<text class="big" x="400" y="163" text-anchor="middle">Judge:</text>
<text class="big" x="400" y="181" text-anchor="middle">confident?</text>
<rect class="box" x="500" y="140" width="150" height="56" rx="8" stroke="#7fc97f"/>
<text class="gr" x="575" y="172" text-anchor="middle" font-weight="700">Answer</text>
<line class="arr" x1="460" y1="168" x2="500" y2="168"/>
<text class="gr" x="478" y="160">yes</text>
<line class="arr" x1="400" y1="196" x2="400" y2="250"/>
<text class="r" x="412" y="228">no</text>
<rect class="box" x="325" y="250" width="150" height="56" rx="8" stroke="#e57373"/>
<text class="big" x="400" y="274" text-anchor="middle">Big model</text>
<text class="r" x="400" y="294" text-anchor="middle">$1.11/1M</text>
<line class="arr" x1="475" y1="278" x2="540" y2="278"/>
<line class="arr" x1="540" y1="278" x2="540" y2="196"/>
<rect class="box" x="20" y="330" width="630" height="60" rx="8"/>
<text class="big" x="36" y="354">The escalation tax.</text>
<text class="m" x="36" y="376">Escalated requests pay both models: 0.22 + 0.05 + 0.20 x 1.11 = $0.49/1M. Track the escalation rate like a budget.</text>
</svg>
