<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 420' width='100%' role='img'>
<title>Cascade design: try cheap, escalate on failure</title>
<text x='460' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Cascade design: try cheap, escalate on failure</text>
<rect x='40' y='150' width='180' height='90' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='130' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Cheap model</text>
<text x='130' y='196' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>first: fast,</text>
<text x='130' y='214' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>low cost</text>
<line x1='220' y1='195' x2='270' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='261.8,198.7 270,195 261.8,191.3' fill='#8a8a8a'/>
<rect x='270' y='150' width='180' height='90' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='360' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Confidence</text>
<text x='360' y='196' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>check: score</text>
<text x='360' y='214' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the answer</text>
<line x1='450' y1='175' x2='510' y2='140' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='504.8,147.3 510,140 501.1,141.0' fill='#8a8a8a'/>
<text x='482' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#2e9e5b' text-anchor='middle'>high</text>
<rect x='510' y='105' width='170' height='70' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='595' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Answer</text>
<line x1='450' y1='215' x2='510' y2='245' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='501.0,244.6 510,245 504.3,238.0' fill='#8a8a8a'/>
<text x='482' y='232' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#c0392b' text-anchor='middle'>low</text>
<rect x='510' y='215' width='170' height='70' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='595' y='256' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Bigger model</text>
<line x1='680' y1='250' x2='730' y2='250' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='721.8,253.7 730,250 721.8,246.3' fill='#8a8a8a'/>
<rect x='730' y='215' width='150' height='70' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='805' y='256' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Answer</text>
<text x='460' y='350' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Most requests end at the cheap model; only the hard ones pay the flagship price.</text>
</svg>