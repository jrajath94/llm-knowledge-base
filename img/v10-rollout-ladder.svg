<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Shadow, then canary, then full: the safe rollout ladder"><rect x="22" y="14" width="916" height="212" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">SAFE ROLLOUT</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Each rung catches a different failure class with bounded blast radius</text><rect x="38" y="96" width="238.01211249999997" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Shadow</text><text x="54" y="144" font-size="12" fill="#a8a8a8">new model sees live traffic,</text><text x="54" y="160" font-size="12" fill="#a8a8a8">answers discarded. Catches</text><text x="54" y="176" font-size="12" fill="#a8a8a8">crashes, latency blowups,</text><text x="54" y="192" font-size="12" fill="#a8a8a8">format breaks. Zero user</text><text x="54" y="208" font-size="12" fill="#a8a8a8">impact.</text><line x1="286.01211249999994" y1="160.0" x2="300.01211249999994" y2="160.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="300.01211249999994,155.0 308.01211249999994,160.0 300.01211249999994,165.0" fill="#a8a8a8"/><rect x="316.01211249999994" y="96" width="225.78583749999999" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="336.01211249999994" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="336.01211249999994" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">2</text><text x="356.01211249999994" y="123" font-size="13.5" font-weight="700" fill="#ececec">Canary 1-5%</text><text x="332.01211249999994" y="144" font-size="12" fill="#a8a8a8">real users get the new</text><text x="332.01211249999994" y="160" font-size="12" fill="#a8a8a8">model. Compare error</text><text x="332.01211249999994" y="176" font-size="12" fill="#a8a8a8">rates, latency, eval scores</text><text x="332.01211249999994" y="192" font-size="12" fill="#a8a8a8">against control.</text><line x1="551.7979499999999" y1="160.0" x2="565.7979499999999" y2="160.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="565.7979499999999,155.0 573.7979499999999,160.0 565.7979499999999,165.0" fill="#a8a8a8"/><rect x="581.7979499999999" y="96" width="220.59973749999997" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="601.7979499999999" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="601.7979499999999" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">3</text><text x="621.7979499999999" y="123" font-size="13.5" font-weight="700" fill="#ececec">Staged 25-50-100%</text><text x="597.7979499999999" y="144" font-size="12" fill="#a8a8a8">roll out in stages with the</text><text x="597.7979499999999" y="160" font-size="12" fill="#a8a8a8">one-command rollback</text><text x="597.7979499999999" y="176" font-size="12" fill="#a8a8a8">armed at every stage.</text></svg>