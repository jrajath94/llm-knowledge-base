<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='100%' role='img'>
<title>Scoping pipeline</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Scoping under ambiguity: vague ask to signed memo</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Nobody hands you a spec. You discover it through questions, shadowing, and failed prototypes.</text>
<rect x='60' y='130' width='190' height='130' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='155' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Vague ask</text>
<text x='155' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>we want AI for support</text>
<line x1='250' y1='195' x2='280' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='271.8,198.7 280,195 271.8,191.3' fill='#8a8a8a'/>
<rect x='280' y='130' width='190' height='130' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='375' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Discovery</text>
<text x='375' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>questions + shadowing</text>
<line x1='470' y1='195' x2='500' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='491.8,198.7 500,195 491.8,191.3' fill='#8a8a8a'/>
<rect x='500' y='130' width='190' height='130' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='595' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Criteria</text>
<text x='595' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>success + kill criteria</text>
<line x1='690' y1='195' x2='720' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='711.8,198.7 720,195 711.8,191.3' fill='#8a8a8a'/>
<rect x='720' y='130' width='190' height='130' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='815' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Memo</text>
<text x='815' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>both sides sign</text>
<text x='480' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The memo is the artifact everything later cites: the plan, the success bar, and the kill conditions.</text>
<text x='480' y='354' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: ambiguity resolved in writing, before building, is the cheapest kind of work.</text>
</svg>