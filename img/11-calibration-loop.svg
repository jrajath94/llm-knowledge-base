<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The six-step autorater calibration loop">
<rect x="14" y="12" width="932" height="446" rx="10" fill="#141414" stroke="#2e2e2e"/>
<text x="32" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">CALIBRATION LOOP</text>
<text x="32" y="72" font-size="16" font-weight="700" fill="#ececec">Six steps, in order. The loop matters.</text>
<rect x="32" y="96" width="290" height="164" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<circle cx="64" cy="128" r="15" fill="#6cb2ff"/>
<text x="64" y="134" font-size="14" font-weight="700" fill="#101010" text-anchor="middle">1</text>
<text x="88" y="134" font-size="13.5" font-weight="700" fill="#ececec">Build the set</text>
<text x="56" y="168" font-size="12.5" fill="#a8a8a8">20 to 50 examples,</text>
<text x="56" y="190" font-size="12.5" fill="#a8a8a8">full quality range,</text>
<text x="56" y="212" font-size="12.5" fill="#a8a8a8">known bad included.</text>
<line x1="322" y1="178" x2="346" y2="178" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 337 173 L 346 178 L 337 183" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="346" y="96" width="290" height="164" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<circle cx="378" cy="128" r="15" fill="#6cb2ff"/>
<text x="378" y="134" font-size="14" font-weight="700" fill="#101010" text-anchor="middle">2</text>
<text x="402" y="134" font-size="13.5" font-weight="700" fill="#ececec">Humans label first</text>
<text x="370" y="168" font-size="12.5" fill="#a8a8a8">2 or 3 raters</text>
<text x="370" y="190" font-size="12.5" fill="#a8a8a8">per example.</text>
<text x="370" y="212" font-size="12.5" fill="#a8a8a8">Disagree? Fix the rubric.</text>
<line x1="636" y1="178" x2="660" y2="178" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 651 173 L 660 178 L 651 183" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="96" width="290" height="164" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<circle cx="692" cy="128" r="15" fill="#6cb2ff"/>
<text x="692" y="134" font-size="14" font-weight="700" fill="#101010" text-anchor="middle">3</text>
<text x="716" y="134" font-size="13.5" font-weight="700" fill="#ececec">Run the autorater</text>
<text x="684" y="168" font-size="12.5" fill="#a8a8a8">Same set, same rubric.</text>
<text x="684" y="190" font-size="12.5" fill="#a8a8a8">Keep the judge's</text>
<text x="684" y="212" font-size="12.5" fill="#a8a8a8">reasoning each time.</text>
<line x1="930" y1="260" x2="930" y2="284" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 921 279 L 930 284 L 921 289" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="284" width="290" height="164" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<circle cx="64" cy="316" r="15" fill="#6cb2ff"/>
<text x="64" y="322" font-size="14" font-weight="700" fill="#101010" text-anchor="middle">4</text>
<text x="88" y="322" font-size="13.5" font-weight="700" fill="#ececec">Compute kappa</text>
<text x="56" y="356" font-size="12.5" fill="#a8a8a8">Observed agreement</text>
<text x="56" y="378" font-size="12.5" fill="#a8a8a8">minus chance.</text>
<text x="56" y="400" font-size="12.5" fill="#a8a8a8">Report both numbers.</text>
<line x1="322" y1="366" x2="346" y2="366" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 337 361 L 346 366 L 337 371" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="346" y="284" width="290" height="164" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<circle cx="378" cy="316" r="15" fill="#6cb2ff"/>
<text x="378" y="322" font-size="14" font-weight="700" fill="#101010" text-anchor="middle">5</text>
<text x="402" y="322" font-size="13.5" font-weight="700" fill="#ececec">Read disagreements</text>
<text x="370" y="356" font-size="12.5" fill="#a8a8a8">Sort by gap size.</text>
<text x="370" y="378" font-size="12.5" fill="#a8a8a8">Read the top 10.</text>
<text x="370" y="400" font-size="12.5" fill="#a8a8a8">Whose fault: judge, human, rubric?</text>
<line x1="636" y1="366" x2="660" y2="366" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 651 361 L 660 366 L 651 371" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="284" width="290" height="164" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<circle cx="692" cy="316" r="15" fill="#6cb2ff"/>
<text x="692" y="322" font-size="14" font-weight="700" fill="#101010" text-anchor="middle">6</text>
<text x="716" y="322" font-size="13.5" font-weight="700" fill="#ececec">Revise the rubric</text>
<text x="684" y="356" font-size="12.5" fill="#a8a8a8">Tighten anchors, add</text>
<text x="684" y="378" font-size="12.5" fill="#a8a8a8">examples. Not the</text>
<text x="684" y="400" font-size="12.5" fill="#a8a8a8">judge prompt.</text>
</svg>
