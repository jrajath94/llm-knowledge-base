<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The arc of a research talk">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f0b429"/>
    </marker>
  </defs>
  <rect x="90" y="16" width="500" height="52" rx="10" fill="#0d0d0d" stroke="#f0b429" stroke-dasharray="5 4"/>
  <text x="340" y="48" font-size="14" fill="#ececec" text-anchor="middle" font-weight="700">ONE MESSAGE: everything in the talk serves it</text>
  <path d="M 90 130 Q 340 60 590 130" stroke="#3a3a3a" stroke-width="2" fill="none"/>
  <g font-size="14" text-anchor="middle">
    <circle cx="110" cy="190" r="34" fill="#101010" stroke="#3a3a3a"/>
    <text x="110" y="196" fill="#ececec" font-weight="700" font-size="13">HOOK</text>
    <text x="110" y="248" fill="#a8a8a8" font-size="12">the problem,</text>
    <text x="110" y="264" fill="#a8a8a8" font-size="12">concrete</text>
    <circle cx="290" cy="190" r="34" fill="#101010" stroke="#3a3a3a"/>
    <text x="290" y="196" fill="#ececec" font-weight="700" font-size="13">JOURNEY</text>
    <text x="290" y="248" fill="#a8a8a8" font-size="12">what you tried,</text>
    <text x="290" y="264" fill="#a8a8a8" font-size="12">the complication</text>
    <circle cx="470" cy="190" r="34" fill="#101010" stroke="#3a3a3a"/>
    <text x="470" y="196" fill="#ececec" font-weight="700" font-size="13">RESULT</text>
    <text x="470" y="248" fill="#a8a8a8" font-size="12">what happened,</text>
    <text x="470" y="264" fill="#a8a8a8" font-size="12">with numbers</text>
  </g>
  <line x1="144" y1="190" x2="252" y2="190" stroke="#f0b429" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="324" y1="190" x2="432" y2="190" stroke="#f0b429" stroke-width="2" marker-end="url(#arr6)"/>
  <rect x="150" y="288" width="380" height="40" rx="10" fill="#101010" stroke="#f0b429" stroke-width="1.5"/>
  <text x="340" y="314" font-size="14" fill="#ececec" text-anchor="middle" font-weight="700">TAKEAWAY: repeat the one message</text>
</svg>
