<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Cohen&#x27;s kappa: agreement beyond luck"><rect x="22" y="14" width="916" height="342" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CALIBRATION</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Raw agreement flatters. Kappa subtracts the agreement chance alone would</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">produce.</text><rect x="22.0" y="118" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="156" font-size="27" font-weight="700" fill="#f0b429">75%</text><text x="38.0" y="178" font-size="12.5" fill="#a8a8a8">raw agreement: the judge matches humans</text><rect x="487.0" y="118" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="156" font-size="27" font-weight="700" fill="#f0b429">68%</text><text x="503.0" y="178" font-size="12.5" fill="#a8a8a8">expected by chance: both accept 80%, so 80/20 rates</text><text x="503.0" y="194" font-size="12.5" fill="#a8a8a8">overlap</text><rect x="22.0" y="228" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="266" font-size="27" font-weight="700" fill="#f0b429">kappa</text><text x="38.0" y="288" font-size="12.5" fill="#a8a8a8">the honest number: how much agreement survives after</text><text x="38.0" y="304" font-size="12.5" fill="#a8a8a8">chance is removed</text><rect x="38" y="350" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="372" font-size="13.5" fill="#7fd08a">If the humans do not agree with each other, fix the rubric before you touch the judge.</text></svg>