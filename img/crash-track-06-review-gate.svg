<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px" role="img" aria-label="Human review gate: the agent prepares with dry-run, the action waits in a queue, a human approves with a reason, and a 4-hour SLA pages someone or auto-rejects">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.big{font-size:13px;font-weight:700}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="32">Review gates live in the tool layer, not the prompt</text>
<text class="m" x="24" y="54">A prompt cannot stop an action. A tool wrapper can.</text>

<rect class="box" x="24" y="76" width="150" height="70" rx="8"/><text class="big b" x="99" y="104" text-anchor="middle">agent</text><text class="m" x="99" y="126" text-anchor="middle">prepares with</text><text class="m" x="99" y="142" text-anchor="middle">dry_run = True</text>
<rect class="box" x="210" y="76" width="150" height="70" rx="8"/><text class="big" x="285" y="104" text-anchor="middle">review queue</text><text class="m" x="285" y="126" text-anchor="middle">action waits here</text>
<rect class="box" x="396" y="76" width="150" height="70" rx="8"/><text class="big g" x="471" y="104" text-anchor="middle">human</text><text class="m" x="471" y="126" text-anchor="middle">approves with a</text><text class="m" x="471" y="142" text-anchor="middle">reason string</text>
<rect class="box" x="582" y="76" width="114" height="70" rx="8" stroke="#7fc97f"/><text class="big gr" x="639" y="104" text-anchor="middle">tool</text><text class="m gr" x="639" y="126" text-anchor="middle">executes</text><text class="m gr" x="639" y="142" text-anchor="middle">for real</text>
<line class="arr" x1="174" y1="111" x2="202" y2="111"/>
<line class="arr" x1="360" y1="111" x2="388" y2="111"/>
<line class="arr" x1="546" y1="111" x2="574" y2="111"/>

<rect class="box" x="24" y="172" width="330" height="90" rx="8" stroke="#e57373"/>
<text class="big r" x="40" y="200">Queue SLA: 4 hours</text>
<text class="m" x="40" y="224">unreviewed for 4 hours:</text>
<text class="m" x="40" y="244">page someone, or auto-reject safe-side</text>
<rect class="box" x="390" y="172" width="306" height="90" rx="8"/>
<text class="big" x="406" y="200">While waiting</text>
<text class="m" x="406" y="224">the agent keeps working on other tasks</text>
<text class="m" x="406" y="244">or the gate becomes a very expensive inbox</text>

<rect class="box" x="24" y="288" width="672" height="56" rx="8" stroke="#f0b429"/>
<text class="big" x="360" y="312" text-anchor="middle">Risky actions: money, deletes, customer contact.</text>
<text class="m" x="360" y="332" text-anchor="middle">The reason string goes in the audit log. Enforcement is code, not prose.</text>
</svg>
