<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Synchronous versus async checkpointing timelines">
  <style>
    .t { font:600 14px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#ececec; }
    .s { font:400 12.5px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#a8a8a8; }
    .ax { stroke:#5a5a5a; stroke-width:1.5; marker-end:url(#ah); }
    .train { fill:#6cb2ff; opacity:0.45; }
    .ckpt { fill:#c96a5a; opacity:0.55; }
    .stage { fill:#f0b429; opacity:0.55; }
    .bg { fill:#0d0d0d; opacity:0.0; }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    </marker>
  </defs>

  <text class="t" x="20" y="28">Synchronous: the write stops training</text>
  <line class="ax" x1="20" y1="60" x2="700" y2="60"/>
  <rect class="train" x="20" y="45" width="180" height="30"/>
  <rect class="ckpt" x="200" y="45" width="220" height="30"/>
  <rect class="train" x="420" y="45" width="260" height="30"/>
  <text class="s" x="110" y="65" text-anchor="middle" fill="#ececec">train</text>
  <text class="s" x="310" y="65" text-anchor="middle" fill="#ececec">CHECKPOINT WRITE (GPUs idle)</text>
  <text class="s" x="550" y="65" text-anchor="middle" fill="#ececec">train</text>

  <text class="t" x="20" y="120">Async: stage in seconds, write in the background</text>
  <line class="ax" x1="20" y1="152" x2="700" y2="152"/>
  <rect class="train" x="20" y="137" width="120" height="30"/>
  <rect class="stage" x="140" y="137" width="70" height="30"/>
  <rect class="train" x="210" y="137" width="470" height="30"/>
  <text class="s" x="80" y="157" text-anchor="middle" fill="#ececec">train</text>
  <text class="s" x="175" y="157" text-anchor="middle" fill="#ececec">stage</text>
  <text class="s" x="445" y="157" text-anchor="middle" fill="#ececec">train train train train</text>

  <line x1="175" y1="175" x2="175" y2="205" stroke="#f0b429" stroke-width="1.5"/>
  <line x1="175" y1="205" x2="520" y2="205" stroke="#f0b429" stroke-width="1.5"/>
  <polygon points="520,205 508,199 508,211" fill="#f0b429"/>
  <text class="s" x="350" y="228" text-anchor="middle" fill="#f0b429">background write to storage (training never waits)</text>

  <text class="s" x="20" y="258">Rule: only one background write in flight. Block on it before the next checkpoint, or two writers corrupt the staging buffer.</text>
</svg>
