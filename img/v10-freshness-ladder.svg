<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 248" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The freshness ladder: each rung up costs more engineering"><rect x="22" y="14" width="916" height="220" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">FRESHNESS LADDER</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Which rung does this feature need?</text><text x="38" y="117" font-size="13.5" fill="#ececec">real-time (seconds)</text><rect x="245.785884375" y="102" width="526.214115625" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="245.785884375" y="102" width="526.214115625" height="16" rx="4" fill="#7fd08a"/><text x="782.0" y="117" font-size="13" font-weight="700" fill="#7fd08a">fraud detection</text><text x="38" y="151" font-size="13.5" fill="#ececec">near-real-time (minutes)</text><rect x="245.785884375" y="136" width="526.214115625" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="245.785884375" y="136" width="394.66058671875" height="16" rx="4" fill="#6cb2ff"/><text x="782.0" y="151" font-size="13" font-weight="700" fill="#6cb2ff">recommendation refresh</text><text x="38" y="185" font-size="13.5" fill="#ececec">hourly</text><rect x="245.785884375" y="170" width="526.214115625" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="245.785884375" y="170" width="263.1070578125" height="16" rx="4" fill="#f0b429"/><text x="782.0" y="185" font-size="13" font-weight="700" fill="#f0b429">&quot;purchases since midnight&quot;</text><text x="38" y="219" font-size="13.5" fill="#ececec">daily (batch at midnight)</text><rect x="245.785884375" y="204" width="526.214115625" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="245.785884375" y="204" width="131.55352890625" height="16" rx="4" fill="#a8a8a8"/><text x="782.0" y="219" font-size="13" font-weight="700" fill="#a8a8a8">churn model</text><text x="38" y="248" font-size="12.5" fill="#a8a8a8">Higher rungs cost more engineering. The design question is always which rung a feature needs.</text></svg>