<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 382" width="100%" style="max-width:780px" role="img" aria-label="Decision doc spine plus the six communication gate questions">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="780" height="382" fill="none"/>
<text class="t" x="24" y="30">Communicating research: claim, evidence, tradeoffs, ask</text>
<text class="big g" x="24" y="58">One claim per document: the decision-doc spine</text>
<rect x="24" y="72" width="160" height="80" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.8"/>
<text class="big" x="40" y="102">Claim</text>
<text class="m" x="40" y="128">one sentence</text>
<path class="arr" d="M184 112 L212 112"/>
<rect x="212" y="72" width="160" height="80" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.8"/>
<text class="big" x="228" y="102">Evidence</text>
<text class="m" x="228" y="120">numbers with</text>
<text class="m" x="228" y="138">comparison + uncertainty</text>
<path class="arr" d="M372 112 L400 112"/>
<rect x="400" y="72" width="160" height="80" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.8"/>
<text class="big" x="416" y="102">Tradeoffs</text>
<text class="m" x="416" y="128">what is sacrificed</text>
<path class="arr" d="M560 112 L588 112"/>
<rect x="588" y="72" width="160" height="80" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.8"/>
<text class="big" x="604" y="102">Ask</text>
<text class="m" x="604" y="128">what you need from readers</text>
<path class="arr" d="M748 112 L776 112"/>
<text class="num" x="24" y="196">The communication gate: every artifact answers its gate question.</text>
<text class="m" x="24" y="218">-  Any claim: one sentence?</text>
<text class="m" x="24" y="242">-  Any number: comparison, uncertainty, practical significance?</text>
<text class="m" x="24" y="266">-  Any diagram: how-to-read walkthrough included?</text>
<text class="m" x="24" y="290">-  Methods: could a stranger rebuild it?</text>
<text class="m" x="24" y="314">-  Slides: one idea each; story, not paper?</text>
<text class="m" x="24" y="338">-  Criticism: strongest version steelmanned first?</text>
</svg>
