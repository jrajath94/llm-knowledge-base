<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 220' width='100%' style='max-width:900px;background-color:transparent' role='img'><style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.g{fill:#f0b429}.b{fill:#6cb2ff}.r{fill:#e57373}.gr{fill:#7fc97f}</style><line x1='60' y1='50' x2='60' y2='110' stroke='#a8a8a8' stroke-width='2'/><text x='60' y='42' font-size='13' text-anchor='middle' class='m'>request arrives</text><rect x='60' y='58' width='280' height='44' rx='6' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='200' y='82' font-size='14' text-anchor='middle' font-weight='700'>Prefill</text><text x='200' y='100' font-size='12' text-anchor='middle' class='m'>full pass over 2k-token prompt</text><rect x='340' y='58' width='26' height='44' rx='4' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='353' y='86' font-size='12' text-anchor='middle' class='b'>t1</text><rect x='374' y='58' width='26' height='44' rx='4' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='387' y='86' font-size='12' text-anchor='middle' class='b'>t2</text><rect x='408' y='58' width='26' height='44' rx='4' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='421' y='86' font-size='12' text-anchor='middle' class='b'>t3</text><rect x='442' y='58' width='26' height='44' rx='4' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='455' y='86' font-size='12' text-anchor='middle' class='b'>t4</text><rect x='476' y='58' width='26' height='44' rx='4' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='489' y='86' font-size='12' text-anchor='middle' class='b'>t5</text><rect x='510' y='58' width='26' height='44' rx='4' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='523' y='86' font-size='12' text-anchor='middle' class='b'>t6</text><text x='552' y='86' font-size='13' class='m'>one token per step</text><line x1='60' y1='150' x2='340' y2='150' stroke='#f0b429' stroke-width='2'/><line x1='60' y1='143' x2='60' y2='157' stroke='#f0b429' stroke-width='2'/><line x1='340' y1='143' x2='340' y2='157' stroke='#f0b429' stroke-width='2'/><text x='200' y='172' font-size='14' text-anchor='middle' class='g' font-weight='700'>TTFT: arrival to first token (budget &lt; 1 s)</text><line x1='340' y1='196' x2='374' y2='196' stroke='#6cb2ff' stroke-width='2'/><line x1='340' y1='190' x2='340' y2='202' stroke='#6cb2ff' stroke-width='2'/><line x1='374' y1='190' x2='374' y2='202' stroke='#6cb2ff' stroke-width='2'/><text x='400' y='200' font-size='14' class='b' font-weight='700'>TPOT: token to token (20-50 ms)</text><text x='60' y='216' font-size='13' class='m'>Rule of thumb: prefill cost sets TTFT, one decode step sets TPOT. Long prompts hurt the first, big batches hurt the second.</text></svg>