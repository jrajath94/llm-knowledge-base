<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
<rect width="560" height="280" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>At production sample sizes, read the statistic, not the p-value</text><text x='60' y='100' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#e8e8e8' text-anchor='start' font-weight='bold'>n = 20,000 vs 5,000</text><text x='60' y='130' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='start'>p ~ 1e-186 for a trivial wiggle</text><text x='60' y='160' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='start'>KS statistic 0.23: a real, visible 23-point gap</text><text x='60' y='200' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>The p-value twitches. The statistic measures.</text><text x='20' y='250' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Calibrate the statistic against the feature's normal wobble. Ignore the p-value.</text></svg>