<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="100%" style="max-width:760px" role="img" aria-label="Batching ladder batch 1 to 64; honesty multipliers from raw cost to cost per good answer">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="344" fill="none"/>
<text class="t" x="24" y="30">Dollars per million tokens: the batching ladder and the honesty multipliers</text>
<text class="big" x="24" y="88">The batching ladder: same fleet, 12.5x cost difference</text>
<text class="num" x="44" y="112">batch 1</text>
<text class="m" x="180" y="112">~120 tok/s</text>
<text class="big" x="340" y="112">$13.89 /1M</text>
<text class="num" x="44" y="142">batch 8</text>
<text class="m" x="180" y="142">~700 tok/s</text>
<text class="big" x="340" y="142">$2.38 /1M</text>
<text class="num" x="44" y="172">batch 64</text>
<text class="m" x="180" y="172">~1,500 tok/s</text>
<text class="big" x="340" y="172">$1.11 /1M</text>
<text class="big" x="24" y="216">The honesty multipliers: cost per successful outcome = raw cost / (utilization x success rate)</text>
<text class="m" x="44" y="244">raw GPU cost per request: $0.0022</text>
<text class="num" x="44" y="268">at 15% utilization: $0.0147</text>
<text class="big" x="44" y="292">at 70% success rate (honest): $0.0212 per good answer</text>
<text class="m" x="24" y="320">The raw number said two-tenths of a cent. The honest number says two cents.</text>
</svg>
