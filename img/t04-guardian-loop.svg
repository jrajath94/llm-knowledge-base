<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Run guardian loop: monitor, classify, isolate, resume">
  <style>
    .box { fill:#0d0d0d; stroke:#3a3a3a; stroke-width:1.5; rx:8; }
    .t { font:600 14px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#ececec; }
    .s { font:400 12px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#a8a8a8; }
    .arr { stroke:#f0b429; stroke-width:2; fill:none; marker-end:url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/>
    </marker>
  </defs>

  <text class="t" x="20" y="28" style="font-size:15px">The run guardian loop (budget: detect + isolate + resume under 10 minutes)</text>

  <rect class="box" x="250" y="50" width="220" height="70" rx="8"/>
  <text class="t" x="360" y="76" text-anchor="middle">Monitor</text>
  <text class="s" x="360" y="96" text-anchor="middle">heartbeats: every rank reports</text>
  <text class="s" x="360" y="112" text-anchor="middle">step completions</text>

  <path class="arr" d="M470,85 L540,85 L540,150"/>
  <rect class="box" x="430" y="150" width="220" height="70" rx="8"/>
  <text class="t" x="540" y="176" text-anchor="middle">Classify</text>
  <text class="s" x="540" y="196" text-anchor="middle">hang, slow rank, loss spike, node gone</text>

  <path class="arr" d="M540,220 L540,270 L470,270"/>
  <rect class="box" x="250" y="235" width="220" height="70" rx="8"/>
  <text class="t" x="360" y="261" text-anchor="middle">Isolate</text>
  <text class="s" x="360" y="281" text-anchor="middle">quarantine suspect nodes,</text>
  <text class="s" x="360" y="297" text-anchor="middle">shrink the job or re-queue</text>

  <path class="arr" d="M250,270 L180,270 L180,150"/>
  <rect class="box" x="70" y="150" width="220" height="70" rx="8"/>
  <text class="t" x="180" y="176" text-anchor="middle">Resume</text>
  <text class="s" x="180" y="196" text-anchor="middle">latest good checkpoint, warm start,</text>
  <text class="s" x="180" y="212" text-anchor="middle">verify first 10 steps</text>

  <path class="arr" d="M180,150 L180,85 L250,85"/>

  <text class="s" x="70" y="250">recipe issue?</text>
  <text class="s" x="70" y="268">roll back to a pre-spike</text>
  <text class="s" x="70" y="284">checkpoint, page the human</text>

  <text class="s" x="20" y="340">The loop closes back to monitoring. The bad node never rejoins silently: it is re-qualified before returning to the pool.</text>
</svg>
