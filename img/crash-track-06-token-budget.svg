<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Token budget per task">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Token budget per task</text>
<text x="300" y="58" text-anchor="middle" class="xs">Set from task value. Enforced inside the loop.</text>
<rect x="80" y="100" width="440" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2"/>
<text x="300" y="125" text-anchor="middle" class="s b">Budget: 50k tokens</text>
<text x="300" y="145" text-anchor="middle" class="xs">Set from what the task is worth</text>
<rect x="80" y="190" width="440" height="30" rx="4" fill="#141414" stroke="#8a8a8a"/>
<rect x="80" y="190" width="290" height="30" rx="4" fill="#7fc97f" opacity="0.7"/>
<text x="300" y="242" text-anchor="middle" class="s">Ledger tracks spend. At 90%, warn. At 100%, stop.</text>
<text x="300" y="265" text-anchor="middle" class="xs">No ledger means nobody notices until the invoice.</text>
</svg>
