<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Capstone: five experiments, five curves to expect</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">each experiment ties one chapter&#x27;s lesson to a shape you will see on your own loss plot</text>
<rect x="24" y="92" width="300" height="56" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="36" y="116" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">A. scale the model up</text>
<text x="36" y="136" font-size="11" fill="#8a8a8a" text-anchor="start">ch 7</text>
<line x1="336" y1="120" x2="360" y2="120" stroke="#6cb2ff" stroke-width="2"/>
<polygon points="360,120 351.78219953718923,123.66984407753613 351.78219953718923,116.33015592246387" fill="#6cb2ff"/>
<text x="372" y="116" font-size="13" fill="#a8a8a8" text-anchor="start">loss falls further</text>
<text x="372" y="136" font-size="12" fill="#6cb2ff" text-anchor="start">expect: lower final loss</text>
<rect x="24" y="164" width="300" height="56" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="4" opacity="1"/>
<text x="36" y="188" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">B. break the data mix</text>
<text x="36" y="208" font-size="11" fill="#8a8a8a" text-anchor="start">ch 2</text>
<line x1="336" y1="192" x2="360" y2="192" stroke="#e57ea6" stroke-width="2"/>
<polygon points="360,192 351.78219953718923,195.66984407753614 351.78219953718923,188.33015592246386" fill="#e57ea6"/>
<text x="372" y="188" font-size="13" fill="#a8a8a8" text-anchor="start">junk in</text>
<text x="372" y="208" font-size="12" fill="#e57ea6" text-anchor="start">expect: higher, noisier loss</text>
<rect x="24" y="236" width="300" height="56" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="4" opacity="1"/>
<text x="36" y="260" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">C. kill the warmup</text>
<text x="36" y="280" font-size="11" fill="#8a8a8a" text-anchor="start">ch 5</text>
<line x1="336" y1="264" x2="360" y2="264" stroke="#f0b429" stroke-width="2"/>
<polygon points="360,264 351.78219953718923,267.66984407753614 351.78219953718923,260.33015592246386" fill="#f0b429"/>
<text x="372" y="260" font-size="13" fill="#a8a8a8" text-anchor="start">early spike</text>
<text x="372" y="280" font-size="12" fill="#f0b429" text-anchor="start">expect: loss jumps in first 50 steps</text>
<rect x="24" y="308" width="300" height="56" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="4" opacity="1"/>
<text x="36" y="332" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">D. shrink the batch</text>
<text x="36" y="352" font-size="11" fill="#8a8a8a" text-anchor="start">ch 4</text>
<line x1="336" y1="336" x2="360" y2="336" stroke="#4fd1a5" stroke-width="2"/>
<polygon points="360,336 351.78219953718923,339.66984407753614 351.78219953718923,332.33015592246386" fill="#4fd1a5"/>
<text x="372" y="332" font-size="13" fill="#a8a8a8" text-anchor="start">noisier curve</text>
<text x="372" y="352" font-size="12" fill="#4fd1a5" text-anchor="start">expect: same endpoint, more jitter</text>
<rect x="24" y="380" width="300" height="56" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="36" y="404" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">E. stop annealing early</text>
<text x="36" y="424" font-size="11" fill="#8a8a8a" text-anchor="start">App 5A</text>
<line x1="336" y1="408" x2="360" y2="408" stroke="#b388ff" stroke-width="2"/>
<polygon points="360,408 351.78219953718923,411.66984407753614 351.78219953718923,404.33015592246386" fill="#b388ff"/>
<text x="372" y="404" font-size="13" fill="#a8a8a8" text-anchor="start">flat tail</text>
<text x="372" y="424" font-size="12" fill="#b388ff" text-anchor="start">expect: worse final loss</text>
<text x="24" y="468" font-size="13" fill="#f0b429" text-anchor="start">Write up each as: hypothesis, plot, what the curve taught you. If nothing surprised you, push the learning rate harder.</text>
</svg>