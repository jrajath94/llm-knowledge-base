<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="600" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">From logits to probabilities</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Softmax with temperature: p_i = e^(logit_i / T) / sum_j e^(logit_j / T)</text>
<rect x="24" y="104" width="148" height="110" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="98.0" y="146" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="middle">Logits</text>
<text x="98.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">raw model scores</text>
<line x1="172" y1="159.0" x2="194" y2="159.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="194,159.0 185.78219953718923,162.66984407753614 185.78219953718923,155.33015592246386" fill="#8a8a8a"/>
<rect x="194" y="104" width="148" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="268.0" y="146" font-size="13" font-weight="bold" fill="#f0b429" text-anchor="middle">Divide by T</text>
<text x="268.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">rescale confidence</text>
<line x1="342" y1="159.0" x2="364" y2="159.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="364,159.0 355.78219953718923,162.66984407753614 355.78219953718923,155.33015592246386" fill="#8a8a8a"/>
<rect x="364" y="104" width="148" height="110" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="438.0" y="146" font-size="13" font-weight="bold" fill="#b388ff" text-anchor="middle">exp</text>
<text x="438.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">make positive</text>
<line x1="512" y1="159.0" x2="534" y2="159.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="534,159.0 525.7821995371892,162.66984407753614 525.7821995371892,155.33015592246386" fill="#8a8a8a"/>
<rect x="534" y="104" width="148" height="110" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="608.0" y="146" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Divide by sum</text>
<text x="608.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">normalize to 1</text>
<line x1="682" y1="159.0" x2="704" y2="159.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="704,159.0 695.7821995371892,162.66984407753614 695.7821995371892,155.33015592246386" fill="#8a8a8a"/>
<rect x="704" y="104" width="148" height="110" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="778.0" y="146" font-size="13" font-weight="bold" fill="#7dd87d" text-anchor="middle">Probabilities</text>
<text x="778.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">ready to sample</text>
<circle cx="44" cy="250" r="6" fill="#6cb2ff"/>
<text x="62" y="254" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="start">T = 1</text>
<text x="150" y="254" font-size="12" fill="#a8a8a8" text-anchor="start">the model&#x27;s raw distribution</text>
<circle cx="44" cy="302" r="6" fill="#4fd1a5"/>
<text x="62" y="306" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">T &lt; 1</text>
<text x="150" y="306" font-size="12" fill="#a8a8a8" text-anchor="start">sharpens it: confident picks get more confident</text>
<circle cx="44" cy="354" r="6" fill="#f0b429"/>
<text x="62" y="358" font-size="13" font-weight="bold" fill="#f0b429" text-anchor="start">T &gt; 1</text>
<text x="150" y="358" font-size="12" fill="#a8a8a8" text-anchor="start">flattens it: rare tokens get a real chance</text>
<circle cx="44" cy="406" r="6" fill="#e57ea6"/>
<text x="62" y="410" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="start">T = 0</text>
<text x="150" y="410" font-size="12" fill="#a8a8a8" text-anchor="start">defined as greedy: always pick the top token</text>
</svg>