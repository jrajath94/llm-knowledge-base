<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" style="max-width:680px" role="img" aria-label="Cost per successful task: Agent X at 40 cents per attempt and 90 percent success costs 44 cents per success; Agent Y at 4 dollars per attempt costs 4.44 dollars per success">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.big{font-size:13px;font-weight:700}
.ax{stroke:#5a5a5a;stroke-width:1.5}
</style>
<text class="t" x="24" y="32">Compare agents on cost per successful task</text>
<text class="m" x="24" y="54">cost per success = cost per attempt / success rate. Two agents at equal success are not equal if one costs 10x.</text>

<line class="ax" x1="90" y1="90" x2="90" y2="270"/>
<line class="ax" x1="90" y1="270" x2="620" y2="270"/>
<text class="m" x="70" y="275">$0</text>
<text class="m" x="64" y="225">$1</text>
<text class="m" x="64" y="175">$2</text>
<text class="m" x="64" y="125">$3</text>
<text class="m" x="64" y="95">$4+</text>

<rect class="b" x="170" y="248" width="120" height="22" opacity="0.85"/>
<text class="big" x="230" y="242" text-anchor="middle">$0.44</text>
<rect class="r" x="390" y="92" width="120" height="178" opacity="0.85"/>
<text class="big" x="450" y="84" text-anchor="middle">$4.44</text>

<text class="m" x="230" y="292" text-anchor="middle">Agent X</text>
<text class="m" x="230" y="310" text-anchor="middle">$0.40 / task, 90% success</text>
<text class="m" x="450" y="292" text-anchor="middle">Agent Y</text>
<text class="m" x="450" y="310" text-anchor="middle">$4.00 / task, 90% success</text>

<rect class="box" x="24" y="330" width="632" height="40" rx="8"/>
<text class="m" x="340" y="355" text-anchor="middle">$0.20 per attempt at 0.92 success = $0.217 per success. Success rate without cost is half the scoreboard.</text>
</svg>
