<rect width="480" height="330" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Same model, same AUC, three businesses</text><text x='30' y='125' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>0.5 habit</text><text x='30' y='144' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='start' font-weight='bold'>-$307,080</text><rect x='140' y='106' width='60' height='28' fill='#e57ea6' opacity='0.8'/><text x='30' y='205' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>cost-ratio 0.0909</text><text x='30' y='224' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='start' font-weight='bold'>+$470,720</text><rect x='200' y='186' width='180' height='28' fill='#7bc98a' opacity='0.8'/><text x='30' y='205' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>validation sweep</text><text x='30' y='224' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='start' font-weight='bold'>+$535,960</text><rect x='200' y='186' width='205' height='28' fill='#7bc98a' opacity='0.8'/><line x1='200' y1='60' x2='200' y2='260' stroke='#9a9a9a' stroke-width='1'/><text x='20' y='300' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>The AUC never moved. The business moved by $777,800 on the cut alone.</text></svg>