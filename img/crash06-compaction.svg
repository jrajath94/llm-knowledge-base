<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.4. Context compaction: 320k becomes 120k</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">keep the working set near 3k tokens per step</text>
<rect x="120" y="140" width="560" height="60" fill="#6cb2ff" rx="6" opacity="0.8"/>
<text x="400.0" y="176" font-size="14" font-weight="bold" fill="#0b0e13" text-anchor="middle">320k raw context</text>
<line x1="440" y1="200" x2="440" y2="240" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,240 436.33015592246386,231.78219953718923 443.66984407753614,231.78219953718923" fill="#8a8a8a"/>
<text x="470" y="226" font-size="11" fill="#a8a8a8" text-anchor="start">compact 2.67x</text>
<rect x="230" y="240" width="340" height="60" fill="#7dd87d" rx="6" opacity="0.8"/>
<text x="400.0" y="276" font-size="14" font-weight="bold" fill="#0b0e13" text-anchor="middle">120k compacted</text>
<rect x="24" y="300" width="832" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="326" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">KEEP VERBATIM</text>
<text x="440.0" y="344" font-size="11" fill="#a8a8a8" text-anchor="middle">the task text, the recent K steps, and the load-bearing facts; everything else may be summarized</text>
<text x="24" y="460" font-size="12" fill="#a8a8a8" text-anchor="start">Compaction is lossy by design. The art is choosing what is load-bearing before you compress, not after.</text>
</svg>