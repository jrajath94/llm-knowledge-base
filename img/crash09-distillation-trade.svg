<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 300' width='100%' role='img' aria-label='Distillation trade: teacher accuracy 0.950 at full cost versus student 0.872 at one twenty-fifth the cost'>
<text x='20' y='32' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Distillation: the measured trade</text>
<text x='20' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>A single linear layer keeps 92% of the boosted teacher's accuracy at about 1/25th the serving cost.</text>
<text x='20' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec'>teacher (boosted)</text>
<rect x='220' y='86' width='570' height='26' fill='#1565c0'/>
<text x='800' y='105' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#ececec'>accuracy 0.950</text>
<text x='20' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec'>student (1 layer)</text>
<rect x='220' y='134' width='523' height='26' fill='#2e7d32'/>
<text x='753' y='153' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#ececec'>accuracy 0.872</text>
<text x='20' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec'>teacher cost</text>
<rect x='220' y='188' width='570' height='26' fill='#c62828' opacity='0.85'/>
<text x='800' y='207' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#ececec'>$0.083 / 1k</text>
<text x='20' y='254' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec'>student cost</text>
<rect x='220' y='236' width='23' height='26' fill='#f0b429'/>
<text x='253' y='255' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#ececec'>$0.0033 / 1k (25x cheaper)</text>
</svg>
