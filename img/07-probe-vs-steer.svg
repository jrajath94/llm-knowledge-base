<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="660" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Probing reads, steering writes</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Probe for correlation, steer for causation: the cheapest loop that clears the bar</text>
<rect x="24" y="88" width="420" height="330" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="234" y="122" font-size="15" font-weight="bold" fill="#6cb2ff" text-anchor="middle">Probing: read-only</text>
<text x="48" y="160" font-size="11.5" fill="#a8a8a8" text-anchor="start">Freeze the model.</text>
<text x="48" y="180" font-size="11.5" fill="#a8a8a8" text-anchor="start">Train a tiny linear classifier</text>
<text x="48" y="200" font-size="11.5" fill="#a8a8a8" text-anchor="start">on its activations.</text>
<text x="48" y="220" font-size="11.5" fill="#a8a8a8" text-anchor="start"></text>
<text x="48" y="240" font-size="11.5" fill="#a8a8a8" text-anchor="start">High accuracy = the information</text>
<text x="48" y="260" font-size="11.5" fill="#a8a8a8" text-anchor="start">is present.</text>
<text x="48" y="280" font-size="11.5" fill="#a8a8a8" text-anchor="start"></text>
<text x="48" y="300" font-size="11.5" fill="#a8a8a8" text-anchor="start">Presence is not use: a probe can</text>
<text x="48" y="320" font-size="11.5" fill="#a8a8a8" text-anchor="start">be 95% accurate on information</text>
<text x="48" y="340" font-size="11.5" fill="#a8a8a8" text-anchor="start">the model&#x27;s own layers ignore.</text>
<rect x="456" y="88" width="420" height="330" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="666" y="122" font-size="15" font-weight="bold" fill="#f0b429" text-anchor="middle">Steering: write</text>
<text x="480" y="160" font-size="11.5" fill="#a8a8a8" text-anchor="start">Contrast pairs: honest vs</text>
<text x="480" y="180" font-size="11.5" fill="#a8a8a8" text-anchor="start">sycophantic completions.</text>
<text x="480" y="200" font-size="11.5" fill="#a8a8a8" text-anchor="start">v = mean difference of activations.</text>
<text x="480" y="220" font-size="11.5" fill="#a8a8a8" text-anchor="start">Add alpha x v at post-prompt</text>
<text x="480" y="240" font-size="11.5" fill="#a8a8a8" text-anchor="start">token positions during generation.</text>
<text x="480" y="260" font-size="11.5" fill="#a8a8a8" text-anchor="start"></text>
<text x="480" y="280" font-size="11.5" fill="#a8a8a8" text-anchor="start">Behavior shifts = the direction</text>
<text x="480" y="300" font-size="11.5" fill="#a8a8a8" text-anchor="start">is causal.</text>
<text x="480" y="320" font-size="11.5" fill="#a8a8a8" text-anchor="start"></text>
<text x="480" y="340" font-size="11.5" fill="#a8a8a8" text-anchor="start">Sweep alpha: too small, no change;</text>
<text x="480" y="360" font-size="11.5" fill="#a8a8a8" text-anchor="start">too large, the model degrades.</text>
<rect x="24" y="448" width="852" height="116" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="480" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">The loop between them</text>
<text x="48" y="510" font-size="11" fill="#a8a8a8" text-anchor="start">Probe first to find candidate directions cheaply; steer to test the winners. ITI is literally this loop:</text>
<text x="48" y="527" font-size="11" fill="#a8a8a8" text-anchor="start">probes select truthfulness-correlated heads, intervention shifts them.</text>
<text x="24" y="588" font-size="11" fill="#8a8a8a" text-anchor="start">Control from the literature: probe a randomized network too. A probe that scores above chance there is fitting spurious</text>
<text x="24" y="605" font-size="11" fill="#8a8a8a" text-anchor="start">patterns.</text>
</svg>