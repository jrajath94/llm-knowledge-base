<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="'Charis SIL',Georgia,serif">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" />
</marker>
</defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Monitoring Loop</text>
<rect x="50" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="115.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Metrics</text>
<text x="115.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Latency, errors</text>
<rect x="250" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="315.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Alerts</text>
<text x="315.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">p99 &gt; SLO</text>
<rect x="450" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="515.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Action</text>
<text x="515.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Rollback, scale</text>
<rect x="250" y="250" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="315.0" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Eval</text>
<text x="315.0" y="298" text-anchor="middle" font-size="11" fill="#a8a8a8">Quality gates</text>
<line x1="180" y1="135" x2="250" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="380" y1="135" x2="450" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="515" y1="170" x2="315" y2="250" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="250" y1="250" x2="115" y2="170" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="350" y="350" text-anchor="middle" font-size="12" fill="#a8a8a8">Metrics trigger alerts. Alerts trigger actions. Eval gates deploys.</text>
</svg>