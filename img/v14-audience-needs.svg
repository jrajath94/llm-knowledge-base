<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Audience types and what each one needs">
  <text x="40" y="34" font-size="12" fill="#f0b429" font-weight="700" letter-spacing="1.5">AUDIENCE</text>
  <text x="380" y="34" font-size="12" fill="#f0b429" font-weight="700" letter-spacing="1.5">WHAT THEY NEED FROM YOU</text>
  <g font-size="14">
    <rect x="20" y="50" width="320" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="36" y="85" fill="#ececec" font-weight="700">Peer reviewers</text>
    <rect x="360" y="50" width="300" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="376" y="75" fill="#a8a8a8">exact claims, evidence,</text>
    <text x="376" y="95" fill="#a8a8a8">limitations</text>
    <rect x="20" y="120" width="320" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="36" y="155" fill="#ececec" font-weight="700">Talk audience</text>
    <rect x="360" y="120" width="300" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="376" y="145" fill="#a8a8a8">one message, a story arc</text>
    <text x="376" y="165" fill="#a8a8a8">to carry it</text>
    <rect x="20" y="190" width="320" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="36" y="225" fill="#ececec" font-weight="700">Interview panel</text>
    <rect x="360" y="190" width="300" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="376" y="215" fill="#a8a8a8">judgment, ownership,</text>
    <text x="376" y="235" fill="#a8a8a8">honesty under drill</text>
    <rect x="20" y="260" width="320" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="36" y="295" fill="#ececec" font-weight="700">Collaborators</text>
    <rect x="360" y="260" width="300" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="376" y="285" fill="#a8a8a8">mechanism, next steps,</text>
    <text x="376" y="305" fill="#a8a8a8">what to build on</text>
    <rect x="20" y="330" width="320" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="36" y="365" fill="#ececec" font-weight="700">Non-experts</text>
    <rect x="360" y="330" width="300" height="58" rx="8" fill="#101010" stroke="#3a3a3a"/>
    <text x="376" y="355" fill="#a8a8a8">intuition, why it</text>
    <text x="376" y="375" fill="#a8a8a8">matters</text>
  </g>
</svg>
