<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 340' width='100%' role='img'>
<text x='30' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>The five ground rules</text>
<text x='30' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Hold all five at once. None of them is optional.</text>
<rect x='20' y='90' width='176' height='210' rx='10' fill='#0d0d0d' stroke='#3a3a3a' stroke-width='1.5'/>
<circle cx='108' cy='132' r='22' fill='none' stroke='#1565c0' stroke-width='3'/>
<text x='108' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='24' font-weight='600' fill='#1565c0' text-anchor='middle'>1</text>
<text x='108' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>No skipping</text>
<text x='108' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Volume 1 is the</text>
<text x='108' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>foundation. Everything</text>
<text x='108' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>stands on it.</text>
<rect x='206' y='90' width='176' height='210' rx='10' fill='#0d0d0d' stroke='#3a3a3a' stroke-width='1.5'/>
<circle cx='294' cy='132' r='22' fill='none' stroke='#f0b429' stroke-width='3'/>
<text x='294' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='24' font-weight='600' fill='#f0b429' text-anchor='middle'>2</text>
<text x='294' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Labs mandatory</text>
<text x='294' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Reading about training</text>
<text x='294' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>is not training.</text>
<text x='294' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Run the code.</text>
<rect x='392' y='90' width='176' height='210' rx='10' fill='#0d0d0d' stroke='#3a3a3a' stroke-width='1.5'/>
<circle cx='480' cy='132' r='22' fill='none' stroke='#2e7d32' stroke-width='3'/>
<text x='480' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='24' font-weight='600' fill='#2e7d32' text-anchor='middle'>3</text>
<text x='480' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>One volume</text>
<text x='480' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Finish it, do the</text>
<text x='480' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>capstone lab, then</text>
<text x='480' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>advance.</text>
<rect x='578' y='90' width='176' height='210' rx='10' fill='#0d0d0d' stroke='#3a3a3a' stroke-width='1.5'/>
<circle cx='666' cy='132' r='22' fill='none' stroke='#00838f' stroke-width='3'/>
<text x='666' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='24' font-weight='600' fill='#00838f' text-anchor='middle'>4</text>
<text x='666' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Honest markers</text>
<text x='666' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Illustrative stays</text>
<text x='666' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>labeled. Nothing</text>
<text x='666' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>invented.</text>
<rect x='764' y='90' width='176' height='210' rx='10' fill='#0d0d0d' stroke='#3a3a3a' stroke-width='1.5'/>
<circle cx='852' cy='132' r='22' fill='none' stroke='#e65100' stroke-width='3'/>
<text x='852' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='24' font-weight='600' fill='#e65100' text-anchor='middle'>5</text>
<text x='852' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Portable</text>
<text x='852' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>No personal info.</text>
<text x='852' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Works fully offline.</text>
<text x='852' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Copy anywhere.</text>
</svg>