<text x="763.0" y="225" font-size="10" font-weight="bold" fill="#0d0d0d" text-anchor="middle">free</text>
<text x="24" y="324" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">layer i+2</text>
<rect x="130" y="290" width="92" height="52" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="176.0" y="321" font-size="10" font-weight="bold" fill="#0d0d0d" text-anchor="middle">all-gather</text>
<rect x="226" y="290" width="124" height="52" fill="#4fd1a5" rx="4" opacity="0.9"/>
<text x="288.0" y="321" font-size="10" font-weight="bold" fill="#0d0d0d" text-anchor="middle">forward</text>
<rect x="354" y="290" width="46" height="52" fill="#4a4a4a" rx="4" opacity="0.9"/>
