<line x1="450.0" y1="150" x2="176" y2="194" stroke="#7dd87d" stroke-width="2"/>
<polygon points="176,194 183.53198614329557,189.07362356927493 184.69571307092767,196.3204685277111" fill="#7dd87d"/>
<text x="460.0" y="182" font-size="10" fill="#7dd87d" text-anchor="start">prefetch: next gather flies while this computes</text>
<line x1="450.0" y1="246" x2="176" y2="290" stroke="#7dd87d" stroke-width="2"/>
<polygon points="176,290 183.53198614329557,285.07362356927496 184.69571307092767,292.3204685277111" fill="#7dd87d"/>
<text x="460.0" y="278" font-size="10" fill="#7dd87d" text-anchor="start">prefetch: next gather flies while this computes</text>
<text x="24" y="408" font-size="13" fill="#a8a8a8" text-anchor="start">Peak memory is one unit&#x27;s full weights plus the shards. Prefetch hides the all-gathers behind compute.</text>
<text x="24" y="432" font-size="13" fill="#f0b429" text-anchor="start">Too fine a wrap and all-gather latency dominates; too coarse and memory spikes. One transformer layer is the default for a reason.</text>
</svg>