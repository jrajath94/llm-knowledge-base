<text x="690.0" y="129" font-size="10" font-weight="bold" fill="#0d0d0d" text-anchor="middle">reduce-scatter</text>
<rect x="740" y="98" width="46" height="52" fill="#4a4a4a" rx="4" opacity="0.9"/>
<text x="763.0" y="129" font-size="10" font-weight="bold" fill="#0d0d0d" text-anchor="middle">free</text>
<text x="24" y="228" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">layer i+1</text>
