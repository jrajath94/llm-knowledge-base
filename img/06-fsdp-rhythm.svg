<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="440" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">FSDP&#x27;s per-layer rhythm, with prefetch</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">all-gather, compute, free, overlapped with the next layer&#x27;s gather</text>
