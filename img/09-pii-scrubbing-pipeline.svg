<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="750" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The scrubbing pipeline, in order</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Regex is the first layer, never the whole story</text>
<rect x="24" y="94" width="852" height="138" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="126" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="middle">1. Detect</text>
<text x="48" y="150" font-size="11" fill="#a8a8a8" text-anchor="start">Regex: emails, phones, cards, SSNs, API keys. Classifier: names in free text, quasi-identifiers, context</text>
<text x="48" y="167" font-size="11" fill="#a8a8a8" text-anchor="start">secrets.</text>
<line x1="450" y1="232" x2="450" y2="246" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450,246 446.33015592246386,237.78219953718923 453.66984407753614,237.78219953718923" fill="#8a8a8a"/>
<rect x="24" y="246" width="852" height="138" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="278" font-size="14" font-weight="bold" fill="#6cb2ff" text-anchor="middle">2. Redact or tokenize</text>
<text x="48" y="302" font-size="11" fill="#a8a8a8" text-anchor="start">Redact: the email becomes [EMAIL]. Tokenize: reversible TOK_7F3A in a vault. Redact logs; tokenize when</text>
<text x="48" y="319" font-size="11" fill="#a8a8a8" text-anchor="start">the agent needs the value later.</text>
<line x1="450" y1="384" x2="450" y2="398" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450,398 446.33015592246386,389.78219953718923 453.66984407753614,389.78219953718923" fill="#8a8a8a"/>
<rect x="24" y="398" width="852" height="138" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="430" font-size="14" font-weight="bold" fill="#f0b429" text-anchor="middle">3. Log with field policies</text>
<text x="48" y="454" font-size="11" fill="#a8a8a8" text-anchor="start">Per field: keep, redact, or drop. Tool names and timestamps are safe; arguments and results may hold</text>
<text x="48" y="471" font-size="11" fill="#a8a8a8" text-anchor="start">PII. Raw-argument logging is how most breaches start.</text>
<line x1="450" y1="536" x2="450" y2="550" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="450,550 446.33015592246386,541.7821995371892 453.66984407753614,541.7821995371892" fill="#8a8a8a"/>
<rect x="24" y="550" width="852" height="138" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450.0" y="582" font-size="14" font-weight="bold" fill="#e57ea6" text-anchor="middle">4. Scrub before training</text>
<text x="48" y="606" font-size="11" fill="#a8a8a8" text-anchor="start">No trajectory reaches a training set without the scrubber: detect, redact, then a human-sampled audit</text>
<text x="48" y="623" font-size="11" fill="#a8a8a8" text-anchor="start">(read 200 scrubbed trajectories and count leaks).</text>
</svg>