<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Horizontal bars of four cost levers ordered by return on investment"><rect x="22" y="14" width="916" height="312" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 8</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Cost levers in ROI order: cheapest win first</text><text x="38" y="116" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Batching</text><rect x="220" y="100" width="468.0" height="24" rx="5" fill="#f0b429"/><text x="760" y="118" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="start">risks latency</text><text x="38" y="160" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Caching</text><rect x="220" y="144" width="364.0" height="24" rx="5" fill="#f0b429"/><text x="760" y="162" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="start">risks staleness</text><text x="38" y="204" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Quantization</text><rect x="220" y="188" width="260.0" height="24" rx="5" fill="#f0b429"/><text x="760" y="206" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="start">risks quality</text><text x="38" y="248" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Smaller model</text><rect x="220" y="232" width="156.0" height="24" rx="5" fill="#f0b429"/><text x="760" y="250" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="start">risks capability</text><text x="38" y="300" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">Illustrative savings. Apply in order. Name what each lever risks before you pull it.</text></svg>