<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
<rect width="600" height="250" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Judge calibration: the kappa gate</text><rect x='60' y='90' width='480' height='26' rx='13' fill='#1a1a1a' stroke='#9a9a9a'/><rect x='60' y='90' width='336' height='26' rx='13' fill='#e57ea6' opacity='0.55'/><rect x='396' y='90' width='144' height='26' rx='13' fill='#7bc98a' opacity='0.55'/><line x1='396' y1='80' x2='396' y2='126' stroke='#e8e8e8' stroke-width='2'/><text x='396' y='70' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>0.70</text><text x='60' y='150' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='start'>0.0</text><text x='540' y='150' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>1.0</text><text x='228' y='180' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='middle'>judge assists; a human grades</text><text x='468' y='180' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='middle'>judge grades</text><text x='20' y='220' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Calibrate on 100-200 human grades. Below 0.70 the judge pre-grades for humans; it does not grade.</text></svg>