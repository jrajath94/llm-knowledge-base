<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="500" fill="#0d0d0d"/>
<text x="450" y="34" text-anchor="middle" fill="#ececec" font-size="20" font-weight="600">TPU pod: one uniform mesh, not islands</text>

<!-- LEFT: DGX islands -->
<text x="225" y="66" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="600">DGX model: fast islands</text>
<g font-size="11">
<rect x="55" y="100" width="150" height="130" rx="8" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="130" y="122" text-anchor="middle" fill="#ececec">node A: 8 GPUs</text>
<g fill="#6cb2ff">
<circle cx="80" cy="150" r="10"/><circle cx="110" cy="150" r="10"/><circle cx="140" cy="150" r="10"/><circle cx="170" cy="150" r="10"/>
<circle cx="80" cy="180" r="10"/><circle cx="110" cy="180" r="10"/><circle cx="140" cy="180" r="10"/><circle cx="170" cy="180" r="10"/>
</g>
<text x="130" y="212" text-anchor="middle" fill="#7fd08a">NVLink: very fast</text>

<rect x="255" y="100" width="150" height="130" rx="8" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="330" y="122" text-anchor="middle" fill="#ececec">node B: 8 GPUs</text>
<g fill="#6cb2ff">
<circle cx="280" cy="150" r="10"/><circle cx="310" cy="150" r="10"/><circle cx="340" cy="150" r="10"/><circle cx="370" cy="150" r="10"/>
<circle cx="280" cy="180" r="10"/><circle cx="310" cy="180" r="10"/><circle cx="340" cy="180" r="10"/><circle cx="370" cy="180" r="10"/>
</g>
<text x="330" y="212" text-anchor="middle" fill="#7fd08a">NVLink: very fast</text>

<path d="M 205 165 L 255 165" stroke="#e08080" stroke-width="2" stroke-dasharray="6,4"/>
<text x="230" y="156" text-anchor="middle" fill="#e08080" font-size="10">InfiniBand</text>
<text x="230" y="196" text-anchor="middle" fill="#e08080" font-size="10">slower</text>
</g>

<!-- divider -->
<line x1="460" y1="60" x2="460" y2="260" stroke="#3a3a3a"/>

<!-- RIGHT: TPU pod -->
<text x="680" y="66" text-anchor="middle" fill="#7fd08a" font-size="15" font-weight="600">TPU pod: uniform 2D torus</text>
<g>
<rect x="540" y="100" width="260" height="130" rx="8" fill="#1a1a1a" stroke="#7fd08a" stroke-width="1.5"/>
<!-- 4x4 mesh of chips -->
<g fill="#6cb2ff">
<circle cx="575" cy="135" r="9"/><circle cx="610" cy="135" r="9"/><circle cx="645" cy="135" r="9"/><circle cx="680" cy="135" r="9"/><circle cx="715" cy="135" r="9"/><circle cx="750" cy="135" r="9"/>
<circle cx="575" cy="165" r="9"/><circle cx="610" cy="165" r="9"/><circle cx="645" cy="165" r="9"/><circle cx="680" cy="165" r="9"/><circle cx="715" cy="165" r="9"/><circle cx="750" cy="165" r="9"/>
<circle cx="575" cy="195" r="9"/><circle cx="610" cy="195" r="9"/><circle cx="645" cy="195" r="9"/><circle cx="680" cy="195" r="9"/><circle cx="715" cy="195" r="9"/><circle cx="750" cy="195" r="9"/>
</g>
<g stroke="#2e9e5b" stroke-width="1">
<line x1="575" y1="135" x2="610" y2="135"/><line x1="610" y1="135" x2="645" y2="135"/><line x1="645" y1="135" x2="680" y2="135"/><line x1="680" y1="135" x2="715" y2="135"/><line x1="715" y1="135" x2="750" y2="135"/>
<line x1="575" y1="165" x2="610" y2="165"/><line x1="610" y1="165" x2="645" y2="165"/><line x1="645" y1="165" x2="680" y2="165"/><line x1="680" y1="165" x2="715" y2="165"/><line x1="715" y1="165" x2="750" y2="165"/>
<line x1="575" y1="195" x2="610" y2="195"/><line x1="610" y1="195" x2="645" y2="195"/><line x1="645" y1="195" x2="680" y2="195"/><line x1="680" y1="195" x2="715" y2="195"/><line x1="715" y1="195" x2="750" y2="195"/>
<line x1="575" y1="135" x2="575" y2="165"/><line x1="575" y1="165" x2="575" y2="195"/>
<line x1="610" y1="135" x2="610" y2="165"/><line x1="610" y1="165" x2="610" y2="195"/>
<line x1="645" y1="135" x2="645" y2="165"/><line x1="645" y1="165" x2="645" y2="195"/>
<line x1="680" y1="135" x2="680" y2="165"/><line x1="680" y1="165" x2="680" y2="195"/>
<line x1="715" y1="135" x2="715" y2="165"/><line x1="715" y1="165" x2="715" y2="195"/>
<line x1="750" y1="135" x2="750" y2="165"/><line x1="750" y1="165" x2="750" y2="195"/>
</g>
<text x="670" y="222" text-anchor="middle" fill="#7fd08a" font-size="11">every link is ICI: same speed, wrap-around edges</text>
</g>

<!-- bottom panel -->
<rect x="60" y="280" width="780" height="180" rx="8" fill="#141414" stroke="#3a3a3a"/>
<text x="450" y="308" text-anchor="middle" fill="#ececec" font-size="14" font-weight="600">why the plan must change</text>
<text x="450" y="334" text-anchor="middle" fill="#a8a8a8" font-size="13">on DGX: tensor parallelism lives inside the node, because that is where the fast links are</text>
<text x="450" y="356" text-anchor="middle" fill="#a8a8a8" font-size="13">on a TPU pod: every link is fast, so there is no "inside" to favor</text>
<text x="450" y="388" text-anchor="middle" fill="#7fd08a" font-size="13">name mesh axes to follow the torus: slices rent sub-meshes, multislice</text>
<text x="450" y="410" text-anchor="middle" fill="#7fd08a" font-size="13">stitches pods together for 10k+ chips</text>
<text x="450" y="440" text-anchor="middle" fill="#e08080" font-size="13">a blind "TP-inside, DP-across" copy wastes the uniform mesh</text>
</svg>
