<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 412" role="img" aria-label="Chapter 5: Koko Eating Bananas — the worked example, traced">
<rect width="900" height="412" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 5: Koko Eating Bananas — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 31. piles = [3, 6, 7, 11], h = 8. hours(k) = sum of ceil(pile / k). Binary search the smallest k with hours within budget 8.</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="46.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="129.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">mid = 6</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">lo=1, hi=11: hours(6) = 1+1+2+2 = 6 (budget</text>
<text x="128.0" y="138.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">8)</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">6 works: search lower, hi = 6</text>
<text x="48.0" y="175.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">mid = 3</text>
<text x="128.0" y="167.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">lo=1, hi=6: hours(3) = 1+2+3+4 = 10 (over</text>
<text x="128.0" y="184.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">budget)</text>
<text x="488.0" y="167.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">3 too slow: lo = 4</text>
<rect x="40.0" y="193.0" width="820.0" height="46.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="221.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">mid = 5</text>
<text x="128.0" y="213.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">lo=4, hi=6: hours(5) = 1+2+2+3 = 8 (budget</text>
<text x="128.0" y="230.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">8)</text>
<text x="488.0" y="213.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">5 works: hi = 5</text>
<text x="48.0" y="267.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">mid = 4</text>
<text x="128.0" y="259.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">lo=4, hi=5: hours(4) = 1+2+2+3 = 8 (budget</text>
<text x="128.0" y="276.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">8)</text>
<text x="488.0" y="259.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">4 works: hi = 4</text>
<rect x="40.0" y="285.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="304.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">done</text>
<text x="128.0" y="305.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">lo=4, hi=4: loop ends</text>
<text x="488.0" y="305.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">answer 4</text>
<line x1="40.0" y1="314.0" x2="860.0" y2="314.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="324.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="346.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">hours(k) only decreases as k grows, so the predicate 'fast enough' is monotone: binary search</text>
<text x="58.0" y="362.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">applies to the answer space, not to an array.</text>
</svg>
