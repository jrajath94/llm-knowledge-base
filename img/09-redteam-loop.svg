<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-label="Red team probe cycle">
<rect width="800" height="350" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="400.0" y="28" text-anchor="middle" font-size="18" class="accent">Red-Teaming: The Loop</text>
<rect x="60" y="120" width="150" height="70" class="box" rx="4"/>
<text x="135.0" y="142" text-anchor="middle" font-size="14">Probe</text>
<text x="135.0" y="160" text-anchor="middle" font-size="11" class="muted">attack attempt</text>
<line x1="210" y1="155" x2="250" y2="155" class="line"/>
<rect x="250" y="120" width="150" height="70" class="box" rx="4"/>
<text x="325.0" y="142" text-anchor="middle" font-size="14">Detector</text>
<text x="325.0" y="160" text-anchor="middle" font-size="11" class="muted">scores response</text>
<line x1="400" y1="155" x2="440" y2="155" class="line"/>
<rect x="440" y="120" width="150" height="70" class="box" rx="4"/>
<text x="515.0" y="142" text-anchor="middle" font-size="14">Fix</text>
<text x="515.0" y="160" text-anchor="middle" font-size="11" class="muted">capability layer</text>
<line x1="590" y1="155" x2="630" y2="155" class="line"/>
<rect x="630" y="120" width="140" height="70" class="box" rx="4"/>
<text x="700.0" y="142" text-anchor="middle" font-size="14">Regression</text>
<text x="700.0" y="160" text-anchor="middle" font-size="11" class="muted">in CI</text>
<text x="400" y="250" text-anchor="middle" font-size="12" class="muted">Versioned probe library. Automated runs. Findings with transcripts.</text>
</svg>