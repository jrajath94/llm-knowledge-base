<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 227" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A hypothesis is a falsifiable prediction: &quot;If X, then Y, because Z&quot;"><rect x="22" y="14" width="916" height="199" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">HYPOTHESES</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Without the mechanism, a correct prediction is luck</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Independent variable:</text><text x="253.31679687500002" y="94" font-size="13.5" fill="#a8a8a8">what you change. Example: chunk size in retrieval.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Dependent variable:</text><text x="240.228125" y="125" font-size="13.5" fill="#a8a8a8">what you measure. Example: recall at 5.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Mechanism (Z):</text><text x="202.58210937500002" y="156" font-size="13.5" fill="#a8a8a8">why changing X should move Y. Example: smaller chunks keep the relevant sentence</text><text x="80" y="175" font-size="13.5" fill="#a8a8a8">from drowning in boilerplate.</text><path d="M 53.7 201.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="206" font-size="13.5" font-weight="700" fill="#ececec">The null hypothesis:</text><text x="239.21562500000002" y="206" font-size="13.5" fill="#a8a8a8">the enemy: the boring alternative that the change does nothing.</text></svg>