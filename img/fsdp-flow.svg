<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 340' width='100%' style='max-width:900px;background-color:transparent' role='img'><style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.g{fill:#f0b429}.b{fill:#6cb2ff}.r{fill:#e57373}.gr{fill:#7fc97f}</style><text x='360' y='24' font-size='14' text-anchor='middle' font-weight='700'>Steady state: each GPU holds one shard</text><rect x='60' y='40' width='130' height='60' rx='6' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='125' y='66' font-size='13' text-anchor='middle' font-weight='700'>GPU0</text><text x='125' y='86' font-size='12' text-anchor='middle' class='m'>shard 0 only</text><rect x='220' y='40' width='130' height='60' rx='6' fill='#141414' stroke='#7fc97f' stroke-width='2'/><text x='285' y='66' font-size='13' text-anchor='middle' font-weight='700'>GPU1</text><text x='285' y='86' font-size='12' text-anchor='middle' class='m'>shard 1 only</text><rect x='380' y='40' width='130' height='60' rx='6' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='445' y='66' font-size='13' text-anchor='middle' font-weight='700'>GPU2</text><text x='445' y='86' font-size='12' text-anchor='middle' class='m'>shard 2 only</text><rect x='540' y='40' width='130' height='60' rx='6' fill='#141414' stroke='#e57373' stroke-width='2'/><text x='605' y='66' font-size='13' text-anchor='middle' font-weight='700'>GPU3</text><text x='605' y='86' font-size='12' text-anchor='middle' class='m'>shard 3 only</text><line x1='360' y1='112' x2='360' y2='146' stroke='#f0b429' stroke-width='2.5' marker-end='url(#ah3)'/><text x='372' y='134' font-size='13' class='g' font-weight='700'>all-gather</text><defs><marker id='ah3' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6' fill='none' stroke='#f0b429' stroke-width='1.5'/></marker></defs><rect x='180' y='150' width='360' height='64' rx='8' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='360' y='176' font-size='14' text-anchor='middle' font-weight='700'>Full layer materialized on every GPU</text><text x='360' y='196' font-size='12' text-anchor='middle' class='m'>forward compute runs, then full params are freed</text><line x1='360' y1='226' x2='360' y2='258' stroke='#6cb2ff' stroke-width='2.5' marker-end='url(#ah4)'/><text x='372' y='250' font-size='13' class='b' font-weight='700'>backward: all-gather again, then reduce-scatter grads</text><defs><marker id='ah4' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6' fill='none' stroke='#6cb2ff' stroke-width='1.5'/></marker></defs><rect x='60' y='262' width='130' height='44' rx='6' fill='#141414' stroke='#6cb2ff' stroke-width='2'/><text x='125' y='289' font-size='12' text-anchor='middle' class='m'>grad shard 0</text><rect x='220' y='262' width='130' height='44' rx='6' fill='#141414' stroke='#7fc97f' stroke-width='2'/><text x='285' y='289' font-size='12' text-anchor='middle' class='m'>grad shard 1</text><rect x='380' y='262' width='130' height='44' rx='6' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='445' y='289' font-size='12' text-anchor='middle' class='m'>grad shard 2</text><rect x='540' y='262' width='130' height='44' rx='6' fill='#141414' stroke='#e57373' stroke-width='2'/><text x='605' y='289' font-size='12' text-anchor='middle' class='m'>grad shard 3</text><text x='60' y='328' font-size='13' class='m'>FSDP is ZeRO-3 with on-demand materialization. Price: 1.5x the all-reduce traffic of DDP; prefetch hides it when compute per layer is large.</text></svg>