<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="sans-serif">
<rect width="700" height="400" fill="#ffffff"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">Audience Map</text>
<rect x="50" y="80" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="140.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Peer Reviewer</text>
<text x="140.0" y="128" text-anchor="middle" font-size="11" fill="#555">Is it true? Is it new?</text>
<rect x="260" y="80" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="350.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Colleague</text>
<text x="350.0" y="128" text-anchor="middle" font-size="11" fill="#555">Can I use it?</text>
<rect x="470" y="80" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="560.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Hiring Manager</text>
<text x="560.0" y="128" text-anchor="middle" font-size="11" fill="#555">Can you do it?</text>
<text x="350" y="220" text-anchor="middle" font-size="12" fill="#555">One explanation does not fit all. Tailor to the decision they will make.</text>
</svg>
