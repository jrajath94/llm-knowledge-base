<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="680" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Quantization: the memory math</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Bytes per parameter times model size; KV cache adds on top</text>
<text x="24" y="116" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">fp32</text>
<text x="140" y="116" font-size="11" fill="#8a8a8a" text-anchor="start">4 B/param</text>
<rect x="280" y="94" width="380.0" height="30" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="670.0" y="115" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">280 GB (70B)</text>
<text x="280" y="146" font-size="11" fill="#8a8a8a" text-anchor="start">52 GB for 13B</text>
<text x="24" y="194" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">fp16 / bf16</text>
<text x="140" y="194" font-size="11" fill="#8a8a8a" text-anchor="start">2 B/param</text>
<rect x="280" y="172" width="190.0" height="30" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="480.0" y="193" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">140 GB (70B)</text>
<text x="280" y="224" font-size="11" fill="#8a8a8a" text-anchor="start">26 GB for 13B</text>
<text x="24" y="272" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">int8</text>
<text x="140" y="272" font-size="11" fill="#8a8a8a" text-anchor="start">1 B/param</text>
<rect x="280" y="250" width="95.0" height="30" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="385.0" y="271" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">70 GB (70B)</text>
<text x="280" y="302" font-size="11" fill="#8a8a8a" text-anchor="start">13 GB for 13B</text>
<text x="24" y="350" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">int4</text>
<text x="140" y="350" font-size="11" fill="#8a8a8a" text-anchor="start">0.5 B/param</text>
<rect x="280" y="328" width="47.5" height="30" fill="#7dd87d" rx="4" opacity="1"/>
<text x="337.5" y="349" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">35 GB (70B)</text>
<text x="280" y="380" font-size="11" fill="#8a8a8a" text-anchor="start">6.5 GB for 13B</text>
<rect x="24" y="416" width="852" height="120" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="448" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Do not forget the KV cache</text>
<text x="48" y="478" font-size="11" fill="#a8a8a8" text-anchor="start">A 70B-class model at 4k context in fp16 holds roughly 2.5 MB per token, so 100 concurrent sequences need</text>
<text x="48" y="495" font-size="11" fill="#a8a8a8" text-anchor="start">another 250 GB of KV memory. This is why production stacks quantize both weights and KV cache.</text>
</svg>