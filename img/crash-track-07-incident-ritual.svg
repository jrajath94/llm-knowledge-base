<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.10. The incident ritual: same every time</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Five steps, in order. Customers forgive incidents, not silence.</text>
<circle cx="84" cy="110" r="22" fill="#f0b429"/>
<text x="84" y="118" font-size="18" font-weight="bold" fill="#0b0e13" text-anchor="middle">1</text>
<text x="84" y="160" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Mitigate</text>
<text x="84" y="185" font-size="12" fill="#8a8a8a" text-anchor="middle">roll back, pause,</text>
<text x="84" y="203" font-size="12" fill="#8a8a8a" text-anchor="middle">or human handoff</text>
<line x1="156" y1="110" x2="182" y2="110" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="182,104 182,116 192,110" fill="#8a8a8a"/>
<circle cx="250" cy="110" r="22" fill="#f0b429"/>
<text x="250" y="118" font-size="18" font-weight="bold" fill="#0b0e13" text-anchor="middle">2</text>
<text x="250" y="160" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Timeline</text>
<text x="250" y="185" font-size="12" fill="#8a8a8a" text-anchor="middle">facts only,</text>
<text x="250" y="203" font-size="12" fill="#8a8a8a" text-anchor="middle">no blame yet</text>
<line x1="322" y1="110" x2="348" y2="110" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="348,104 348,116 358,110" fill="#8a8a8a"/>
<circle cx="416" cy="110" r="22" fill="#f0b429"/>
<text x="416" y="118" font-size="18" font-weight="bold" fill="#0b0e13" text-anchor="middle">3</text>
<text x="416" y="160" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Cause</text>
<text x="416" y="185" font-size="12" fill="#8a8a8a" text-anchor="middle">five whys,</text>
<text x="416" y="203" font-size="12" fill="#8a8a8a" text-anchor="middle">blameless</text>
<line x1="488" y1="110" x2="514" y2="110" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="514,104 514,116 524,110" fill="#8a8a8a"/>
<circle cx="582" cy="110" r="22" fill="#f0b429"/>
<text x="582" y="118" font-size="18" font-weight="bold" fill="#0b0e13" text-anchor="middle">4</text>
<text x="582" y="160" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Probe</text>
<text x="582" y="185" font-size="12" fill="#8a8a8a" text-anchor="middle">fuzzer probe plus a</text>
<text x="582" y="203" font-size="12" fill="#8a8a8a" text-anchor="middle">golden-set case</text>
<line x1="654" y1="110" x2="680" y2="110" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="680,104 680,116 690,110" fill="#8a8a8a"/>
<circle cx="748" cy="110" r="22" fill="#f0b429"/>
<text x="748" y="118" font-size="18" font-weight="bold" fill="#0b0e13" text-anchor="middle">5</text>
<text x="748" y="160" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Share</text>
<text x="748" y="185" font-size="12" fill="#8a8a8a" text-anchor="middle">post-mortem to the</text>
<text x="748" y="203" font-size="12" fill="#8a8a8a" text-anchor="middle">customer in 48h</text>
<line x1="820" y1="110" x2="846" y2="110" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="846,104 846,116 856,110" fill="#8a8a8a"/>
<text x="440" y="330" font-size="13" fill="#ececec" text-anchor="middle">A fuzzer probe is an automated adversarial-input test that hunts for crashes and hangs.</text>
</svg>
