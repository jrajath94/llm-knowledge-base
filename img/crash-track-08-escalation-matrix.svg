<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360">
<rect width="420" height="360" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Cascade escalation: grade the router, not the vibe</text><text x='20' y='56' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Rows: true difficulty. Columns: router decision.</text><text x='90' y='110' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>return cheap</text><text x='270' y='110' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>escalate</text><text x='45' y='170' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>easy</text><text x='45' y='250' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>hard</text><rect x='20' y='100' width='140' height='70' rx='8' fill='none' stroke='#7bc98a' stroke-width='2'/><text x='90' y='128' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#7bc98a' text-anchor='middle' font-weight='bold'>TN</text><text x='90' y='150' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>correct</text><rect x='200' y='100' width='140' height='70' rx='8' fill='none' stroke='#f0b429' stroke-width='2'/><text x='270' y='128' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#f0b429' text-anchor='middle' font-weight='bold'>FP</text><text x='270' y='150' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>waste $</text><rect x='20' y='180' width='140' height='70' rx='8' fill='none' stroke='#e57ea6' stroke-width='2'/><text x='90' y='208' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#e57ea6' text-anchor='middle' font-weight='bold'>FN</text><text x='90' y='230' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>premium fail</text><rect x='200' y='180' width='140' height='70' rx='8' fill='none' stroke='#7bc98a' stroke-width='2'/><text x='270' y='208' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#7bc98a' text-anchor='middle' font-weight='bold'>TP</text><text x='270' y='230' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>correct</text><text x='20' y='330' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>FP = you pay premium prices for premium failures. Minimize FN + FP on the golden set.</text></svg>