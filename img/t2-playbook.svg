<svg xmlns="http://www.w3.org/2000/svg" width="720" height="365" viewBox="0 0 720 365" role="img" aria-label="Production playbook: when to upgrade beyond SFT plus DPO">
<rect width="720" height="365" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The production playbook: complexity has to earn its keep</text>
<rect class="box" x="270" y="60" width="180" height="84" rx="8"/>
<text class="t" x="360" y="84" text-anchor="middle">start: SFT + DPO</text>
<text class="s" x="360" y="104" text-anchor="middle">the baseline almost</text>
<text class="s" x="360" y="121" text-anchor="middle">every team runs</text>
<line x1="270" y1="60" x2="270" y2="144" stroke="#f0b429" stroke-width="4"/>
<path d="M360,144 L360,178" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<polygon points="360,178 470,232 360,286 250,232" fill="#0d0d0d" stroke="#f0b429" stroke-width="2"/>
<text x="360" y="224" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">missed eval</text>
<text x="360" y="242" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">targets?</text>
<text x="478" y="232" text-anchor="start" fill="#3fb950" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">no</text>
<text x="242" y="232" text-anchor="end" fill="#e5484d" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">yes</text>
<path d="M478,232 L560,232" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M250,232 L150,232" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="560" y="188" width="140" height="88" rx="8"/>
<text class="t" x="630" y="212" text-anchor="middle">stay the course</text>
<text class="s" x="630" y="232" text-anchor="middle">cheaper,</text>
<text class="s" x="630" y="249" text-anchor="middle">safer,</text>
<text class="s" x="630" y="266" text-anchor="middle">ships sooner</text>
<line x1="560" y1="188" x2="560" y2="276" stroke="#3fb950" stroke-width="4"/>
<rect class="box" x="10" y="188" width="140" height="88" rx="8"/>
<text class="t" x="80" y="212" text-anchor="middle">upgrade</text>
<text class="s" x="80" y="232" text-anchor="middle">PPO (verifier)</text>
<text class="s" x="80" y="249" text-anchor="middle">or GRPO (code/math)</text>
<text class="s" x="80" y="266" text-anchor="middle"></text>
<line x1="10" y1="188" x2="10" y2="276" stroke="#e5484d" stroke-width="4"/>
<text x="360" y="320" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">PPO and GRPO win only when the verifier is trustworthy and DPO has plateaued.</text>
<text x="360" y="340" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">Add machinery one gate at a time. Each gate is an eval result, not a feeling.</text>
</svg>