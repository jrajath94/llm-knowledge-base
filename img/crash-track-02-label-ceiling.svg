<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="100%" style="max-width:660px" role="img" aria-label="Label noise ceiling: with 15 percent judge noise the best any reward model can reach is 85 percent pairwise accuracy">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">The label-noise ceiling</text>
<text class="m" x="24" y="54">The judge picks the worse response 15% of the time. No model beats its own labels.</text>
<rect class="box" x="24" y="90" width="560" height="40" rx="4"/>
<rect x="24" y="90" width="476" height="40" fill="#6cb2ff" rx="4"/>
<rect x="500" y="90" width="84" height="40" fill="#e57373" rx="4"/>
<text class="m" x="24" y="152">0%</text>
<text class="num" x="262" y="116" text-anchor="middle" fill="#0a0a0a" font-weight="700">85%: best any model reaches</text>
<text class="m" x="584" y="152" text-anchor="end">100%</text>
<text class="r" x="545" y="172" text-anchor="middle">15% noise</text>
<text class="m" x="24" y="192">The model trains to predict the judge. The judge agrees with the truth 85% of the time.</text>
<text class="m" x="24" y="214">More data sharpens the estimate of the judge's taste. It cannot fix the judge's flips.</text>
<rect class="box" x="24" y="234" width="612" height="56" rx="8"/>
<text class="big" x="40" y="260">Fix the judge, not the model: recalibrate, fix the rubric, or accept 85%.</text></svg>
