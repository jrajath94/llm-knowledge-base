<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Eval gate pipeline: change enters, smoke suite and full suite run, regression beyond threshold blocks the deploy">
<rect width="800" height="600" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">The eval gate: fail-closed by design</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">A gate is a check that must pass before a change ships. The gate does not need to be perfect.</text>
<text x="400" y="78" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">It needs to be louder than silence.</text>

<!-- Change -->
<g>
<rect x="300" y="105" width="200" height="70" rx="10" fill="#1a1a1a" stroke="#ececec" stroke-width="1.5"/>
<text x="400" y="132" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#ececec">Change</text>
<text x="400" y="154" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">new model, prompt, tools, code</text>
</g>
<line x1="400" y1="175" x2="400" y2="205" stroke="#555" stroke-width="2"/>
<polygon points="400,205 394,197 406,197" fill="#555"/>

<!-- Smoke -->
<g>
<rect x="110" y="205" width="280" height="110" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="250" y="234" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#6cb2ff">Smoke suite</text>
<text x="250" y="258" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">10 to 30 fast tasks</text>
<text x="250" y="278" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">every commit, minutes</text>
<text x="250" y="298" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">catches big breaks fast</text>
</g>

<!-- Full -->
<g>
<rect x="410" y="205" width="280" height="110" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="550" y="234" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#6cb2ff">Full suite</text>
<text x="550" y="258" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">hundreds of tasks, incl. long-horizon</text>
<text x="550" y="278" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">nightly and before releases</text>
<text x="550" y="298" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">catches slow rot</text>
</g>

<!-- converge -->
<line x1="250" y1="315" x2="400" y2="360" stroke="#555" stroke-width="2"/>
<line x1="550" y1="315" x2="400" y2="360" stroke="#555" stroke-width="2"/>

<!-- Compare -->
<g>
<rect x="280" y="360" width="240" height="80" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="400" y="388" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#f0b429">Compare vs last green run</text>
<text x="400" y="412" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">2-SE rule: regress beyond threshold?</text>
</g>
<line x1="400" y1="440" x2="400" y2="465" stroke="#555" stroke-width="2"/>
<polygon points="400,465 394,457 406,457" fill="#555"/>

<!-- Decision -->
<g>
<polygon points="400,465 560,530 400,595 240,530" fill="#1a1a1a" stroke="#e08080" stroke-width="1.5"/>
<text x="400" y="524" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#e08080">Regression?</text>
<text x="400" y="544" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#a8a8a8">beyond threshold</text>
</g>

<!-- Yes -> block -->
<text x="600" y="500" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">yes</text>
<line x1="560" y1="530" x2="650" y2="530" stroke="#e08080" stroke-width="2"/>
<g>
<rect x="650" y="500" width="130" height="60" rx="10" fill="#3a1f1f" stroke="#e08080" stroke-width="1.5"/>
<text x="715" y="525" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#e08080">BLOCK</text>
<text x="715" y="544" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a8a8">deploy stops</text>
</g>

<!-- No -> deploy -->
<text x="205" y="500" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">no</text>
<line x1="240" y1="530" x2="150" y2="530" stroke="#7fd08a" stroke-width="2"/>
<g>
<rect x="20" y="500" width="130" height="60" rx="10" fill="#1f3a24" stroke="#7fd08a" stroke-width="1.5"/>
<text x="85" y="525" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#7fd08a">DEPLOY</text>
<text x="85" y="544" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a8a8">ratchet baseline up</text>
</g>
</svg>
