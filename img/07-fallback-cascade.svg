<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 500' width='100%' role='img'><title>Fallback cascade for a failing AI call</title><text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Ordered by cost and reliability: each step is cheaper and more reliable than the last</text><rect x='200.0' y='70' width='560' height='62' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/><text x='480.0' y='105.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Task arrives: primary model, best quality</text><line x1='480' y1='132' x2='480' y2='162' stroke='#8a8a8a' stroke-width='2'/><polygon points='473,158 480,162 473,166' fill='#8a8a8a'/><rect x='230.0' y='162' width='500' height='62' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/><text x='480.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Retry once, same model</text><line x1='480' y1='224' x2='480' y2='254' stroke='#8a8a8a' stroke-width='2'/><polygon points='473,250 480,254 473,258' fill='#8a8a8a'/><rect x='260.0' y='254' width='440' height='62' rx='10' fill='#7b61b8' fill-opacity='0.22' stroke='#7b61b8' stroke-width='2'/><text x='480.0' y='289.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Smaller model: faster, dumber</text><line x1='480' y1='316' x2='480' y2='346' stroke='#8a8a8a' stroke-width='2'/><polygon points='473,342 480,346 473,350' fill='#8a8a8a'/><rect x='290.0' y='346' width='380' height='62' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/><text x='480.0' y='381.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Cached answer, if the task allows it</text><line x1='480' y1='408' x2='480' y2='438' stroke='#8a8a8a' stroke-width='2'/><polygon points='473,434 480,438 473,442' fill='#8a8a8a'/><rect x='320.0' y='438' width='320' height='62' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/><text x='480.0' y='473.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Human handoff with full context</text><text x='480' y='486' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Critical tasks skip sideways into mandatory human review. Retry once, never in a loop.</text></svg>