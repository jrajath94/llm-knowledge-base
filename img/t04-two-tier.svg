<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Two-tier checkpoint storage pattern with four options">
<rect width="720" height="320" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The two-tier pattern: fast local, durable remote</text>
<rect class="box" x="30" y="60" width="200" height="110" rx="8"/>
<text class="t" x="130" y="84" text-anchor="middle">tier 1: local NVMe</text>
<text class="s" x="130" y="104" text-anchor="middle">checkpoint lands here</text>
<text class="s" x="130" y="121" text-anchor="middle">in seconds, training</text>
<text class="s" x="130" y="138" text-anchor="middle">never waits</text>
<line x1="30" y1="60" x2="30" y2="170" stroke="#f0b429" stroke-width="4"/>
<path d="M230,115 L270,115" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="270" y="60" width="200" height="110" rx="8"/>
<text class="t" x="370" y="84" text-anchor="middle">async copy-out</text>
<text class="s" x="370" y="104" text-anchor="middle">background thread</text>
<text class="s" x="370" y="121" text-anchor="middle">moves bytes while</text>
<text class="s" x="370" y="138" text-anchor="middle">training continues</text>
<line x1="270" y1="60" x2="270" y2="170" stroke="#58a6ff" stroke-width="4"/>
<path d="M470,115 L510,115" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="510" y="60" width="180" height="110" rx="8"/>
<text class="t" x="600" y="84" text-anchor="middle">tier 2: parallel FS</text>
<text class="s" x="600" y="104" text-anchor="middle">durable home</text>
<text class="s" x="600" y="121" text-anchor="middle">survives node loss</text>
<text class="s" x="600" y="138" text-anchor="middle">Lustre / Weka</text>
<line x1="510" y1="60" x2="510" y2="170" stroke="#3fb950" stroke-width="4"/>
<rect class="box" x="20" y="200" width="160" height="64" rx="8"/>
<line x1="20" y1="200" x2="20" y2="264" stroke="#f0b429" stroke-width="4"/>
<text x="100" y="226" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">Lustre</text>
<text x="100" y="246" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">the classic parallel FS</text>
<rect class="box" x="192" y="200" width="160" height="64" rx="8"/>
<line x1="192" y1="200" x2="192" y2="264" stroke="#58a6ff" stroke-width="4"/>
<text x="272" y="226" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">WeKa</text>
<text x="272" y="246" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">fast, expensive, managed</text>
<rect class="box" x="364" y="200" width="160" height="64" rx="8"/>
<line x1="364" y1="200" x2="364" y2="264" stroke="#3fb950" stroke-width="4"/>
<text x="444" y="226" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">NVMe + copy-out</text>
<text x="444" y="246" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">the two-tier pattern above</text>
<rect class="box" x="536" y="200" width="160" height="64" rx="8"/>
<line x1="536" y1="200" x2="536" y2="264" stroke="#8a8a8a" stroke-width="4"/>
<text x="616" y="226" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">object store</text>
<text x="616" y="246" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">cheap, slow, fine for archives</text>
<text x="360" y="295" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">four options, one pattern: never let the durable tier stall the trainer</text>
</svg>