UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Small gaps in raw scores become big gaps in weights. Exponentiation amplifies differences.</text><text x='480' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Temperature scales the raw scores first: colder = sharper, hotter = flatter.</text></svg>