<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why the Kaplan scaling laws mattered"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Turned scaling from alchemy into engineering</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Budget by formula:</text><text x="232.016328125" y="94" font-size="13.5" fill="#a8a8a8">every major lab training plan from 2020 to 2022 cited these exponents.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Sample efficiency:</text><text x="223.55984375" y="125" font-size="13.5" fill="#a8a8a8">&quot;bigger models are more sample efficient&quot; justified huge models on scarce data.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">The prescription:</text><text x="215.20250000000001" y="156" font-size="13.5" fill="#a8a8a8">the 0.73 / 0.27 split is exactly what made the Chinchilla correction so shocking.</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">The field followed it:</text><text x="241.67937500000002" y="187" font-size="13.5" fill="#a8a8a8">for two years, until a better experiment reversed the data term.</text></svg>