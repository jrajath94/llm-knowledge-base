<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="sans-serif">
<rect width="800" height="350" fill="#ffffff"/>
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
</marker>
</defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Backpressure: Bounded Queue</text>
<rect x="50" y="100" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="120.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Producer</text>
<text x="120.0" y="148" text-anchor="middle" font-size="11" fill="#555">Fast</text>
<rect x="300" y="100" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="400.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Bounded Queue</text>
<text x="400.0" y="148" text-anchor="middle" font-size="11" fill="#555">Max 200</text>
<rect x="600" y="100" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="670.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Consumer</text>
<text x="670.0" y="148" text-anchor="middle" font-size="11" fill="#555">Slow: 100/s</text>
<line x1="190" y1="135" x2="300" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="500" y1="135" x2="600" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="300" y1="180" x2="190" y2="180" stroke="#d93025" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="245" y="205" text-anchor="middle" font-size="11" fill="#d93025">SLOW DOWN</text>
<text x="400" y="280" text-anchor="middle" font-size="12" fill="#555">Full queue signals the producer. Reject or block. Never grow unbounded.</text>
</svg>
