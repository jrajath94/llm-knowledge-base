<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="340" fill="#0d0d0d" rx="8"/>
  <text x="30" y="36" fill="#f0b429" font-size="15" font-weight="700">The registry: every model version, its artifacts, its stage, one rollback away</text>
  <!-- registry box -->
  <rect x="30" y="55" width="560" height="250" fill="#141414" stroke="#262626" rx="6"/>
  <text x="50" y="85" fill="#ececec" font-size="14" font-weight="700">model: fraud-scorer</text>
  <g font-size="12">
    <!-- header -->
    <g fill="#5a5a5a">
      <text x="50" y="115">version</text><text x="160" y="115">stage</text><text x="300" y="115">artifacts</text><text x="480" y="115">eval</text>
    </g>
    <!-- v4 staging -->
    <rect x="40" y="125" width="540" height="36" fill="#191510" stroke="#3a2f1a" rx="4"/>
    <text x="50" y="148" fill="#ececec">v4</text>
    <text x="160" y="148" fill="#f0b429">staging (canary)</text>
    <text x="300" y="148" fill="#a8a8a8">weights, config, data snap</text>
    <text x="480" y="148" fill="#a8a8a8">0.81</text>
    <!-- v3 production -->
    <rect x="40" y="167" width="540" height="36" fill="#14231f" stroke="#45b8ac" stroke-width="2" rx="4"/>
    <text x="50" y="190" fill="#ececec" font-weight="700">v3</text>
    <text x="160" y="190" fill="#45b8ac" font-weight="700">production</text>
    <text x="300" y="190" fill="#a8a8a8">weights, config, data snap</text>
    <text x="480" y="190" fill="#a8a8a8">0.79</text>
    <!-- v2 archived -->
    <rect x="40" y="209" width="540" height="36" fill="#101010" stroke="#262626" rx="4"/>
    <text x="50" y="232" fill="#8a8a8a">v2</text>
    <text x="160" y="232" fill="#8a8a8a">archived</text>
    <text x="300" y="232" fill="#8a8a8a">weights, config, data snap</text>
    <text x="480" y="232" fill="#8a8a8a">0.74</text>
    <!-- v1 archived -->
    <rect x="40" y="251" width="540" height="36" fill="#101010" stroke="#262626" rx="4"/>
    <text x="50" y="274" fill="#8a8a8a">v1</text>
    <text x="160" y="274" fill="#8a8a8a">archived</text>
    <text x="300" y="274" fill="#8a8a8a">weights, config, data snap</text>
    <text x="480" y="274" fill="#8a8a8a">0.70</text>
  </g>
  <!-- lineage arrows -->
  <line x1="610" y1="143" x2="700" y2="143" stroke="#f0b429" stroke-width="2" marker-end="url(#ar)"/>
  <text x="610" y="130" fill="#f0b429" font-size="12">promote: canary passes</text>
  <text x="610" y="162" fill="#a8a8a8" font-size="11">v4 becomes production,</text>
  <text x="610" y="178" fill="#a8a8a8" font-size="11">v3 becomes archived</text>
  <line x1="700" y1="250" x2="610" y2="250" stroke="#45b8ac" stroke-width="2" marker-end="url(#ag2)"/>
  <text x="610" y="238" fill="#45b8ac" font-size="12">rollback: one command</text>
  <text x="610" y="270" fill="#a8a8a8" font-size="11">v3 back to production</text>
  <text x="610" y="286" fill="#a8a8a8" font-size="11">in seconds, not a retrain</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
    <marker id="ag2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#45b8ac" stroke-width="1.6"/></marker>
  </defs>
</svg>
