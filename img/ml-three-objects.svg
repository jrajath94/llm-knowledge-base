<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="The three objects: dataset feeds fitting, fitting sets the model parameters, the model turns features into predictions, and error guides fitting">
  <style>
    .box { fill:#141414; stroke:#3a3a3a; stroke-width:1.5; }
    .t { fill:#ececec; font:700 15px Georgia, serif; }
    .s { fill:#a8a8a8; font:400 12.5px Georgia, serif; }
    .arr { stroke:#f0b429; stroke-width:2; fill:none; marker-end:url(#ah); }
    .arrb { stroke:#6cb2ff; stroke-width:1.6; fill:none; stroke-dasharray:6 5; marker-end:url(#ahb); }
    .lab { fill:#f0b429; font:600 12px Georgia, serif; }
    .labb { fill:#6cb2ff; font:600 12px Georgia, serif; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#f0b429"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#6cb2ff"/>
    </marker>
  </defs>

  <!-- Dataset -->
  <rect class="box" x="10" y="70" width="150" height="110" rx="8"/>
  <text class="t" x="85" y="96" text-anchor="middle">Dataset</text>
  <text class="s" x="85" y="120" text-anchor="middle">examples: the rows</text>
  <text class="s" x="85" y="140" text-anchor="middle">features: the inputs</text>
  <text class="s" x="85" y="160" text-anchor="middle">labels: the answers</text>

  <!-- Fitting -->
  <rect class="box" x="215" y="70" width="150" height="110" rx="8"/>
  <text class="t" x="290" y="96" text-anchor="middle">Fitting</text>
  <text class="s" x="290" y="120" text-anchor="middle">turn the knobs until</text>
  <text class="s" x="290" y="140" text-anchor="middle">predictions match</text>
  <text class="s" x="290" y="160" text-anchor="middle">the labels</text>

  <!-- Model -->
  <rect class="box" x="420" y="70" width="150" height="110" rx="8"/>
  <text class="t" x="495" y="96" text-anchor="middle">Model</text>
  <text class="s" x="495" y="120" text-anchor="middle">parameters w: the knobs</text>
  <text class="s" x="495" y="140" text-anchor="middle">features in,</text>
  <text class="s" x="495" y="160" text-anchor="middle">prediction out</text>

  <!-- Error -->
  <rect class="box" x="600" y="30" width="110" height="90" rx="8"/>
  <text class="t" x="655" y="56" text-anchor="middle">Error</text>
  <text class="s" x="655" y="78" text-anchor="middle">prediction</text>
  <text class="s" x="655" y="96" text-anchor="middle">vs label</text>

  <!-- Arrows -->
  <line class="arr" x1="162" y1="125" x2="210" y2="125"/>
  <text class="lab" x="186" y="115" text-anchor="middle">fit</text>

  <line class="arr" x1="367" y1="125" x2="415" y2="125"/>
  <text class="lab" x="391" y="115" text-anchor="middle">set</text>

  <line class="arr" x1="495" y1="180" x2="495" y2="216"/>
  <text class="lab" x="560" y="205">predict</text>

  <line class="arr" x1="572" y1="125" x2="596" y2="95"/>
  <text class="lab" x="596" y="140">score</text>

  <!-- Feedback -->
  <path class="arrb" d="M 600 100 C 560 40, 380 30, 300 66"/>
  <text class="labb" x="430" y="34">error guides the search</text>

  <text class="s" x="360" y="242" text-anchor="middle">Fitting promises small error on the data shown. Generalization is performance on data never shown.</text>
</svg>
