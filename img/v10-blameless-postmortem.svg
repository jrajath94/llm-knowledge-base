<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 238" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why &quot;blameless&quot; is load-bearing: it decides what happens next time"><rect x="22" y="14" width="435.0" height="210" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BLAME THE ENGINEER</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">The incident was someone&#x27;s fault</text><circle cx="44" cy="83.5" r="3.2" fill="#e07878"/><text x="56" y="88" font-size="13.5" fill="#a8a8a8">Engineers hide near-misses</text><circle cx="44" cy="109.5" r="3.2" fill="#e07878"/><text x="56" y="114" font-size="13.5" fill="#a8a8a8">the next index rebuild happens quietly at</text><text x="56" y="132" font-size="13.5" fill="#a8a8a8">midnight</text><circle cx="44" cy="153.5" r="3.2" fill="#e07878"/><text x="56" y="158" font-size="13.5" fill="#a8a8a8">no validation at all</text><circle cx="44" cy="179.5" r="3.2" fill="#e07878"/><text x="56" y="184" font-size="13.5" fill="#a8a8a8">same incident next quarter</text><rect x="503.0" y="14" width="435.0" height="210" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">BLAME THE SYSTEM</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">The incident was a system that allowed</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">it</text><circle cx="525.0" cy="103.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="108" font-size="13.5" fill="#a8a8a8">Engineers report near-misses</text><circle cx="525.0" cy="129.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="134" font-size="13.5" fill="#a8a8a8">the fix targets the validation gap</text><circle cx="525.0" cy="155.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="160" font-size="13.5" fill="#a8a8a8">every action item gets an owner and a date</text><circle cx="525.0" cy="181.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="186" font-size="13.5" fill="#a8a8a8">or the postmortem was theater</text><line x1="467.0" y1="119.0" x2="487.0" y2="119.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,114.0 495.0,119.0 487.0,124.0" fill="#a8a8a8"/></svg>