<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Labeled rows showing every field stored in a per-request trace"><rect x="22" y="14" width="916" height="392" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 9</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Anatomy of a trace: one request, fully recorded</text><rect x="38" y="96" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="118" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">prompt</text><text x="260" y="118" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">the exact user input text</text><rect x="38" y="136" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="158" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">retrieved passages</text><text x="260" y="158" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">3 chunks with document ids and scores</text><rect x="38" y="176" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="198" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">tool calls</text><text x="260" y="198" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">2 calls with arguments and results</text><rect x="38" y="216" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="238" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">model version</text><text x="260" y="238" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">v4, pinned at request time</text><rect x="38" y="256" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="278" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">sampler settings</text><text x="260" y="278" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">temperature 0.2, top-p 0.9, seed 7</text><rect x="38" y="296" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="318" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">tokens</text><text x="260" y="318" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">in 412 / out 188</text><rect x="38" y="336" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="358" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">outcome</text><text x="260" y="358" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">answer shown, no guardrail trip</text><rect x="38" y="376" width="884" height="34" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="54" y="398" font-size="13" font-weight="700" fill="#f0b429" text-anchor="start">latency</text><text x="260" y="398" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">p50 1.2s, p99 3.8s for this request</text></svg>