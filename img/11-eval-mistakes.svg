<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Four classic eval mistakes">
<rect x="14" y="12" width="932" height="406" rx="10" fill="#141414" stroke="#2e2e2e"/>
<text x="32" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">EVAL POSTMORTEMS</text>
<text x="32" y="72" font-size="16" font-weight="700" fill="#ececec">Four mistakes, all cheap to prevent</text>
<rect x="32" y="92" width="212" height="306" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="46" y="122" font-size="11.5" font-weight="700" letter-spacing="1.0" fill="#e8b34b">1. MULTIPLE COMPARISONS</text>
<text x="46" y="152" font-size="12.5" fill="#a8a8a8">Test 20 metrics:</text>
<text x="46" y="173" font-size="12.5" fill="#a8a8a8">one looks significant</text>
<text x="46" y="194" font-size="12.5" fill="#a8a8a8">by luck at 5%.</text>
<text x="46" y="215" font-size="12.5" fill="#a8a8a8">Fix: Bonferroni correction.</text>
<rect x="260" y="92" width="212" height="306" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="274" y="122" font-size="11.5" font-weight="700" letter-spacing="1.0" fill="#e8b34b">2. TEST-SET OVERFITTING</text>
<text x="274" y="152" font-size="12.5" fill="#a8a8a8">Tune the prompt on the</text>
<text x="274" y="173" font-size="12.5" fill="#a8a8a8">same 60 questions</text>
<text x="274" y="194" font-size="12.5" fill="#a8a8a8">you report on.</text>
<text x="274" y="215" font-size="12.5" fill="#a8a8a8">Fix: keep a hold-out set.</text>
<rect x="488" y="92" width="212" height="306" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="502" y="122" font-size="11.5" font-weight="700" letter-spacing="1.0" fill="#e8b34b">3. JUDGE SHOPPING</text>
<text x="502" y="152" font-size="12.5" fill="#a8a8a8">An LLM judge can favor</text>
<text x="502" y="173" font-size="12.5" fill="#a8a8a8">long answers, its own</text>
<text x="502" y="194" font-size="12.5" fill="#a8a8a8">style, or second place.</text>
<text x="502" y="215" font-size="12.5" fill="#a8a8a8">Fix: calibrate it first.</text>
<rect x="716" y="92" width="212" height="306" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="730" y="122" font-size="11.5" font-weight="700" letter-spacing="1.0" fill="#e8b34b">4. CLUSTER STRUCTURE</text>
<text x="730" y="152" font-size="12.5" fill="#a8a8a8">Five ratings share one</text>
<text x="730" y="173" font-size="12.5" fill="#a8a8a8">prompt and one judge.</text>
<text x="730" y="194" font-size="12.5" fill="#a8a8a8">Not independent.</text>
<text x="730" y="215" font-size="12.5" fill="#a8a8a8">Fix: resample by prompt.</text>
</svg>
