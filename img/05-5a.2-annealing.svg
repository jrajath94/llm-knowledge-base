<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 480' role='img'><rect x='0' y='0' width='880' height='480' fill='#0d0d0d' rx='8'/><text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Annealing: a short second phase on the best data</text><text x='24' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#8a8a8a'>also called mid-training. the learning rate decays to zero here</text><line x1='90' y1='380' x2='790' y2='380' stroke='#4a4a4a' stroke-width='2'/><line x1='90' y1='380' x2='90' y2='120' stroke='#4a4a4a' stroke-width='2'/><text x='440.0' y='420' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>training steps</text><text x='46' y='250.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>learning rate</text><line x1='90' y1='180' x2='594.0' y2='180' stroke='#6cb2ff' stroke-width='3'/><polyline points='594.0,180 598,180 602,181 606,182 610,183 614,185 618,187 621,190 625,192 629,196 633,199 637,203 641,207 645,212 649,216 653,221 657,226 661,232 665,237 668,243 672,249 676,255 680,261 684,267 688,274 692,280 696,286 700,293 704,299 708,305 712,311 716,317 719,323 723,328 727,334 731,339 735,344 739,348 743,353 747,357 751,361 755,364 759,368 763,370 766,373 770,375 774,377 778,378 782,379 786,380 790,380' fill='none' stroke='#f0b429' stroke-width='3'/><line x1='594.0' y1='380' x2='594.0' y2='120' stroke='#e57373' stroke-width='2' stroke-dasharray='8,5'/><text x='342.0' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#6cb2ff' text-anchor='middle'>phase 1: pre-training</text><text x='342.0' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#8a8a8a' text-anchor='middle'>full web mixture, high LR</text><text x='692.0' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#f0b429' text-anchor='middle'>phase 2: annealing</text><text x='692.0' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#8a8a8a' text-anchor='middle'>curated data, LR to zero</text><text x='40' y='450' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Annealing also soaks up high-quality QA pairs, which is where contamination sneaks in.</text></svg>