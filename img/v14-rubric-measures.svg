<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 192" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="What the research-communication rubric actually measures"><rect x="22" y="14" width="435.0" height="164" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">YOUR PAPERS PROVE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">You can do the work</text><circle cx="44" cy="83.5" r="3.2" fill="#6cb2ff"/><text x="56" y="88" font-size="13.5" fill="#a8a8a8">derivations, experiments, results</text><circle cx="44" cy="109.5" r="3.2" fill="#6cb2ff"/><text x="56" y="114" font-size="13.5" fill="#a8a8a8">technical depth on one topic</text><rect x="503.0" y="14" width="435.0" height="164" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">HOW YOU TALK PROVES</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">You can do it with other people</text><circle cx="525.0" cy="83.5" r="3.2" fill="#f0b429"/><text x="537.0" y="88" font-size="13.5" fill="#a8a8a8">repeatedly, when things go wrong</text><circle cx="525.0" cy="109.5" r="3.2" fill="#f0b429"/><text x="537.0" y="114" font-size="13.5" fill="#a8a8a8">projects, failures, conflicts, decisions</text><circle cx="525.0" cy="135.5" r="3.2" fill="#f0b429"/><text x="537.0" y="140" font-size="13.5" fill="#a8a8a8">that is what differentiates</text><line x1="467.0" y1="96.0" x2="487.0" y2="96.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,91.0 495.0,96.0 487.0,101.0" fill="#a8a8a8"/></svg>