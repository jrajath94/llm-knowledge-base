<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 600" role="img" aria-label="Monotonic stack: keep heights increasing">
<rect width="900" height="600" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Monotonic stack: keep heights increasing</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">A new bar pops every taller bar before it. Each bar is pushed once and popped once.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<rect x="110" y="214" width="40" height="28" fill="#1c1c1c" stroke="#3a3a3a"/>
<text x="130" y="260" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">0</text>
<rect x="162" y="228" width="40" height="14" fill="#1c1c1c" stroke="#3a3a3a"/>
<text x="182" y="260" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">1</text>
<rect x="214" y="172" width="40" height="70" fill="#1c1c1c" stroke="#3a3a3a"/>
<text x="234" y="260" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">2</text>
<rect x="266" y="158" width="40" height="84" fill="#1c1c1c" stroke="#3a3a3a"/>
<text x="286" y="260" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">3</text>
<rect x="318" y="214" width="40" height="28" fill="#1c1c1c" stroke="#3a3a3a"/>
<text x="338" y="260" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">4</text>
<rect x="370" y="200" width="40" height="42" fill="#1c1c1c" stroke="#3a3a3a"/>
<text x="390" y="260" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">5</text>
<text x="40" y="152" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bars</text>
<text x="40" y="286" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">stack after each bar (bottom to top)</text>
<text x="40" y="316" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bar 0 (h=2)</text>
<rect x="200" y="292" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="232" y="315" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">0:2</text>
<text x="560" y="315" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">stack empty: push 0</text>
<text x="40" y="374" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bar 1 (h=1)</text>
<rect x="200" y="350" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="232" y="373" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">1:1</text>
<text x="560" y="373" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">pop 0 (2 &gt; 1): push 1</text>
<text x="40" y="432" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bar 2 (h=5)</text>
<rect x="200" y="408" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="232" y="431" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">1:1</text>
<rect x="272" y="408" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="304" y="431" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">2:5</text>
<text x="560" y="431" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">1 &lt; 5: push 2</text>
<text x="40" y="490" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bar 3 (h=6)</text>
<rect x="200" y="466" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="232" y="489" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">1:1</text>
<rect x="272" y="466" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="304" y="489" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">2:5</text>
<rect x="344" y="466" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="376" y="489" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">3:6</text>
<text x="560" y="489" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">5 &lt; 6: push 3</text>
<text x="40" y="548" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bar 4 (h=2)</text>
<rect x="200" y="524" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="232" y="547" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">1:1</text>
<rect x="272" y="524" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="304" y="547" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">4:2</text>
<text x="560" y="547" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">pop 3 (6 &gt; 2), pop 2 (5 &gt; 2): push 4</text>
<text x="40" y="606" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bar 5 (h=3)</text>
<rect x="200" y="582" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="232" y="605" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">1:1</text>
<rect x="272" y="582" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="304" y="605" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">4:2</text>
<rect x="344" y="582" width="64" height="36" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="376" y="605" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">5:3</text>
<text x="560" y="605" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">2 &lt; 3: push 5</text>
</svg>
