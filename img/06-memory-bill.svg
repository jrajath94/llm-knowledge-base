<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The 7B training bill: 16 bytes per parameter</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">BF16 weights + BF16 gradients + FP32 master copy + Adam m + Adam v</text>
<rect x="60" y="110" width="110" height="70" fill="#6cb2ff" rx="4"/>
<text x="115" y="140" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">weights</text>
<text x="115" y="162" font-size="14" fill="#0d0d0d" text-anchor="middle">2 bytes</text>
<rect x="170" y="110" width="110" height="70" fill="#7dd87d" rx="4"/>
<text x="225" y="140" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">gradients</text>
<text x="225" y="162" font-size="14" fill="#0d0d0d" text-anchor="middle">2 bytes</text>
<rect x="280" y="110" width="220" height="70" fill="#f0b429" rx="4"/>
<text x="390" y="140" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">master weights (FP32)</text>
<text x="390" y="162" font-size="14" fill="#0d0d0d" text-anchor="middle">4 bytes</text>
<rect x="500" y="110" width="220" height="70" fill="#e06c75" rx="4"/>
<text x="610" y="140" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">Adam m (FP32)</text>
<text x="610" y="162" font-size="14" fill="#0d0d0d" text-anchor="middle">4 bytes</text>
<rect x="720" y="110" width="110" height="70" fill="#b48ce8" rx="4"/>
<text x="775" y="140" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">Adam v</text>
<text x="775" y="162" font-size="14" fill="#0d0d0d" text-anchor="middle">4 bytes</text>
<line x1="280" y1="200" x2="280" y2="230" stroke="#f0b429" stroke-width="2"/>
<line x1="830" y1="200" x2="830" y2="230" stroke="#f0b429" stroke-width="2"/>
<line x1="280" y1="215" x2="830" y2="215" stroke="#f0b429" stroke-width="2"/>
<text x="555" y="250" font-size="13" fill="#f0b429" text-anchor="middle">ZeRO-1 shards these 12 bytes: the first and biggest win</text>
<text x="60" y="300" font-size="15" fill="#ececec">7B parameters x 16 bytes = <tspan font-weight="bold">112 GB</tspan> per GPU before a single activation</text>
<text x="60" y="330" font-size="13" fill="#8a8a8a">Inference needs only the 2-byte weights: 14 GB. Training needs all five piles at once.</text>
<text x="24" y="390" font-size="13" fill="#f0b429">Rule of thumb: when memory runs out, the optimizer states are the first suspect, not the weights.</text>
</svg>