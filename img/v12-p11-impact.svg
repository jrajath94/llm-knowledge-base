<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why LLaMA mattered"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Democratized LLM research within weeks of the weights leaking</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Consumer hardware:</text><text x="243.554609375" y="94" font-size="13.5" fill="#a8a8a8">a 7B model fit on one GPU: Alpaca, Vicuna, and LoRA fine-tuning exploded.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Default architecture:</text><text x="244.33296875000002" y="125" font-size="13.5" fill="#a8a8a8">every open model since is a LLaMA block with variations.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Data quality:</text><text x="183.5703125" y="156" font-size="13.5" fill="#a8a8a8">proved data quality beats data quantity.</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">Overtraining:</text><text x="186.54875" y="187" font-size="13.5" fill="#a8a8a8">made &quot;overtrain small models&quot; standard practice for anything served at scale.</text></svg>