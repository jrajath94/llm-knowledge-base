<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='100%' role='img'><rect x='0' y='0' width='960' height='440' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>BPE, seen as a merge timeline</text><line x1='60' y1='300' x2='900' y2='300' stroke='#3a3a3a' stroke-width='3'/><circle cx='60.0' cy='300' r='7' fill='#f0b429'/><text x='60.0' y='328' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>0</text><text x='60.0' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>characters only</text><circle cx='191.25' cy='300' r='7' fill='#f0b429'/><text x='191.25' y='328' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>5k</text><text x='191.25' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>letters combine</text><circle cx='322.5' cy='300' r='7' fill='#f0b429'/><text x='322.5' y='328' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>10k</text><text x='322.5' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>subwords emerge</text><circle cx='453.75' cy='300' r='7' fill='#f0b429'/><text x='453.75' y='328' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>15k</text><text x='453.75' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>whole words win</text><circle cx='585.0' cy='300' r='7' fill='#f0b429'/><text x='585.0' y='328' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>20k</text><text x='585.0' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>suffixes appear</text><circle cx='900.0' cy='300' r='7' fill='#f0b429'/><text x='900.0' y='328' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>32k</text><text x='900.0' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>stop</text><line x1='60.02625' y1='294' x2='60.02625' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='60.1575' y1='294' x2='60.1575' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='62.625' y1='294' x2='62.625' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='73.125' y1='294' x2='73.125' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='86.25' y1='294' x2='86.25' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='138.75' y1='294' x2='138.75' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='191.25' y1='294' x2='191.25' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='322.5' y1='294' x2='322.5' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='585.0' y1='294' x2='585.0' y2='274' stroke='#4db6ac' stroke-width='2'/><line x1='847.5' y1='294' x2='847.5' y2='274' stroke='#4db6ac' stroke-width='2'/><text x='480' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#4db6ac' text-anchor='middle'>Merge #1: 7  |  #100: 8  |  #1000: 26  |  #5000: 137  |  #10000: 324  |  #20000: 652  |  #30000: 978</text><text x='480' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>counts of the top merge on the training corpus. Run the lab: reproduce these gates yourself.</text><text x='480' y='408' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>BPE is deterministic given the corpus and the merge order. Same input, same tokens, every time.</text></svg>