<text class="lbl" x="24" y="216">Slot 3</text>
<rect x="150" y="192" width="62" height="36" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="181" y="216" text-anchor="middle" fill="#101010">D</text>
<rect x="218" y="192" width="62" height="36" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="249" y="216" text-anchor="middle" fill="#101010">D</text>
<rect x="286" y="192" width="62" height="36" rx="5" fill="#7fc97f" opacity="0.85"/>
