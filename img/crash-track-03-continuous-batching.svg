<text class="lbl" x="525" y="82" text-anchor="middle">t6</text>
<text class="lbl" x="593" y="82" text-anchor="middle">t7</text>
<text class="lbl" x="24" y="120">Slot 1</text>
<rect x="150" y="96" width="62" height="36" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="181" y="120" text-anchor="middle" fill="#101010">A</text>
