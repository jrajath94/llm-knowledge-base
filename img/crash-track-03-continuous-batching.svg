<rect x="490" y="240" width="62" height="36" rx="5" fill="#e57373" opacity="0.85"/>
<text class="cell" x="521" y="264" text-anchor="middle" fill="#101010">G</text>
<rect x="558" y="240" width="62" height="36" rx="5" fill="#e57373" opacity="0.85"/>
<text class="cell" x="589" y="264" text-anchor="middle" fill="#101010">G</text>
<rect class="box" x="24" y="300" width="632" height="76" rx="8"/>
<text class="m" x="40" y="326">Slot 1: request A finishes at t3, request B enters at t4. No waiting for the batch.</text>
<text class="m" x="40" y="348">Slot 3: three short requests share one slot across the same seven steps.</text>
<text class="m" x="40" y="368">Slot 4: idle at t1, then request G starts immediately. Idle time is the enemy.</text>
</svg>
