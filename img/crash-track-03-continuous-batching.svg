<text class="cell" x="249" y="168" text-anchor="middle" fill="#101010">C</text>
<rect x="286" y="144" width="62" height="36" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="317" y="168" text-anchor="middle" fill="#101010">C</text>
<rect x="354" y="144" width="62" height="36" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="385" y="168" text-anchor="middle" fill="#101010">C</text>
