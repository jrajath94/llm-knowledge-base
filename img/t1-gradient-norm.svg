<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 401" role="img" aria-label="Gradient norm: the second signal (it often moves first)">
<rect width="900" height="401" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Gradient norm: the second signal (it often moves first)</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Loss is the first signal. Log the gradient norm every step.</text>
<rect x="40.0" y="79.0" width="820.0" height="64.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="60.0" y="107.0" text-anchor="start" fill="#2dd4bf" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Healthy</text>
<text x="60.0" y="127.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Smooth decay, occasional small bumps. Nothing to do.</text>
<rect x="40.0" y="151.0" width="820.0" height="64.0" rx="6" fill="#111111" stroke="#ff9f43" stroke-width="1.5"/>
<text x="60.0" y="179.0" text-anchor="start" fill="#ff9f43" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">About to spike</text>
<text x="60.0" y="199.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Norm jumps 10x or more a few steps BEFORE the loss jumps. Early warning: investigate now.</text>
<rect x="40.0" y="223.0" width="820.0" height="64.0" rx="6" fill="#111111" stroke="#e5484d" stroke-width="1.5"/>
<text x="60.0" y="251.0" text-anchor="start" fill="#e5484d" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">About to NaN</text>
<text x="60.0" y="271.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Norm explodes to Inf. The next checkpoint is your last good one. Save it.</text>
<rect x="40.0" y="295.0" width="820.0" height="64.0" rx="6" fill="#111111" stroke="#b388ff" stroke-width="1.5"/>
<text x="60.0" y="323.0" text-anchor="start" fill="#b388ff" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vanishing</text>
<text x="60.0" y="343.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Norm collapses toward zero while loss plateaus. The model stopped learning: check the LR, check for</text>
<text x="60.0" y="357.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">frozen parameters.</text>
</svg>
