<svg xmlns="http://www.w3.org/2000/svg" width="720" height="329" viewBox="0 0 720 329" role="img" aria-label="Content filter precision-recall tradeoff">
<rect width="720" height="329" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The threshold is a product decision, not a math fact</text>
<rect class="box" x="60" y="60" width="280" height="130" rx="8"/>
<line x1="60" y1="60" x2="60" y2="190" stroke="#e5484d" stroke-width="4"/>
<text x="200" y="92" text-anchor="middle" fill="#e5484d" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">strict (high bar)</text>
<text x="200" y="120" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">blocks most harm</text>
<text x="200" y="142" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">blocks too much benign</text>
<text x="200" y="162" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">users complain, product suffers</text>
<rect class="box" x="380" y="60" width="280" height="130" rx="8"/>
<line x1="380" y1="60" x2="380" y2="190" stroke="#58a6ff" stroke-width="4"/>
<text x="520" y="92" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">loose (low bar)</text>
<text x="520" y="120" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">rarely blocks benign</text>
<text x="520" y="142" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">misses some harm</text>
<text x="520" y="162" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">harm ships</text>
<text x="360" y="230" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">set per category by risk:</text>
<text x="360" y="256" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">self-harm, weapons: strict  |  spam: balanced</text>
<text x="360" y="282" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">measure like any component: precision and recall on a labeled set,</text>
<text x="360" y="304" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">latency added, false-positive rate on real traffic</text>
</svg>