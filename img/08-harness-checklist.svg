<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="660" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The reproducible harness checklist</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Six items; without them the number is not reproducible</text>
<rect x="24" y="94" width="852" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="126" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="start">1. Warmup</text>
<text x="48" y="150" font-size="11" fill="#a8a8a8" text-anchor="start">discard the first N requests; cold kernels and cold caches are not steady state</text>
<rect x="24" y="178" width="852" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="210" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="start">2. Fixed workload</text>
<text x="48" y="234" font-size="11" fill="#a8a8a8" text-anchor="start">same prompts, same input/output lengths; never compare tokens/s across different sequence lengths</text>
<rect x="24" y="262" width="852" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="294" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="start">3. Fixed sampler and seed</text>
<text x="48" y="318" font-size="11" fill="#a8a8a8" text-anchor="start">Chapter 1: greedy and a fixed seed for evals</text>
<rect x="24" y="346" width="852" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="378" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="start">4. Report the setup</text>
<text x="48" y="402" font-size="11" fill="#a8a8a8" text-anchor="start">GPU type and count, batch size, precision, prompt lengths, concurrency</text>
<rect x="24" y="430" width="852" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="462" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="start">5. Measure the system, not the client</text>
<text x="48" y="486" font-size="11" fill="#a8a8a8" text-anchor="start">load generators must not be the bottleneck; watch client-side queueing</text>
<rect x="24" y="514" width="852" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="546" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="start">6. Steady state</text>
<text x="48" y="570" font-size="11" fill="#a8a8a8" text-anchor="start">run long enough that the scheduler&#x27;s queues stabilize</text>
</svg>