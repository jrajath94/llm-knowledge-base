<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.1. RAG vs fine-tune vs prompt-only</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">the knowledge question decides</text>
<rect x="24" y="110" width="400" height="130" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">RAG</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">knowledge changes, citations required, corpus exists;</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">retrieval keeps answers fresh without retraining</text>
<rect x="456" y="110" width="400" height="130" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">FINE-TUNE</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">stable knowledge, style and format matter, the</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">behavior must be baked in</text>
<rect x="240" y="280" width="400" height="130" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="306" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">PROMPT-ONLY</text>
<text x="440.0" y="324" font-size="11" fill="#a8a8a8" text-anchor="middle">the model already knows it; instructions and examples</text>
<text x="440.0" y="339" font-size="11" fill="#a8a8a8" text-anchor="middle">suffice</text>
<rect x="24" y="450" width="832" height="70" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="476" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE COMBO</text>
<text x="440.0" y="494" font-size="11" fill="#a8a8a8" text-anchor="middle">RAG + fine-tune is common: retrieval for facts, tuning for behavior</text>
<text x="24" y="492" font-size="12" fill="#a8a8a8" text-anchor="start">Default to RAG when the answer must cite something newer than the model.</text>
</svg>