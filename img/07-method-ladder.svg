<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="DejaVu Sans, sans-serif">
<defs><style>.t{font-size:13px;fill:#1a3a5c;font-weight:bold}.b{font-size:11.5px;fill:#333333}.s{font-size:10.5px;fill:#555555}.box{fill:#f4f7fa;stroke:#1a3a5c;stroke-width:1.5;rx:8}.box2{fill:#eef6f3;stroke:#2a9d8f;stroke-width:1.5;rx:8}.box3{fill:#fdf3ec;stroke:#e76f51;stroke-width:1.5;rx:8}.arr{stroke:#1a3a5c;stroke-width:2;fill:none;marker-end:url(#ah)}</style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/></marker></defs>
<text x="400" y="30" text-anchor="middle" class="t" font-size="15">Which method, when</text>
<rect x="120" y="60" width="560" height="86" class="box"/>
<text x="200" y="110" text-anchor="middle" class="t" font-size="14">SFT</text>
<text x="470" y="92" text-anchor="middle" class="b">Teach the format and the</text>
<text x="470" y="112" text-anchor="middle" class="b">task shape. Needs demos.</text>
<text x="470" y="132" text-anchor="middle" class="b">Use first, always.</text>
<rect x="120" y="160" width="560" height="86" class="box2"/>
<text x="200" y="210" text-anchor="middle" class="t" font-size="14">DPO</text>
<text x="470" y="192" text-anchor="middle" class="b">Teach pairwise preference.</text>
<text x="470" y="212" text-anchor="middle" class="b">Needs chosen/rejected pairs.</text>
<text x="470" y="232" text-anchor="middle" class="b">Use when RL is overkill.</text>
<rect x="120" y="260" width="560" height="86" class="box"/>
<text x="200" y="310" text-anchor="middle" class="t" font-size="14">PPO / RLHF</text>
<text x="470" y="292" text-anchor="middle" class="b">Optimize a learned reward.</text>
<text x="470" y="312" text-anchor="middle" class="b">Needs a reward model.</text>
<text x="470" y="332" text-anchor="middle" class="b">Use for open-ended quality.</text>
<rect x="120" y="360" width="560" height="86" class="box3"/>
<text x="200" y="410" text-anchor="middle" class="t" font-size="14">GRPO / RLVR</text>
<text x="470" y="392" text-anchor="middle" class="b">Optimize a checkable reward.</text>
<text x="470" y="412" text-anchor="middle" class="b">Needs verifiers, not judges.</text>
<text x="470" y="432" text-anchor="middle" class="b">Use for math, code, tools.</text>
</svg>
