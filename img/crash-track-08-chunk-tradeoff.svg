<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230">
<rect width="590" height="230" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Chunk size: precision vs context</text><text x='90' y='80' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>256 tokens</text><text x='300' y='80' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='middle'>512 + 64 overlap</text><text x='500' y='80' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='middle'>1024 tokens</text><rect x='40' y='100' width='100' height='26' rx='13' fill='#f0b429' opacity='0.7'/><rect x='250' y='100' width='100' height='26' rx='13' fill='#7bc98a' opacity='0.7'/><rect x='450' y='100' width='100' height='26' rx='13' fill='#e57ea6' opacity='0.7'/><text x='90' y='150' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>precise, may miss setup</text><text x='300' y='150' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>start here</text><text x='500' y='150' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>context, blurry match</text><text x='20' y='200' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Change chunking only on eval evidence: re-chunking re-embeds the whole corpus.</text></svg>