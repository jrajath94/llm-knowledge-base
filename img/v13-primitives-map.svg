<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The primitives every ML system sits on"><rect x="22" y="14" width="916" height="300" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">APPENDIX 13A</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Older than ML, load-bearing under all of it</text><rect x="38" y="96" width="212.43229374999999" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="58" y="123" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Consistent hashing</text><text x="54" y="144" font-size="12" fill="#a8a8a8">how keys find servers</text><text x="54" y="160" font-size="12" fill="#a8a8a8">without reshuffling the</text><text x="54" y="176" font-size="12" fill="#a8a8a8">world</text><line x1="260.43229375" y1="144.0" x2="274.43229375" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="274.43229375,139.0 282.43229375,144.0 274.43229375,149.0" fill="#a8a8a8"/><rect x="290.43229375" y="96" width="225.77035" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="310.43229375" cy="118" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="310.43229375" y="123" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">2</text><text x="330.43229375" y="123" font-size="13.5" font-weight="700" fill="#ececec">Delivery semantics</text><text x="306.43229375" y="144" font-size="12" fill="#a8a8a8">what &quot;exactly once&quot; really</text><text x="306.43229375" y="160" font-size="12" fill="#a8a8a8">means, and idempotency</text><line x1="526.20264375" y1="144.0" x2="540.20264375" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="540.20264375,139.0 548.20264375,144.0 540.20264375,149.0" fill="#a8a8a8"/><rect x="556.20264375" y="96" width="226.98501249999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="576.20264375" cy="118" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="576.20264375" y="123" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">3</text><text x="596.20264375" y="123" font-size="13.5" font-weight="700" fill="#ececec">Backpressure</text><text x="572.20264375" y="144" font-size="12" fill="#a8a8a8">what happens when a fast</text><text x="572.20264375" y="160" font-size="12" fill="#a8a8a8">producer meets a slow</text><text x="572.20264375" y="176" font-size="12" fill="#a8a8a8">consumer</text><rect x="38" y="216" width="236.06511249999997" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="238" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="58" y="243" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">4</text><text x="78" y="243" font-size="13.5" font-weight="700" fill="#ececec">Fair scheduling</text><text x="54" y="264" font-size="12" fill="#a8a8a8">how tenants share one</text><text x="54" y="280" font-size="12" fill="#a8a8a8">system, and how messages</text><text x="54" y="296" font-size="12" fill="#a8a8a8">stay ordered</text></svg>