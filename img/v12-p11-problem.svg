<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 11: the problem LLaMA solved"><rect x="22" y="14" width="435.0" height="202" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">The best models were closed; open</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">models lagged badly</text><circle cx="44" cy="103.5" r="3.2" fill="#e07878"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">GPT-3, Chinchilla, PaLM: closed weights</text><circle cx="44" cy="129.5" r="3.2" fill="#e07878"/><text x="56" y="134" font-size="13.5" fill="#a8a8a8">the few good open models needed data centers</text><text x="56" y="152" font-size="13.5" fill="#a8a8a8">to run</text><circle cx="44" cy="173.5" r="3.2" fill="#e07878"/><text x="56" y="178" font-size="13.5" fill="#a8a8a8">research outside the big labs was starving</text><rect x="503.0" y="14" width="435.0" height="202" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">Can a smaller model, trained on far</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">more tokens than Chinchilla prescribes,</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">match or beat the giants?</text><line x1="467.0" y1="115.0" x2="487.0" y2="115.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,110.0 495.0,115.0 487.0,120.0" fill="#a8a8a8"/></svg>