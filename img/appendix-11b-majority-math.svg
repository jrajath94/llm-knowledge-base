<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Diagram of majority vote math: 75 percent individual accuracy gives 84 percent majority accuracy; 60 percent gives only 64.8 percent.">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Majority vote: the binomial math</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">75% individual accuracy becomes 84% majority accuracy, if errors stay independent.</text>
<rect x="90" y="100" width="620" height="150" rx="10" fill="#161616" stroke="#7fd08a" stroke-width="2"/>
<text x="120" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#ececec">Each labeler right 75% of the time</text>
<text x="120" y="168" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#a8a8a8">3 x 0.75^2 x 0.25 + 0.75^3 = 0.84375</text>
<text x="120" y="204" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#7fd08a">Majority right ~84%</text>
<rect x="90" y="270" width="620" height="150" rx="10" fill="#161616" stroke="#e67e7e" stroke-width="2"/>
<text x="120" y="306" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#ececec">Each labeler right 60% of the time</text>
<text x="120" y="338" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#a8a8a8">3 x 0.60^2 x 0.40 + 0.60^3 = 0.648</text>
<text x="120" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#e67e7e">Majority right ~65%</text>
<text x="400" y="480" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">The majority is correct when at least 2 of 3 labelers are correct.</text>
<text x="400" y="508" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Majority vote amplifies a decent signal. It does not rescue a weak one.</text>
</svg>