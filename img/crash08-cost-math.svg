<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.4. Cost math: 2000 in + 500 out at $2.50/$10 per M = $0.01 per request</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">price the request before promising the budget</text>
<text x="440" y="140" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">2000/1M x $2.50 + 500/1M x $10.00</text>
<text x="440" y="175" font-size="15" font-weight="bold" fill="#f0b429" text-anchor="middle">= $0.005 + $0.005 = $0.01 per request</text>
<line x1="90" y1="210" x2="790" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="24" y="250" width="400" height="100" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="276" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INPUT TOKENS</text>
<text x="224.0" y="294" font-size="11" fill="#a8a8a8" text-anchor="middle">system + tools + chunks + few-shot + history: usually</text>
<text x="224.0" y="309" font-size="11" fill="#a8a8a8" text-anchor="middle">the larger term</text>
<rect x="456" y="250" width="400" height="100" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="276" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">OUTPUT TOKENS</text>
<text x="656.0" y="294" font-size="11" fill="#a8a8a8" text-anchor="middle">priced 4x here; long answers dominate the bill</text>
<text x="24" y="430" font-size="12" fill="#a8a8a8" text-anchor="start">Then divide by the success rate for cost per success, and multiply by the cascade mix. The $0.01 is the floor,</text>
<text x="24" y="448" font-size="12" fill="#a8a8a8" text-anchor="start">not the quote.</text>
</svg>