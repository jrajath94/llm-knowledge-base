<text x="486.8" y="362" font-size="12" fill="#6cb2ff" text-anchor="middle">production (the long tail)</text>
<text x="24" y="420" font-size="12" fill="#a8a8a8" text-anchor="start">The demo works because the five tasks were chosen. Production fails on task six through six hundred: novel</text>
<text x="24" y="438" font-size="12" fill="#a8a8a8" text-anchor="start">inputs, hostile inputs, and Tuesday.</text>
<text x="24" y="480" font-size="12" fill="#a8a8a8" text-anchor="start">The fix: eval on a sampled slice of real traffic, not on the demo script.</text>
