<text x="144" y="102" font-size="12" fill="#6cb2ff" text-anchor="start">explore: big steps escape bad regions</text>
<line x1="144" y1="108" x2="84" y2="120" stroke="#6cb2ff" stroke-width="1"/>
<circle cx="84" cy="122" r="3" fill="#6cb2ff"/>
<text x="354" y="266" font-size="12" fill="#4fd1a5" text-anchor="start">settle: small steps stay in the minimum</text>
<line x1="404" y1="260" x2="364" y2="224" stroke="#4fd1a5" stroke-width="1"/>
<circle cx="364" cy="222" r="3" fill="#4fd1a5"/>
<line x1="576" y1="104" x2="576" y2="276" stroke="#f0b429" stroke-width="2" stroke-dasharray="6 4"/>
<text x="424" y="112" font-size="11" fill="#f0b429" text-anchor="start">ends at ~10% of peak</text>
<text x="620" y="120" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">The decay endpoint is</text>
<text x="620" y="142" font-size="12" fill="#a8a8a8" text-anchor="start">planned against the total</text>
<text x="620" y="159" font-size="12" fill="#a8a8a8" text-anchor="start">token budget. Changing the</text>
<text x="620" y="176" font-size="12" fill="#a8a8a8" text-anchor="start">step count mid-run without</text>
<text x="620" y="193" font-size="12" fill="#a8a8a8" text-anchor="start">re-planning the schedule is a</text>
<text x="620" y="210" font-size="12" fill="#a8a8a8" text-anchor="start">classic operational mistake.</text>
<text x="24" y="324" font-size="13" fill="#a8a8a8" text-anchor="start">Skip decay (constant LR) and the model bounces around the minimum instead of settling: a plateau above its achievable loss.</text>
</svg>