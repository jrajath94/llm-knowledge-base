<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 637" role="img" aria-label="The baseline ladder: climb in order, never skip">
<rect width="900" height="637" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The baseline ladder: climb in order, never skip</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Read bottom-up by cost. Each rung must beat the last on the holdout set.</text>
<line x1="180.0" y1="475.0" x2="180.0" y2="571.0" stroke="#3a3a3a" stroke-width="8"/>
<line x1="620.0" y1="475.0" x2="620.0" y2="571.0" stroke="#3a3a3a" stroke-width="8"/>
<rect x="180.0" y="453.0" width="440.0" height="44.0" rx="6" fill="#141414" stroke="#4caf50" stroke-width="2"/>
<circle cx="200.0" cy="475.0" r="6" fill="#4caf50"/>
<text x="218.0" y="481.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">constant: always predict the base rate</text>
<text x="40.0" y="481.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rung 1</text>
<rect x="636.0" y="464.0" width="70.5" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="671.2" y="479.0" text-anchor="middle" fill="#4caf50" font-size="11" font-family="Charis SIL, Georgia, serif">the floor</text>
<text x="196.0" y="505.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">If a trained model cannot beat this, the pipeline is</text>
<text x="196.0" y="520.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">broken.</text>
<line x1="180.0" y1="379.0" x2="180.0" y2="475.0" stroke="#3a3a3a" stroke-width="8"/>
<line x1="620.0" y1="379.0" x2="620.0" y2="475.0" stroke="#3a3a3a" stroke-width="8"/>
<rect x="180.0" y="357.0" width="440.0" height="44.0" rx="6" fill="#141414" stroke="#4caf50" stroke-width="2"/>
<circle cx="200.0" cy="379.0" r="6" fill="#4caf50"/>
<text x="218.0" y="385.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">hand rule: 3+ support calls or 2+ late payments</text>
<text x="40.0" y="385.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rung 2</text>
<rect x="636.0" y="368.0" width="52.3" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="662.1" y="383.0" text-anchor="middle" fill="#4caf50" font-size="11" font-family="Charis SIL, Georgia, serif">1 hour</text>
<text x="196.0" y="409.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Catches framing errors: if the rule is competitive, the</text>
<text x="196.0" y="424.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">problem was simpler than you thought.</text>
<line x1="180.0" y1="283.0" x2="180.0" y2="379.0" stroke="#3a3a3a" stroke-width="8"/>
<line x1="620.0" y1="283.0" x2="620.0" y2="379.0" stroke="#3a3a3a" stroke-width="8"/>
<rect x="180.0" y="261.0" width="440.0" height="44.0" rx="6" fill="#141414" stroke="#4caf50" stroke-width="2"/>
<circle cx="200.0" cy="283.0" r="6" fill="#4caf50"/>
<text x="218.0" y="289.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">logistic regression on simple features</text>
<text x="40.0" y="289.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rung 3</text>
<rect x="636.0" y="272.0" width="112.8" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="692.4" y="287.0" text-anchor="middle" fill="#4caf50" font-size="11" font-family="Charis SIL, Georgia, serif">fast, calibrated</text>
<text x="196.0" y="313.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Tells you whether the problem is mostly linear.</text>
<line x1="180.0" y1="187.0" x2="180.0" y2="283.0" stroke="#3a3a3a" stroke-width="8"/>
<line x1="620.0" y1="187.0" x2="620.0" y2="283.0" stroke="#3a3a3a" stroke-width="8"/>
<rect x="180.0" y="165.0" width="440.0" height="44.0" rx="6" fill="#141414" stroke="#f0b429" stroke-width="2"/>
<circle cx="200.0" cy="187.0" r="6" fill="#f0b429"/>
<text x="218.0" y="193.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">gradient-boosted trees (GBDT)</text>
<text x="40.0" y="193.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rung 4</text>
<rect x="636.0" y="176.0" width="88.6" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="680.3" y="191.0" text-anchor="middle" fill="#f0b429" font-size="11" font-family="Charis SIL, Georgia, serif">default stop</text>
<text x="196.0" y="217.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">On tabular data this rung wins most fights. Often the last</text>
<text x="196.0" y="232.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">step, period.</text>
<line x1="180.0" y1="91.0" x2="180.0" y2="187.0" stroke="#3a3a3a" stroke-width="8"/>
<line x1="620.0" y1="91.0" x2="620.0" y2="187.0" stroke="#3a3a3a" stroke-width="8"/>
<rect x="180.0" y="69.0" width="440.0" height="44.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="2"/>
<circle cx="200.0" cy="91.0" r="6" fill="#e5484d"/>
<text x="218.0" y="97.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">deep learning</text>
<text x="40.0" y="97.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rung 5</text>
<rect x="636.0" y="80.0" width="130.9" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="701.5" y="95.0" text-anchor="middle" fill="#e5484d" font-size="11" font-family="Charis SIL, Georgia, serif">needs justification</text>
<text x="196.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Ships only with a measured margin over rung 4 and a</text>
<text x="196.0" y="136.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">serving budget it fits in.</text>
<line x1="836.0" y1="493.0" x2="836.0" y2="99.0" stroke="#ececec" stroke-width="2"/>
<line x1="836.0" y1="99.0" x2="839.7" y2="107.2" stroke="#ececec" stroke-width="2"/>
<line x1="836.0" y1="99.0" x2="832.3" y2="107.2" stroke="#ececec" stroke-width="2"/>
<text x="836.0" y="77.0" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">cost</text>
<text x="40.0" y="575.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Cost grows upward: training time, serving cost, and debugging surface. The ladder also runs in</text>
<text x="40.0" y="591.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">reverse as a diagnostic: if rung 3 beats rung 4, your features are mostly linear or the tree is</text>
<text x="40.0" y="607.4" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">misconfigured. If rung 2 beats rung 3, you have a pipeline bug.</text>
</svg>
