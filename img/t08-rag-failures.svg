<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="t08rf-title t08rf-desc">
<title id="t08rf-title">Five RAG failure modes and their fixes</title>
<desc id="t08rf-desc">Five rows. Each row names a failure mode, its symptom, and the fix. Retrieval miss: answer says it does not know; fix chunking or the index. Bad chunks: answer mixes two topics; fix chunk boundaries. Stale index: answer quotes old docs; rebuild the index. Prompt overload: answer ignores the question; cut context. Generator invention: fluent but false answer; add citations and lower temperature.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="520" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">RAG FAILURE MODES (DIAGNOSE BEFORE YOU TUNE)</text>
<rect x="30" y="70" width="880" height="78" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<circle cx="75" cy="109" r="16" fill="#ff7a7a"/>
<text x="110" y="104" class="box">retrieval miss</text>
<text x="110" y="128" class="dl" fill="#a8a8a8">symptom: model says it does not know</text>
<text x="560" y="116" class="dl" fill="#7fd67f">fix: fix chunking / index</text>
<rect x="30" y="162" width="880" height="78" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<circle cx="75" cy="201" r="16" fill="#f0b429"/>
<text x="110" y="196" class="box">bad chunk boundaries</text>
<text x="110" y="220" class="dl" fill="#a8a8a8">symptom: answer mixes two topics</text>
<text x="560" y="208" class="dl" fill="#7fd67f">fix: split on sections</text>
<rect x="30" y="254" width="880" height="78" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<circle cx="75" cy="293" r="16" fill="#6ab0ff"/>
<text x="110" y="288" class="box">stale index</text>
<text x="110" y="312" class="dl" fill="#a8a8a8">symptom: answer quotes old docs</text>
<text x="560" y="300" class="dl" fill="#7fd67f">fix: rebuild on doc change</text>
<rect x="30" y="346" width="880" height="78" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<circle cx="75" cy="385" r="16" fill="#c79bff"/>
<text x="110" y="380" class="box">prompt overload</text>
<text x="110" y="404" class="dl" fill="#a8a8a8">symptom: answer ignores the question</text>
<text x="560" y="392" class="dl" fill="#7fd67f">fix: cut weak chunks</text>
<rect x="30" y="438" width="880" height="78" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<circle cx="75" cy="477" r="16" fill="#7fd67f"/>
<text x="110" y="472" class="box">generator invention</text>
<text x="110" y="496" class="dl" fill="#a8a8a8">symptom: fluent but false answer</text>
<text x="560" y="484" class="dl" fill="#7fd67f">fix: require citations</text>
</g>
<defs><marker id="t08rf-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>