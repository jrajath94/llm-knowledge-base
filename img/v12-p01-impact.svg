<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why the transformer mattered: the numbers"><rect x="22" y="14" width="916" height="320" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The point was the score plus the training speed</text><rect x="22.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="134" font-size="27" font-weight="700" fill="#f0b429">28.4</text><text x="38.0" y="156" font-size="12.5" fill="#a8a8a8">BLEU on WMT14 EN-DE (big): new state of the art</text><rect x="487.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="134" font-size="27" font-weight="700" fill="#f0b429">41.8</text><text x="503.0" y="156" font-size="12.5" fill="#a8a8a8">BLEU on EN-FR (big)</text><rect x="22.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="244" font-size="27" font-weight="700" fill="#f0b429">12 h</text><text x="38.0" y="266" font-size="12.5" fill="#a8a8a8">base-model training on 8 P100 GPUs</text><rect x="487.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="244" font-size="27" font-weight="700" fill="#f0b429">8 GPUs</text><text x="503.0" y="266" font-size="12.5" fill="#a8a8a8">parallelization across the sequence made billions of</text><text x="503.0" y="282" font-size="12.5" fill="#a8a8a8">tokens affordable</text><rect x="38" y="328" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="350" font-size="13.5" fill="#7fd08a">That combination is the precondition for everything in Papers 2 through 5.</text></svg>