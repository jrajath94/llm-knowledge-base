<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why Chinchilla mattered: the most cited empirical fact in LLM training"><rect x="22" y="14" width="916" height="320" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">A 70B model beat a 280B model. Quality is set by compute spent well.</text><rect x="22.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="134" font-size="27" font-weight="700" fill="#f0b429">20</text><text x="38.0" y="156" font-size="12.5" fill="#a8a8a8">tokens per parameter: the target every serious run has</text><text x="38.0" y="172" font-size="12.5" fill="#a8a8a8">used since 2022</text><rect x="487.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="134" font-size="27" font-weight="700" fill="#f0b429">70B</text><text x="503.0" y="156" font-size="12.5" fill="#a8a8a8">Chinchilla beats 280B Gopher at the same training</text><text x="503.0" y="172" font-size="12.5" fill="#a8a8a8">compute</text><rect x="22.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="244" font-size="27" font-weight="700" fill="#f0b429">1.4T</text><text x="38.0" y="266" font-size="12.5" fill="#a8a8a8">Chinchilla training tokens vs Gopher&#x27;s 300B</text><rect x="487.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="244" font-size="27" font-weight="700" fill="#f0b429">cheaper</text><text x="503.0" y="266" font-size="12.5" fill="#a8a8a8">inference got cheaper even as models got better</text><rect x="38" y="328" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="350" font-size="13.5" fill="#7fd08a">Parameters are not quality. Compute spent well is quality.</text></svg>