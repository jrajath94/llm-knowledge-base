<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-label="Virtual nodes: each physical server gets 100 to 200 ring positions, spreading load and failure evenly">
<rect width="840" height="500" fill="#0d0d0d"/>
<text x="420" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Virtual nodes: many positions, even load</text>
<text x="420" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">A bare ring with few servers lands unevenly: one server owns 40%, another 5%.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<rect x="30" y="90" width="375" height="190" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.5"/>
<text x="217" y="122" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#e08080">Bare ring: 1 position each</text>
<text x="217" y="152" text-anchor="middle" font-size="12" fill="#ececec">Server S1 owns 40% of the ring.</text>
<text x="217" y="172" text-anchor="middle" font-size="12" fill="#ececec">When S1 fails, its whole load</text>
<text x="217" y="192" text-anchor="middle" font-size="12" fill="#ececec">dumps onto ONE neighbor.</text>
<circle cx="120" cy="245" r="22" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="120" cy="223" r="5" fill="#e08080"/>
<circle cx="300" cy="245" r="5" fill="#6cb2ff"/>
<text x="217" y="248" text-anchor="middle" font-size="11" fill="#a8a8a8">one big arc per server</text>

<rect x="435" y="90" width="375" height="190" rx="10" fill="#1a1a1a" stroke="#7fd08a" stroke-width="1.5"/>
<text x="622" y="122" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7fd08a">100 to 200 positions per server</text>
<text x="622" y="152" text-anchor="middle" font-size="12" fill="#ececec">Positions come from hashing</text>
<text x="622" y="172" text-anchor="middle" font-size="12" fill="#ececec">"server-1", "server-2", and so on.</text>
<text x="622" y="192" text-anchor="middle" font-size="12" fill="#ececec">A failure spreads its load</text>
<text x="622" y="212" text-anchor="middle" font-size="12" fill="#ececec">across MANY neighbors.</text>
<circle cx="622" cy="248" r="22" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="622" cy="226" r="3" fill="#e08080"/><circle cx="640" cy="236" r="3" fill="#e08080"/><circle cx="640" cy="258" r="3" fill="#e08080"/><circle cx="622" cy="270" r="3" fill="#e08080"/><circle cx="604" cy="258" r="3" fill="#e08080"/><circle cx="604" cy="236" r="3" fill="#e08080"/>
<circle cx="612" cy="230" r="3" fill="#6cb2ff"/><circle cx="632" cy="230" r="3" fill="#6cb2ff"/><circle cx="646" cy="247" r="3" fill="#6cb2ff"/><circle cx="646" cy="262" r="3" fill="#6cb2ff"/><circle cx="632" cy="268" r="3" fill="#f0b429"/><circle cx="612" cy="268" r="3" fill="#f0b429"/>
<text x="622" y="290" text-anchor="middle" font-size="11" fill="#a8a8a8">dots of one color = one physical server</text>
</g>

<rect x="30" y="310" width="780" height="150" rx="10" fill="#141414" stroke="#2e9e5b" stroke-width="1"/>
<text x="420" y="342" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#2e9e5b">With 100 virtual nodes per server, each server's share converges to 1/N.</text>
<text x="420" y="370" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">A key still walks clockwise to the first position it meets, then maps back to the physical server.</text>
<text x="420" y="394" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">More virtual nodes means a more even split, at the cost of a bigger ring to maintain.</text>
<text x="420" y="424" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">ML systems hit this in distributed caches, sharded model registries, and inference-replica routing.</text>
</svg>
