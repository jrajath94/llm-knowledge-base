<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="100%" style="max-width:760px" role="img" aria-label="Three methods compared on update rule, critic needs, KL control, and when to use each">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="376" fill="none"/>
<text class="t" x="24" y="30">Post-training judgment matrix: PPO vs DPO vs GRPO</text>
<rect x="200" y="52" width="170" height="40" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.8"/>
<text class="big" x="285" y="79" text-anchor="middle">PPO</text>
<rect x="382" y="52" width="170" height="40" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.8"/>
<text class="big" x="467" y="79" text-anchor="middle">DPO</text>
<rect x="564" y="52" width="170" height="40" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.8"/>
<text class="big" x="649" y="79" text-anchor="middle">GRPO</text>
<text class="big g" x="24" y="116">Update</text>
<text class="num" x="200" y="116">min(unclipped,</text>
<text class="num" x="200" y="136">clipped ratio x A)</text>
<text class="num" x="200" y="156">eps = 0.2</text>
<text class="num" x="382" y="116">-log sigmoid(</text>
<text class="num" x="382" y="136">b x [log p(w)/p_ref(w)</text>
<text class="num" x="382" y="156">- log p(l)/p_ref(l)] )</text>
<text class="num" x="564" y="116">advantage =</text>
<text class="num" x="564" y="136">(r - group mean)</text>
<text class="num" x="564" y="156">/ group std</text>
<text class="big g" x="24" y="194">Critic?</text>
<text class="num" x="200" y="194">yes: value net</text>
<text class="num" x="382" y="194">none</text>
<text class="num" x="564" y="194">none</text>
<text class="big g" x="24" y="232">KL control</text>
<text class="num" x="200" y="232">per-step clip</text>
<text class="num" x="382" y="232">beta holds policy</text>
<text class="num" x="382" y="252">near reference;</text>
<text class="num" x="382" y="272">watch token KL/epoch</text>
<text class="num" x="564" y="232">group-relative</text>
<text class="big g" x="24" y="310">Use when</text>
<text class="num" x="200" y="310">online RL,</text>
<text class="num" x="200" y="330">learned reward</text>
<text class="num" x="382" y="310">preference pairs,</text>
<text class="num" x="382" y="330">want it simple</text>
<text class="num" x="564" y="310">verifiable rewards,</text>
<text class="num" x="564" y="330">groups per prompt</text>
</svg>
