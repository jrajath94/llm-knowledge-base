<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img"><rect x="8" y="8" width="944" height="384" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="28" y="36" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">PAPER 8 · INSTRUCTGPT</text><text x="28" y="62" font-size="16" font-weight="700" fill="#ececec">RLHF in three steps: SFT, reward model, PPO</text><rect x="40" y="88" width="240" height="220" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="160" y="120" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">1 · SFT</text><text x="160" y="150" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">supervised fine-tune</text><text x="160" y="172" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">on human demos</text><rect x="360" y="88" width="240" height="220" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="480" y="120" font-size="13" font-weight="700" fill="#e0b26a" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">2 · REWARD</text><text x="480" y="150" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">train reward model</text><text x="480" y="172" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">on human rankings</text><rect x="680" y="88" width="240" height="220" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="800" y="120" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">3 · PPO</text><text x="800" y="150" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">RL against the</text><text x="800" y="172" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">reward model</text><text x="160" y="210" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">prompt → good answer</text><text x="160" y="232" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">imitate the demo</text><text x="480" y="210" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">A vs B → score</text><text x="480" y="232" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">Bradley–Terry loss</text><text x="800" y="210" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">policy gradient</text><text x="800" y="232" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">+ KL leash to SFT</text><line x1="280" y1="190" x2="352" y2="190" stroke="#6cb2ff" stroke-width="2.5"/><polygon points="352,190 343,186 343,194" fill="#6cb2ff"/><line x1="600" y1="190" x2="672" y2="190" stroke="#e0b26a" stroke-width="2.5"/><polygon points="672,190 663,186 663,194" fill="#e0b26a"/><path d="M 800 308 Q 480 360 160 308" fill="none" stroke="#e08a8a" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="356" font-size="12.5" font-weight="400" fill="#e08a8a" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">KL leash: stay close to the SFT model (no reward hacking)</text><text x="160" y="270" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">humans write</text><text x="480" y="270" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">humans rank</text><text x="800" y="270" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">no humans</text></svg>