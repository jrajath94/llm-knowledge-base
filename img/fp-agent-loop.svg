<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#0d0d0d" rx="8"/>
  <text x="30" y="36" fill="#f0b429" font-size="15" font-weight="700">The agent loop: the model thinks, acts through tools, reads the results, and repeats</text>
  <!-- loop nodes -->
  <g font-size="13" text-anchor="middle">
    <rect x="330" y="60" width="140" height="64" fill="#1f2a33" stroke="#6cb2ff" stroke-width="2" rx="8"/>
    <text x="400" y="86" fill="#ececec" font-weight="700">PERCEIVE</text>
    <text x="400" y="106" fill="#a8a8a8" font-size="11">read goal + state</text>
    <rect x="560" y="150" width="140" height="64" fill="#1f2a33" stroke="#6cb2ff" stroke-width="2" rx="8"/>
    <text x="630" y="176" fill="#ececec" font-weight="700">REASON</text>
    <text x="630" y="196" fill="#a8a8a8" font-size="11">plan next step</text>
    <rect x="330" y="270" width="140" height="64" fill="#1f2a33" stroke="#6cb2ff" stroke-width="2" rx="8"/>
    <text x="400" y="296" fill="#ececec" font-weight="700">ACT</text>
    <text x="400" y="316" fill="#a8a8a8" font-size="11">call a tool</text>
    <rect x="100" y="150" width="140" height="64" fill="#1f2a33" stroke="#6cb2ff" stroke-width="2" rx="8"/>
    <text x="170" y="176" fill="#ececec" font-weight="700">OBSERVE</text>
    <text x="170" y="196" fill="#a8a8a8" font-size="11">read tool result</text>
  </g>
  <!-- loop arrows -->
  <g stroke="#f0b429" stroke-width="2.5" fill="none" marker-end="url(#al)">
    <path d="M 470 92 Q 560 92 560 150"/>
    <path d="M 630 214 Q 560 270 470 302"/>
    <path d="M 330 302 Q 240 270 170 214"/>
    <path d="M 170 150 Q 240 92 330 92"/>
  </g>
  <!-- tool box -->
  <rect x="520" y="270" width="200" height="64" fill="#17332f" stroke="#45b8ac" rx="8"/>
  <text x="620" y="296" fill="#ececec" font-size="13" text-anchor="middle" font-weight="700">TOOL</text>
  <text x="620" y="316" fill="#a8a8a8" font-size="11" text-anchor="middle">search, code, API, file write</text>
  <line x1="470" y1="310" x2="518" y2="302" stroke="#45b8ac" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- stop conditions, top right -->
  <text x="730" y="80" fill="#c0392b" font-size="13" font-weight="700">The loop must stop:</text>
  <g font-size="12" fill="#a8a8a8">
    <text x="730" y="104">answer ready: goal done</text>
    <text x="730" y="126">step budget: max N iterations</text>
    <text x="730" y="148">time budget: max T seconds</text>
    <text x="730" y="170">loop detection: same call twice</text>
  </g>
  <text x="730" y="200" fill="#a8a8a8" font-size="11">without these, the loop</text>
  <text x="730" y="216" fill="#a8a8a8" font-size="11">burns money forever</text>
  <!-- bottom line -->
  <text x="30" y="360" fill="#ececec" font-size="13">RAG is one step of this loop (retrieve, then answer). An agent is the loop itself: retrieve, search, run code, check its work.</text>
  <defs><marker id="al" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#f0b429" stroke-width="1.8"/></marker></defs>
</svg>
