<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" font-family="DejaVu Sans, sans-serif">
<defs><style>.t{font-size:13px;fill:#1a3a5c;font-weight:bold}.b{font-size:11.5px;fill:#333333}.s{font-size:10.5px;fill:#555555}.box{fill:#f4f7fa;stroke:#1a3a5c;stroke-width:1.5;rx:8}.box2{fill:#eef6f3;stroke:#2a9d8f;stroke-width:1.5;rx:8}.box3{fill:#fdf3ec;stroke:#e76f51;stroke-width:1.5;rx:8}.arr{stroke:#1a3a5c;stroke-width:2;fill:none;marker-end:url(#ah)}</style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/></marker></defs>
<text x="400" y="30" text-anchor="middle" class="t" font-size="15">Constitutional AI: two phases</text>
<rect x="30" y="60" width="340" height="170" class="box"/>
<text x="200.0" y="82" text-anchor="middle" class="t">Phase 1: supervised</text>
<text x="200.0" y="102" text-anchor="middle" class="b">model writes a response</text>
<text x="200.0" y="120" text-anchor="middle" class="b">model critiques it against</text>
<text x="200.0" y="138" text-anchor="middle" class="b">the constitution</text>
<text x="200.0" y="156" text-anchor="middle" class="b">model revises; fine-tune</text>
<text x="200.0" y="174" text-anchor="middle" class="b">on the revisions (SL)</text>
<rect x="430" y="60" width="340" height="170" class="box2"/>
<text x="600.0" y="82" text-anchor="middle" class="t">Phase 2: RL from AI feedback</text>
<text x="600.0" y="102" text-anchor="middle" class="b">model samples two responses</text>
<text x="600.0" y="120" text-anchor="middle" class="b">AI judge picks the better one</text>
<text x="600.0" y="138" text-anchor="middle" class="b">using the constitution</text>
<text x="600.0" y="156" text-anchor="middle" class="b">train reward model on AI labels</text>
<text x="600.0" y="174" text-anchor="middle" class="b">PPO against that reward (RLAIF)</text>
<path d="M370,145 L430,145" class="arr"/>
<text x="400.0" y="137.0" text-anchor="middle" class="s">labels scale</text>
<text x="400" y="260" text-anchor="middle" class="s">Human labels needed only for a small seed set and final evals.</text>
</svg>
