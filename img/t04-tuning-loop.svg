<svg xmlns="http://www.w3.org/2000/svg" width="720" height="427" viewBox="0 0 720 427" role="img" aria-label="One-knob-at-a-time tuning loop">
<rect width="720" height="427" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The tuning loop: one knob at a time</text>
<rect class="box" x="280.0" y="58.0" width="160" height="64" rx="32"/>
<line x1="280.0" y1="58.0" x2="280.0" y2="122.0" stroke="#f0b429" stroke-width="4"/>
<text x="360.0" y="86.0" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">profile</text>
<text x="360.0" y="104.0" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">read the trace</text>
<path d="M393.6,123.6 L446.4,176.4" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="400.0" y="178.0" width="160" height="64" rx="32"/>
<line x1="400.0" y1="178.0" x2="400.0" y2="242.0" stroke="#58a6ff" stroke-width="4"/>
<text x="480.0" y="206.0" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">find the gap</text>
<text x="480.0" y="224.0" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">exposed comm or slow kernel</text>
<path d="M446.4,243.6 L393.6,296.4" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="280.0" y="298.0" width="160" height="64" rx="32"/>
<line x1="280.0" y1="298.0" x2="280.0" y2="362.0" stroke="#3fb950" stroke-width="4"/>
<text x="360.0" y="326.0" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">change one variable</text>
<text x="360.0" y="344.0" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">microbatches, TP degree, NCCL knob</text>
<path d="M326.4,296.4 L273.6,243.60000000000002" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="160.0" y="178.00000000000003" width="160" height="64" rx="32"/>
<line x1="160.0" y1="178.00000000000003" x2="160.0" y2="242.00000000000003" stroke="#8a8a8a" stroke-width="4"/>
<text x="240.0" y="206.00000000000003" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">measure again</text>
<text x="240.0" y="224.00000000000003" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">same metric, before and after</text>
<path d="M273.6,176.40000000000003 L326.4,123.60000000000001" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="360" y="380" text-anchor="middle" fill="#e5484d" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">never change two knobs at once: you will not know which one helped</text>
<text x="360" y="402" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">measure absolute step time without the profiler attached</text>
</svg>