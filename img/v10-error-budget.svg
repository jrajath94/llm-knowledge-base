<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 238" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Error budgets make the trade explicit"><rect x="22" y="14" width="916" height="210" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">BUDGETS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The budget is the team&#x27;s shared truth about how much risk is left</text><rect x="22.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="134" font-size="27" font-weight="700" fill="#f0b429">43.2 min</text><text x="38.0" y="156" font-size="12.5" fill="#a8a8a8">downtime budget per month at a 99.9% SLO</text><rect x="487.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="134" font-size="27" font-weight="700" fill="#f0b429">500</text><text x="503.0" y="156" font-size="12.5" fill="#a8a8a8">ungrounded answers allowed per month at a 95%</text><text x="503.0" y="172" font-size="12.5" fill="#a8a8a8">grounded SLO on 10k answers</text><rect x="38" y="218" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="240" font-size="13.5" fill="#7fd08a">A risky change burning 2% of the monthly budget in a day? Roll back. The budget says so.</text></svg>