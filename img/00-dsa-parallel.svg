<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 260' width='100%' role='img'><text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Two lanes, one schedule</text><text x='20' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='start'>Lane 1: the spine</text><text x='20' y='88' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='start'>Lane 2: DSA, 1-2 h/day</text><rect x='230' y='44' width='700' height='30' rx='8' fill='#1565c0' fill-opacity='0.25' stroke='#1565c0' stroke-width='1.5'/><text x='580' y='65' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Volumes 0-14 in order</text><rect x='230' y='82' width='700' height='30' rx='8' fill='#c62828' fill-opacity='0.25' stroke='#c62828' stroke-width='1.5'/><text x='580' y='103' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Top-300 patterns, one pattern at a time</text><line x1='120' y1='130' x2='120' y2='160' stroke='#3a3a3a' stroke-width='2'/><text x='20' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='start'>Never mix the lanes:</text><text x='20' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Patterns before problems. Learn the pattern's template, solve 2-3 problems, move on.</text><text x='20' y='208' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Never grind problems without naming the pattern first.</text><text x='20' y='238' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Hour 4 of the day belongs to the DSA lane (or paper reading in the Research phase).</text></svg>