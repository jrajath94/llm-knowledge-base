<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The notebook-to-service conversion, made mechanical"><rect x="22" y="14" width="916" height="300" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">FROM CELLS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Every notebook cell becomes a deployable function</text><rect x="38" y="96" width="236.15361249999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Cell to function</text><text x="54" y="144" font-size="12" fill="#a8a8a8">each cell becomes a</text><text x="54" y="160" font-size="12" fill="#a8a8a8">function with explicit inputs</text><text x="54" y="176" font-size="12" fill="#a8a8a8">and outputs</text><line x1="284.1536125" y1="144.0" x2="298.1536125" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="298.1536125,139.0 306.1536125,144.0 298.1536125,149.0" fill="#a8a8a8"/><rect x="314.1536125" y="96" width="232.41891249999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="334.1536125" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="334.1536125" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="354.1536125" y="123" font-size="13.5" font-weight="700" fill="#ececec">Globals to args</text><text x="330.1536125" y="144" font-size="12" fill="#a8a8a8">every global becomes an</text><text x="330.1536125" y="160" font-size="12" fill="#a8a8a8">argument or a config value</text><line x1="556.572525" y1="144.0" x2="570.572525" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="570.572525,139.0 578.572525,144.0 570.572525,149.0" fill="#a8a8a8"/><rect x="586.572525" y="96" width="216.70794999999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="606.572525" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="606.572525" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="626.572525" y="123" font-size="13.5" font-weight="700" fill="#ececec">Comments to init</text><text x="602.572525" y="144" font-size="12" fill="#a8a8a8">every &quot;run this first&quot;</text><text x="602.572525" y="160" font-size="12" fill="#a8a8a8">comment becomes an</text><text x="602.572525" y="176" font-size="12" fill="#a8a8a8">explicit initialization step</text><rect x="38" y="216" width="226.2689921875" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="238" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="243" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="243" font-size="13.5" font-weight="700" fill="#ececec">Add the missing test</text><text x="54" y="264" font-size="12" fill="#a8a8a8">fixed input, asserted</text><text x="54" y="280" font-size="12" fill="#a8a8a8">output, run on every</text><text x="54" y="296" font-size="12" fill="#a8a8a8">change</text></svg>