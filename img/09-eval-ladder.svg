<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-label="Four rung eval ladder">
<rect width="700" height="400" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="350.0" y="28" text-anchor="middle" font-size="18" class="accent">Eval: The Four Rungs</text>
<rect x="200" y="70" width="300" height="55" class="box" rx="4"/>
<text x="350.0" y="92" text-anchor="middle" font-size="14">Rung 1: Outcome</text>
<text x="350.0" y="110" text-anchor="middle" font-size="11" class="muted">did it work?</text>
<rect x="200" y="140" width="300" height="55" class="box" rx="4"/>
<text x="350.0" y="162" text-anchor="middle" font-size="14">Rung 2: Trajectory</text>
<text x="350.0" y="180" text-anchor="middle" font-size="11" class="muted">milestones in steps</text>
<rect x="200" y="210" width="300" height="55" class="box" rx="4"/>
<text x="350.0" y="232" text-anchor="middle" font-size="14">Rung 3: Rubrics</text>
<text x="350.0" y="250" text-anchor="middle" font-size="11" class="muted">graded criteria</text>
<rect x="200" y="280" width="300" height="55" class="box" rx="4"/>
<text x="350.0" y="302" text-anchor="middle" font-size="14">Rung 4: LLM Judge</text>
<text x="350.0" y="320" text-anchor="middle" font-size="11" class="muted">calibrated, not truth</text>
</svg>