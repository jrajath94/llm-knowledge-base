<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 248" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 2: the problem RoFormer (RoPE) solved"><rect x="22" y="14" width="435.0" height="220" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">Attention is permutation invariant, so</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">position must be injected</text><circle cx="44" cy="103.5" r="3.2" fill="#e07878"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">sinusoidal vectors added to embeddings (2017)</text><circle cx="44" cy="129.5" r="3.2" fill="#e07878"/><text x="56" y="134" font-size="13.5" fill="#a8a8a8">learned absolute embeddings: no vector for</text><text x="56" y="152" font-size="13.5" fill="#a8a8a8">position 5000 if trained on 2048</text><circle cx="44" cy="173.5" r="3.2" fill="#e07878"/><text x="56" y="178" font-size="13.5" fill="#a8a8a8">additive relative biases: entangle position with</text><text x="56" y="196" font-size="13.5" fill="#a8a8a8">content in ad hoc ways</text><rect x="503.0" y="14" width="435.0" height="220" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">Is there a position encoding that is</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">relative by construction, costs no</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">parameters, and generalizes to longer</text><text x="519.0" y="124" font-size="15" font-weight="700" fill="#ececec">sequences?</text><line x1="467.0" y1="124.0" x2="487.0" y2="124.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,119.0 495.0,124.0 487.0,129.0" fill="#a8a8a8"/></svg>