<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="360" fill="#0d0d0d" rx="8"/>
  <text x="30" y="36" fill="#f0b429" font-size="15" font-weight="700">Words with similar meaning land near each other; distance is measured by the angle between arrows</text>
  <!-- axes -->
  <line x1="80" y1="320" x2="560" y2="320" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="70" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="60" y="200" fill="#5a5a5a" font-size="11" transform="rotate(-90 60 200)">meaning axis 2</text>
  <text x="300" y="345" fill="#5a5a5a" font-size="11">meaning axis 1 (only 2 of ~1,500 shown)</text>
  <!-- cluster 1: animals -->
  <g font-size="13">
    <circle cx="200" cy="150" r="6" fill="#45b8ac"/><text x="212" y="154" fill="#ececec">cat</text>
    <circle cx="245" cy="130" r="6" fill="#45b8ac"/><text x="257" y="134" fill="#ececec">dog</text>
    <circle cx="225" cy="185" r="6" fill="#45b8ac"/><text x="237" y="189" fill="#ececec">puppy</text>
    <circle cx="180" cy="200" r="6" fill="#45b8ac"/><text x="150" y="218" fill="#ececec">kitten</text>
  </g>
  <!-- cluster 2: vehicles -->
  <g font-size="13">
    <circle cx="450" cy="230" r="6" fill="#6cb2ff"/><text x="462" y="234" fill="#ececec">car</text>
    <circle cx="490" cy="205" r="6" fill="#6cb2ff"/><text x="502" y="209" fill="#ececec">engine</text>
    <circle cx="470" cy="260" r="6" fill="#6cb2ff"/><text x="482" y="278" fill="#ececec">tire</text>
  </g>
  <!-- query -->
  <circle cx="262" cy="112" r="7" fill="none" stroke="#f0b429" stroke-width="2.5"/>
  <text x="262" y="92" fill="#f0b429" font-size="13" text-anchor="middle">query: "puppy"</text>
  <line x1="262" y1="112" x2="245" y2="130" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="300" y="300" fill="#a8a8a8" font-size="12">the query lands inside the animal cluster: nearest neighbors are the answer</text>
  <!-- cosine inset -->
  <rect x="620" y="70" width="250" height="220" fill="#141414" stroke="#262626" rx="6"/>
  <text x="745" y="100" fill="#f0b429" font-size="13" font-weight="700" text-anchor="middle">Cosine similarity</text>
  <line x1="660" y1="250" x2="660" y2="130" stroke="#45b8ac" stroke-width="3"/>
  <line x1="660" y1="250" x2="770" y2="150" stroke="#45b8ac" stroke-width="3"/>
  <path d="M 700 250 A 42 42 0 0 0 668 208" fill="none" stroke="#f0b429" stroke-width="2"/>
  <text x="712" y="232" fill="#f0b429" font-size="13">small angle</text>
  <text x="712" y="250" fill="#f0b429" font-size="13">= similar</text>
  <line x1="660" y1="250" x2="830" y2="240" stroke="#6cb2ff" stroke-width="3"/>
  <path d="M 760 250 A 100 100 0 0 0 660 150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="745" y="278" fill="#a8a8a8" font-size="12" text-anchor="middle">wide angle = unrelated</text>
</svg>
