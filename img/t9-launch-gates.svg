<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 560' width='100%' role='img'>
<title>Production launch gates</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Production launch checklist: gates, not wishes</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Every item has an owner and a date. No gate passes on vibes.</text>
<rect x='30' y='120' width='280' height='150' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='170' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Framing signed</text>
<text x='170' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>decision, error costs, threshold, metric</text>
<line x1='310' y1='195' x2='340' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='331.8,198.7 340,195 331.8,191.3' fill='#8a8a8a'/>
<rect x='340' y='120' width='280' height='150' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='480' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Baseline ladder</text>
<text x='480' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>rule, constant, linear, GBDT on holdout</text>
<line x1='620' y1='195' x2='650' y2='195' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='641.8,198.7 650,195 641.8,191.3' fill='#8a8a8a'/>
<rect x='650' y='120' width='280' height='150' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='790' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Data tests green</text>
<text x='790' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>schema, nulls, ranges, freshness, labels</text>
<rect x='30' y='295' width='280' height='150' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='170' y='321' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Point-in-time correct</text>
<text x='170' y='341' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>no future leak in the feature join</text>
<line x1='310' y1='370' x2='340' y2='370' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='331.8,373.7 340,370 331.8,366.3' fill='#8a8a8a'/>
<rect x='340' y='295' width='280' height='150' rx='10' fill='#00897b' fill-opacity='0.22' stroke='#00897b' stroke-width='2'/>
<text x='480' y='321' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Experiments tracked</text>
<text x='480' y='341' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>runs, params, metrics in the registry</text>
<line x1='620' y1='370' x2='650' y2='370' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='641.8,373.7 650,370 641.8,366.3' fill='#8a8a8a'/>
<rect x='650' y='295' width='280' height='150' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/>
<text x='790' y='321' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Shadow / canary</text>
<text x='790' y='341' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>serves real traffic beside the old path</text>
<path d='M905,195 L935,195 L935,283 L170,283 L170,290' fill='none' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='163,283 170,296 177,283' fill='#8a8a8a'/>
<text x='480' y='495' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The bundle from Figure T1.4 passes through these gates; the registry (Chapter T3) records each pass.</text>
<text x='480' y='523' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: launch checklists fail when items are vague. Each gate names its artifact and its owner.</text>
</svg>