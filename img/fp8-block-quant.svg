<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" style="max-width:700px" role="img" aria-label="Block with an outlier quantizes cleanly with its own scale, while a per-tensor scale set by a distant outlier erases every small value">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="280" fill="none"/>
<text class="t" x="24" y="30">Quantize one block by hand: block-wise vs per-tensor</text>
<text class="m" x="24" y="58">Block = [0.5, -3.2, 100.0, -0.01], E4M3 max = 448</text>
<rect class="box" x="24" y="70" width="120" height="52" rx="8"/>
<text class="big g" x="38" y="94">amax</text>
<text class="num" x="38" y="112">= 100.0</text>
<path class="arr" d="M156 96 L196 96"/>
<rect class="box" x="196" y="70" width="176" height="52" rx="8"/>
<text class="big g" x="210" y="94">scale</text>
<text class="num" x="210" y="112">= 100/448 = 0.22321</text>
<path class="arr" d="M384 96 L424 96"/>
<rect class="box" x="424" y="70" width="220" height="52" rx="8"/>
<text class="big g" x="438" y="94">codes</text>
<text class="num" x="438" y="112">= [2, -14, 448, 0]</text>
<text class="num" x="24" y="152">Dequantize (code x scale): [0.4464, -3.125, 100.0, 0.0]</text>
<text class="m" x="24" y="176">0.5 -&gt; 0.4464 (11% err)    -3.2 -&gt; -3.125 (2.3%)    100.0 exact (it set the scale)    -0.01 -&gt; 0.0 (erased)</text>
<text class="big r" x="24" y="208">Per-tensor with a 10,000 outlier elsewhere: global scale = 22.32.</text>
<text class="r" x="24" y="232">Our block's codes become [0, 0, 4, 0]: 0.5, -3.2, -0.01 all vanish.</text>
<text class="gr" x="24" y="256">Block-wise scaling confines the outlier's damage to its own block.</text>
</svg>
