<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Batch path versus streaming path from raw events to serving"><rect x="22" y="14" width="916" height="332" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 2</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Two paths to fresh features</text><text x="38" y="110" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Batch</text><rect x="130" y="92" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="205" y="125" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">raw events</text><line x1="280" y1="120" x2="316" y2="120" stroke="#4a4a4a" stroke-width="2"/><path d="M 308 116 L 316 120 L 308 124" stroke="#4a4a4a" stroke-width="2" fill="none"/><rect x="316" y="92" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="391" y="125" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">hourly job</text><line x1="466" y1="120" x2="502" y2="120" stroke="#4a4a4a" stroke-width="2"/><path d="M 494 116 L 502 120 L 494 124" stroke="#4a4a4a" stroke-width="2" fill="none"/><rect x="502" y="92" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="577" y="125" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">feature store</text><line x1="652" y1="120" x2="688" y2="120" stroke="#4a4a4a" stroke-width="2"/><path d="M 680 116 L 688 120 L 680 124" stroke="#4a4a4a" stroke-width="2" fill="none"/><rect x="688" y="92" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="763" y="125" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">serving</text><text x="130" y="175" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="start">freshness: hours (the 39-hour example lives here)</text><text x="38" y="240" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Stream</text><rect x="130" y="222" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="205" y="255" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">raw events</text><line x1="280" y1="250" x2="316" y2="250" stroke="#f0b429" stroke-width="2"/><path d="M 308 246 L 316 250 L 308 254" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="316" y="222" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="391" y="255" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">stream processor</text><line x1="466" y1="250" x2="502" y2="250" stroke="#f0b429" stroke-width="2"/><path d="M 494 246 L 502 250 L 494 254" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="502" y="222" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="577" y="255" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">feature store</text><line x1="652" y1="250" x2="688" y2="250" stroke="#f0b429" stroke-width="2"/><path d="M 680 246 L 688 250 L 680 254" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="688" y="222" width="150" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="763" y="255" font-size="12.5" font-weight="400" fill="#ececec" text-anchor="middle">serving</text><text x="130" y="305" font-size="12.5" font-weight="400" fill="#f0b429" text-anchor="start">freshness: seconds (a fraud model needs seconds)</text></svg>