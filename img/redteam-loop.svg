<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 380' width='100%' style='max-width:900px;background-color:transparent' role='img'><style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.g{fill:#f0b429}.b{fill:#6cb2ff}.r{fill:#e57373}.gr{fill:#7fc97f}</style><rect x='265.0' y='35.0' width='190' height='60' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='360.0' y='63.0' font-size='13.5' text-anchor='middle' font-weight='700'>Define attack goal</text><text x='360.0' y='83.0' font-size='12' text-anchor='middle' class='m'>one harm family</text><rect x='481.5063509461097' y='90.0' width='190' height='60' rx='10' fill='#141414' stroke='#a8a8a8' stroke-width='2'/><text x='576.5063509461097' y='118.0' font-size='13.5' text-anchor='middle' font-weight='700'>Craft attacks</text><text x='576.5063509461097' y='138.0' font-size='12' text-anchor='middle' class='m'>prompts, jailbreaks</text><rect x='481.5063509461097' y='199.99999999999997' width='190' height='60' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='576.5063509461097' y='227.99999999999997' font-size='13.5' text-anchor='middle' font-weight='700'>Run vs model</text><text x='576.5063509461097' y='247.99999999999997' font-size='12' text-anchor='middle' class='m'>record outputs</text><rect x='265.0' y='255.0' width='190' height='60' rx='10' fill='#141414' stroke='#a8a8a8' stroke-width='2'/><text x='360.0' y='283.0' font-size='13.5' text-anchor='middle' font-weight='700'>Triage failures</text><text x='360.0' y='303.0' font-size='12' text-anchor='middle' class='m'>real vs benign</text><rect x='48.49364905389038' y='200.00000000000003' width='190' height='60' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='143.49364905389038' y='228.00000000000003' font-size='13.5' text-anchor='middle' font-weight='700'>Add mitigation</text><text x='143.49364905389038' y='248.00000000000003' font-size='12' text-anchor='middle' class='m'>guardrail / training</text><rect x='48.49364905389024' y='90.00000000000006' width='190' height='60' rx='10' fill='#141414' stroke='#a8a8a8' stroke-width='2'/><text x='143.49364905389024' y='118.00000000000006' font-size='13.5' text-anchor='middle' font-weight='700'>Re-run suite</text><text x='143.49364905389024' y='138.00000000000006' font-size='12' text-anchor='middle' class='m'>did it hold?</text><line x1='360' y1='65' x2='577' y2='120' stroke='#5a5a5a' stroke-width='2' marker-end='url(#ah5)'/><line x1='577' y1='120' x2='577' y2='230' stroke='#5a5a5a' stroke-width='2' marker-end='url(#ah5)'/><line x1='577' y1='230' x2='360' y2='285' stroke='#5a5a5a' stroke-width='2' marker-end='url(#ah5)'/><line x1='360' y1='285' x2='143' y2='230' stroke='#5a5a5a' stroke-width='2' marker-end='url(#ah5)'/><line x1='143' y1='230' x2='143' y2='120' stroke='#5a5a5a' stroke-width='2' marker-end='url(#ah5)'/><line x1='143' y1='120' x2='360' y2='65' stroke='#5a5a5a' stroke-width='2' marker-end='url(#ah5)'/><defs><marker id='ah5' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6' fill='none' stroke='#8a8a8a' stroke-width='1.5'/></marker></defs><text x='360' y='169' font-size='15' text-anchor='middle' font-weight='700' class='g'>per family, per goal</text><text x='360' y='191' font-size='12' text-anchor='middle' class='m'>Rule 5: adversary order. Rule 6: report per family.</text><text x='30' y='360' font-size='13' class='m'>The library of attacks is living: every incident adds a case (Rule 12). A red-team that reuses last quarter's prompts is a compliance ritual.</text></svg>