<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" style="max-width:760px" role="img" aria-label="KL over epochs: high beta keeps KL low and flat, low beta lets KL explode.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">DPO: beta holds the policy near the reference</text>
<line x1="90" y1="250" x2="650" y2="250" stroke="#8a8a8a"/>
<text x="370.0" y="272" text-anchor="middle" class="m">epochs</text>
<text x="76" y="170.0" text-anchor="middle" class="m">KL</text>
<polyline points="90.0,239.33333333333334 146.0,237.73333333333332 202.0,236.13333333333333 258.0,234.53333333333333 314.0,232.93333333333334 370.0,231.33333333333334 426.0,229.73333333333332 482.0,228.13333333333333 538.0,226.53333333333333 594.0,224.93333333333334 650.0,223.33333333333334" fill="none" stroke="#7fc97f" stroke-width="2.5"/>
<text x="650.0" y="208.0" text-anchor="end" class="s">high beta: KL stays low</text>
<polyline points="90.0,242.0 146.0,239.2 202.0,235.42 258.0,230.317 314.0,223.42794999999998 370.0,214.12773249999998 426.0,201.572438875 482.0,184.62279248124997 538.0,161.74076984968747 594.0,130.85003929707804 650.0,90.0" fill="none" stroke="#e57373" stroke-width="2.5"/>
<text x="538.0" y="120.66666666666666" text-anchor="middle" class="s">low beta: KL explodes</text>
<text x="24" y="312" text-anchor="start" class="s">Watch mean token-level KL per epoch on a fixed prompt set. Small and stable is healthy.</text>
</svg>