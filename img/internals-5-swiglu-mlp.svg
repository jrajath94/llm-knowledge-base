<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img" aria-label="SwiGLU MLP dataflow inside one transformer block">
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#ececec}
    .m{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#a8a8a8}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
  <text x="20" y="30" class="t" font-size="17" font-weight="700">The SwiGLU MLP: a learned gate, not a fixed curve</text>
  <text x="20" y="54" class="m" font-size="13">per token, inside every block (shown for d=512, d_ff=2048)</text>
  <!-- input -->
  <rect x="20" y="150" width="90" height="80" rx="8" fill="#0d0d0d" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="65" y="182" class="t mono" font-size="15" text-anchor="middle">x</text>
  <text x="65" y="202" class="m mono" font-size="11" text-anchor="middle">[512]</text>
  <!-- arrows split -->
  <line x1="110" y1="170" x2="160" y2="110" stroke="#a8a8a8" stroke-width="1.5"/>
  <polygon points="160,110 150,110 154,120" fill="#a8a8a8"/>
  <line x1="110" y1="210" x2="160" y2="270" stroke="#a8a8a8" stroke-width="1.5"/>
  <polygon points="160,270 150,270 154,260" fill="#a8a8a8"/>
  <!-- gate branch -->
  <rect x="160" y="70" width="150" height="80" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="235" y="100" class="t mono" font-size="13" text-anchor="middle">xW (gate)</text>
  <text x="235" y="120" class="m mono" font-size="11" text-anchor="middle">512 -&gt; 2048</text>
  <text x="235" y="138" class="m" font-size="11" text-anchor="middle">learned projection</text>
  <line x1="310" y1="110" x2="350" y2="110" stroke="#a8a8a8" stroke-width="1.5"/>
  <polygon points="350,110 340,105 340,115" fill="#a8a8a8"/>
  <rect x="350" y="70" width="110" height="80" rx="8" fill="#3a2c07" stroke="#f0b429" stroke-width="1.5"/>
  <text x="405" y="100" class="t mono" font-size="13" text-anchor="middle">Swish</text>
  <text x="405" y="120" class="m" font-size="11" text-anchor="middle">z * sigmoid(z)</text>
  <text x="405" y="138" class="m" font-size="11" text-anchor="middle">smooth gate 0..1-ish</text>
  <!-- content branch -->
  <rect x="160" y="230" width="150" height="80" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="235" y="260" class="t mono" font-size="13" text-anchor="middle">xV (content)</text>
  <text x="235" y="280" class="m mono" font-size="11" text-anchor="middle">512 -&gt; 2048</text>
  <text x="235" y="298" class="m" font-size="11" text-anchor="middle">learned projection</text>
  <!-- multiply node -->
  <line x1="460" y1="110" x2="500" y2="160" stroke="#a8a8a8" stroke-width="1.5"/>
  <line x1="310" y1="270" x2="500" y2="200" stroke="#a8a8a8" stroke-width="1.5"/>
  <circle cx="505" cy="180" r="26" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="505" y="188" class="t" font-size="20" text-anchor="middle">x</text>
  <text x="505" y="226" class="m" font-size="11" text-anchor="middle">elementwise</text>
  <!-- down projection -->
  <line x1="531" y1="180" x2="570" y2="180" stroke="#a8a8a8" stroke-width="1.5"/>
  <polygon points="570,180 560,175 560,185" fill="#a8a8a8"/>
  <rect x="570" y="140" width="90" height="80" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="615" y="170" class="t mono" font-size="13" text-anchor="middle">down</text>
  <text x="615" y="190" class="m mono" font-size="11" text-anchor="middle">2048-&gt;512</text>
  <text x="615" y="208" class="m" font-size="11" text-anchor="middle">project</text>
  <!-- note -->
  <rect x="20" y="260" width="640" height="100" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="36" y="288" class="t" font-size="12" font-weight="700">Why three matrices</text>
  <text x="36" y="310" class="m" font-size="12">GELU-MLP: up, then a fixed curve, then down (two matrices). SwiGLU adds a second up-projection</text>
  <text x="36" y="330" class="m" font-size="12">whose Swish output gates the first, element by element. The gate is learned, so the effective</text>
  <text x="36" y="350" class="m" font-size="12">activation shape adapts during training: a multiplicative interaction a fixed curve cannot express.</text>
</svg>
