<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="660" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">How practitioners read results</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Deltas need uncertainty; averages hide the story</text>
<text x="24" y="98" font-size="15" font-weight="bold" fill="#ececec" text-anchor="start">Win-rate deltas need uncertainty</text>
<line x1="90" y1="300" x2="790" y2="300" stroke="#8a8a8a" stroke-width="2"/>
<text x="440.0" y="334" font-size="12" fill="#a8a8a8" text-anchor="middle">win rate</text>
<text x="398.0" y="318" font-size="11" fill="#8a8a8a" text-anchor="middle">44%</text>
<text x="426.0" y="318" font-size="11" fill="#8a8a8a" text-anchor="middle">48%</text>
<text x="454.0" y="318" font-size="11" fill="#8a8a8a" text-anchor="middle">52%</text>
<text x="482.00000000000006" y="318" font-size="11" fill="#8a8a8a" text-anchor="middle">56%</text>
<line x1="426.0" y1="256" x2="426.0" y2="344" stroke="#6cb2ff" stroke-width="3"/>
<line x1="400.0" y1="256" x2="452.0" y2="256" stroke="#6cb2ff" stroke-width="3"/>
<line x1="400.0" y1="344" x2="452.0" y2="344" stroke="#6cb2ff" stroke-width="3"/>
<line x1="454.0" y1="256" x2="454.0" y2="344" stroke="#4fd1a5" stroke-width="3"/>
<line x1="428.0" y1="256" x2="480.0" y2="256" stroke="#4fd1a5" stroke-width="3"/>
<line x1="428.0" y1="344" x2="480.0" y2="344" stroke="#4fd1a5" stroke-width="3"/>
<text x="426.0" y="242" font-size="12" font-weight="bold" fill="#6cb2ff" text-anchor="middle">old: 48%</text>
<text x="498.0" y="302" font-size="12" font-weight="bold" fill="#4fd1a5" text-anchor="start">new: 52%</text>
<line x1="494.0" y1="300" x2="462.0" y2="300" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="24" y="380" font-size="12" fill="#f0b429" text-anchor="start">&quot;52 percent vs 48 percent on 200 prompts&quot; is noise: the intervals overlap. Report confidence intervals; require the</text>
<text x="24" y="397" font-size="12" fill="#f0b429" text-anchor="start">delta to survive them and replicate on a fresh sample.</text>
<text x="24" y="452" font-size="15" font-weight="bold" fill="#ececec" text-anchor="start">Slice, do not just average. Track reward and KL jointly.</text>
<circle cx="40" cy="487" r="7" fill="#4fd1a5"/>
<text x="58" y="492" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Reward up, KL flat</text>
<text x="300" y="492" font-size="12" fill="#a8a8a8" text-anchor="start">healthy optimization</text>
<circle cx="40" cy="523" r="7" fill="#e57ea6"/>
<text x="58" y="528" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Reward up, KL spiking</text>
<text x="300" y="528" font-size="12" fill="#a8a8a8" text-anchor="start">probable hacking (Chapter 8)</text>
<circle cx="40" cy="559" r="7" fill="#8a8a8a"/>
<text x="58" y="564" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Reward flat, KL flat</text>
<text x="300" y="564" font-size="12" fill="#a8a8a8" text-anchor="start">learned nothing: check data and advantage signal</text>
<text x="24" y="620" font-size="11" fill="#8a8a8a" text-anchor="start">Maintain a living failure taxonomy with counts per checkpoint. Ablate one thing at a time: new data mix or new beta, not both.</text>
</svg>