<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Snowballing a literature review from seed papers">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a8a8a8"/>
    </marker>
  </defs>
  <text x="40" y="30" font-size="12" fill="#f0b429" font-weight="700" letter-spacing="1.5">BACKWARD: REFERENCES</text>
  <text x="40" y="48" font-size="12" fill="#a8a8a8">what the seeds built on</text>
  <rect x="20" y="70" width="150" height="52" rx="8" fill="#101010" stroke="#3a3a3a"/>
  <text x="32" y="92" font-size="13" fill="#ececec">chunking study</text>
  <text x="32" y="110" font-size="12" fill="#a8a8a8">2021</text>
  <rect x="20" y="140" width="150" height="52" rx="8" fill="#101010" stroke="#3a3a3a"/>
  <text x="32" y="162" font-size="13" fill="#ececec">faithfulness metric</text>
  <text x="32" y="180" font-size="12" fill="#a8a8a8">2022</text>
  <rect x="20" y="210" width="150" height="52" rx="8" fill="#101010" stroke="#3a3a3a"/>
  <text x="32" y="232" font-size="13" fill="#ececec">retrieval survey</text>
  <text x="32" y="250" font-size="12" fill="#a8a8a8">2023</text>
  <line x1="170" y1="96" x2="252" y2="150" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="170" y1="166" x2="252" y2="170" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="170" y1="236" x2="252" y2="196" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="252" y="128" width="176" height="92" rx="10" fill="#101010" stroke="#f0b429" stroke-width="1.5"/>
  <text x="268" y="156" font-size="12" fill="#f0b429" font-weight="700" letter-spacing="1.5">SEED PAPERS</text>
  <text x="268" y="182" font-size="14" fill="#ececec">RAG eval paper A</text>
  <text x="268" y="204" font-size="14" fill="#ececec">RAG eval paper B</text>
  <line x1="428" y1="150" x2="510" y2="96" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="428" y1="170" x2="510" y2="166" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="428" y1="196" x2="510" y2="236" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="500" y="30" font-size="12" fill="#f0b429" font-weight="700" letter-spacing="1.5">FORWARD: CITATIONS</text>
  <text x="500" y="48" font-size="12" fill="#a8a8a8">who built on the seeds</text>
  <rect x="510" y="70" width="150" height="52" rx="8" fill="#101010" stroke="#3a3a3a"/>
  <text x="522" y="92" font-size="13" fill="#ececec">long-context RAG</text>
  <text x="522" y="110" font-size="12" fill="#a8a8a8">2024, cites A</text>
  <rect x="510" y="140" width="150" height="52" rx="8" fill="#101010" stroke="#3a3a3a"/>
  <text x="522" y="162" font-size="13" fill="#ececec">judge calibration</text>
  <text x="522" y="180" font-size="12" fill="#a8a8a8">2024, cites B</text>
  <rect x="510" y="210" width="150" height="52" rx="8" fill="#101010" stroke="#3a3a3a" stroke-dasharray="5 4"/>
  <text x="522" y="232" font-size="13" fill="#ececec">DB-grounded gen</text>
  <text x="522" y="250" font-size="12" fill="#a8a8a8">2023, 3 citations</text>
  <rect x="20" y="296" width="640" height="100" rx="10" fill="#0d0d0d" stroke="#f0b429" stroke-dasharray="5 4"/>
  <text x="36" y="324" font-size="12" fill="#f0b429" font-weight="700" letter-spacing="1.5">THE GAP (ONE PARAGRAPH)</text>
  <text x="36" y="350" font-size="14" fill="#ececec">Every faithfulness paper measures on Wikipedia-style QA.</text>
  <text x="36" y="372" font-size="14" fill="#ececec">None measures on support conversations with order numbers.</text>
</svg>
