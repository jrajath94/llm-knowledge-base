<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="260" fill="#0d0d0d" rx="8"/>
  <!-- step 1: question -->
  <rect x="20" y="80" width="150" height="100" fill="#141414" stroke="#262626" rx="6"/>
  <text x="95" y="112" fill="#f0b429" font-size="13" font-weight="700" text-anchor="middle">1. Question</text>
  <text x="95" y="138" fill="#ececec" font-size="12" text-anchor="middle">"What is our</text>
  <text x="95" y="156" fill="#ececec" font-size="12" text-anchor="middle">refund policy?"</text>
  <line x1="170" y1="130" x2="210" y2="130" stroke="#f0b429" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 2: find -->
  <rect x="210" y="60" width="180" height="140" fill="#141414" stroke="#262626" rx="6"/>
  <text x="300" y="92" fill="#f0b429" font-size="13" font-weight="700" text-anchor="middle">2. Find relevant pages</text>
  <g fill="#1a1a1a" stroke="#3a3a3a">
    <rect x="235" y="105" width="46" height="60" rx="3"/><rect x="287" y="105" width="46" height="60" rx="3"/><rect x="339" y="105" width="46" height="60" rx="3"/>
  </g>
  <rect x="287" y="105" width="46" height="60" fill="none" stroke="#45b8ac" stroke-width="3" rx="3"/>
  <text x="300" y="190" fill="#a8a8a8" font-size="11" text-anchor="middle">the one page that answers it</text>
  <line x1="390" y1="130" x2="430" y2="130" stroke="#f0b429" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 3: paste into prompt -->
  <rect x="430" y="60" width="200" height="140" fill="#141414" stroke="#262626" rx="6"/>
  <text x="530" y="92" fill="#f0b429" font-size="13" font-weight="700" text-anchor="middle">3. Paste into the prompt</text>
  <rect x="450" y="105" width="160" height="30" fill="#1f2a33" stroke="#6cb2ff" rx="4"/>
  <text x="530" y="125" fill="#ececec" font-size="11" text-anchor="middle">Question + the found page</text>
  <text x="530" y="160" fill="#a8a8a8" font-size="11" text-anchor="middle">"Using this page, answer:</text>
  <text x="530" y="176" fill="#a8a8a8" font-size="11" text-anchor="middle">what is our refund policy?"</text>
  <line x1="630" y1="130" x2="670" y2="130" stroke="#f0b429" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 4: answer -->
  <rect x="670" y="80" width="210" height="100" fill="#141414" stroke="#262626" rx="6"/>
  <text x="775" y="112" fill="#f0b429" font-size="13" font-weight="700" text-anchor="middle">4. Grounded answer</text>
  <text x="775" y="138" fill="#ececec" font-size="12" text-anchor="middle">"30 days, per page 2</text>
  <text x="775" y="156" fill="#ececec" font-size="12" text-anchor="middle">of the policy doc."</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker></defs>
</svg>
