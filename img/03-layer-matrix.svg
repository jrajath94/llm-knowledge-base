<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>A layer is many neurons in parallel: z = Wx + b</text><circle cx='110' cy='100' r='30' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='110' y='105' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>n1</text><text x='40' y='105' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>x</text><line x1='140' y1='100' x2='230' y2='140' stroke='#1565c0' stroke-width='3'/><polygon points='230.0,140.0 221.1,141.1 224.8,132.6' fill='#1565c0'/><circle cx='110' cy='180' r='30' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='110' y='185' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>n2</text><text x='40' y='185' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>x</text><line x1='140' y1='180' x2='230' y2='160' stroke='#1565c0' stroke-width='3'/><polygon points='230.0,160.0 223.5,166.2 221.5,157.1' fill='#1565c0'/><circle cx='110' cy='260' r='30' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='110' y='265' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>n3</text><text x='40' y='265' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>x</text><line x1='140' y1='260' x2='230' y2='180' stroke='#1565c0' stroke-width='3'/><polygon points='230.0,180.0 227.3,188.6 221.2,181.7' fill='#1565c0'/><rect x='240' y='90' width='150' height='170' rx='8' fill='#0d0d0d' stroke='#6cb2ff' stroke-width='2'/><text x='315' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#6cb2ff' text-anchor='middle'>W</text><text x='315' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>row 1: neuron 1 weights</text><text x='315' y='178' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>row 2: neuron 2 weights</text><text x='315' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>row 3: neuron 3 weights</text><text x='315' y='248' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>one row per neuron</text><line x1='390' y1='175' x2='450' y2='175' stroke='#f0b429' stroke-width='3'/><polygon points='450.0,175.0 442.3,179.6 442.3,170.4' fill='#f0b429'/><rect x='450' y='90' width='120' height='170' rx='8' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='510' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#f0b429' text-anchor='middle'>z</text><text x='510' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>+ b</text><text x='510' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>ReLU</text><text x='510' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>elementwise</text><text x='930' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='end'>Hidden layers re-represent the data:</text><text x='930' y='178' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='end'>later layers read learned features,</text><text x='930' y='200' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='end'>not raw inputs.</text><text x='930' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='end'>The network computes every neuron at once</text><text x='930' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='end'>because the math is one matrix operation.</text></svg>