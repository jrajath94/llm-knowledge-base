<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">ZeRO stages on a 7B model across 8 GPUs</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Memory per GPU. Each stage shards one more pile of the 16-byte bill.</text>
<line x1="60" y1="300" x2="820" y2="300" stroke="#4a4a4a" stroke-width="1.5"/>
<rect x="90" y="80.0" width="120" height="220.0" fill="#e06c75" rx="4"/>
<text x="150" y="110" font-size="16" font-weight="bold" fill="#0d0d0d" text-anchor="middle">112 GB</text>
<text x="150" y="326" font-size="14" fill="#ececec" text-anchor="middle">DDP</text>
<text x="150" y="348" font-size="12" fill="#8a8a8a" text-anchor="middle">nothing sharded</text>
<rect x="280" y="224.4" width="120" height="75.6" fill="#f0b429" rx="4"/>
<text x="340" y="212.4" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">38.5 GB</text>
<text x="340" y="326" font-size="14" fill="#ececec" text-anchor="middle">ZeRO-1</text>
<text x="340" y="348" font-size="12" fill="#8a8a8a" text-anchor="middle">optimizer states</text>
<rect x="470" y="248.3" width="120" height="51.7" fill="#6cb2ff" rx="4"/>
<text x="530" y="236.3" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">26.3 GB</text>
<text x="530" y="326" font-size="14" fill="#ececec" text-anchor="middle">ZeRO-2</text>
<text x="530" y="348" font-size="12" fill="#8a8a8a" text-anchor="middle">+ gradients</text>
<rect x="660" y="272.5" width="120" height="27.5" fill="#7dd87d" rx="4"/>
<text x="720" y="260.5" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">14.0 GB</text>
<text x="720" y="326" font-size="14" fill="#ececec" text-anchor="middle">ZeRO-3</text>
<text x="720" y="348" font-size="12" fill="#8a8a8a" text-anchor="middle">+ parameters</text>
<text x="24" y="392" font-size="13" fill="#f0b429">Rule of thumb: pick the lowest stage that fits. ZeRO-3 costs about 1.5x the communication of DDP.</text>
</svg>