<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300' width='100%' style='max-width:900px;background-color:transparent' role='img'><style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.g{fill:#f0b429}.b{fill:#6cb2ff}.r{fill:#e57373}.gr{fill:#7fc97f}</style><defs><marker id='ah2' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6' fill='none' stroke='#a8a8a8' stroke-width='1.5'/></marker></defs><rect x='40' y='40' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='52' y='62' font-size='13' font-weight='700'>GPU0</text><rect x='52' y='70' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='80' y='70' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='108' y='70' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='136' y='70' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><line x1='170' y1='68.0' x2='190' y2='68.0' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ah2)'/><rect x='190' y='40' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='202' y='62' font-size='13' font-weight='700'>GPU1</text><rect x='202' y='70' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='230' y='70' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='258' y='70' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='286' y='70' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><line x1='320' y1='68.0' x2='340' y2='68.0' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ah2)'/><rect x='340' y='40' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='352' y='62' font-size='13' font-weight='700'>GPU2</text><rect x='352' y='70' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='380' y='70' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='408' y='70' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='436' y='70' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><line x1='470' y1='68.0' x2='490' y2='68.0' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ah2)'/><rect x='490' y='40' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='502' y='62' font-size='13' font-weight='700'>GPU3</text><rect x='502' y='70' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='530' y='70' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='558' y='70' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='586' y='70' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><path d='M 26 68.0 C 0 68.0, 0 68.0, 26 68.0' stroke='#a8a8a8' stroke-width='2' fill='none' marker-end='url(#ah2)'/><text x='40' y='120' font-size='14' font-weight='700' class='g'>Phase 1: reduce-scatter.</text><text x='40' y='140' font-size='13' class='m'>Each GPU sums one chunk around the ring. After 3 steps every GPU holds one fully reduced chunk.</text><rect x='40' y='170' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='52' y='192' font-size='13' font-weight='700'>GPU0</text><rect x='52' y='200' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='80' y='200' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='108' y='200' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='136' y='200' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><line x1='170' y1='198.0' x2='190' y2='198.0' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ah2)'/><rect x='190' y='170' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='202' y='192' font-size='13' font-weight='700'>GPU1</text><rect x='202' y='200' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='230' y='200' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='258' y='200' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='286' y='200' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><line x1='320' y1='198.0' x2='340' y2='198.0' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ah2)'/><rect x='340' y='170' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='352' y='192' font-size='13' font-weight='700'>GPU2</text><rect x='352' y='200' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='380' y='200' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='408' y='200' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='436' y='200' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><line x1='470' y1='198.0' x2='490' y2='198.0' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ah2)'/><rect x='490' y='170' width='130' height='56' rx='6' fill='#141414' stroke='#a8a8a8' stroke-width='1.5'/><text x='502' y='192' font-size='13' font-weight='700'>GPU3</text><rect x='502' y='200' width='24' height='14' rx='2' fill='#6cb2ff' opacity='0.9'/><rect x='530' y='200' width='24' height='14' rx='2' fill='#7fc97f' opacity='0.9'/><rect x='558' y='200' width='24' height='14' rx='2' fill='#f0b429' opacity='0.9'/><rect x='586' y='200' width='24' height='14' rx='2' fill='#e57373' opacity='0.9'/><path d='M 26 198.0 C 0 198.0, 0 198.0, 26 198.0' stroke='#a8a8a8' stroke-width='2' fill='none' marker-end='url(#ah2)'/><text x='40' y='250' font-size='14' font-weight='700' class='b'>Phase 2: all-gather.</text><text x='40' y='270' font-size='13' class='m'>Each GPU broadcasts its reduced chunk around the ring. Everyone ends with all four reduced chunks.</text><text x='40' y='292' font-size='13' class='m'>Bandwidth-optimal: each GPU sends 2*(N-1)/N * bytes. Tree wins only when latency, not bytes, dominates.</text></svg>