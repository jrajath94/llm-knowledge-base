<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 500' role='img'><rect x='0' y='0' width='880' height='500' fill='#0d0d0d' rx='8'/><text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>What AdamW stores for every single parameter</text><text x='24' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#8a8a8a'>the optimizer states dwarf the weights. this is why training needs so much memory</text><rect x='120' y='130' width='106.66666666666667' height='54' fill='#6cb2ff' rx='4'/><text x='173.33333333333334' y='162.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#0d0d0d' text-anchor='middle'>2 B</text><text x='173.33333333333334' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6cb2ff' text-anchor='middle'>weight</text><rect x='226.66666666666669' y='130' width='106.66666666666667' height='54' fill='#f0b429' rx='4'/><text x='280.0' y='162.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#0d0d0d' text-anchor='middle'>2 B</text><text x='280.0' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#f0b429' text-anchor='middle'>gradient</text><rect x='333.33333333333337' y='130' width='213.33333333333334' height='54' fill='#7fd08a' rx='4'/><text x='440.00000000000006' y='162.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#0d0d0d' text-anchor='middle'>4 B</text><text x='440.00000000000006' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#7fd08a' text-anchor='middle'>m (1st moment)</text><rect x='546.6666666666667' y='130' width='213.33333333333334' height='54' fill='#4db6ac' rx='4'/><text x='653.3333333333334' y='162.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#0d0d0d' text-anchor='middle'>4 B</text><text x='653.3333333333334' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#4db6ac' text-anchor='middle'>v (2nd moment)</text><text x='440.0' y='114' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>12 bytes per parameter (bf16 weights)</text><text x='24' y='286' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>weights</text><rect x='120' y='266' width='160' height='28' fill='#6cb2ff' rx='4'/><text x='290.0' y='286' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#6cb2ff' text-anchor='start'>14 GB</text><text x='24' y='338' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>gradients</text><rect x='120' y='318' width='160' height='28' fill='#f0b429' rx='4'/><text x='290.0' y='338' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='start'>14 GB</text><text x='24' y='390' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>optimizer states (m + v)</text><rect x='120' y='370' width='640' height='28' fill='#7fd08a' rx='4'/><text x='770.0' y='390' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#7fd08a' text-anchor='start'>56 GB</text><text x='24' y='460' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Activations add tens of GB more on top. This is the memory math behind Figure 4.4.</text></svg>