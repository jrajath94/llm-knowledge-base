<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The million-dollar planning problem</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">one fixed compute budget, two ways to split it between model and data</text>
<text x="24" y="94" font-size="15" font-weight="bold" fill="#ececec" text-anchor="start">fixed budget C</text>
<text x="24" y="118" font-size="13" fill="#8a8a8a" text-anchor="start">two split strategies, one winner</text>
<rect x="24" y="138" width="390" height="150" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6"/>
<text x="219" y="168" font-size="14" font-weight="bold" fill="#f0b429" text-anchor="middle">Kaplan (2020) answer</text>
<text x="219" y="196" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">N huge, D small</text>
<text x="219" y="222" font-size="12" fill="#a8a8a8" text-anchor="middle">biggest model affordable;</text>
<text x="219" y="242" font-size="12" fill="#a8a8a8" text-anchor="middle">bigger models, early stopping</text>
<text x="219" y="266" font-size="12" fill="#8a8a8a" text-anchor="middle">Gopher: 280B on 300B tokens</text>
<rect x="440" y="138" width="416" height="150" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6"/>
<text x="648" y="168" font-size="14" font-weight="bold" fill="#7dd87d" text-anchor="middle">Chinchilla (2022) answer</text>
<text x="648" y="196" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">N and D grow equally</text>
<text x="648" y="222" font-size="12" fill="#a8a8a8" text-anchor="middle">~20 tokens per parameter</text>
<text x="648" y="242" font-size="12" fill="#a8a8a8" text-anchor="middle">scale model and data together</text>
<text x="648" y="266" font-size="12" fill="#8a8a8a" text-anchor="middle">Chinchilla: 70B on 1.4T, won at equal FLOPs</text>
<text x="24" y="328" font-size="13" fill="#a8a8a8" text-anchor="start">The experiment that settled it: Chinchilla (70B, 1.4T) beat Gopher (280B, 300B) on nearly every benchmark</text>
<text x="24" y="352" font-size="13" fill="#ececec" text-anchor="start">at the same training compute. Gopher was massively undertrained at ~1 token per parameter.</text>
</svg>