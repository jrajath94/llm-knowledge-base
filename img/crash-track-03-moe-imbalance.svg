<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="100%" style="max-width:680px" role="img" aria-label="MoE expert imbalance bar chart: expert 3 receives 40 percent of tokens while seven experts idle">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">One hot expert sets the pace for all eight</text>
<text class="m" x="24" y="52">Routing is never uniform. The hottest rank sets the whole layer step time.</text>
<rect x="90" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="114" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="114" y="322" text-anchor="middle">E1</text>
<rect x="158" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="182" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="182" y="322" text-anchor="middle">E2</text>
<rect x="226" y="92" width="48" height="208" rx="4" fill="#e57373" opacity="0.85"/>
<text class="num" x="250" y="84" text-anchor="middle">40.0%</text>
<text class="lbl" x="250" y="322" text-anchor="middle">E3</text>
<rect x="294" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="318" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="318" y="322" text-anchor="middle">E4</text>
<rect x="362" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="386" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="386" y="322" text-anchor="middle">E5</text>
<rect x="430" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="454" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="454" y="322" text-anchor="middle">E6</text>
<rect x="498" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="522" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="522" y="322" text-anchor="middle">E7</text>
<rect x="566" y="256" width="48" height="44" rx="4" fill="#6cb2ff" opacity="0.85"/>
<text class="num" x="590" y="248" text-anchor="middle">8.5%</text>
<text class="lbl" x="590" y="322" text-anchor="middle">E8</text>
<line class="ax" x1="70" y1="300" x2="640" y2="300"/>
<text class="m" x="70" y="344">share of tokens per expert</text>
<rect class="box" x="24" y="360" width="632" height="56" rx="8"/>
<text class="m" x="40" y="384">The fix is not faster experts. It is spreading the hot expert load. Alert when imbalance crosses ~2x.</text>
<text class="m" x="40" y="404">Cost truth: only 37B of 671B parameters activate per token, but all experts must live on GPUs.</text>
</svg>
