<line x1='342' y1='220' x2='398' y2='220' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<circle cx='430' cy='220' r='30' fill='#c0392b' fill-opacity='0.25' stroke='#c0392b' stroke-width='2.5'/>
<text x='430' y='227' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>4</text>
<line x1='462' y1='220' x2='518' y2='220' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<circle cx='550' cy='220' r='30' fill='#f0b429' fill-opacity='0.25' stroke='#f0b429' stroke-width='2.5'/>
