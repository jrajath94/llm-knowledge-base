<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 520' width='100%' role='img'>
<title>Trajectory analysis: reading one run well</title>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a8a8'/></marker></defs>
<text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Trajectory analysis: reading one run well</text>
<text x='480' y='64' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#a8a8a8' text-anchor='middle'>One failed run, eight steps. Find the first wrong step, not the loudest error.</text>
