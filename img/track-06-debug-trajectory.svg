<text x='190' y='227' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>2</text>
<line x1='222' y1='220' x2='278' y2='220' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
