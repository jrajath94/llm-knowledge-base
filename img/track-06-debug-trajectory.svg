<circle cx='670' cy='220' r='30' fill='#f0b429' fill-opacity='0.25' stroke='#f0b429' stroke-width='2.5'/>
<text x='670' y='227' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>6</text>
<line x1='702' y1='220' x2='758' y2='220' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<circle cx='790' cy='220' r='30' fill='#f0b429' fill-opacity='0.25' stroke='#f0b429' stroke-width='2.5'/>
<text x='790' y='227' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>7</text>
<line x1='822' y1='220' x2='878' y2='220' stroke='#a8a8a8' stroke-width='2' marker-end='url(#ar)'/>
<circle cx='910' cy='220' r='30' fill='#c0392b' fill-opacity='0.25' stroke='#c0392b' stroke-width='2.5'/>
<text x='910' y='227' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>8</text>
<text x='430' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#c0392b'>step 4: first wrong step (bad tool args)</text>
<text x='430' y='324' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>steps 5-7: the agent recovers poorly, burning budget</text>
<text x='430' y='348' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>step 8: loud failure, but the cause is step 4</text>
<text x='480' y='470' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>Green: good step. Red: wrong step or failure. Amber: wasted recovery. Fix step 4, not step 8.</text>
</svg>