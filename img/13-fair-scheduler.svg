</defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Weighted Fair Scheduling (3:1)</text>
<text x="50" y="80" font-size="12" style="fill:#ececec">Time:</text>
<rect x="100" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="130" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">C</text>
<rect x="165" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="195" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">C</text>
<rect x="230" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="260" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">C</text>
<rect x="295" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="325" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">D</text>
<rect x="360" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="390" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">C</text>
<rect x="425" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="455" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">C</text>
<rect x="490" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="520" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">C</text>
<rect x="555" y="60" width="60" height="40" fill="#141414" stroke="#8a8a8a" />
<text x="585" y="85" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#ececec">D</text>
<text x="350" y="140" text-anchor="middle" font-size="12" fill="#a8a8a8">C gets 75%. D gets 25%. D never starves.</text>
<text x="350" y="165" text-anchor="middle" font-size="12" fill="#a8a8a8">Smooth: spread out, not clumped.</text>
