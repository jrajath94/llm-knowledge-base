<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="sans-serif">
<rect width="700" height="400" fill="#ffffff"/>
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
</marker>
</defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">Weighted Fair Scheduling (3:1)</text>
<text x="50" y="80" font-size="12">Time:</text>
<rect x="100" y="60" width="60" height="40" fill="#e8f0fe" stroke="#333"/>
<text x="130" y="85" text-anchor="middle" font-size="14" font-weight="bold">C</text>
<rect x="165" y="60" width="60" height="40" fill="#e8f0fe" stroke="#333"/>
<text x="195" y="85" text-anchor="middle" font-size="14" font-weight="bold">C</text>
<rect x="230" y="60" width="60" height="40" fill="#e8f0fe" stroke="#333"/>
<text x="260" y="85" text-anchor="middle" font-size="14" font-weight="bold">C</text>
<rect x="295" y="60" width="60" height="40" fill="#fce8e6" stroke="#333"/>
<text x="325" y="85" text-anchor="middle" font-size="14" font-weight="bold">D</text>
<rect x="360" y="60" width="60" height="40" fill="#e8f0fe" stroke="#333"/>
<text x="390" y="85" text-anchor="middle" font-size="14" font-weight="bold">C</text>
<rect x="425" y="60" width="60" height="40" fill="#e8f0fe" stroke="#333"/>
<text x="455" y="85" text-anchor="middle" font-size="14" font-weight="bold">C</text>
<rect x="490" y="60" width="60" height="40" fill="#e8f0fe" stroke="#333"/>
<text x="520" y="85" text-anchor="middle" font-size="14" font-weight="bold">C</text>
<rect x="555" y="60" width="60" height="40" fill="#fce8e6" stroke="#333"/>
<text x="585" y="85" text-anchor="middle" font-size="14" font-weight="bold">D</text>
<text x="350" y="140" text-anchor="middle" font-size="12" fill="#555">C gets 75%. D gets 25%. D never starves.</text>
<text x="350" y="165" text-anchor="middle" font-size="12" fill="#555">Smooth: spread out, not clumped.</text>
</svg>
