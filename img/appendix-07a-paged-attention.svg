<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="500" fill="#0d0d0d"/>
<text x="450" y="34" text-anchor="middle" fill="#ececec" font-size="20" font-weight="600">PagedAttention: pages, not slabs</text>

<!-- LEFT: fragmented -->
<text x="225" y="66" text-anchor="middle" fill="#e08080" font-size="15" font-weight="600">contiguous KV cache: fragmentation</text>
<g font-size="11">
<rect x="60" y="100" width="330" height="40" rx="4" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="225" y="124" text-anchor="middle" fill="#a8a8a8">reserved slab for seq A (max length)</text>
<rect x="60" y="100" width="110" height="40" rx="4" fill="#6cb2ff" opacity="0.7"/>
<text x="115" y="124" text-anchor="middle" fill="#0d0d0d">used</text>
<rect x="170" y="100" width="220" height="40" rx="4" fill="none" stroke="#e08080" stroke-dasharray="4,3"/>
<text x="280" y="124" text-anchor="middle" fill="#e08080">reserved, empty</text>

<rect x="60" y="150" width="330" height="40" rx="4" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="225" y="174" text-anchor="middle" fill="#a8a8a8">reserved slab for seq B (max length)</text>
<rect x="60" y="150" width="60" height="40" rx="4" fill="#6cb2ff" opacity="0.7"/>
<text x="90" y="174" text-anchor="middle" fill="#0d0d0d">used</text>
<rect x="120" y="150" width="270" height="40" rx="4" fill="none" stroke="#e08080" stroke-dasharray="4,3"/>
<text x="255" y="174" text-anchor="middle" fill="#e08080">reserved, empty</text>

<rect x="60" y="200" width="330" height="40" rx="4" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="225" y="224" text-anchor="middle" fill="#a8a8a8">reserved slab for seq C (max length)</text>
<rect x="60" y="200" width="200" height="40" rx="4" fill="#6cb2ff" opacity="0.7"/>
<text x="160" y="224" text-anchor="middle" fill="#0d0d0d">used</text>
<rect x="260" y="200" width="130" height="40" rx="4" fill="none" stroke="#e08080" stroke-dasharray="4,3"/>
<text x="325" y="224" text-anchor="middle" fill="#e08080">empty</text>
</g>
<text x="225" y="272" text-anchor="middle" fill="#e08080" font-size="12">each sequence reserves its worst case</text>
<text x="225" y="292" text-anchor="middle" fill="#a8a8a8" font-size="12">half-empty slabs block new sequences</text>

<line x1="460" y1="60" x2="460" y2="310" stroke="#3a3a3a"/>

<!-- RIGHT: paged -->
<text x="680" y="66" text-anchor="middle" fill="#7fd08a" font-size="15" font-weight="600">paged: fixed-size blocks</text>
<g font-size="11">
<text x="520" y="104" fill="#a8a8a8">seq A:</text>
<rect x="570" y="90" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="624" y="90" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="678" y="90" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.5"/>
<rect x="732" y="90" width="50" height="28" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<text x="810" y="108" fill="#a8a8a8">2.5 pages</text>

<text x="520" y="144" fill="#a8a8a8">seq B:</text>
<rect x="570" y="130" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="624" y="130" width="50" height="28" rx="3" fill="#1a1a1a" stroke="#3a3a3a" stroke-dasharray="3,3"/>
<text x="700" y="148" fill="#a8a8a8">1 page</text>

<text x="520" y="184" fill="#a8a8a8">seq C:</text>
<rect x="570" y="170" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="624" y="170" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="678" y="170" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="732" y="170" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="786" y="170" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.5"/>
<text x="845" y="188" fill="#a8a8a8">4.5</text>

<text x="520" y="224" fill="#a8a8a8">seq D:</text>
<rect x="570" y="210" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<rect x="624" y="210" width="50" height="28" rx="3" fill="#7fd08a" opacity="0.8"/>
<text x="700" y="228" fill="#a8a8a8">2 pages</text>
</g>
<text x="680" y="272" text-anchor="middle" fill="#7fd08a" font-size="12">short sequences use few blocks, long ones use many</text>
<text x="680" y="292" text-anchor="middle" fill="#a8a8a8" font-size="12">no half-empty reserved slab: more sequences fit per GPU</text>

<rect x="60" y="330" width="780" height="130" rx="8" fill="#141414" stroke="#3a3a3a"/>
<text x="450" y="358" text-anchor="middle" fill="#ececec" font-size="14" font-weight="600">the analogy</text>
<text x="450" y="384" text-anchor="middle" fill="#a8a8a8" font-size="13">like virtual memory in an OS: the KV cache is split into fixed-size pages,</text>
<text x="450" y="406" text-anchor="middle" fill="#a8a8a8" font-size="13">allocated on demand, freed when the sequence ends</text>
<text x="450" y="438" text-anchor="middle" fill="#7fd08a" font-size="13">directly raises tokens per second: concurrency is the throughput lever</text>
</svg>
