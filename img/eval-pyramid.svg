<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 470' width='100%' style='max-width:900px;background-color:transparent' role='img'><style>text{font-family='Inter,system-ui,-apple-system,sans-serif';fill:#ececec}.m{fill:#a8a8a8}.g{fill:#f0b429}.b{fill:#6cb2ff}.r{fill:#e57373}.gr{fill:#7fc97f}</style><polygon points='200,60 320,60 400,200 120,200' fill='#141414' stroke='#e57373' stroke-width='2'/><text x='260' y='126' font-size='14' text-anchor='middle' font-weight='700' fill='#e57373'>Tier 3 - Safety and red-team</text><text x='260' y='146' font-size='12' text-anchor='middle' class='m'>adversarial, per family; expensive, deep</text><polygon points='120,200 400,200 480,330 40,330' fill='#141414' stroke='#f0b429' stroke-width='2'/><text x='260' y='261' font-size='14' text-anchor='middle' font-weight='700' fill='#f0b429'>Tier 2 - Custom task evals</text><text x='260' y='281' font-size='12' text-anchor='middle' class='m'>your real prompts; calibrated judge or humans</text><polygon points='40,330 480,330 560,450 -40,450' fill='#141414' stroke='#7fc97f' stroke-width='2'/><text x='260' y='386' font-size='14' text-anchor='middle' font-weight='700' fill='#7fc97f'>Tier 1 - Capability benchmarks</text><text x='260' y='406' font-size='12' text-anchor='middle' class='m'>standard suites; run on every change; cheap</text><text x='580' y='140' font-size='13' class='m' text-anchor='start'>depth</text><line x1='560' y1='120' x2='560' y2='420' stroke='#a8a8a8' stroke-width='1.5'/><polygon points='560,110 552,126 568,126' fill='#a8a8a8'/><text x='560' y='445' font-size='13' class='m' text-anchor='middle'>frequency</text><line x1='-70' y1='420' x2='60' y2='420' stroke='#a8a8a8' stroke-width='1.5'/><polygon points='60,420 44,412 44,428' fill='#a8a8a8'/><text x='20' y='462' font-size='13' class='r' font-weight='700'>Rule 1: never merge the tiers. A capability win next to a safety regression is not a win.</text></svg>