<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='100%' role='img'>
<title>Discovery question bank funnel</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The discovery question bank: wide questions, five clusters</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Ask wide in the first workshop; take notes verbatim. The exact words matter later.</text>
<polygon points='130,120 830,120 630.0,320 330.0,320' fill='#1565c0' fill-opacity='0.18' stroke='#1565c0' stroke-width='2'/>
<text x='480' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the bank: walk me through it, show me</text>
<text x='480' y='184' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>a perfect result, show me the worst</text>
<text x='480' y='208' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>one, how do you check quality today</text>
<rect x='90' y='345' width='140' height='70' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='160' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Where time goes</text>
<rect x='246' y='345' width='140' height='70' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='316' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>What good looks like</text>
<rect x='402' y='345' width='140' height='70' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='472' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Failure modes</text>
<rect x='558' y='345' width='140' height='70' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='628' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Current quality check</text>
<rect x='714' y='345' width='140' height='70' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='784' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Constraints</text>
<text x='480' y='106' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'></text>
</svg>