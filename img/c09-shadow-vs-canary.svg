<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 515" role="img" aria-label="Shadow vs canary: what each stage buys">
<rect width="900" height="515" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Shadow vs canary: what each stage buys</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Shadow asks: does it survive reality? Canary asks: does the business metric hold?</text>
<text x="40.0" y="89.0" text-anchor="start" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">SHADOW: observe only, users untouched</text>
<rect x="40.0" y="103.0" width="220.0" height="54.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="125.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">live request</text>
<text x="60.0" y="143.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">goes to user</text>
<line x1="275.0" y1="130.0" x2="310.0" y2="130.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="310.0" y1="130.0" x2="301.8" y2="133.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="310.0" y1="130.0" x2="301.8" y2="126.3" stroke="#ececec" stroke-width="1.8"/>
<rect x="310.0" y="103.0" width="220.0" height="54.0" rx="6" fill="#141414" stroke="#2dd4bf" stroke-width="1"/>
<text x="330.0" y="125.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">production model</text>
<text x="330.0" y="143.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">serves the user</text>
<line x1="240.0" y1="163.0" x2="240.0" y2="199.0" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="240.0" y1="199.0" x2="236.3" y2="190.8" stroke="#8a8a8a" stroke-width="1.8"/>
<line x1="240.0" y1="199.0" x2="243.7" y2="190.8" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="252.0" y="191.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">duplicate</text>
<rect x="40.0" y="199.0" width="490.0" height="54.0" rx="6" fill="#101010" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="5,4"/>
<text x="60.0" y="221.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">shadow model scores a copy; both predictions logged</text>
<text x="60.0" y="241.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">nothing the shadow says reaches a customer</text>
<text x="40.0" y="293.0" text-anchor="start" fill="#f0b429" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">CANARY: a small live slice, watched hard</text>
<rect x="40.0" y="307.0" width="180.0" height="54.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="329.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">1 to 5% of</text>
<text x="60.0" y="347.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">live traffic</text>
<line x1="235.0" y1="334.0" x2="270.0" y2="334.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="270.0" y1="334.0" x2="261.8" y2="337.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="270.0" y1="334.0" x2="261.8" y2="330.3" stroke="#ececec" stroke-width="1.8"/>
<rect x="270.0" y="307.0" width="260.0" height="54.0" rx="6" fill="#141414" stroke="#f0b429" stroke-width="1"/>
<text x="290.0" y="329.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">candidate serves real users</text>
<text x="290.0" y="347.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">vs the production baseline</text>
<rect x="40.0" y="371.0" width="270.0" height="52.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="54.0" y="393.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">guardrail: Business</text>
<text x="54.0" y="411.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">conversion, fraud loss</text>
<rect x="330.0" y="371.0" width="270.0" height="52.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="344.0" y="393.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">guardrail: Model</text>
<text x="344.0" y="411.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">prediction dist., calibration</text>
<rect x="620.0" y="371.0" width="270.0" height="52.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="634.0" y="393.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">guardrail: System</text>
<text x="634.0" y="411.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">p99, errors, cost/pred</text>
<text x="40.0" y="449.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Decision, as code: one tripped guardrail holds for human review. Two or more roll back immediately:</text>
<text x="40.0" y="465.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">correlated failures are never coincidence. Shadow runs at least one full business cycle; a canary</text>
<text x="40.0" y="481.4" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">with no baseline comparison is just a slow full rollout.</text>
</svg>
