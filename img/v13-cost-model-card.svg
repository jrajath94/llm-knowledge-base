<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Drill 5: the one-minute cost model (memorize this)"><rect x="22" y="14" width="916" height="298" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">COST MODEL</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Cost per 1k requests, from fleet size and throughput</text><rect x="179.61724218750004" y="94" width="600.7655156249999" height="68" rx="8" fill="#0d0d0d" stroke="#6cb2ff" stroke-opacity="0.45"/><text x="197.61724218750004" y="124" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">cost per 1k req = (GPUs x $/GPU-hr) / (req/s x 3.6)</text><text x="197.61724218750004" y="148" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">worked: 9 x $2.50 / (40 x 3.6) = $22.50 / 144 = $0.16</text><text x="38" y="180" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">GPUs</text><text x="242" y="180" font-size="13" fill="#a8a8a8">fleet size: 9 in the worked example</text><text x="38" y="203" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">$/GPU-hr</text><text x="242" y="203" font-size="13" fill="#a8a8a8">rental price: $2.50/hr illustrative</text><text x="38" y="226" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">req/s</text><text x="242" y="226" font-size="13" fill="#a8a8a8">served throughput: 40 in the worked example</text><text x="38" y="249" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">3.6</text><text x="242" y="249" font-size="13" fill="#a8a8a8">3,600 seconds per hour divided by 1,000 requests</text><text x="38" y="272" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">levers, in order</text><text x="242" y="272" font-size="13" fill="#a8a8a8">batching (20x), output length, KV-cache efficiency, precision, prefix caching, cheaper</text><text x="242" y="289" font-size="13" fill="#a8a8a8">GPUs</text></svg>