<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="GPT-3: the scaling arithmetic"><rect x="22" y="14" width="916" height="394" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">No new equation. The math that matters is the scale jump.</text><text x="38" y="116" font-size="13" font-weight="700" fill="#f0b429">Quantity</text><text x="303.2" y="116" font-size="13" font-weight="700" fill="#f0b429">GPT-2</text><text x="612.5999999999999" y="116" font-size="13" font-weight="700" fill="#f0b429">GPT-3</text><line x1="38" y1="120" x2="922" y2="120" stroke="#2e2e2e"/><text x="38" y="148" font-size="13" font-weight="700" fill="#ececec">Parameters</text><text x="303.2" y="148" font-size="13" fill="#a8a8a8">1.5B</text><text x="612.5999999999999" y="148" font-size="13" fill="#a8a8a8">175B (~117x)</text><line x1="38" y1="160" x2="922" y2="160" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="188" font-size="13" font-weight="700" fill="#ececec">Training tokens</text><text x="303.2" y="188" font-size="13" fill="#a8a8a8">~10B</text><text x="612.5999999999999" y="188" font-size="13" fill="#a8a8a8">300B (~30x)</text><line x1="38" y1="200" x2="922" y2="200" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="228" font-size="13" font-weight="700" fill="#ececec">Context window</text><text x="303.2" y="228" font-size="13" fill="#a8a8a8">1024</text><text x="612.5999999999999" y="228" font-size="13" fill="#a8a8a8">2048</text><line x1="38" y1="240" x2="922" y2="240" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="268" font-size="13" font-weight="700" fill="#ececec">Training compute</text><text x="303.2" y="268" font-size="13" fill="#a8a8a8">--</text><text x="612.5999999999999" y="268" font-size="13" fill="#a8a8a8">~3.14e23 FLOPs (reported)</text><line x1="38" y1="280" x2="922" y2="280" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="308" font-size="13" font-weight="700" fill="#ececec">Cost</text><text x="303.2" y="308" font-size="13" fill="#a8a8a8">--</text><text x="612.5999999999999" y="308" font-size="13" fill="#a8a8a8">~$4.6M in 2020 cloud prices</text><text x="612.5999999999999" y="328" font-size="13" fill="#a8a8a8">(illustrative)</text><line x1="38" y1="340" x2="922" y2="340" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="368" font-size="13" font-weight="700" fill="#ececec">Few-shot context</text><text x="303.2" y="368" font-size="13" fill="#a8a8a8">--</text><text x="612.5999999999999" y="368" font-size="13" fill="#a8a8a8">100 examples x ~20 tokens = 2000</text><text x="612.5999999999999" y="388" font-size="13" fill="#a8a8a8">tokens: few-shot REQUIRES long</text><text x="612.5999999999999" y="408" font-size="13" fill="#a8a8a8">context</text><line x1="38" y1="420" x2="922" y2="420" stroke="#2e2e2e" stroke-opacity="0.5"/></svg>