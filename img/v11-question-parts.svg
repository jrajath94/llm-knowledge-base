<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 227" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A good research question has four parts"><rect x="22" y="14" width="916" height="199" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">RESEARCH QUESTION</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">&quot;Make transformers better&quot; is not a question. This is:</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Phenomenon:</text><text x="189.36476562500002" y="94" font-size="13.5" fill="#a8a8a8">what you are studying. Example: factual errors in model answers.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Comparison:</text><text x="180.32609375" y="125" font-size="13.5" fill="#a8a8a8">what you change or compare against. Example: answers with and without a retrieval</text><text x="80" y="144" font-size="13.5" fill="#a8a8a8">step.</text><path d="M 53.7 170.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="175" font-size="13.5" font-weight="700" fill="#ececec">Measure:</text><text x="155.25828125" y="175" font-size="13.5" fill="#a8a8a8">how you will tell the difference. Example: error rate on a fixed set of questions.</text><path d="M 53.7 201.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="206" font-size="13.5" font-weight="700" fill="#ececec">Scope:</text><text x="135.917421875" y="206" font-size="13.5" fill="#a8a8a8">the boundary of your claim. Example: models under 10B parameters, English questions.</text></svg>