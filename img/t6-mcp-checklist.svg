<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 540' width='100%' role='img'>
<title>Building an MCP server: the checklist</title>
<text x='400' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Building an MCP server: the checklist</text>
<rect x='60' y='95' width='26' height='26' rx='6' fill='none' stroke='#2e9e5b' stroke-width='2.5'/>
<line x1='66' y1='108' x2='72' y2='114' stroke='#2e9e5b' stroke-width='3'/>
<line x1='72' y1='114' x2='82' y2='102' stroke='#2e9e5b' stroke-width='3'/>
<text x='100' y='114' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#ececec'>Pick one capability kind: tools, resources, or prompts</text>
<rect x='60' y='159' width='26' height='26' rx='6' fill='none' stroke='#2e9e5b' stroke-width='2.5'/>
<line x1='66' y1='172' x2='72' y2='178' stroke='#2e9e5b' stroke-width='3'/>
<line x1='72' y1='178' x2='82' y2='166' stroke='#2e9e5b' stroke-width='3'/>
<text x='100' y='178' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#ececec'>Write the initialize handshake first</text>
<rect x='60' y='223' width='26' height='26' rx='6' fill='none' stroke='#2e9e5b' stroke-width='2.5'/>
<line x1='66' y1='236' x2='72' y2='242' stroke='#2e9e5b' stroke-width='3'/>
<line x1='72' y1='242' x2='82' y2='230' stroke='#2e9e5b' stroke-width='3'/>
<text x='100' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#ececec'>Return JSON Schemas clients can validate against</text>
<rect x='60' y='287' width='26' height='26' rx='6' fill='none' stroke='#2e9e5b' stroke-width='2.5'/>
<line x1='66' y1='300' x2='72' y2='306' stroke='#2e9e5b' stroke-width='3'/>
<line x1='72' y1='306' x2='82' y2='294' stroke='#2e9e5b' stroke-width='3'/>
<text x='100' y='306' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#ececec'>Name tools like verbs: search_docs, not do_stuff</text>
<rect x='60' y='351' width='26' height='26' rx='6' fill='none' stroke='#2e9e5b' stroke-width='2.5'/>
<line x1='66' y1='364' x2='72' y2='370' stroke='#2e9e5b' stroke-width='3'/>
<line x1='72' y1='370' x2='82' y2='358' stroke='#2e9e5b' stroke-width='3'/>
<text x='100' y='370' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#ececec'>Log every invocation with inputs and latency</text>
<rect x='60' y='415' width='26' height='26' rx='6' fill='none' stroke='#2e9e5b' stroke-width='2.5'/>
<line x1='66' y1='428' x2='72' y2='434' stroke='#2e9e5b' stroke-width='3'/>
<line x1='72' y1='434' x2='82' y2='422' stroke='#2e9e5b' stroke-width='3'/>
<text x='100' y='434' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#ececec'>Ship the security review artifacts with it</text>
<text x='400' y='510' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>A checklist, because servers are built once and debugged forever.</text>
</svg>