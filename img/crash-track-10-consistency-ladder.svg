<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
<rect width="640" height="300" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Consistency per workload, not per database</text><rect x='30' y='70' width='230' height='52' rx='8' fill='none' stroke='#7bc98a' stroke-width='1.5'/><text x='145.0' y='101.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='middle'>LINEARIZABLE</text><text x='280' y='102' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>model artifacts, rollout config</text><rect x='30' y='140' width='230' height='52' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='145.0' y='171.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>TUNABLE W+R>N</text><text x='280' y='172' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>feature store online path, hot keys</text><rect x='30' y='210' width='230' height='52' rx='8' fill='none' stroke='#9a9a9a' stroke-width='1.5'/><text x='145.0' y='241.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#9a9a9a' text-anchor='middle'>IMMUTABLE SNAPSHOTS</text><text x='280' y='242' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>training data, no live consistency</text></svg>