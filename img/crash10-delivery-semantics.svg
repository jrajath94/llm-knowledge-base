<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='100%' role='img' aria-label='Delivery semantics: at-most-once, at-least-once, and effectively-once with their guarantees and prices'>
<text x='20' y='32' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Delivery semantics: name the guarantee honestly</text>
<rect x='20' y='60' width='920' height='72' rx='10' fill='#0d0d0d' stroke='#555' stroke-width='2'/>
<text x='44' y='92' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#a8a8a8'>at-most-once</text>
<text x='44' y='116' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>fire and forget. Fast, lossy. Metrics and logs can live here.</text>
<rect x='20' y='148' width='920' height='72' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/>
<text x='44' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#f0b429'>at-least-once</text>
<text x='44' y='204' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>retry until acknowledged. Nothing is lost, some things run twice. The default for anything important.</text>
<rect x='20' y='236' width='920' height='72' rx='10' fill='#0d0d0d' stroke='#2e7d32' stroke-width='2'/>
<text x='44' y='268' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#2e7d32'>effectively-once</text>
<text x='44' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>at-least-once delivery + idempotent receiver. The effect happens once even though delivery ran twice. This is what people mean by exactly-once.</text>
</svg>
