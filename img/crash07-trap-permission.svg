<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="540" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 4.3. Trap 5: the permission check in the wrong place</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">a prompt cannot stop an action; a tool wrapper can</text>
<rect x="24" y="110" width="400" height="150" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">WRONG: in the prompt</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">&quot;ask the user before refunding&quot;; the model may comply,</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">forget, or be talked out of it</text>
<rect x="456" y="110" width="400" height="150" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">RIGHT: in the tool layer</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the refund tool requires an approval token; no token,</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">no call, no debate</text>
<text x="440" y="320" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">enforcement lives with the side effect, not with the suggestion</text>
<text x="24" y="420" font-size="12" fill="#a8a8a8" text-anchor="start">Review gates on risky actions need a 4-hour queue SLA, or the queue becomes the reason people bypass the gate.</text>
<text x="24" y="470" font-size="12" fill="#a8a8a8" text-anchor="start">Audit: list every tool with a side effect and confirm each one checks permission in code.</text>
</svg>