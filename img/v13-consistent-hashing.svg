<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Consistent hashing: only the keys that must move, move"><rect x="22" y="14" width="916" height="300" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">CONSISTENT HASHING</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">hash mod N reshuffles everything when a server joins. The ring fixes it.</text><rect x="38" y="96" width="217.19027499999999" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">The ring</text><text x="54" y="144" font-size="12" fill="#a8a8a8">hash values form a clock</text><text x="54" y="160" font-size="12" fill="#a8a8a8">face; the max wraps to 0</text><line x1="265.190275" y1="144.0" x2="279.190275" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="279.190275,139.0 287.190275,144.0 279.190275,149.0" fill="#a8a8a8"/><rect x="295.190275" y="96" width="206.6344375" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="315.190275" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="315.190275" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="335.190275" y="123" font-size="13.5" font-weight="700" fill="#ececec">Place servers</text><text x="311.190275" y="144" font-size="12" fill="#a8a8a8">hash each server name</text><text x="311.190275" y="160" font-size="12" fill="#a8a8a8">onto the same ring</text><line x1="511.82471250000003" y1="144.0" x2="525.8247125" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="525.8247125,139.0 533.8247125,144.0 525.8247125,149.0" fill="#a8a8a8"/><rect x="541.8247125" y="96" width="226.916425" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="561.8247125" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="561.8247125" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="581.8247125" y="123" font-size="13.5" font-weight="700" fill="#ececec">Place keys</text><text x="557.8247125" y="144" font-size="12" fill="#a8a8a8">each key belongs to the</text><text x="557.8247125" y="160" font-size="12" fill="#a8a8a8">first server clockwise from</text><text x="557.8247125" y="176" font-size="12" fill="#a8a8a8">it</text><rect x="38" y="216" width="229.70196249999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="238" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="243" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="243" font-size="13.5" font-weight="700" fill="#ececec">Add a server</text><text x="54" y="264" font-size="12" fill="#a8a8a8">it takes only the keys</text><text x="54" y="280" font-size="12" fill="#a8a8a8">between itself and its</text><text x="54" y="296" font-size="12" fill="#a8a8a8">counterclockwise neighbor</text></svg>