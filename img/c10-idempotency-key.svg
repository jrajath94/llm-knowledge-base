<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 346" role="img" aria-label="Idempotency keys: make retries safe">
<rect width="900" height="346" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Idempotency keys: make retries safe</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">The client sends a unique key with the request. The server stores the result under the key, so a retry returns the stored result instead of doing the work</text>
<text x="450.0" y="59" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">twice.</text>
<rect x="70.0" y="92.0" width="160.0" height="100.0" rx="6" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="150.0" y="116.0" text-anchor="middle" fill="#2dd4bf" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">client</text>
<text x="150.0" y="140.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">generates key K</text>
<text x="150.0" y="158.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">sends pay(K)</text>
<rect x="280.0" y="92.0" width="160.0" height="100.0" rx="6" fill="#141414" stroke="#4aa8ff" stroke-width="2"/>
<text x="360.0" y="116.0" text-anchor="middle" fill="#4aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">server</text>
<text x="360.0" y="140.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">sees K first time:</text>
<text x="360.0" y="158.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">charges, stores result[K]</text>
<rect x="490.0" y="92.0" width="160.0" height="100.0" rx="6" fill="#141414" stroke="#ff9f43" stroke-width="2"/>
<text x="570.0" y="116.0" text-anchor="middle" fill="#ff9f43" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">retry</text>
<text x="570.0" y="140.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">same key K arrives</text>
<text x="570.0" y="158.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">(network hiccup)</text>
<rect x="700.0" y="92.0" width="160.0" height="100.0" rx="6" fill="#141414" stroke="#4caf50" stroke-width="2"/>
<text x="780.0" y="116.0" text-anchor="middle" fill="#4caf50" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">server</text>
<text x="780.0" y="140.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">sees K again:</text>
<text x="780.0" y="158.0" text-anchor="middle" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">returns stored result</text>
<line x1="230.0" y1="142.0" x2="280.0" y2="142.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="280.0" y1="142.0" x2="271.8" y2="145.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="280.0" y1="142.0" x2="271.8" y2="138.3" stroke="#ececec" stroke-width="1.8"/>
<line x1="440.0" y1="142.0" x2="490.0" y2="142.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="490.0" y1="142.0" x2="481.8" y2="145.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="490.0" y1="142.0" x2="481.8" y2="138.3" stroke="#ececec" stroke-width="1.8"/>
<line x1="650.0" y1="142.0" x2="700.0" y2="142.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="700.0" y1="142.0" x2="691.8" y2="145.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="700.0" y1="142.0" x2="691.8" y2="138.3" stroke="#ececec" stroke-width="1.8"/>
<rect x="40.0" y="212.0" width="820.0" height="96.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="236.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">The key must be unique per logical operation and stored atomically with the result, or the race</text>
<text x="60.0" y="252.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">between two concurrent retries charges twice.</text>
<text x="60.0" y="274.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Keys expire: keep them long enough to cover the longest plausible retry storm, then let them go.</text>
</svg>
