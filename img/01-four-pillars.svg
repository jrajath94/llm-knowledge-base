<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 380' width='100%' role='img'><rect x='0' y='0' width='960' height='380' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>One volume, four pillars</text><rect x='30' y='80' width='212' height='190' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='136' y='118' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Linear algebra</text><text x='136' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the language data lives in</text><text x='136' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>vectors, matrices, transformations</text><text x='136' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1565c0' text-anchor='middle'>Chapter 2</text><rect x='262' y='80' width='212' height='190' rx='10' fill='#0d0d0d' stroke='#e57ea6' stroke-width='2'/><text x='368' y='118' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Probability and statistics</text><text x='368' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the language of uncertainty</text><text x='368' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>noisy data, bets, estimators</text><text x='368' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#e57ea6' text-anchor='middle'>Chapters 3 and 5</text><rect x='494' y='80' width='212' height='190' rx='10' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><text x='600' y='118' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Calculus</text><text x='600' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the language of change</text><text x='600' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>how fast the loss moves per nudge</text><text x='600' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#4db6ac' text-anchor='middle'>Chapter 4</text><rect x='726' y='80' width='212' height='190' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='832' y='118' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Optimization</text><text x='832' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>calculus turned into a training loop</text><text x='832' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>walk downhill, millions of steps</text><text x='832' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>Chapter 6</text><text x='480' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Strip away the frameworks and these four remain. Machine learning is applied math wearing a software costume.</text></svg>