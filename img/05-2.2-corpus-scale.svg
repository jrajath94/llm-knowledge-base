<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="400" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Why the web is the only source</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">token counts on a log scale: what each corpus can supply vs what training needs</text>
<text x="24" y="122" font-size="14" fill="#ececec" text-anchor="start">a large library of books</text>
<text x="24" y="140" font-size="12" fill="#a8a8a8" text-anchor="start">tens of billions</text>
<rect x="300" y="100" width="176.85452293656013" height="30" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="486.8545229365601" y="121" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#a8a8a8" text-anchor="start">30,000,000,000</text>
<text x="24" y="194" font-size="14" fill="#ececec" text-anchor="start">Wikipedia (English)</text>
<text x="24" y="212" font-size="12" fill="#a8a8a8" text-anchor="start">~4B tokens</text>
<rect x="300" y="172" width="72.08415166005057" height="30" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="382.08415166005057" y="193" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#a8a8a8" text-anchor="start">4,000,000,000</text>
<text x="24" y="266" font-size="14" fill="#ececec" text-anchor="start">Chinchilla 70B needs</text>
<text x="24" y="284" font-size="12" fill="#a8a8a8" text-anchor="start">1.4T tokens</text>
<rect x="300" y="244" width="376.68334340826357" height="30" fill="#e57ea6" rx="4" opacity="1"/>
<text x="686.6833434082636" y="265" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#a8a8a8" text-anchor="start">1,400,000,000,000</text>
<text x="24" y="338" font-size="14" fill="#ececec" text-anchor="start">FineWeb (filtered web)</text>
<text x="24" y="356" font-size="12" fill="#a8a8a8" text-anchor="start">15T tokens</text>
<rect x="300" y="316" width="500.00000000000006" height="30" fill="#7dd87d" rx="4" opacity="1"/>
<text x="810.0" y="337" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#a8a8a8" text-anchor="start">15,000,000,000,000</text>
<text x="24" y="394" font-size="13" fill="#f0b429" text-anchor="start">Only web-scale corpora reach the trillions of tokens Chinchilla-optimal training needs.</text>
</svg>