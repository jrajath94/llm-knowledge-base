<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Capstone: the one-page distributed run plan</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">budget, strategy, mesh, checkpoint contract, profiling gate</text>
<rect x="24" y="88" width="170" height="64" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="109" y="125" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">budget it</text>
<line x1="202" y1="120" x2="226" y2="120" stroke="#6cb2ff" stroke-width="2"/>
<polygon points="226,120 217.78219953718923,123.66984407753613 217.78219953718923,116.33015592246387" fill="#6cb2ff"/>
<text x="238" y="118" font-size="12" fill="#a8a8a8" text-anchor="start">run the memory calculator: which pile dominates? If it fits one GPU, stop. Distribution</text>
<text x="238" y="135" font-size="12" fill="#a8a8a8" text-anchor="start">is the wrong answer.</text>
<rect x="24" y="170" width="170" height="64" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="4" opacity="1"/>
<text x="109" y="207" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">pick the strategy</text>
<line x1="202" y1="202" x2="226" y2="202" stroke="#4fd1a5" stroke-width="2"/>
<polygon points="226,202 217.78219953718923,205.66984407753614 217.78219953718923,198.33015592246386" fill="#4fd1a5"/>
<text x="238" y="200" font-size="12" fill="#a8a8a8" text-anchor="start">fits per replica: DDP. One replica too big: FSDP2 first, then tensor inside the node,</text>
<text x="238" y="217" font-size="12" fill="#a8a8a8" text-anchor="start">pipeline across nodes.</text>
<rect x="24" y="252" width="170" height="64" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="4" opacity="1"/>
<text x="109" y="289" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">write the mesh</text>
<line x1="202" y1="284" x2="226" y2="284" stroke="#f0b429" stroke-width="2"/>
<polygon points="226,284 217.78219953718923,287.66984407753614 217.78219953718923,280.33015592246386" fill="#f0b429"/>
<text x="238" y="282" font-size="12" fill="#a8a8a8" text-anchor="start">data, tensor, pipeline degrees, one sentence of justification per degree.</text>
<rect x="24" y="334" width="170" height="64" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="4" opacity="1"/>
<text x="109" y="371" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">checkpoint contract</text>
<line x1="202" y1="366" x2="226" y2="366" stroke="#e57ea6" stroke-width="2"/>
<polygon points="226,366 217.78219953718923,369.66984407753614 217.78219953718923,362.33015592246386" fill="#e57ea6"/>
<text x="238" y="364" font-size="12" fill="#a8a8a8" text-anchor="start">what is saved, how often, sharded per rank, async, and the resume test before the long</text>
<text x="238" y="381" font-size="12" fill="#a8a8a8" text-anchor="start">job.</text>
<rect x="24" y="416" width="170" height="64" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="109" y="453" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">profiling gate</text>
<line x1="202" y1="448" x2="226" y2="448" stroke="#b388ff" stroke-width="2"/>
<polygon points="226,448 217.78219953718923,451.66984407753614 217.78219953718923,444.33015592246386" fill="#b388ff"/>
<text x="238" y="446" font-size="12" fill="#a8a8a8" text-anchor="start">MFU target, one-step profile in the first hour, what changes first if MFU is under 30%.</text>
</svg>