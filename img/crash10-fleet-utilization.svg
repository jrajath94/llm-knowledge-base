<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 300' width='100%' role='img' aria-label='GPU fleet tradeoff: 160 GPUs at 0.7 utilization with 2.3x wait versus 125 GPUs at 0.9 utilization with 9x wait'>
<text x='20' y='32' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>The price of 0.9: GPUs vs the wait</text>
<text x='20' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Same demand: 40 req/s, 2k in / 500 out, 900 tok/s per GPU measured. The extra 35 GPUs buy the latency SLO.</text>
<text x='20' y='110' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec'>util 0.7</text>
<rect x='140' y='92' width='480' height='30' fill='#2e7d32'/>
<text x='630' y='113' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' fill='#ececec'>160 GPUs, wait 2.3x service</text>
<text x='20' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec'>util 0.9</text>
<rect x='140' y='150' width='375' height='30' fill='#c62828'/>
<text x='525' y='171' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' fill='#ececec'>125 GPUs, wait 9x service</text>
<text x='140' y='220' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Saving 35 GPUs (about 22%) costs a 4x latency blowup. The M/M/1 hockey stick is why fleets target 60-75%.</text>
<text x='140' y='246' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Rule: never size a fleet to 100% of measured supply.</text>
</svg>
