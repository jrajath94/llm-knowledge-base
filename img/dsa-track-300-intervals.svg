<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 470" role="img" aria-label="Figure 45. Sort by start, then one comparison per interval">
<rect width="900" height="470" fill="#0d0d0d"/>
<text x="450.0" y="26" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Figure 45. Sort by start, then one comparison per interval</text>
<text x="450.0" y="50" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">left: intervals sorted by start; right: merged after one sweep</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<text x="120" y="104" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">sorted by start</text>
<rect x="120" y="120" width="210" height="40" rx="8" fill="#141414" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="136" y="146" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">A [1,3]</text>
<rect x="120" y="176" width="210" height="40" rx="8" fill="#141414" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="136" y="202" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">B [2,6]</text>
<rect x="120" y="232" width="210" height="40" rx="8" fill="#141414" stroke="#7fd08a" stroke-width="1.5"/>
<text x="136" y="258" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">C [8,10]</text>
<rect x="120" y="288" width="210" height="40" rx="8" fill="#141414" stroke="#7fd08a" stroke-width="1.5"/>
<text x="136" y="314" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">D [9,12]</text>
<line x1="360" y1="235" x2="470" y2="235" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="415" y="215" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">sweep</text>
<text x="415" y="262" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">next.start &lt;= cur.end ?</text>
<text x="520" y="132" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">merged</text>
<rect x="520" y="148" width="210" height="40" rx="8" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="1.5"/>
<text x="536" y="174" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">A+B [1,6]</text>
<rect x="520" y="204" width="210" height="40" rx="8" fill="#1a1a1a" stroke="#7fd08a" stroke-width="1.5"/>
<text x="536" y="230" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">C+D [8,12]</text>
<text x="520" y="330" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">one pass: each interval joins</text>
<text x="520" y="352" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">the current merge or starts a new one</text>
<text x="450.0" y="456" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Research Engineer Curriculum, DSA Track: after sorting, overlap is decided locally; the sweep is one pass. Source: original.</text>
</svg>
