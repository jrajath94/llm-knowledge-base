<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">What one step costs: time</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">7B model, 4M-token batch, 256 A100s at 40% MFU</text>
<rect x="24" y="94" width="190" height="120" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6"/>
<text x="119.0" y="146.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">6 x N x tokens</text>
<text x="119.0" y="168.0" font-size="10" fill="#a8a8a8" text-anchor="middle">6 x 7e9 x 4e6</text>
<text x="119.0" y="196" font-size="11" font-weight="bold" fill="#6cb2ff" text-anchor="middle">1.68e17 FLOPs / step</text>
<line x1="214" y1="154.0" x2="228" y2="154.0" stroke="#6cb2ff" stroke-width="2"/>
<polygon points="228,154.0 219.78219953718923,157.66984407753614 219.78219953718923,150.33015592246386" fill="#6cb2ff"/>
<rect x="228" y="94" width="190" height="120" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="323.0" y="146.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">256 x 312 TFLOP/s x 0.40</text>
<text x="323.0" y="168.0" font-size="10" fill="#a8a8a8" text-anchor="middle">GPU throughput</text>
<text x="323.0" y="196" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">3.2e16 FLOP/s</text>
<line x1="418" y1="154.0" x2="432" y2="154.0" stroke="#4fd1a5" stroke-width="2"/>
<polygon points="432,154.0 423.78219953718923,157.66984407753614 423.78219953718923,150.33015592246386" fill="#4fd1a5"/>
<rect x="432" y="94" width="190" height="120" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6"/>
<text x="527.0" y="146.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">FLOPs / throughput</text>
<text x="527.0" y="168.0" font-size="10" fill="#a8a8a8" text-anchor="middle">1.68e17 / 3.2e16</text>
<text x="527.0" y="196" font-size="11" font-weight="bold" fill="#f0b429" text-anchor="middle">5.25 s / step</text>
<line x1="622" y1="154.0" x2="636" y2="154.0" stroke="#f0b429" stroke-width="2"/>
<polygon points="636,154.0 627.7821995371892,157.66984407753614 627.7821995371892,150.33015592246386" fill="#f0b429"/>
<rect x="636" y="94" width="190" height="120" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="731.0" y="146.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">500,000 steps x 5.25 s</text>
<text x="731.0" y="168.0" font-size="10" fill="#a8a8a8" text-anchor="middle">2T tokens / 4M per batch</text>
<text x="731.0" y="196" font-size="11" font-weight="bold" fill="#e57ea6" text-anchor="middle">~187,000 GPU-hours</text>
<text x="24" y="248" font-size="13" fill="#a8a8a8" text-anchor="start">~187,000 GPU-hours = ~21 GPU-years. The step count is fixed by the token budget,</text>
<text x="24" y="270" font-size="13" fill="#f0b429" text-anchor="start">so throughput per step is everything. That is why the cluster is huge.</text>
</svg>
