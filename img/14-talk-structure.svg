<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="'Charis SIL',Georgia,serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" /></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Talk Structure</text>
<rect x="50" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="120.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Problem</text>
<text x="120.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Why it matters</text>
<rect x="220" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="290.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Approach</text>
<text x="290.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">What you did</text>
<rect x="390" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="460.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Results</text>
<text x="460.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">What you found</text>
<rect x="560" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="630.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Conclusion</text>
<text x="630.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">So what?</text>
<line x1="190" y1="115" x2="220" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="360" y1="115" x2="390" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="530" y1="115" x2="560" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="400" y="200" text-anchor="middle" font-size="12" fill="#a8a8a8">Start from the audience, then climb. 2-3 minutes per section.</text>
</svg>