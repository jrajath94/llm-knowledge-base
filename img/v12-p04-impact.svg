<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why GPT-2 mattered: zero-shot, no fine-tuning"><rect x="22" y="14" width="916" height="320" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The method mattered more than any single score</text><rect x="22.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="134" font-size="27" font-weight="700" fill="#f0b429">63.24%</text><text x="38.0" y="156" font-size="12.5" fill="#a8a8a8">LAMBADA accuracy, up from 19% for the previous best</text><rect x="487.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="134" font-size="27" font-weight="700" fill="#f0b429">55 F1</text><text x="503.0" y="156" font-size="12.5" fill="#a8a8a8">CoQA: matching 3 of 4 supervised baselines that used</text><text x="503.0" y="172" font-size="12.5" fill="#a8a8a8">the training data</text><rect x="22.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="244" font-size="27" font-weight="700" fill="#f0b429">70.7%</text><text x="38.0" y="266" font-size="12.5" fill="#a8a8a8">Winograd-style commonsense, near supervised</text><text x="38.0" y="282" font-size="12.5" fill="#a8a8a8">performance</text><rect x="487.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="244" font-size="27" font-weight="700" fill="#f0b429">7 of 8</text><text x="503.0" y="266" font-size="12.5" fill="#a8a8a8">language-modeling test sets: new state of the art,</text><text x="503.0" y="282" font-size="12.5" fill="#a8a8a8">zero-shot</text><rect x="38" y="328" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="350" font-size="13.5" fill="#7fd08a">&quot;The task is in the prompt&quot; is now so normal people forget it was invented here.</text></svg>