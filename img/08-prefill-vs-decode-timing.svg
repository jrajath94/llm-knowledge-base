<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="620" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Two phases of generation</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">TTFT measures prefill; TPOT measures decode</text>
<rect x="24" y="88" width="420" height="400" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="234.0" y="120" font-size="14" font-weight="bold" fill="#6cb2ff" text-anchor="middle">Prefill</text>
<text x="48" y="144" font-size="12" fill="#a8a8a8" text-anchor="start">The whole prompt in one</text>
<text x="48" y="165" font-size="12" fill="#a8a8a8" text-anchor="start">parallel forward pass.</text>
<text x="48" y="186" font-size="12" fill="#a8a8a8" text-anchor="start">Computes keys and values for</text>
<text x="48" y="207" font-size="12" fill="#a8a8a8" text-anchor="start">every prompt token at once.</text>
<text x="48" y="228" font-size="12" fill="#a8a8a8" text-anchor="start"></text>
<text x="48" y="249" font-size="12" fill="#a8a8a8" text-anchor="start">Bottleneck: compute-bound</text>
<text x="48" y="270" font-size="12" fill="#a8a8a8" text-anchor="start">(big parallel matrix math).</text>
<text x="48" y="291" font-size="12" fill="#a8a8a8" text-anchor="start"></text>
<text x="48" y="312" font-size="12" fill="#a8a8a8" text-anchor="start">Clock: TTFT, time to first</text>
<text x="48" y="333" font-size="12" fill="#a8a8a8" text-anchor="start">token (prompt in, first token out).</text>
<rect x="456" y="88" width="420" height="400" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="666.0" y="120" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Decode</text>
<text x="480" y="144" font-size="12" fill="#a8a8a8" text-anchor="start">One token per step: forward</text>
<text x="480" y="165" font-size="12" fill="#a8a8a8" text-anchor="start">pass, scores, pick a token,</text>
<text x="480" y="186" font-size="12" fill="#a8a8a8" text-anchor="start">repeat until the stop token.</text>
<text x="480" y="207" font-size="12" fill="#a8a8a8" text-anchor="start"></text>
<text x="480" y="228" font-size="12" fill="#a8a8a8" text-anchor="start">Bottleneck: memory-bound</text>
<text x="480" y="249" font-size="12" fill="#a8a8a8" text-anchor="start">(each step streams all weights</text>
<text x="480" y="270" font-size="12" fill="#a8a8a8" text-anchor="start">from memory for one token).</text>
<text x="480" y="291" font-size="12" fill="#a8a8a8" text-anchor="start"></text>
<text x="480" y="312" font-size="12" fill="#a8a8a8" text-anchor="start">Clock: TPOT, time per output</text>
<text x="480" y="333" font-size="12" fill="#a8a8a8" text-anchor="start">token (the streaming cadence).</text>
<line x1="444" y1="288" x2="452" y2="288" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="452,288 443.78219953718923,291.66984407753614 443.78219953718923,284.33015592246386" fill="#8a8a8a"/>
<rect x="24" y="518" width="852" height="84" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="550" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Keep them separate</text>
<text x="48" y="576" font-size="11" fill="#a8a8a8" text-anchor="start">Every serving decision in this volume targets one of these two phases: opposite bottlenecks, opposite</text>
<text x="48" y="593" font-size="11" fill="#a8a8a8" text-anchor="start">clocks.</text>
</svg>