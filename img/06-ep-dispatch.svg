<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<defs><marker id="ah5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b48ce8"/></marker>
<marker id="ah6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6cb2ff"/></marker></defs>
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Expert parallelism: dispatch tokens, then combine</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Each token goes to its top-k experts. All-to-all moves tokens to expert owners and back.</text>
<text x="60" y="110" font-size="14" font-weight="bold" fill="#ececec">tokens (per GPU)</text>
<rect x="60" y="125" width="120" height="180" fill="#141414" stroke="#4a4a4a" stroke-width="1.5" rx="6"/>
<circle cx="90" cy="155" r="9" fill="#e06c75"/><circle cx="115" cy="155" r="9" fill="#6cb2ff"/><circle cx="140" cy="155" r="9" fill="#e06c75"/>
<circle cx="90" cy="185" r="9" fill="#7dd87d"/><circle cx="115" cy="185" r="9" fill="#6cb2ff"/><circle cx="140" cy="185" r="9" fill="#f0b429"/>
<circle cx="90" cy="215" r="9" fill="#7dd87d"/><circle cx="115" cy="215" r="9" fill="#e06c75"/><circle cx="140" cy="215" r="9" fill="#6cb2ff"/>
<circle cx="90" cy="245" r="9" fill="#f0b429"/><circle cx="115" cy="245" r="9" fill="#7dd87d"/><circle cx="140" cy="245" r="9" fill="#e06c75"/>
<text x="60" y="330" font-size="12" fill="#8a8a8a">router picks experts per token</text>
<path d="M 200 160 L 330 140" stroke="#b48ce8" stroke-width="2" fill="none" marker-end="url(#ah5)"/>
<path d="M 200 200 L 330 220" stroke="#b48ce8" stroke-width="2" fill="none" marker-end="url(#ah5)"/>
<path d="M 200 240 L 330 300" stroke="#b48ce8" stroke-width="2" fill="none" marker-end="url(#ah5)"/>
<text x="265" y="250" font-size="12" fill="#b48ce8" text-anchor="middle">dispatch</text>
<text x="265" y="268" font-size="12" fill="#b48ce8" text-anchor="middle">all-to-all</text>
<text x="380" y="110" font-size="14" font-weight="bold" fill="#ececec">experts (one per GPU)</text>
<rect x="360" y="125" width="90" height="60" fill="#141414" stroke="#e06c75" stroke-width="2" rx="6"/>
<text x="405" y="160" font-size="13" font-weight="bold" fill="#e06c75" text-anchor="middle">E0</text>
<rect x="360" y="195" width="90" height="60" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="6"/>
<text x="405" y="230" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="middle">E1</text>
<rect x="360" y="265" width="90" height="60" fill="#141414" stroke="#7dd87d" stroke-width="2" rx="6"/>
<text x="405" y="300" font-size="13" font-weight="bold" fill="#7dd87d" text-anchor="middle">E2</text>
<path d="M 470 155 L 600 175" stroke="#6cb2ff" stroke-width="2" fill="none" marker-end="url(#ah6)"/>
<path d="M 470 225 L 600 215" stroke="#6cb2ff" stroke-width="2" fill="none" marker-end="url(#ah6)"/>
<path d="M 470 295 L 600 255" stroke="#6cb2ff" stroke-width="2" fill="none" marker-end="url(#ah6)"/>
<text x="535" y="250" font-size="12" fill="#6cb2ff" text-anchor="middle">combine</text>
<text x="535" y="268" font-size="12" fill="#6cb2ff" text-anchor="middle">all-to-all</text>
<rect x="620" y="125" width="180" height="180" fill="#141414" stroke="#4a4a4a" stroke-width="1.5" rx="6"/>
<text x="710" y="160" font-size="13" fill="#ececec" text-anchor="middle">weighted outputs</text>
<text x="710" y="182" font-size="13" fill="#ececec" text-anchor="middle">return to owners</text>
<text x="710" y="220" font-size="12" fill="#8a8a8a" text-anchor="middle">4 exchanges per layer:</text>
<text x="710" y="240" font-size="12" fill="#8a8a8a" text-anchor="middle">dispatch + combine,</text>
<text x="710" y="260" font-size="12" fill="#8a8a8a" text-anchor="middle">forward + backward</text>
<text x="60" y="380" font-size="13" fill="#ececec">Hot expert: a 3x overloaded expert makes its GPU do 3x the work. The step waits for the slowest rank.</text>
<text x="24" y="430" font-size="13" fill="#f0b429">Rule of thumb: balance the router, or the fastest network cannot save an imbalanced dispatch.</text>
</svg>