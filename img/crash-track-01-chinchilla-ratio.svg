<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" style="max-width:760px" role="img" aria-label="Horizontal bars of tokens per param: Gopher 1.07, GPT-3 1.7, Chinchilla 20 at the optimum line.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">Tokens per param: who sat on the optimum</text>
<text x="150" y="75" text-anchor="end" class="num">Gopher 280B</text>
<rect x="165" y="58" width="23.345454545454547" height="24" rx="4" fill="#e57373"/>
<text x="196.34545454545454" y="75" text-anchor="start" class="num">1.07</text>
<text x="150" y="127" text-anchor="end" class="num">GPT-3 175B</text>
<rect x="165" y="110" width="37.09090909090909" height="24" rx="4" fill="#e57373"/>
<text x="210.0909090909091" y="127" text-anchor="start" class="num">1.7</text>
<text x="150" y="179" text-anchor="end" class="num">Chinchilla 70B</text>
<rect x="165" y="162" width="436.3636363636364" height="24" rx="4" fill="#7fc97f"/>
<text x="609.3636363636364" y="179" text-anchor="start" class="num">20.0</text>
<line x1="601.3636363636364" y1="55" x2="601.3636363636364" y2="216" stroke="#f0b429" stroke-dasharray="5,4"/>
<text x="601.3636363636364" y="50" text-anchor="middle" class="s">Chinchilla optimum ~20</text>
<text x="24" y="285" text-anchor="start" class="s">Gopher and GPT-3 spent the budget on params. Chinchilla spent it on the tradeoff.</text>
