<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img' aria-label='The model artifact bundle: everything serving needs in one versioned dict'>
<text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec'>The artifact bundle: one dict carries everything serving needs</text>
<text x='20' y='54' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>A model file without its threshold, feature list, and provenance is undeployable.</text>

<!-- training -->
<rect x='20' y='80' width='200' height='110' rx='10' fill='#141414' stroke='#262626' stroke-width='1.5'/>
<text x='120' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>training script</text>
<text x='120' y='132' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>tracked run (T3.1)</text>
<text x='120' y='152' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>code + data + seed</text>

<text x='245' y='140' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='22' fill='#f0b429' text-anchor='middle'>&#8594;</text>

<!-- artifact -->
<rect x='270' y='80' width='240' height='240' rx='10' fill='#f0b429' fill-opacity='0.08' stroke='#f0b429' stroke-width='2'/>
<text x='390' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#f0b429' text-anchor='middle'>artifact dict v1</text>
<rect x='290' y='122' width='200' height='36' rx='6' fill='#141414' stroke='#262626'/>
<text x='390' y='145' font-family='monospace,monospace' font-size='12' fill='#ececec' text-anchor='middle'>model: fitted weights</text>
<rect x='290' y='166' width='200' height='36' rx='6' fill='#141414' stroke='#262626'/>
<text x='390' y='189' font-family='monospace,monospace' font-size='12' fill='#ececec' text-anchor='middle'>threshold: from cost ratio</text>
<rect x='290' y='210' width='200' height='36' rx='6' fill='#141414' stroke='#262626'/>
<text x='390' y='233' font-family='monospace,monospace' font-size='12' fill='#ececec' text-anchor='middle'>features: column list</text>
<rect x='290' y='254' width='200' height='36' rx='6' fill='#141414' stroke='#262626'/>
<text x='390' y='277' font-family='monospace,monospace' font-size='12' fill='#ececec' text-anchor='middle'>date, data hash, git sha</text>
<text x='390' y='310' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>immutable once registered</text>

<text x='535' y='205' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='22' fill='#f0b429' text-anchor='middle'>&#8594;</text>

<!-- serving -->
<rect x='560' y='80' width='380' height='240' rx='10' fill='#141414' stroke='#262626' stroke-width='1.5'/>
<text x='750' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>serving: predict_churn(customer)</text>
<text x='580' y='142' font-family='monospace,monospace' font-size='12' fill='#64b5f6'>1.</text>
<text x='600' y='142' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec'>load artifact v1 from registry</text>
<text x='580' y='168' font-family='monospace,monospace' font-size='12' fill='#64b5f6'>2.</text>
<text x='600' y='168' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec'>featurize(row): the SAME function</text>
<text x='600' y='188' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec'>as training, identical columns</text>
<text x='580' y='214' font-family='monospace,monospace' font-size='12' fill='#64b5f6'>3.</text>
<text x='600' y='214' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec'>score, compare to artifact threshold</text>
<text x='580' y='248' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8'>rollback = point the registry tag</text>
<text x='580' y='268' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8'>at the previous artifact (T3.3)</text>

<text x='20' y='368' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Shortest possible distance from the training path: one shared transform, one versioned bundle, no second copy of the logic.</text>
</svg>
