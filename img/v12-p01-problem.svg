<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 1: the problem Attention Is All You Need solved"><rect x="22" y="14" width="435.0" height="238" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">Sequence models were RNNs, mostly</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">LSTMs</text><circle cx="44" cy="103.5" r="3.2" fill="#e07878"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">training could not parallelize: token 50 waits for</text><text x="56" y="126" font-size="13.5" fill="#a8a8a8">tokens 1 through 49</text><circle cx="44" cy="147.5" r="3.2" fill="#e07878"/><text x="56" y="152" font-size="13.5" fill="#a8a8a8">long-range links decayed through a fixed-size</text><text x="56" y="170" font-size="13.5" fill="#a8a8a8">hidden vector</text><circle cx="44" cy="191.5" r="3.2" fill="#e07878"/><text x="56" y="196" font-size="13.5" fill="#a8a8a8">attention existed but was glued onto an RNN</text><text x="56" y="214" font-size="13.5" fill="#a8a8a8">doing sequential reading</text><rect x="503.0" y="14" width="435.0" height="238" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">What if we delete the recurrence</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">completely and build the whole model</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">out of attention?</text><line x1="467.0" y1="133.0" x2="487.0" y2="133.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,128.0 495.0,133.0 487.0,138.0" fill="#a8a8a8"/></svg>