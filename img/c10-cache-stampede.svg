<line x1="560.0" y1="251.0" x2="552.4" y2="246.2" stroke="#ff9f43" stroke-width="1"/>
<circle cx="432.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="432.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="551.2" y2="253.1" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="552.6" y2="245.9" stroke="#ff9f43" stroke-width="1"/>
<circle cx="476.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="476.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="551.1" y2="252.3" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="553.1" y2="245.2" stroke="#ff9f43" stroke-width="1"/>
<circle cx="520.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="520.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="551.1" y2="249.9" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="554.8" y2="243.6" stroke="#ff9f43" stroke-width="1"/>
<circle cx="564.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="564.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="557.7" y2="242.3" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="565.0" y2="243.5" stroke="#ff9f43" stroke-width="1"/>
<circle cx="608.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="608.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="565.7" y2="244.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="569.0" y2="250.6" stroke="#ff9f43" stroke-width="1"/>
<circle cx="652.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="652.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="567.0" y2="245.4" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="568.9" y2="252.5" stroke="#ff9f43" stroke-width="1"/>
