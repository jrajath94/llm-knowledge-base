<rect x="520.0" y="243.0" width="120.0" height="22.0" rx="6" fill="#141414" stroke="#ff9f43" stroke-width="1"/>
<text x="580.0" y="259.0" text-anchor="middle" fill="#ececec" font-size="11" font-family="Charis SIL, Georgia, serif">database</text>
<text x="40.0" y="291.0" text-anchor="start" fill="#4caf50" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">key repopulated</text>
<rect x="300.0" y="275.0" width="340.0" height="24.0" rx="6" fill="#4caf50" stroke="none" stroke-width="1" opacity="0.25"/>
<text x="470.0" y="292.0" text-anchor="middle" fill="#ececec" font-size="11" font-family="Charis SIL, Georgia, serif">first finisher writes; herd wasted</text>
<rect x="40.0" y="343.0" width="820.0" height="118.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="369.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">Defenses: request coalescing (only the first miss recomputes; the rest wait), probabilistic early</text>
<text x="60.0" y="385.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">refresh, and jittered TTLs so keys do not expire in lockstep.</text>
<text x="60.0" y="401.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">The database sees N identical queries for one value. Coalescing turns N recomputes into 1 plus N</text>
<text x="60.0" y="416.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">cheap waits.</text>
<text x="60.0" y="429.0" text-anchor="start" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">Stale-while-revalidate is the gentlest fix: serve the stale value while one worker refreshes in the</text>
<text x="60.0" y="443.9" text-anchor="start" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">background.</text>
</svg>
