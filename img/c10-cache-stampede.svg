<line x1="344.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="551.4" y2="253.7" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="552.2" y2="246.4" stroke="#ff9f43" stroke-width="1"/>
