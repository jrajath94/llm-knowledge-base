<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 499" role="img" aria-label="Cache stampede: the thundering herd">
<rect width="900" height="499" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Cache stampede: the thundering herd</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">The hot key expires. A thousand requests miss at once and all of them recompute the same expensive value.</text>
<text x="40.0" y="99.0" text-anchor="start" fill="#2dd4bf" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">hot key alive</text>
<rect x="300.0" y="83.0" width="340.0" height="24.0" rx="6" fill="#2dd4bf" stroke="none" stroke-width="1" opacity="0.25"/>
<text x="470.0" y="100.0" text-anchor="middle" fill="#ececec" font-size="11" font-family="Charis SIL, Georgia, serif">all requests hit: cheap</text>
<text x="40.0" y="163.0" text-anchor="start" fill="#e5484d" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">key expires</text>
<rect x="300.0" y="147.0" width="340.0" height="24.0" rx="6" fill="#e5484d" stroke="none" stroke-width="1" opacity="0.25"/>
<text x="470.0" y="164.0" text-anchor="middle" fill="#ececec" font-size="11" font-family="Charis SIL, Georgia, serif">every request misses at once</text>
<text x="40.0" y="227.0" text-anchor="start" fill="#ff9f43" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">recompute</text>
<circle cx="300.0" cy="221.0" r="5" fill="#ff9f43"/>
<line x1="300.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="551.5" y2="253.9" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="552.2" y2="246.6" stroke="#ff9f43" stroke-width="1"/>
