<line x1="784.0" y1="227.0" x2="560.0" y2="251.0" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="567.8" y2="246.5" stroke="#ff9f43" stroke-width="1"/>
