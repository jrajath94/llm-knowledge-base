<line x1="560.0" y1="251.0" x2="567.7" y2="246.3" stroke="#ff9f43" stroke-width="1"/>
<line x1="560.0" y1="251.0" x2="568.6" y2="253.6" stroke="#ff9f43" stroke-width="1"/>
