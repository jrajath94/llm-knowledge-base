<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Batch vs streaming pipelines"><rect x="22" y="14" width="916" height="274" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">PIPELINE CHOICE</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Two ways to move data, different trade-offs</text><text x="38" y="116" font-size="13" font-weight="700" fill="#6cb2ff">Aspect</text><text x="303.2" y="116" font-size="13" font-weight="700" fill="#6cb2ff">Batch</text><text x="612.5999999999999" y="116" font-size="13" font-weight="700" fill="#6cb2ff">Streaming</text><line x1="38" y1="120" x2="922" y2="120" stroke="#2e2e2e"/><text x="38" y="148" font-size="13" font-weight="700" fill="#ececec">Schedule</text><text x="303.2" y="148" font-size="13" fill="#a8a8a8">runs on a schedule: hourly, daily</text><text x="612.5999999999999" y="148" font-size="13" fill="#a8a8a8">processes each event as it arrives</text><line x1="38" y1="160" x2="922" y2="160" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="188" font-size="13" font-weight="700" fill="#ececec">Latency</text><text x="303.2" y="188" font-size="13" fill="#a8a8a8">high: hours to a day</text><text x="612.5999999999999" y="188" font-size="13" fill="#a8a8a8">low: seconds to minutes</text><line x1="38" y1="200" x2="922" y2="200" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="228" font-size="13" font-weight="700" fill="#ececec">Cost</text><text x="303.2" y="228" font-size="13" fill="#a8a8a8">simple and cheap</text><text x="612.5999999999999" y="228" font-size="13" fill="#a8a8a8">fresh but complex and expensive</text><line x1="38" y1="240" x2="922" y2="240" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="268" font-size="13" font-weight="700" fill="#ececec">Failure mode</text><text x="303.2" y="268" font-size="13" fill="#a8a8a8">the stale feature: up to 39 hours</text><text x="303.2" y="288" font-size="13" fill="#a8a8a8">stale</text><text x="612.5999999999999" y="268" font-size="13" fill="#a8a8a8">harder to debug, harder to re-run</text><line x1="38" y1="300" x2="922" y2="300" stroke="#2e2e2e" stroke-opacity="0.5"/></svg>