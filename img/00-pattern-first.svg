<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 380' width='100%' role='img'><rect x='0' y='0' width='960' height='380' rx='12' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Patterns before problems</text><text x='24' y='56' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>the only DSA order that works</text><rect x='330' y='80' width='300' height='90' rx='10' fill='#111111' stroke='#2e7d32' stroke-width='2'/><text x='480.0' y='125.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Name the pattern first</text><text x='480.0' y='147.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>two pointers, sliding window, ...</text><line x1='480' y1='170' x2='480' y2='195' stroke='#a8a8a8' stroke-width='2'/><polygon points='480,195 475,186 485,186' fill='#a8a8a8'/><rect x='330' y='195' width='300' height='90' rx='10' fill='#111111' stroke='#1565c0' stroke-width='2'/><text x='480.0' y='240.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Learn its template</text><text x='480.0' y='262.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>the reusable code shape</text><line x1='480' y1='285' x2='480' y2='310' stroke='#a8a8a8' stroke-width='2'/><polygon points='480,310 475,301 485,301' fill='#a8a8a8'/><rect x='330' y='306' width='300' height='52' rx='10' fill='#111111' stroke='#2e7d32' stroke-width='2'/><text x='480' y='339' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Solve 2-3 problems with it, then move on</text><rect x='40' y='150' width='230' height='120' rx='10' fill='#160d0d' stroke='#c62828' stroke-width='2'/><text x='155' y='190' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#c62828' text-anchor='middle'>Never do this</text><text x='155' y='214' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>grind random problems</text><text x='155' y='234' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>without naming the pattern</text><text x='155' y='256' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#c62828' text-anchor='middle'>a dead end</text></svg>