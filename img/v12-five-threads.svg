<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 334" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Five threads running through all fourteen papers"><rect x="22" y="14" width="916" height="306" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">SYNTHESIS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The field keeps re-answering five questions</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Scale is the dominant variable:</text><text x="321.56984375" y="94" font-size="13.5" fill="#a8a8a8">every act is, at bottom, about what happens when you spend more</text><text x="80" y="113" font-size="13.5" fill="#a8a8a8">compute well.</text><path d="M 53.7 139.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="144" font-size="13.5" font-weight="700" fill="#ececec">Data beats architecture:</text><text x="271.29289062500004" y="144" font-size="13.5" fill="#a8a8a8">each leap was a data leap first: WebText, 300B tokens, 1.4T tokens, filtered</text><text x="80" y="163" font-size="13.5" fill="#a8a8a8">quality tokens.</text><path d="M 53.7 189.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="194" font-size="13.5" font-weight="700" fill="#ececec">The objective function is the product:</text><text x="371.60421875000003" y="194" font-size="13.5" fill="#a8a8a8">next-token prediction, human preference, verifiable correctness.</text><text x="80" y="213" font-size="13.5" fill="#a8a8a8">Choose the reward, choose the model.</text><path d="M 53.7 239.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="244" font-size="13.5" font-weight="700" fill="#ececec">Efficiency compounds:</text><text x="254.4790625" y="244" font-size="13.5" fill="#a8a8a8">RoPE plus FlashAttention plus MoE plus overtraining multiplied a data-center</text><text x="80" y="263" font-size="13.5" fill="#a8a8a8">model down to a single GPU.</text><path d="M 53.7 289.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="294" font-size="13.5" font-weight="700" fill="#ececec">Evaluation is the hidden hard problem:</text><text x="382.40843750000005" y="294" font-size="13.5" fill="#a8a8a8">each paper had to invent how to measure what it claimed.</text><text x="80" y="313" font-size="13.5" fill="#a8a8a8">Distrust results whose metric you cannot explain.</text></svg>