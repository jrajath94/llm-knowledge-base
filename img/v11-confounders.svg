<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The four usual confounders: interrogate every positive result"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">CONFOUNDERS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">&quot;What is the most boring explanation for this gain, and did I rule it out?&quot;</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Compute:</text><text x="158.23039062499998" y="94" font-size="13.5" fill="#a8a8a8">your method trained longer. Kill it: re-run the baseline for the same epochs.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Tuning:</text><text x="140.946171875" y="125" font-size="13.5" fill="#a8a8a8">your method got the better sweep. Kill it: give the baseline the same tuning budget.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Data:</text><text x="125.978046875" y="156" font-size="13.5" fill="#a8a8a8">your method saw cleaner data. Kill it: fix the dataset and preprocessing for both.</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#e07878" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">Seeds:</text><text x="135.8309375" y="187" font-size="13.5" fill="#a8a8a8">you reported the lucky one. Kill it: run multiple seeds and report the spread.</text></svg>