<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 430' width='100%' role='img'>
<title>Human-in-the-loop: review points on risky actions</title>
<text x='460' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Human-in-the-loop: review points on risky actions</text>
<rect x='40' y='140' width='180' height='90' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='130' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Agent proposes</text>
<text x='130' y='186' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>an action</text>
<line x1='220' y1='185' x2='270' y2='185' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='261.8,188.7 270,185 261.8,181.3' fill='#8a8a8a'/>
<rect x='270' y='140' width='180' height='90' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='360' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Risk check</text>
<text x='360' y='186' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Read-only: low risk</text>
<text x='360' y='204' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Write/delete: high risk</text>
<line x1='450' y1='165' x2='500' y2='140' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='494.3,147.0 500,140 491.0,140.4' fill='#8a8a8a'/>
<text x='478' y='155' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#2e9e5b' text-anchor='middle'>low risk</text>
<rect x='500' y='105' width='170' height='70' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='585' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Execute</text>
<line x1='450' y1='205' x2='500' y2='235' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='491.1,233.9 500,235 494.8,227.6' fill='#8a8a8a'/>
<text x='478' y='228' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#c0392b' text-anchor='middle'>high risk</text>
<rect x='500' y='205' width='170' height='70' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/>
<text x='585' y='231' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Human review</text>
<text x='585' y='251' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Approve / edit / reject</text>
<line x1='670' y1='240' x2='720' y2='240' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='711.8,243.7 720,240 711.8,236.3' fill='#8a8a8a'/>
<rect x='720' y='205' width='170' height='70' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='805' y='246' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Execute</text>
<text x='805' y='295' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#2e9e5b' text-anchor='middle'>approved</text>
<text x='460' y='350' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Review points are designed, not improvised: declared per tool, per risk class.</text>
</svg>