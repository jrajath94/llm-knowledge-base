<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="The five-day post-training loop">
<rect width="720" height="420" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The post-training week is a loop, not a list</text>
<rect class="box" x="282.0" y="75.0" width="156" height="60" rx="30"/>
<text x="360.0" y="99.0" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Monday</text>
<text x="360.0" y="117.0" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">read the evals</text>
<text x="360.0" y="133.0" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">reward vs human judge</text>
<path d="M374.8364816542044,115.77933488775082 L468.80086546416555,184.04845584350602" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="405.63734711837" y="164.82779073125684" width="156" height="60" rx="30"/>
<text x="483.63734711837" y="188.82779073125684" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Tuesday</text>
<text x="483.63734711837" y="206.82779073125684" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">data work</text>
<text x="483.63734711837" y="222.82779073125684" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">rubric, dedup, re-label</text>
<path d="M477.97031539992815,212.2691209557552 L442.07911451646333,322.73087904424483" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="358.4120827980215" y="310.1722092687432" width="156" height="60" rx="30"/>
<text x="436.4120827980215" y="334.1722092687432" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Wednesday</text>
<text x="436.4120827980215" y="352.1722092687432" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">the training fix</text>
<text x="436.4120827980215" y="368.1722092687432" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">KL, verifier, relaunch</text>
<path d="M418.0731829264964,340.1722092687432 L301.9268170735036,340.1722092687432" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="205.58791720197848" y="310.1722092687432" width="156" height="60" rx="30"/>
<text x="283.5879172019785" y="334.1722092687432" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Thursday</text>
<text x="283.5879172019785" y="352.1722092687432" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">analysis</text>
<text x="283.5879172019785" y="368.1722092687432" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">overoptimization curve</text>
<path d="M277.92088548353667,322.73087904424483 L242.02968460007185,212.26912095575523" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="158.36265288163003" y="164.82779073125687" width="156" height="60" rx="30"/>
<text x="236.36265288163003" y="188.82779073125687" text-anchor="middle" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Friday</text>
<text x="236.36265288163003" y="206.82779073125687" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">ship review</text>
<text x="236.36265288163003" y="222.82779073125687" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">win rate, calibration</text>
<path d="M251.19913453583442,184.04845584350605 L345.1635183457956,115.77933488775082" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="360" y="227" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">levers, all week:</text>
<text x="360" y="245" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">data quality, reward design,</text>
<text x="360" y="261" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">KL control, eval discipline</text>
<text x="360" y="400" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">Eval failures become data fixes and recipe changes. The loop is the job.</text>
</svg>