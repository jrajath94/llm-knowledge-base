<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 395" role="img" aria-label="Chapter 6: Reverse Linked List — the worked example, traced">
<rect width="900" height="395" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 6: Reverse Linked List — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 32. 1 -&gt; 2 -&gt; 3 -&gt; None. Three pointers: prev, curr, and a saved next.</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="120.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">start</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">prev = None, curr = 1</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">nothing reversed yet</text>
<text x="48.0" y="158.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">step 1</text>
<text x="128.0" y="150.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">save next = 2; 1.next = None; prev = 1, curr</text>
<text x="128.0" y="167.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">= 2</text>
<text x="488.0" y="150.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">node 1 now points backward</text>
<rect x="40.0" y="176.0" width="820.0" height="46.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="204.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">step 2</text>
<text x="128.0" y="196.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">save next = 3; 2.next = 1; prev = 2, curr =</text>
<text x="128.0" y="213.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">3</text>
<text x="488.0" y="196.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">node 2 now points backward</text>
<text x="48.0" y="250.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">step 3</text>
<text x="128.0" y="242.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">save next = None; 3.next = 2; prev = 3, curr</text>
<text x="128.0" y="259.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">= None</text>
<text x="488.0" y="242.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">node 3 now points backward</text>
<rect x="40.0" y="268.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="287.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">end</text>
<text x="128.0" y="288.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">curr is None: return prev = 3</text>
<text x="488.0" y="288.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">list is 3 -&gt; 2 -&gt; 1 -&gt; None</text>
<line x1="40.0" y1="297.0" x2="860.0" y2="297.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="307.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="329.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">Save next BEFORE rewiring: one forgotten save loses the rest of the list. Draw the three pointers on</text>
<text x="58.0" y="345.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">every pointer problem.</text>
</svg>
