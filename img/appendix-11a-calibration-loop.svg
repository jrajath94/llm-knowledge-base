<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Flowchart of the six-step judge calibration loop: calibration set, human labels, kappa, disagreements, revise rubric, repeat.">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">The six-step calibration loop</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Calibrate the rubric against humans before you trust any judge score.</text>
<rect x="40" y="180" width="105" height="110" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="92" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">Calibration set</text>
<text x="92" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">spanning the range</text>
<line x1="145" y1="235" x2="160" y2="235" stroke="#5aa9e6" stroke-width="2" marker-end="none"/>
<polygon points="152,228 152,242 160,235" fill="#5aa9e6"/>
<rect x="160" y="180" width="105" height="110" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="212" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">Humans label first</text>
<text x="212" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">2-3 raters</text>
<line x1="265" y1="235" x2="280" y2="235" stroke="#5aa9e6" stroke-width="2" marker-end="none"/>
<polygon points="272,228 272,242 280,235" fill="#5aa9e6"/>
<rect x="280" y="180" width="105" height="110" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="332" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">Compute kappa</text>
<line x1="385" y1="235" x2="400" y2="235" stroke="#5aa9e6" stroke-width="2" marker-end="none"/>
<polygon points="392,228 392,242 400,235" fill="#5aa9e6"/>
<rect x="400" y="180" width="105" height="110" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="452" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">Inspect</text>
<text x="452" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">disagreements</text>
<line x1="505" y1="235" x2="520" y2="235" stroke="#5aa9e6" stroke-width="2" marker-end="none"/>
<polygon points="512,228 512,242 520,235" fill="#5aa9e6"/>
<rect x="520" y="180" width="105" height="110" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="572" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">Revise the rubric</text>
<text x="572" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">not the judge</text>
<line x1="625" y1="235" x2="640" y2="235" stroke="#5aa9e6" stroke-width="2" marker-end="none"/>
<polygon points="632,228 632,242 640,235" fill="#5aa9e6"/>
<rect x="640" y="180" width="105" height="110" rx="10" fill="#161616" stroke="#5aa9e6" stroke-width="2"/>
<text x="692" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">Repeat until</text>
<text x="692" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ececec">kappa ~ human ceiling</text>
<path d="M 700 290 L 700 380 L 90 380 L 90 290" fill="none" stroke="#e6a75a" stroke-width="2" stroke-dasharray="8,5"/>
<polygon points="82,298 98,298 90,288" fill="#e6a75a"/>
<text x="395" y="404" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#e6a75a">loop back if kappa is below the human ceiling</text>
<text x="400" y="470" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Rule: fix the rubric, never the judge prompt. Editing the judge to chase disagreements overfits.</text>
</svg>