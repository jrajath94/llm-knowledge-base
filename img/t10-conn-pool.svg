<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="t10cp-title t10cp-desc">
<title id="t10cp-title">Connection pool: 50 threads share 10 connections</title>
<desc id="t10cp-desc">Fifty application threads on the left want the database. A pool in the middle holds 10 open connections. Threads borrow a connection, run their query, and return it. A thread that finds the pool empty waits. Opening a fresh connection costs 50 ms; borrowing costs 1 ms.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="420" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">CONNECTION POOL</text>
<rect x="30" y="120" width="170" height="120" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="115.0" y="154" class="box" fill="#ececec">50 threads</text>
<text x="115.0" y="176" class="d">want the DB</text>
<rect x="300" y="100" width="340" height="160" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="470" y="130" class="box" fill="#f0b429">pool: 10 connections</text>
<rect x="320" y="150" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="380" y="150" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="440" y="150" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="500" y="150" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="560" y="150" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="320" y="205" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="380" y="205" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="440" y="205" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="500" y="205" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="560" y="205" width="44" height="40" rx="6" fill="#7fd67f"/>
<rect x="740" y="120" width="170" height="120" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="825.0" y="154" class="box" fill="#ececec">database</text>
<text x="825.0" y="176" class="d">one server</text>
<line x1="200" y1="180" x2="300" y2="180" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10cp-ah)"/>
<text x="250.0" y="174.0" class="d">borrow / return</text>
<line x1="640" y1="180" x2="740" y2="180" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10cp-ah)"/>
<text x="30" y="330" class="dl">Borrow costs 1 ms. A new connection costs 50 ms. The pool pays for itself fast.</text>
<text x="30" y="352" class="dl" fill="#ff7a7a">What breaks: pool too small. Threads wait, latency spikes, timeouts cascade.</text>
<text x="30" y="394" class="capl">How to read: middle box is the pool. Green squares are live connections.</text>
</g>
<defs><marker id="t10cp-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>