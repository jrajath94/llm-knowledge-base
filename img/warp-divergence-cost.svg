<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236" width="100%" style="max-width:700px" role="img" aria-label="Two time phases: if branch runs with 20 threads working and 12 idle, then else branch with 12 working and 20 idle">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="236" fill="none"/>
<text class="t" x="24" y="30">Warp divergence: both branches run, half the warp idles</text>
<text class="m" x="24" y="58">Warp of 32 threads hits an if/else; 20 take if, 12 take else</text>
<line x1="200" y1="70" x2="200" y2="210" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="440" y1="70" x2="440" y2="210" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="big b" x="300" y="84" text-anchor="middle">if branch: 20 threads work</text>
<text class="big b" x="540" y="84" text-anchor="middle">else branch: 12 threads work</text>
