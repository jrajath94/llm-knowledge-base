<text class="r" x="300" y="152" text-anchor="middle">12 threads idle</text>
<text class="r" x="540" y="152" text-anchor="middle">20 threads idle</text>
<text class="num" x="24" y="192">Lockstep: both branches execute in full. Cost = cost(if) + cost(else) whenever both sides are taken.</text>
<text class="gr" x="24" y="214">Keep branches uniform inside a warp and the idle lanes disappear.</text>
