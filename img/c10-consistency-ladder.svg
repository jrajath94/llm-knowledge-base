<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 495" role="img" aria-label="The consistency ladder: from strongest to weakest">
<rect width="900" height="495" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The consistency ladder: from strongest to weakest</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Stronger costs more latency. Pick the cheapest rung that satisfies the domain rule.</text>
<rect x="40.0" y="75.0" width="820.0" height="56.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<rect x="40.0" y="75.0" width="5.0" height="56.0" rx="6" fill="#e5484d" stroke="none" stroke-width="1"/>
<text x="60.0" y="98.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">linearizable</text>
<text x="60.0" y="118.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">behaves like one machine</text>
<text x="830.0" y="108.0" text-anchor="end" fill="#e5484d" font-size="11.5" font-family="Charis SIL, Georgia, serif">the strictest, most expensive</text>
<rect x="40.0" y="141.0" width="820.0" height="56.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<rect x="40.0" y="141.0" width="5.0" height="56.0" rx="6" fill="#ff9f43" stroke="none" stroke-width="1"/>
<text x="60.0" y="164.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">sequential</text>
<text x="60.0" y="184.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">operations look globally ordered</text>
<text x="830.0" y="174.0" text-anchor="end" fill="#ff9f43" font-size="11.5" font-family="Charis SIL, Georgia, serif">still strong, still costly</text>
<rect x="40.0" y="207.0" width="820.0" height="56.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<rect x="40.0" y="207.0" width="5.0" height="56.0" rx="6" fill="#f0b429" stroke="none" stroke-width="1"/>
<text x="60.0" y="230.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">causal</text>
<text x="60.0" y="250.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">causally related writes stay ordered</text>
<text x="830.0" y="240.0" text-anchor="end" fill="#f0b429" font-size="11.5" font-family="Charis SIL, Georgia, serif">cheap enough for most feeds</text>
<rect x="40.0" y="273.0" width="820.0" height="56.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<rect x="40.0" y="273.0" width="5.0" height="56.0" rx="6" fill="#2dd4bf" stroke="none" stroke-width="1"/>
<text x="60.0" y="296.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">read-your-writes</text>
<text x="60.0" y="316.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">your own writes are immediately visible</text>
<text x="830.0" y="306.0" text-anchor="end" fill="#2dd4bf" font-size="11.5" font-family="Charis SIL, Georgia, serif">session-scoped, often free</text>
<rect x="40.0" y="339.0" width="820.0" height="56.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<rect x="40.0" y="339.0" width="5.0" height="56.0" rx="6" fill="#8a8a8a" stroke="none" stroke-width="1"/>
<text x="60.0" y="362.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">eventual</text>
<text x="60.0" y="382.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">converges if writes stop</text>
<text x="830.0" y="372.0" text-anchor="end" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">cheapest, weakest</text>
<text x="40.0" y="433.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Rule of thumb: money and locks get linearizability; feeds and counters get causal or eventual. Never</text>
<text x="40.0" y="449.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">pay for a rung the product does not need.</text>
</svg>
