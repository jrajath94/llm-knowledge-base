<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 470' width='100%' role='img'>
<title>Fetch per step, not per task</title>
<text x='460' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Fetch per step, not per task</text>
<text x='230' y='72' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#c0392b' text-anchor='middle'>Retrieve once at start</text>
<text x='690' y='72' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#2e9e5b' text-anchor='middle'>Fetch per step</text>
<rect x='80' y='95' width='300' height='70' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/>
<text x='230' y='121' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>One retrieval</text>
<text x='230' y='141' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Docs fetched before</text>
<text x='230' y='159' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the loop runs</text>
<rect x='80' y='185' width='300' height='58' rx='10' fill='#8a8a8a' fill-opacity='0.22' stroke='#8a8a8a' stroke-width='2'/>
<text x='230' y='220' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Step 1: stale docs</text>
<rect x='80' y='257' width='300' height='58' rx='10' fill='#8a8a8a' fill-opacity='0.22' stroke='#8a8a8a' stroke-width='2'/>
<text x='230' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Step 2: stale docs</text>
<rect x='80' y='329' width='300' height='58' rx='10' fill='#8a8a8a' fill-opacity='0.22' stroke='#8a8a8a' stroke-width='2'/>
<text x='230' y='364' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Step 3: stale docs</text>
<text x='230' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#c0392b' text-anchor='middle'>Context goes stale by step 3</text>
<rect x='540' y='95' width='150' height='58' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='615' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Step 1</text>
<rect x='710' y='95' width='140' height='58' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='780' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>fresh fetch</text>
<line x1='690' y1='124' x2='710' y2='124' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='701.8,127.7 710,124 701.8,120.3' fill='#8a8a8a'/>
