<text x='615' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Step 2</text>
<rect x='710' y='195' width='140' height='58' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='780' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>fresh fetch</text>
<line x1='690' y1='224' x2='710' y2='224' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='701.8,227.7 710,224 701.8,220.3' fill='#8a8a8a'/>
<line x1='615' y1='253' x2='615' y2='295' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='611.3,286.8 615,295 618.7,286.8' fill='#8a8a8a'/>
<rect x='540' y='295' width='150' height='58' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='615' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Step 3</text>
<rect x='710' y='295' width='140' height='58' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='780' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>fresh fetch</text>
<line x1='690' y1='324' x2='710' y2='324' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='701.8,327.7 710,324 701.8,320.3' fill='#8a8a8a'/>
<text x='690' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#2e9e5b' text-anchor='middle'>Each step retrieves what it needs</text>
</svg>