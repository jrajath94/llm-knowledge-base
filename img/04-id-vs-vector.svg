<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>An ID is a label. A vector is an address with coordinates.</text><rect x='40' y='70' width='420' height='240' rx='10' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='2'/><text x='250' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#a8a8a8' text-anchor='middle'>One-hot ID: a label</text><text x='250' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>cat  = [1, 0, 0, 0, ...]</text><text x='250' y='164' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>dog = [0, 1, 0, 0, ...]</text><text x='250' y='188' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>car  = [0, 0, 1, 0, ...]</text><text x='250' y='236' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cat is as close to dog</text><text x='250' y='260' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>as to car. No similarity survives.</text><rect x='500' y='70' width='420' height='240' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='710' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#4fd1a5' text-anchor='middle'>Learned vector: an address</text><text x='710' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>king - man + woman</text><text x='710' y='164' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>= queen</text><text x='710' y='212' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>directions carry meaning:</text><text x='710' y='236' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>gender, tense, plurality</text><text x='710' y='260' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>become geometry</text><text x='480' y='356' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The embedding table converts labels into geometry. Everything downstream reads the geometry.</text></svg>