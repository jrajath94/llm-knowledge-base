<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.7. Prompt pinning: sys.v14, and hash the rendered prompt into the trace</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">&quot;latest&quot; is not a version</text>
<rect x="24" y="110" width="400" height="140" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">PIN EVERYTHING</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">sys.v14, tools.v7, few-shot.v3: every prompt artifact</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">gets a version</text>
<rect x="456" y="110" width="400" height="140" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HASH INTO THE TRACE</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">hash the fully rendered prompt into each trace;</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">debugging without it is archaeology</text>
<rect x="24" y="290" width="832" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="316" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE DEPLOY RULE</text>
<text x="440.0" y="334" font-size="11" fill="#a8a8a8" text-anchor="middle">promote versions, never &quot;latest&quot;; roll back by version number when the metrics move</text>
<text x="24" y="470" font-size="12" fill="#a8a8a8" text-anchor="start">A prompt change is a code change: versioned, reviewed, gated, and rollback-able.</text>
</svg>