<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" font-family="'Charis SIL',Georgia,serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" /></marker></defs>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">FP8 Format (E4M3)</text>
<rect x="100" y="80" width="40" height="50" fill="#141414" stroke="#8a8a8a" />
<text x="120" y="110" text-anchor="middle" font-size="12" style="fill:#ececec">S</text>
<rect x="140" y="80" width="160" height="50" fill="#141414" stroke="#8a8a8a" />
<text x="220" y="110" text-anchor="middle" font-size="12" style="fill:#ececec">Exponent (4)</text>
<rect x="300" y="80" width="120" height="50" fill="#141414" stroke="#8a8a8a" />
<text x="360" y="110" text-anchor="middle" font-size="12" style="fill:#ececec">Mantissa (3)</text>
<text x="300" y="180" text-anchor="middle" font-size="12" fill="#a8a8a8">8 bits total. Half the size of FP16.</text>
</svg>