<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="RAG index path and query path">
<rect width="800" height="400" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="400.0" y="28" text-anchor="middle" font-size="18" class="accent">RAG: Two Paths</text>
<text x="200" y="60" text-anchor="middle" font-size="14" class="accent">Index Path (offline, once)</text>
<rect x="80" y="80" width="240" height="60" class="box" rx="4"/>
<text x="200.0" y="102" text-anchor="middle" font-size="14">Documents</text>
<text x="200.0" y="120" text-anchor="middle" font-size="11" class="muted">source files</text>
<line x1="200" y1="140" x2="200" y2="170" class="line"/>
<rect x="80" y="170" width="240" height="60" class="box" rx="4"/>
<text x="200.0" y="192" text-anchor="middle" font-size="14">Chunks</text>
<text x="200.0" y="210" text-anchor="middle" font-size="11" class="muted">500 tokens, overlap</text>
<line x1="200" y1="230" x2="200" y2="260" class="line"/>
<rect x="80" y="260" width="240" height="60" class="box" rx="4"/>
<text x="200.0" y="282" text-anchor="middle" font-size="14">Embeddings</text>
<text x="200.0" y="300" text-anchor="middle" font-size="11" class="muted">vectors</text>
<line x1="200" y1="320" x2="200" y2="350" class="line"/>
<text x="200" y="375" text-anchor="middle" font-size="12" class="muted">ANN Index</text>
<text x="600" y="60" text-anchor="middle" font-size="14" class="accent">Query Path (online, per question)</text>
<rect x="480" y="80" width="240" height="60" class="box" rx="4"/>
<text x="600.0" y="102" text-anchor="middle" font-size="14">Question</text>
<text x="600.0" y="120" text-anchor="middle" font-size="11" class="muted">user input</text>
<line x1="600" y1="140" x2="600" y2="170" class="line"/>
<rect x="480" y="170" width="240" height="60" class="box" rx="4"/>
<text x="600.0" y="192" text-anchor="middle" font-size="14">Embed Question</text>
<text x="600.0" y="210" text-anchor="middle" font-size="11" class="muted">same model</text>
<line x1="600" y1="230" x2="600" y2="260" class="line"/>
<rect x="480" y="260" width="240" height="60" class="box" rx="4"/>
<text x="600.0" y="282" text-anchor="middle" font-size="14">Search Index</text>
<text x="600.0" y="300" text-anchor="middle" font-size="11" class="muted">top-k chunks</text>
<line x1="600" y1="320" x2="600" y2="350" class="line"/>
<text x="600" y="375" text-anchor="middle" font-size="12" class="muted">Generate Answer</text>
</svg>