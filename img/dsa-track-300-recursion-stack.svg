<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 560" role="img" aria-label="The call stack during factorial(4)">
<rect width="900" height="560" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The call stack during factorial(4)</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Each call waits for the call below it. Results flow back up in reverse order.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<rect x="180" y="80" width="540" height="74" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="200" y="110" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">factorial(4)</text>
<text x="200" y="134" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">waits for factorial(3)</text>
<line x1="450" y1="154" x2="450" y2="184" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="176" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">calls</text>
<rect x="180" y="184" width="540" height="74" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="200" y="214" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">factorial(3)</text>
<text x="200" y="238" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">waits for factorial(2)</text>
<line x1="450" y1="258" x2="450" y2="288" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="280" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">calls</text>
<rect x="180" y="288" width="540" height="74" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="200" y="318" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">factorial(2)</text>
<text x="200" y="342" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">waits for factorial(1)</text>
<line x1="450" y1="362" x2="450" y2="392" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="384" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">calls</text>
<rect x="180" y="392" width="540" height="74" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="200" y="422" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">factorial(1)</text>
<text x="200" y="446" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">base case: returns 1</text>
<text x="700" y="436" text-anchor="end" fill="#7bc96f" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">returns 1</text>
<text x="760" y="130" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">returns flow up:</text>
<line x1="760" y1="240" x2="760" y2="176" stroke="#7bc96f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="770" y="212" text-anchor="start" fill="#7bc96f" font-size="12" font-family="Charis SIL, Georgia, serif">2</text>
<line x1="760" y1="344" x2="760" y2="280" stroke="#7bc96f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="770" y="316" text-anchor="start" fill="#7bc96f" font-size="12" font-family="Charis SIL, Georgia, serif">6</text>
<line x1="760" y1="448" x2="760" y2="384" stroke="#7bc96f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="770" y="420" text-anchor="start" fill="#7bc96f" font-size="12" font-family="Charis SIL, Georgia, serif">24</text>
</svg>
