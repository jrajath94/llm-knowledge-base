<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="620" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The reward pipeline: from rollout to scalar</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">The verifier is the reward model written in code</text>
<rect x="24" y="104" width="128" height="96" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="88.0" y="130" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Raw rollout</text>
<line x1="152" y1="152.0" x2="168" y2="152.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="168,152.0 159.78219953718923,155.66984407753614 159.78219953718923,148.33015592246386" fill="#8a8a8a"/>
<rect x="168" y="104" width="128" height="96" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="232.0" y="130" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Normalize output</text>
<line x1="296" y1="152.0" x2="312" y2="152.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="312,152.0 303.78219953718923,155.66984407753614 303.78219953718923,148.33015592246386" fill="#8a8a8a"/>
<rect x="312" y="104" width="128" height="96" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="376.0" y="130" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Extract answer</text>
<line x1="440" y1="152.0" x2="456" y2="152.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="456,152.0 447.78219953718923,155.66984407753614 447.78219953718923,148.33015592246386" fill="#8a8a8a"/>
<rect x="456" y="104" width="128" height="96" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="520.0" y="130" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Run checks</text>
<line x1="584" y1="152.0" x2="600" y2="152.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="600,152.0 591.7821995371892,155.66984407753614 591.7821995371892,148.33015592246386" fill="#8a8a8a"/>
<rect x="600" y="104" width="128" height="96" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="664.0" y="130" font-size="11" font-weight="bold" fill="#4fd1a5" text-anchor="middle">Aggregate to scalar</text>
<line x1="728" y1="152.0" x2="744" y2="152.0" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="744,152.0 735.7821995371892,155.66984407753614 735.7821995371892,148.33015592246386" fill="#8a8a8a"/>
<rect x="744" y="104" width="128" height="96" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="808.0" y="130" font-size="11" font-weight="bold" fill="#6cb2ff" text-anchor="middle">Log everything</text>
<text x="88.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">the model&#x27;s</text>
<text x="88.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">full text</text>
<text x="232.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">strip wrappers,</text>
<text x="232.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">find the boxed</text>
<text x="376.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">tests pass?</text>
<text x="376.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">mean, majority,</text>
<text x="520.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">every input,</text>
<text x="520.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">the RL update</text>
<text x="664.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">formatting</text>
<text x="664.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">number</text>
<text x="808.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">proof valid?</text>
<text x="808.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">pass@k</text>
<text x="952.0" y="154" font-size="10" fill="#a8a8a8" text-anchor="middle">check, verdict</text>
<text x="952.0" y="170" font-size="10" fill="#a8a8a8" text-anchor="middle">consumes it</text>
<rect x="24" y="260" width="852" height="176" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="292" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Where reward hacking is born</text>
<text x="48" y="322" font-size="11" fill="#a8a8a8" text-anchor="start">Not in the RL algorithm: in the plumbing. A verifier that counts a crashed solution as passed. A math</text>
<text x="48" y="339" font-size="11" fill="#a8a8a8" text-anchor="start">checker that accepts &#x27;42&#x27; inside a paragraph of nonsense. An extraction regex that grabs the wrong</text>
<text x="48" y="356" font-size="11" fill="#a8a8a8" text-anchor="start">number. Each gap becomes the behavior the model learns: the model optimizes the verifier, not the</text>
<text x="48" y="373" font-size="11" fill="#a8a8a8" text-anchor="start">intent.</text>
<text x="24" y="460" font-size="12" fill="#f0b429" text-anchor="start">A reward function you cannot trust teaches the wrong thing, and the model will find the gap.</text>
</svg>