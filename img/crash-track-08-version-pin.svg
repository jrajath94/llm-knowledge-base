<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
<rect width="560" height="280" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Pin versions: never serve 'latest'</text><text x='60' y='90' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>2 p.m.</text><text x='60' y='150' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='middle'>prompt edit</text><line x1='60' y1='170' x2='60' y2='210' stroke='#e57ea6' stroke-width='2'/><polygon points='60,210 51,206 51,214' fill='#e57ea6'/><text x='60' y='240' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='middle'>2 a.m.</text><text x='60' y='262' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='middle'>incident</text><text x='200' y='110' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>version every template</text><text x='200' y='134' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>sys.v14  examples.v6  tools.v3</text><text x='200' y='170' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>hash the rendered prompt into the trace</text><text x='200' y='194' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>the hash catches edits that skipped the version bump</text><text x='200' y='230' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>route every change through the regression suite</text></svg>