<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='100%' role='img'><text x='20' y='32' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>After the spine: specialize, then review</text><text x='20' y='56' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>The spine is the same for everyone. What you do next depends on your target role.</text><rect x='22' y='90' width='300' height='120' rx='10' fill='#1565c0' fill-opacity='0.16' stroke='#1565c0' stroke-width='2'/><text x='172.0' y='126' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>1. Finish the spine</text><text x='172.0' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Vols 0-14 in order</text><rect x='346' y='90' width='300' height='120' rx='10' fill='#f0b429' fill-opacity='0.16' stroke='#f0b429' stroke-width='2'/><text x='496.0' y='126' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>2. Pick a role track</text><text x='496.0' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>spine re-ordered for the role</text><text x='496.0' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>plus specialist chapters</text><rect x='670' y='90' width='268' height='120' rx='10' fill='#2e7d32' fill-opacity='0.16' stroke='#2e7d32' stroke-width='2'/><text x='804.0' y='126' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>3. Review with a crash pack</text><text x='804.0' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>rapid-fire questions</text><text x='804.0' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cheat sheet, decision rules</text><path d='M320 150 L342 150' stroke='#8a8a8a' stroke-width='2'/><path d='M332 142 L342 150 L332 158' fill='none' stroke='#8a8a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M644 150 L666 150' stroke='#8a8a8a' stroke-width='2'/><path d='M656 142 L666 150 L656 158' fill='none' stroke='#8a8a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><text x='20' y='252' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Ten tracks exist, one per target role. Each crash pack reviews its track in a single volume.</text><text x='20' y='278' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>The DSA track runs alongside all three stages.</text></svg>