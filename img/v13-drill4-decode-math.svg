<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Drill 4: do the decode arithmetic before accepting the SLO"><rect x="22" y="14" width="916" height="320" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">DRILL 4</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">256 output tokens at 20.9 ms per step. Full-generation p99 under 2 s?</text><rect x="22.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="134" font-size="27" font-weight="700" fill="#f0b429">5.4 s</text><text x="38.0" y="156" font-size="12.5" fill="#a8a8a8">minimum: 256 decode steps x 20.9 ms per step</text><rect x="487.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="134" font-size="27" font-weight="700" fill="#f0b429">2 s</text><text x="503.0" y="156" font-size="12.5" fill="#a8a8a8">the asked SLO: physically impossible at this output</text><text x="503.0" y="172" font-size="12.5" fill="#a8a8a8">length</text><rect x="22.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="244" font-size="27" font-weight="700" fill="#f0b429">the fix</text><text x="38.0" y="266" font-size="12.5" fill="#a8a8a8">the SLO must mean time-to-first-token plus inter-token</text><text x="38.0" y="282" font-size="12.5" fill="#a8a8a8">latency for streaming</text><rect x="38" y="328" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="350" font-size="13.5" fill="#7fd08a">Never accept an impossible SLO silently. Doing the math and pushing back is senior behavior.</text></svg>