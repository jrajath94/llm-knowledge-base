<svg xmlns='http://www.w3.org/2000/svg' width='700' height='420' viewBox='0 0 700 420' font-family='DejaVu Sans'>
<rect width='700' height='420' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>The kernel trick: XOR is not linear in 2D, but is after the lift</text>
<text x='200' y='80' font-size='12' fill='#9a9a9a' text-anchor='middle'>input space (2D)</text>
<circle cx='140' cy='150' r='12' fill='#8fc7ff'/>
<circle cx='260' cy='150' r='12' fill='#ff7b8a'/>
<circle cx='140' cy='270' r='12' fill='#ff7b8a'/>
<circle cx='260' cy='270' r='12' fill='#8fc7ff'/>
<text x='200' y='320' font-size='12' fill='#ff7b8a' text-anchor='middle'>no straight line separates</text>
<line x1='330' y1='210' x2='390' y2='210' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='390,210 382,206.5 382,213.5' fill='#e8e8e8'/>
<text x='360' y='195' font-size='11' fill='#9a9a9a' text-anchor='middle'>RBF</text>
<text x='560' y='80' font-size='12' fill='#9a9a9a' text-anchor='middle'>lifted space</text>
<circle cx='500' cy='130' r='12' fill='#8fc7ff'/>
<circle cx='620' cy='130' r='12' fill='#ff7b8a'/>
<circle cx='500' cy='290' r='12' fill='#ff7b8a'/>
<circle cx='620' cy='290' r='12' fill='#8fc7ff'/>
<line x1='480' y1='210' x2='640' y2='210' stroke='#7fd08a' stroke-width='2.5'/>
<text x='560' y='320' font-size='12' fill='#7fd08a' text-anchor='middle'>now linearly separable</text>
<text x='350' y='370' font-size='12' fill='#9a9a9a' text-anchor='middle'>The kernel computes the lift implicitly: no explicit feature map needed.</text>
</svg>