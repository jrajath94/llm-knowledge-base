<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 575" role="img" aria-label="What to distrust: the seven standard failure modes">
<rect width="900" height="575" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">What to distrust: the seven standard failure modes</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A catalog of failure modes learned from years of reproductions that did not reproduce.</text>
<rect x="40.0" y="79.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="103.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Missing ablations</text>
<text x="60.0" y="123.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">The new ingredient is never isolated, so the causal claim is unproven.</text>
<rect x="40.0" y="145.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="169.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Weak baselines</text>
<text x="60.0" y="189.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">The baseline got default hyperparameters while the new method was tuned. Assume this until shown</text>
<text x="60.0" y="203.8" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">otherwise.</text>
<rect x="40.0" y="211.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="235.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Single-seed results</text>
<text x="60.0" y="255.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">One seed is one sample from a noisy process. Small deltas on one seed are noise.</text>
<rect x="40.0" y="277.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="301.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Eval contamination</text>
<text x="60.0" y="321.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">The method saw eval-adjacent data. No decontamination section is the signal.</text>
<rect x="40.0" y="343.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="367.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Truncated axes</text>
<text x="60.0" y="387.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A y-axis starting at 0.80 makes 0.81 vs 0.83 look enormous. Read the numbers, not the ink.</text>
<rect x="40.0" y="409.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="433.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Scale of claimed generality</text>
<text x="60.0" y="453.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">'Works on 7B' does not imply 'works at 70B'. The claim travels only as far as the evidence.</text>
<rect x="40.0" y="475.0" width="820.0" height="58.0" rx="6" fill="#141414" stroke="#e5484d" stroke-width="1.2"/>
<text x="60.0" y="499.0" text-anchor="start" fill="#e5484d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">The missing negative</text>
<text x="60.0" y="519.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">No failure modes discussed means the authors did not look, or did not tell. Both are information.</text>
</svg>
