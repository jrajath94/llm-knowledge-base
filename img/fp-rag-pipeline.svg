<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="340" fill="#0d0d0d" rx="8"/>
  <!-- INDEX lane -->
  <rect x="20" y="20" width="860" height="140" fill="#101a18" stroke="#1f3a35" rx="6"/>
  <text x="40" y="48" fill="#45b8ac" font-size="13" font-weight="700">INDEX PATH (offline, done once)</text>
  <g font-size="12">
    <rect x="40" y="65" width="130" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="105" y="95" fill="#ececec" text-anchor="middle">documents</text>
    <text x="105" y="115" fill="#a8a8a8" text-anchor="middle">your corpus</text>
    <rect x="210" y="65" width="130" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="275" y="95" fill="#ececec" text-anchor="middle">chunks</text>
    <text x="275" y="115" fill="#a8a8a8" text-anchor="middle">+ overlap</text>
    <rect x="380" y="65" width="150" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="455" y="95" fill="#ececec" text-anchor="middle">embeddings</text>
    <text x="455" y="115" fill="#a8a8a8" text-anchor="middle">[0.12, -0.44, ...]</text>
    <rect x="570" y="65" width="150" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="645" y="95" fill="#ececec" text-anchor="middle">vector index</text>
    <text x="645" y="115" fill="#a8a8a8" text-anchor="middle">ANN: HNSW / IVF</text>
    <rect x="760" y="65" width="100" height="70" fill="#1f2a33" stroke="#6cb2ff" rx="5"/>
    <text x="810" y="95" fill="#ececec" text-anchor="middle">store</text>
    <text x="810" y="115" fill="#a8a8a8" text-anchor="middle">+ text</text>
  </g>
  <g stroke="#45b8ac" stroke-width="2" marker-end="url(#ag)">
    <line x1="170" y1="100" x2="208" y2="100"/><line x1="340" y1="100" x2="378" y2="100"/>
    <line x1="530" y1="100" x2="568" y2="100"/><line x1="720" y1="100" x2="758" y2="100"/>
  </g>
  <!-- QUERY lane -->
  <rect x="20" y="180" width="860" height="140" fill="#191510" stroke="#3a2f1a" rx="6"/>
  <text x="40" y="208" fill="#f0b429" font-size="13" font-weight="700">QUERY PATH (online, every question)</text>
  <g font-size="12">
    <rect x="40" y="225" width="110" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="95" y="255" fill="#ececec" text-anchor="middle">question</text>
    <text x="95" y="275" fill="#a8a8a8" text-anchor="middle">embed it</text>
    <rect x="190" y="225" width="130" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="255" y="255" fill="#ececec" text-anchor="middle">search index</text>
    <text x="255" y="275" fill="#a8a8a8" text-anchor="middle">top-k chunks</text>
    <rect x="360" y="225" width="150" height="70" fill="#141414" stroke="#3a3a3a" rx="5"/>
    <text x="435" y="255" fill="#ececec" text-anchor="middle">build prompt</text>
    <text x="435" y="275" fill="#a8a8a8" text-anchor="middle">Q + passages</text>
    <rect x="550" y="225" width="120" height="70" fill="#1f2a33" stroke="#6cb2ff" rx="5"/>
    <text x="610" y="255" fill="#ececec" text-anchor="middle">LLM</text>
    <text x="610" y="275" fill="#a8a8a8" text-anchor="middle">generates</text>
    <rect x="710" y="225" width="150" height="70" fill="#141414" stroke="#45b8ac" stroke-width="2" rx="5"/>
    <text x="785" y="255" fill="#ececec" text-anchor="middle">grounded answer</text>
    <text x="785" y="275" fill="#a8a8a8" text-anchor="middle">+ citations</text>
  </g>
  <g stroke="#f0b429" stroke-width="2" marker-end="url(#ao)">
    <line x1="150" y1="260" x2="188" y2="260"/><line x1="320" y1="260" x2="358" y2="260"/>
    <line x1="510" y1="260" x2="548" y2="260"/><line x1="670" y1="260" x2="708" y2="260"/>
  </g>
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#45b8ac" stroke-width="1.6"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
  </defs>
</svg>
