<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='100%' role='img'><rect x='0' y='0' width='960' height='330' rx='12' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>When to open a module you own</text><text x='24' y='56' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>the spine decides, not curiosity</text><polygon points='480,80 640,175 480,270 320,175' fill='#111111' stroke='#f0b429' stroke-width='2.5'/><text x='480' y='160' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Does the current</text><text x='480' y='182' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>volume point to it?</text><line x1='640' y1='175' x2='700' y2='175' stroke='#2e7d32' stroke-width='2'/><polygon points='700,175 691,170 691,180' fill='#2e7d32'/><rect x='700' y='125' width='200' height='100' rx='10' fill='#111111' stroke='#2e7d32' stroke-width='2'/><text x='800.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Open it</text><text x='800.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>read the named chapter</text><text x='668' y='160' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#2e7d32' text-anchor='middle'>yes</text><line x1='480' y1='270' x2='480' y2='300' stroke='#c62828' stroke-width='2'/><polygon points='480,300 471,295 471,305' fill='#c62