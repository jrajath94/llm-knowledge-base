<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="100%" style="max-width:680px" role="img" aria-label="Latency anatomy: TTFT is queue plus prefill, then each output token adds one TPOT step">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Latency anatomy: TTFT plus TPOT times tokens</text>
<text class="m" x="24" y="52">TTFT is time to first token. TPOT is time per output token.</text>
<text class="big" x="24" y="105">TTFT</text>
<rect x="150" y="82" width="60" height="38" rx="6" fill="#3a3a3a"/>
<text class="m" x="180" y="106" text-anchor="middle" fill="#ececec">queue</text>
<rect x="210" y="82" width="290" height="38" rx="6" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="355" y="106" text-anchor="middle" fill="#101010">prefill: 0.29 s</text>
<text class="big" x="24" y="185">TPOT</text>
<rect x="150" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="195" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="240" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="285" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="330" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="375" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="420" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="465" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="510" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<rect x="555" y="162" width="38" height="38" rx="6" fill="#7fc97f" opacity="0.85"/>
<text class="m" x="150" y="222">each token: 0.042 s, streamed one after another</text>
<rect class="box" x="24" y="248" width="632" height="76" rx="8"/>
<text class="big" x="40" y="276">Total = TTFT + TPOT x N.</text>
<text class="m" x="40" y="298">Prefill dominates TTFT. Prefix caching skips the prefill, so TTFT collapses.</text>
<text class="m" x="40" y="318">Long outputs dominate total time. Cap output length to protect the pool.</text>
</svg>
