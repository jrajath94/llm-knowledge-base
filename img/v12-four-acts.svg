<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The spine: four acts plus a bottom row"><rect x="22" y="14" width="916" height="364" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">SYNTHESIS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Fourteen papers, one story you can redraw from memory</text><rect x="38" y="96" width="231.3018765625" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Act 1: the foundation</text><text x="54" y="144" font-size="12" fill="#a8a8a8">Papers 1-5: the</text><text x="54" y="160" font-size="12" fill="#a8a8a8">transformer, RoPE,</text><text x="54" y="176" font-size="12" fill="#a8a8a8">FlashAttention, GPT-2,</text><text x="54" y="192" font-size="12" fill="#a8a8a8">GPT-3. Conditioning</text><text x="54" y="208" font-size="12" fill="#a8a8a8">becomes programming.</text><line x1="279.3018765625" y1="160.0" x2="293.3018765625" y2="160.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="293.3018765625,155.0 301.3018765625,160.0 293.3018765625,165.0" fill="#a8a8a8"/><rect x="309.3018765625" y="96" width="274.92020781250005" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="329.3018765625" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="329.3018765625" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="349.3018765625" y="123" font-size="13.5" font-weight="700" fill="#ececec">Act 2: the science of scale</text><text x="325.3018765625" y="144" font-size="12" fill="#a8a8a8">Papers 6-7: Kaplan power</text><text x="325.3018765625" y="160" font-size="12" fill="#a8a8a8">laws, the Chinchilla</text><text x="325.3018765625" y="176" font-size="12" fill="#a8a8a8">correction. Training</text><text x="325.3018765625" y="192" font-size="12" fill="#a8a8a8">becomes engineering.</text><line x1="594.2220843750001" y1="160.0" x2="608.2220843750001" y2="160.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="608.2220843750001,155.0 616.2220843750001,160.0 608.2220843750001,165.0" fill="#a8a8a8"/><rect x="624.2220843750001" y="96" width="220.25679999999997" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="644.2220843750001" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="644.2220843750001" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="664.2220843750001" y="123" font-size="13.5" font-weight="700" fill="#ececec">Act 3: alignment</text><text x="640.2220843750001" y="144" font-size="12" fill="#a8a8a8">Papers 8-10: InstructGPT,</text><text x="640.2220843750001" y="160" font-size="12" fill="#a8a8a8">Constitutional AI, DPO.</text><text x="640.2220843750001" y="176" font-size="12" fill="#a8a8a8">Post-training becomes a</text><text x="640.2220843750001" y="192" font-size="12" fill="#a8a8a8">solved engineering</text><text x="640.2220843750001" y="208" font-size="12" fill="#a8a8a8">problem.</text><rect x="38" y="248" width="305.647684375" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="270" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="275" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="275" font-size="13.5" font-weight="700" fill="#ececec">Act 4: the modern open stack</text><text x="54" y="296" font-size="12" fill="#a8a8a8">Papers 11-12: LLaMA,</text><text x="54" y="312" font-size="12" fill="#a8a8a8">Mixtral. Frontier-adjacent</text><text x="54" y="328" font-size="12" fill="#a8a8a8">work on one GPU.</text><line x1="353.647684375" y1="312.0" x2="367.647684375" y2="312.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="367.647684375,307.0 375.647684375,312.0 367.647684375,317.0" fill="#a8a8a8"/><rect x="383.647684375" y="248" width="320" height="128" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="403.647684375" cy="270" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="403.647684375" y="275" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">5</text><text x="423.647684375" y="275" font-size="13.5" font-weight="700" fill="#ececec">Bottom row: grounding and reasoning</text><text x="399.647684375" y="296" font-size="12" fill="#a8a8a8">Papers 13-14: RAG, ReAct,</text><text x="399.647684375" y="312" font-size="12" fill="#a8a8a8">DeepSeek-R1. Knowledge</text><text x="399.647684375" y="328" font-size="12" fill="#a8a8a8">becomes retrievable,</text><text x="399.647684375" y="344" font-size="12" fill="#a8a8a8">correctness becomes</text><text x="399.647684375" y="360" font-size="12" fill="#a8a8a8">checkable.</text></svg>