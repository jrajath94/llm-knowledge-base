<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The six attack families: one ladder, one goal each</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">all adversarial pressure on a model is some form of these six</text>
<rect x="24" y="110" width="832" height="62" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="136" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">1. direct</text>
<text x="48" y="156" font-size="11.5" fill="#a8a8a8" text-anchor="start">ask outright; the baseline everything else is measured against</text>
<rect x="24" y="182" width="832" height="62" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="208" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">2. roleplay / persona</text>
<text x="48" y="228" font-size="11.5" fill="#a8a8a8" text-anchor="start">&quot;you are a helpful security researcher&quot; and its cousins</text>
<rect x="24" y="254" width="832" height="62" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="280" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">3. encoding / translation</text>
<text x="48" y="300" font-size="11.5" fill="#a8a8a8" text-anchor="start">base64, leetspeak, low-resource languages hide the request</text>
<rect x="24" y="326" width="832" height="62" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="352" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">4. multi-turn</text>
<text x="48" y="372" font-size="11.5" fill="#a8a8a8" text-anchor="start">harmless steps that compose into a harmful whole</text>
<rect x="24" y="398" width="832" height="62" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="424" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">5. instruction smuggling</text>
<text x="48" y="444" font-size="11.5" fill="#a8a8a8" text-anchor="start">system-style directives hidden inside user content</text>
<rect x="24" y="470" width="832" height="62" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="496" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">6. automated search</text>
<text x="48" y="516" font-size="11.5" fill="#a8a8a8" text-anchor="start">optimizers that learn the jailbreak for you</text>
<text x="24" y="548" font-size="12" fill="#a8a8a8" text-anchor="start">Memorize the six names cold. In an eval report, naming the family the break belongs to is what turns an</text>
<text x="24" y="565" font-size="12" fill="#a8a8a8" text-anchor="start">anecdote into coverage.</text>
</svg>