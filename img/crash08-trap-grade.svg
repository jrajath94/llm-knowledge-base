<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.4. Trap 6: grading retrieval instead of answers</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">the user never sees your recall@k</text>
<rect x="24" y="110" width="400" height="140" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE MISTAKE</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the dashboard shows recall@5 climbing while users rate</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">the answers worse</text>
<rect x="456" y="110" width="400" height="140" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE FIX</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">grade end to end: the answer, its citations, and</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">whether it used the retrieved evidence</text>
<text x="24" y="330" font-size="12" fill="#a8a8a8" text-anchor="start">Retrieval metrics are diagnostics, not goals. The eval that matters answers the user&#x27;s question from the</text>
<text x="24" y="348" font-size="12" fill="#a8a8a8" text-anchor="start">trace.</text>
<text x="24" y="390" font-size="12" fill="#a8a8a8" text-anchor="start">Keep both: retrieval metrics for debugging, answer metrics for the gate.</text>
</svg>