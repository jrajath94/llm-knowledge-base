<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 268" width="100%" style="max-width:700px" role="img" aria-label="Four consecutive elements with two kept and two pruned, stored as two values plus two 2-bit position indices">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="252" fill="none"/>
<text class="t" x="24" y="30">The 2:4 sparsity contract: exactly 2 of every 4</text>
<text class="m" x="24" y="58">Every 4 consecutive elements along K hold exactly 2 nonzeros</text>
<rect x="24" y="72" width="90" height="70" rx="6" fill="#7fc97f" stroke="#3a3a3a" stroke-width="1.5"/>
<text class="big" x="69" y="114" text-anchor="middle">0.8</text>
<rect x="126" y="72" width="90" height="70" rx="6" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1.5"/>
<text class="big" x="171" y="114" text-anchor="middle">0.0</text>
<rect x="228" y="72" width="90" height="70" rx="6" fill="#7fc97f" stroke="#3a3a3a" stroke-width="1.5"/>
<text class="big" x="273" y="114" text-anchor="middle">-0.3</text>
<rect x="330" y="72" width="90" height="70" rx="6" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1.5"/>
<text class="big" x="375" y="114" text-anchor="middle">0.0</text>
<text class="num" x="24" y="172">Stored: 2 values (4 bytes) + two 2-bit indices (0.5 byte) = 4.5 bytes per group</text>
<text class="gr" x="24" y="196">4.5 / 8 = 0.5625 -&gt; 44% smaller than dense fp16. Sparse tensor core runs it at 2x dense rate.</text>
<text class="r" x="24" y="228">Random 50% sparsity gets nothing: the sparse datapath cannot consume it.</text>
<text class="r" x="24" y="248">2:4 is a strict contract.</text>
</svg>
