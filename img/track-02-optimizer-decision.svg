<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580" viewBox="0 0 700 580" role="img" aria-label="Decision flow for choosing DPO, PPO, or GRPO">
<rect width="700" height="580" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
<marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/></marker>
</defs>
<text x="24" y="34" class="t">Which optimizer? Decide by verifier and budget</text><rect x="250" y="52" width="200" height="56" rx="8" class="box"/><text x="350.0" y="82" text-anchor="middle" class="t" fill="#2dd4bf">Start: SFT done</text><path d="M 350 108 L 350 138" class="arr2"/><polygon points="350,139 510,195 350,251 190,195" class="box"/><text x="350" y="193" text-anchor="middle" class="s">Do you have</text><text x="350" y="211" text-anchor="middle" class="s">a fast verifier?</text><rect x="40" y="300" width="220" height="64" rx="8" class="box"/><text x="150.0" y="330" text-anchor="middle" class="t" fill="#2dd4bf">Use GRPO</text><text x="150.0" y="350" text-anchor="middle" class="ss">math, code, unit tests</text><path d="M190,195 L120,195 L120,300 L148,300" class="arr"/><text x="100" y="188" class="s" fill="#2dd4bf">yes</text><path d="M 350 251 L 350 281" class="arr2"/><polygon points="350,284 510,340 350,396 190,340" class="box"/><text x="350" y="338" text-anchor="middle" class="s">Is cheap and</text><text x="350" y="356" text-anchor="middle" class="s">simple enough?</text><text x="368" y="292" class="s">no</text><rect x="40" y="440" width="220" height="64" rx="8" class="box"/><text x="150.0" y="470" text-anchor="middle" class="t" fill="#4aa8ff">Use DPO</text><text x="150.0" y="490" text-anchor="middle" class="ss">pairs only, no sampling</text><path d="190,340 H150 V440" class="arr2"/><text x="160" y="332" class="s">yes</text><rect x="440" y="440" width="220" height="64" rx="8" class="box"/><text x="550.0" y="470" text-anchor="middle" class="t" fill="#f0b429">Use PPO</text><text x="550.0" y="490" text-anchor="middle" class="ss">online, needs tuning</text><path d="M 510 340 L 550 340 L 550 440" class="arr2"/><text x="530" y="332" class="s">no</text><text x="350" y="540" class="ss">Default: start with DPO. Upgrade only when an eval gate demands it.</text></svg>