<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="A single neuron with worked numbers">
<rect width="720" height="400" fill="#ffffff"/>
<style>text{font-family:Georgia,'Times New Roman',serif;fill:#1a1a1a} .lbl{font-size:17px} .sm{font-size:14px;fill:#444} .num{font-size:16px;font-weight:bold} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:#1a1a1a}</style>
<text x="360" y="34" text-anchor="middle" class="lbl" font-weight="bold">One neuron: z = w1*x1 + w2*x2 + w3*x3 + b, then a = ReLU(z)</text><circle cx="90" cy="110" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="90" y="106" text-anchor="middle" class="sm">x1</text><text x="90" y="126" text-anchor="middle" class="num">2.0</text><line x1="122" y1="110" x2="268" y2="190" stroke="#64748b" stroke-width="2"/><text x="185" y="142" text-anchor="middle" class="sm">w1=0.8</text><circle cx="90" cy="190" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="90" y="186" text-anchor="middle" class="sm">x2</text><text x="90" y="206" text-anchor="middle" class="num">-1.0</text><line x1="122" y1="190" x2="268" y2="190" stroke="#64748b" stroke-width="2"/><text x="185" y="182" text-anchor="middle" class="sm">w2=-0.4</text><circle cx="90" cy="270" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="90" y="266" text-anchor="middle" class="sm">x3</text><text x="90" y="286" text-anchor="middle" class="num">0.5</text><line x1="122" y1="270" x2="268" y2="190" stroke="#64748b" stroke-width="2"/><text x="185" y="222" text-anchor="middle" class="sm">w3=1.2</text><circle cx="300" cy="190" r="34" fill="#fff7e6" stroke="#d97706" stroke-width="2.5"/><text x="300" y="198" text-anchor="middle" class="lbl" font-weight="bold">Σ</text><text x="352" y="150" text-anchor="middle" class="sm">+ b = 0.3</text><line x1="338" y1="190" x2="412" y2="190" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="375" y="182" text-anchor="middle" class="sm">z = 2.9</text><rect x="412" y="160" width="86" height="60" rx="8" fill="#e6f7f3" stroke="#0d9488" stroke-width="2.5"/><text x="455" y="184" text-anchor="middle" class="sm">ReLU</text><text x="455" y="206" text-anchor="middle" class="sm">max(0,z)</text><line x1="498" y1="190" x2="560" y2="190" stroke="#1a1a1a" stroke-width="2"/><circle cx="600" cy="190" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="600" y="184" text-anchor="middle" class="sm">output</text><text x="600" y="206" text-anchor="middle" class="num">2.9</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/></marker></defs><text x="360" y="300" text-anchor="middle" class="mono">z = (2.0)(0.8) + (-1.0)(-0.4) + (0.5)(1.2) + 0.3</text><text x="360" y="328" text-anchor="middle" class="mono">= 1.6 + 0.4 + 0.6 + 0.3 = 2.9  -&gt;  ReLU(2.9) = 2.9</text><text x="360" y="366" text-anchor="middle" class="sm">weights decide how much each input matters; the bias shifts the sum; ReLU bends it</text></svg>