<svg xmlns='http://www.w3.org/2000/svg' width='720' height='400' viewBox='0 0 720 400' font-family='DejaVu Sans'>
<rect width='720' height='400' fill='#0a0a0a'/>
<text x='360' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Leakage: a feature that uses post-label information</text>
<line x1='60' y1='190' x2='660' y2='190' stroke='#e8e8e8' stroke-width='2'/>
<line x1='220' y1='175' x2='220' y2='205' stroke='#ff7b8a' stroke-width='3'/>
<text x='220' y='160' font-size='11' fill='#9a9a9a' text-anchor='middle'>label</text>
<text x='220' y='240' font-size='12' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>label timestamp</text>
<line x1='430' y1='175' x2='430' y2='205' stroke='#f0b429' stroke-width='3'/>
<text x='430' y='160' font-size='11' fill='#9a9a9a' text-anchor='middle'>feature computed</text>
<text x='430' y='240' font-size='12' fill='#f0b429' text-anchor='middle'>feature (uses future info)</text>
<line x1='600' y1='175' x2='600' y2='205' stroke='#7fd08a' stroke-width='3'/>
<text x='600' y='160' font-size='11' fill='#9a9a9a' text-anchor='middle'>prediction</text>
<text x='600' y='240' font-size='12' fill='#7fd08a' text-anchor='middle'>prediction time</text>
<path d='M420,215 Q320,260 230,215' fill='none' stroke='#ff7b8a' stroke-width='2' stroke-dasharray='5,4'/>
<polygon points='230,215 240,211 240,219' fill='#ff7b8a'/>
<text x='325' y='275' font-size='12' fill='#ff7b8a' text-anchor='middle'>reaches back past the label</text>
<text x='360' y='320' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>LEAK: validation jumps toward 100%. Perfect offline, dead online.</text>
<text x='360' y='355' font-size='12' fill='#9a9a9a' text-anchor='middle'>Fix: rebuild the feature as-of the label time. If the jump disappears, you found the leak.</text>
</svg>