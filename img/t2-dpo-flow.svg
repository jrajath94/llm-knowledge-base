<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-label="DPO worked example from log-probs to loss">
<rect width="720" height="550" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">DPO, one preference pair, all the way through</text>
<rect class="box" x="30" y="60" width="180" height="120" rx="8"/>
<text class="t" x="120" y="84" text-anchor="middle">the pair</text>
<text class="s" x="120" y="104" text-anchor="middle">prompt: explain</text>
<text class="s" x="120" y="121" text-anchor="middle">inflation</text>
<text class="s" x="120" y="138" text-anchor="middle">chosen + rejected</text>
<line x1="30" y1="60" x2="30" y2="180" stroke="#f0b429" stroke-width="4"/>
<path d="M210,120 L250,120" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="250" y="60" width="200" height="120" rx="8"/>
<text class="t" x="350" y="84" text-anchor="middle">policy log-probs</text>
<text class="s" x="350" y="104" text-anchor="middle">chosen: -2.0</text>
<text class="s" x="350" y="121" text-anchor="middle">rejected: -3.5</text>
<text class="s" x="350" y="138" text-anchor="middle">margin: 0.2</text>
<line x1="250" y1="60" x2="250" y2="180" stroke="#58a6ff" stroke-width="4"/>
<rect class="box" x="470" y="60" width="200" height="120" rx="8"/>
<text class="t" x="570" y="84" text-anchor="middle">reference log-probs</text>
<text class="s" x="570" y="104" text-anchor="middle">chosen: -2.2</text>
<text class="s" x="570" y="121" text-anchor="middle">rejected: -2.8</text>
<text class="s" x="570" y="138" text-anchor="middle">margin: -0.7</text>
<line x1="470" y1="60" x2="470" y2="180" stroke="#8a8a8a" stroke-width="4"/>
<path d="M350,180 L350,220" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M570,180 L570,220" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="250" y="220" width="220" height="110" rx="8"/>
<text class="t" x="360" y="244" text-anchor="middle">the gap</text>
<text class="s" x="360" y="264" text-anchor="middle">policy margin - ref margin</text>
<text class="s" x="360" y="281" text-anchor="middle">0.2 - (-0.7) = 0.9</text>
<text class="s" x="360" y="298" text-anchor="middle"></text>
<line x1="250" y1="220" x2="250" y2="330" stroke="#f0b429" stroke-width="4"/>
<text x="360" y="296" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">x beta 0.1  =  0.09</text>
<path d="M360,330 L360,360" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="230" y="360" width="260" height="110" rx="8"/>
<text class="t" x="360" y="384" text-anchor="middle">sigmoid, then loss</text>
<text class="s" x="360" y="404" text-anchor="middle">sigmoid(0.09) = 0.522</text>
<text class="s" x="360" y="421" text-anchor="middle">loss = -log(0.522) = 0.65</text>
<text class="s" x="360" y="438" text-anchor="middle"></text>
<line x1="230" y1="360" x2="230" y2="470" stroke="#3fb950" stroke-width="4"/>
<text x="360" y="505" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">the model already prefers the chosen answer, so the loss is small</text>
<text x="360" y="525" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a flipped preference would give a large loss and a real update</text>
</svg>