<svg xmlns="http://www.w3.org/2000/svg" width="560" height="310" viewBox="0 0 560 310">
<rect width="560" height="310" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Fencing: the old leader shouts into a void</text><rect x='40' y='80' width='200' height='60' rx='8' fill='none' stroke='#e57ea6' stroke-width='1.5'/><text x='140.0' y='115.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='middle'>old leader: token 41</text><rect x='320' y='80' width='200' height='60' rx='8' fill='none' stroke='#7bc98a' stroke-width='1.5'/><text x='420.0' y='115.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='middle'>new leader: token 42</text><text x='40' y='180' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>store accepts only tokens above the highest seen</text><text x='40' y='206' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='start'>old leader's writes (41) die on arrival</text><text x='40' y='232' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>new leader's writes (42) land</text><text x='20' y='280' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Without fencing, the healed cluster has two divergent histories.</text></svg>