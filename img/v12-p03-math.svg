<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="FlashAttention: the memory math (n = 8192, d = 128, 32 heads, fp16)"><rect x="22" y="14" width="916" height="316" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Both are O(n^2) in theory. The constant is ~d/M smaller because blocks stay in</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">SRAM.</text><text x="38" y="138" font-size="13" font-weight="700" fill="#6cb2ff">Method</text><text x="303.2" y="138" font-size="13" font-weight="700" fill="#6cb2ff">HBM traffic per pass</text><text x="612.5999999999999" y="138" font-size="13" font-weight="700" fill="#6cb2ff">What it means</text><line x1="38" y1="142" x2="922" y2="142" stroke="#2e2e2e"/><text x="38" y="170" font-size="13" font-weight="700" fill="#ececec">Standard attention</text><text x="303.2" y="170" font-size="13" fill="#a8a8a8">S matrix: 8192^2 x 32 x 2 bytes =</text><text x="303.2" y="190" font-size="13" fill="#a8a8a8">4.3 GB</text><text x="612.5999999999999" y="170" font-size="13" fill="#a8a8a8">the full score matrix is written and</text><text x="612.5999999999999" y="190" font-size="13" fill="#a8a8a8">read</text><line x1="38" y1="202" x2="922" y2="202" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="230" font-size="13" font-weight="700" fill="#ececec">FlashAttention</text><text x="303.2" y="230" font-size="13" fill="#a8a8a8">per-row stats (max, sum): 2 fp32 x</text><text x="303.2" y="250" font-size="13" fill="#a8a8a8">8192 x 32 = 2 MB</text><text x="612.5999999999999" y="230" font-size="13" fill="#a8a8a8">~2000x less memory traffic</text><line x1="38" y1="262" x2="922" y2="262" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="290" font-size="13" font-weight="700" fill="#ececec">Backward pass</text><text x="303.2" y="290" font-size="13" fill="#a8a8a8">standard saves S (4.3 GB);</text><text x="303.2" y="310" font-size="13" fill="#a8a8a8">FlashAttention recomputes tiles from</text><text x="303.2" y="330" font-size="13" fill="#a8a8a8">Q, K, V</text><text x="612.5999999999999" y="290" font-size="13" fill="#a8a8a8">extra FLOPs ~ one forward matmul;</text><text x="612.5999999999999" y="310" font-size="13" fill="#a8a8a8">traffic stays linear in n</text><line x1="38" y1="342" x2="922" y2="342" stroke="#2e2e2e" stroke-opacity="0.5"/></svg>