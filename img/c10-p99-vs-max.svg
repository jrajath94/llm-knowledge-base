<text x="60.0" y="365.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Max is dominated by one outlier: a single GC pause becomes the headline number. Report p99 plus the max, and read them together.</text>
<text x="60.0" y="387.0" text-anchor="start" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">Tail at scale: a request touching 100 services at p99 each succeeds end-to-end only 37% of the time (0.99^100).</text>
