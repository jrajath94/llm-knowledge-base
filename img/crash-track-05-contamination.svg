<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Contamination: eval data leaking into training measures memory">
<rect width="560" height="320" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1a1a1a} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#6b7280} .b{font-weight:700}</style>
<text x="280" y="36" text-anchor="middle" class="t">Contamination: the score measures memory</text>
<text x="280" y="58" text-anchor="middle" class="xs">Eval tasks leak into training data.</text>
<rect x="60" y="100" width="180" height="70" rx="8" fill="#2563eb" opacity="0.85"/>
<text x="150" y="128" text-anchor="middle" class="s b" fill="#fff">Eval set</text>
<text x="150" y="150" text-anchor="middle" class="xs" fill="#fff">private questions</text>
<rect x="320" y="100" width="180" height="70" rx="8" fill="#d97706" opacity="0.85"/>
<text x="410" y="128" text-anchor="middle" class="s b" fill="#fff">Training data</text>
<text x="410" y="150" text-anchor="middle" class="xs" fill="#fff">web crawl</text>
<path d="M240,135 L320,135" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#dc2626"/></marker></defs>
<text x="280" y="120" text-anchor="middle" class="s b" fill="#dc2626">leak</text>
<rect x="170" y="210" width="220" height="52" rx="8" fill="#dc2626" opacity="0.15" stroke="#dc2626"/>
<text x="280" y="232" text-anchor="middle" class="s b">Score jumps. Capability did not.</text>
<text x="280" y="252" text-anchor="middle" class="xs">The fix: keep eval sets private, rotate items.</text>
</svg>
