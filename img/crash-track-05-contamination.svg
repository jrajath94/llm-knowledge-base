<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Contamination: eval data leaking into training measures memory">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="280" y="36" text-anchor="middle" class="t">Contamination: the score measures memory</text>
<text x="280" y="58" text-anchor="middle" class="xs">Eval tasks leak into training data.</text>
<rect x="60" y="100" width="180" height="70" rx="8" fill="#6cb2ff" opacity="0.85" />
<text x="150" y="128" text-anchor="middle" class="s b" fill="#fff" style="fill:#1a1a1a">Eval set</text>
<text x="150" y="150" text-anchor="middle" class="xs" fill="#fff" style="fill:#1a1a1a">private questions</text>
<rect x="320" y="100" width="180" height="70" rx="8" fill="#f0b429" opacity="0.85" />
<text x="410" y="128" text-anchor="middle" class="s b" fill="#fff" style="fill:#1a1a1a">Training data</text>
<text x="410" y="150" text-anchor="middle" class="xs" fill="#fff" style="fill:#1a1a1a">web crawl</text>
<path d="M240,135 L320,135" stroke="#e57373" stroke-width="3" marker-end="url(#ah)" />
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#e57373" /></marker></defs>
<text x="280" y="120" text-anchor="middle" class="s b" fill="#e57373">leak</text>
<rect x="170" y="210" width="220" height="52" rx="8" fill="#e57373" opacity="0.15" stroke="#e57373" />
<text x="280" y="232" text-anchor="middle" class="s b">Score jumps. Capability did not.</text>
<text x="280" y="252" text-anchor="middle" class="xs">The fix: keep eval sets private, rotate items.</text>
</svg>