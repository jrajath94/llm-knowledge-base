<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Two LLM judge bias traps">
<rect x="14" y="12" width="932" height="336" rx="10" fill="#141414" stroke="#2e2e2e"/>
<text x="32" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">JUDGE BIAS TRAPS</text>
<text x="32" y="72" font-size="16" font-weight="700" fill="#ececec">Two traps that deserve special attention</text>
<rect x="32" y="92" width="448" height="238" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="52" y="124" font-size="13.5" font-weight="700" fill="#e8b34b">Self-preference</text>
<text x="52" y="152" font-size="12.5" fill="#a8a8a8">A judge built on model X tends to</text>
<text x="52" y="174" font-size="12.5" fill="#a8a8a8">favor outputs written in X&#8217;s style.</text>
<rect x="52" y="196" width="200" height="40" rx="6" fill="#2a2a2a" stroke="#2e2e2e"/>
<text x="62" y="222" font-size="12.5" fill="#ececec">Judge: model X</text>
<line x1="260" y1="216" x2="300" y2="216" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 291 211 L 300 216 L 291 221" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="308" y="196" width="150" height="40" rx="6" fill="#2a2a2a" stroke="#2e2e2e"/>
<text x="318" y="222" font-size="12.5" fill="#ececec">X-style answer</text>
<text x="52" y="268" font-size="12.5" font-weight="700" fill="#ececec">Fix: never let a model judge</text>
<text x="52" y="290" font-size="12.5" font-weight="700" fill="#ececec">its own outputs unchecked.</text>
<rect x="496" y="92" width="448" height="238" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="516" y="124" font-size="13.5" font-weight="700" fill="#e8b34b">Verbosity</text>
<text x="516" y="152" font-size="12.5" fill="#a8a8a8">Judges, like rushed humans, use</text>
<text x="516" y="174" font-size="12.5" fill="#a8a8a8">length as a proxy for quality.</text>
<rect x="516" y="196" width="170" height="16" rx="4" fill="#3a3a3a"/>
<rect x="516" y="220" width="300" height="16" rx="4" fill="#3a3a3a"/>
<text x="826" y="233" font-size="12.5" fill="#3fae5a">pass</text>
<rect x="516" y="244" width="170" height="16" rx="4" fill="#3a3a3a"/>
<text x="696" y="257" font-size="12.5" fill="#c05555">fail (short but right)</text>
<text x="516" y="292" font-size="12.5" font-weight="700" fill="#ececec">Fix: add &#8220;do not reward padding&#8221;</text>
<text x="516" y="314" font-size="12.5" font-weight="700" fill="#ececec">to the rubric.</text>
</svg>
