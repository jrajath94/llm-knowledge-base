<svg xmlns="http://www.w3.org/2000/svg" width="720" height="445" viewBox="0 0 720 445" role="img" aria-label="MFU worked example for 70B on 8 H100s">
<rect width="720" height="445" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">MFU, worked: the 50% line a healthy run must beat</text>
<rect class="box" x="60" y="60" width="600" height="150" rx="8"/>
<text x="360" y="92" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700" font-family="Charis SIL, Georgia, serif">MFU  =  6 x N x tokens/s  /  (n GPUs x peak FLOPS/GPU)</text>
<text x="360" y="122" text-anchor="middle" fill="#a8a8a8" font-size="14" font-weight="400" font-family="Charis SIL, Georgia, serif">6 x 70x10^9 x 9,423  /  8 x 989.4x10^12</text>
<text x="360" y="152" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="700" font-family="Charis SIL, Georgia, serif">=  3.96x10^15  /  7.92x10^15  =  0.50</text>
<text x="360" y="178" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">50% MFU: the throughput a healthy 70B run on 8 H100s should beat</text>
<rect class="box" x="120" y="235" width="480" height="44" rx="8"/>
<line x1="120" y1="235" x2="120" y2="279" stroke="#f0b429" stroke-width="4"/>
<text x="146" y="262" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">the 6ND rule: 2 forward + 4 backward FLOPs per param per token</text>
<rect class="box" x="120" y="287" width="480" height="44" rx="8"/>
<line x1="120" y1="287" x2="120" y2="331" stroke="#58a6ff" stroke-width="4"/>
<text x="146" y="314" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">peak is the vendor's dense BF16 number (989 TFLOPS per H100 SXM)</text>
<rect class="box" x="120" y="339" width="480" height="44" rx="8"/>
<line x1="120" y1="339" x2="120" y2="383" stroke="#e5484d" stroke-width="4"/>
<text x="146" y="366" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">if your measured number gives 21%, something is badly wrong</text>
<text x="360" y="420" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">quote MFU with the peak you used, or the number is meaningless</text>
</svg>