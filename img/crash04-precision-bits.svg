<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Precision: BF16 by default, FP8 only with a validated recipe</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">same exponent range as FP32 is why BF16 is the safer drop-in</text>
<text x="24" y="118" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">FP32</text>
<rect x="130" y="100" width="17.5" height="30" fill="#f0b429" rx="3" opacity="0.55"/>
<text x="138.75" y="120" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">1</text>
<rect x="147.5" y="100" width="140.0" height="30" fill="#6cb2ff" rx="3" opacity="0.55"/>
<text x="217.5" y="120" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">8</text>
<rect x="287.5" y="100" width="402.5" height="30" fill="#4fd1a5" rx="3" opacity="0.55"/>
<text x="488.75" y="120" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">23</text>
<text x="130" y="148" font-size="11" fill="#a8a8a8" text-anchor="start">the full-precision default; overflow behavior every recipe was designed for</text>
<text x="24" y="196" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">BF16</text>
<rect x="130" y="178" width="35.0" height="30" fill="#f0b429" rx="3" opacity="0.55"/>
<text x="147.5" y="198" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">1</text>
<rect x="165.0" y="178" width="280.0" height="30" fill="#6cb2ff" rx="3" opacity="0.55"/>
<text x="305.0" y="198" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">8</text>
<rect x="445.0" y="178" width="245.0" height="30" fill="#4fd1a5" rx="3" opacity="0.55"/>
<text x="567.5" y="198" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">7</text>
<text x="130" y="226" font-size="11" fill="#a8a8a8" text-anchor="start">same 8-bit exponent range as FP32; default choice; no loss scaler for most layers</text>
<text x="24" y="274" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">FP16</text>
<rect x="130" y="256" width="35.0" height="30" fill="#f0b429" rx="3" opacity="0.55"/>
<text x="147.5" y="276" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">1</text>
<rect x="165.0" y="256" width="175.0" height="30" fill="#6cb2ff" rx="3" opacity="0.55"/>
<text x="252.5" y="276" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">5</text>
<rect x="340.0" y="256" width="350.0" height="30" fill="#4fd1a5" rx="3" opacity="0.55"/>
<text x="515.0" y="276" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">10</text>
<text x="130" y="304" font-size="11" fill="#a8a8a8" text-anchor="start">narrower range overflows sooner; use only when BF16 is unavailable</text>
<text x="24" y="352" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">FP8 E4M3</text>
<rect x="130" y="334" width="70.0" height="30" fill="#f0b429" rx="3" opacity="0.55"/>
<text x="165.0" y="354" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">1</text>
<rect x="200.0" y="334" width="280.0" height="30" fill="#6cb2ff" rx="3" opacity="0.55"/>
<text x="340.0" y="354" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">4</text>
<rect x="480.0" y="334" width="210.0" height="30" fill="#4fd1a5" rx="3" opacity="0.55"/>
<text x="585.0" y="354" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">3</text>
<text x="130" y="382" font-size="11" fill="#a8a8a8" text-anchor="start">halves BF16 bytes; needs per-tensor scaling; norms and softmax stay in higher precision</text>
<text x="24" y="432" font-size="12" fill="#f0b429" text-anchor="start">MFU honesty rule: the peak must match the precision actually used. Quoting BF16 math against the FP8</text>
<text x="24" y="449" font-size="12" fill="#f0b429" text-anchor="start">peak halves the MFU silently. Always state the peak: &quot;55% against the 989 TFLOPS BF16 dense peak.&quot;</text>
</svg>