<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Charis SIL',Georgia,serif">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" />
</marker>
</defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">RAG Pipeline: Offline and Online</text>
<text x="200" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#6cb2ff">OFFLINE (build once)</text>
<text x="600" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#7fc97f">ONLINE (every query)</text>
<rect x="50" y="80" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="110.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Documents</text>
<text x="110.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Raw text</text>
<rect x="200" y="80" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="260.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Chunk</text>
<text x="260.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">512 tokens</text>
<rect x="350" y="80" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="410.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Embed</text>
<text x="410.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Vector</text>
<rect x="500" y="80" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="560.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Index</text>
<text x="560.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">HNSW</text>
<rect x="500" y="200" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="560.0" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Retrieve</text>
<text x="560.0" y="248" text-anchor="middle" font-size="11" fill="#a8a8a8">Top-k</text>
<rect x="650" y="200" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="710.0" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Generate</text>
<text x="710.0" y="248" text-anchor="middle" font-size="11" fill="#a8a8a8">LLM</text>
<rect x="350" y="200" width="120" height="60" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="410.0" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Query</text>
<text x="410.0" y="248" text-anchor="middle" font-size="11" fill="#a8a8a8">Embed</text>
<line x1="170" y1="110" x2="200" y2="110" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="320" y1="110" x2="350" y2="110" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="470" y1="110" x2="500" y2="110" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="560" y1="140" x2="560" y2="200" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="470" y1="230" x2="500" y2="230" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="620" y1="230" x2="650" y2="230" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="400" y="320" text-anchor="middle" font-size="12" fill="#a8a8a8">Offline builds the index once. Online retrieves and generates per query.</text>
<text x="400" y="345" text-anchor="middle" font-size="12" fill="#a8a8a8">Raw documents stay untouched. RAG quality is retrieval quality.</text>
</svg>