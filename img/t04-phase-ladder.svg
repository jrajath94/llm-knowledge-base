<svg xmlns="http://www.w3.org/2000/svg" width="720" height="397" viewBox="0 0 720 397" role="img" aria-label="Part B four-phase reading path">
<rect width="720" height="397" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Part B: the reading path in four phases</text>
<rect class="box" x="150" y="60" width="420" height="62" rx="8"/>
<line x1="150" y1="60" x2="150" y2="122" stroke="#f0b429" stroke-width="4"/>
<text x="176" y="84" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Phase 0: the machine</text>
<text x="176" y="105" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">Vol 6 ch 1-5: GPUs, memory, the cost model</text>
<path d="M360,122 L360,132" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="150" y="132" width="420" height="62" rx="8"/>
<line x1="150" y1="132" x2="150" y2="194" stroke="#58a6ff" stroke-width="4"/>
<text x="176" y="156" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Phase 1: parallelism math</text>
<text x="176" y="177" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">Vol 6 ch 6-8: DP, TP, PP, FSDP</text>
<path d="M360,194 L360,204" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="150" y="204" width="420" height="62" rx="8"/>
<line x1="150" y1="204" x2="150" y2="266" stroke="#3fb950" stroke-width="4"/>
<text x="176" y="228" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Phase 2: communication</text>
<text x="176" y="249" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">Vol 6 ch 9 + App 6A: NCCL, collectives</text>
<path d="M360,266 L360,276" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="150" y="276" width="420" height="62" rx="8"/>
<line x1="150" y1="276" x2="150" y2="338" stroke="#8a8a8a" stroke-width="4"/>
<text x="176" y="300" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Phase 3: operations</text>
<text x="176" y="321" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">Vol 3 ch 3, Vol 15 ch 2: Adam state, storage</text>
<text x="360" y="372" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">each phase is a prerequisite for the next: no skipping ahead</text>
</svg>