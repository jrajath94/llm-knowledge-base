<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 319" role="img" aria-label="Little's Law: L = lambda x W, read as a flow">
<rect width="900" height="319" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Little's Law: L = lambda x W, read as a flow</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">What sits in the system equals what arrives per second times how long each request stays.</text>
<rect x="60.0" y="79.0" width="220.0" height="90.0" rx="6" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="170.0" y="109.0" text-anchor="middle" fill="#2dd4bf" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">ARRIVES</text>
<text x="170.0" y="137.0" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">lambda = 500 requests/s</text>
<rect x="340.0" y="79.0" width="220.0" height="90.0" rx="6" fill="#141414" stroke="#4aa8ff" stroke-width="2"/>
<text x="450.0" y="109.0" text-anchor="middle" fill="#4aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">STAYS</text>
<text x="450.0" y="137.0" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">W = 0.4 s each</text>
<rect x="620.0" y="79.0" width="220.0" height="90.0" rx="6" fill="#141414" stroke="#f0b429" stroke-width="2"/>
<text x="730.0" y="109.0" text-anchor="middle" fill="#f0b429" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">SITS INSIDE</text>
<text x="730.0" y="137.0" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">L = 200 in flight</text>
<line x1="280.0" y1="124.0" x2="336.0" y2="124.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="336.0" y1="124.0" x2="327.8" y2="127.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="336.0" y1="124.0" x2="327.8" y2="120.3" stroke="#ececec" stroke-width="1.8"/>
<line x1="560.0" y1="124.0" x2="616.0" y2="124.0" stroke="#ececec" stroke-width="1.8"/>
<line x1="616.0" y1="124.0" x2="607.8" y2="127.7" stroke="#ececec" stroke-width="1.8"/>
<line x1="616.0" y1="124.0" x2="607.8" y2="120.3" stroke="#ececec" stroke-width="1.8"/>
<rect x="40.0" y="189.0" width="820.0" height="92.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="215.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">L = 500 x 0.4 = 200. Capacity planning reads right to left: 200 slots needed to hold 0.4 s of work at 500/s.</text>
<text x="60.0" y="239.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">If queues grow past L, either arrival rate rose or service time did. Measure which before scaling anything.</text>
<text x="60.0" y="259.0" text-anchor="start" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">Assumes a stable system: arrival rate roughly equals completion rate over the window.</text>
</svg>
