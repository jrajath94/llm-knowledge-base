<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 500' width='100%' role='img'><text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='600' >The decode step: prefill once, then one token per forward pass</text><text x='20' y='58' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#a8a8a8' text-anchor='600' >PREFILL (runs once)</text><rect x='20' y='70' width='190' height='96' rx='10' fill='#64b5f6' fill-opacity='0.16' stroke='#64b5f6' stroke-width='2'/><text x='115' y='96' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle' >prompt tokens</text><rect x='36' y='106' width='38' height='30' rx='6' fill='#64b5f6' fill-opacity='0.25' stroke='#64b5f6'/><text x='55' y='127' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#ececec' text-anchor='middle' >the</text><rect x='80' y='106' width='38' height='30' rx='6' fill='#64b5f6' fill-opacity='0.25' stroke='#64b5f6'/><text x='99' y='127' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#ececec' text-anchor='middle' >cat</text><rect x='124' y='106' width='38' height='30' rx='6' fill='#64b5f6' fill-opacity='0.25' stroke='#64b5f6'/><text x='143' y='127' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#ececec' text-anchor='middle' >sat</text><rect x='168' y='106' width='38' height='30' rx='6' fill='#64b5f6' fill-opacity='0.25' stroke='#64b5f6'/><text x='187' y='127' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#ececec' text-anchor='middle' >on</text><line x1='225' y1='118' x2='285' y2='118' stroke='#a8a8a8' stroke-width='2'/><path d='M276,113 L285,118 L276,123' fill='none' stroke='#a8a8a8' stroke-width='2'/><text x='255' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='middle' >one parallel forward pass</text><rect x='300' y='70' width='300' height='96' rx='10' fill='#4db6ac' fill-opacity='0.16' stroke='#4db6ac' stroke-width='2'/><text x='450' y='96' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle' >KV CACHE</text><text x='450' y='118' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='middle' >keys + values for every prompt token,</text><text x='450' y='136' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='middle' >every layer</text><text x='640' y='118' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#4db6ac' text-anchor='middle' >filled once</text><text x='20' y='210' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#a8a8a8' text-anchor='600' >DECODE (loops until the stop token)</text><rect x='20' y='224' width='120' height='46' rx='8' fill='#ffb74d' fill-opacity='0.25' stroke='#ffb74d' stroke-width='2'/><text x='80' y='253' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle' >token: mat</text><line x1='152' y1='247' x2='196' y2='247' stroke='#a8a8a8' stroke-width='2'/><path d='M187,242 L196,247 L187,252' fill='none' stroke='#a8a8a8' stroke-width='2'/><rect x='208' y='224' width='300' height='96' rx='10' fill='#ffb74d' fill-opacity='0.16' stroke='#ffb74d' stroke-width='2'/><text x='358' y='252' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle' >ONE DECODE STEP</text><text x='358' y='274' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='middle' >one forward pass: read cache,</text><text x='358' y='292' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='middle' >stream weights once, emit 1 token</text><line x1='520' y1='272' x2='564' y2='272' stroke='#a8a8a8' stroke-width='2'/><path d='M555,267 L564,272 L555,277' fill='none' stroke='#a8a8a8' stroke-width='2'/><rect x='576' y='249' width='110' height='46' rx='8' fill='#ffb74d' fill-opacity='0.25' stroke='#ffb74d' stroke-width='2'/><text x='631' y='278' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle' >token: .</text><path d='M631,295 C631,380 480,380 450,300' fill='none' stroke='#4db6ac' stroke-width='2' stroke-dasharray='7,5'/><path d='M442,312 L450,296 L460,310' fill='none' stroke='#4db6ac' stroke-width='2'/><text x='700' y='262' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#4db6ac' text-anchor='start' >append its K/V to the cache;</text><text x='700' y='280' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#4db6ac' text-anchor='start' >repeat</text><text x='20' y='368' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start' >Each step costs one weight-streaming pass no matter how long the answer gets.</text><text x='20' y='392' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start' >Without the cache every step would re-read and re-attend the whole past: cost per step grows with length.</text><text x='20' y='416' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start' >With the cache the past is read, not recomputed: cost per step stays flat.</text></svg>