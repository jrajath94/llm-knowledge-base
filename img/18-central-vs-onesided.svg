<svg xmlns='http://www.w3.org/2000/svg' width='700' height='400' viewBox='0 0 700 400' font-family='DejaVu Sans'>
<rect width='700' height='400' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Central difference beats one-sided: error e^2 vs e</text>
<rect x='60' y='70' width='280' height='230' rx='8' fill='none' stroke='#ff7b8a' stroke-width='1.5'/>
<text x='200' y='100' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>ONE-SIDED</text>
<text x='200' y='140' font-size='14' fill='#e8e8e8' text-anchor='middle'>(f(w+e) - f(w)) / e</text>
<text x='200' y='185' font-size='13' fill='#9a9a9a' text-anchor='middle'>error ~ e</text>
<text x='200' y='215' font-size='12' fill='#9a9a9a' text-anchor='middle'>e = 1e-5 -> error 1e-5</text>
<text x='200' y='250' font-size='12' fill='#9a9a9a' text-anchor='middle'>misleading at small e</text>
<rect x='360' y='70' width='280' height='230' rx='8' fill='none' stroke='#7fd08a' stroke-width='1.5'/>
<text x='500' y='100' font-size='13' fill='#7fd08a' text-anchor='middle' font-weight='bold'>CENTRAL</text>
<text x='500' y='140' font-size='14' fill='#e8e8e8' text-anchor='middle'>(f(w+e) - f(w-e)) / 2e</text>
<text x='500' y='185' font-size='13' fill='#9a9a9a' text-anchor='middle'>error ~ e^2</text>
<text x='500' y='215' font-size='12' fill='#9a9a9a' text-anchor='middle'>e = 1e-5 -> error 1e-10</text>
<text x='500' y='250' font-size='12' fill='#9a9a9a' text-anchor='middle'>the lab standard</text>
<text x='350' y='345' font-size='12' fill='#9a9a9a' text-anchor='middle'>Gradient checking compares the analytic slope against the central difference.</text>
<text x='350' y='368' font-size='12' fill='#f0b429' text-anchor='middle'>Agreement to ~1e-5: trust it. Worse than 1e-3: there is a bug.</text>
</svg>