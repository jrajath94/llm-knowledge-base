<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="480" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.6. Cost per successful outcome: the worked example</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Divide by the success rate, not by the attempt count.</text>
<text x="24" y="110" font-size="14" font-weight="bold" fill="#ececec">per attempt</text>
<rect x="24" y="130" width="200" height="90" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
<text x="124" y="172" font-size="20" font-weight="bold" fill="#ececec" text-anchor="middle">$3.95</text>
<text x="330" y="165" font-size="12" fill="#8a8a8a">model + infra + build + maint</text>
<text x="330" y="185" font-size="12" fill="#8a8a8a">+ review + rework shares</text>
<line x1="250" y1="175" x2="330" y2="175" stroke="#f0b429" stroke-width="3"/>
<polygon points="330,169 330,181 340,175" fill="#f0b429"/>
<text x="290" y="160" font-size="13" font-weight="bold" fill="#f0b429">/ 0.92</text>
<text x="24" y="280" font-size="14" font-weight="bold" fill="#ececec">per successful outcome</text>
<rect x="24" y="300" width="200" height="90" fill="#142a1a" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="124" y="352" font-size="22" font-weight="bold" fill="#ececec" text-anchor="middle">$4.29</text>
<text x="330" y="340" font-size="13" fill="#ececec">$3.95 per attempt / 0.92 success rate</text>
<text x="330" y="365" font-size="13" fill="#ececec">= <tspan font-weight="bold">$4.29 per successful task</tspan></text>
<text x="24" y="435" font-size="13" fill="#8a8a8a">Success rates come from your acceptance eval. Vendor benchmarks make downstream numbers fiction.</text>
</svg>
