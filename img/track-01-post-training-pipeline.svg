<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 560" role="img" aria-label="The post-training pipeline: from base model to aligned model">
<rect width="900" height="560" fill="#0d0d0d"/>
<text x="450" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The post-training pipeline</text>
<text x="450" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Most lab modeling work in 2026 is post-training. Three stages turn a base model into an assistant.</text>
<rect x="15" y="100" width="120" height="90" rx="6" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="2"/>
<text x="75.0" y="126" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Base model</text>
<text x="75.0" y="146" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">predicts next token</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/></marker></defs>
<line x1="135" y1="145" x2="195" y2="145" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="165.0" y="135" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">human demos</text>
<rect x="195" y="100" width="120" height="90" rx="6" fill="#1a1a1a" stroke="#4aa8ff" stroke-width="2"/>
<text x="255.0" y="126" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">SFT</text>
<text x="255.0" y="146" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">supervised fine-tuning</text>
<text x="255" y="172" text-anchor="middle" fill="#8a8a8a" font-size="10" font-family="Charis SIL, Georgia, serif">trains on demos</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/></marker></defs>
<line x1="315" y1="145" x2="375" y2="145" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="345.0" y="135" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">pairs</text>
<rect x="375" y="100" width="120" height="90" rx="6" fill="#1a1a1a" stroke="#f0b429" stroke-width="2"/>
<text x="435.0" y="126" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Reward model</text>
<text x="435.0" y="146" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">scores answers</text>
<text x="435" y="172" text-anchor="middle" fill="#8a8a8a" font-size="10" font-family="Charis SIL, Georgia, serif">trains on preferences</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/></marker></defs>
<line x1="495" y1="145" x2="555" y2="145" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="525.0" y="135" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">RL signal</text>
<rect x="555" y="100" width="120" height="90" rx="6" fill="#1a1a1a" stroke="#2dd4bf" stroke-width="2"/>
<text x="615.0" y="126" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">RL step</text>
<text x="615.0" y="146" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">PPO / DPO / GRPO</text>
<text x="615" y="172" text-anchor="middle" fill="#8a8a8a" font-size="10" font-family="Charis SIL, Georgia, serif">optimizes the reward</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#2dd4bf" stroke-width="1.6"/></marker></defs>
<line x1="675" y1="145" x2="735" y2="145" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="735" y="100" width="120" height="90" rx="6" fill="#1a1a1a" stroke="#2dd4bf" stroke-width="2"/>
<text x="795.0" y="126" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">Aligned</text>
<text x="795.0" y="146" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">follows instructions</text>
<text x="60" y="260" fill="#4aa8ff" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">SFT (supervised fine-tuning):</text>
<text x="60" y="280" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">training on human-written demonstrations of good answers.</text>
<text x="60" y="312" fill="#f0b429" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">RLHF (reinforcement learning from human feedback):</text>
<text x="60" y="332" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">using a reward model trained on human preference pairs.</text>
<text x="60" y="364" fill="#2dd4bf" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">DPO (direct preference optimization):</text>
<text x="60" y="384" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">skips the reward model: trains directly on preference pairs.</text>
<text x="60" y="416" fill="#2dd4bf" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">GRPO (group relative policy optimization):</text>
<text x="60" y="436" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">compares groups of answers; used with verifiers, programs that check answers.</text>
<text x="450" y="500" text-anchor="middle" fill="#e5484d" font-size="12" font-family="Charis SIL, Georgia, serif">Watch for reward hacking: the model games the reward instead of doing the task. Length bias is the classic case.</text>
<text x="450" y="525" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Vol 7 covers the full pipeline. Appendix 7A covers the rollout infrastructure that makes RL training work at scale.</text>
</svg>