<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 450' width='100%' role='img'>
<title>Phase map A-E</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The five phases, one map</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>How the machine thinks, is measured, is served, is reasoned about, and is explained.</text>
<rect x='24' y='130' width='168' height='150' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='108' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>A. Thinks</text>
<text x='108' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>internals</text>
<line x1='192' y1='205' x2='212' y2='205' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='203.8,208.7 212,205 203.8,201.3' fill='#8a8a8a'/>
<rect x='212' y='130' width='168' height='150' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='296' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>B. Measured</text>
<text x='296' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>evals</text>
<line x1='380' y1='205' x2='400' y2='205' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='391.8,208.7 400,205 391.8,201.3' fill='#8a8a8a'/>
<rect x='400' y='130' width='168' height='150' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='484' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>C. Served</text>
<text x='484' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cost + latency</text>
<line x1='568' y1='205' x2='588' y2='205' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='579.8,208.7 588,205 579.8,201.3' fill='#8a8a8a'/>
<rect x='588' y='130' width='168' height='150' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='672' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>D. Reasoned about</text>
<text x='672' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>agents</text>
<line x1='756' y1='205' x2='776' y2='205' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='767.8,208.7 776,205 767.8,201.3' fill='#8a8a8a'/>
<rect x='776' y='130' width='168' height='150' rx='10' fill='#00897b' fill-opacity='0.22' stroke='#00897b' stroke-width='2'/>
<text x='860' y='156' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>E. Explained</text>
<text x='860' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>stakeholders</text>
<text x='480' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The order is the build order: understand the machine, measure it, serve it cheaply, then reason and explain.</text>
<text x='480' y='360' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: never serve what you cannot measure, and never explain what you cannot measure either.</text>
</svg>