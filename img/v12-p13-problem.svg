<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 13: the problem RAG and ReAct solved"><rect x="22" y="14" width="435.0" height="212" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">Two failures of the pure parametric</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">model</text><circle cx="44" cy="103.5" r="3.2" fill="#e07878"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">knowledge: facts frozen at training time, no</text><text x="56" y="126" font-size="13.5" fill="#a8a8a8">citations, confident hallucinations; updates</text><text x="56" y="144" font-size="13.5" fill="#a8a8a8">mean retraining</text><circle cx="44" cy="165.5" r="3.2" fill="#e07878"/><text x="56" y="170" font-size="13.5" fill="#a8a8a8">agency: reasoners could not act, actors could</text><text x="56" y="188" font-size="13.5" fill="#a8a8a8">not reason</text><rect x="503.0" y="14" width="435.0" height="212" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">Can retrieval ground knowledge, and</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">can one loop interleave reasoning with</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">acting?</text><line x1="467.0" y1="120.0" x2="487.0" y2="120.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,115.0 495.0,120.0 487.0,125.0" fill="#a8a8a8"/></svg>