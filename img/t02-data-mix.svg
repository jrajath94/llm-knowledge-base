<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="100%" style="max-width:760px" role="img" aria-label="Safety fraction, refusal pairing, never safety-only, preference sampling recipe, refresh cadence, rejection sampling k">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="408" fill="none"/>
<text class="t" x="24" y="30">Data-mix ratios: the numbers that hold</text>
<rect x="24" y="56" width="8" height="48" rx="4" fill="#f0b429"/>
<text class="big" x="44" y="77">Safety fraction</text>
<text class="num" x="320" y="77">5-15% of the SFT mix</text>
<text class="m" x="44" y="96">above that you buy safety with capability</text>
<rect x="24" y="112" width="8" height="48" rx="4" fill="#6cb2ff"/>
<text class="big" x="44" y="133">Refusal pairs</text>
<text class="num" x="320" y="133">every refusal + a nearby compliance</text>
<text class="m" x="44" y="152">benign prompt, adjacent topic, full answer: the model learns the boundary</text>
<rect x="24" y="168" width="8" height="48" rx="4" fill="#e57373"/>
<text class="big" x="44" y="189">Never safety-only</text>
<text class="num" x="320" y="189">capability examples in every safety batch</text>
<text class="m" x="44" y="208">or the model forgets what it was kept safe for</text>
<rect x="24" y="224" width="8" height="48" rx="4" fill="#6cb2ff"/>
<text class="big" x="44" y="245">Preference sampling</text>
<text class="num" x="320" y="245">2-4 responses per prompt</text>
<text class="m" x="44" y="264">recipe: 2 from current policy, 1 from a stronger model, 1 from an older checkpoint</text>
<rect x="24" y="280" width="8" height="48" rx="4" fill="#a8a8a8"/>
<text class="big" x="44" y="301">Refresh</text>
<text class="num" x="320" y="301">new preference data every few RL rounds</text>
<text class="m" x="44" y="320">reward models go stale as the policy moves</text>
<rect x="24" y="336" width="8" height="48" rx="4" fill="#a8a8a8"/>
<text class="big" x="44" y="357">Rejection sampling</text>
<text class="num" x="320" y="357">k = 8-64 completions per prompt</text>
<text class="m" x="44" y="376">moderate to high temperature</text>
</svg>
