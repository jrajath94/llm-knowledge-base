<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="The human ceiling: judge kappa must be compared against human versus human agreement, not against 1.0">
<rect width="800" height="520" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">The human ceiling: grade against the right bar</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Two human raters land around kappa 0.8, not 1.0. That is the ceiling the judge must reach.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<line x1="90" y1="120" x2="90" y2="380" stroke="#555" stroke-width="1.5"/>
<line x1="90" y1="380" x2="720" y2="380" stroke="#555" stroke-width="1.5"/>
<text x="60" y="385" text-anchor="end" font-size="12" fill="#a8a8a8">0</text>
<text x="60" y="315" text-anchor="end" font-size="12" fill="#a8a8a8">0.25</text>
<text x="60" y="245" text-anchor="end" font-size="12" fill="#a8a8a8">0.50</text>
<text x="60" y="175" text-anchor="end" font-size="12" fill="#a8a8a8">0.75</text>
<text x="60" y="128" text-anchor="end" font-size="12" fill="#a8a8a8">1.00</text>

<!-- scale: y = 380 - v*260 -->
<!-- human-human 0.8 -> height 208 -->
<rect x="180" y="172" width="110" height="208" fill="#6cb2ff" rx="4" opacity="0.85"/>
<text x="235" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#6cb2ff">0.80</text>
<text x="235" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#ececec">Human vs human</text>
<text x="235" y="422" text-anchor="middle" font-size="11.5" fill="#a8a8a8">the ceiling</text>

<!-- judge 0.65 -> height 169 -->
<rect x="360" y="211" width="110" height="169" fill="#f0b429" rx="4" opacity="0.85"/>
<text x="415" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#f0b429">0.65</text>
<text x="415" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#ececec">Judge vs human</text>
<text x="415" y="422" text-anchor="middle" font-size="11.5" fill="#a8a8a8">below the ceiling</text>

<!-- perfect 1.0 dashed -->
<line x1="540" y1="120" x2="700" y2="120" stroke="#e08080" stroke-width="2" stroke-dasharray="6,4"/>
<text x="620" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#e08080">1.00: the wrong bar</text>
<text x="620" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#ececec">Perfect</text>
<text x="620" y="422" text-anchor="middle" font-size="11.5" fill="#a8a8a8">no human reaches it</text>
</g>

<rect x="60" y="445" width="680" height="55" rx="10" fill="#141414" stroke="#2e9e5b" stroke-width="1"/>
<text x="400" y="478" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Report both numbers side by side. A judge at the human ceiling is as reliable as a human on this task.</text>
</svg>
