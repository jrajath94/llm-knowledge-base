<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Appendix 11A: the statistics you need when outputs are random"><rect x="22" y="14" width="435.0" height="194" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">CHAPTER 1</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">A/B design when the outputs are</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">random</text><circle cx="44" cy="103.5" r="3.2" fill="#6cb2ff"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">how to compare two models when every</text><text x="56" y="126" font-size="13.5" fill="#a8a8a8">answer is a dice roll</text><circle cx="44" cy="147.5" r="3.2" fill="#6cb2ff"/><text x="56" y="152" font-size="13.5" fill="#a8a8a8">the paired bootstrap: honest small-sample</text><text x="56" y="170" font-size="13.5" fill="#a8a8a8">comparisons</text><rect x="503.0" y="14" width="435.0" height="194" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 2</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">Calibrating an autorater against</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">humans</text><circle cx="525.0" cy="103.5" r="3.2" fill="#f0b429"/><text x="537.0" y="108" font-size="13.5" fill="#a8a8a8">an LLM judge is a measurement instrument:</text><text x="537.0" y="126" font-size="13.5" fill="#a8a8a8">calibrate it first</text><circle cx="525.0" cy="147.5" r="3.2" fill="#f0b429"/><text x="537.0" y="152" font-size="13.5" fill="#a8a8a8">Cohen&#x27;s kappa: agreement beyond luck</text><line x1="467.0" y1="111.0" x2="487.0" y2="111.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,106.0 495.0,111.0 487.0,116.0" fill="#a8a8a8"/></svg>