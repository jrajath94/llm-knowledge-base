<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Diagram of a consistent hashing ring with four servers and a key walking clockwise to its owner.">
<rect width="800" height="600" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Consistent hashing: the ring</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Nodes and keys share one ring. Each key walks clockwise to the first node.</text>
<circle cx="330" cy="300" r="170" fill="none" stroke="#a8a8a8" stroke-width="2"/>
<circle cx="388" cy="140" r="14" fill="#5aa9e6"/>
<text x="388" y="145" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#0d0d0d">S1</text>
<circle cx="490" cy="358" r="14" fill="#e6a75a"/>
<text x="490" y="363" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#0d0d0d">S2</text>
<circle cx="272" cy="460" r="14" fill="#7fd08a"/>
<text x="272" y="465" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#0d0d0d">S3</text>
<circle cx="170" cy="242" r="14" fill="#e67e7e"/>
<text x="170" y="247" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="bold" fill="#0d0d0d">S4</text>
<circle cx="484" cy="228" r="10" fill="#ececec"/>
<text x="484" y="210" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="bold" fill="#ececec">key</text>
<path d="M 484 228 A 170 170 0 0 1 490 358" fill="none" stroke="#ececec" stroke-width="2" stroke-dasharray="6,4"/>
<text x="560" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">The key walks clockwise</text>
<text x="560" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">to the first node it meets.</text>
<text x="560" y="258" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">That node owns the key.</text>
<text x="560" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Add or remove a node:</text>
<text x="560" y="324" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">only K/N keys move,</text>
<text x="560" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">not all of them.</text>
<text x="400" y="540" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Virtual nodes: give each server 100 to 200 ring positions, and each share converges to 1/N.</text>
</svg>