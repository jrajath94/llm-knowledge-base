<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="600" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The failure taxonomy: every break lands in one bucket</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">a taxonomy turns a pile of red-team transcripts into coverage numbers</text>
<rect x="24" y="110" width="560" height="72" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">REFUSAL BYPASSES</text>
<text x="304.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the model complies with something it should refuse</text>
<rect x="24" y="196" width="560" height="72" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="222" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">PROMPT EXTRACTION</text>
<text x="304.0" y="240" font-size="11" fill="#a8a8a8" text-anchor="middle">system prompt, tools, or hidden instructions leak out</text>
<rect x="24" y="282" width="560" height="72" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="308" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INJECTION</text>
<text x="304.0" y="326" font-size="11" fill="#a8a8a8" text-anchor="middle">untrusted content steers the model: tool output, pasted text, images</text>
<rect x="24" y="368" width="560" height="72" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="394" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">MISUSE ENABLEMENT</text>
<text x="304.0" y="412" font-size="11" fill="#a8a8a8" text-anchor="middle">dual-use help: the model upgrades the attacker&#x27;s capability</text>
<rect x="624" y="110" width="232" height="158" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="740.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">WHY IT MATTERS</text>
<text x="740.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">coverage = breaks found per</text>
<text x="740.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">bucket; an empty bucket is a</text>
<text x="740.0" y="184" font-size="11" fill="#a8a8a8" text-anchor="middle">claim about your testing, not</text>
<text x="740.0" y="199" font-size="11" fill="#a8a8a8" text-anchor="middle">your safety</text>
<rect x="624" y="284" width="232" height="158" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="740.0" y="310" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE RULE</text>
<text x="740.0" y="328" font-size="11" fill="#a8a8a8" text-anchor="middle">one transcript, one bucket; if</text>
<text x="740.0" y="343" font-size="11" fill="#a8a8a8" text-anchor="middle">a break fits two, the taxonomy</text>
<text x="740.0" y="358" font-size="11" fill="#a8a8a8" text-anchor="middle">is too coarse</text>
<text x="24" y="570" font-size="12" fill="#a8a8a8" text-anchor="start">Four buckets. File every finding the week it arrives, and the quarterly report writes itself.</text>
</svg>