<text x="120" y="410" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">picked: A, C, E. 3 intervals, optimal by the exchange argument</text>
<text x="450.0" y="456" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Research Engineer Curriculum, DSA Track: swapping any optimal first pick for the earliest-ending interval never hurts. Source: original.</text>
