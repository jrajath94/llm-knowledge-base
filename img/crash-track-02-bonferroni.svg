<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="100%" style="max-width:660px" role="img" aria-label="Twenty metrics tested at the 5 percent level: about one false significant result is expected by luck; the Bonferroni correction sets 0.0025 per test">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Twenty tests at 5%: one false hit is expected</text><rect x="24" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="54" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="84" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="114" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="144" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="174" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="204" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="234" y="90" width="24" height="24" fill="#f0b429" stroke="#f0b429" stroke-width="1.5" rx="3"/><rect x="264" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="294" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="324" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="354" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="384" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="414" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="444" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="474" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="504" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="534" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="564" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/><rect x="594" y="90" width="24" height="24" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" rx="3"/>
<text class="m" x="24" y="140">20 metrics, 5% level each. Expected false positives: 20 x 0.05 = 1.</text>
<text class="g" x="24" y="164" font-weight="700">The gold cell is significant by luck alone.</text>
<text class="m" x="24" y="196">Bonferroni fix: test each at 0.05 / 20 = 0.0025.</text>
<rect class="box" x="24" y="214" width="612" height="70" rx="8"/>
<text class="big" x="40" y="240">Report the corrected bar next to the raw p-values.</text>
<text class="m" x="40" y="264">Strict, cheap, and honest: the review sees both numbers.</text></svg>
