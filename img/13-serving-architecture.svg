<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Charis SIL',Georgia,serif">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" />
</marker>
</defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">LLM Serving Architecture</text>
<rect x="50" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="120.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Gateway</text>
<text x="120.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Rate limit, auth</text>
<rect x="250" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="320.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Batcher</text>
<text x="320.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Continuous batching</text>
<rect x="450" y="80" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="520.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">GPU Workers</text>
<text x="520.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Prefill + decode</text>
<rect x="250" y="220" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="320.0" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">KV Cache</text>
<text x="320.0" y="268" text-anchor="middle" font-size="11" fill="#a8a8a8">Per-request state</text>
<rect x="450" y="220" width="140" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="520.0" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Model Weights</text>
<text x="520.0" y="268" text-anchor="middle" font-size="11" fill="#a8a8a8">70B, INT8/FP16</text>
<line x1="190" y1="115" x2="250" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="220.0" y="107.0" text-anchor="middle" font-size="10" fill="#8a8a8a">requests</text>
<line x1="390" y1="115" x2="450" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="420.0" y="107.0" text-anchor="middle" font-size="10" fill="#8a8a8a">batches</text>
<line x1="520" y1="150" x2="520" y2="220" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="320" y1="150" x2="320" y2="220" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="400" y="350" text-anchor="middle" font-size="12" fill="#a8a8a8">Requests flow left to right. The batcher groups them. GPUs execute. KV cache holds state.</text>
</svg>