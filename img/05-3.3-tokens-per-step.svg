<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Tokens per batch: the number that matters</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">rows x seq_len; micro-batches make it fit</text>
<rect x="24" y="90" width="240" height="120" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6"/>
<text x="144.0" y="142.0" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">1024 rows</text>
<text x="144.0" y="164.0" font-size="11" fill="#a8a8a8" text-anchor="middle">each 4096 tokens</text>
<text x="276" y="152" font-size="28" fill="#8a8a8a" text-anchor="start">x</text>
<rect x="310" y="90" width="240" height="120" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6"/>
<text x="430.0" y="142.0" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">4096 tokens/row</text>
<text x="430.0" y="164.0" font-size="11" fill="#a8a8a8" text-anchor="middle">seq_len</text>
<text x="562" y="152" font-size="28" fill="#8a8a8a" text-anchor="start">=</text>
<rect x="596" y="90" width="260" height="120" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6"/>
<text x="726.0" y="142.0" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">4M tokens</text>
<text x="726.0" y="164.0" font-size="11" fill="#a8a8a8" text-anchor="middle">per optimizer step</text>
<text x="24" y="260" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">No GPU holds 4M tokens at once. Accumulate:</text>
<rect x="24" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="69.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 1</text>
<text x="69.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="124" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="169.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 2</text>
<text x="169.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="224" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="269.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 3</text>
<text x="269.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="324" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="369.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 4</text>
<text x="369.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="424" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="469.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 5</text>
<text x="469.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="524" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="569.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 6</text>
<text x="569.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="624" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="669.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 7</text>
<text x="669.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<rect x="724" y="276" width="90" height="54" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="769.0" y="295.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">micro 8</text>
<text x="769.0" y="317.0" font-size="11" fill="#a8a8a8" text-anchor="middle">128 rows</text>
<text x="24" y="360" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#a8a8a8" text-anchor="start">8 micro-batches  x  128 rows  x  4096 tokens  =  4M tokens per step</text>
<text x="24" y="386" font-size="13" fill="#f0b429" text-anchor="start">Gradient noise falls with tokens per step, which is why the batch is enormous.</text>
</svg>