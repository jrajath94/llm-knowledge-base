<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" width="100%" style="max-width:700px" role="img" aria-label="67 MB score matrix per head at 4k; KV cache per token from 2.62 MB for MHA down to 0.33 MB for GQA-8">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="300" fill="none"/>
<text class="t" x="24" y="30">The attention memory bill: scores and KV cache</text>
<text class="m" x="24" y="58">Score matrix @4k, fp32: 4096^2 x 4 bytes = 67 MB per head</text>
<rect x="24" y="70" width="420" height="30" rx="4" fill="#e57373" opacity="0.85"/>
<text class="big" x="36" y="92">67 MB per head: the quadratic bill made concrete</text>
<text class="big g" x="24" y="132">KV cache per token</text>
<text class="num" x="24" y="164">LLaMA-2 7B (MHA, 32 KV heads)</text>
<rect x="260" y="146" width="67.60000000000001" height="26" rx="4" fill="#e57373" opacity="0.85"/>
<text class="num" x="337.6" y="165">0.52 MB/token</text>
<text class="num" x="24" y="202">MHA reference</text>
<rect x="260" y="184" width="340.6" height="26" rx="4" fill="#e57373" opacity="0.85"/>
<text class="num" x="610.6" y="203">2.62 MB/token</text>
<text class="num" x="24" y="240">LLaMA-2 70B (GQA-8)</text>
<rect x="260" y="222" width="42.9" height="26" rx="4" fill="#7fc97f" opacity="0.85"/>
<text class="num" x="312.9" y="241">0.33 MB/token</text>
<text class="m" x="24" y="282">GQA-8 is 8x smaller than MHA: 2.1 GB at 4k vs 10.5 GB at batch 8 x 4k.</text>
</svg>
