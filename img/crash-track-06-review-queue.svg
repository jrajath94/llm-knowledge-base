<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Human review queue">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Human review queue</text>
<text x="300" y="58" text-anchor="middle" class="xs">Risky actions wait for a human. The agent does other work.</text>
<rect x="80" y="110" width="110" height="70" rx="8" fill="#6cb2ff" opacity="0.85"/>
<text x="135" y="138" text-anchor="middle" class="s b" style="fill:#1a1a1a">Agent</text>
<text x="135" y="160" text-anchor="middle" class="xs" style="fill:#1a1a1a">rehearses</text>
<line x1="190" y1="145" x2="230" y2="145" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="230,137 242,145 230,153" fill="#8a8a8a"/>
<rect x="230" y="110" width="110" height="70" rx="8" fill="#f0b429" opacity="0.85"/>
<text x="285" y="138" text-anchor="middle" class="s b" style="fill:#1a1a1a">Queue</text>
<text x="285" y="160" text-anchor="middle" class="xs" style="fill:#1a1a1a">waits</text>
<line x1="340" y1="145" x2="380" y2="145" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="380,137 392,145 380,153" fill="#8a8a8a"/>
<rect x="380" y="110" width="110" height="70" rx="8" fill="#7fc97f" opacity="0.85"/>
<text x="435" y="138" text-anchor="middle" class="s b" style="fill:#1a1a1a">Human</text>
<text x="435" y="160" text-anchor="middle" class="xs" style="fill:#1a1a1a">approves</text>
<text x="300" y="220" text-anchor="middle" class="s">SLA: 4 hours unreviewed pages someone.</text>
<text x="300" y="245" text-anchor="middle" class="xs">Only approval executes it for real. The queue needs an SLA,</text>
<text x="300" y="263" text-anchor="middle" class="xs">and the agent must continue other work while waiting.</text>
</svg>
