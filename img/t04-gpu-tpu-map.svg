<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-label="GPU to TPU concept mapping">
<rect width="720" height="385" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">What transfers: sharding is sharding</text>
<rect class="box" x="40" y="70" width="200" height="64" rx="8"/>
<text x="140" y="108" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">process group</text>
<path d="M240,102 L272,102" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="272" y="70" width="200" height="64" rx="8"/>
<text x="372" y="108" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">mesh (named axes)</text>
<rect x="492" y="70" width="188" height="64" rx="8" fill="#101010" stroke="#f0b429" stroke-width="1"/>
<text x="586" y="108" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">a named set of devices</text>
<rect class="box" x="40" y="150" width="200" height="64" rx="8"/>
<text x="140" y="188" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">sharding spec / DTensor</text>
<path d="M240,182 L272,182" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="272" y="150" width="200" height="64" rx="8"/>
<text x="372" y="188" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">PartitionSpec</text>
<rect x="492" y="150" width="188" height="64" rx="8" fill="#101010" stroke="#58a6ff" stroke-width="1"/>
<text x="586" y="188" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">which axis maps to which mesh axis</text>
<rect class="box" x="40" y="230" width="200" height="64" rx="8"/>
<text x="140" y="268" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">FSDP full shard</text>
<path d="M240,262 L272,262" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="272" y="230" width="200" height="64" rx="8"/>
<text x="372" y="268" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">pjit, fully sharded params</text>
<rect x="492" y="230" width="188" height="64" rx="8" fill="#101010" stroke="#3fb950" stroke-width="1"/>
<text x="586" y="268" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">shard everything, gather on demand</text>
<text x="140" y="330" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">GPU (PyTorch)</text>
<text x="372" y="330" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">TPU (JAX)</text>
<text x="586" y="330" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">same idea</text>
<text x="360" y="360" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">the mental models transfer; the vocabulary changes</text>
</svg>