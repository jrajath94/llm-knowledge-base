<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 311" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Six mechanical rules for clear writing"><rect x="22" y="14" width="916" height="283" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">WRITING</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Clarity is a set of rules, not a talent. Readers use prose to decide whether to trust</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">you.</text><path d="M 53.7 111.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="116" font-size="13.5" font-weight="700" fill="#ececec">Topic sentence first:</text><text x="238.81484375000002" y="116" font-size="13.5" fill="#a8a8a8">every paragraph opens with its point in one sentence; the rest is evidence.</text><path d="M 53.7 142.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="147" font-size="13.5" font-weight="700" fill="#ececec">Short sentences:</text><text x="213.73015625000002" y="147" font-size="13.5" fill="#a8a8a8">one idea per sentence. Three commas means two sentences.</text><path d="M 53.7 173.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="178" font-size="13.5" font-weight="700" fill="#ececec">Active voice:</text><text x="182.14859375" y="178" font-size="13.5" fill="#a8a8a8">name the actor: &quot;removing the gate degraded performance.&quot;</text><path d="M 53.7 204.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="209" font-size="13.5" font-weight="700" fill="#ececec">Verbs carry the action:</text><text x="258.944609375" y="209" font-size="13.5" fill="#a8a8a8">&quot;we measured,&quot; not &quot;a measurement was performed.&quot;</text><path d="M 53.7 235.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="240" font-size="13.5" font-weight="700" fill="#ececec">Define terms at first use:</text><text x="275.91875000000005" y="240" font-size="13.5" fill="#a8a8a8">every unexplained term is a small tax on trust; cut jargon that does no work.</text><path d="M 53.7 266.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="271" font-size="13.5" font-weight="700" fill="#ececec">Revise in passes:</text><text x="215.94078125000001" y="271" font-size="13.5" fill="#a8a8a8">structure, then sentences, then cuts. Never polish sentences before the structure is</text><text x="80" y="290" font-size="13.5" fill="#a8a8a8">right.</text></svg>