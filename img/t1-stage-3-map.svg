<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 327" role="img" aria-label="Stage 3. Judgment">
<rect width="900" height="327" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Stage 3. Judgment</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Vol 11 teaches rigor deliberately before Vol 12, so you read papers with the eval-statistics lens already on.</text>
<rect x="40.0" y="77.0" width="820.0" height="98.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="60.0" y="105.0" text-anchor="start" fill="#2dd4bf" font-size="14.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vol 11: Research methods</text>
<text x="60.0" y="129.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Main volume + App 11A (eval statistics) + App 11B (labeler protocols)</text>
<text x="60.0" y="149.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Eval statistics is how you tell a real delta from noise. Preference data quality caps every</text>
<text x="60.0" y="164.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">alignment method.</text>
<rect x="40.0" y="185.0" width="820.0" height="98.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="60.0" y="213.0" text-anchor="start" fill="#4aa8ff" font-size="14.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vol 12: Paper spine</text>
<text x="60.0" y="237.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">All fourteen papers in order, with the synthesis chapter</text>
<text x="60.0" y="257.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">The shared vocabulary of the field. Deepest study: Paper 5 (Chinchilla), Paper 11 (DPO), Paper 14</text>
<text x="60.0" y="272.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">(DeepSeek-R1).</text>
</svg>
