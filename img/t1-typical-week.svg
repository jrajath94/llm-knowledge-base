<text x="60.0" y="219.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">Wed</text>
<text x="130.0" y="219.0" text-anchor="start" fill="#8a8a8a" font-size="12.5" font-family="Charis SIL, Georgia, serif">debug the sick runs, fix data or code</text>
<rect x="700.0" y="202.0" width="46.2" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="723.1" y="217.0" text-anchor="middle" fill="#2dd4bf" font-size="11" font-family="Charis SIL, Georgia, serif">TRAIN</text>
