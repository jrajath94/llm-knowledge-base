<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 585" role="img" aria-label="A week in the life: three loops, five days">
<rect width="900" height="585" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">A week in the life: three loops, five days</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">The week is a train loop, an eval loop, and a read loop running in parallel.</text>
