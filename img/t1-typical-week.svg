<text x="60.0" y="275.0" text-anchor="start" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">Thu</text>
<text x="130.0" y="275.0" text-anchor="start" fill="#8a8a8a" font-size="12.5" font-family="Charis SIL, Georgia, serif">eval analysis on finished runs, ablations</text>
<rect x="700.0" y="258.0" width="40.2" height="23.0" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
<text x="720.1" y="273.0" text-anchor="middle" fill="#4aa8ff" font-size="11" font-family="Charis SIL, Georgia, serif">EVAL</text>
