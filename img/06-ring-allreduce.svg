<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f0b429"/></marker></defs>
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The ring all-reduce in two phases</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">4 GPUs, gradient vector split into chunks a, b, c, d. Each rank sends and receives 2(N-1)/N x M bytes.</text>
<rect x="385" y="58" width="110" height="64" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="8"/>
<text x="440" y="96" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 0</text><rect x="645" y="198" width="110" height="64" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="8"/>
<text x="700" y="236" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 1</text><rect x="385" y="338" width="110" height="64" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="8"/>
<text x="440" y="376" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 2</text><rect x="125" y="198" width="110" height="64" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="8"/>
<text x="180" y="236" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 3</text>
<path d="M 520 110 Q 640 130 660 180" stroke="#f0b429" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M 680 300 Q 600 360 520 370" stroke="#f0b429" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M 360 350 Q 240 330 220 280" stroke="#f0b429" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M 200 160 Q 280 100 360 90" stroke="#f0b429" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="440" y="240" font-size="14" fill="#f0b429" text-anchor="middle">chunks travel clockwise</text>
<text x="60" y="440" font-size="13" fill="#ececec"><tspan font-weight="bold">Phase 1, scatter-reduce:</tspan> each GPU sends one chunk right and adds the chunk it receives. After 3 steps every chunk is fully summed somewhere.</text>
<text x="60" y="462" font-size="13" fill="#ececec"><tspan font-weight="bold">Phase 2, all-gather:</tspan> the summed chunks circle the ring again. Every GPU ends with all four sums.</text>
</svg>