<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="t08es-title t08es-desc">
<title id="t08es-title">Embedding space: similar meaning, short distance</title>
<desc id="t08es-desc">A two-dimensional scatter plot. The query point sits in the middle. Three document points about refunds sit close to it inside a small ring. Two points about shipping sit farther away. One point about HR policy sits far outside. Closer points have higher cosine similarity.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="430" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">EMBEDDING SPACE (2 OF 1,536 DIMENSIONS SHOWN)</text>
<circle cx="470" cy="240" r="70" fill="none" stroke="#2a2a2a" stroke-width="1.2" stroke-dasharray="5,5"/>
<circle cx="470" cy="240" r="140" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="5,5"/>
<circle cx="470" cy="240" r="210" fill="none" stroke="#1c1c1c" stroke-width="1.2" stroke-dasharray="5,5"/>
<circle cx="430" cy="200" r="9" fill="#6ab0ff" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="430" y="184" class="tl" fill="#6ab0ff">refund policy</text>
<circle cx="510" cy="285" r="9" fill="#6ab0ff" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="510" y="269" class="tl" fill="#6ab0ff">returns window</text>
<circle cx="500" cy="195" r="9" fill="#6ab0ff" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="500" y="179" class="tl" fill="#6ab0ff">refund steps</text>
<circle cx="350" cy="320" r="9" fill="#a8a8a8" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="350" y="304" class="tl" fill="#a8a8a8">shipping rates</text>
<circle cx="600" cy="330" r="9" fill="#a8a8a8" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="600" y="314" class="tl" fill="#a8a8a8">delivery time</text>
<circle cx="700" cy="120" r="9" fill="#ff7a7a" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="700" y="104" class="tl" fill="#ff7a7a">HR leave policy</text>
<circle cx="470" cy="240" r="11" fill="#f0b429" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="470" y="268" class="tl" fill="#f0b429">query: "how do I get a refund?"</text>
<text x="30" y="400" class="dl">Near points = high cosine similarity = retrieved first.</text>
<text x="30" y="420" class="dl">Far points = low similarity = ignored.</text>
</g>
<defs><marker id="t08es-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>