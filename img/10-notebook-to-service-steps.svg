<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Four stages from notebook to service, each adding one production property"><rect x="22" y="14" width="916" height="242" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 1</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">From notebook cells to a running service</text><rect x="38" y="90" width="196" height="130" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="136" y="118" font-size="14" font-weight="700" fill="#ececec" text-anchor="middle">Notebook</text><text x="136" y="144" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">cells run in any order</text><text x="136" y="164" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">hidden state</text><text x="136" y="196" font-size="12" font-weight="400" fill="#f0b429" text-anchor="middle">adds: order</text><line x1="234" y1="155" x2="264" y2="155" stroke="#f0b429" stroke-width="2"/><path d="M 256 151 L 264 155 L 256 159" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="264" y="90" width="196" height="130" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="362" y="118" font-size="14" font-weight="700" fill="#ececec" text-anchor="middle">Script</text><text x="362" y="144" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">runs top to bottom</text><text x="362" y="164" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">deps in requirements.txt</text><text x="362" y="196" font-size="12" font-weight="400" fill="#f0b429" text-anchor="middle">adds: reproducibility</text><line x1="460" y1="155" x2="490" y2="155" stroke="#f0b429" stroke-width="2"/><path d="M 482 151 L 490 155 L 482 159" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="490" y="90" width="196" height="130" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="588" y="118" font-size="14" font-weight="700" fill="#ececec" text-anchor="middle">Package</text><text x="588" y="144" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">versioned and tested</text><text x="588" y="164" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">importable module</text><text x="588" y="196" font-size="12" font-weight="400" fill="#f0b429" text-anchor="middle">adds: versioning</text><line x1="686" y1="155" x2="716" y2="155" stroke="#f0b429" stroke-width="2"/><path d="M 708 151 L 716 155 L 708 159" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="716" y="90" width="196" height="130" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="814" y="118" font-size="14" font-weight="700" fill="#ececec" text-anchor="middle">Service</text><text x="814" y="144" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">HTTP endpoint</text><text x="814" y="164" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle">health checks and logs</text><text x="814" y="196" font-size="12" font-weight="400" fill="#f0b429" text-anchor="middle">adds: operability</text></svg>