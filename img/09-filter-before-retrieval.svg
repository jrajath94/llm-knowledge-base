<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="660" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Filter before retrieval</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Path D bridge: the single most-tested guardrail idea in enterprise design reviews</text>
<rect x="24" y="94" width="414" height="220" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="231.0" y="126" font-size="14" font-weight="bold" fill="#7dd87d" text-anchor="middle">Safe: filter, then retrieve</text>
<text x="48" y="150" font-size="11" fill="#a8a8a8" text-anchor="start">Permission filter runs first.</text>
<text x="48" y="171" font-size="11" fill="#a8a8a8" text-anchor="start">The retriever only sees what the</text>
<text x="48" y="192" font-size="11" fill="#a8a8a8" text-anchor="start">user may see.</text>
<text x="48" y="217" font-size="11" fill="#a8a8a8" text-anchor="start">Nothing to leak downstream.</text>
<rect x="462" y="94" width="414" height="220" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="669.0" y="126" font-size="14" font-weight="bold" fill="#e57ea6" text-anchor="middle">Leaky: retrieve, then filter</text>
<text x="486" y="150" font-size="11" fill="#a8a8a8" text-anchor="start">Post-retrieval filtering leaks</text>
<text x="486" y="171" font-size="11" fill="#a8a8a8" text-anchor="start">through timing, citations, and</text>
<text x="486" y="192" font-size="11" fill="#a8a8a8" text-anchor="start">&quot;I can&#x27;t show you that&quot;</text>
<text x="486" y="213" font-size="11" fill="#a8a8a8" text-anchor="start">confirmations.</text>
<rect x="24" y="364" width="852" height="130" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="398" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Agents raise the stakes</text>
<text x="48" y="428" font-size="11" fill="#a8a8a8" text-anchor="start">A chatbot&#x27;s worst case is a bad answer; an agent&#x27;s worst case is a wrong tool call, which is why write</text>
<text x="48" y="445" font-size="11" fill="#a8a8a8" text-anchor="start">actions sit behind human approval gates. Reliability contracts turn each guardrail into an SLO with a</text>
<text x="48" y="462" font-size="11" fill="#a8a8a8" text-anchor="start">test and a trace (Volume 10).</text>
</svg>