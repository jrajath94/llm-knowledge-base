<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 460' width='100%' role='img'>
<title>Compaction</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Compaction: summarize the past, keep the future</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Every N steps, replace the oldest steps with a summary. Three things stay verbatim.</text>
<text x='90' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>BEFORE: full history</text>
<rect x='90' y='140' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='164' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='188' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='212' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='236' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='260' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='284' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<rect x='90' y='308' width='300' height='16' rx='4' fill='#8a8a8a' fill-opacity='0.35'/>
<text x='90' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='start'>context fills up, cost compounds</text>
<line x1='430' y1='220' x2='520' y2='220' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='511.8,223.7 520,220 511.8,216.3' fill='#8a8a8a'/>
<text x='475' y='200' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#8a8a8a' text-anchor='middle'>summarize</text>
<text x='600' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='start'>AFTER: summary + recent steps</text>
<rect x='600' y='136' width='270' height='70' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='735' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Summary card</text>
<text x='735' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>what was tried, what failed,</text>
<text x='735' y='200' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>load-bearing facts, ids</text>
<rect x='600' y='218' width='270' height='16' rx='4' fill='#2e9e5b' fill-opacity='0.55'/>
<rect x='600' y='242' width='270' height='16' rx='4' fill='#2e9e5b' fill-opacity='0.55'/>
<text x='600' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='start'>keep verbatim: original task,</text>
<text x='600' y='312' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='start'>most recent K steps, ids and</text>
<text x='600' y='332' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='start'>decisions the summary marks as load-bearing</text>
<text x='480' y='410' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Too aggressive = dropped facts. Too timid = context overflow. The KEEP markers are the whole design.</text>
</svg>