<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-label="GPUDirect RDMA: four-copy path vs direct path">
<rect width="720" height="285" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">GPUDirect RDMA: remove the middlemen</text>
<text x="200" y="60" text-anchor="middle" fill="#e5484d" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">without: four copies</text>
<rect class="box" x="20" y="70" width="100" height="56" rx="8"/>
<text x="70" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">GPU mem</text>
<path d="M120,98 L132,98" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<rect class="box" x="132" y="70" width="100" height="56" rx="8"/>
<text x="182" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">host mem</text>
<path d="M232,98 L244,98" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<rect class="box" x="244" y="70" width="100" height="56" rx="8"/>
<text x="294" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">NIC</text>
<path d="M344,98 L356,98" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<rect class="box" x="356" y="70" width="100" height="56" rx="8"/>
<text x="406" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">NIC</text>
<path d="M456,98 L468,98" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<rect class="box" x="468" y="70" width="100" height="56" rx="8"/>
<text x="518" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">host mem</text>
<path d="M568,98 L580,98" stroke="#e5484d" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
<rect class="box" x="580" y="70" width="100" height="56" rx="8"/>
<text x="630" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">GPU mem</text>
<text x="200" y="155" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">four copies, four latency hits, CPU involved in all of them</text>
<text x="520" y="60" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">with: GPU to wire to GPU</text>
<rect class="box" x="330" y="70" width="68" height="56" rx="8"/>
<text x="364" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">GPU mem</text>
<path d="M398,98 L406,98" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<rect class="box" x="406" y="70" width="68" height="56" rx="8"/>
<text x="440" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">NIC</text>
<path d="M474,98 L482,98" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<rect class="box" x="482" y="70" width="68" height="56" rx="8"/>
<text x="516" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">wire</text>
<path d="M550,98 L558,98" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<rect class="box" x="558" y="70" width="68" height="56" rx="8"/>
<text x="592" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">NIC</text>
<path d="M626,98 L634,98" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
<rect class="box" x="634" y="70" width="68" height="56" rx="8"/>
<text x="668" y="103" text-anchor="middle" fill="#ececec" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">GPU mem</text>
<text x="520" y="155" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">the HCA reads and writes GPU memory directly</text>
<text x="360" y="200" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">NCCL assumes it: disabled GPUDirect can halve multi-node bandwidth silently</text>
<text x="360" y="226" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">it is why InfiniBand beats emulated RDMA for training</text>
<text x="360" y="252" text-anchor="middle" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">cluster bring-up must include a GPU-to-GPU RDMA bandwidth test</text>
</svg>