<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" role="img" aria-label="Defense in depth guardrail layers">
<rect width="700" height="450" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="350.0" y="28" text-anchor="middle" font-size="18" class="accent">Guardrails: Defense in Depth</text>
<rect x="150" y="70" width="400" height="45" class="box" rx="4"/>
<text x="350" y="98" text-anchor="middle" font-size="13">1. Input screening</text>
<rect x="150" y="125" width="400" height="45" class="box" rx="4"/>
<text x="350" y="153" text-anchor="middle" font-size="13">2. Injection detection</text>
<rect x="150" y="180" width="400" height="45" class="box" rx="4"/>
<text x="350" y="208" text-anchor="middle" font-size="13">3. PII redaction</text>
<rect x="150" y="235" width="400" height="45" class="box" rx="4"/>
<text x="350" y="263" text-anchor="middle" font-size="13">4. Permission filter</text>
<rect x="150" y="290" width="400" height="45" class="box" rx="4"/>
<text x="350" y="318" text-anchor="middle" font-size="13">5. Human approval</text>
<rect x="150" y="345" width="400" height="45" class="box" rx="4"/>
<text x="350" y="373" text-anchor="middle" font-size="13">6. Audit trail</text>
<text x="350" y="430" text-anchor="middle" font-size="12" class="muted">Every layer fails. Stack them.</text>
</svg>