<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The four golden signals, ML edition"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">MONITORING</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Classical services watch latency, traffic, errors, saturation. ML adds:</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Prediction quality:</text><text x="225.658671875" y="94" font-size="13.5" fill="#a8a8a8">eval scores on live samples, judge scores, user feedback rates</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Data distribution:</text><text x="219.980234375" y="125" font-size="13.5" fill="#a8a8a8">feature drift and label drift on what the model sees</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Cost per request:</text><text x="217.37515625" y="156" font-size="13.5" fill="#a8a8a8">tokens and GPU time: the bill is a signal too</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">Guardrail catch rates:</text><text x="251.232734375" y="187" font-size="13.5" fill="#a8a8a8">a spike in blocked outputs is a signal, not just a defense</text></svg>