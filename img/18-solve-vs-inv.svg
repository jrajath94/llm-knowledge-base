<svg xmlns='http://www.w3.org/2000/svg' width='700' height='400' viewBox='0 0 700 400' font-family='DejaVu Sans'>
<rect width='700' height='400' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>solve or lstsq vs the explicit inverse</text>
<rect x='60' y='70' width='250' height='250' rx='8' fill='none' stroke='#7fd08a' stroke-width='1.5'/>
<text x='185' y='100' font-size='13' fill='#7fd08a' text-anchor='middle' font-weight='bold'>GOOD PATH</text>
<text x='185' y='135' font-size='13' fill='#e8e8e8' text-anchor='middle'>np.linalg.solve</text>
<text x='185' y='158' font-size='13' fill='#e8e8e8' text-anchor='middle'>np.linalg.lstsq</text>
<text x='185' y='195' font-size='12' fill='#9a9a9a' text-anchor='middle'>no inverse formed</text>
<text x='185' y='218' font-size='12' fill='#9a9a9a' text-anchor='middle'>fewer flops</text>
<text x='185' y='241' font-size='12' fill='#9a9a9a' text-anchor='middle'>condition number kept</text>
<text x='185' y='264' font-size='12' fill='#9a9a9a' text-anchor='middle'>stable on collinear X</text>
<rect x='390' y='70' width='250' height='250' rx='8' fill='none' stroke='#ff7b8a' stroke-width='1.5'/>
<text x='515' y='100' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>BAD PATH</text>
<text x='515' y='135' font-size='13' fill='#e8e8e8' text-anchor='middle'>np.linalg.inv(X.T @ X)</text>
<text x='515' y='170' font-size='12' fill='#9a9a9a' text-anchor='middle'>3x the flops</text>
<text x='515' y='193' font-size='12' fill='#9a9a9a' text-anchor='middle'>squares condition number</text>
<text x='515' y='216' font-size='12' fill='#9a9a9a' text-anchor='middle'>collinear features -> garbage</text>
<text x='515' y='239' font-size='12' fill='#9a9a9a' text-anchor='middle'>silent wrong answer</text>
<text x='350' y='360' font-size='12' fill='#f0b429' text-anchor='middle'>Same math, different numerics. The bug never raises an error.</text>
</svg>