<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="100%" style="max-width:760px" role="img" aria-label="Formula, worked 70B-class example, context table from 1k to 128k tokens">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="388" fill="none"/>
<text class="t" x="24" y="30">KV-cache bytes per token: the capacity equation of serving</text>
<text class="big" x="24" y="88">KV bytes per token = 2 x layers x KV-heads x head-dim x bytes-per-value</text>
<text class="m" x="24" y="114">the 2 counts keys and values; KV-heads is fewer with grouped-query attention</text>
<rect x="24" y="132" width="712" height="64" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.6"/>
<text class="num" x="44" y="162">worked, 70B-class: 2 x 80 x 8 x 128 x 2 = 327,680 bytes = 320 KiB per token</text>
<text class="m" x="44" y="184">fewer KV heads means a smaller cache: GQA shares each KV head across query heads</text>
<text class="num" x="44" y="228">1k tokens</text>
<text class="big" x="200" y="228">320 MB</text>
<text class="m" x="320" y="228">trivial</text>
<text class="num" x="44" y="258">8k tokens</text>
<text class="big" x="200" y="258">2.56 GB</text>
<text class="m" x="320" y="258">noticeable</text>
<text class="num" x="44" y="288">32k tokens</text>
<text class="big" x="200" y="288">10.2 GB</text>
<text class="m" x="320" y="288">a real budget line</text>
<text class="num" x="44" y="318">128k tokens</text>
<text class="big" x="200" y="318">41 GB</text>
<text class="m" x="320" y="318">more than half an 80 GB GPU</text>
<text class="num" x="24" y="364">Long context is a batch-size tax: at 32k each sequence costs ~10 GB, so 10 GB of KV headroom fits exactly one.</text>
</svg>
