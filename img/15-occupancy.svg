<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="sans-serif">
<rect width="600" height="400" fill="#ffffff"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Occupancy and Latency Hiding</text>
<rect x="50" y="100" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="150.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">High Occupancy</text>
<text x="150.0" y="148" text-anchor="middle" font-size="11" fill="#555">Many warps</text>
<rect x="350" y="100" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="450.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Low Occupancy</text>
<text x="450.0" y="148" text-anchor="middle" font-size="11" fill="#555">Few warps</text>
<text x="150" y="200" text-anchor="middle" font-size="11" fill="#0d652d">Hides latency</text>
<text x="450" y="200" text-anchor="middle" font-size="11" fill="#d93025">Stalls on memory</text>
<text x="300" y="280" text-anchor="middle" font-size="12" fill="#555">More warps per SM = better latency hiding.</text>
</svg>
