<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="'Charis SIL',Georgia,serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" /></marker></defs>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Occupancy and Latency Hiding</text>
<rect x="50" y="100" width="200" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="150.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">High Occupancy</text>
<text x="150.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Many warps</text>
<rect x="350" y="100" width="200" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="450.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Low Occupancy</text>
<text x="450.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Few warps</text>
<text x="150" y="200" text-anchor="middle" font-size="11" fill="#7fc97f">Hides latency</text>
<text x="450" y="200" text-anchor="middle" font-size="11" fill="#e57373">Stalls on memory</text>
<text x="300" y="280" text-anchor="middle" font-size="12" fill="#a8a8a8">More warps per SM = better latency hiding.</text>
</svg>