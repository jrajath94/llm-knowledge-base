<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-labelledby="t09rs-title t09rs-desc">
<title id="t09rs-title">Model registry: staging, production, archived</title>
<desc id="t09rs-desc">Three boxes. Staging: candidates waiting for the eval gate. Production: the one model serving users, with its version pinned. Archived: old models kept for rollback and audits. Arrows show promotion and rollback.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="380" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">MODEL REGISTRY STAGES</text>
<rect x="30" y="100" width="250" height="110" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="155.0" y="134" class="box" fill="#ececec">staging</text>
<text x="155.0" y="156" class="d">candidates</text>
<text x="155.0" y="174" class="d">awaiting eval gate</text>
<rect x="345" y="100" width="250" height="110" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="470.0" y="134" class="box" fill="#ececec">production</text>
<text x="470.0" y="156" class="d">v2.3 serving</text>
<text x="470.0" y="174" class="d">exactly one</text>
<rect x="660" y="100" width="250" height="110" rx="10" fill="#111111" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="785.0" y="134" class="box" fill="#ececec">archived</text>
<text x="785.0" y="156" class="d">v2.2, v2.1 ...</text>
<text x="785.0" y="174" class="d">for rollback</text>
<line x1="280" y1="155" x2="345" y2="155" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09rs-ah)"/>
<text x="312.5" y="149.0" class="d">promote</text>
<line x1="595" y1="155" x2="660" y2="155" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t09rs-ah)"/>
<text x="627.5" y="149.0" class="d">retire</text>
<line x1="470" y1="210" x2="155" y2="210" stroke="#ff7a7a" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#t09rs-ah)"/>
<text x="280" y="202" class="dl" fill="#ff7a7a">rollback</text>
<text x="30" y="300" class="capl">How to read: left to right = lifecycle. Only production serves users.</text>
<text x="30" y="322" class="dl">Rule: never delete an archived model until its audit window closes.</text>
</g>
<defs><marker id="t09rs-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>