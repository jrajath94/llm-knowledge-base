<svg xmlns="http://www.w3.org/2000/svg" width="540" height="300" viewBox="0 0 540 300">
<rect width="540" height="300" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Tails multiply across hops</text><text x='60' y='100' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>20 hops, each p99 = 100 ms</text><text x='60' y='140' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#f0b429' text-anchor='start' font-weight='bold'>P(all 20 under p99) = 0.99^20 = 0.818</text><text x='60' y='180' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='start'>18% of end-to-end requests exceed 100 ms somewhere</text><text x='60' y='220' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>The end-to-end p99 is set by the worst hop.</text><text x='20' y='270' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>p99 is where the tail starts, not the worst case.</text></svg>