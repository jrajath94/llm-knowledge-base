<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Eigendecomposition vs SVD">
<rect width="900" height="400" rx="12" fill="#0f1420"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9ff"/></marker>
<marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa4b8"/></marker></defs>
<text x="450" y="36" font-family="sans-serif" font-size="20" fill="#e8ecf4" text-anchor="middle" font-weight="bold">Eigendecomposition vs SVD</text>
<text x="225" y="80" font-family="sans-serif" font-size="16" fill="#5aa9ff" text-anchor="middle" font-weight="bold">Eigendecomposition</text>
<text x="225" y="102" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">square matrices only</text>
<rect x="125" y="130" width="200" height="120" rx="8" fill="#182030" stroke="#5aa9ff" stroke-width="1.5"/>
<text x="225" y="175" font-family="sans-serif" font-size="16" fill="#e8ecf4" text-anchor="middle" font-weight="normal">A = V L V^-1</text>
<text x="225" y="205" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">eigenvectors may</text>
<text x="225" y="225" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">not be orthogonal</text>
<text x="225" y="300" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">powers: A^k = V L^k V^-1</text>
<text x="225" y="325" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">stability from |lambda|</text>
<text x="675" y="80" font-family="sans-serif" font-size="16" fill="#5fd08a" text-anchor="middle" font-weight="bold">SVD</text>
<text x="675" y="102" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">any shape, always works</text>
<rect x="575" y="130" width="200" height="120" rx="8" fill="#182030" stroke="#5fd08a" stroke-width="1.5"/>
<text x="675" y="175" font-family="sans-serif" font-size="16" fill="#e8ecf4" text-anchor="middle" font-weight="normal">A = U S V^T</text>
<text x="675" y="205" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">U, V orthogonal</text>
<text x="675" y="225" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">S diagonal, sorted</text>
<text x="675" y="300" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">best rank-k approximation</text>
<text x="675" y="325" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">LoRA, compression, PCA</text>
<line x1="450" y1="70" x2="450" y2="340" stroke="#9aa4b8" stroke-width="1" stroke-dasharray="5,5"/>
<text x="450" y="372" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">Use SVD unless the matrix is square with a full eigenvector set.</text>
</svg>