<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Human review: where the humans sit in the loop</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">automated grading scales; humans adjudicate what matters</text>
<rect x="24" y="110" width="832" height="90" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440" y="135" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">AUTOMATED FIRST PASS</text>
<text x="440" y="158" font-size="11" fill="#a8a8a8" text-anchor="middle">model grades everything; cheap, fast, consistent</text>
<line x1="300" y1="200" x2="300" y2="250" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="300,250 296.33015592246386,241.78219953718923 303.66984407753614,241.78219953718923" fill="#8a8a8a"/>
<line x1="580" y1="200" x2="580" y2="250" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="580,250 576.3301559224639,241.78219953718923 583.6698440775361,241.78219953718923" fill="#8a8a8a"/>
<rect x="24" y="250" width="400" height="120" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="276" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HUMAN: audit sample</text>
<text x="224.0" y="294" font-size="11" fill="#a8a8a8" text-anchor="middle">50 items / month re-graded; the calibration loop input</text>
<rect x="456" y="250" width="400" height="120" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="276" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HUMAN: critical review</text>
<text x="656.0" y="294" font-size="11" fill="#a8a8a8" text-anchor="middle">every critical failure and every near-miss gets human</text>
<text x="656.0" y="309" font-size="11" fill="#a8a8a8" text-anchor="middle">eyes before the report</text>
<text x="24" y="420" font-size="12" fill="#a8a8a8" text-anchor="start">Humans do not grade 10,000 items; they grade the 50 that keep the machine honest and the handful that could</text>
<text x="24" y="438" font-size="12" fill="#a8a8a8" text-anchor="start">end a career.</text>
</svg>