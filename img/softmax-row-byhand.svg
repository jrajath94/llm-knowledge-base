<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 512" width="100%" style="max-width:700px" role="img" aria-label="Six stages: load with masked lane, row max, subtract, exp, sum, divide; the masked lane contributes exactly zero">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="492" fill="none"/>
<text class="t" x="24" y="30">One softmax row by hand: [1.0, 2.0, 3.0], BLOCK=4</text>
<line x1="99" y1="102" x2="99" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="99" y1="168" x2="99" y2="176" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="99" y1="234" x2="99" y2="242" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="99" y1="300" x2="99" y2="308" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="99" y1="366" x2="99" y2="374" stroke="#8a8a8a" stroke-width="1.5"/>
<rect class="box" x="24" y="44" width="150" height="58" rx="8"/>
<text class="big g" x="36" y="70">Load</text>
<text class="m" x="36" y="90">masked lane fills with -inf</text>
<text class="num" x="190" y="74">[1.0, 2.0, 3.0, -inf]</text>
<rect class="box" x="24" y="110" width="150" height="58" rx="8"/>
<text class="big g" x="36" y="136">row_max</text>
<text class="m" x="36" y="156">-inf lane cannot win the max</text>
<text class="num" x="190" y="140">3.0</text>
<rect class="box" x="24" y="176" width="150" height="58" rx="8"/>
<text class="big g" x="36" y="202">Subtract</text>
<text class="m" x="36" y="222">stability: shifts before exp</text>
<text class="num" x="190" y="206">[-2.0, -1.0, 0.0, -inf]</text>
<rect class="box" x="24" y="242" width="150" height="58" rx="8"/>
<text class="big g" x="36" y="268">Exp</text>
<text class="m" x="36" y="288">masked lane contributes 0</text>
<text class="num" x="190" y="272">[0.1353, 0.3679, 1.0, 0.0]</text>
<rect class="box" x="24" y="308" width="150" height="58" rx="8"/>
<text class="big g" x="36" y="334">Sum</text>
<text class="m" x="36" y="354">one scalar</text>
<text class="num" x="190" y="338">1.5032</text>
<rect class="box" x="24" y="374" width="150" height="58" rx="8"/>
<text class="big g" x="36" y="400">Divide</text>
<text class="m" x="36" y="420">sums to 1.0; lane 3 dropped</text>
<text class="num" x="190" y="404">[0.0900, 0.2447, 0.6652, 0.0]</text>
<text class="r" x="24" y="470">Failure mode without max-subtraction:</text>
<text class="r" x="24" y="490">inputs shifted +100 -&gt; exp overflows to inf -&gt; output NaN.</text>
</svg>
