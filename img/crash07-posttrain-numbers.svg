<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="100%" style="max-width:700px" role="img" aria-label="Memory ladder from full fine-tuning 84 GB to QLoRA 4 GB; triple 88 percent labelers reach 96 percent majority agreement">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="356" fill="none"/>
<text class="t" x="24" y="30">Post-training numbers: the fine-tuning ladder and label quality</text>
<text class="big g" x="24" y="58">Fine-tuning memory ladder (7B)</text>
<text class="num" x="24" y="90">Full fine-tune</text>
<rect x="220" y="72" width="440" height="26" rx="4" fill="#e57373" opacity="0.9"/>
<text class="num" x="670.0" y="91">84 GB</text>
<text class="num" x="24" y="128">LoRA</text>
<rect x="220" y="110" width="76" height="26" rx="4" fill="#f0b429" opacity="0.9"/>
<text class="num" x="305.95238095238096" y="129">14.5 GB</text>
<text class="num" x="24" y="166">QLoRA</text>
<rect x="220" y="148" width="21" height="26" rx="4" fill="#7fc97f" opacity="0.9"/>
<text class="num" x="250.95238095238096" y="167">4 GB</text>
<text class="big g" x="24" y="210">Preference data is a noisy instrument</text>
<text class="num" x="24" y="244">Labeler agreement ~70% is normal; kappa 0.6-0.8 is healthy</text>
<rect class="box" x="24" y="256" width="560" height="66" rx="8"/>
<text class="big g" x="38" y="284">Triple 88% labelers -&gt; 96% majority vote</text>
<text class="m" x="38" y="306">3 x 0.88^2 x 0.12 + 0.88^3 = 0.278 + 0.681 = 0.959: redundancy buys reliability</text>
</svg>
