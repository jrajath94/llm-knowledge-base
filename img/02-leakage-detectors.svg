<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='100%' role='img'><rect x='0' y='0' width='960' height='430' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Three detectors, built into every pipeline</text><rect x='30' y='70' width='292' height='220' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='176' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>D1: single-feature scan</text><text x='176' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>train a trivial model on each feature alone</text><text x='176' y='172' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>real feature: AUC 0.50 - 0.85</text><text x='176' y='194' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>AUC = 1.000 is not a feature,</text><text x='176' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>it is the answer key</text><text x='176' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#1565c0' text-anchor='middle'>detector</text><rect x='342' y='70' width='292' height='220' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='488' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>D2: duplicate audit</text><text x='488' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>hash rows, check both sides of the split</text><text x='488' y='172' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>here: 40 of 120 duplicate groups</text><text x='488' y='194' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>straddle the split,</text><text x='488' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the split is contaminated</text><text x='488' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#f0b429' text-anchor='middle'>detector</text><rect x='654' y='70' width='292' height='220' rx='10' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><text x='800' y='104' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>D3: hygiene checklist</text><text x='800' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>assert, do not assume</text><text x='800' y='172' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>test indices disjoint from train,</text><text x='800' y='194' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>every transform fit on train only,</text><text x='800' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>scaler included</text><text x='800' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#4db6ac' text-anchor='middle'>detector</text><line x1='480' y1='300' x2='480' y2='326' stroke='#f0b429' stroke-width='3'/><polygon points='480.0,326.0 475.4,318.3 484.6,318.3' fill='#f0b429'/><rect x='230' y='332' width='500' height='64' rx='10' fill='#141414' stroke='#3a3a3a' stroke-width='1.5'/><text x='480' y='358' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Dirty pipeline: 99.06%  -&gt;  honest re-run: 91.75%</text><text x='480' y='382' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#e57ea6' text-anchor='middle'>the leak was worth 7.3 points</text></svg>