<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 350">
<rect width="560" height="350" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Redaction policy, per field</text><rect x='30' y='70' width='200' height='56' rx='8' fill='none' stroke='#e57ea6' stroke-width='1.5'/><text x='130.0' y='103.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='middle'>NEVER STORE</text><text x='250' y='94' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>full SSNs, card numbers</text><text x='250' y='116' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>redact before logging</text><rect x='30' y='146' width='200' height='56' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='130.0' y='179.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>STORE ENCRYPTED</text><text x='250' y='170' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>emails</text><text x='250' y='192' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>support follow-up only</text><rect x='30' y='222' width='200' height='56' rx='8' fill='none' stroke='#7bc98a' stroke-width='1.5'/><text x='130.0' y='255.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='middle'>CONTEXT YES / OUTPUT NO</text><text x='250' y='246' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>account ids</text><text x='250' y='268' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>model needs them; never print</text><text x='20' y='320' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>"We handle PII carefully" is a wish. The per-field list is a policy.</text></svg>