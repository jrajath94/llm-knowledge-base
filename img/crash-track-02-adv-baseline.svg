<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" style="max-width:680px" role="img" aria-label="PPO estimates advantages against a learned value network; GRPO uses the group mean instead, so the value network disappears">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Advantage baselines: PPO vs GRPO</text>
<rect class="box" x="24" y="70" width="300" height="200" rx="8"/>
<text class="big" x="174" y="98" text-anchor="middle">PPO: learned baseline</text>
<text class="num" x="60" y="130">advantage = r - V(x)</text>
<rect class="box" x="60" y="146" width="228" height="52" rx="6"/>
<text class="m" x="174" y="168" text-anchor="middle">value head V(x): a whole</text>
<text class="m" x="174" y="186" text-anchor="middle">network that learns E[r]</text>
<text class="m" x="60" y="224">needs its own training,</text>
<text class="m" x="60" y="244">its own tuning, its own bugs</text>
<rect class="box" x="356" y="70" width="300" height="200" rx="8" stroke="#f0b429"/>
<text class="big" x="506" y="98" text-anchor="middle">GRPO: group baseline</text>
<text class="num" x="392" y="130">advantage = (r - mean) / std</text>
<rect class="box" x="392" y="146" width="228" height="52" rx="6"/>
<text class="m" x="506" y="168" text-anchor="middle">mean and std over G samples</text>
<text class="m" x="506" y="186" text-anchor="middle">to the SAME prompt</text>
<text class="gr" x="392" y="224" font-weight="700">no value network at all</text>
<text class="m" x="392" y="244">the group IS the baseline</text>
<text class="m" x="24" y="310">Same job: center the reward so the update sees surprise, not raw score.</text>
<text class="m" x="24" y="332">GRPO pays for it in generation (G samples per prompt) instead of in a second network.</text></svg>
