<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="GPT-2: the token arithmetic (no new math; that is the point)"><rect x="22" y="14" width="916" height="320" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Plain next-token log likelihood over WebText. The numbers tell the story.</text><rect x="22.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="134" font-size="27" font-weight="700" fill="#f0b429">524,288</text><text x="38.0" y="156" font-size="12.5" fill="#a8a8a8">tokens per step: 1024 context x 512 batch (~0.5M)</text><rect x="487.0" y="96" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="134" font-size="27" font-weight="700" fill="#f0b429">10B</text><text x="503.0" y="156" font-size="12.5" fill="#a8a8a8">total tokens seen: WebText is 40 GB, seen roughly once</text><rect x="22.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="38.0" y="244" font-size="27" font-weight="700" fill="#f0b429">1 epoch</text><text x="38.0" y="266" font-size="12.5" fill="#a8a8a8">the model saw the data about one time through</text><rect x="487.0" y="206" width="451.0" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="503.0" y="244" font-size="27" font-weight="700" fill="#f0b429">underfit</text><text x="503.0" y="266" font-size="12.5" fill="#a8a8a8">loss was still falling at the end: the seed of the scaling</text><text x="503.0" y="282" font-size="12.5" fill="#a8a8a8">laws</text><rect x="38" y="328" width="884" height="34" rx="8" fill="#141a12" stroke="#2c4a30"/><text x="54" y="350" font-size="13.5" fill="#7fd08a">Conclusion the authors drew: bigger model or more data would keep improving.</text></svg>