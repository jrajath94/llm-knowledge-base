<text x="60.0" y="340.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Burn rate = how fast the budget disappears. Fast window: 1h at 14x burn pages. Slow window: 6h at 2x burn tickets.</text>
