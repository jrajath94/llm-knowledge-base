<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img'>
<title>Unit economics stack</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Cost per successful outcome: the five parts</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Tokens are not outcomes. Price the outcome the customer buys.</text>
<rect x='260' y='288' width='120' height='72' fill='#1565c0' fill-opacity='0.75' stroke='#1565c0' stroke-width='1'/>
<text x='404' y='329.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#ececec' text-anchor='start'>Model: 30%</text>
<rect x='260' y='245' width='120' height='43' fill='#f0b429' fill-opacity='0.75' stroke='#f0b429' stroke-width='1'/>
<text x='404' y='271.4' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#ececec' text-anchor='start'>Infra: 18%</text>
<rect x='260' y='185' width='120' height='60' fill='#2e9e5b' fill-opacity='0.75' stroke='#2e9e5b' stroke-width='1'/>
<text x='404' y='219.8' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#ececec' text-anchor='start'>Human review: 25%</text>
<rect x='260' y='144' width='120' height='41' fill='#c0392b' fill-opacity='0.75' stroke='#c0392b' stroke-width='1'/>
<text x='404' y='169.4' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#ececec' text-anchor='start'>Failure rework: 17%</text>
<rect x='260' y='120' width='120' height='24' fill='#8e24aa' fill-opacity='0.75' stroke='#8e24aa' stroke-width='1'/>
<text x='404' y='137.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#ececec' text-anchor='start'>Amortized build: 10%</text>
<text x='480' y='420' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cost per successful outcome = (model + infra + review + rework + build) / successful outcomes</text>
<text x='480' y='446' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: when a vendor quotes token prices, ask for their measured success rate, then run the model.</text>
</svg>