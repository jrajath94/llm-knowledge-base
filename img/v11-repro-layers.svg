<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Reproducibility has layers; preregistration fixes the story first"><rect x="22" y="14" width="916" height="354" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">REPRODUCIBILITY</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Science vs storytelling: can others check your work, and was the story fixed</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">before the data?</text><rect x="38" y="118" width="239.50554999999997" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="140" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="145" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">1</text><text x="78" y="145" font-size="13.5" font-weight="700" fill="#ececec">Re-runnable</text><text x="54" y="166" font-size="12" fill="#a8a8a8">your code, data, seeds,</text><text x="54" y="182" font-size="12" fill="#a8a8a8">environment are saved: you</text><text x="54" y="198" font-size="12" fill="#a8a8a8">can reproduce it in six</text><text x="54" y="214" font-size="12" fill="#a8a8a8">months</text><line x1="287.50554999999997" y1="174.0" x2="301.50554999999997" y2="174.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="301.50554999999997,169.0 309.50554999999997,174.0 301.50554999999997,179.0" fill="#a8a8a8"/><rect x="317.50554999999997" y="118" width="239.7091" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="337.50554999999997" cy="140" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="337.50554999999997" y="145" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">2</text><text x="357.50554999999997" y="145" font-size="13.5" font-weight="700" fill="#ececec">Replicable</text><text x="333.50554999999997" y="166" font-size="12" fill="#a8a8a8">a colleague runs your code</text><text x="333.50554999999997" y="182" font-size="12" fill="#a8a8a8">and gets the same numbers</text><line x1="567.21465" y1="174.0" x2="581.21465" y2="174.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="581.21465,169.0 589.21465,174.0 581.21465,179.0" fill="#a8a8a8"/><rect x="597.21465" y="118" width="222.62859999999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="617.21465" cy="140" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="617.21465" y="145" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">3</text><text x="637.21465" y="145" font-size="13.5" font-weight="700" fill="#ececec">Robust</text><text x="613.21465" y="166" font-size="12" fill="#a8a8a8">an independent team</text><text x="613.21465" y="182" font-size="12" fill="#a8a8a8">reimplements from your</text><text x="613.21465" y="198" font-size="12" fill="#a8a8a8">description and the effect</text><text x="613.21465" y="214" font-size="12" fill="#a8a8a8">survives</text><rect x="38" y="254" width="226.19957499999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="276" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="281" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">4</text><text x="78" y="281" font-size="13.5" font-weight="700" fill="#ececec">Preregistered</text><text x="54" y="302" font-size="12" fill="#a8a8a8">hypothesis, metric, seeds,</text><text x="54" y="318" font-size="12" fill="#a8a8a8">and analysis plan written</text><text x="54" y="334" font-size="12" fill="#a8a8a8">down before the big run</text></svg>