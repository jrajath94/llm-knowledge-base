<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="100%" style="max-width:660px" role="img" aria-label="GRPO prompt filter: all-correct and all-wrong groups have zero standard deviation and are skipped; only mixed groups train">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Filter GRPO prompts: keep only mixed groups</text>
<text class="m" x="24" y="52">Advantage = (r - mean) / std. If std = 0 the advantage divides by zero.</text>
<rect class="box" x="24" y="76" width="190" height="150" rx="8"/>
<text class="big" x="40" y="102">Group A: [1, 1, 1, 1]</text>
<text class="m" x="40" y="126">all G responses right</text>
<text class="m" x="40" y="146">mean = 1.0, std = 0</text>
<text class="r" x="40" y="176" font-size="14" font-weight="700">SKIP: no signal</text>
<text class="m" x="40" y="198">division by zero</text>
<rect class="box" x="235" y="76" width="190" height="150" rx="8" stroke="#f0b429"/>
<text class="big" x="251" y="102">Group B: [1, 0, 1, 0]</text>
<text class="m" x="251" y="126">mixed success</text>
<text class="m" x="251" y="146">mean = 0.5, std = 0.5</text>
<text class="gr" x="251" y="176" font-size="14" font-weight="700">KEEP: trains</text>
<text class="m" x="251" y="198">advantages +1, -1, +1, -1</text>
<rect class="box" x="446" y="76" width="190" height="150" rx="8"/>
<text class="big" x="462" y="102">Group C: [0, 0, 0, 0]</text>
<text class="m" x="462" y="126">all G responses wrong</text>
<text class="m" x="462" y="146">mean = 0.0, std = 0</text>
<text class="r" x="462" y="176" font-size="14" font-weight="700">SKIP: no signal</text>
<text class="m" x="462" y="198">division by zero</text>
<line class="arr" x1="330" y1="226" x2="330" y2="262"/>
<rect class="box" x="180" y="262" width="300" height="64" rx="8"/>
<text class="big" x="330" y="288" text-anchor="middle">Train only on mixed groups</text>
<text class="m" x="330" y="310" text-anchor="middle">A.1 rule 5: filter always-right and always-wrong prompts</text>
<text class="m" x="24" y="356">Uniform groups carry no relative information. The code guard is std &lt; epsilon: skip.</text></svg>
