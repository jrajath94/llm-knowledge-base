<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="MCP host client server roles">
<rect width="800" height="400" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="400.0" y="28" text-anchor="middle" font-size="18" class="accent">MCP: Host, Client, Server</text>
<rect x="80" y="120" width="180" height="100" class="box" rx="4"/>
<text x="170.0" y="142" text-anchor="middle" font-size="14">Host</text>
<text x="170.0" y="160" text-anchor="middle" font-size="11" class="muted">AI app, holds model</text>
<rect x="310" y="120" width="180" height="100" class="box" rx="4"/>
<text x="400.0" y="142" text-anchor="middle" font-size="14">Client</text>
<text x="400.0" y="160" text-anchor="middle" font-size="11" class="muted">speaks MCP protocol</text>
<rect x="540" y="120" width="180" height="100" class="box" rx="4"/>
<text x="630.0" y="142" text-anchor="middle" font-size="14">Server</text>
<text x="630.0" y="160" text-anchor="middle" font-size="11" class="muted">your program</text>
<line x1="260" y1="170" x2="310" y2="170" class="line"/>
<line x1="490" y1="170" x2="540" y2="170" class="line"/>
<text x="400" y="280" text-anchor="middle" font-size="13">Tools: model-controlled | Resources: app-controlled | Prompts: user-controlled</text>
<text x="400" y="310" text-anchor="middle" font-size="12" class="muted">stdio (local) or Streamable HTTP (hosted) | JSON-RPC 2.0</text>
</svg>