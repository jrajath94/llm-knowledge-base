<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 315" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Five rules for figures that explain instead of decorate"><rect x="22" y="14" width="916" height="287" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">FIGURES</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Most readers look at your figures first, and many look at nothing else</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">The title states the message:</text><text x="307.87578125000005" y="94" font-size="13.5" fill="#a8a8a8">&quot;Gating helps on long contexts,&quot; not &quot;Results.&quot; Learn the conclusion from</text><text x="80" y="113" font-size="13.5" fill="#a8a8a8">the title alone.</text><path d="M 53.7 139.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="144" font-size="13.5" font-weight="700" fill="#ececec">Axes carry meaning and units:</text><text x="317.036796875" y="144" font-size="13.5" fill="#a8a8a8">&quot;Context length (tokens),&quot; not &quot;x.&quot; An unlabeled axis cannot be</text><text x="80" y="163" font-size="13.5" fill="#a8a8a8">checked.</text><path d="M 53.7 189.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="194" font-size="13.5" font-weight="700" fill="#ececec">One message per figure:</text><text x="272.23578125" y="194" font-size="13.5" fill="#a8a8a8">show the comparison, not the raw numbers: the delta, the two lines, the</text><text x="80" y="213" font-size="13.5" fill="#a8a8a8">before and after.</text><path d="M 53.7 239.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="244" font-size="13.5" font-weight="700" fill="#ececec">Annotate the point:</text><text x="234.46109375" y="244" font-size="13.5" fill="#a8a8a8">an arrow and six words (&quot;gap opens past 8k&quot;) tell the reader where to look.</text><path d="M 53.7 270.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="275" font-size="13.5" font-weight="700" fill="#ececec">Show uncertainty:</text><text x="223.9690625" y="275" font-size="13.5" fill="#a8a8a8">error bars or intervals on every measured number, or the figure is a claim without</text><text x="80" y="294" font-size="13.5" fill="#a8a8a8">evidence.</text></svg>