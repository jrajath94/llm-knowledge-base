<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Smoke vs full eval: fast signal, then the real measurement</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">smoke tells you in minutes; the full eval tells you the truth</text>
<rect x="24" y="110" width="400" height="170" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SMOKE (minutes)</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">20 known attacks, runs on every commit; catches</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">regressions and broken harnesses, proves nothing about</text>
<text x="224.0" y="184" font-size="11" fill="#a8a8a8" text-anchor="middle">safety</text>
<rect x="456" y="110" width="400" height="170" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">FULL (hours)</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the whole golden set plus fresh red-teaming; the</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">number that goes in the report and in front of the</text>
<text x="656.0" y="184" font-size="11" fill="#a8a8a8" text-anchor="middle">gate</text>
<line x1="424" y1="195" x2="456" y2="195" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="456,195 447.78219953718923,198.66984407753614 447.78219953718923,191.33015592246386" fill="#8a8a8a"/>
<text x="24" y="330" font-size="12" fill="#a8a8a8" text-anchor="start">The failure mode is running only the smoke eval and calling it a safety case. Smoke is a tripwire, not a</text>
<text x="24" y="348" font-size="12" fill="#a8a8a8" text-anchor="start">verdict.</text>
<text x="24" y="380" font-size="12" fill="#a8a8a8" text-anchor="start">Rule: smoke on every commit, full eval on every release candidate, fresh red-team items every quarter.</text>
</svg>