<svg xmlns="http://www.w3.org/2000/svg" width="560" height="290" viewBox="0 0 560 290">
<rect width="560" height="290" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Backoff spreads attempts; jitter breaks the lockstep</text><circle cx='80' cy='120' r='7' fill='#f0b429'/><text x='80' y='155' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='middle'>1s</text><circle cx='180' cy='120' r='7' fill='#f0b429'/><text x='180' y='155' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='middle'>2s</text><circle cx='340' cy='120' r='7' fill='#f0b429'/><text x='340' y='155' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='middle'>4s</text><text x='80' y='190' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#e57ea6' text-anchor='start'>no jitter: 1,000 clients retry in the same millisecond</text><text x='80' y='212' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#7bc98a' text-anchor='start'>jitter: random draw in [0, computed] spreads them</text><text x='20' y='260' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Cap the wait (say 8 or 30 s). Missing jitter = retry thundering herd.</text></svg>