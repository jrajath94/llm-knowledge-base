<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 365' width='100%' role='img'><rect x='0' y='0' width='960' height='365' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>SwiGLU: the gated MLP in modern models</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>One input, two projections, a gate, then down. SiLU(z) = z / (1 + e^-z): small values shrink, large values pass.</text><rect x='60' y='150' width='150' height='56' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='76' y='174' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>x</text><text x='76' y='194' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='start'>[B, S, d]</text><line x1='210' y1='178' x2='255' y2='178' stroke='#1565c0' stroke-width='3'/><polygon points='255,178 248,170 248,186' fill='#1565c0'/><rect x='260' y='110' width='175' height='56' rx='8' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><text x='276' y='134' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>W_gate x</text><text x='276' y='154' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='start'>gate branch</text><rect x='260' y='200' width='175' height='56' rx='8' fill='#0d0d0d' stroke='#9a7bd0' stroke-width='2'/><text x='276' y='224' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>W_up x</text><text x='276' y='244' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='start'>value branch</text><line x1='435' y1='138' x2='470' y2='138' stroke='#4db6ac' stroke-width='2.5'/><polygon points='470,138 463,130 463,146' fill='#4db6ac'/><rect x='474' y='122' width='62' height='32' rx='6' fill='#0d0d0d' stroke='#4db6ac' stroke-width='1.5'/><text x='505' y='143' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#4db6ac' text-anchor='middle'>SiLU</text><line x1='536' y1='138' x2='610' y2='138' stroke='#4db6ac' stroke-width='2.5'/><polygon points='610,138 603,130 603,146' fill='#4db6ac'/><line x1='610' y1='138' x2='610' y2='166' stroke='#4db6ac' stroke-width='2.5'/><polygon points='610,166 604,157 616,157' fill='#4db6ac'/><line x1='435' y1='228' x2='582' y2='222' stroke='#9a7bd0' stroke-width='2.5'/><polygon points='582,222 575,214 575,230' fill='#9a7bd0'/><circle cx='610' cy='195' r='26' fill='#0d0d0d' stroke='#f0b429' stroke-width='2.5'/><text x='610' y='203' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#f0b429' text-anchor='middle'>x</text><text x='610' y='245' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='middle'>elementwise multiply</text><line x1='636' y1='195' x2='680' y2='195' stroke='#f0b429' stroke-width='3'/><polygon points='680,195 673,187 673,203' fill='#f0b429'/><rect x='685' y='167' width='180' height='56' rx='8' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='701' y='191' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start'>W_down</text><text x='701' y='211' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#a8a8a8' text-anchor='start'>back to [B, S, d]</text><text x='480' y='310' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>The gate decides, per element, how much of the value branch survives.</text><text x='480' y='334' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>Two matrix multiplies up, one down: about 3x the params of the old MLP, better quality per param.</text></svg>