<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img" aria-label="Pareto frontier: safety versus capability">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="280" y="36" text-anchor="middle" class="t">Pareto frontier: safety vs capability</text>
<text x="280" y="58" text-anchor="middle" class="xs">Every release moves the point. Say where it moved and what it cost.</text>
<rect x="80" y="90" width="400" height="190" fill="none" stroke="#a8a8a8" />
<text x="280.0" y="304" text-anchor="middle" class="xs">safety</text>
<text x="66" y="185.0" text-anchor="middle" class="xs" transform="rotate(-90,66,185.0)">capability</text>
<path d="M80,128 L93,143 L107,156 L120,168 L133,178 L147,188 L160,196 L173,204 L187,210 L200,216 L213,222 L227,227 L240,231 L253,235 L267,238 L280,242 L293,244 L307,247 L320,249 L333,251 L347,253 L360,254 L373,256 L387,257 L400,258 L413,259 L427,260 L440,261 L453,262 L467,262 L480,263" fill="none" stroke="#ececec" stroke-width="2.5" />
<text x="472" y="124" text-anchor="end" class="xs">frontier: best known tradeoffs</text>
<circle cx="200" cy="240" r="7" fill="#6cb2ff" /><text x="200" y="260" text-anchor="middle" class="xs">current model</text>
<circle cx="380" cy="186" r="7" fill="#7fc97f" /><text x="380" y="206" text-anchor="middle" class="xs">after refusal tuning</text>
<circle cx="460" cy="260" r="7" fill="#e57373" /><text x="448" y="240" text-anchor="end" class="xs">over-mitigated:</text><text x="448" y="252" text-anchor="end" class="xs">safe but useless</text>
<text x="280" y="322" text-anchor="middle" class="xs">The top-right corner (perfect at both) does not exist.</text>
</svg>