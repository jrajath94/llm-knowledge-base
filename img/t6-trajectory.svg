<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img'>
<title>Trajectory analysis</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Trajectory analysis: reading one run well</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Each step has the same anatomy: prompt in, thought + action, tool call, observation, timing.</text>
<line x1='60' y1='200' x2='900' y2='200' stroke='#8a8a8a' stroke-width='2'/>
<circle cx='100' cy='200' r='16' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/>
<text x='100' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>1</text>
<circle cx='200' cy='200' r='16' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/>
<text x='200' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>2</text>
<circle cx='300' cy='200' r='16' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/>
<text x='300' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>3</text>
<circle cx='400' cy='200' r='16' fill='#c0392b' fill-opacity='0.30' stroke='#c0392b' stroke-width='2'/>
<text x='400' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>4</text>
<circle cx='500' cy='200' r='16' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/>
<text x='500' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>5</text>
<circle cx='600' cy='200' r='16' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/>
<text x='600' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>6</text>
<circle cx='700' cy='200' r='16' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/>
<text x='700' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>7</text>
<circle cx='800' cy='200' r='16' fill='#f0b429' fill-opacity='0.30' stroke='#f0b429' stroke-width='2'/>
<text x='800' y='205' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>8</text>
<text x='400' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#c0392b' text-anchor='middle'>step 4: the bad assumption</text>
<text x='400' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>where the run stopped being recoverable</text>
<text x='700' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#f0b429' text-anchor='middle'>step 8: where it failed</text>
<text x='700' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>symptom, not cause</text>
<text x='480' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The five questions, in order: where did it first go wrong? plan, action, or observation at fault?</text>
<text x='480' y='348' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Was it recoverable? What signal was missing? What changes for the next run?</text>
<text x='480' y='410' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The one takeaway: debug the first wrong step, not the last failed one.</text>
</svg>