<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 282" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Where the inference dollar goes (illustrative shares)"><rect x="22" y="14" width="916" height="254" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">UNIT ECONOMICS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The per-token price is only half the bill</text><text x="38" y="117" font-size="13.5" fill="#ececec">GPU compute</text><rect x="247.79206875" y="102" width="524.20793125" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="247.79206875" y="102" width="262.103965625" height="16" rx="4" fill="#6cb2ff"/><text x="782.0" y="117" font-size="13" font-weight="700" fill="#6cb2ff">~50%</text><text x="38" y="151" font-size="13.5" fill="#ececec">People: on-call, evals</text><rect x="247.79206875" y="136" width="524.20793125" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="247.79206875" y="136" width="104.84158625" height="16" rx="4" fill="#f0b429"/><text x="782.0" y="151" font-size="13" font-weight="700" fill="#f0b429">~20%</text><text x="38" y="185" font-size="13.5" fill="#ececec">KV-cache memory</text><rect x="247.79206875" y="170" width="524.20793125" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="247.79206875" y="170" width="78.6311896875" height="16" rx="4" fill="#7fd08a"/><text x="782.0" y="185" font-size="13" font-weight="700" fill="#7fd08a">~15%</text><text x="38" y="219" font-size="13.5" fill="#ececec">Network, egress, storage</text><rect x="247.79206875" y="204" width="524.20793125" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="247.79206875" y="204" width="52.420793125" height="16" rx="4" fill="#a8a8a8"/><text x="782.0" y="219" font-size="13" font-weight="700" fill="#a8a8a8">~10%</text><text x="38" y="253" font-size="13.5" fill="#ececec">Incident damage</text><rect x="247.79206875" y="238" width="524.20793125" height="16" rx="4" fill="#0d0d0d" stroke="#2e2e2e"/><rect x="247.79206875" y="238" width="26.2103965625" height="16" rx="4" fill="#e07878"/><text x="782.0" y="253" font-size="13" font-weight="700" fill="#e07878">~5%</text><text x="38" y="282" font-size="12.5" fill="#a8a8a8">A 10% cheaper GPU that doubles incident load is a bad trade. Optimize the task, not the token.</text></svg>