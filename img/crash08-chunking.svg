<text x="440.0" y="326" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE RULES</text>
<text x="440.0" y="344" font-size="11" fill="#a8a8a8" text-anchor="middle">split on structure (paragraphs, then sentences), never mid-sentence; overlap 10-15% so boundaries do not eat</text>
<text x="440.0" y="359" font-size="11" fill="#a8a8a8" text-anchor="middle">meaning; ~512 tokens per chunk</text>
<text x="24" y="470" font-size="12" fill="#a8a8a8" text-anchor="start">Chunking is where RAG is won or lost: the retriever can only return what the chunker preserved.</text>
