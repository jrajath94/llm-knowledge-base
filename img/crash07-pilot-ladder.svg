<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.2. The pilot-to-production ladder</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">each rung has an exit criterion, not just a demo</text>
<rect x="24" y="130" width="196" height="130" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="122.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SHADOW</text>
<text x="122.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">runs alongside humans,</text>
<text x="122.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">touches nothing</text>
<line x1="220" y1="195" x2="256" y2="195" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="256,195 247.78219953718923,198.66984407753614 247.78219953718923,191.33015592246386" fill="#8a8a8a"/>
<rect x="256" y="130" width="196" height="130" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="354.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">PILOT</text>
<text x="354.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">one team, narrow scope,</text>
<text x="354.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">kill criteria signed</text>
<line x1="452" y1="195" x2="488" y2="195" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="488,195 479.78219953718923,198.66984407753614 479.78219953718923,191.33015592246386" fill="#8a8a8a"/>
<rect x="488" y="130" width="196" height="130" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="586.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">EXPAND</text>
<text x="586.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">more teams, measured SLOs,</text>
<text x="586.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">cost ledger live</text>
<line x1="684" y1="195" x2="720" y2="195" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="720,195 711.7821995371892,198.66984407753614 711.7821995371892,191.33015592246386" fill="#8a8a8a"/>
<rect x="720" y="130" width="196" height="130" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="818.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">PRODUCTION</text>
<text x="818.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">full rollout, on-call,</text>
<text x="818.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">error budgets</text>
<rect x="24" y="320" width="832" height="100" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="346" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE RULE</text>
<text x="440.0" y="364" font-size="11" fill="#a8a8a8" text-anchor="middle">no rung without an exit criterion: the pilot ends on a date with a number, not on a feeling</text>
<text x="24" y="470" font-size="12" fill="#a8a8a8" text-anchor="start">Most &quot;production&quot; agents are pilots that never got an exit criterion. The ladder makes promotion a decision.</text>
</svg>