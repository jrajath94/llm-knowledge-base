<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The calibration loop: graders drift, so re-grade on a schedule</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">a judge you never re-check is a rumor, not a measurement</text>
<rect x="24" y="130" width="186" height="120" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="117.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">GRADE</text>
<text x="117.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">model judges the batch</text>
<line x1="210" y1="190" x2="242" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="242,190 233.78219953718923,193.66984407753614 233.78219953718923,186.33015592246386" fill="#8a8a8a"/>
<rect x="242" y="130" width="186" height="120" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="335.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SAMPLE</text>
<text x="335.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">50 items / month</text>
<text x="335.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">re-graded by humans</text>
<line x1="428" y1="190" x2="460" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="460,190 451.78219953718923,193.66984407753614 451.78219953718923,186.33015592246386" fill="#8a8a8a"/>
<rect x="460" y="130" width="186" height="120" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="553.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">COMPARE</text>
<text x="553.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">agreement vs the 0.7 bar</text>
<line x1="646" y1="190" x2="678" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="678,190 669.7821995371892,193.66984407753614 669.7821995371892,186.33015592246386" fill="#8a8a8a"/>
<rect x="678" y="130" width="186" height="120" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="771.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">RECALIBRATE</text>
<text x="771.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">fix rubric or prompts;</text>
<text x="771.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">re-run</text>
<line x1="872" y1="250" x2="872" y2="400" stroke="#7dd87d" stroke-width="2"/>
<polygon points="872,400 868.3301559224639,391.78219953718923 875.6698440775361,391.78219953718923" fill="#7dd87d"/>
<line x1="872" y1="400" x2="60" y2="400" stroke="#7dd87d" stroke-width="2"/>
<polygon points="60,400 68.21780046281077,396.33015592246386 68.21780046281077,403.66984407753614" fill="#7dd87d"/>
<line x1="60" y1="400" x2="60" y2="250" stroke="#7dd87d" stroke-width="2"/>
<polygon points="60,250 63.66984407753613,258.21780046281077 56.33015592246387,258.21780046281077" fill="#7dd87d"/>
<text x="760" y="424" font-size="11" fill="#7dd87d" text-anchor="middle">loop closes monthly</text>
<text x="24" y="500" font-size="12" fill="#a8a8a8" text-anchor="start">Recalibrate on a schedule AND after any big change: new model version, new rubric, new attack family. Drift is</text>
<text x="24" y="517" font-size="12" fill="#a8a8a8" text-anchor="start">silent; the loop makes it loud.</text>
</svg>