<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The stale-feature trap: a timeline of one bad day"><rect x="22" y="14" width="916" height="332" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">WORKED EXAMPLE</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">&quot;Purchases in the last 7 days&quot;, computed by a daily batch at midnight</text><rect x="38" y="96" width="208.14999999999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="58" y="123" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">00:00 midnight</text><text x="54" y="144" font-size="12" fill="#a8a8a8">batch job computes the</text><text x="54" y="160" font-size="12" fill="#a8a8a8">feature from yesterday</text><line x1="256.15" y1="152.0" x2="270.15" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="270.15,147.0 278.15,152.0 270.15,157.0" fill="#a8a8a8"/><rect x="286.15" y="96" width="219.89394999999996" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="306.15" cy="118" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="306.15" y="123" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">2</text><text x="326.15" y="123" font-size="13.5" font-weight="700" fill="#ececec">12:00 noon</text><text x="302.15" y="144" font-size="12" fill="#a8a8a8">flash sale starts; the user</text><text x="302.15" y="160" font-size="12" fill="#a8a8a8">buys five items</text><line x1="516.04395" y1="152.0" x2="530.04395" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="530.04395,147.0 538.04395,152.0 530.04395,157.0" fill="#a8a8a8"/><rect x="546.04395" y="96" width="224.7703" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="566.04395" cy="118" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="566.04395" y="123" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">3</text><text x="586.04395" y="123" font-size="13.5" font-weight="700" fill="#ececec">15:00</text><text x="562.04395" y="144" font-size="12" fill="#a8a8a8">feature is 15 hours stale;</text><text x="562.04395" y="160" font-size="12" fill="#a8a8a8">model recommends items</text><text x="562.04395" y="176" font-size="12" fill="#a8a8a8">already bought</text><rect x="38" y="232" width="231.86136249999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="254" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="58" y="259" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">4</text><text x="78" y="259" font-size="13.5" font-weight="700" fill="#ececec">worst case</text><text x="54" y="280" font-size="12" fill="#a8a8a8">up to 39 hours stale: event</text><text x="54" y="296" font-size="12" fill="#a8a8a8">just after midnight to</text><text x="54" y="312" font-size="12" fill="#a8a8a8">next-next midnight plus</text><text x="54" y="328" font-size="12" fill="#a8a8a8">serving lag</text></svg>