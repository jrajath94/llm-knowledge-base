<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="'Charis SIL',Georgia,serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" /></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Whiteboard Explanation Flow</text>
<rect x="50" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="125.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Draw</text>
<text x="125.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Boxes first</text>
<rect x="250" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="325.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Label</text>
<text x="325.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Names + arrows</text>
<rect x="450" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="525.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Walk</text>
<text x="525.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Trace a request</text>
<rect x="650" y="100" width="100" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="700.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Q&amp;A</text>
<text x="700.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Defend</text>
<line x1="200" y1="135" x2="250" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="400" y1="135" x2="450" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="600" y1="135" x2="650" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="400" y="220" text-anchor="middle" font-size="12" fill="#a8a8a8">Design the figure before you write the paper. The figure is the argument.</text>
</svg>