<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<defs><marker id="ah8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f0b429"/></marker>
<marker id="ah9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7dd87d"/></marker></defs>
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The 3D mesh on 8 GPUs: tp=2, pp=2, dp=2</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Tensor inside the node (NVLink), pipeline across nodes, data outermost.</text>
<rect x="30" y="90" width="400" height="230" fill="#101418" stroke="#6cb2ff" stroke-width="2" rx="8"/>
<text x="50" y="116" font-size="13" font-weight="bold" fill="#6cb2ff">Node 0: pipeline stage 0</text>
<rect x="450" y="90" width="400" height="230" fill="#101418" stroke="#6cb2ff" stroke-width="2" rx="8"/>
<text x="470" y="116" font-size="13" font-weight="bold" fill="#6cb2ff">Node 1: pipeline stage 1</text>
<rect x="55" y="130" width="170" height="86" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="6"/>
<text x="140" y="156" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">stage 0, dp replica 0</text>
<text x="140" y="178" font-size="12" fill="#8a8a8a" text-anchor="middle">GPU 0, GPU 1</text>
<text x="140" y="198" font-size="11" fill="#6cb2ff" text-anchor="middle">tp=2 over NVLink</text>
<rect x="235" y="130" width="170" height="86" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="6"/>
<text x="320" y="156" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">stage 0, dp replica 1</text>
<text x="320" y="178" font-size="12" fill="#8a8a8a" text-anchor="middle">GPU 2, GPU 3</text>
<text x="320" y="198" font-size="11" fill="#6cb2ff" text-anchor="middle">tp=2 over NVLink</text>
<rect x="475" y="130" width="170" height="86" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="6"/>
<text x="560" y="156" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">stage 1, dp replica 0</text>
<text x="560" y="178" font-size="12" fill="#8a8a8a" text-anchor="middle">GPU 4, GPU 5</text>
<text x="560" y="198" font-size="11" fill="#6cb2ff" text-anchor="middle">tp=2 over NVLink</text>
<rect x="655" y="130" width="170" height="86" fill="#141414" stroke="#6cb2ff" stroke-width="2" rx="6"/>
<text x="740" y="156" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">stage 1, dp replica 1</text>
<text x="740" y="178" font-size="12" fill="#8a8a8a" text-anchor="middle">GPU 6, GPU 7</text>
<text x="740" y="198" font-size="11" fill="#6cb2ff" text-anchor="middle">tp=2 over NVLink</text>
<line x1="430" y1="155" x2="450" y2="155" stroke="#f0b429" stroke-width="2.5" marker-end="url(#ah8)"/>
<line x1="430" y1="195" x2="450" y2="195" stroke="#f0b429" stroke-width="2.5" marker-end="url(#ah8)"/>
<line x1="140" y1="232" x2="320" y2="232" stroke="#7dd87d" stroke-width="2" marker-end="url(#ah9)"/>
<line x1="320" y1="244" x2="140" y2="244" stroke="#7dd87d" stroke-width="2" marker-end="url(#ah9)"/>
<line x1="560" y1="232" x2="740" y2="232" stroke="#7dd87d" stroke-width="2" marker-end="url(#ah9)"/>
<line x1="740" y1="244" x2="560" y2="244" stroke="#7dd87d" stroke-width="2" marker-end="url(#ah9)"/>
<text x="230" y="268" font-size="11" fill="#7dd87d" text-anchor="middle">dp: gradient all-reduce</text>
<text x="650" y="268" font-size="11" fill="#7dd87d" text-anchor="middle">dp: gradient all-reduce</text>
<text x="30" y="360" font-size="13" fill="#ececec">Pipeline crosses nodes because only activations move between stages.</text>
<text x="30" y="384" font-size="13" fill="#ececec">Data parallelism sits outermost: each stage's two replicas all-reduce gradients once per step.</text>
<rect x="30" y="404" width="16" height="12" fill="none" stroke="#f0b429" stroke-width="2"/><text x="52" y="415" font-size="12" fill="#ececec">pipeline (activations cross)</text>
<rect x="300" y="404" width="16" height="12" fill="none" stroke="#7dd87d" stroke-width="2"/><text x="322" y="415" font-size="12" fill="#ececec">data parallel (gradients all-reduced)</text>
<text x="24" y="470" font-size="13" fill="#f0b429">Rule of thumb: tp on the fast link, pp where only activations cross, dp outermost.</text>
</svg>