<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="800" height="520" fill="#0d0d0d"/>
<text x="400" y="36" text-anchor="middle" fill="#ececec" font-size="22" font-weight="700">QLoRA memory: what each method stores for 7B</text>
<text x="400" y="60" text-anchor="middle" fill="#a8a8a8" font-size="14">Weights plus optimizer state. Activations extra.</text>
<!-- Full fine-tuning bar -->
<text x="180" y="110" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">Full fine-tune</text>
<text x="180" y="132" text-anchor="middle" fill="#e08080" font-size="15" font-weight="700">84 GB</text>
<rect x="110" y="150" width="140" height="60" fill="#e08080" opacity="0.5"/>
<text x="180" y="186" text-anchor="middle" fill="#0d0d0d" font-size="12">weights 14 GB</text>
<rect x="110" y="210" width="140" height="60" fill="#e08080" opacity="0.35"/>
<text x="180" y="246" text-anchor="middle" fill="#0d0d0d" font-size="12">grads 14 GB</text>
<rect x="110" y="270" width="140" height="150" fill="#e08080" opacity="0.22"/>
<text x="180" y="345" text-anchor="middle" fill="#ececec" font-size="12">optimizer 56 GB</text>
<text x="180" y="445" text-anchor="middle" fill="#a8a8a8" font-size="12">needs 80 GB card</text>
<!-- LoRA bar -->
<text x="400" y="110" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">LoRA</text>
<text x="400" y="132" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="700">14.5 GB</text>
<rect x="330" y="150" width="140" height="210" fill="#f0b429" opacity="0.4"/>
<text x="400" y="258" text-anchor="middle" fill="#0d0d0d" font-size="12">frozen base 14 GB</text>
<rect x="330" y="360" width="140" height="40" fill="#6cb2ff" opacity="0.5"/>
<text x="400" y="384" text-anchor="middle" fill="#0d0d0d" font-size="12">adapters 0.5 GB</text>
<text x="400" y="445" text-anchor="middle" fill="#a8a8a8" font-size="12">fits 24 GB card</text>
<!-- QLoRA bar -->
<text x="620" y="110" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">QLoRA</text>
<text x="620" y="132" text-anchor="middle" fill="#7fd08a" font-size="15" font-weight="700">4 GB</text>
<rect x="550" y="150" width="140" height="180" fill="#7fd08a" opacity="0.4"/>
<text x="620" y="244" text-anchor="middle" fill="#0d0d0d" font-size="12">4-bit base 3.5 GB</text>
<rect x="550" y="330" width="140" height="40" fill="#6cb2ff" opacity="0.5"/>
<text x="620" y="354" text-anchor="middle" fill="#0d0d0d" font-size="12">adapters 0.5 GB</text>
<text x="620" y="445" text-anchor="middle" fill="#a8a8a8" font-size="12">fits 16 GB card</text>
<!-- takeaway -->
<text x="400" y="490" text-anchor="middle" fill="#ececec" font-size="14">The optimizer states are the hidden giant. LoRA deletes them. QLoRA shrinks the base.</text>
</svg>
