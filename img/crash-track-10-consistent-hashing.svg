<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
<rect width="600" height="260" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Consistent hashing: only K/n keys move</text><circle cx='200' cy='150' r='80' fill='none' stroke='#9a9a9a' stroke-width='2'/><circle cx='200' cy='70' r='12' fill='#f0b429'/><text x='200.0' y='74.0' font-family='Charis SIL, Georgia, serif' font-size='10' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>N1</text><circle cx='280' cy='150' r='12' fill='#f0b429'/><text x='280.0' y='154.0' font-family='Charis SIL, Georgia, serif' font-size='10' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>N2</text><circle cx='200' cy='230' r='12' fill='#f0b429'/><text x='200.0' y='234.0' font-family='Charis SIL, Georgia, serif' font-size='10' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>N3</text><circle cx='120' cy='150' r='12' fill='#f0b429'/><text x='120.0' y='154.0' font-family='Charis SIL, Georgia, serif' font-size='10' fill='#0d0d0d' text-anchor='middle' font-weight='bold'>N4</text><text x='330' y='110' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>1M keys, 10 nodes, remove 1:</text><text x='330' y='140' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='start'>naive mod-10: ~all keys move</text><text x='330' y='165' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>consistent hash: ~100k move</text><text x='330' y='200' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>virtual nodes smooth the load</text></svg>