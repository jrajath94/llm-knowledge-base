<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330">
<rect width="520" height="330" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Ship the knee, not the top-right</text><line x1='70' y1='230' x2='70' y2='70' stroke='#9a9a9a'/><line x1='70' y1='230' x2='480' y2='230' stroke='#9a9a9a'/><text x='30' y='150' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='start'>accuracy</text><text x='400' y='255' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='start'>cost</text><polyline points='120,200 200,160 300,140 420,132' fill='none' stroke='#7bc98a' stroke-width='3'/><circle cx='120' cy='200' r='6' fill='#7bc98a'/><circle cx='200' cy='160' r='6' fill='#7bc98a'/><circle cx='300' cy='140' r='6' fill='#7bc98a'/><circle cx='420' cy='132' r='6' fill='#7bc98a'/><circle cx='200' cy='160' r='10' fill='none' stroke='#f0b429' stroke-width='3'/><text x='200' y='120' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#f0b429' text-anchor='middle' font-weight='bold'>the knee</text><circle cx='300' cy='190' r='5' fill='#e57ea6'/><text x='300' y='212' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>dominated: cheaper is also better</text><text x='20' y='300' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>4x training cost for 1.7 points is usually the wrong trade.</text></svg>