<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.9. The rollout ladder</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Each rung has an exit criterion. The rollback is armed before the canary.</text>
<rect x="60" y="100" width="220" height="120" fill="#1c1c1c" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="170" y="140" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">Shadow</text>
<text x="170" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">observes, serves nothing</text>
<line x1="285" y1="160" x2="335" y2="160" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="335,154 335,166 345,160" fill="#8a8a8a"/>
<rect x="340" y="100" width="220" height="120" fill="#1c1c1c" stroke="#f0b429" stroke-width="1.5" rx="6"/>
<text x="450" y="140" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">Canary</text>
<text x="450" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">small live fraction vs control</text>
<line x1="565" y1="160" x2="615" y2="160" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="615,154 615,166 625,160" fill="#8a8a8a"/>
<rect x="620" y="100" width="220" height="120" fill="#1c1c1c" stroke="#7aa2f7" stroke-width="1.5" rx="6"/>
<text x="730" y="140" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">Full</text>
<text x="730" y="175" font-size="12" fill="#8a8a8a" text-anchor="middle">staged 25 / 50 / 100%</text>
<rect x="24" y="280" width="832" height="70" fill="#141414" stroke="#7bc98a" stroke-width="1.5" rx="6"/>
<text x="440" y="310" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Rollback target: previous version restorable in under 15 minutes.</text>
<text x="440" y="334" font-size="12" fill="#8a8a8a" text-anchor="middle">Arm and test the rollback before the canary starts, not during the incident.</text>
</svg>
