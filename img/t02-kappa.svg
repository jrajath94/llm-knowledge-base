<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 406" width="100%" style="max-width:700px" role="img" aria-label="Two-by-two judge vs human table; observed 0.75, chance 0.60, kappa 0.375">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="406" fill="none"/>
<text class="t" x="24" y="30">Cohen's kappa: agreement beyond chance, worked</text>
<text class="big g" x="214" y="84" text-anchor="middle">human: yes</text>
<text class="big g" x="404" y="84" text-anchor="middle">human: no</text>
<rect x="119" y="104" width="180" height="56" rx="6" fill="#1a2b1a" stroke="#3a3a3a"/>
<text class="big" x="135" y="130">60</text>
<text class="m" x="135" y="149">a: both yes</text>
<rect x="309" y="104" width="180" height="56" rx="6" fill="#2b1a1a" stroke="#3a3a3a"/>
<text class="big" x="325" y="130">15</text>
<text class="m" x="325" y="149">b: judge yes, human no</text>
<rect x="119" y="164" width="180" height="56" rx="6" fill="#2b1a1a" stroke="#3a3a3a"/>
<text class="big" x="135" y="190">10</text>
<text class="m" x="135" y="209">c: judge no, human yes</text>
<rect x="309" y="164" width="180" height="56" rx="6" fill="#1a2b1a" stroke="#3a3a3a"/>
<text class="big" x="325" y="190">15</text>
<text class="m" x="325" y="209">d: both no</text>
<text class="big g" x="44" y="132" text-anchor="middle">judge:</text>
<text class="big g" x="44" y="158" text-anchor="middle">yes</text>
<text class="big g" x="44" y="192" text-anchor="middle">no</text>
<text class="num" x="24" y="262">p_o = (60+15)/100 = 0.75</text>
<text class="num" x="24" y="288">p_e = 0.75x0.70 + 0.25x0.30 = 0.60</text>
<text class="big" x="24" y="314">k = (0.75-0.60)/(1-0.60) = 0.375</text>
<text class="num" x="24" y="356">Raw agreement says 75%. Kappa says 0.375: a judge at 0.375 must not decide anything important.</text>
<text class="m" x="24" y="382">Kappa subtracts the luck: two raters who both say yes 80% of the time agree 68% by pure chance.</text>
</svg>
