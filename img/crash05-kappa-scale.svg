<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="480" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Inter-rater agreement: kappa turns &quot;we agree&quot; into a number</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">two graders, one rubric, one statistic</text>
<rect x="90" y="110" width="620" height="200" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<line x1="462.0" y1="110" x2="462.0" y2="310" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="462.0" y="332" font-size="12" fill="#f0b429" text-anchor="middle">0.6 warn</text>
<line x1="524.0" y1="110" x2="524.0" y2="310" stroke="#7dd87d" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="524.0" y="332" font-size="12" fill="#7dd87d" text-anchor="middle">0.7 ship</text>
<line x1="586.0" y1="110" x2="586.0" y2="310" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="586.0" y="332" font-size="12" fill="#b388ff" text-anchor="middle">0.8 human ceiling</text>
<rect x="90" y="160.0" width="372.0" height="100.0" fill="#e57ea6" rx="4" opacity="0.25"/>
<rect x="462.0" y="160.0" width="62.0" height="100.0" fill="#f0b429" rx="4" opacity="0.25"/>
<rect x="524.0" y="160.0" width="186.0" height="100.0" fill="#7dd87d" rx="4" opacity="0.25"/>
<text x="98" y="214.0" font-size="11" fill="#e57ea6" text-anchor="start">rework the rubric</text>
<text x="493.0" y="214.0" font-size="11" fill="#f0b429" text-anchor="middle">borderline</text>
<text x="617.0" y="214.0" font-size="11" fill="#7dd87d" text-anchor="middle">ship it</text>
<text x="24" y="380" font-size="12" fill="#a8a8a8" text-anchor="start">Kappa below 0.6 means the graders disagree enough that the labels are noise: fix the rubric, not the graders.</text>
<text x="24" y="398" font-size="12" fill="#a8a8a8" text-anchor="start">At or above 0.7 the labels are trustworthy. Human ceiling sits near 0.8, so do not chase 0.95; you will never</text>
<text x="24" y="416" font-size="12" fill="#a8a8a8" text-anchor="start">get there.</text>
<text x="24" y="440" font-size="12" fill="#a8a8a8" text-anchor="start">Rule of thumb: kappa &gt;= 0.7 ships, kappa &lt; 0.6 sends the batch back for rubric repair.</text>
</svg>