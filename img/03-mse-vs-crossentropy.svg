<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='100%' role='img'><rect x='0' y='0' width='960' height='430' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Two kinds of answers need two kinds of loss</text><text x='240' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>Regression: predict a number</text><line x1='90' y1='330' x2='390' y2='330' stroke='#3a3a3a' stroke-width='2'/><line x1='90' y1='330' x2='90' y2='120' stroke='#3a3a3a' stroke-width='2'/><line x1='90' y1='290' x2='390' y2='140' stroke='#6cb2ff' stroke-width='3'/><rect x='130' y='270.0' width='30.0' height='30.0' fill='#e57ea6' opacity='0.35' stroke='#e57ea6' stroke-width='1'/><circle cx='130' cy='300' r='6' fill='#ececec'/><rect x='200' y='235.0' width='15.0' height='15.0' fill='#e57ea6' opacity='0.35' stroke='#e57ea6' stroke-width='1'/><circle cx='200' cy='250' r='6' fill='#ececec'/><rect x='270' y='200.0' width='35.0' height='35.0' fill='#e57ea6' opacity='0.35' stroke='#e57ea6' stroke-width='1'/><circle cx='270' cy='235' r='6' fill='#ececec'/><rect x='340' y='165.0' width='25.0' height='25.0' fill='#e57ea6' opacity='0.35' stroke='#e57ea6' stroke-width='1'/><circle cx='340' cy='190' r='6' fill='#ececec'/><text x='240' y='380' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>MSE: average of (prediction - target)^2</text><text x='240' y='402' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>the squared residuals, averaged</text><text x='720' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>Classification: pick a category</text><rect x='560' y='190.0' width='70' height='140.0' rx='4' fill='#2e9e5b' opacity='0.85'/><text x='595' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cat</text><text x='595' y='180.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>0.7</text><rect x='660' y='290.0' width='70' height='40.0' rx='4' fill='#8a8a8a' opacity='0.85'/><text x='695' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>dog</text><text x='695' y='280.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>0.2</text><rect x='760' y='310.0' width='70' height='20.0' rx='4' fill='#8a8a8a' opacity='0.85'/><text x='795' y='352' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>bird</text><text x='795' y='300.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>0.1</text><text x='720' y='250' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>target: [1, 0, 0]</text><text x='720' y='380' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Cross-entropy: -log(0.7). Wrong and confident</text><text x='720' y='402' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>costs far more than wrong and unsure.</text></svg>