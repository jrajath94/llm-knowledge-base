<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The CI gate for a model change"><rect x="22" y="14" width="916" height="332" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">CI/CD FOR ML</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Evals are the unit tests: the golden set runs on every candidate</text><rect x="38" y="96" width="201.84216249999997" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Candidate</text><text x="54" y="144" font-size="12" fill="#a8a8a8">new model, prompt, or</text><text x="54" y="160" font-size="12" fill="#a8a8a8">config enters the gate</text><line x1="249.84216249999997" y1="152.0" x2="263.8421625" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="263.8421625,147.0 271.8421625,152.0 263.8421625,157.0" fill="#a8a8a8"/><rect x="279.8421625" y="96" width="224.7194125" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="299.8421625" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="299.8421625" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="319.8421625" y="123" font-size="13.5" font-weight="700" fill="#ececec">Golden set</text><text x="295.8421625" y="144" font-size="12" fill="#a8a8a8">fixed representative</text><text x="295.8421625" y="160" font-size="12" fill="#a8a8a8">prompts with known-good</text><text x="295.8421625" y="176" font-size="12" fill="#a8a8a8">answers</text><line x1="514.561575" y1="152.0" x2="528.561575" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="528.561575,147.0 536.561575,152.0 528.561575,157.0" fill="#a8a8a8"/><rect x="544.561575" y="96" width="190.94559999999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="564.561575" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="564.561575" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="584.561575" y="123" font-size="13.5" font-weight="700" fill="#ececec">LLM judge</text><text x="560.561575" y="144" font-size="12" fill="#a8a8a8">scores every output;</text><text x="560.561575" y="160" font-size="12" fill="#a8a8a8">regressions block the</text><text x="560.561575" y="176" font-size="12" fill="#a8a8a8">deploy</text><rect x="38" y="232" width="224.0999125" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="254" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="259" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="259" font-size="13.5" font-weight="700" fill="#ececec">Data changes</text><text x="54" y="280" font-size="12" fill="#a8a8a8">schema tests and</text><text x="54" y="296" font-size="12" fill="#a8a8a8">distribution checks before</text><text x="54" y="312" font-size="12" fill="#a8a8a8">they touch training or</text><text x="54" y="328" font-size="12" fill="#a8a8a8">serving</text></svg>