<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Four metric buckets for post-training">
<rect width="720" height="330" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Four buckets of numbers. In order of visibility.</text>
<rect class="box" x="20" y="60" width="160" height="170" rx="8"/>
<text class="t" x="100" y="84" text-anchor="middle">Preference metrics</text>
<text class="s" x="100" y="104" text-anchor="middle">win rate vs baseline</text>
<text class="s" x="100" y="121" text-anchor="middle">> 50% with tight CIs</text>
<text class="s" x="100" y="138" text-anchor="middle">the headline number</text>
<line x1="20" y1="60" x2="20" y2="230" stroke="#f0b429" stroke-width="4"/>
<rect class="box" x="192" y="60" width="160" height="170" rx="8"/>
<text class="t" x="272" y="84" text-anchor="middle">Capability metrics</text>
<text class="s" x="272" y="104" text-anchor="middle">guardrail benchmarks</text>
<text class="s" x="272" y="121" text-anchor="middle">no significant drop</text>
<text class="s" x="272" y="138" text-anchor="middle">reasoning, coding, math</text>
<line x1="192" y1="60" x2="192" y2="230" stroke="#58a6ff" stroke-width="4"/>
<rect class="box" x="364" y="60" width="160" height="170" rx="8"/>
<text class="t" x="444" y="84" text-anchor="middle">Safety metrics</text>
<text class="s" x="444" y="104" text-anchor="middle">true vs false refusal</text>
<text class="s" x="444" y="121" text-anchor="middle">calibration, not just refusals</text>
<text class="s" x="444" y="138" text-anchor="middle">measured on fixed probes</text>
<line x1="364" y1="60" x2="364" y2="230" stroke="#3fb950" stroke-width="4"/>
<rect class="box" x="536" y="60" width="160" height="170" rx="8"/>
<text class="t" x="616" y="84" text-anchor="middle">Reward-model health</text>
<text class="s" x="616" y="104" text-anchor="middle">RM vs human agreement</text>
<text class="s" x="616" y="121" text-anchor="middle">overoptimization gap</text>
<text class="s" x="616" y="138" text-anchor="middle">KL drift from SFT</text>
<line x1="536" y1="60" x2="536" y2="230" stroke="#e5484d" stroke-width="4"/>
<text x="360" y="262" text-anchor="middle" fill="#ececec" font-size="13" font-weight="400" font-family="Charis SIL, Georgia, serif">Bucket 4 predicts buckets 1-3, one training cycle ahead.</text>
<text x="360" y="284" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">When reward-model health goes wrong, the external metrics follow.</text>
<text x="360" y="306" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">Read the bucket-4 numbers every week: agreement, gold-proxy gap, KL drift.</text>
</svg>