<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Routing by judgment">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Routing by judgment</text>
<text x="300" y="58" text-anchor="middle" class="xs">Small models for low-judgment steps. Flagship for hard calls.</text>
<rect x="60" y="100" width="220" height="120" rx="8" fill="#7fc97f" opacity="0.15" stroke="#7fc97f" stroke-width="2"/>
<text x="170" y="130" text-anchor="middle" class="s b">Small model</text>
<text x="170" y="155" text-anchor="middle" class="xs">Parsing, formatting,</text>
<text x="170" y="173" text-anchor="middle" class="xs">high-volume steps</text>
<text x="170" y="200" text-anchor="middle" class="s b" style="fill:#7fc97f">Cheap, fast</text>
<rect x="320" y="100" width="220" height="120" rx="8" fill="#6cb2ff" opacity="0.15" stroke="#6cb2ff" stroke-width="2"/>
<text x="430" y="130" text-anchor="middle" class="s b">Flagship model</text>
<text x="430" y="155" text-anchor="middle" class="xs">Planning, judgment,</text>
<text x="430" y="173" text-anchor="middle" class="xs">hard decisions</text>
<text x="430" y="200" text-anchor="middle" class="s b" style="fill:#6cb2ff">Smart, expensive</text>
<text x="300" y="260" text-anchor="middle" class="xs">Route by judgment, not by fashion. A team that routes everything</text>
<text x="300" y="278" text-anchor="middle" class="xs">to the small model gets a cheap agent that fails.</text>
</svg>
