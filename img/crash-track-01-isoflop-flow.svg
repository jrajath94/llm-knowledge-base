<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px" role="img" aria-label="Five numbered steps: pick budgets, train sizes, plot U-curves, join minima, extrapolate then train once.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">isoFLOP decision flow: one compute budget, many model sizes</text>
<rect x="230" y="60" width="300" height="56" rx="8" class="pick"/>
<text x="380" y="84" text-anchor="middle" class="big">1. Pick budgets</text>
<text x="380" y="103" text-anchor="middle" class="m">3-4 budgets, about 10x apart</text>
<path class="arr" d="M380 116 L380 134"/>
<rect x="230" y="134" width="300" height="56" rx="8" class="box"/>
<text x="380" y="158" text-anchor="middle" class="big">2. Train sizes</text>
<text x="380" y="177" text-anchor="middle" class="m">4-5 sizes across the N:D range</text>
<path class="arr" d="M380 190 L380 208"/>
<rect x="230" y="208" width="300" height="56" rx="8" class="box"/>
<text x="380" y="232" text-anchor="middle" class="big">3. Plot U-curves</text>
<text x="380" y="251" text-anchor="middle" class="m">loss vs tokens-per-param, read each minimum</text>
<path class="arr" d="M380 264 L380 282"/>
<rect x="230" y="282" width="300" height="56" rx="8" class="box"/>
<text x="380" y="306" text-anchor="middle" class="big">4. Join the minima</text>
<text x="380" y="325" text-anchor="middle" class="m">the optima line is your N:D rule</text>
<path class="arr" d="M380 338 L380 356"/>
<rect x="230" y="356" width="300" height="56" rx="8" class="pick"/>
<text x="380" y="380" text-anchor="middle" class="big">5. Extrapolate, then train once</text>
<text x="380" y="399" text-anchor="middle" class="m">one clean run at the big budget</text>
<text x="24" y="458" text-anchor="start" class="s">Worked check: 7B x 140B and 13B x 75B both give about 5.86e21 FLOPs: compute-matched.</text>
</svg>