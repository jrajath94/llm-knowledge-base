<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Three mechanisms of safety collapse">
<rect width="720" height="360" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Three ways safety training eats the model</text>
<rect class="box" x="20" y="55" width="220" height="250" rx="8"/>
<text class="t" x="130" y="79" text-anchor="middle">1. the safety tax</text>
<text class="s" x="130" y="99" text-anchor="middle">refusal data crowds out</text>
<text class="s" x="130" y="116" text-anchor="middle">capability in the mix</text>
<text class="s" x="130" y="133" text-anchor="middle"></text>
<line x1="20" y1="55" x2="20" y2="305" stroke="#f0b429" stroke-width="4"/>
<text x="130" y="175" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">mix: 30% refusals</text>
<rect x="45" y="190" width="170" height="16" fill="#222" rx="3"/>
<rect x="45" y="190" width="119.0" height="16" fill="#f0b429" rx="3"/>
<text x="130" y="222" text-anchor="middle" fill="#8a8a8a" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">capability kept</text>
<rect x="45" y="232" width="170" height="16" fill="#222" rx="3"/>
<rect x="45" y="232" width="51.0" height="16" fill="#e5484d" rx="3"/>
<text x="130" y="264" text-anchor="middle" fill="#8a8a8a" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">false refusals creep up</text>
<rect class="box" x="255" y="55" width="220" height="250" rx="8"/>
<text class="t" x="365" y="79" text-anchor="middle">2. the style trap</text>
<text class="s" x="365" y="99" text-anchor="middle">the reward model learns</text>
<text class="s" x="365" y="116" text-anchor="middle">"sounds safe" over "is safe"</text>
<text class="s" x="365" y="133" text-anchor="middle"></text>
<line x1="255" y1="55" x2="255" y2="305" stroke="#58a6ff" stroke-width="4"/>
<text x="365" y="175" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">apologetic tone, hedging</text>
<text x="365" y="196" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700" font-family="Charis SIL, Georgia, serif">high reward, empty calories</text>
<text x="365" y="220" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">the model games the judge</text>
<text x="365" y="245" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">instead of being safe</text>
<rect class="box" x="490" y="55" width="210" height="250" rx="8"/>
<text class="t" x="595" y="79" text-anchor="middle">3. blunt templates</text>
<text class="s" x="595" y="99" text-anchor="middle">one refusal template</text>
<text class="s" x="595" y="116" text-anchor="middle">replaces the whole spectrum</text>
<text class="s" x="595" y="133" text-anchor="middle"></text>
<line x1="490" y1="55" x2="490" y2="305" stroke="#e5484d" stroke-width="4"/>
<text x="595" y="170" text-anchor="middle" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">hard refuse</text>
<text x="595" y="192" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">safe completion</text>
<text x="595" y="214" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">partial answer</text>
<text x="595" y="236" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">full answer</text>
<line x1="520" y1="170" x2="670" y2="170" stroke="#e5484d" stroke-width="3"/>
<text x="595" y="262" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">everything collapses to</text>
<text x="595" y="277" text-anchor="middle" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">the top row</text>
<text x="360" y="335" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">all three are the same failure: training on the shape of safety instead of its content</text>
</svg>