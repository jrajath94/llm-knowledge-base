<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.6. Escalation triggers: when the agent hands back to a human</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">silence is not a strategy</text>
<rect x="24" y="110" width="560" height="72" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">CONFIDENCE BELOW BAR</text>
<text x="304.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the model says it is unsure: believe it</text>
<rect x="24" y="196" width="560" height="72" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="222" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">NOVEL SITUATION</text>
<text x="304.0" y="240" font-size="11" fill="#a8a8a8" text-anchor="middle">nothing in the golden set looks like this</text>
<rect x="24" y="282" width="560" height="72" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="308" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HIGH-STAKES ACTION</text>
<text x="304.0" y="326" font-size="11" fill="#a8a8a8" text-anchor="middle">money, access, or reputation moves</text>
<rect x="24" y="368" width="560" height="72" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="304.0" y="394" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">REPEATED FAILURE</text>
<text x="304.0" y="412" font-size="11" fill="#a8a8a8" text-anchor="middle">the loop already tried twice</text>
<rect x="624" y="110" width="232" height="160" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="740.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE HANDOFF</text>
<text x="740.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">state, options tried, and a</text>
<text x="740.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">recommendation; never a bare</text>
<text x="740.0" y="184" font-size="11" fill="#a8a8a8" text-anchor="middle">error</text>
<text x="24" y="480" font-size="12" fill="#a8a8a8" text-anchor="start">Escalation is a feature, not an apology. Design the handoff before the failure, and the on-call thanks you.</text>
</svg>