<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 435" role="img" aria-label="The three gates: when a change ships">
<rect width="900" height="435" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The three gates: when a change ships</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Miss any one gate and the number is a story, not a result.</text>
<rect x="30.0" y="77.0" width="272.0" height="96.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="166.0" y="107.0" text-anchor="middle" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">HELD-OUT</text>
<text x="46.0" y="129.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">evals never trained on, never</text>
<text x="46.0" y="144.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">prompt-tuned on, never filtered</text>
<text x="46.0" y="160.1" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">by</text>
<rect x="318.0" y="77.0" width="272.0" height="96.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="454.0" y="107.0" text-anchor="middle" fill="#4aa8ff" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">NOISE</text>
<text x="334.0" y="129.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">the delta must beat the error</text>
<text x="334.0" y="144.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">bars</text>
<rect x="606.0" y="77.0" width="272.0" height="96.0" rx="6" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="742.0" y="107.0" text-anchor="middle" fill="#f0b429" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">CONTROLLED</text>
<text x="622.0" y="129.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">same data, same compute, same</text>
<text x="622.0" y="144.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">harness: only the ingredient</text>
<text x="622.0" y="160.1" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">changed</text>
<text x="40.0" y="207.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">The delta, drawn (baseline = 0, noise band = +/- 1.0 point)</text>
<line x1="120.0" y1="265.0" x2="780.0" y2="265.0" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="150.0" y1="259.0" x2="150.0" y2="271.0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="150.0" y="289.0" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">-2.0</text>
<line x1="300.0" y1="259.0" x2="300.0" y2="271.0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="300.0" y="289.0" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">-1.0</text>
<line x1="450.0" y1="259.0" x2="450.0" y2="271.0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="450.0" y="289.0" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">0</text>
<line x1="600.0" y1="259.0" x2="600.0" y2="271.0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="600.0" y="289.0" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">+1.0</text>
<line x1="750.0" y1="259.0" x2="750.0" y2="271.0" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="750.0" y="289.0" text-anchor="middle" fill="#8a8a8a" font-size="10.5" font-family="Charis SIL, Georgia, serif">+2.0</text>
<rect x="300.0" y="249.0" width="300.0" height="32.0" rx="6" fill="#1a1a1a" stroke="#6f6f6f" stroke-width="1" stroke-dasharray="4,3"/>
<text x="450.0" y="239.0" text-anchor="middle" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">noise band</text>
<circle cx="495.0" cy="265.0" r="7" fill="#6f6f6f"/>
<text x="495.0" y="305.0" text-anchor="middle" fill="#6f6f6f" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">+0.3: NOT a gain</text>
<line x1="540.0" y1="327.0" x2="720.0" y2="327.0" stroke="#2dd4bf" stroke-width="3"/>
<line x1="540.0" y1="319.0" x2="540.0" y2="335.0" stroke="#2dd4bf" stroke-width="3"/>
<line x1="720.0" y1="319.0" x2="720.0" y2="335.0" stroke="#2dd4bf" stroke-width="3"/>
<circle cx="630.0" cy="327.0" r="7" fill="#2dd4bf"/>
<text x="630.0" y="309.0" text-anchor="middle" fill="#2dd4bf" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">+1.2</text>
<text x="732.0" y="331.0" text-anchor="start" fill="#2dd4bf" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">CI [+0.6, +1.8] -&gt; SHIP</text>
<circle cx="405.0" cy="369.0" r="7" fill="#e5484d"/>
<text x="405.0" y="391.0" text-anchor="middle" fill="#e5484d" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">-0.3 inside the noise band -&gt; KILL</text>
</svg>
