<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Temperature sharpens or flattens the token distribution">
<style>
.t { font:600 13px 'Charis SIL',Georgia,serif; fill: #ececec; }
.s { font:400 11px 'Charis SIL',Georgia,serif; fill: #a8a8a8; }
.b { font:700 12px 'Charis SIL',Georgia,serif; fill: #fff; }
.box { fill: #141414; stroke: #6cb2ff; stroke-width: 1.5; rx: 6; }
.box2 { fill: #141414; stroke: #7fc97f; stroke-width: 1.5; rx: 6; }
.box3 { fill: #141414; stroke: #f0b429; stroke-width: 1.5; rx: 6; }
.arr { stroke: #8a8a8a; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#8a8a8a" /></marker></defs>
<text x="20" y="28" class="t">Temperature: how T reshapes the distribution</text><text x="80" y="55" class="s" text-anchor="middle">T = 0.5 (sharp)</text><rect x="20" y="194.44444444444446" width="18" height="15.555555555555555" fill="#e57373" opacity="0.85" rx="2" /><rect x="42" y="172.66666666666666" width="18" height="37.333333333333336" fill="#e57373" opacity="0.85" rx="2" /><rect x="64" y="70.0" width="18" height="140.0" fill="#e57373" opacity="0.85" rx="2" /><rect x="86" y="172.66666666666666" width="18" height="37.333333333333336" fill="#e57373" opacity="0.85" rx="2" /><rect x="108" y="194.44444444444446" width="18" height="15.555555555555555" fill="#e57373" opacity="0.85" rx="2" /><rect x="130" y="200.66666666666666" width="18" height="9.333333333333334" fill="#e57373" opacity="0.85" rx="2" /><rect x="152" y="203.77777777777777" width="18" height="6.222222222222222" fill="#e57373" opacity="0.85" rx="2" /><rect x="174" y="203.77777777777777" width="18" height="6.222222222222222" fill="#e57373" opacity="0.85" rx="2" /><line x1="20" y1="210" x2="200" y2="210" stroke="#8a8a8a" /><text x="285" y="55" class="s" text-anchor="middle">T = 1.0 (raw)</text><rect x="225" y="159.0909090909091" width="18" height="50.909090909090914" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="247" y="114.54545454545455" width="18" height="95.45454545454545" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="269" y="70.0" width="18" height="140.0" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="291" y="114.54545454545455" width="18" height="95.45454545454545" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="313" y="146.36363636363637" width="18" height="63.63636363636363" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="335" y="159.0909090909091" width="18" height="50.909090909090914" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="357" y="171.8181818181818" width="18" height="38.18181818181818" fill="#6cb2ff" opacity="0.85" rx="2" /><rect x="379" y="178.1818181818182" width="18" height="31.818181818181817" fill="#6cb2ff" opacity="0.85" rx="2" /><line x1="225" y1="210" x2="405" y2="210" stroke="#8a8a8a" /><text x="490" y="55" class="s" text-anchor="middle">T = 2.0 (flat)</text><rect x="430" y="90.0" width="18" height="120.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="452" y="80.0" width="18" height="130.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="474" y="70.0" width="18" height="140.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="496" y="80.0" width="18" height="130.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="518" y="90.0" width="18" height="120.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="540" y="100.0" width="18" height="110.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="562" y="110.0" width="18" height="100.0" fill="#7fc97f" opacity="0.85" rx="2" /><rect x="584" y="120.0" width="18" height="90.0" fill="#7fc97f" opacity="0.85" rx="2" /><line x1="430" y1="210" x2="610" y2="210" stroke="#8a8a8a" /><text x="20" y="245" class="s">Low T: the top token dominates. High T: rare tokens get a real chance.</text><text x="20" y="265" class="s">T = 0 means greedy: always pick the top token.</text></svg>