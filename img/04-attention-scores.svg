<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 560' width='100%' role='img'><rect x='0' y='0' width='960' height='560' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>One attention head, one query: scores become weights</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Worked example: 3 tokens, query = "sat". d_k = 4.</text><text x='480' y='92' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Step 1: dot the query with every key</text><rect x='120' y='110' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='220' y='138' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>q_sat . k_the</text><rect x='370' y='110' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='470' y='138' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>q_sat . k_cat</text><rect x='620' y='110' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='720' y='138' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>q_sat . k_sat</text><line x1='480' y1='158' x2='480' y2='188' stroke='#8a8a8a' stroke-width='2.5'/><polygon points='480,188 474,179 486,179' fill='#8a8a8a'/><text x='480' y='206' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>raw scores</text><rect x='120' y='214' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='220' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>1.2</text><rect x='370' y='214' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#f0b429' stroke-width='2.5'/><text x='470' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>3.6</text><rect x='620' y='214' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='720' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>0.4</text><text x='480' y='280' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Step 2: divide by sqrt(d_k), then softmax</text><rect x='120' y='292' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><rect x='120' y='292' width='16' height='44' rx='8' fill='#4db6ac' opacity='0.25'/><text x='220' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>0.08</text><rect x='370' y='292' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><rect x='370' y='292' width='166' height='44' rx='8' fill='#f0b429' opacity='0.25'/><text x='470' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>0.83</text><rect x='620' y='292' width='200' height='44' rx='8' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><rect x='620' y='292' width='18' height='44' rx='8' fill='#4db6ac' opacity='0.25'/><text x='720' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>0.09</text><text x='480' y='358' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Step 3: mix the value vectors with these weights</text><rect x='280' y='370' width='400' height='48' rx='8' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2.5'/><text x='480' y='400' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>out = 0.08 v_the + 0.83 v_cat + 0.09 v_sat</text><text x='480' y='442' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>The query "sat" pulls most of its meaning from "cat". Weights always sum to 1.</text></svg>