<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" style="max-width:760px" role="img" aria-label="Clipped objective plot: the green line rises then flattens at 1 plus eps, the blue line falls then flattens at 1 minus eps.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">PPO: the min() keeps updates pessimistic (eps = 0.2)</text>
<line x1="90" y1="250" x2="650" y2="250" stroke="#8a8a8a"/>
<line x1="370.0" y1="80" x2="370.0" y2="250" stroke="#3a3a3a"/>
<text x="276.6666666666667" y="270" text-anchor="middle" class="m">1-eps</text>
<text x="370.0" y="270" text-anchor="middle" class="m">1</text>
<text x="463.3333333333333" y="270" text-anchor="middle" class="m">1+eps</text>
<rect x="276.6666666666667" y="80" width="186.66666666666663" height="170" fill="#f0b429" opacity="0.12"/>
<polyline points="90.0,250.0 463.3333333333333,148.0 650.0000000000001,148.0" fill="none" stroke="#7fc97f" stroke-width="2.5"/>
<text x="626.6666666666666" y="138.0" text-anchor="middle" class="s">advantage &gt; 0</text>
<polyline points="90.0,165.0 276.6666666666667,233.0 650.0000000000001,233.0" fill="none" stroke="#6cb2ff" stroke-width="2.5"/>
<text x="113.33333333333333" y="155.0" text-anchor="middle" class="s">advantage &lt; 0</text>
<text x="24" y="320" text-anchor="start" class="s">The min() caps the upside: one lucky sample cannot push a token past 1 + eps.</text>
</svg>