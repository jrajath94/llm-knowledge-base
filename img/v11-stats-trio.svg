<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The three tools that matter for ML experiments"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">STATISTICS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">&quot;Significant&quot; means: unlikely to have arisen by chance alone. Nothing more.</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">p-value:</text><text x="146.66890625000002" y="94" font-size="13.5" fill="#a8a8a8">the probability of seeing a difference this big if nothing were really there.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Confidence interval:</text><text x="238.23054687500002" y="125" font-size="13.5" fill="#a8a8a8">the honest range: the measured delta is the center, the interval is the uncertainty.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Standard error:</text><text x="203.189609375" y="156" font-size="13.5" fill="#a8a8a8">how much the estimate wobbles when the seed changes.</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">Paired bootstrap:</text><text x="218.128203125" y="187" font-size="13.5" fill="#a8a8a8">the technique that makes small-sample ML comparisons honest.</text></svg>