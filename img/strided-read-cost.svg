<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 272" width="100%" style="max-width:700px" role="img" aria-label="Coalesced read is one 128 byte segment at 100 percent efficiency; strided read is 32 segments moving 4096 bytes at 3.1 percent">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="272" fill="none"/>
<text class="t" x="24" y="30">The true cost of a strided read: 1 segment vs 32 segments</text>
<text class="m" x="24" y="58">One float32 per thread, 32-thread warp. Useful bytes: 128 in both cases.</text>
<text class="big gr" x="24" y="84">Coalesced: thread t reads element t</text>
<rect x="24" y="94" width="480" height="34" rx="4" fill="#7fc97f" opacity="0.85"/>
<text class="big" x="36" y="116">1 transaction  x  128 bytes  =  128 bytes moved</text>
<text class="big gr" x="520" y="116">100% efficient</text>
<text class="big r" x="24" y="162">Strided: thread t reads element 32*t</text>
<rect x="24" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="90" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="156" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="222" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="288" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="354" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="420" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="486" y="172" width="60" height="34" rx="4" fill="#e57373" opacity="0.85"/>
<text class="num" x="24" y="228">32 transactions  x  128 bytes  =  4,096 bytes moved  -&gt;  3.1% efficient</text>
<text class="m" x="24" y="250">96.9% of HBM traffic is waste. 1 GB useful reads move 32 GB: 9.6 ms of pure waste at 3.35 TB/s.</text>
</svg>
