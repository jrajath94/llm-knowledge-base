<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="620" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.2. Pattern selection: three questions pick the pattern</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">answer honestly; the wrong pattern is the most expensive bug</text>
<rect x="280" y="100" width="320" height="80" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="126" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Q1: more than 8 steps?</text>
<text x="440.0" y="144" font-size="11" fill="#a8a8a8" text-anchor="middle">the complexity boundary where ReAct starts</text>
<text x="440.0" y="159" font-size="11" fill="#a8a8a8" text-anchor="middle">to wobble</text>
<line x1="440" y1="180" x2="440" y2="220" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,220 436.33015592246386,211.78219953718923 443.66984407753614,211.78219953718923" fill="#8a8a8a"/>
<rect x="280" y="220" width="320" height="80" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="246" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Q2: is the path knowable?</text>
<text x="440.0" y="264" font-size="11" fill="#a8a8a8" text-anchor="middle">can you write the plan before running it</text>
<line x1="360" y1="300" x2="240" y2="340" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="240,340 246.635583451511,333.9197835352651 248.95659664004972,340.88282310088135" fill="#8a8a8a"/>
<line x1="520" y1="300" x2="640" y2="340" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="640,340 631.0434033599503,340.88282310088135 633.364416548489,333.9197835352651" fill="#8a8a8a"/>
<text x="290" y="330" font-size="11" fill="#7dd87d" text-anchor="start">yes</text>
<text x="590" y="330" font-size="11" fill="#e57ea6" text-anchor="start">no</text>
<rect x="60" y="340" width="320" height="80" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="220.0" y="366" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Q3: does it split?</text>
<text x="220.0" y="384" font-size="11" fill="#a8a8a8" text-anchor="middle">independent subtasks with clean interfaces</text>
<rect x="500" y="340" width="320" height="80" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="660.0" y="366" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">REACT</text>
<text x="660.0" y="384" font-size="11" fill="#a8a8a8" text-anchor="middle">interleave thought and action; compact</text>
<text x="660.0" y="399" font-size="11" fill="#a8a8a8" text-anchor="middle">context as it grows</text>
<line x1="220" y1="420" x2="220" y2="460" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="220,460 216.33015592246386,451.78219953718923 223.66984407753614,451.78219953718923" fill="#8a8a8a"/>
<line x1="220" y1="420" x2="640" y2="460" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="640,460 631.471282257514,462.87419095903596 632.1671514316688,455.56756463041006" fill="#8a8a8a"/>
<rect x="60" y="460" width="320" height="90" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="220.0" y="486" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">PLAN-AND-EXECUTE</text>
<text x="220.0" y="504" font-size="11" fill="#a8a8a8" text-anchor="middle">planner writes the DAG, executors run it,</text>
<text x="220.0" y="519" font-size="11" fill="#a8a8a8" text-anchor="middle">critic checks</text>
<rect x="500" y="460" width="320" height="90" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="660.0" y="486" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">MULTI-AGENT</text>
<text x="660.0" y="504" font-size="11" fill="#a8a8a8" text-anchor="middle">specialists own subtasks; a lead merges</text>
<text x="660.0" y="519" font-size="11" fill="#a8a8a8" text-anchor="middle">results</text>
<text x="24" y="590" font-size="12" fill="#a8a8a8" text-anchor="start">ReAct past ~8 steps without compaction is the classic failure: the pattern did not scale, the task outgrew it.</text>
</svg>