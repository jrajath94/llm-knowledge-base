<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" role="img" aria-label="Causal mask for the chapter's worked 3-token example">
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#ececec}
    .m{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#a8a8a8}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
  <text x="20" y="30" class="t" font-size="17" font-weight="700">Causal mask: token i reads tokens 0..i only</text>
  <text x="20" y="54" class="m" font-size="13">weights from the chapter's worked example ("the", "cat", "sat")</text>
  <!-- column labels (keys) -->
  <text x="200" y="100" class="m" font-size="13" text-anchor="middle">key: the</text>
  <text x="310" y="100" class="m" font-size="13" text-anchor="middle">key: cat</text>
  <text x="420" y="100" class="m" font-size="13" text-anchor="middle">key: sat</text>
  <!-- row labels (queries) -->
  <text x="120" y="160" class="m" font-size="13" text-anchor="end">query: the</text>
  <text x="120" y="250" class="m" font-size="13" text-anchor="end">query: cat</text>
  <text x="120" y="340" class="m" font-size="13" text-anchor="end">query: sat</text>
  <!-- row 0 -->
  <rect x="155" y="125" width="90" height="70" rx="6" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="200" y="165" class="t mono" font-size="16" text-anchor="middle">1.000</text>
  <rect x="255" y="125" width="90" height="70" rx="6" fill="#0d0d0d" stroke="#262626"/>
  <text x="300" y="165" class="m mono" font-size="14" text-anchor="middle">-inf -&gt; 0</text>
  <rect x="355" y="125" width="90" height="70" rx="6" fill="#0d0d0d" stroke="#262626"/>
  <text x="400" y="165" class="m mono" font-size="14" text-anchor="middle">-inf -&gt; 0</text>
  <!-- row 1 -->
  <rect x="155" y="215" width="90" height="70" rx="6" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="200" y="255" class="t mono" font-size="16" text-anchor="middle">0.500</text>
  <rect x="255" y="215" width="90" height="70" rx="6" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="300" y="255" class="t mono" font-size="16" text-anchor="middle">0.500</text>
  <rect x="355" y="215" width="90" height="70" rx="6" fill="#0d0d0d" stroke="#262626"/>
  <text x="400" y="255" class="m mono" font-size="14" text-anchor="middle">-inf -&gt; 0</text>
  <!-- row 2 -->
  <rect x="155" y="305" width="90" height="70" rx="6" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="200" y="345" class="t mono" font-size="16" text-anchor="middle">0.576</text>
  <rect x="255" y="305" width="90" height="70" rx="6" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="300" y="345" class="t mono" font-size="16" text-anchor="middle">0.140</text>
  <rect x="355" y="305" width="90" height="70" rx="6" fill="#12283f" stroke="#6cb2ff" stroke-width="1.5"/>
  <text x="400" y="345" class="t mono" font-size="16" text-anchor="middle">0.284</text>
  <!-- legend -->
  <rect x="480" y="125" width="140" height="250" rx="8" fill="#0d0d0d" stroke="#262626"/>
  <text x="496" y="155" class="t" font-size="13" font-weight="700">How to read</text>
  <rect x="496" y="170" width="26" height="18" rx="4" fill="#12283f" stroke="#6cb2ff"/>
  <text x="530" y="184" class="m" font-size="12">kept score</text>
  <rect x="496" y="200" width="26" height="18" rx="4" fill="#0d0d0d" stroke="#262626"/>
  <text x="530" y="214" class="m" font-size="12">masked (-inf)</text>
  <text x="496" y="250" class="m" font-size="12">mask applied before</text>
  <text x="496" y="268" class="m" font-size="12">softmax, so masked</text>
  <text x="496" y="286" class="m" font-size="12">cells become exactly 0.</text>
  <text x="496" y="320" class="m" font-size="12">Rows sum to 1.000:</text>
  <text x="496" y="338" class="m" font-size="12">softmax output is a</text>
  <text x="496" y="356" class="m" font-size="12">distribution over</text>
  <text x="496" y="374" class="m" font-size="12">the visible past.</text>
</svg>
