<svg xmlns="http://www.w3.org/2000/svg" width="800" height="275" viewBox="0 0 800 275" font-family="DejaVu Sans, sans-serif">
<defs><style>.t{font-size:13px;fill:#1a3a5c;font-weight:bold}.b{font-size:11.5px;fill:#333333}.s{font-size:10.5px;fill:#555555}.box{fill:#f4f7fa;stroke:#1a3a5c;stroke-width:1.5;rx:8}.box2{fill:#eef6f3;stroke:#2a9d8f;stroke-width:1.5;rx:8}.box3{fill:#fdf3ec;stroke:#e76f51;stroke-width:1.5;rx:8}.arr{stroke:#1a3a5c;stroke-width:2;fill:none;marker-end:url(#ah)}</style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/></marker></defs>
<text x="400" y="30" text-anchor="middle" class="t" font-size="15">Cold-start SFT before RL (DeepSeek-R1 pattern)</text>
<rect x="30" y="60" width="220" height="150" class="box3"/>
<text x="140.0" y="82" text-anchor="middle" class="t">Pure RL from base</text>
<text x="140.0" y="102" text-anchor="middle" class="b">correct traces, but</text>
<text x="140.0" y="120" text-anchor="middle" class="b">unreadable reasoning;</text>
<text x="140.0" y="138" text-anchor="middle" class="b">humans cannot audit it</text>
<rect x="290" y="60" width="220" height="150" class="box"/>
<text x="400.0" y="82" text-anchor="middle" class="t">Cold-start SFT</text>
<text x="400.0" y="102" text-anchor="middle" class="b">a few thousand clean</text>
<text x="400.0" y="120" text-anchor="middle" class="b">reasoning traces;</text>
<text x="400.0" y="138" text-anchor="middle" class="b">teaches readable shape</text>
<rect x="550" y="60" width="220" height="150" class="box2"/>
<text x="660.0" y="82" text-anchor="middle" class="t">RL after cold start</text>
<text x="660.0" y="102" text-anchor="middle" class="b">verifiable rewards</text>
<text x="660.0" y="120" text-anchor="middle" class="b">improve the traces;</text>
<text x="660.0" y="138" text-anchor="middle" class="b">stays readable</text>
<path d="M250,135 L290,135" class="arr"/>
<path d="M510,135 L550,135" class="arr"/>
<text x="400" y="245" text-anchor="middle" class="s">Readability is a product requirement, not a luxury: unreadable traces cannot be audited.</text>
</svg>
