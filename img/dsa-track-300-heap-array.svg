<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 600" role="img" aria-label="Min-heap: the tree lives in an array">
<rect width="900" height="600" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Min-heap: the tree lives in an array</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">No pointers. Index math finds every parent and child.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<line x1="450" y1="120" x2="300" y2="220" stroke="#3a3a3a" stroke-width="2"/>
<line x1="450" y1="120" x2="600" y2="220" stroke="#3a3a3a" stroke-width="2"/>
<line x1="300" y1="220" x2="220" y2="320" stroke="#3a3a3a" stroke-width="2"/>
<line x1="300" y1="220" x2="380" y2="320" stroke="#3a3a3a" stroke-width="2"/>
<line x1="600" y1="220" x2="540" y2="320" stroke="#3a3a3a" stroke-width="2"/>
<circle cx="450" cy="120" r="26" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
<text x="450" y="126" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">1</text>
<circle cx="300" cy="220" r="26" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="2"/>
<text x="300" y="226" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">3</text>
<circle cx="600" cy="220" r="26" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
<text x="600" y="226" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">6</text>
<circle cx="220" cy="320" r="26" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
<text x="220" y="326" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">5</text>
<circle cx="380" cy="320" r="26" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
<text x="380" y="326" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">9</text>
<circle cx="540" cy="320" r="26" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
<text x="540" y="326" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">8</text>
<text x="300" y="380" text-anchor="middle" fill="#6aa8ff" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">node 3 lives at index 1</text>
<text x="90" y="416" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">array</text>
<rect x="90" y="430" width="80" height="52" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="130.0" y="462" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">1</text>
<text x="130.0" y="500" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">0</text>
<rect x="178" y="430" width="80" height="52" rx="6" fill="#1a1a1a" stroke="#6aa8ff"/>
<text x="218.0" y="462" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">3</text>
<text x="218.0" y="500" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">1</text>
<rect x="266" y="430" width="80" height="52" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="306.0" y="462" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">6</text>
<text x="306.0" y="500" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">2</text>
<rect x="354" y="430" width="80" height="52" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="394.0" y="462" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">5</text>
<text x="394.0" y="500" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">3</text>
<rect x="442" y="430" width="80" height="52" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="482.0" y="462" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">9</text>
<text x="482.0" y="500" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">4</text>
<rect x="530" y="430" width="80" height="52" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="570.0" y="462" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">8</text>
<text x="570.0" y="500" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">5</text>
<text x="90" y="540" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">parent(i) = (i-1)//2.  left(i) = 2i+1.  right(i) = 2i+2.</text>
<text x="90" y="564" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Example: node 3 is at index 1. Its parent is index 0 (value 1). Its children are indexes 3 and 4.</text>
<text x="90" y="588" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Heap rule: every parent is smaller than its children. The minimum is always at index 0.</text>
</svg>
