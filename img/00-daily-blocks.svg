<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 320' width='100%' role='img'><text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>A day that works: 4 focused hours</text><rect x='23.0' y='70' width='354.0' height='150' rx='10' fill='#1565c0' fill-opacity='0.20' stroke='#1565c0' stroke-width='2'/><text x='200.0' y='106' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Hours 1-2</text><text x='200.0' y='134' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Read one chapter deeply</text><text x='200.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Work the examples by hand. Tra</text><text x='200.0' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>ce the numbers.</text><rect x='383.0' y='70' width='174.0' height='150' rx='10' fill='#f0b429' fill-opacity='0.20' stroke='#f0b429' stroke-width='2'/><text x='470.0' y='106' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Hour 3</text><text x='470.0' y='134' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Do the lab</text><text x='470.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Run the code. Break one thing</text><text x='470.0' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>on purpose.</text><rect x='563.0' y='70' width='174.0' height='150' rx='10' fill='#2e7d32' fill-opacity='0.20' stroke='#2e7d32' stroke-width='2'/><text x='650.0' y='106' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Hour 4</text><text x='650.0' y='134' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>DSA track or papers</text><text x='650.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>One pattern, 2-3 problems. Or</text><text x='650.0' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>paper reading.</text><rect x='743.0' y='70' width='174.0' height='150' rx='10' fill='#00838f' fill-opacity='0.20' stroke='#00838f' stroke-width='2'/><text x='830.0' y='106' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Bonus</text><text x='830.0' y='134' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Re-explain from memory</text><text x='830.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The day's hardest idea, out lo</text><text x='830.0' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>ud, in plain words.</text><text x='20' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Work in 50-minute blocks with 10-minute breaks. One volume at a time; never parallel-read volumes.</text><text x='20' y='288' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>If a chapter feels easy, do its lab anyway. The lab is where understanding actually forms.</text></svg>