<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="After FlashAttention: the IO-awareness lineage"><rect x="22" y="14" width="916" height="300" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">WHAT CAME NEXT</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">After FlashAttention: the IO-awareness lineage</text><rect x="38" y="96" width="252.2763" height="94" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="52" y="120" font-size="13.5" font-weight="700" fill="#ececec">FlashAttention-2 (2023)</text><text x="52" y="140" font-size="12" fill="#a8a8a8">2-4x faster: better parallelism,</text><text x="52" y="156" font-size="12" fill="#a8a8a8">warp partitioning</text><line x1="302.2763" y1="143.0" x2="316.2763" y2="143.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="316.2763,138.0 324.2763,143.0 316.2763,148.0" fill="#a8a8a8"/><rect x="334.2763" y="96" width="251.11224843750003" height="94" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="348.2763" y="120" font-size="13.5" font-weight="700" fill="#ececec">FlashAttention-3 (2024)</text><text x="348.2763" y="140" font-size="12" fill="#a8a8a8">asynchrony and low-precision</text><text x="348.2763" y="156" font-size="12" fill="#a8a8a8">on Hopper</text><line x1="597.3885484375" y1="143.0" x2="611.3885484375" y2="143.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="611.3885484375,138.0 619.3885484375,143.0 611.3885484375,148.0" fill="#a8a8a8"/><rect x="629.3885484375" y="96" width="232.3795640625" height="94" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="643.3885484375" y="120" font-size="13.5" font-weight="700" fill="#ececec">FlashDecoding (2024)</text><text x="643.3885484375" y="140" font-size="12" fill="#a8a8a8">the same tiling idea for</text><text x="643.3885484375" y="156" font-size="12" fill="#a8a8a8">inference decode</text><rect x="38" y="216" width="222.9261046875" height="94" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="52" y="240" font-size="13.5" font-weight="700" fill="#ececec">FlexAttention (2024)</text><text x="52" y="260" font-size="12" fill="#a8a8a8">programmable IO-aware</text><text x="52" y="276" font-size="12" fill="#a8a8a8">attention in PyTorch</text><line x1="272.9261046875" y1="263.0" x2="286.9261046875" y2="263.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="286.9261046875,258.0 294.9261046875,263.0 286.9261046875,268.0" fill="#a8a8a8"/><rect x="304.9261046875" y="216" width="225.97271718750002" height="94" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="318.9261046875" y="240" font-size="13.5" font-weight="700" fill="#ececec">RingAttention (2024)</text><text x="318.9261046875" y="260" font-size="12" fill="#a8a8a8">blockwise attention across</text><text x="318.9261046875" y="276" font-size="12" fill="#a8a8a8">devices for million-token</text><text x="318.9261046875" y="292" font-size="12" fill="#a8a8a8">context</text></svg>