<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310">
<rect width="520" height="310" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>The threshold is a price tag, not a habit</text><text x='60' y='100' font-family='Charis SIL, Georgia, serif' font-size='20' fill='#f0b429' text-anchor='start' font-weight='bold'>Flag when  P(churn) > p*</text><text x='60' y='140' font-family='Charis SIL, Georgia, serif' font-size='18' fill='#e8e8e8' text-anchor='start'>p* = Cfp / (Cfp + Cfn)</text><text x='60' y='170' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Cfp: cost of a false positive. Cfn: cost of a false negative.</text><text x='60' y='210' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>Cheap false positives push p* down: flag more.</text><text x='60' y='234' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='start'>Expensive false positives push p* up: flag less.</text><text x='20' y='280' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>0.5 is a habit. p* is arithmetic on the cost of mistakes.</text></svg>