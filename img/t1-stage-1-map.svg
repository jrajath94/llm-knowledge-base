<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 543" role="img" aria-label="Stage 1. Foundations">
<rect width="900" height="543" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Stage 1. Foundations</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Vols 0 through 4 build math, ML honesty, deep learning mechanics, and the transformer. Nothing later makes sense without them.</text>
<rect x="40.0" y="77.0" width="820.0" height="98.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="60.0" y="105.0" text-anchor="start" fill="#2dd4bf" font-size="14.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vol 0: How to use</text>
<text x="60.0" y="129.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Chapters 1, 5, 8</text>
<text x="60.0" y="149.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Ground rules, how to study each volume, and the pacing contract. Skip nothing here.</text>
<rect x="40.0" y="185.0" width="820.0" height="98.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="60.0" y="213.0" text-anchor="start" fill="#4aa8ff" font-size="14.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vol 1: Math for ML</text>
<text x="60.0" y="237.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Chapters 2, 3, 4, 6, 7 (skim 5)</text>
<text x="60.0" y="257.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Information theory is the loss function of language models in disguise; optimization is the language</text>
<text x="60.0" y="272.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">every training discussion is held in.</text>
<rect x="40.0" y="293.0" width="820.0" height="98.0" rx="6" fill="#111111" stroke="#4caf50" stroke-width="1.5"/>
<text x="60.0" y="321.0" text-anchor="start" fill="#4caf50" font-size="14.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vol 2: ML foundations bridge</text>
<text x="60.0" y="345.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">All five chapters, in order</text>
<text x="60.0" y="365.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">The honesty core of the whole curriculum: experiment loop, splits, metrics, leakage, 'is the win</text>
<text x="60.0" y="380.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">real'.</text>
<rect x="40.0" y="401.0" width="820.0" height="98.0" rx="6" fill="#111111" stroke="#b388ff" stroke-width="1.5"/>
<text x="60.0" y="429.0" text-anchor="start" fill="#b388ff" font-size="14.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Vol 3: Deep learning for researchers</text>
<text x="60.0" y="453.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">All six chapters</text>
<text x="60.0" y="473.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Normalization, init, optimizers, mixed precision, gradient checkpointing: the five knobs you touch</text>
<text x="60.0" y="488.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">on every real run. PyTorch fluency starts here.</text>
</svg>
