<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 560" role="img" aria-label="BFS fans out in layers. DFS dives down one path.">
<rect width="900" height="560" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">BFS fans out in layers. DFS dives down one path.</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Same graph, same start A. The visit order is the whole difference.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<line x1="200" y1="140" x2="360" y2="100" stroke="#3a3a3a" stroke-width="2"/>
<line x1="200" y1="140" x2="360" y2="200" stroke="#3a3a3a" stroke-width="2"/>
<line x1="360" y1="100" x2="520" y2="140" stroke="#3a3a3a" stroke-width="2"/>
<line x1="360" y1="200" x2="520" y2="140" stroke="#3a3a3a" stroke-width="2"/>
<line x1="360" y1="200" x2="520" y2="240" stroke="#3a3a3a" stroke-width="2"/>
<line x1="520" y1="140" x2="680" y2="180" stroke="#3a3a3a" stroke-width="2"/>
<circle cx="200" cy="140" r="24" fill="#1a1a1a" stroke="#f0b429" stroke-width="2"/>
<text x="200" y="146" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">A</text>
<circle cx="360" cy="100" r="24" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="2"/>
<text x="360" y="106" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">B</text>
<circle cx="360" cy="200" r="24" fill="#1a1a1a" stroke="#6aa8ff" stroke-width="2"/>
<text x="360" y="206" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">C</text>
<circle cx="520" cy="140" r="24" fill="#1a1a1a" stroke="#7bc96f" stroke-width="2"/>
<text x="520" y="146" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">D</text>
<circle cx="520" cy="240" r="24" fill="#1a1a1a" stroke="#7bc96f" stroke-width="2"/>
<text x="520" y="246" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">E</text>
<circle cx="680" cy="180" r="24" fill="#1a1a1a" stroke="#b48ce8" stroke-width="2"/>
<text x="680" y="186" text-anchor="middle" fill="#ececec" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">F</text>
<circle cx="120" cy="300" r="9" fill="none" stroke="#f0b429" stroke-width="2"/>
<text x="136" y="304" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">layer 0</text>
<circle cx="250" cy="300" r="9" fill="none" stroke="#6aa8ff" stroke-width="2"/>
<text x="266" y="304" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">layer 1</text>
<circle cx="380" cy="300" r="9" fill="none" stroke="#7bc96f" stroke-width="2"/>
<text x="396" y="304" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">layer 2</text>
<circle cx="510" cy="300" r="9" fill="none" stroke="#b48ce8" stroke-width="2"/>
<text x="526" y="304" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">layer 3</text>
<text x="450" y="350" text-anchor="middle" fill="#6aa8ff" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">BFS order (queue): A, B, C, D, E, F</text>
<text x="450" y="376" text-anchor="middle" fill="#8a8a8a" font-size="12.5" font-family="Charis SIL, Georgia, serif">visits every neighbor before going deeper: shortest path in unweighted graphs</text>
<text x="450" y="420" text-anchor="middle" fill="#7bc96f" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">One valid DFS order (stack): A, B, D, F, C, E</text>
<text x="450" y="446" text-anchor="middle" fill="#8a8a8a" font-size="12.5" font-family="Charis SIL, Georgia, serif">dives to the end of one path, then backtracks: topological sort, cycle checks</text>
<text x="450" y="500" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Both visit each node once: O(V + E) time.</text>
</svg>
