436.0' y='190' width='26.0' height='40' fill='#ffb74d' fill-opacity='0.30' stroke='#ffb74d'/><text x='423.0' y='216' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ececec' text-anchor='middle' >K</text><text x='449.0' y='216' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ececec' text-anchor='middle' >V</text><text x='150' y='256' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#a8a8a8' text-anchor='start' >… × 40 layers in the worked example</text><text x='150' y='280' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#a8a8a8' text-anchor='start' >each layer has its own K/V grid like this one</text><rect x='520' y='60' width='420' height='210' rx='10' fill='#64b5f6' fill-opacity='0.1' stroke='#64b5f6' stroke-width='2'/><text x='540' y='96' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='600' >bytes per token (worked example)</text><text x='540' y='124' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='start' >per token, per layer: 8,192 values (K+V, 32 heads, 128 dim)</text><text x='540' y='154' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='start' >× 40 layers = 327,680 values</text><text x='540' y='184' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='start' >× 2 bytes (fp16) = 655,360 bytes ≈ 0.625 MB / token</text><text x='540' y='214' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ffb74d' text-anchor='start' >2,048-token sequence → ≈ 1.28 GB of KV cache</text><text x='540' y='250' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#a8a8a8' text-anchor='start' >fixed by the model shape; longer answers only add tokens</text><text x='20' y='400' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='start' >The cache is big, and it grows while the model writes. That growth is the whole serving-cost story:</text><text x='20' y='424' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='start' >every concurrent sequence rents its own slice of GPU memory for the entire answer.</text></svg>