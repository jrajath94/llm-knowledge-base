<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The release gate: zero smoke regressions, ten percent family break rate</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">a gate is a promise with a number on it</text>
<rect x="24" y="110" width="400" height="110" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SMOKE: 0 regressions</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">the 20 attacks that always worked must still be</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">caught; a single regression fails the gate</text>
<rect x="456" y="110" width="400" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">FAMILY: &lt;= 10% break rate</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">no attack family breaks more than one in ten; the</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">weakest family sets the grade</text>
<line x1="440" y1="250" x2="440" y2="300" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,300 436.33015592246386,291.78219953718923 443.66984407753614,291.78219953718923" fill="#8a8a8a"/>
<rect x="240" y="300" width="400" height="110" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="326" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">GATE DECISION</text>
<text x="440.0" y="344" font-size="11" fill="#a8a8a8" text-anchor="middle">both bars hold: ship with monitoring; either fails:</text>
<text x="440.0" y="359" font-size="11" fill="#a8a8a8" text-anchor="middle">fix, re-run the full eval, no exceptions</text>
<text x="24" y="460" font-size="12" fill="#a8a8a8" text-anchor="start">The gate runs on every release candidate, not just major versions. A prompt tweak is a release.</text>
</svg>