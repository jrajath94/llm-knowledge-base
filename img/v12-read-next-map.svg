<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 349" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Where to go next: grouped by which spine paper each extends"><rect x="22" y="14" width="916" height="321" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">WHAT TO READ NEXT</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The spine ends; the literature does not. Read each follow-on with the spine paper</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">it extends in hand.</text><path d="M 53.7 111.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="116" font-size="13.5" font-weight="700" fill="#ececec">Transformer and attention:</text><text x="291.454296875" y="116" font-size="13.5" fill="#a8a8a8">ALiBi (RoPE alternative), FlashAttention-2, Grouped-Query Attention.</text><path d="M 53.7 142.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="147" font-size="13.5" font-weight="700" fill="#ececec">Scaling:</text><text x="145.46234375" y="147" font-size="13.5" fill="#a8a8a8">PaLM (the dense counterpoint), LLaMA-2 (GQA, 2T tokens, the chat recipe).</text><path d="M 53.7 173.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="178" font-size="13.5" font-weight="700" fill="#ececec">Alignment and preference:</text><text x="289.235234375" y="178" font-size="13.5" fill="#a8a8a8">Learning to Summarize (the RLHF recipe), RLAIF, KTO (no paired data</text><text x="80" y="197" font-size="13.5" fill="#a8a8a8">needed).</text><path d="M 53.7 223.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="228" font-size="13.5" font-weight="700" fill="#ececec">Reasoning and prompting:</text><text x="287.04359375" y="228" font-size="13.5" fill="#a8a8a8">Chain-of-Thought, Tree of Thoughts, DeepSeekMath/GRPO (behind R1&#x27;s</text><text x="80" y="247" font-size="13.5" fill="#a8a8a8">optimizer).</text><path d="M 53.7 273.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="278" font-size="13.5" font-weight="700" fill="#ececec">Agents and retrieval:</text><text x="246.49296875000002" y="278" font-size="13.5" fill="#a8a8a8">Toolformer (learned tool use), Self-RAG (the model decides when to retrieve).</text><path d="M 53.7 304.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="309" font-size="13.5" font-weight="700" fill="#ececec">Efficiency:</text><text x="162.5778125" y="309" font-size="13.5" fill="#a8a8a8">Outrageously Large Neural Networks (the original MoE), DeepSeek-V3 (671B total, 37B</text><text x="80" y="328" font-size="13.5" fill="#a8a8a8">active).</text></svg>