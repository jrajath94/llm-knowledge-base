<svg xmlns='http://www.w3.org/2000/svg' width='700' height='420' viewBox='0 0 700 420' font-family='DejaVu Sans'>
<rect width='700' height='420' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Least squares as projection: Xw is the closest point to y in the column space of X</text>
<polygon points='120,330 520,330 620,150 220,150' fill='#151515' stroke='#9a9a9a' stroke-width='1.5'/>
<text x='330' y='140' font-size='12' fill='#9a9a9a' text-anchor='middle'>column space of X</text>
<line x1='180' y1='300' x2='260' y2='190' stroke='#8fc7ff' stroke-width='2'/>
<polygon points='260,190 252,186.5 252,193.5' fill='#8fc7ff'/>
<text x='200' y='250' font-size='11' fill='#8fc7ff' text-anchor='start'>col1</text>
<line x1='180' y1='300' x2='340' y2='200' stroke='#8fc7ff' stroke-width='2'/>
<polygon points='340,200 332,196.5 332,203.5' fill='#8fc7ff'/>
<text x='300' y='255' font-size='11' fill='#8fc7ff' text-anchor='start'>col2</text>
<line x1='430' y1='130' x2='430' y2='290' stroke='#f0b429' stroke-width='2.5' stroke-dasharray='5,4'/>
<polygon points='430,290 422,286.5 422,293.5' fill='#f0b429'/>
<text x='440' y='215' font-size='12' fill='#f0b429' text-anchor='start'>residual r = y - Xw</text>
<circle cx='430' cy='120' r='6' fill='#ff7b8a'/>
<text x='430' y='105' font-size='14' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>y</text>
<circle cx='430' cy='290' r='6' fill='#7fd08a'/>
<text x='505' y='300' font-size='12' fill='#7fd08a' text-anchor='start'>Xw (projection)</text>
<polyline points='430,272 448,272 448,290' fill='none' stroke='#f0b429' stroke-width='2'/>
<text x='60' y='380' font-size='12' fill='#9a9a9a' text-anchor='start'>The residual r is orthogonal to every column of X. That demand is the normal equations.</text>
</svg>