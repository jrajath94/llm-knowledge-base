<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
<rect width="560" height="300" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>What Gate 2 actually reviews: the record</text><text x='40' y='80' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='start'>"Learning rate 0.05 beat 0.1 by 0.4 points"</text><text x='40' y='104' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>is not a record.</text><text x='40' y='150' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>hypothesis: lower LR reduces overfitting on 20k rows</text><text x='40' y='174' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>config v3  |  data snapshot 2026-09-01</text><text x='40' y='198' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>+0.4 AUC on validation, leakage checks clean</text><text x='40' y='222' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>failed runs recorded too</text><text x='20' y='270' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>A discarded hypothesis stops the team from re-running it in six months.</text></svg>