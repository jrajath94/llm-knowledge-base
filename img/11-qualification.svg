<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Labeler qualification with gold items">
<rect x="14" y="12" width="932" height="356" rx="10" fill="#141414" stroke="#2e2e2e"/>
<text x="32" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">QUALIFICATION</text>
<text x="32" y="72" font-size="16" font-weight="700" fill="#ececec">Nobody labels before passing the gold test</text>
<rect x="32" y="96" width="205" height="238" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="46" y="126" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#6cb2ff">INSTRUCTION PACKET</text>
<text x="46" y="156" font-size="12.5" fill="#a8a8a8">Learn the rubric first.</text>
<line x1="237" y1="215" x2="257" y2="215" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 248 210 L 257 215 L 248 220" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="257" y="96" width="205" height="238" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="271" y="126" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#6cb2ff">GOLD BATCH</text>
<text x="271" y="156" font-size="12.5" fill="#a8a8a8">30 to 50 items.</text>
<text x="271" y="178" font-size="12.5" fill="#a8a8a8">Answers already known.</text>
<line x1="462" y1="215" x2="482" y2="215" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 473 210 L 482 215 L 473 220" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="482" y="96" width="205" height="238" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="496" y="126" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#6cb2ff">THE BAR: 80%</text>
<text x="496" y="156" font-size="12.5" fill="#a8a8a8">Hard floor on easy items.</text>
<text x="496" y="178" font-size="12.5" fill="#a8a8a8">Fail once: retrain.</text>
<text x="496" y="200" font-size="12.5" fill="#a8a8a8">Fail twice: not hired.</text>
<line x1="687" y1="215" x2="707" y2="215" stroke="#6cb2ff" stroke-width="2.4"/>
<path d="M 698 210 L 707 215 L 698 220" stroke="#6cb2ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="707" y="96" width="205" height="238" rx="8" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="721" y="126" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#6cb2ff">PRODUCTION</text>
<text x="721" y="156" font-size="12.5" fill="#a8a8a8">5% gold items seeded</text>
<text x="721" y="178" font-size="12.5" fill="#a8a8a8">in every batch.</text>
<text x="721" y="200" font-size="12.5" fill="#a8a8a8">Drift below bar: pause.</text>
<text x="32" y="358" font-size="12.5" fill="#ececec">Qualification never ends. The seeded gold items keep watching.</text>
</svg>
