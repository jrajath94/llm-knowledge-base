<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-labelledby="t08co-title t08co-desc">
<title id="t08co-title">Chunking with overlap: no sentence is cut in half</title>
<desc id="t08co-desc">A long document strip cut into three chunks of 256 tokens with 32 tokens of overlap. The overlap regions are shaded gold. A callout shows a sentence that would be split without overlap, kept whole with it.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="400" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">CHUNKING WITH OVERLAP</text>
<rect x="30" y="100" width="880" height="54" rx="6" fill="#161616" stroke="#262626" stroke-width="1.5"/>
<text x="45" y="134" class="dl" fill="#a8a8a8">document: 700 tokens</text>
<rect x="30" y="180" width="320" height="54" rx="6" fill="#1b2a4a" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="190.0" y="213" class="tl" fill="#ececec">chunk 1</text>
<rect x="318" y="180" width="320" height="54" rx="6" fill="#1b2a4a" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="478.0" y="213" class="tl" fill="#ececec">chunk 2</text>
<rect x="606" y="180" width="304" height="54" rx="6" fill="#1b2a4a" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="758.0" y="213" class="tl" fill="#ececec">chunk 3</text>
<rect x="318" y="180" width="32" height="54" rx="6" fill="#f0b429" opacity="0.35"/>
<rect x="606" y="180" width="32" height="54" rx="6" fill="#f0b429" opacity="0.35"/>
<text x="470" y="270" class="tl" fill="#f0b429">overlap: 32 tokens</text>
<text x="30" y="300" class="dl">Without overlap, a sentence on the boundary is cut in half and neither chunk can answer.</text>
<text x="30" y="322" class="dl">With overlap, the boundary sentence appears whole in one chunk.</text>
<text x="30" y="364" class="capl">How to read: blue blocks are chunks. Gold strips are shared text between neighbors.</text>
</g>
<defs><marker id="t08co-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>