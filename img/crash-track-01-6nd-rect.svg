<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" style="max-width:760px" role="img" aria-label="Two rectangles of similar area: GPT-3 tall and thin at 1.7 tokens per param, Chinchilla short and wide at 20 tokens per param.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">6ND is an area: params x tokens</text>
<rect x="90" y="70" width="110" height="200" rx="8" class="box"/>
<text x="145" y="285" text-anchor="middle" class="big">GPT-3</text>
<text x="145" y="303" text-anchor="middle" class="m">175B x 300B</text>
<text x="145" y="60" text-anchor="middle" class="s">1.7 tok/param</text>
<rect x="400" y="130" width="260" height="140" rx="8" class="box"/>
<text x="530" y="285" text-anchor="middle" class="big">Chinchilla</text>
<text x="530" y="303" text-anchor="middle" class="m">70B x 1.4T</text>
<text x="530" y="120" text-anchor="middle" class="s">20 tok/param</text>
<text x="300" y="150" text-anchor="middle" class="lbl">similar area = similar compute</text>
<path class="arr" d="M205 170 L395 170"/>
<text x="145" y="250" text-anchor="middle" class="num">3.15e23</text>
<text x="530" y="250" text-anchor="middle" class="num">5.88e23</text>
<text x="24" y="328" text-anchor="start" class="s">Area = 6 x N x D. Same area, different shape: the shape is the recipe choice.</text>
</svg>