<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The practiced sequence for the first hour"><rect x="22" y="14" width="916" height="300" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">INCIDENT RESPONSE</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">ML incidents are silent quality drops, not crashes: detect, then move in order</text><rect x="38" y="96" width="213.12812499999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="58" y="123" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Detect</text><text x="54" y="144" font-size="12" fill="#a8a8a8">the dashboard crosses a</text><text x="54" y="160" font-size="12" fill="#a8a8a8">real threshold, not</text><text x="54" y="176" font-size="12" fill="#a8a8a8">eyeballing</text><line x1="261.12812499999995" y1="144.0" x2="275.12812499999995" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="275.12812499999995,139.0 283.12812499999995,144.0 275.12812499999995,149.0" fill="#a8a8a8"/><rect x="291.12812499999995" y="96" width="230.26172499999996" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="311.12812499999995" cy="118" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="311.12812499999995" y="123" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">2</text><text x="331.12812499999995" y="123" font-size="13.5" font-weight="700" fill="#ececec">Triage</text><text x="307.12812499999995" y="144" font-size="12" fill="#a8a8a8">scope the damage: which</text><text x="307.12812499999995" y="160" font-size="12" fill="#a8a8a8">models, which users, since</text><text x="307.12812499999995" y="176" font-size="12" fill="#a8a8a8">when</text><line x1="531.3898499999999" y1="144.0" x2="545.3898499999999" y2="144.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="545.3898499999999,139.0 553.3898499999999,144.0 545.3898499999999,149.0" fill="#a8a8a8"/><rect x="561.3898499999999" y="96" width="188.6291125" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="581.3898499999999" cy="118" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="581.3898499999999" y="123" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">3</text><text x="601.3898499999999" y="123" font-size="13.5" font-weight="700" fill="#ececec">Mitigate first</text><text x="577.3898499999999" y="144" font-size="12" fill="#a8a8a8">rollback before you</text><text x="577.3898499999999" y="160" font-size="12" fill="#a8a8a8">understand: stop the</text><text x="577.3898499999999" y="176" font-size="12" fill="#a8a8a8">bleeding</text><rect x="38" y="216" width="222.83657499999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="238" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="58" y="243" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">4</text><text x="78" y="243" font-size="13.5" font-weight="700" fill="#ececec">Fix second</text><text x="54" y="264" font-size="12" fill="#a8a8a8">repair the root cause with</text><text x="54" y="280" font-size="12" fill="#a8a8a8">the pressure off</text><line x1="270.836575" y1="264.0" x2="284.836575" y2="264.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="284.836575,259.0 292.836575,264.0 284.836575,269.0" fill="#a8a8a8"/><rect x="300.836575" y="216" width="218.25006249999998" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="320.836575" cy="238" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="320.836575" y="243" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">5</text><text x="340.836575" y="243" font-size="13.5" font-weight="700" fill="#ececec">Verify third</text><text x="316.836575" y="264" font-size="12" fill="#a8a8a8">quality back at baseline,</text><text x="316.836575" y="280" font-size="12" fill="#a8a8a8">proven by the dashboard</text><line x1="529.0866375" y1="264.0" x2="543.0866375" y2="264.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="543.0866375,259.0 551.0866375,264.0 543.0866375,269.0" fill="#a8a8a8"/><rect x="559.0866375" y="216" width="237.4612" height="96" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="579.0866375" cy="238" r="11" fill="#e07878" fill-opacity="0.18" stroke="#e07878"/><text x="579.0866375" y="243" font-size="13" font-weight="700" fill="#e07878" text-anchor="middle">6</text><text x="599.0866375" y="243" font-size="13.5" font-weight="700" fill="#ececec">Review last</text><text x="575.0866375" y="264" font-size="12" fill="#a8a8a8">blameless postmortem with</text><text x="575.0866375" y="280" font-size="12" fill="#a8a8a8">owned action items</text></svg>