<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-label="Training step phases on a timeline">
<rect width="720" height="432" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">One training step: four phases, and how they overlap</text>
<text x="210" y="86" text-anchor="end" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">forward pass</text>
<line x1="220" y1="78" x2="560" y2="78" stroke="#222" stroke-width="22"/>
<line x1="237" y1="78" x2="322" y2="78" stroke="#58a6ff" stroke-width="22"/>
<text x="572" y="82" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">compute-bound matmuls</text>
<text x="210" y="142" text-anchor="end" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">backward pass</text>
<line x1="220" y1="134" x2="560" y2="134" stroke="#222" stroke-width="22"/>
<line x1="305" y1="134" x2="475" y2="134" stroke="#f0b429" stroke-width="22"/>
<text x="572" y="138" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">~2x forward compute</text>
<text x="210" y="198" text-anchor="end" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">grad communication</text>
<line x1="220" y1="190" x2="560" y2="190" stroke="#222" stroke-width="22"/>
<line x1="339" y1="190" x2="458" y2="190" stroke="#3fb950" stroke-width="22"/>
<text x="572" y="194" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">overlaps backward</text>
<text x="210" y="254" text-anchor="end" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">optimizer step</text>
<line x1="220" y1="246" x2="560" y2="246" stroke="#222" stroke-width="22"/>
<line x1="475" y1="246" x2="509" y2="246" stroke="#8a8a8a" stroke-width="22"/>
<text x="572" y="250" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">memory-bound updates</text>
<text x="210" y="310" text-anchor="end" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">data loading</text>
<line x1="220" y1="302" x2="560" y2="302" stroke="#222" stroke-width="22"/>
<line x1="220" y1="302" x2="560" y2="302" stroke="#e5484d" stroke-width="22"/>
<text x="572" y="306" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">must stay overlapped</text>
<text x="360" y="385" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">the ideal trace: compute and communication interleaved, network busy while SMs are busy</text>
<text x="360" y="407" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">your job: name each gap</text>
</svg>