<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Three drift mechanisms that rot long horizon agent runs: context rot, error compounding, state drift">
<rect width="800" height="520" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Long-horizon drift: three mechanisms</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Short tasks are 5 steps. Long-horizon tasks are 50 or 500. As steps accumulate, three things rot.</text>

<!-- Timeline axis -->
<line x1="60" y1="100" x2="740" y2="100" stroke="#555" stroke-width="2"/>
<polygon points="740,100 726,94 726,106" fill="#555"/>
<text x="60" y="88" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">5 steps</text>
<text x="400" y="88" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">50 steps</text>
<text x="700" y="88" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">500 steps</text>

<!-- Lane 1: context rot -->
<g>
<rect x="40" y="130" width="720" height="105" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="60" y="162" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#6cb2ff">Context rot</text>
<text x="60" y="190" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">The window fills with old tool outputs. The original goal slides out of attention.</text>
<text x="60" y="212" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">The agent starts optimizing a subgoal it invented three hours ago.</text>
</g>

<!-- Lane 2: error compounding -->
<g>
<rect x="40" y="255" width="720" height="105" rx="10" fill="#1a1a1a" stroke="#e08080" stroke-width="1.5"/>
<text x="60" y="287" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#e08080">Error compounding</text>
<text x="60" y="315" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Each step has a small chance of a slightly wrong tool call. Errors do not cancel. They stack.</text>
<text x="60" y="337" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">2% per-step error over 50 steps: 64% chance something went wrong (1 - 0.98^50).</text>
</g>

<!-- Lane 3: state drift -->
<g>
<rect x="40" y="380" width="720" height="105" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="60" y="412" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="bold" fill="#f0b429">State drift</text>
<text x="60" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">The agent acts on stale beliefs about a world that changed while it worked.</text>
<text x="60" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">The final answer can look clean while resting on a corrupted intermediate.</text>
</g>

<text x="400" y="508" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#2e9e5b">A bigger context window delays context rot. It does not fix error compounding or state drift.</text>
</svg>
