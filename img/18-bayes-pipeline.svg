<svg xmlns='http://www.w3.org/2000/svg' width='760' height='420' viewBox='0 0 760 420' font-family='DejaVu Sans'>
<rect width='760' height='420' fill='#0a0a0a'/>
<text x='380' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Bayes, step by step: prior, likelihoods, total, posterior, simulation</text>
<rect x='40' y='100' width='120' height='120' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='100' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>prior</text>
<text x='100' y='156' font-size='12' fill='#e8e8e8' text-anchor='middle'>P(D) = 1%</text>
<rect x='180' y='100' width='120' height='120' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='240' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>likelihoods</text>
<text x='240' y='156' font-size='12' fill='#e8e8e8' text-anchor='middle'>P(+|D) = 99%</text>
<text x='240' y='176' font-size='12' fill='#e8e8e8' text-anchor='middle'>P(+|healthy) = 5%</text>
<rect x='330' y='100' width='120' height='120' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='390' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>total P(+)</text>
<text x='390' y='156' font-size='12' fill='#e8e8e8' text-anchor='middle'>99 + 495 = 594</text>
<text x='390' y='176' font-size='12' fill='#e8e8e8' text-anchor='middle'>per 10,000</text>
<rect x='480' y='100' width='120' height='120' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='540' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>posterior</text>
<text x='540' y='156' font-size='12' fill='#e8e8e8' text-anchor='middle'>99 / 594</text>
<text x='540' y='176' font-size='12' fill='#e8e8e8' text-anchor='middle'>= 16.7%</text>
<rect x='620' y='100' width='120' height='120' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='680' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>simulation</text>
<text x='680' y='156' font-size='12' fill='#e8e8e8' text-anchor='middle'>sample patients,</text>
<text x='680' y='176' font-size='12' fill='#e8e8e8' text-anchor='middle'>confirm 16.7%</text>
<line x1='160' y1='160' x2='180' y2='160' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='180,160 172,156.5 172,163.5' fill='#e8e8e8'/>
<line x1='300' y1='160' x2='330' y2='160' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='330,160 322,156.5 322,163.5' fill='#e8e8e8'/>
<line x1='450' y1='160' x2='480' y2='160' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='480,160 472,156.5 472,163.5' fill='#e8e8e8'/>
<line x1='600' y1='160' x2='620' y2='160' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='620,160 612,156.5 612,163.5' fill='#e8e8e8'/>
<text x='380' y='280' font-size='12' fill='#9a9a9a' text-anchor='middle'>A "99% accurate test" still gives only 16.7% P(sick | positive): the base rate rules.</text>
<text x='380' y='310' font-size='12' fill='#9a9a9a' text-anchor='middle'>The simulation check verifies the closed form. Monte Carlo is the habit.</text>
<text x='380' y='355' font-size='12' fill='#f0b429' text-anchor='middle'>Chaining many likelihoods? Sum logs, never multiply raw probabilities.</text>
</svg>