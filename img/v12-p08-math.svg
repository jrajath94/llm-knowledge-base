<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The Bradley-Terry reward loss, with worked numbers"><rect x="22" y="14" width="916" height="282" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">loss = -log(sigma(r(chosen) - r(rejected)))</text><rect x="110.35354687500006" y="94" width="739.2929062499999" height="92" rx="8" fill="#0d0d0d" stroke="#6cb2ff" stroke-opacity="0.45"/><text x="128.35354687500006" y="124" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">r(chosen) = 2.1, r(rejected) = 0.4</text><text x="128.35354687500006" y="148" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">diff = 1.7 -&gt; sigma = 0.846 -&gt; loss = 0.167</text><text x="128.35354687500006" y="172" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">reversed: diff = -1.7 -&gt; sigma = 0.154 -&gt; loss = 1.87 (10x larger)</text><text x="38" y="204" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">r</text><text x="242" y="204" font-size="13" fill="#a8a8a8">the reward model score for a response</text><text x="38" y="227" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">sigma</text><text x="242" y="227" font-size="13" fill="#a8a8a8">the sigmoid: turns a score gap into a probability</text><text x="38" y="250" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">lesson</text><text x="242" y="250" font-size="13" fill="#a8a8a8">the loss only cares about the ORDER, never the absolute scores</text><text x="38" y="273" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">PPO objective</text><text x="242" y="273" font-size="13" fill="#a8a8a8">maximize E[r] - beta * KL(policy || SFT), beta ~ 0.02: the KL term charges per nat of drift</text></svg>