<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Four common profile misreads">
<rect width="720" height="400" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Four ways to misread a profile</text>
<rect class="box" x="80" y="58" width="560" height="62" rx="8"/>
<line x1="80" y1="58" x2="80" y2="120" stroke="#f0b429" stroke-width="4"/>
<text x="106" y="82" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">first-step noise</text>
<text x="106" y="103" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">compilation, autotuning, allocator warm-up: never profile step 1</text>
<rect class="box" x="80" y="130" width="560" height="62" rx="8"/>
<line x1="80" y1="130" x2="80" y2="192" stroke="#58a6ff" stroke-width="4"/>
<text x="106" y="154" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">profiler overhead</text>
<text x="106" y="175" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">Nsys slows the run: compare profiles to profiles, not to clean runs</text>
<rect class="box" x="80" y="202" width="560" height="62" rx="8"/>
<line x1="80" y1="202" x2="80" y2="264" stroke="#3fb950" stroke-width="4"/>
<text x="106" y="226" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">thermal throttling</text>
<text x="106" y="247" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">a rank fine for an hour then slow is heat: check nvidia-smi first</text>
<rect class="box" x="80" y="274" width="560" height="62" rx="8"/>
<line x1="80" y1="274" x2="80" y2="336" stroke="#e5484d" stroke-width="4"/>
<text x="106" y="298" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">the average lie</text>
<text x="106" y="319" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">50% MFU average can hide 90% on half the ranks: look at the distribution</text>
<text x="360" y="375" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">distrust the first step and the mean</text>
</svg>