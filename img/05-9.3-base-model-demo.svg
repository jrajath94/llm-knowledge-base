<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="440" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The demo that makes the boundary visceral</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">same model, same knowledge: behavior is pattern-matching all the way down</text>
<rect x="24" y="94" width="408" height="180" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6"/>
<text x="228" y="122" font-size="12" fill="#a8a8a8" text-anchor="middle">prompt: &quot;Q: What is the capital</text>
<text x="228" y="140" font-size="12" fill="#a8a8a8" text-anchor="middle">of France? A:&quot;</text>
<text x="228" y="172" font-size="12" fill="#8a8a8a" text-anchor="middle">base model continues:</text>
<text x="228" y="200" font-size="17" font-weight="bold" fill="#7dd87d" text-anchor="middle">&quot;Paris.&quot;</text>
<text x="228" y="226" font-size="12" fill="#8a8a8a" text-anchor="middle">Q/A patterns are in the data,</text>
<text x="228" y="244" font-size="12" fill="#8a8a8a" text-anchor="middle">so &quot;A:&quot; is continued correctly</text>
<rect x="448" y="94" width="408" height="180" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="652" y="122" font-size="12" fill="#a8a8a8" text-anchor="middle">prompt: &quot;Q: What is the capital</text>
<text x="652" y="140" font-size="12" fill="#a8a8a8" text-anchor="middle">of France?&quot;</text>
<text x="652" y="172" font-size="12" fill="#8a8a8a" text-anchor="middle">base model continues:</text>
<text x="652" y="200" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="middle">&quot;Q: What is the capital of Spain?&quot;</text>
<text x="652" y="226" font-size="12" fill="#8a8a8a" text-anchor="middle">it is continuing a quiz,</text>
<text x="652" y="244" font-size="12" fill="#8a8a8a" text-anchor="middle">not answering you</text>
<text x="24" y="310" font-size="13" fill="#f0b429" text-anchor="start">A base model does not answer questions. It continues text. Instruction-following is a post-training behavior (Volume 7).</text>
</svg>