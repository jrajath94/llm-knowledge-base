<svg xmlns="http://www.w3.org/2000/svg" width="720" height="467" viewBox="0 0 720 467" role="img" aria-label="Capability-safety Pareto frontier">
<rect width="720" height="467" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Capability vs safety: the Pareto frontier</text>
<path d="M110,72 L121,72 L131,72 L142,72 L152,73 L163,73 L174,74 L184,74 L195,75 L205,76 L216,77 L227,78 L237,79 L248,80 L258,81 L269,83 L280,84 L290,86 L301,88 L311,89 L322,91 L333,93 L343,95 L354,97 L364,100 L375,102 L386,104 L396,107 L407,110 L417,112 L428,115 L439,118 L449,121 L460,124 L470,127 L481,131 L492,134 L502,138 L513,141 L523,145 L534,149 L545,153 L555,157 L566,161 L576,165 L587,169 L598,174 L608,178 L619,183 L629,187 L640,192" stroke="#f0b429" stroke-width="3" fill="none"/>
<circle cx="269" cy="120" r="6" fill="#e5484d"/>
<text x="281.0" y="114.0" text-anchor="start" fill="#ececec" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">release A: strong, safe</text>
<circle cx="439" cy="162" r="6" fill="#e5484d"/>
<text x="450.6" y="156.0" text-anchor="start" fill="#ececec" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">release B: stronger, edgier</text>
<circle cx="576" cy="240" r="6" fill="#e5484d"/>
<text x="564.4" y="234.0" text-anchor="end" fill="#ececec" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">past the frontier: not shippable</text>
<line x1="110" y1="360" x2="640" y2="360" stroke="#555" stroke-width="1.5"/>
<line x1="110" y1="360" x2="110" y2="60" stroke="#555" stroke-width="1.5"/>
<text x="375.0" y="394" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">capability</text>
<text x="52" y="210" text-anchor="middle" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" transform="rotate(-90 52 210)">safety</text>
<text x="360" y="420" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">every release sits on or inside the frontier: pushing capability costs safety</text>
<text x="360" y="442" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">unless the training itself moves the frontier outward</text>
</svg>