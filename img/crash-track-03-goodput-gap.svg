<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="100%" style="max-width:680px" role="img" aria-label="Throughput versus goodput: goodput collapses past the admission cliff while throughput looks busy">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Throughput counts work done. Goodput counts work delivered.</text>
<text class="m" x="24" y="52">Evicted sequences get recomputed: busy graphs, waiting users.</text>
<line class="ax" x1="80" y1="300" x2="640" y2="300"/>
<line class="ax" x1="80" y1="300" x2="80" y2="70"/>
<text class="m" x="360" y="328" text-anchor="middle">admitted sequences (load)</text>
<text class="m" x="34" y="185" text-anchor="middle">tokens/s</text>
<polyline points="80,300 100,289 120,278 140,267 160,256 180,245 200,234 220,223 240,212 260,201 280,190 300,179 320,168 340,157 360,146 380,135 400,124 420,113 440,110 460,110 480,110 500,110 520,110 540,110 560,110 580,110 600,110 620,110 640,110" fill="none" stroke="#6cb2ff" stroke-width="2.5"/>
<polyline points="80,300 100,289 120,278 140,267 160,256 180,245 200,234 220,223 240,212 260,201 280,190 300,179 320,168 340,157 360,146 380,135 400,139 420,143 440,155 460,170 480,185 500,200 520,215 540,230 560,245 580,260 600,275 620,290 640,305" fill="none" stroke="#7fc97f" stroke-width="2.5"/>
<line x1="380" y1="70" x2="380" y2="300" stroke="#e57373" stroke-width="1.5" stroke-dasharray="6,5"/>
<text class="r" x="392" y="90">admission cliff</text>
<text class="b" x="500" y="130">throughput</text>
<text class="gr" x="470" y="270">goodput</text>
<rect class="box" x="24" y="348" width="632" height="56" rx="8"/>
<text class="m" x="40" y="372">Watch together: preemptions per minute and tokens/sec/GPU.</text>
<text class="m" x="40" y="392">When the first rises and the second falls, you are past the admission cliff.</text>
</svg>
