<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="600" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Generation dominates the RL step</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Decoding is memory-bandwidth bound: one token costs a full read of the weights</text>
<text x="24" y="116" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Generate rollouts</text>
<rect x="230" y="94" width="563.2" height="30" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="803.2" y="115" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">88%</text>
<text x="24" y="138" font-size="11" fill="#8a8a8a" text-anchor="start">autoregressive: one token at a time</text>
<text x="24" y="182" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Score (verifier / RM)</text>
<rect x="230" y="160" width="44.800000000000004" height="30" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="284.8" y="181" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="start">7%</text>
<text x="24" y="204" font-size="11" fill="#8a8a8a" text-anchor="start">forward passes, parallel</text>
<text x="24" y="248" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Gradient update</text>
<rect x="230" y="226" width="32.0" height="30" fill="#b388ff" rx="4" opacity="1"/>
<text x="272.0" y="247" font-size="13" font-weight="bold" fill="#b388ff" text-anchor="start">5%</text>
<text x="24" y="270" font-size="11" fill="#8a8a8a" text-anchor="start">big matmuls, compute-bound</text>
<rect x="24" y="302" width="852" height="156" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="334" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">The arithmetic</text>
<text x="48" y="364" font-size="11" fill="#a8a8a8" text-anchor="start">7B in bf16 = 14 GB of weights. At ~3 TB/s of memory bandwidth, reading every weight for one token sets a</text>
<text x="48" y="381" font-size="11" fill="#a8a8a8" text-anchor="start">hard ceiling near 200 tokens per second per GPU. Real systems land well below it once batching overhead</text>
<text x="48" y="398" font-size="11" fill="#a8a8a8" text-anchor="start">and the KV cache are counted.</text>
<text x="24" y="482" font-size="11" fill="#8a8a8a" text-anchor="start">This is why Appendix A.2 puts vLLM or SGLang inside the loop: generation must run at inference-engine speed, not training-script</text>
<text x="24" y="499" font-size="11" fill="#8a8a8a" text-anchor="start">speed.</text>
</svg>