<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t10cap-title t10cap-desc">
<title id="t10cap-title">CAP theorem: pick two</title>
<desc id="t10cap-desc">A triangle with Consistency, Availability, and Partition tolerance at the corners. Each edge is labeled with the pair it sacrifices: CP systems give up availability, AP systems give up consistency, CA is impossible when partitions happen. A note says partitions will happen, so the real choice is CP or AP.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="470" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">CAP THEOREM (PICK TWO)</text>
<circle cx="470" cy="100" r="58" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="470" y="94" class="box" fill="#6ab0ff">Consistency</text>
<circle cx="270" cy="360" r="58" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="270" y="354" class="box" fill="#7fd67f">Availability</text>
<circle cx="670" cy="360" r="58" fill="#111111" stroke="#ff7a7a" stroke-width="1.5"/>
<text x="670" y="354" class="box" fill="#ff7a7a">Partition</text>
<text x="670" y="374" class="box" fill="#ff7a7a">tolerance</text>
<line x1="470" y1="100" x2="270" y2="360" stroke="#a8a8a8" stroke-width="2"/>
<line x1="270" y1="360" x2="670" y2="360" stroke="#a8a8a8" stroke-width="2"/>
<line x1="670" y1="360" x2="470" y2="100" stroke="#a8a8a8" stroke-width="2"/>
<text x="470" y="120" class="dl" fill="#6ab0ff">CP: consistent, may refuse</text>
<text x="200" y="400" class="dl" fill="#7fd67f">AP: always answers, may disagree</text>
<text x="30" y="440" class="capl">Partitions will happen. The real choice is CP or AP. CA exists only without networks.</text>
</g>
<defs><marker id="t10cap-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>