<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="sans-serif">
<rect width="700" height="400" fill="#ffffff"/>
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
</marker>
</defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">Little's Law: Queue = Rate x Wait</text>
<rect x="50" y="100" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="125.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Queue</text>
<text x="125.0" y="148" text-anchor="middle" font-size="11" fill="#555">200 requests</text>
<rect x="275" y="100" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="350.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Rate</text>
<text x="350.0" y="148" text-anchor="middle" font-size="11" fill="#555">100 req/s</text>
<rect x="500" y="100" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="575.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Wait</text>
<text x="575.0" y="148" text-anchor="middle" font-size="11" fill="#555">2 seconds</text>
<line x1="200" y1="135" x2="275" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="237.5" y="127.0" text-anchor="middle" font-size="10" fill="#333">=</text>
<line x1="425" y1="135" x2="500" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="462.5" y="127.0" text-anchor="middle" font-size="10" fill="#333">x</text>
<text x="350" y="220" text-anchor="middle" font-size="14">200 = 100 x 2</text>
<text x="350" y="260" text-anchor="middle" font-size="12" fill="#555">If wait must be under 2s, bound the queue at 200.</text>
<text x="350" y="285" text-anchor="middle" font-size="12" fill="#555">Reject the 201st fast. Do not queue it slow.</text>
</svg>
