<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="'Charis SIL',Georgia,serif">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" />
</marker>
</defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Little's Law: Queue = Rate x Wait</text>
<rect x="50" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="125.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Queue</text>
<text x="125.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">200 requests</text>
<rect x="275" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="350.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Rate</text>
<text x="350.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">100 req/s</text>
<rect x="500" y="100" width="150" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="575.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Wait</text>
<text x="575.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">2 seconds</text>
<line x1="200" y1="135" x2="275" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="237.5" y="127.0" text-anchor="middle" font-size="10" fill="#8a8a8a">=</text>
<line x1="425" y1="135" x2="500" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="462.5" y="127.0" text-anchor="middle" font-size="10" fill="#8a8a8a">x</text>
<text x="350" y="220" text-anchor="middle" font-size="14" style="fill:#ececec">200 = 100 x 2</text>
<text x="350" y="260" text-anchor="middle" font-size="12" fill="#a8a8a8">If wait must be under 2s, bound the queue at 200.</text>
<text x="350" y="285" text-anchor="middle" font-size="12" fill="#a8a8a8">Reject the 201st fast. Do not queue it slow.</text>
</svg>