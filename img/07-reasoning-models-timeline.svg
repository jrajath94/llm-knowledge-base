<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="640" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">What the reasoning recipe produced</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">GRPO plus verifiable rewards, run at frontier scale (as reported in the DeepSeek-R1 report)</text>
<line x1="60" y1="200" x2="840" y2="200" stroke="#8a8a8a" stroke-width="2"/>
<circle cx="240" cy="200" r="10" fill="#4fd1a5"/>
<circle cx="660" cy="200" r="10" fill="#6cb2ff"/>
<text x="240" y="176" font-size="15" font-weight="bold" fill="#4fd1a5" text-anchor="middle">R1-Zero</text>
<text x="660" y="176" font-size="15" font-weight="bold" fill="#6cb2ff" text-anchor="middle">Production R1</text>
<text x="240" y="232" font-size="11" fill="#a8a8a8" text-anchor="middle">pure RL, verifiable rewards</text>
<text x="240" y="251" font-size="11" fill="#a8a8a8" text-anchor="middle">from the base model: no SFT</text>
<text x="240" y="270" font-size="11" fill="#a8a8a8" text-anchor="middle">on reasoning traces</text>
<text x="240" y="289" font-size="11" fill="#a8a8a8" text-anchor="middle">long chain-of-thought emerged</text>
<text x="240" y="308" font-size="11" fill="#a8a8a8" text-anchor="middle">&quot;aha moment&quot;: the model learned</text>
<text x="240" y="327" font-size="11" fill="#a8a8a8" text-anchor="middle">to re-examine itself mid-solution</text>
<text x="240" y="346" font-size="11" fill="#a8a8a8" text-anchor="middle">(&quot;wait, let me reconsider&quot;)</text>
<text x="660" y="232" font-size="11" fill="#a8a8a8" text-anchor="middle">cold-start SFT added</text>
<text x="660" y="251" font-size="11" fill="#a8a8a8" text-anchor="middle">before RL</text>
<text x="660" y="270" font-size="11" fill="#a8a8a8" text-anchor="middle">pure-RL traces were correct</text>
<text x="660" y="289" font-size="11" fill="#a8a8a8" text-anchor="middle">but hard for humans to read</text>
<text x="660" y="308" font-size="11" fill="#a8a8a8" text-anchor="middle">readability is a preference,</text>
<text x="660" y="327" font-size="11" fill="#a8a8a8" text-anchor="middle">and preferences still need</text>
<text x="660" y="346" font-size="11" fill="#a8a8a8" text-anchor="middle">human signal</text>
<rect x="24" y="440" width="852" height="84" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6"/>
<text x="450.0" y="474.0" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">The lesson practitioners took</text>
<text x="450.0" y="496.0" font-size="12" fill="#a8a8a8" text-anchor="middle">RL amplifies behaviors the base model already samples; it does not invent them from nothing.</text>
<text x="24" y="560" font-size="12" fill="#ececec" text-anchor="start">The three legs: sampling scale (G samples)  |  base-model capability  |  verifier quality</text>
<text x="24" y="584" font-size="11" fill="#8a8a8a" text-anchor="start">If the base model never stumbles onto a correct reasoning trace in G samples, the verifier gives all zeros and nothing is</text>
<text x="24" y="601" font-size="11" fill="#8a8a8a" text-anchor="start">learned.</text>
</svg>