<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-label="Agreement by slice: two demographic slices prefer different answer styles, revealing a real preference difference">
<rect width="820" height="520" fill="#0d0d0d"/>
<text x="410" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Agreement by slice: find the real differences</text>
<text x="410" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Assign the same items across demographic slices on purpose. Then measure agreement by slice.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<rect x="60" y="100" width="300" height="130" rx="10" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="210" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#6cb2ff">Slice A</text>
<text x="210" y="163" text-anchor="middle" font-size="12" fill="#ececec">systematically prefers</text>
<text x="210" y="185" text-anchor="middle" font-size="12" fill="#ececec">shorter answers</text>

<rect x="460" y="100" width="300" height="130" rx="10" fill="#1a1a1a" stroke="#f0b429" stroke-width="1.5"/>
<text x="610" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#f0b429">Slice B</text>
<text x="610" y="163" text-anchor="middle" font-size="12" fill="#ececec">systematically prefers</text>
<text x="610" y="185" text-anchor="middle" font-size="12" fill="#ececec">thorough answers</text>

<line x1="210" y1="230" x2="210" y2="280" stroke="#555" stroke-width="2"/>
<line x1="610" y1="230" x2="610" y2="280" stroke="#555" stroke-width="2"/>
<line x1="210" y1="280" x2="610" y2="280" stroke="#555" stroke-width="2"/>
<line x1="410" y1="280" x2="410" y2="310" stroke="#555" stroke-width="2"/>
<polygon points="410,310 404,302 416,302" fill="#555"/>

<rect x="180" y="310" width="460" height="80" rx="10" fill="#1f3a24" stroke="#7fd08a" stroke-width="1.5"/>
<text x="410" y="340" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7fd08a">A real preference difference, not noise</text>
<text x="410" y="364" text-anchor="middle" font-size="12" fill="#ececec">You found it in the data instead of shipping it as a bug.</text>
</g>

<rect x="60" y="435" width="700" height="60" rx="10" fill="#141414" stroke="#2e9e5b" stroke-width="1"/>
<text x="410" y="470" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">The rubric then needs an explicit rule, or the product needs a per-audience decision. Either way, the data told you.</text>
</svg>
