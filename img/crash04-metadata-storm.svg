<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="460" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The small-file metadata storm: bytes said minutes, the filesystem said hours</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">parallel filesystems are built for a few large files, not millions of small ones</text>
<text x="24" y="110" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Where the write time actually goes (one file per tensor):</text>
<text x="24" y="150" font-size="12" fill="#a8a8a8" text-anchor="start">byte math predicted</text>
<rect x="24" y="130" width="56.0" height="26" fill="#6cb2ff" rx="3" opacity="0.9"/>
<text x="90.0" y="148" font-size="12" fill="#6cb2ff" text-anchor="start">data transfer: minutes</text>
<text x="24" y="240" font-size="12" fill="#a8a8a8" text-anchor="start">wall clock measured</text>
<rect x="24" y="200" width="56.0" height="26" fill="#6cb2ff" rx="3" opacity="0.9"/>
<rect x="80.0" y="200" width="525.0" height="26" fill="#e57ea6" rx="3" opacity="0.9"/>
<text x="88.0" y="218" font-size="12" font-weight="bold" fill="#0d0d0d" text-anchor="start">metadata ops: hours</text>
<text x="24" y="256" font-size="12" fill="#a8a8a8" text-anchor="start">tens of thousands of files: every create, open, and sync is a metadata round trip</text>
<rect x="24" y="300" width="400" height="80" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="326" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">the fix: few large files</text>
<text x="224.0" y="344" font-size="11" fill="#a8a8a8" text-anchor="middle">sharded formats write one or a few large files per</text>
<text x="224.0" y="359" font-size="11" fill="#a8a8a8" text-anchor="middle">rank</text>
<rect x="456" y="300" width="400" height="80" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="326" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">two-tier pattern</text>
<text x="656.0" y="344" font-size="11" fill="#a8a8a8" text-anchor="middle">local NVMe absorbs the write; background copy handles</text>
<text x="656.0" y="359" font-size="11" fill="#a8a8a8" text-anchor="middle">durability</text>
</svg>