<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="t10sh-title t10sh-desc">
<title id="t10sh-title">Sharding: split keys across four machines</title>
<desc id="t10sh-desc">A hash function maps each key to a number. The number picks one of four shards: users A-F on shard 1, G-M on shard 2, N-S on shard 3, T-Z on shard 4. A hot key warning notes that one celebrity user can overload a single shard.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="420" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">SHARDING BY KEY HASH</text>
<rect x="370" y="60" width="200" height="80" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="470.0" y="94" class="box" fill="#ececec">hash(key) mod 4</text>
<text x="470.0" y="116" class="d">picks a shard</text>
<rect x="30" y="220" width="200" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="130.0" y="254" class="box" fill="#ececec">shard 1</text>
<text x="130.0" y="276" class="d">A - F</text>
<line x1="470" y1="140" x2="130" y2="220" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10sh-ah)"/>
<rect x="260" y="220" width="200" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="360.0" y="254" class="box" fill="#ececec">shard 2</text>
<text x="360.0" y="276" class="d">G - M</text>
<line x1="470" y1="140" x2="360" y2="220" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10sh-ah)"/>
<rect x="490" y="220" width="200" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="590.0" y="254" class="box" fill="#ececec">shard 3</text>
<text x="590.0" y="276" class="d">N - S</text>
<line x1="470" y1="140" x2="590" y2="220" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10sh-ah)"/>
<rect x="720" y="220" width="200" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="820.0" y="254" class="box" fill="#ececec">shard 4</text>
<text x="820.0" y="276" class="d">T - Z</text>
<line x1="470" y1="140" x2="820" y2="220" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10sh-ah)"/>
<text x="30" y="370" class="capl">How to read: top box hashes the key. Arrows route to exactly one shard.</text>
<text x="30" y="392" class="dl" fill="#ff7a7a">What breaks: hot keys. One celebrity user can melt a single shard. Split hot keys.</text>
</g>
<defs><marker id="t10sh-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>