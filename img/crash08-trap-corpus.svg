<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.3. Trap 5: tuning the retriever when the corpus is the problem</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">no ranker fixes missing documents</text>
<rect x="24" y="110" width="400" height="140" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">WRONG TARGET</text>
<text x="224.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">weeks tuning embeddings and rerankers while the answer</text>
<text x="224.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">is not in the corpus at all</text>
<rect x="456" y="110" width="400" height="140" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">RIGHT TARGET</text>
<text x="656.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">coverage first: is the answer present, chunked sanely,</text>
<text x="656.0" y="169" font-size="11" fill="#a8a8a8" text-anchor="middle">and fresh? then tune retrieval</text>
<text x="440" y="320" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">diagnose in order: coverage, chunking, retrieval, generation</text>
<text x="24" y="420" font-size="12" fill="#a8a8a8" text-anchor="start">The cheapest eval in RAG: for 50 real questions, is the gold answer in the top-k chunks? If not, the corpus is</text>
<text x="24" y="438" font-size="12" fill="#a8a8a8" text-anchor="start">the bug.</text>
</svg>