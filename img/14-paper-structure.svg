<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="sans-serif">
<rect width="800" height="350" fill="#ffffff"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Paper Structure: IMRaD</text>
<rect x="50" y="80" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="125.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Introduction</text>
<text x="125.0" y="128" text-anchor="middle" font-size="11" fill="#555">Problem + claim</text>
<rect x="230" y="80" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="305.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Methods</text>
<text x="305.0" y="128" text-anchor="middle" font-size="11" fill="#555">What you did</text>
<rect x="410" y="80" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="485.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Results</text>
<text x="485.0" y="128" text-anchor="middle" font-size="11" fill="#555">What you found</text>
<rect x="590" y="80" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="665.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Discussion</text>
<text x="665.0" y="128" text-anchor="middle" font-size="11" fill="#555">What it means</text>
<line x1="200" y1="115" x2="230" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="380" y1="115" x2="410" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="560" y1="115" x2="590" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="400" y="200" text-anchor="middle" font-size="12" fill="#555">Write out of order: figures first, then Results, Methods, Discussion, Introduction.</text>
</svg>
