<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="540" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 2.6. Latency, reliability, and ops targets</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">TTFT under 1s, p95 under 8s, stalls tracked</text>
<rect x="24" y="110" width="832" height="72" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="136" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">TTFT &lt; 1s</text>
<text x="440.0" y="154" font-size="11" fill="#a8a8a8" text-anchor="middle">time to first token: the responsiveness number users feel</text>
<rect x="24" y="196" width="832" height="72" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="222" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">p95 &lt; 8s</text>
<text x="440.0" y="240" font-size="11" fill="#a8a8a8" text-anchor="middle">the tail, not the mean: 95% of requests finish inside 8 seconds</text>
<rect x="24" y="282" width="832" height="72" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="308" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">stall &gt; 2s tracked</text>
<text x="440.0" y="326" font-size="11" fill="#a8a8a8" text-anchor="middle">a gap with no tokens for 2s is an incident, even if the total is fine</text>
<rect x="24" y="368" width="832" height="72" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="394" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">caps 80 / 100%</text>
<text x="440.0" y="412" font-size="11" fill="#a8a8a8" text-anchor="middle">concurrency caps: shed load at 80%, hard stop at 100%</text>
<text x="24" y="490" font-size="12" fill="#a8a8a8" text-anchor="start">Users forgive slow; they do not forgive stalled. Track the stall metric separately from total latency.</text>
</svg>