<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="460" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Checkpoint economics</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">7B full state: what a save costs, and why async changes the decision</text>
<rect x="24" y="94" width="250" height="110" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6"/>
<text x="149.0" y="141.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">7B full state: 112 GB</text>
<text x="149.0" y="163.0" font-size="11" fill="#a8a8a8" text-anchor="middle">weights 14 + optimizer 98</text>
<text x="286" y="152" font-size="20" fill="#8a8a8a" text-anchor="start">@</text>
<rect x="316" y="94" width="220" height="110" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="426.0" y="141.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">disk: 5 GB/s</text>
<text x="426.0" y="163.0" font-size="11" fill="#a8a8a8" text-anchor="middle">write speed</text>
<text x="548" y="152" font-size="20" fill="#8a8a8a" text-anchor="start">=</text>
<rect x="578" y="94" width="278" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6"/>
<text x="717.0" y="141.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">22 s per save</text>
<text x="717.0" y="163.0" font-size="11" fill="#a8a8a8" text-anchor="middle">synchronous stall</text>
<text x="24" y="244" font-size="13" fill="#a8a8a8" text-anchor="start">synchronous, every 500 steps (2 s/step): 22 s / 1000 s = 2% overhead. Tolerable.</text>
<text x="24" y="270" font-size="13" fill="#e57ea6" text-anchor="start">synchronous, every 100 steps: 11% overhead. Painful.</text>
<text x="24" y="296" font-size="13" fill="#7dd87d" text-anchor="start">async: copy to RAM in ~1-2 s, background write hidden. Overhead ~0.2%. Save 5x as often for the same cost.</text>
<text x="24" y="332" font-size="13" fill="#a8a8a8" text-anchor="start">Spot math (illustrative): spot is ~60% cheaper. Checkpoint every 15 min, lose ~15 min on preemption of a 24 h run: ~1% expected loss.</text>
<text x="24" y="358" font-size="13" fill="#f0b429" text-anchor="start">60% savings vs 1% loss: take the deal, but only with the SIGTERM handler and the restore drill done.</text>
</svg>