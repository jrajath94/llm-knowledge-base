<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-label="Condition number: circle vs stretched ellipse">
<rect width="800" height="380" rx="12" fill="#0f1420"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9ff"/></marker>
<marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa4b8"/></marker></defs>
<text x="400" y="36" font-family="sans-serif" font-size="20" fill="#e8ecf4" text-anchor="middle" font-weight="bold">Condition number</text>
<text x="400" y="62" font-family="sans-serif" font-size="14" fill="#9aa4b8" text-anchor="middle" font-weight="normal">round = easy, stretched = hard</text>
<text x="200" y="110" font-family="sans-serif" font-size="15" fill="#5fd08a" text-anchor="middle" font-weight="bold">well-conditioned</text>
<text x="200" y="132" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">kappa ~ 1</text>
<ellipse cx="200" cy="230" rx="70" ry="70" fill="none" stroke="#5fd08a" stroke-width="2.5"/>
<text x="200" y="330" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">gradient steps behave</text>
<text x="600" y="110" font-family="sans-serif" font-size="15" fill="#ff7a9e" text-anchor="middle" font-weight="bold">ill-conditioned</text>
<text x="600" y="132" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">kappa &gt;&gt; 1</text>
<ellipse cx="600" cy="230" rx="130" ry="28" fill="none" stroke="#ff7a9e" stroke-width="2.5"/>
<text x="600" y="330" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">zigzag, slow, unstable</text>
<text x="400" y="366" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">kappa = largest / smallest singular value.</text>
</svg>