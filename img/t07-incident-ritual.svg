<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-labelledby="t07ir-title t07ir-desc">
<title id="t07ir-title">The incident ritual: the same five steps, every time</title>
<desc id="t07ir-desc">A five-step flow: mitigate first, write the timeline, find the cause, add the probe, share the post-mortem. A loop arrow shows every incident makes the system stronger in the exact place it broke.</desc>
<style>
  .t07ir text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .t07ir .h { font-size: 20px; font-weight: bold; text-anchor: middle; }
  .t07ir .step { font-size: 15px; font-weight: bold; text-anchor: middle; }
  .t07ir .d { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; }
  .t07ir .loop { font-size: 13px; fill: #f0b429; text-anchor: middle; font-style: italic; }
</style>
<g class="t07ir">
<rect x="0" y="0" width="940" height="380" fill="#0d0d0d"/>
<text x="470" y="32" class="h" style="font-size:21px">The incident ritual: the same five steps, every time</text>

<!-- step boxes -->
<g>
<rect x="15" y="70" width="160" height="170" rx="10" fill="#111111" stroke="#f0b429" stroke-width="2"/>
<text x="95" y="100" class="step" fill="#f0b429">1. Mitigate first</text>
<text x="95" y="126" class="d">Roll back, pause the</text>
<text x="95" y="144" class="d">system, or route to</text>
<text x="95" y="162" class="d">the human handoff.</text>
<text x="95" y="190" class="d">Stop the hurt before</text>
<text x="95" y="208" class="d">you understand it.</text>
</g>
<g>
<rect x="200" y="70" width="160" height="170" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="280" y="100" class="step">2. Write the</text>
<text x="280" y="122" class="step">timeline</text>
<text x="280" y="150" class="d">What happened, when,</text>
<text x="280" y="168" class="d">what you did.</text>
<text x="280" y="196" class="d">Facts only.</text>
</g>
<g>
<rect x="385" y="70" width="160" height="170" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="465" y="100" class="step">3. Find the</text>
<text x="465" y="122" class="step">cause</text>
<text x="465" y="150" class="d">Five whys, blameless.</text>
<text x="465" y="168" class="d">"The eval did not cover</text>
<text x="465" y="186" class="d">scanned PDFs" is a cause.</text>
<text x="465" y="204" class="d">"The intern messed up"</text>
<text x="465" y="222" class="d">is not.</text>
</g>
<g>
<rect x="570" y="70" width="160" height="170" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="650" y="100" class="step">4. Add the</text>
<text x="650" y="122" class="step">probe</text>
<text x="650" y="150" class="d">Every incident becomes</text>
<text x="650" y="168" class="d">a fuzzer probe and a</text>
<text x="650" y="186" class="d">new golden-set case.</text>
</g>
<g>
<rect x="755" y="70" width="170" height="170" rx="10" fill="#111111" stroke="#262626" stroke-width="1.5"/>
<text x="840" y="100" class="step">5. Share the</text>
<text x="840" y="122" class="step">post-mortem</text>
<text x="840" y="150" class="d">Within 48 hours.</text>
<text x="840" y="168" class="d">Honest, short, with</text>
<text x="840" y="186" class="d">the fix and the</text>
<text x="840" y="204" class="d">prevention.</text>
</g>

<!-- arrows between boxes -->
<g stroke="#a8a8a8" stroke-width="1.5" fill="none">
<line x1="175" y1="155" x2="198" y2="155"/><polygon points="198,155 190,150 190,160" fill="#a8a8a8" stroke="none"/>
<line x1="360" y1="155" x2="383" y2="155"/><polygon points="383,155 375,150 375,160" fill="#a8a8a8" stroke="none"/>
<line x1="545" y1="155" x2="568" y2="155"/><polygon points="568,155 560,150 560,160" fill="#a8a8a8" stroke="none"/>
<line x1="730" y1="155" x2="753" y2="155"/><polygon points="753,155 745,150 745,160" fill="#a8a8a8" stroke="none"/>
</g>

<!-- loop back -->
<path d="M 840 240 C 840 320, 95 320, 95 244" stroke="#f0b429" stroke-width="1.5" fill="none" stroke-dasharray="6,4"/>
<polygon points="95,244 88,254 102,252" fill="#f0b429"/>
<text x="470" y="330" class="loop">The system gets stronger in the exact place it broke.</text>
<text x="470" y="356" class="d">Customers forgive incidents. They do not forgive silence.</text>
</g>
</svg>
