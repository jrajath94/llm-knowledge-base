<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img'><rect x='0' y='0' width='960' height='470' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Three ways to tell the model about order</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Same goal, three different places to put the position signal.</text><rect x='40' y='100' width='280' height='300' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='180' y='135' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Absolute</text><text x='180' y='175' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>add p_m to the</text><text x='180' y='195' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>token embedding</text><rect x='60' y='215' width='240' height='44' rx='6' fill='#1a1a1a' stroke='#8a8a8a' stroke-width='1'/><text x='180' y='243' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='middle'>x_m = e_m + p_m</text><text x='180' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#1565c0' text-anchor='middle'>Simple. Breaks past</text><text x='180' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#1565c0' text-anchor='middle'>the training length.</text><rect x='340' y='100' width='280' height='300' rx='10' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><text x='480' y='135' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Relative</text><text x='480' y='175' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>add bias b(m-n)</text><text x='480' y='195' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>to the attention score</text><rect x='360' y='215' width='240' height='44' rx='6' fill='#1a1a1a' stroke='#8a8a8a' stroke-width='1'/><text x='480' y='243' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='middle'>score += b(m - n)</text><text x='480' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#4db6ac' text-anchor='middle'>Handles distance well.</text><text x='480' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#4db6ac' text-anchor='middle'>Extra table of biases.</text><rect x='640' y='100' width='280' height='300' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='780' y='135' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>RoPE</text><text x='780' y='175' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>rotate q by m, k by n</text><text x='780' y='195' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>no vector added</text><rect x='660' y='215' width='240' height='44' rx='6' fill='#1a1a1a' stroke='#8a8a8a' stroke-width='1'/><text x='780' y='243' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='middle'>q_m = R(m) q, k_n = R(n) k</text><text x='780' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#f0b429' text-anchor='middle'>Relative distance, cleanly.</text><text x='780' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#f0b429' text-anchor='middle'>Needs the rotation math.</text><text x='480' y='445' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>Modern models use RoPE. Absolute embeddings belong to the 2017 original.</text></svg>