<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <defs><style>.t{font:bold 22px sans-serif;fill:#1a1a1a}.b{font:bold 15px sans-serif;fill:#fff}.l{font:13px sans-serif;fill:#333}.a{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a6)}</style>
  <marker id="a6" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#333"/></marker></defs>
  <rect width="960" height="500" fill="#fafafa"/>
  <text x="480" y="35" text-anchor="middle" class="t">Agent Loop: Observe, Think, Act</text>
  <!-- Circular loop -->
  <g>
    <rect x="380" y="70" width="200" height="70" rx="35" fill="#1976d2"/><text x="480" y="100" text-anchor="middle" class="b">OBSERVE</text><text x="480" y="120" text-anchor="middle" class="b" font-size="12">tools → results</text>
    <rect x="650" y="180" width="200" height="70" rx="35" fill="#7b1fa2"/><text x="750" y="210" text-anchor="middle" class="b">THINK</text><text x="750" y="230" text-anchor="middle" class="b" font-size="12">plan next step</text>
    <rect x="380" y="290" width="200" height="70" rx="35" fill="#f57c00"/><text x="480" y="320" text-anchor="middle" class="b">ACT</text><text x="480" y="340" text-anchor="middle" class="b" font-size="12">call tool</text>
    <rect x="110" y="180" width="200" height="70" rx="35" fill="#388e3c"/><text x="210" y="210" text-anchor="middle" class="b">CHECK</text><text x="210" y="230" text-anchor="middle" class="b" font-size="12">done? error?</text>
  </g>
  <!-- Arrows forming loop -->
  <line x1="580" y1="105" x2="650" y2="180" class="a"/>
  <line x1="750" y1="250" x2="580" y2="290" class="a"/>
  <line x1="380" y1="325" x2="310" y2="250" class="a"/>
  <line x1="210" y1="180" x2="380" y2="105" class="a"/>
  <!-- Exit -->
  <line x1="210" y1="250" x2="210" y2="400" class="a"/>
  <rect x="110" y="400" width="200" height="50" rx="6" fill="#5d4037"/><text x="210" y="430" text-anchor="middle" class="b">Return answer</text>
  <text x="230" y="330" class="l">if done → exit</text>
  <text x="230" y="350" class="l">if error → think</text>
  <g>
    <rect x="380" y="400" width="470" height="70" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="615" y="425" text-anchor="middle" font-weight="bold" font-size="14">ReAct pattern: Reason + Act interleaved</text>
    <text x="615" y="450" text-anchor="middle" class="l">Max 10 steps. Scratchpad holds history. Tools: search, code, browser.</text>
  </g>
</svg>
