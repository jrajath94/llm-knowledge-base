<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Without positions, shuffling changes nothing</text><rect x='180' y='100' width='120' height='60' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='240' y='137' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>The</text><rect x='330' y='100' width='120' height='60' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='390' y='137' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>cat</text><rect x='480' y='100' width='120' height='60' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='540' y='137' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>sat</text><text x='480' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>shuffle the order</text><line x1='480' y1='222' x2='480' y2='258' stroke='#f0b429' stroke-width='3'/><polygon points='480.0,258.0 475.4,250.3 484.6,250.3' fill='#f0b429'/><rect x='180' y='270' width='120' height='60' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='240' y='307' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>sat</text><rect x='330' y='270' width='120' height='60' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='390' y='307' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>cat</text><rect x='480' y='270' width='120' height='60' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='540' y='307' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>The</text><rect x='640' y='100' width='260' height='230' rx='10' fill='#141414' stroke='#3a3a3a' stroke-width='1.5'/><text x='770' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>bag representation:</text><text x='770' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>identical for both</text><text x='770' y='224' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>self-attention sees all tokens</text><text x='770' y='248' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>at once, so it cannot tell</text><text x='770' y='272' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>which came first</text><text x='480' y='376' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Positional encodings exist to cure exactly this blindness.</text></svg>