<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="700" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The fine-tuning memory drill</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Weights plus optimizer states; activations add on top for all modes</text>
<text x="24" y="114" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Full fine-tuning, 7B</text>
<rect x="230" y="94" width="93.33333333333333" height="28" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="276.6666666666667" y="113" font-size="10" fill="#0d0d0d" text-anchor="middle">weights 14</text>
<rect x="323.3333333333333" y="94" width="93.33333333333333" height="28" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="370.0" y="113" font-size="10" fill="#0d0d0d" text-anchor="middle">grads 14</text>
<rect x="416.66666666666663" y="94" width="186.66666666666666" height="28" fill="#e57ea6" rx="4" opacity="1"/>
<text x="509.99999999999994" y="113" font-size="10" fill="#0d0d0d" text-anchor="middle">Adam m 28</text>
<rect x="603.3333333333333" y="94" width="186.66666666666666" height="28" fill="#b388ff" rx="4" opacity="1"/>
<text x="696.6666666666666" y="113" font-size="10" fill="#0d0d0d" text-anchor="middle">Adam v 28</text>
<text x="799.9999999999999" y="114" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">84.0 GB</text>
<text x="24" y="144" font-size="11" fill="#8a8a8a" text-anchor="start">12 bytes/param; the optimizer states are the hidden giant (56 of 84 GB)</text>
<text x="24" y="186" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">LoRA r=8, 7B</text>
<rect x="230" y="166" width="93.33333333333333" height="28" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="276.6666666666667" y="185" font-size="10" fill="#0d0d0d" text-anchor="middle">frozen base 14</text>
<rect x="323.3333333333333" y="166" width="3.333333333333333" height="28" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="336.66666666666663" y="186" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">14.5 GB</text>
<text x="24" y="216" font-size="11" fill="#8a8a8a" text-anchor="start">requires_grad = False on the base deletes grads and optimizer for 99.9% of params</text>
<text x="24" y="258" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">QLoRA, 7B</text>
<rect x="230" y="238" width="23.333333333333332" height="28" fill="#f0b429" rx="4" opacity="1"/>
<rect x="253.33333333333334" y="238" width="3.333333333333333" height="28" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="266.6666666666667" y="258" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">4.0 GB</text>
<text x="24" y="288" font-size="11" fill="#8a8a8a" text-anchor="start">NF4 base; compute dequantizes to bf16 on the fly; storage stays 4-bit</text>
<rect x="24" y="320" width="852" height="156" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="352" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">QLoRA, 65B: ~42.5 GB fits a single 48 GB card (as reported)</text>
<text x="48" y="382" font-size="11" fill="#a8a8a8" text-anchor="start">Frozen base ~32.5 GB (65B x 0.5 bytes) + adapters and optimizer ~2 GB + activations ~8 GB. Full 16-bit</text>
<text x="48" y="399" font-size="11" fill="#a8a8a8" text-anchor="start">fine-tuning of 65B needs over 780 GB: the gap QLoRA closes. Guanaco reached 99.3% of ChatGPT&#x27;s score on</text>
<text x="48" y="416" font-size="11" fill="#a8a8a8" text-anchor="start">the Vicuna benchmark.</text>
<text x="24" y="500" font-size="11" fill="#8a8a8a" text-anchor="start">The honest limit: LoRA is excellent at style, format, and instruction following. It is weaker at adding genuinely new knowledge:</text>
<text x="24" y="517" font-size="11" fill="#8a8a8a" text-anchor="start">a rank-8 update cannot rewrite what the base model never learned.</text>
</svg>