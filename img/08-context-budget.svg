<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 420' width='100%' role='img'><title>Context budget: 20K of a 128K window</title><text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Total committed: 20,000 tokens, 16% of the window</text><rect x='40' y='110' width='66' height='70' rx='8' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/><rect x='106' y='110' width='110' height='70' rx='8' fill='#7b61b8' fill-opacity='0.30' stroke='#7b61b8' stroke-width='2'/><rect x='216' y='110' width='264' height='70' rx='8' fill='#2e9e5b' fill-opacity='0.30' stroke='#2e9e5b' stroke-width='2'/><text x='348.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Retrieved 6K</text><rect x='480' y='110' width='88' height='70' rx='8' fill='#f0b429' fill-opacity='0.30' stroke='#f0b429' stroke-width='2'/><rect x='568' y='110' width='176' height='70' rx='8' fill='#c0392b' fill-opacity='0.30' stroke='#c0392b' stroke-width='2'/><text x='656.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>History 4K</text><rect x='744' y='110' width='176' height='70' rx='8' fill='#3a3a3a' fill-opacity='0.30' stroke='#3a3a3a' stroke-width='2' stroke-dasharray='7,5'/><text x='832.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Reserve 4K fenced</text><text x='480' y='225' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The output reserve is fenced off: spending it on input is how answers get truncated mid-sentence</text><text x='480' y='258' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Every slot is a dial with a price tag; retrieved chunks are the biggest input slot</text><text x='480' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#f0b429' text-anchor='middle'>20K tokens pin ~52 GB of KV cache on a 70B-class model in fp16 (2.62 MB per token)</text><text x='480' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>You do not need the whole window: the budget leaves headroom and keeps the KV cache small</text></svg>