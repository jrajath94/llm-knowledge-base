<svg xmlns="http://www.w3.org/2000/svg" width="800" height="235" viewBox="0 0 800 235" font-family="DejaVu Sans, sans-serif">
<defs><style>.t{font-size:13px;fill:#1a3a5c;font-weight:bold}.b{font-size:11.5px;fill:#333333}.s{font-size:10.5px;fill:#555555}.box{fill:#f4f7fa;stroke:#1a3a5c;stroke-width:1.5;rx:8}.box2{fill:#eef6f3;stroke:#2a9d8f;stroke-width:1.5;rx:8}.box3{fill:#fdf3ec;stroke:#e76f51;stroke-width:1.5;rx:8}.arr{stroke:#1a3a5c;stroke-width:2;fill:none;marker-end:url(#ah)}</style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/></marker></defs>
<text x="400" y="30" text-anchor="middle" class="t" font-size="15">RLVR: what counts as a verifiable reward</text>
<rect x="20" y="60" width="175" height="110" class="box"/>
<text x="107.5" y="82" text-anchor="middle" class="t">Math</text>
<text x="107.5" y="102" text-anchor="middle" class="b">exact answer match,</text>
<text x="107.5" y="120" text-anchor="middle" class="b">symbolic equivalence</text>
<rect x="215" y="60" width="175" height="110" class="box2"/>
<text x="302.5" y="82" text-anchor="middle" class="t">Code</text>
<text x="302.5" y="102" text-anchor="middle" class="b">unit tests pass,</text>
<text x="302.5" y="120" text-anchor="middle" class="b">hidden tests pass</text>
<rect x="410" y="60" width="175" height="110" class="box"/>
<text x="497.5" y="82" text-anchor="middle" class="t">Format</text>
<text x="497.5" y="102" text-anchor="middle" class="b">valid JSON, schema check,</text>
<text x="497.5" y="120" text-anchor="middle" class="b">length or structure rules</text>
<rect x="605" y="60" width="175" height="110" class="box3"/>
<text x="692.5" y="82" text-anchor="middle" class="t">Tools</text>
<text x="692.5" y="102" text-anchor="middle" class="b">API call succeeds,</text>
<text x="692.5" y="120" text-anchor="middle" class="b">retrieved doc contains answer</text>
<text x="400" y="205" text-anchor="middle" class="s">All four give 0/1 or graded scores with no human judge in the loop.</text>
</svg>
