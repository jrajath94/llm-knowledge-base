<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 380' width='100%' role='img'><rect x='0' y='0' width='960' height='380' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>The whole network is matrix multiplication with kinks between</text><rect x='30' y='120' width='108' height='80' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='84.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>x</text><line x1='138' y1='160' x2='172' y2='160' stroke='#8a8a8a' stroke-width='3'/><polygon points='172.0,160.0 164.3,164.6 164.3,155.4' fill='#8a8a8a'/><rect x='172' y='120' width='108' height='80' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='226.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#1565c0' text-anchor='middle'>W1</text><line x1='280' y1='160' x2='314' y2='160' stroke='#8a8a8a' stroke-width='3'/><polygon points='314.0,160.0 306.3,164.6 306.3,155.4' fill='#8a8a8a'/><rect x='314' y='120' width='92' height='80' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2.5'/><text x='360.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#f0b429' text-anchor='middle'>ReLU</text><line x1='406' y1='160' x2='440' y2='160' stroke='#8a8a8a' stroke-width='3'/><polygon points='440.0,160.0 432.3,164.6 432.3,155.4' fill='#8a8a8a'/><rect x='440' y='120' width='108' height='80' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='494.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#1565c0' text-anchor='middle'>W2</text><line x1='548' y1='160' x2='582' y2='160' stroke='#8a8a8a' stroke-width='3'/><polygon points='582.0,160.0 574.3,164.6 574.3,155.4' fill='#8a8a8a'/><rect x='582' y='120' width='92' height='80' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2.5'/><text x='628.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#f0b429' text-anchor='middle'>ReLU</text><line x1='674' y1='160' x2='708' y2='160' stroke='#8a8a8a' stroke-width='3'/><polygon points='708.0,160.0 700.3,164.6 700.3,155.4' fill='#8a8a8a'/><rect x='708' y='120' width='108' height='80' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='762.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#1565c0' text-anchor='middle'>W3</text><line x1='816' y1='160' x2='850' y2='160' stroke='#8a8a8a' stroke-width='3'/><polygon points='850.0,160.0 842.3,164.6 842.3,155.4' fill='#8a8a8a'/><rect x='850' y='120' width='108' height='80' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2.5'/><text x='904.0' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#2e9e5b' text-anchor='middle'>y-hat</text><text x='480' y='260' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>That uniformity is the engineering miracle: the entire model reduces</text><text x='480' y='284' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>to the operation GPUs do fastest.</text><text x='480' y='322' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>Scale = bigger matrices, more layers, same computation.</text></svg>