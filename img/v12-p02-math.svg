<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="RoPE: the rotation that makes position relative"><rect x="22" y="14" width="916" height="298" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Each 2-D pair of the query/key vector rotates by an angle set by its position</text><rect x="312.81665625000005" y="94" width="334.36668749999995" height="68" rx="8" fill="#0d0d0d" stroke="#6cb2ff" stroke-opacity="0.45"/><text x="330.81665625000005" y="124" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">x&#x27; = R(a) x,   a = m * theta</text><text x="330.81665625000005" y="148" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ececec">theta_i = 10000^(-2i/d)</text><text x="38" y="180" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">x</text><text x="242" y="180" font-size="13" fill="#a8a8a8">one 2-D pair of the query or key vector</text><text x="38" y="203" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">m</text><text x="242" y="203" font-size="13" fill="#a8a8a8">the token position: position 5 rotates 5x further than position 1</text><text x="38" y="226" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">theta</text><text x="242" y="226" font-size="13" fill="#a8a8a8">base angle for that pair; high dims rotate slowly, low dims fast</text><text x="38" y="249" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">R(a)</text><text x="242" y="249" font-size="13" fill="#a8a8a8">2x2 rotation matrix [[cos a, -sin a],[sin a, cos a]]</text><text x="38" y="272" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6cb2ff">payoff</text><text x="242" y="272" font-size="13" fill="#a8a8a8">dot(rotated q at m, rotated k at n) depends only on (m - n): relativity falls out of the</text><text x="242" y="289" font-size="13" fill="#a8a8a8">geometry</text></svg>