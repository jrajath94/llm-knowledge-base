<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 12: the problem Mixtral of Experts solved"><rect x="22" y="14" width="435.0" height="194" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">Dense models activate every parameter</text><text x="38" y="84" font-size="15" font-weight="700" fill="#ececec">for every token</text><circle cx="44" cy="103.5" r="3.2" fill="#e07878"/><text x="56" y="108" font-size="13.5" fill="#a8a8a8">a 100B model costs 100B worth of FLOPs per</text><text x="56" y="126" font-size="13.5" fill="#a8a8a8">token</text><circle cx="44" cy="147.5" r="3.2" fill="#e07878"/><text x="56" y="152" font-size="13.5" fill="#a8a8a8">sparse MoE existed since 2017 but was</text><text x="56" y="170" font-size="13.5" fill="#a8a8a8">unstable and niche</text><rect x="503.0" y="14" width="435.0" height="194" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">What if most parameters sit idle most</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">of the time, waking only for the tokens</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">that need them?</text><line x1="467.0" y1="111.0" x2="487.0" y2="111.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,106.0 495.0,111.0 487.0,116.0" fill="#a8a8a8"/></svg>