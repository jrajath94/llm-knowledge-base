<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="100%" style="max-width:700px" role="img" aria-label="Three U-curves at fixed compute; fitted minima march right with budget; the optima line is the scaling law">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="410" fill="none"/>
<text class="t" x="24" y="30">isoFLOP profiles: one U-curve per budget, minima marching right</text>
<line x1="90" y1="300" x2="680" y2="300" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="90" y1="300" x2="90" y2="60" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="m" x="385" y="332" text-anchor="middle">model size (log)</text>
<text class="m" x="46" y="180" text-anchor="middle">loss</text>
<polyline points="90,251 106,241 123,233 139,228 155,225 172,224 188,225 204,228 221,234 237,242 253,253 270,265 286,280 302,297" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
<circle cx="170" cy="224" r="7" fill="#8a8a8a" stroke="#0a0a0a" stroke-width="2"/>
<text class="m" x="159" y="210" text-anchor="end">budget 1e20</text>
<polyline points="106,285 123,263 139,244 155,226 172,212 188,199 204,188 221,180 237,174 253,171 270,169 286,170 302,173 319,178 335,186 351,196 368,208 384,222 400,239 417,258 433,279" fill="none" stroke="#6cb2ff" stroke-width="2.5"/>
<circle cx="272" cy="169" r="7" fill="#6cb2ff" stroke="#0a0a0a" stroke-width="2"/>
<text class="m" x="250" y="200">budget 4e20</text>
<polyline points="172,292 188,264 204,240 221,217 237,197 253,178 270,163 286,149 302,138 319,129 335,122 351,117 368,115 384,115 400,117 417,121 433,128 449,137 466,148 482,162 498,177 515,195 531,216 547,238 564,263 580,290" fill="none" stroke="#f0b429" stroke-width="2.5"/>
<circle cx="376" cy="115" r="7" fill="#f0b429" stroke="#0a0a0a" stroke-width="2"/>
<text class="m" x="388.39780073092885" y="104.54545454545456">budget 1.6e21</text>
<line x1="170" y1="224" x2="376" y2="115" stroke="#7fc97f" stroke-width="2" stroke-dasharray="7,5"/>
<text class="gr" x="440" y="246">optima line (dashed):</text>
<text class="gr" x="440" y="268">the scaling law you take home</text>
<text class="num" x="24" y="362">Each U holds FLOPs fixed and varies size. Small models (left) waste capacity; large ones (right) starve on tokens.</text>
<text class="m" x="24" y="386">Stars marching right = bigger budgets want bigger models. Fit a parabola per budget in log space.</text>
</svg>
