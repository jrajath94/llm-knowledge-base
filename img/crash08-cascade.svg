<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="540" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.5. Model cascade routing: cheap first, escalate on doubt</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">most queries are easy; price them that way</text>
<rect x="24" y="130" width="240" height="120" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="144.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">CHEAP MODEL</text>
<text x="144.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">answers; reports confidence</text>
<line x1="264" y1="190" x2="320" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="320,190 311.78219953718923,193.66984407753614 311.78219953718923,186.33015592246386" fill="#8a8a8a"/>
<rect x="320" y="130" width="240" height="120" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">CHECK</text>
<text x="440.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">confidence above bar?</text>
<line x1="560" y1="190" x2="616" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="616,190 607.7821995371892,193.66984407753614 607.7821995371892,186.33015592246386" fill="#8a8a8a"/>
<rect x="616" y="130" width="240" height="120" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="736.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">FLAGSHIP</text>
<text x="736.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">only the hard ones arrive here</text>
<text x="440" y="300" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">typical split: 80% cheap, 15% mid, 5% flagship</text>
<rect x="24" y="350" width="832" height="90" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="376" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE MATH</text>
<text x="440.0" y="394" font-size="11" fill="#a8a8a8" text-anchor="middle">average cost = 0.8 x cheap + 0.15 x mid + 0.05 x flagship; the cascade wins when easy queries dominate</text>
<text x="24" y="490" font-size="12" fill="#a8a8a8" text-anchor="start">The confidence bar is the whole design: too low wastes the cascade, too high burns money on the flagship.</text>
</svg>