<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="548" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The guardian loop: detect, classify, isolate, resume in under 10 minutes</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">failures are the normal operating condition at scale, not an exception</text>
<rect x="330" y="90" width="220" height="76" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="116" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HEARTBEAT MONITOR</text>
<text x="440.0" y="134" font-size="11" fill="#a8a8a8" text-anchor="middle">every rank reports step</text>
<text x="440.0" y="149" font-size="11" fill="#a8a8a8" text-anchor="middle">completions</text>
<line x1="440" y1="166" x2="440" y2="210" stroke="#6cb2ff" stroke-width="2"/>
<polygon points="440,210 436.33015592246386,201.78219953718923 443.66984407753614,201.78219953718923" fill="#6cb2ff"/>
<rect x="300" y="210" width="280" height="76" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="236" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">ANOMALY?</text>
<text x="440.0" y="254" font-size="11" fill="#a8a8a8" text-anchor="middle">step-time anomaly in the distribution</text>
<text x="640" y="230" font-size="11" fill="#a8a8a8" text-anchor="middle">no: keep monitoring</text>
<line x1="580" y1="240" x2="700" y2="240" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="700,240 691.7821995371892,243.66984407753614 691.7821995371892,236.33015592246386" fill="#a8a8a8"/>
<line x1="700" y1="240" x2="700" y2="128" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="700,128 703.6698440775361,136.21780046281077 696.3301559224639,136.21780046281077" fill="#a8a8a8"/>
<line x1="700" y1="128" x2="560" y2="128" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="560,128 568.2178004628108,124.33015592246387 568.2178004628108,131.66984407753614" fill="#a8a8a8"/>
<line x1="440" y1="286" x2="440" y2="330" stroke="#f0b429" stroke-width="2"/>
<polygon points="440,330 436.33015592246386,321.78219953718923 443.66984407753614,321.78219953718923" fill="#f0b429"/>
<rect x="60" y="330" width="170" height="70" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="145.0" y="356" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HANG</text>
<text x="145.0" y="374" font-size="11" fill="#a8a8a8" text-anchor="middle">no rank completes a</text>
<text x="145.0" y="389" font-size="11" fill="#a8a8a8" text-anchor="middle">step past 5x p99</text>
<rect x="260" y="330" width="170" height="70" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="345.0" y="356" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SLOW RANK</text>
<text x="345.0" y="374" font-size="11" fill="#a8a8a8" text-anchor="middle">one rank persistently</text>
<text x="345.0" y="389" font-size="11" fill="#a8a8a8" text-anchor="middle">over median</text>
<rect x="460" y="330" width="170" height="70" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="545.0" y="356" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">LOSS SPIKE</text>
<text x="545.0" y="374" font-size="11" fill="#a8a8a8" text-anchor="middle">loss over 1.5x running</text>
<text x="545.0" y="389" font-size="11" fill="#a8a8a8" text-anchor="middle">median</text>
<rect x="660" y="330" width="170" height="70" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="745.0" y="356" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">NODE GONE</text>
<text x="745.0" y="374" font-size="11" fill="#a8a8a8" text-anchor="middle">heartbeat lost</text>
<text x="745.0" y="389" font-size="11" fill="#a8a8a8" text-anchor="middle">entirely</text>
<text x="440" y="322" font-size="12" fill="#ececec" text-anchor="middle">CLASSIFY: the response differs by cause</text>
<line x1="145" y1="400" x2="145" y2="428" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="145,428 141.33015592246386,419.78219953718923 148.66984407753614,419.78219953718923" fill="#8a8a8a"/>
<line x1="345" y1="400" x2="345" y2="428" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="345,428 341.33015592246386,419.78219953718923 348.66984407753614,419.78219953718923" fill="#8a8a8a"/>
<line x1="545" y1="400" x2="545" y2="428" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="545,428 541.3301559224639,419.78219953718923 548.6698440775361,419.78219953718923" fill="#8a8a8a"/>
<line x1="745" y1="400" x2="745" y2="428" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="745,428 741.3301559224639,419.78219953718923 748.6698440775361,419.78219953718923" fill="#8a8a8a"/>
<rect x="240" y="428" width="400" height="62" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="454" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">ISOLATE then RESUME</text>
<text x="440.0" y="472" font-size="11" fill="#a8a8a8" text-anchor="middle">quarantine nodes; resume latest good checkpoint;</text>
<text x="440.0" y="487" font-size="11" fill="#a8a8a8" text-anchor="middle">verify 10 steps</text>
<line x1="640" y1="456" x2="800" y2="456" stroke="#7dd87d" stroke-width="2"/>
<polygon points="800,456 791.7821995371892,459.66984407753614 791.7821995371892,452.33015592246386" fill="#7dd87d"/>
<line x1="800" y1="456" x2="800" y2="128" stroke="#7dd87d" stroke-width="2"/>
<polygon points="800,128 803.6698440775361,136.21780046281077 796.3301559224639,136.21780046281077" fill="#7dd87d"/>
<line x1="800" y1="128" x2="560" y2="128" stroke="#7dd87d" stroke-width="2"/>
<polygon points="560,128 568.2178004628108,124.33015592246387 568.2178004628108,131.66984407753614" fill="#7dd87d"/>
<text x="810" y="300" font-size="11" fill="#7dd87d" text-anchor="start">loop closes</text>
<text x="24" y="514" font-size="12" fill="#a8a8a8" text-anchor="start">Budget: detect + isolate + resume stays under 10 minutes. Bad nodes never rejoin silently: re-qualify</text>
<text x="24" y="531" font-size="12" fill="#a8a8a8" text-anchor="start">with bring-up tests first.</text>
</svg>