<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 477" role="img" aria-label="Split brain: two leaders, one network cut">
<rect width="900" height="477" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Split brain: two leaders, one network cut</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">A partition lets both sides believe they are the leader. Writes diverge and can never be merged automatically.</text>
<line x1="450.0" y1="79.0" x2="450.0" y2="279.0" stroke="#e5484d" stroke-width="3" stroke-dasharray="8,5"/>
<text x="450.0" y="297.0" text-anchor="middle" fill="#e5484d" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">network partition</text>
<rect x="110.0" y="99.0" width="260.0" height="120.0" rx="6" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="240.0" y="129.0" text-anchor="middle" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">side A</text>
<text x="240.0" y="155.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">leader: old</text>
<text x="240.0" y="179.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">accepts writes</text>
<rect x="530.0" y="99.0" width="260.0" height="120.0" rx="6" fill="#141414" stroke="#ff9f43" stroke-width="2"/>
<text x="660.0" y="129.0" text-anchor="middle" fill="#ff9f43" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">side B</text>
<text x="660.0" y="155.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">leader: new</text>
<text x="660.0" y="179.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">accepts writes</text>
<line x1="240.0" y1="229.0" x2="330.0" y2="265.0" stroke="#e5484d" stroke-width="1.8"/>
<line x1="330.0" y1="265.0" x2="321.0" y2="265.4" stroke="#e5484d" stroke-width="1.8"/>
<line x1="330.0" y1="265.0" x2="323.7" y2="258.5" stroke="#e5484d" stroke-width="1.8"/>
<line x1="660.0" y1="229.0" x2="570.0" y2="265.0" stroke="#e5484d" stroke-width="1.8"/>
<line x1="570.0" y1="265.0" x2="576.3" y2="258.5" stroke="#e5484d" stroke-width="1.8"/>
<line x1="570.0" y1="265.0" x2="579.0" y2="265.4" stroke="#e5484d" stroke-width="1.8"/>
<text x="450.0" y="269.0" text-anchor="middle" fill="#e5484d" font-size="18" font-family="Charis SIL, Georgia, serif" font-weight="bold">X</text>
<rect x="40.0" y="315.0" width="820.0" height="124.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="341.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">The fix is quorum: a leader needs a majority, and a partition cannot produce two majorities.</text>
<text x="60.0" y="357.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">Fencing tokens stop the deposed leader's writes from landing.</text>
<text x="60.0" y="375.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">This is the 'P' in CAP made concrete: under a partition you choose between availability (both sides</text>
<text x="60.0" y="390.5" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">write, diverge) and consistency (minority side refuses).</text>
<text x="60.0" y="409.0" text-anchor="start" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">Healing a split brain is manual: pick a winner, replay or discard the loser's writes. There is no</text>
<text x="60.0" y="423.9" text-anchor="start" fill="#6f6f6f" font-size="11" font-family="Charis SIL, Georgia, serif">automatic merge.</text>
</svg>
