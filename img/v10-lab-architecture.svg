<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Lab architecture: all three labs, one picture"><rect x="22" y="14" width="916" height="268" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">LABS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Three labs on a laptop CPU: monitored endpoint, load test, cost math</text><rect x="38" y="96" width="208.402225" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Load clients</text><text x="54" y="144" font-size="12" fill="#a8a8a8">8 threads x 50 requests</text><text x="54" y="160" font-size="12" fill="#a8a8a8">hammer the server</text><line x1="256.402225" y1="136.0" x2="270.402225" y2="136.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="270.402225,131.0 278.402225,136.0 270.402225,141.0" fill="#a8a8a8"/><rect x="286.402225" y="96" width="239.899375" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="306.402225" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="306.402225" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">2</text><text x="326.402225" y="123" font-size="13.5" font-weight="700" fill="#ececec">HTTP :8931 /predict</text><text x="302.402225" y="144" font-size="12" fill="#a8a8a8">5 ms toy model serves each</text><text x="302.402225" y="160" font-size="12" fill="#a8a8a8">prediction</text><line x1="536.3016" y1="136.0" x2="550.3016" y2="136.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="550.3016,131.0 558.3016,136.0 550.3016,141.0" fill="#a8a8a8"/><rect x="566.3016" y="96" width="229.872325" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="586.3016" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="586.3016" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">3</text><text x="606.3016" y="123" font-size="13.5" font-weight="700" fill="#ececec">/metrics</text><text x="582.3016" y="144" font-size="12" fill="#a8a8a8">p50 / p99 / mean latencies</text><text x="582.3016" y="160" font-size="12" fill="#a8a8a8">and counts</text><rect x="38" y="200" width="194.8506625" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="222" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="227" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">4</text><text x="78" y="227" font-size="13.5" font-weight="700" fill="#ececec">Log</text><text x="54" y="248" font-size="12" fill="#a8a8a8">every request latency</text><text x="54" y="264" font-size="12" fill="#a8a8a8">appended to LAT[]</text></svg>