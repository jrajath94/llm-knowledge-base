<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 470' role='img'><rect x='0' y='0' width='880' height='470' fill='#0d0d0d' rx='8'/><text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>MFU: the share of peak FLOPs you actually get</text><text x='24' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#8a8a8a'>model FLOPs utilization = achieved throughput / theoretical peak</text><text x='24' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>A100 peak (FP16)</text><rect x='160' y='122' width='590' height='36' fill='#141414' stroke='#4a4a4a' rx='4'/><text x='762' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>312 TFLOPS</text><text x='24' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>achieved at 40% MFU</text><rect x='160' y='192' width='590' height='36' fill='#141414' stroke='#4a4a4a' rx='4'/><rect x='160' y='192' width='236' height='36' fill='#6cb2ff' rx='4'/><text x='762' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#6cb2ff' text-anchor='start'>125 TFLOPS</text><rect x='160' y='280' width='560' height='90' fill='#101826' stroke='#6cb2ff' stroke-width='1.5' rx='6'/><text x='440.0' y='315.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' fill='#ececec' text-anchor='middle'>MFU = achieved FLOP/s / peak FLOP/s</text><text x='440.0' y='335.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>40% is a good run. Below 30%, fix the pipeline first.</text><text x='24' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Every FLOP count in this page assumes an MFU. Without it, GPU-hour math is fantasy.</text></svg>