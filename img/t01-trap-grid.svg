<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="100%" style="max-width:760px" role="img" aria-label="Eight traps that burned real budgets, each with its tell and its prevention rule">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="640" fill="none"/>
<text class="t" x="24" y="30">The eight traps: spot it, fix it</text>
<rect x="24" y="52" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="38" y="80">T1: Compute-mismatched ablation</text>
<text class="m" x="38" y="104">spot: delta reported without N, D, FLOPs</text>
<text class="m" x="38" y="126">fix: Rule 1: match 6ND</text>
<text class="m" x="38" y="146"></text>
<rect x="388" y="52" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="402" y="80">T2: Benchmark contamination</text>
<text class="m" x="402" y="104">spot: gain on one benchmark family only</text>
<text class="m" x="402" y="126">fix: Rule 8: n-gram overlap check</text>
<text class="m" x="402" y="146"></text>
<rect x="24" y="168" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="38" y="196">T3: Goodhart on the proxy</text>
<text class="m" x="38" y="220">spot: reward up, KL exploding</text>
<text class="m" x="38" y="242">fix: KL penalty / verifiable rewards</text>
<text class="m" x="38" y="262"></text>
<rect x="388" y="168" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="402" y="196">T4: Reading the loss curve wrong</text>
<text class="m" x="402" y="220">spot: one spike -&gt; LR cut; slow climb ignored</text>
<text class="m" x="402" y="242">fix: Rule 6: loss + grad norm together</text>
<text class="m" x="402" y="262"></text>
<rect x="24" y="284" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="38" y="312">T5: Single-seed hero</text>
<text class="m" x="38" y="336">spot: no spread; "best of 5" footnote</text>
<text class="m" x="38" y="358">fix: mean + interval across seeds</text>
<text class="m" x="38" y="378"></text>
<rect x="388" y="284" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="402" y="312">T6: Strawman baseline</text>
<text class="m" x="402" y="336">spot: baseline far from Chinchilla line</text>
<text class="m" x="402" y="358">fix: same budget + tuning for baseline</text>
<text class="m" x="402" y="378"></text>
<rect x="24" y="400" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="38" y="428">T7: Extrapolating past 10x</text>
<text class="m" x="38" y="452">spot: fit shown, no hold-out error</text>
<text class="m" x="38" y="474">fix: Rule 11: wide band + mid point</text>
<text class="m" x="38" y="494"></text>
<rect x="388" y="400" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="402" y="428">T8: Wrong FLOP accounting</text>
<text class="m" x="402" y="452">spot: embeddings in N; MoE total vs active</text>
<text class="m" x="402" y="474">fix: non-embedding N; active params</text>
<text class="m" x="402" y="494"></text>
</svg>
