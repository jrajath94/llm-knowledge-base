<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 349" role="img" aria-label="Chapter 11: Subsets — the worked example, traced">
<rect width="900" height="349" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 11: Subsets — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 37. nums = [1, 2, 3]. At each position, branch: include it or skip it. 2^3 = 8 leaves.</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="120.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">level 0: []</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">decide on 1</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">include -&gt; [1]; skip -&gt; []</text>
<text x="48.0" y="149.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">level 1</text>
<text x="128.0" y="150.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">decide on 2 under each</text>
<text x="488.0" y="150.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">[1,2], [1] | [2], []</text>
<rect x="40.0" y="159.0" width="820.0" height="46.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="187.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">level 2</text>
<text x="128.0" y="179.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">decide on 3 under each</text>
<text x="488.0" y="179.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">[1,2,3], [1,2] | [1,3], [1] | [2,3], [2] |</text>
<text x="488.0" y="196.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">[3], []</text>
<text x="48.0" y="233.0" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">leaves</text>
<text x="128.0" y="225.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">8 subsets</text>
<text x="488.0" y="225.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">every subset appears exactly once: the</text>
<text x="488.0" y="242.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">include/skip path is its fingerprint</text>
<line x1="40.0" y1="251.0" x2="860.0" y2="251.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="261.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="283.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">Include-or-skip is the universal subset generator. The recursion tree IS the answer set: one leaf</text>
<text x="58.0" y="299.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">per subset, no duplicates by construction.</text>
</svg>
