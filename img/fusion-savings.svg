<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="100%" style="max-width:700px" role="img" aria-label="Three eager kernels move 58.7 MB across three launches; fusing bias and relu into the matmul epilogue moves 42 MB in one launch, saving 29 percent">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="310" fill="none"/>
<text class="t" x="24" y="30">What fusion saves: 58.7 MB eager vs 42.0 MB fused</text>
<text class="m" x="24" y="58">relu(x @ w + b): x 512x4096, w 4096x4096, b 4096, fp16</text>
<text class="big r" x="24" y="84">Eager: 3 kernels, 3 launches</text>
<rect x="24" y="94" width="419" height="30" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="449" y="94" width="84" height="30" rx="4" fill="#e57373" opacity="0.85"/>
<rect x="539" y="94" width="84" height="30" rx="4" fill="#e57373" opacity="0.85"/>
<text class="num" x="24" y="146">total 58.7 MB moved</text>
<text class="big gr" x="24" y="172">Fused: 1 launch, epilogue folded into matmul</text>
<rect x="24" y="182" width="419" height="30" rx="4" fill="#7fc97f" opacity="0.85"/>
<text class="num" x="24" y="234">total 42.0 MB moved</text>
<text class="g" x="24" y="264">Saved: 16.7 MB of traffic (29%) and 2 launches. The matmul is unchanged:</text>
<text class="m" x="24" y="286">the win is the deleted memory-bound tail. Fusion deletes the tail instead of optimizing it.</text>
</svg>
