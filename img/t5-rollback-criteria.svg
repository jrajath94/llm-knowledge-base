<svg xmlns="http://www.w3.org/2000/svg" width="720" height="369" viewBox="0 0 720 369" role="img" aria-label="Pre-written rollback criteria">
<rect width="720" height="369" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Rollback criteria: written before the incident, in calm</text>
<rect class="box" x="60" y="60" width="600" height="68" rx="8"/>
<line x1="60" y1="60" x2="60" y2="128" stroke="#f0b429" stroke-width="4"/>
<text x="86" y="86" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">safety incident rate above X per million sessions, rolling 24 h</text>
<text x="86" y="108" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">action: hold the rollout  |  owner: named in advance</text>
<rect class="box" x="60" y="138" width="600" height="68" rx="8"/>
<line x1="60" y1="138" x2="60" y2="206" stroke="#e5484d" stroke-width="4"/>
<text x="86" y="164" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a red-team probe family breaks above Y% on the production version</text>
<text x="86" y="186" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">action: roll back to the previous version  |  owner: named in advance</text>
<rect class="box" x="60" y="216" width="600" height="68" rx="8"/>
<line x1="60" y1="216" x2="60" y2="284" stroke="#58a6ff" stroke-width="4"/>
<text x="86" y="242" text-anchor="start" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">filter outage longer than Z minutes with no fallback</text>
<text x="86" y="264" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">action: enable stricter filters  |  owner: named in advance</text>
<text x="360" y="322" text-anchor="middle" fill="#e5484d" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">the rollback path must be rehearsed before you need it</text>
<text x="360" y="344" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">record near-misses: an S2 that almost became an S1 is free information</text>
</svg>