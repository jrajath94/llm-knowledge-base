<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t10rep-title t10rep-desc">
<title id="t10rep-title">Leader-follower replication and failover</title>
<desc id="t10rep-desc">Three database nodes. The leader takes writes and streams them to two followers. Reads go to any node. When the leader dies, one follower is promoted to leader. A red X marks the dead leader; a gold arrow shows promotion.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">LEADER-FOLLOWER REPLICATION</text>
<rect x="370" y="80" width="200" height="90" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="470.0" y="114" class="box" fill="#ececec">leader</text>
<text x="470.0" y="136" class="d">takes writes</text>
<rect x="80" y="260" width="200" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="180.0" y="294" class="box" fill="#ececec">follower 1</text>
<text x="180.0" y="316" class="d">serves reads</text>
<rect x="660" y="260" width="200" height="90" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="760.0" y="294" class="box" fill="#ececec">follower 2</text>
<text x="760.0" y="316" class="d">serves reads</text>
<line x1="430" y1="170" x2="180" y2="260" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10rep-ah)"/>
<text x="305.0" y="209.0" class="d">replication stream</text>
<line x1="510" y1="170" x2="760" y2="260" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#t10rep-ah)"/>
<text x="635.0" y="209.0" class="d">replication stream</text>
<text x="80" y="400" class="dl">Failover: the leader dies, a follower is promoted. Writes pause for seconds.</text>
<text x="80" y="422" class="dl" fill="#ff7a7a">What breaks: two leaders at once (split brain). Use fencing to stop the old leader.</text>
</g>
<defs><marker id="t10rep-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>