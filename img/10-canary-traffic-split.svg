<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Traffic share bars for v1 and v2 across four rollout stages"><rect x="22" y="14" width="916" height="292" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 6</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Canary: traffic shifts in measured steps</text><text x="38" y="112" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Baseline</text><rect x="220" y="96" width="560" height="28" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/><rect x="220" y="96" width="560.0" height="28" rx="6" fill="#4a4a4a"/><text x="796" y="115" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">v1 100% / v2 0%</text><text x="38" y="158" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Canary</text><rect x="220" y="142" width="560" height="28" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/><rect x="220" y="142" width="532.0" height="28" rx="6" fill="#4a4a4a"/><rect x="752.0" y="142" width="28.0" height="28" rx="6" fill="#f0b429"/><text x="796" y="161" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">v1 95% / v2 5%</text><text x="38" y="204" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Half traffic</text><rect x="220" y="188" width="560" height="28" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/><rect x="220" y="188" width="280.0" height="28" rx="6" fill="#4a4a4a"/><rect x="500.0" y="188" width="280.0" height="28" rx="6" fill="#f0b429"/><text x="796" y="207" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">v1 50% / v2 50%</text><text x="38" y="250" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">Cutover</text><rect x="220" y="234" width="560" height="28" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/><rect x="220.0" y="234" width="560.0" height="28" rx="6" fill="#f0b429"/><text x="796" y="253" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">v1 0% / v2 100%</text><text x="38" y="300" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">Grow v2 only while evals stay green. Shrink it the moment they turn red.</text></svg>