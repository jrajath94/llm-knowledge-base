<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-label="The gate decision: ship or hold">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="280" y="36" text-anchor="middle" class="t">The gate: ship or hold</text>
<text x="280" y="58" text-anchor="middle" class="xs">Every release walks this path.</text>
<rect x="200" y="80" width="160" height="46" rx="8" fill="#141414" stroke="#ececec" />
<text x="280" y="108" text-anchor="middle" class="s">Run the suite</text>
<line x1="280" y1="126" x2="280" y2="136" stroke="#ececec" stroke-width="2" />
<polygon points="280,136 342,186 280,236 218,186" fill="#141414" stroke="#ececec" />
<text x="280" y="180" text-anchor="middle" class="s b">Smoke</text>
<text x="280" y="198" text-anchor="middle" class="s b">regression?</text>
<line x1="342" y1="186" x2="400" y2="186" stroke="#ececec" stroke-width="2" />
<text x="352" y="178" class="s" fill="#e57373">yes</text>
<rect x="400" y="163" width="110" height="46" rx="8" fill="#e57373" />
<text x="455" y="191" text-anchor="middle" class="s b" fill="#fff" style="fill:#1a1a1a">HOLD</text>
<line x1="280" y1="236" x2="280" y2="246" stroke="#ececec" stroke-width="2" />
<text x="272" y="246" text-anchor="end" class="xs">no</text>
<polygon points="280,246 342,296 280,346 218,296" fill="#141414" stroke="#ececec" />
<text x="280" y="300" text-anchor="middle" class="s b">Deltas pass?</text>
<line x1="342" y1="296" x2="400" y2="296" stroke="#ececec" stroke-width="2" />
<text x="352" y="288" class="s" fill="#e57373">no</text>
<rect x="400" y="273" width="110" height="46" rx="8" fill="#e57373" />
<text x="455" y="301" text-anchor="middle" class="s b" fill="#fff" style="fill:#1a1a1a">HOLD</text>
<line x1="280" y1="346" x2="280" y2="356" stroke="#ececec" stroke-width="2" />
<text x="272" y="356" text-anchor="end" class="xs">yes</text>
<rect x="200" y="356" width="160" height="46" rx="8" fill="#7fc97f" />
<text x="280" y="384" text-anchor="middle" class="s b" fill="#fff" style="fill:#1a1a1a">SHIP</text>
</svg>