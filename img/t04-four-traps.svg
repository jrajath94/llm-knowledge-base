<svg xmlns="http://www.w3.org/2000/svg" width="720" height="457" viewBox="0 0 720 457" role="img" aria-label="Four parallelism traps with numbers">
<rect width="720" height="457" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Four traps, each with a number</text>
<rect class="box" x="60" y="58" width="600" height="78" rx="8"/>
<line x1="60" y1="58" x2="60" y2="136" stroke="#f0b429" stroke-width="4"/>
<text x="86" y="82" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Trap 1: TP across slow links</text>
<text x="86" y="104" text-anchor="start" fill="#f0b429" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">keep TP degree at or below NVLink domain (usually 8)</text>
<text x="86" y="122" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">wider than 8 nodes: use PP or FSDP instead</text>
<rect class="box" x="60" y="146" width="600" height="78" rx="8"/>
<line x1="60" y1="146" x2="60" y2="224" stroke="#58a6ff" stroke-width="4"/>
<text x="86" y="170" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Trap 2: PP with too few microbatches</text>
<text x="86" y="192" text-anchor="start" fill="#58a6ff" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">8 stages x 8 microbatches = 47% bubble</text>
<text x="86" y="210" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">microbatches multiply activation memory</text>
<rect class="box" x="60" y="234" width="600" height="78" rx="8"/>
<line x1="60" y1="234" x2="60" y2="312" stroke="#3fb950" stroke-width="4"/>
<text x="86" y="258" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Trap 3: FSDP all-gather storms</text>
<text x="86" y="280" text-anchor="start" fill="#3fb950" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">thousands of tiny collectives, latency floor dominates</text>
<text x="86" y="298" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">picket fence of tiny NCCL kernels in the trace</text>
<rect class="box" x="60" y="322" width="600" height="78" rx="8"/>
<line x1="60" y1="322" x2="60" y2="400" stroke="#e5484d" stroke-width="4"/>
<text x="86" y="346" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Trap 4: batch vs microbatch</text>
<text x="86" y="368" text-anchor="start" fill="#e5484d" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">forgetting accumulation = 8x the intended batch</text>
<text x="86" y="386" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">batch size is a recipe decision, not an accident</text>
<text x="360" y="432" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">every trap is visible in a profile before it is visible in the loss curve</text>
</svg>