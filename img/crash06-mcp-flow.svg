<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.6. MCP: init, discover, invoke</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">use it when tools change independently of your code</text>
<rect x="24" y="130" width="240" height="120" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="144.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INIT</text>
<text x="144.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">handshake: versions,</text>
<text x="144.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">capabilities, auth</text>
<line x1="264" y1="190" x2="320" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="320,190 311.78219953718923,193.66984407753614 311.78219953718923,186.33015592246386" fill="#8a8a8a"/>
<rect x="320" y="130" width="240" height="120" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">DISCOVER</text>
<text x="440.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">list tools and their schemas at</text>
<text x="440.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">runtime</text>
<line x1="560" y1="190" x2="616" y2="190" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="616,190 607.7821995371892,193.66984407753614 607.7821995371892,186.33015592246386" fill="#8a8a8a"/>
<rect x="616" y="130" width="240" height="120" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="736.0" y="156" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">INVOKE</text>
<text x="736.0" y="174" font-size="11" fill="#a8a8a8" text-anchor="middle">call by name; the server owns</text>
<text x="736.0" y="189" font-size="11" fill="#a8a8a8" text-anchor="middle">the implementation</text>
<rect x="24" y="300" width="832" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="326" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">USE MCP WHEN</text>
<text x="440.0" y="344" font-size="11" fill="#a8a8a8" text-anchor="middle">2+ teams own tools, 3+ tools in the loop, or tools change independently of your deploys; otherwise direct</text>
<text x="440.0" y="359" font-size="11" fill="#a8a8a8" text-anchor="middle">integration is simpler</text>
<text x="24" y="470" font-size="12" fill="#a8a8a8" text-anchor="start">MCP is an organizational pattern disguised as a protocol: it decouples who ships the tool from who ships the</text>
<text x="24" y="487" font-size="12" fill="#a8a8a8" text-anchor="start">agent.</text>
</svg>