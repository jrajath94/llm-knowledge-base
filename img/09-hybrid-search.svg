<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Hybrid search pipeline">
<rect width="900" height="400" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="450.0" y="28" text-anchor="middle" font-size="18" class="accent">Hybrid Search: Vector + Keyword</text>
<rect x="50" y="100" width="180" height="60" class="box" rx="4"/>
<text x="140.0" y="122" text-anchor="middle" font-size="14">Query</text>
<line x1="230" y1="130" x2="260" y2="130" class="line"/>
<rect x="260" y="70" width="180" height="60" class="box" rx="4"/>
<text x="350.0" y="92" text-anchor="middle" font-size="14">Vector Search</text>
<text x="350.0" y="110" text-anchor="middle" font-size="11" class="muted">embeddings, ANN</text>
<rect x="260" y="160" width="180" height="60" class="box" rx="4"/>
<text x="350.0" y="182" text-anchor="middle" font-size="14">Keyword Search</text>
<text x="350.0" y="200" text-anchor="middle" font-size="11" class="muted">BM25</text>
<line x1="440" y1="100" x2="470" y2="100" class="line"/>
<line x1="440" y1="190" x2="470" y2="190" class="line"/>
<rect x="470" y="100" width="180" height="80" class="box" rx="4"/>
<text x="560.0" y="122" text-anchor="middle" font-size="14">RRF Merge</text>
<text x="560.0" y="140" text-anchor="middle" font-size="11" class="muted">reciprocal rank fusion</text>
<line x1="650" y1="140" x2="680" y2="140" class="line"/>
<rect x="680" y="100" width="170" height="80" class="box" rx="4"/>
<text x="765.0" y="122" text-anchor="middle" font-size="14">Reranker</text>
<text x="765.0" y="140" text-anchor="middle" font-size="11" class="muted">cross-encoder, top 50</text>
<text x="450" y="280" text-anchor="middle" font-size="12" class="muted">Reranker is slow: only sees top 50, never the million</text>
</svg>