<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="Three headline metrics and supporting gauges">
<rect width="720" height="368" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Three headline metrics, in the order teams read them</text>
<rect class="box" x="20" y="55" width="215" height="215" rx="8"/>
<line x1="20" y1="55" x2="20" y2="270" stroke="#f0b429" stroke-width="4"/>
<text x="127" y="84" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">1. Speed (what the user feels)</text>
<text x="127" y="116" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="700" font-family="Charis SIL, Georgia, serif">p99 TTFT  +  p99 TPOT</text>
<text x="127" y="148" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">time to first token</text>
<text x="127" y="166" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">token-to-token gap</text>
<text x="127" y="184" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">latency budgets</text>
<rect class="box" x="247" y="55" width="215" height="215" rx="8"/>
<line x1="247" y1="55" x2="247" y2="270" stroke="#58a6ff" stroke-width="4"/>
<text x="354" y="84" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">2. Throughput (what the fleet does)</text>
<text x="354" y="116" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700" font-family="Charis SIL, Georgia, serif">tokens / sec / GPU</text>
<text x="354" y="148" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">goodput per accelerator</text>
<text x="354" y="166" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">fleet efficiency</text>
<text x="354" y="184" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">fleet-wide, not one box</text>
<rect class="box" x="474" y="55" width="215" height="215" rx="8"/>
<line x1="474" y1="55" x2="474" y2="270" stroke="#3fb950" stroke-width="4"/>
<text x="581" y="84" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">3. Money (what the business pays)</text>
<text x="581" y="116" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700" font-family="Charis SIL, Georgia, serif">$ per 1M tokens</text>
<text x="581" y="148" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">GPU-hour cost divided by</text>
<text x="581" y="166" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">useful tokens produced</text>
<text x="581" y="184" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">costs someone money</text>
<text x="360" y="300" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">supporting gauges: KV-cache hit rate, queue depth, GPU-hours per request</text>
<text x="360" y="322" text-anchor="middle" fill="#ececec" font-size="13" font-weight="400" font-family="Charis SIL, Georgia, serif">every incident metric maps to exactly one of the three headlines</text>
<text x="360" y="344" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">if a number does not move one of these three, it is decoration</text>
</svg>