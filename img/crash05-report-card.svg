<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="540" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The eval report card: one page that says what you tested and what broke</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">if it is not in the report, it did not happen</text>
<rect x="24" y="110" width="832" height="58" fill="#141414" stroke="#6cb2ff" stroke-width="1.2" rx="6" opacity="1"/>
<text x="48" y="134" font-size="12.5" font-weight="bold" fill="#ececec" text-anchor="start">SCOPE</text>
<text x="48" y="154" font-size="11" fill="#a8a8a8" text-anchor="start">model version, prompt version, dates, who ran it</text>
<rect x="24" y="180" width="832" height="58" fill="#141414" stroke="#4fd1a5" stroke-width="1.2" rx="6" opacity="1"/>
<text x="48" y="204" font-size="12.5" font-weight="bold" fill="#ececec" text-anchor="start">GOLDEN SET</text>
<text x="48" y="224" font-size="11" fill="#a8a8a8" text-anchor="start">version, size, coverage per failure bucket</text>
<rect x="24" y="250" width="832" height="58" fill="#141414" stroke="#f0b429" stroke-width="1.2" rx="6" opacity="1"/>
<text x="48" y="274" font-size="12.5" font-weight="bold" fill="#ececec" text-anchor="start">RESULTS</text>
<text x="48" y="294" font-size="11" fill="#a8a8a8" text-anchor="start">pass rate, break rate per family, kappa of the graders</text>
<rect x="24" y="320" width="832" height="58" fill="#141414" stroke="#e57ea6" stroke-width="1.2" rx="6" opacity="1"/>
<text x="48" y="344" font-size="12.5" font-weight="bold" fill="#ececec" text-anchor="start">CRITICAL FAILURES</text>
<text x="48" y="364" font-size="11" fill="#a8a8a8" text-anchor="start">each one: transcript, bucket, severity, owner, fix date</text>
<rect x="24" y="390" width="832" height="58" fill="#141414" stroke="#b388ff" stroke-width="1.2" rx="6" opacity="1"/>
<text x="48" y="414" font-size="12.5" font-weight="bold" fill="#ececec" text-anchor="start">LIMITATIONS</text>
<text x="48" y="434" font-size="11" fill="#a8a8a8" text-anchor="start">what the eval does NOT cover; the next scheduled run</text>
<text x="24" y="500" font-size="12" fill="#a8a8a8" text-anchor="start">The report card is the product. A perfect eval with no readable report changes nothing; a plain report that</text>
<text x="24" y="517" font-size="12" fill="#a8a8a8" text-anchor="start">names the breaks gets them fixed.</text>
</svg>