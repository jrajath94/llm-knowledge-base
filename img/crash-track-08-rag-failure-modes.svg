<svg xmlns="http://www.w3.org/2000/svg" width="560" height="310" viewBox="0 0 560 310">
<rect width="560" height="310" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Three of four RAG failure modes are not retrieval problems</text><circle cx='36' cy='70' r='6' fill='#7bc98a'/><text x='52' y='75' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>answer not in corpus</text><text x='330' y='75' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>fix: refuse honestly</text><circle cx='36' cy='114' r='6' fill='#f0b429'/><text x='52' y='119' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>corpus stale / wrong</text><text x='330' y='119' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>fix: fix the data pipeline</text><circle cx='36' cy='158' r='6' fill='#f0b429'/><text x='52' y='163' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>task is a skill, not a fact</text><text x='330' y='163' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>fix: fine-tune</text><circle cx='36' cy='202' r='6' fill='#e57ea6'/><text x='52' y='207' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>retrieval actually bad</text><text x='330' y='207' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>fix: then tune retrieval</text><text x='20' y='280' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Profile the pipeline stage by stage on the eval set. Fix the stage that is actually losing.</text></svg>