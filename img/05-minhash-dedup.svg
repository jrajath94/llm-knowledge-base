<text x="730" y="384" font-size="13" fill="#a8a8a8" text-anchor="middle">different signature</text>
<text x="730" y="406" font-size="13" fill="#a8a8a8" text-anchor="middle">keep</text>
<text x="24" y="452" font-size="13" fill="#8a8a8a" text-anchor="start">Each document is summarized by the smallest hash values of its shingles; similar signatures mean similar documents.</text>
