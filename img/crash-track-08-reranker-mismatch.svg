<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310">
<rect width="580" height="310" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>The reranker/generator mismatch</text><rect x='40' y='80' width='220' height='70' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='150.0' y='120.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>reranker</text><text x='150' y='170' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>optimizes textual match</text><rect x='320' y='80' width='220' height='70' rx='8' fill='none' stroke='#7bc98a' stroke-width='1.5'/><text x='430.0' y='120.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='middle'>generator</text><text x='430' y='170' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>needs answer-bearing text</text><text x='40' y='220' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>A chunk that mentions the query 10x but never states the answer</text><text x='40' y='244' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>fools the reranker and starves the generator.</text><text x='40' y='280' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>Fix: the golden set grades the final answer, not the ranking.</text></svg>