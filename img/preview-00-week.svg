<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 360' width='100%' role='img' aria-label='Daily pacing: 4+ hours of study plus the DSA track'>
<rect x='0' y='0' width='960' height='360' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Daily pacing: 4+ hours of study plus the DSA track</text>
<rect x='24' y='80' width='620' height='70' rx='10' fill='#f0b429' opacity='0.9'/>
<text x='334' y='122' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#0d0d0d' text-anchor='middle'>Curriculum study: 4+ hours</text>
<rect x='644' y='80' width='292' height='70' rx='10' fill='#6cb2ff' opacity='0.9'/>
<text x='790' y='122' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#0d0d0d' text-anchor='middle'>DSA: 1-2 hours</text>
<text x='24' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Split the block however you like. Two 2-hour sessions beat one tired 4-hour session.</text>
<text x='24' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>DSA runs every day, not just on weekends.</text>
<rect x='24' y='244' width='912' height='44' rx='8' fill='#141414' stroke='#262626'/>
<text x='480' y='272' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Rest is part of the schedule. A rested brain keeps more.</text>
</svg>
