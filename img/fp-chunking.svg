<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="330" fill="#0d0d0d" rx="8"/>
  <text x="30" y="36" fill="#f0b429" font-size="15" font-weight="700">A document is cut into chunks; chunks overlap so no fact is lost at a boundary</text>
  <!-- document -->
  <rect x="30" y="55" width="120" height="180" fill="#1a1a1a" stroke="#3a3a3a" rx="4"/>
  <text x="90" y="78" fill="#a8a8a8" font-size="12" text-anchor="middle">policy.pdf</text>
  <g stroke="#2e2e2e" stroke-width="3">
    <line x1="42" y1="95" x2="138" y2="95"/><line x1="42" y1="110" x2="138" y2="110"/><line x1="42" y1="125" x2="120" y2="125"/>
    <line x1="42" y1="145" x2="138" y2="145"/><line x1="42" y1="160" x2="138" y2="160"/><line x1="42" y1="175" x2="100" y2="175"/>
    <line x1="42" y1="195" x2="138" y2="195"/><line x1="42" y1="210" x2="128" y2="210"/>
  </g>
  <line x1="150" y1="145" x2="195" y2="145" stroke="#f0b429" stroke-width="2" marker-end="url(#a1)"/>
  <!-- chunks -->
  <g font-size="11">
    <rect x="195" y="55" width="150" height="52" fill="#17332f" stroke="#45b8ac" rx="4"/>
    <text x="270" y="76" fill="#ececec" text-anchor="middle">chunk 1</text>
    <text x="270" y="94" fill="#a8a8a8" text-anchor="middle">"Refunds are allowed</text>
    <rect x="195" y="113" width="150" height="52" fill="#17332f" stroke="#45b8ac" rx="4"/>
    <text x="270" y="134" fill="#ececec" text-anchor="middle">chunk 2 (overlap)</text>
    <text x="270" y="152" fill="#a8a8a8" text-anchor="middle">"...within 30 days</text>
    <rect x="195" y="171" width="150" height="52" fill="#17332f" stroke="#45b8ac" rx="4"/>
    <text x="270" y="192" fill="#ececec" text-anchor="middle">chunk 3</text>
    <text x="270" y="210" fill="#a8a8a8" text-anchor="middle">"of purchase with</text>
    <rect x="195" y="229" width="150" height="52" fill="#17332f" stroke="#45b8ac" rx="4"/>
    <text x="270" y="250" fill="#ececec" text-anchor="middle">chunk 4</text>
    <text x="270" y="268" fill="#a8a8a8" text-anchor="middle">"a valid receipt."</text>
  </g>
  <line x1="270" y1="107" x2="270" y2="113" stroke="#f0b429" stroke-width="2"/>
  <text x="360" y="120" fill="#f0b429" font-size="11">overlap</text>
  <!-- bad split panel -->
  <rect x="420" y="55" width="220" height="110" fill="#2a1512" stroke="#c0392b" stroke-width="2" rx="6"/>
  <text x="530" y="80" fill="#c0392b" font-size="13" font-weight="700" text-anchor="middle">Bad split</text>
  <text x="530" y="104" fill="#ececec" font-size="12" text-anchor="middle">chunk A: "...within 30"</text>
  <text x="530" y="126" fill="#ececec" font-size="12" text-anchor="middle">chunk B: "days of purchase..."</text>
  <text x="530" y="150" fill="#a8a8a8" font-size="11" text-anchor="middle">the fact is cut in half: unfindable</text>
  <!-- good split panel -->
  <rect x="660" y="55" width="220" height="110" fill="#14231f" stroke="#45b8ac" stroke-width="2" rx="6"/>
  <text x="770" y="80" fill="#45b8ac" font-size="13" font-weight="700" text-anchor="middle">Good split</text>
  <text x="770" y="104" fill="#ececec" font-size="12" text-anchor="middle">chunk: "Refunds are allowed</text>
  <text x="770" y="126" fill="#ececec" font-size="12" text-anchor="middle">within 30 days of purchase."</text>
  <text x="770" y="150" fill="#a8a8a8" font-size="11" text-anchor="middle">one idea, one chunk: retrievable</text>
  <text x="420" y="205" fill="#a8a8a8" font-size="12">Chunk size is a trade-off: small chunks are precise but lose context; large chunks keep context but dilute the match.</text>
  <text x="420" y="228" fill="#a8a8a8" font-size="12">Typical: a few hundred tokens with 10 to 20 percent overlap. Each chunk keeps its source page for citations.</text>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker></defs>
</svg>
