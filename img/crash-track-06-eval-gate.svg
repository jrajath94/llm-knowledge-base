<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px" role="img" aria-label="Eval gate: three checks, then a 5 percent canary over 24 hours with automatic rollback">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.big{font-size:13px;font-weight:700}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="32">The eval gate: three checks, then a canary</text>
<text class="m" x="24" y="54">A gate that never says no is decoration. Rejections are normal.</text>

<rect class="box" x="24" y="76" width="210" height="66" rx="8"/><text class="big b" x="129" y="104" text-anchor="middle">1. success rate holds</text><text class="m" x="129" y="126" text-anchor="middle">vs baseline, in the CI</text>
<rect class="box" x="254" y="76" width="210" height="66" rx="8"/><text class="big b" x="359" y="104" text-anchor="middle">2. cost per task</text><text class="m" x="359" y="126" text-anchor="middle">within agreed tolerance</text>
<rect class="box" x="484" y="76" width="212" height="66" rx="8"/><text class="big b" x="590" y="104" text-anchor="middle">3. no new failure cluster</text><text class="m" x="590" y="126" text-anchor="middle">in the trajectory sample</text>

<line class="arr" x1="360" y1="142" x2="360" y2="172"/>
<rect class="box" x="180" y="172" width="360" height="80" rx="8" stroke="#f0b429"/>
<text class="big" x="360" y="200" text-anchor="middle">canary: 5% of live traffic, 24 h window</text>
<text class="m" x="360" y="224" text-anchor="middle">if live numbers diverge from eval: automatic rollback</text>

<line class="arr" x1="240" y1="252" x2="240" y2="282"/>
<line class="arr" x1="480" y1="252" x2="480" y2="282"/>
<rect class="box" x="60" y="282" width="240" height="56" rx="8" stroke="#7fc97f"/><text class="m gr" x="180" y="306" text-anchor="middle">live matches eval</text><text class="big gr" x="180" y="328" text-anchor="middle">ship to 100%</text>
<rect class="box" x="420" y="282" width="240" height="56" rx="8" stroke="#e57373"/><text class="m r" x="540" y="306" text-anchor="middle">live diverges</text><text class="big r" x="540" y="328" text-anchor="middle">roll back</text>

<text class="m" x="24" y="368">Rollbacks are normal outcomes, not emergencies. A healthy team sees rejections weekly.</text>
</svg>
