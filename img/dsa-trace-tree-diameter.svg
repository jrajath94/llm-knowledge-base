<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 33. Tree: 1 has children 2, 3; 2 has children 4, 5. Diameter = longest path in edges. Postorder: children first.</text>
