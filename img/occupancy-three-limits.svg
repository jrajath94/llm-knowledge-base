<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="100%" style="max-width:700px" role="img" aria-label="Register limit allows 5 blocks, shared memory allows 4 blocks, thread limit allows 8; shared memory binds at 50 percent occupancy">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="290" fill="none"/>
<text class="t" x="24" y="30">Three limits, one occupancy number</text>
<text class="m" x="24" y="58">256-thread blocks, 48 regs/thread, 48 KB shared/block</text>
<text class="num" x="24" y="100">Registers: 65,536 / (256x48)</text>
<rect x="280" y="84" width="260" height="26" rx="4" fill="#7fc97f" opacity="0.85"/>
<text class="num" x="550" y="103">5 blocks = 40 warps</text>
<text class="num" x="24" y="140">Shared mem: 228 KB / 48 KB</text>
<rect x="280" y="124" width="208" height="26" rx="4" fill="#e57373" opacity="0.85"/>
<text class="num" x="498" y="143">4 blocks = 32 warps</text>
<text class="num" x="24" y="180">Threads: 2,048 / 256</text>
<rect x="280" y="164" width="416" height="26" rx="4" fill="#7fc97f" opacity="0.85"/>
<text class="num" x="706" y="183">8 blocks = 64 warps</text>
<text class="big r" x="24" y="230">Shared memory binds first: 32/64 warps = 50% occupancy.</text>
<text class="num" x="24" y="254">Shrink tile to 32 KB shared -&gt; 7 blocks, but registers still cap at 5.</text>
<text class="gr" x="24" y="276">New occupancy: 40 warps = 62.5%. The math tells you exactly which knob to turn.</text>
</svg>
