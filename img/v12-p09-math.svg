<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Constitutional AI: the judge needs chain-of-thought, and the economics"><rect x="22" y="14" width="435.0" height="238" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">WITHOUT COT</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">The model picks a response directly</text><circle cx="44" cy="83.5" r="3.2" fill="#e07878"/><text x="56" y="88" font-size="13.5" fill="#a8a8a8">agreement with humans is poor</text><circle cx="44" cy="109.5" r="3.2" fill="#e07878"/><text x="56" y="114" font-size="13.5" fill="#a8a8a8">the choice happens before any principle is</text><text x="56" y="132" font-size="13.5" fill="#a8a8a8">stated</text><rect x="503.0" y="14" width="435.0" height="238" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">WITH COT</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">&quot;Let us think step by step which</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">response is more harmless...&quot;</text><circle cx="525.0" cy="103.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="108" font-size="13.5" fill="#a8a8a8">the model articulates the principle before</text><text x="537.0" y="126" font-size="13.5" fill="#a8a8a8">choosing</text><circle cx="525.0" cy="147.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="152" font-size="13.5" fill="#a8a8a8">agreement jumps: well over 90% binary</text><text x="537.0" y="170" font-size="13.5" fill="#a8a8a8">accuracy at scale</text><circle cx="525.0" cy="191.5" r="3.2" fill="#7fd08a"/><text x="537.0" y="196" font-size="13.5" fill="#a8a8a8">the reasoning trace does the work, not the</text><text x="537.0" y="214" font-size="13.5" fill="#a8a8a8">choice</text><line x1="467.0" y1="133.0" x2="487.0" y2="133.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,128.0 495.0,133.0 487.0,138.0" fill="#a8a8a8"/></svg>