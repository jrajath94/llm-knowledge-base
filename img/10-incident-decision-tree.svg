<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Decision flowchart from symptom to blameless review"><rect x="22" y="14" width="916" height="402" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">CHAPTER 7</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Incident response: mitigate first, then fix</text><rect x="38" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#f0b429"/><text x="92" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Symptom</text><text x="92" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">dashboard turns red</text><line x1="146" y1="170" x2="168" y2="170" stroke="#f0b429" stroke-width="2"/><path d="M 160 166 L 168 170 L 160 174" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="168" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="222" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Detect</text><text x="222" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">name the symptom</text><line x1="276" y1="170" x2="298" y2="170" stroke="#f0b429" stroke-width="2"/><path d="M 290 166 L 298 170 L 290 174" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="298" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="352" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Triage</text><text x="352" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">which system broke?</text><line x1="406" y1="170" x2="428" y2="170" stroke="#f0b429" stroke-width="2"/><path d="M 420 166 L 428 170 L 420 174" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="428" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#e06c6c"/><text x="482" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Mitigate</text><text x="482" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">roll back first</text><line x1="536" y1="170" x2="558" y2="170" stroke="#f0b429" stroke-width="2"/><path d="M 550 166 L 558 170 L 550 174" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="558" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="612" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Fix</text><text x="612" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">root cause</text><line x1="666" y1="170" x2="688" y2="170" stroke="#f0b429" stroke-width="2"/><path d="M 680 166 L 688 170 L 680 174" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="688" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="742" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Verify</text><text x="742" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">quality back at baseline?</text><line x1="796" y1="170" x2="818" y2="170" stroke="#f0b429" stroke-width="2"/><path d="M 810 166 L 818 170 L 810 174" stroke="#f0b429" stroke-width="2" fill="none"/><rect x="818" y="120" width="108" height="100" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/><text x="872" y="160" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Review</text><text x="872" y="182" font-size="11" font-weight="400" fill="#a8a8a8" text-anchor="middle">blameless postmortem</text><text x="38" y="260" font-size="13.5" font-weight="700" fill="#ececec" text-anchor="start">The order is the lesson: detect, triage, mitigate, fix, verify, review.</text><text x="38" y="286" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">Mitigate before fix: stop user damage first, diagnose second.</text><text x="38" y="312" font-size="13" font-weight="400" fill="#a8a8a8" text-anchor="start">Review is blameless: the system allowed it, no human takes the blame.</text><text x="38" y="352" font-size="12.5" font-weight="400" fill="#6e6e6e" text-anchor="start">Walkthrough: 1) read left to right; 2) each box is a phase with an exit test;</text><text x="38" y="372" font-size="12.5" font-weight="400" fill="#6e6e6e" text-anchor="start">3) if mitigate fails, escalate before attempting fix; 4) verify needs a number, not a feeling.</text></svg>