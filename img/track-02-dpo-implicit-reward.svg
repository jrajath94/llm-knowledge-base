<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" role="img" aria-label="DPO implicit reward as the policy log-ratio">
<rect width="700" height="380" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#f0b429" stroke-width="1.6"/></marker>
<marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/></marker>
</defs>
<text x="24" y="34" class="t">DPO’s trick: the policy itself stores the reward</text><rect x="30" y="70" width="200" height="120" rx="8" class="box"/><text x="130" y="104" text-anchor="middle" class="t">Policy π</text><text x="130" y="130" text-anchor="middle" class="s">log prob of chosen</text><text x="130" y="152" text-anchor="middle" class="s">minus log prob of rejected</text><rect x="470" y="70" width="200" height="120" rx="8" class="box"/><text x="570" y="104" text-anchor="middle" class="t">Reference πref</text><text x="570" y="130" text-anchor="middle" class="s">same difference,</text><text x="570" y="152" text-anchor="middle" class="s">anchored start point</text><text x="350" y="120" text-anchor="middle" class="num">−</text><text x="350" y="160" text-anchor="middle" class="ss">margin over reference</text><path d="350,200 v40" class="arr"/><rect x="220" y="240" width="260" height="80" rx="8" class="box" stroke="#2dd4bf"/><text x="350" y="272" text-anchor="middle" class="t" fill="#2dd4bf">implicit reward</text><text x="350" y="296" text-anchor="middle" class="s">no separate model needed</text><text x="30" y="350" class="s">DPO skips the reward model. The classification loss trains the policy directly,</text><text x="30" y="370" class="s">and the reward lives inside the policy as this log-ratio.</text></svg>