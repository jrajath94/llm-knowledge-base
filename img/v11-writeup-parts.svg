<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 246" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A results writeup with four load-bearing parts"><rect x="22" y="14" width="916" height="218" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">WRITING RESULTS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">A result nobody trusts is a result that never happened</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">The exact claim:</text><text x="209.340546875" y="94" font-size="13.5" fill="#a8a8a8">numbers and conditions: &quot;+0.4 points on benchmark X with 5 seeds, p &lt; 0.05</text><text x="80" y="113" font-size="13.5" fill="#a8a8a8">paired&quot;.</text><path d="M 53.7 139.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="144" font-size="13.5" font-weight="700" fill="#ececec">The method:</text><text x="180.99898437500002" y="144" font-size="13.5" fill="#a8a8a8">detailed enough to re-run: hyperparameters, seeds, compute, code version.</text><path d="M 53.7 170.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="175" font-size="13.5" font-weight="700" fill="#ececec">The full evidence:</text><text x="220.38734375" y="175" font-size="13.5" fill="#a8a8a8">the main table, the ablations, the error bars, and the negative results found along</text><text x="80" y="194" font-size="13.5" fill="#a8a8a8">the way.</text><path d="M 53.7 220.7 l 4.55 5.25 l 8.75 -10.5" stroke="#7fd08a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="225" font-size="13.5" font-weight="700" fill="#ececec">The interpretation:</text><text x="230.28453125000001" y="225" font-size="13.5" fill="#a8a8a8">clearly labeled as yours, including what would change your mind.</text></svg>