<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="100%" style="max-width:760px" role="img" aria-label="Clean split, one standout, and uniform group: advantages in standard-deviation units">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="376" fill="none"/>
<text class="t" x="24" y="30">GRPO group-relative advantages: three cases</text>
<rect x="24" y="56" width="712" height="76" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.6"/>
<text class="big" x="44" y="86">clean split</text>
<text class="num" x="44" y="110">rewards: 1  1  0  0</text>
<text class="big g" x="360" y="86">advantages:</text>
<text class="num" x="360" y="110">+1.00  +1.00  -1.00  -1.00</text>
<rect x="24" y="144" width="712" height="76" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.6"/>
<text class="big" x="44" y="174">one standout</text>
<text class="num" x="44" y="198">rewards: 1  0  0  0</text>
<text class="big g" x="360" y="174">advantages:</text>
<text class="num" x="360" y="198">+1.73  -0.58  -0.58  -0.58</text>
<rect x="24" y="232" width="712" height="76" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.6"/>
<text class="big" x="44" y="262">uniform group</text>
<text class="num" x="44" y="286">rewards: 1  1  1  1</text>
<text class="big g" x="360" y="262">advantages:</text>
<text class="num" x="360" y="286">no signal: skip</text>
<text class="num" x="24" y="328">A = (r - group mean) / group std. The group is its own baseline: no value network needed.</text>
<text class="m" x="24" y="352">Uniform groups carry no signal and must be skipped, or the division blows up.</text>
</svg>
