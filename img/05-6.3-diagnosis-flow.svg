<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">From shape to action: the diagnosis flow</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">each curve shape maps to a cause and a response</text>
<text x="24" y="84" font-size="12" fill="#8a8a8a" text-anchor="start">shape seen</text>
<text x="250" y="84" font-size="12" fill="#8a8a8a" text-anchor="start">likely cause</text>
<text x="560" y="84" font-size="12" fill="#8a8a8a" text-anchor="start">what practitioners do</text>
<rect x="24" y="100" width="210" height="46" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="128" font-size="12" fill="#ececec" text-anchor="start">sudden spike, recovers</text>
<line x1="244" y1="123" x2="262" y2="123" stroke="#f0b429" stroke-width="2"/>
<polygon points="262,123 253.78219953718923,126.66984407753613 253.78219953718923,119.33015592246387" fill="#f0b429"/>
<text x="272" y="128" font-size="12" fill="#a8a8a8" text-anchor="start">bad batch / rare numeric event</text>
<line x1="540" y1="123" x2="558" y2="123" stroke="#f0b429" stroke-width="2"/>
<polygon points="558,123 549.7821995371892,126.66984407753613 549.7821995371892,119.33015592246387" fill="#f0b429"/>
<text x="568" y="128" font-size="12" fill="#ececec" text-anchor="start">watch; clipping limits damage</text>
<rect x="24" y="162" width="210" height="46" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="190" font-size="12" fill="#ececec" text-anchor="start">repeated spikes</text>
<line x1="244" y1="185" x2="262" y2="185" stroke="#e57ea6" stroke-width="2"/>
<polygon points="262,185 253.78219953718923,188.66984407753614 253.78219953718923,181.33015592246386" fill="#e57ea6"/>
<text x="272" y="190" font-size="12" fill="#a8a8a8" text-anchor="start">LR too high / unstable pipeline</text>
<line x1="540" y1="185" x2="558" y2="185" stroke="#e57ea6" stroke-width="2"/>
<polygon points="558,185 549.7821995371892,188.66984407753614 549.7821995371892,181.33015592246386" fill="#e57ea6"/>
<text x="568" y="190" font-size="12" fill="#ececec" text-anchor="start">roll back, lower LR, audit loader</text>
<rect x="24" y="224" width="210" height="46" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="252" font-size="12" fill="#ececec" text-anchor="start">steady climb</text>
<line x1="244" y1="247" x2="262" y2="247" stroke="#e57ea6" stroke-width="2"/>
<polygon points="262,247 253.78219953718923,250.66984407753614 253.78219953718923,243.33015592246386" fill="#e57ea6"/>
<text x="272" y="252" font-size="12" fill="#a8a8a8" text-anchor="start">divergence: LR far too high</text>
<line x1="540" y1="247" x2="558" y2="247" stroke="#e57ea6" stroke-width="2"/>
<polygon points="558,247 549.7821995371892,250.66984407753614 549.7821995371892,243.33015592246386" fill="#e57ea6"/>
<text x="568" y="252" font-size="12" fill="#ececec" text-anchor="start">STOP. roll back. never push through</text>
<rect x="24" y="286" width="210" height="46" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="314" font-size="12" fill="#ececec" text-anchor="start">high plateau</text>
<line x1="244" y1="309" x2="262" y2="309" stroke="#6cb2ff" stroke-width="2"/>
<polygon points="262,309 253.78219953718923,312.66984407753614 253.78219953718923,305.33015592246386" fill="#6cb2ff"/>
<text x="272" y="314" font-size="12" fill="#a8a8a8" text-anchor="start">LR too low / decayed early / data</text>
<line x1="540" y1="309" x2="558" y2="309" stroke="#6cb2ff" stroke-width="2"/>
<polygon points="558,309 549.7821995371892,312.66984407753614 549.7821995371892,305.33015592246386" fill="#6cb2ff"/>
<text x="568" y="314" font-size="12" fill="#ececec" text-anchor="start">check schedule, then data, then config</text>
<rect x="24" y="348" width="210" height="46" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="376" font-size="12" fill="#ececec" text-anchor="start">NaN</text>
<line x1="244" y1="371" x2="262" y2="371" stroke="#b388ff" stroke-width="2"/>
<polygon points="262,371 253.78219953718923,374.66984407753614 253.78219953718923,367.33015592246386" fill="#b388ff"/>
<text x="272" y="376" font-size="12" fill="#a8a8a8" text-anchor="start">numerical overflow</text>
<line x1="540" y1="371" x2="558" y2="371" stroke="#b388ff" stroke-width="2"/>
<polygon points="558,371 549.7821995371892,374.66984407753614 549.7821995371892,367.33015592246386" fill="#b388ff"/>
<text x="568" y="376" font-size="12" fill="#ececec" text-anchor="start">roll back past it, skip bad batches</text>
<text x="24" y="426" font-size="12" fill="#a8a8a8" text-anchor="start">Calibration strip: loss starts near 10.4 (32k vocab), should be falling through 6-7 after warmup,</text>
<text x="24" y="446" font-size="12" fill="#f0b429" text-anchor="start">lands near 1.8-2.2 at finish. Above 8 at 10% of training: something is wrong.</text>
</svg>