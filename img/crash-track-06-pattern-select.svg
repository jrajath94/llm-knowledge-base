<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="Pattern selection: ReAct, plan-and-execute, multi-agent">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Pattern selection</text>
<text x="300" y="58" text-anchor="middle" class="xs">Match the pattern to the task shape.</text>
<rect x="60" y="70" width="480" height="80" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="2.5"/>
<text x="80" y="100" class="s b">ReAct</text>
<text x="80" y="122" class="xs">Short, unknown shape. ~8 steps or fewer.</text>
<rect x="60" y="170" width="480" height="80" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2.5"/>
<text x="80" y="200" class="s b">Plan-and-execute</text>
<text x="80" y="222" class="xs">Long, knowable shape. Plan first, replan path required.</text>
<rect x="60" y="270" width="480" height="80" rx="8" fill="#141414" stroke="#a78bfa" stroke-width="2.5"/>
<text x="80" y="300" class="s b">Multi-agent</text>
<text x="80" y="322" class="xs">Long, splittable. Workers in parallel, critic on outputs.</text>
</svg>
