<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 500" role="img" aria-label="Hash map anatomy: keys become slot numbers">
<rect width="900" height="500" fill="#0d0d0d"/>
<text x="450.0" y="24" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Hash map anatomy: keys become slot numbers</text>
<text x="450.0" y="48" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">A hash function turns each key into an array index. Two keys can share one slot: that is a collision.</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<text x="30" y="96" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">keys</text>
<rect x="20" y="116" width="110" height="38" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="75" y="141" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">"apple"</text>
<rect x="20" y="226" width="110" height="38" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="75" y="251" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">"fig"</text>
<rect x="20" y="336" width="110" height="38" rx="6" fill="#1a1a1a" stroke="#2a2a2a"/>
<text x="75" y="361" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">"date"</text>
<rect x="190" y="216" width="150" height="68" rx="6" fill="#1a1a1a" stroke="#f0b429"/>
<text x="265" y="244" text-anchor="middle" fill="#f0b429" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">hash(key) % 7</text>
<text x="265" y="264" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">slot number</text>
<line x1="134" y1="135" x2="186" y2="221.8" stroke="#f0b429" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="134" y1="245" x2="186" y2="235.0" stroke="#f0b429" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="134" y1="355" x2="186" y2="248.2" stroke="#f0b429" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="400" y="86" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">bucket array (size 7)</text>
<rect x="400" y="100" width="200" height="36" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="386" y="124" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">0</text>
<rect x="400" y="146" width="200" height="36" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="386" y="170" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">1</text>
<rect x="400" y="192" width="200" height="36" rx="6" fill="#1c1a10" stroke="#f0b429"/>
<text x="386" y="216" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">2</text>
<rect x="400" y="238" width="200" height="36" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="386" y="262" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">3</text>
<rect x="400" y="284" width="200" height="36" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="386" y="308" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">4</text>
<rect x="400" y="330" width="200" height="36" rx="6" fill="#1c1a10" stroke="#f0b429"/>
<text x="386" y="354" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">5</text>
<rect x="400" y="376" width="200" height="36" rx="6" fill="#141414" stroke="#2a2a2a"/>
<text x="386" y="400" text-anchor="end" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">6</text>
<line x1="344" y1="250" x2="394" y2="210.0" stroke="#f0b429" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="344" y1="250" x2="394" y2="348.0" stroke="#f0b429" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="660" y="86" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">inside the full buckets</text>
<text x="660" y="124" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">bucket 2 holds two keys:</text>
<rect x="660" y="136" width="100" height="32" rx="6" fill="#1a1a1a" stroke="#f0b429"/>
<text x="710" y="157" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">apple</text>
<line x1="764" y1="152" x2="782" y2="152" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="786" y="136" width="90" height="32" rx="6" fill="#1a1a1a" stroke="#f0b429"/>
<text x="831" y="157" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">date</text>
<text x="660" y="192" text-anchor="start" fill="#e06c75" font-size="11.5" font-family="Charis SIL, Georgia, serif">a collision chain: search walks</text>
<text x="660" y="208" text-anchor="start" fill="#e06c75" font-size="11.5" font-family="Charis SIL, Georgia, serif">the chain one key at a time</text>
<text x="660" y="250" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">bucket 5 holds one key:</text>
<rect x="660" y="262" width="100" height="32" rx="6" fill="#1a1a1a" stroke="#7bc96f"/>
<text x="710" y="283" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">fig</text>
<text x="60" y="452" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Average lookup: one hash plus one array read = O(1).</text>
<text x="60" y="474" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">Worst case: every key lands in one bucket = O(n) per lookup.</text>
</svg>
