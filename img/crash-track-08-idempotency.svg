<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
<rect width="520" height="340" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Idempotency: the retry that never double-applies</text><rect x='40' y='80' width='150' height='60' rx='8' fill='none' stroke='#9a9a9a' stroke-width='1.5'/><text x='115.0' y='115.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>client</text><text x='115' y='160' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>request id: 7f3a</text><line x1='190' y1='110' x2='250' y2='110' stroke='#9a9a9a' stroke-width='2'/><polygon points='250,110 241,106 241,114' fill='#9a9a9a'/><rect x='250' y='80' width='170' height='60' rx='8' fill='none' stroke='#9a9a9a' stroke-width='1.5'/><text x='335.0' y='115.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>tool</text><text x='335' y='160' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>dedup on id</text><text x='40' y='210' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>1st try: times out. Client retries with the SAME id.</text><text x='40' y='236' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>2nd try: tool sees id 7f3a already applied. Returns the stored result.</text><text x='40' y='262' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>No double charge. No double refund. No double email.</text><text x='20' y='310' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Client-generated request id + dedup on it = safe retries.</text></svg>