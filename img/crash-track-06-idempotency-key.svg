<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px" role="img" aria-label="Idempotency keys: timeouts lie, so the retry carries the same key and the server returns the stored result instead of charging twice">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.big{font-size:13px;font-weight:700}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="32">Idempotency: timeouts lie, keys do not</text>
<text class="m" x="24" y="54">The caller passes a unique key per logical operation. The tool remembers executed keys.</text>

<rect class="box" x="24" y="76" width="170" height="60" rx="8"/><text class="big b" x="109" y="102" text-anchor="middle">agent</text><text class="m" x="109" y="122" text-anchor="middle">charge(key = k1)</text>
<rect class="box" x="262" y="76" width="196" height="60" rx="8"/><text class="big" x="360" y="102" text-anchor="middle">tool</text><text class="m" x="360" y="122" text-anchor="middle">executes, stores k1</text>
<line class="arr" x1="194" y1="106" x2="254" y2="106"/>

<rect class="box" x="262" y="160" width="196" height="46" rx="8" stroke="#e57373"/><text class="m r" x="360" y="188" text-anchor="middle">response lost: timeout</text>
<text class="m r" x="490" y="188">the charge may have succeeded</text>

<rect class="box" x="24" y="230" width="170" height="60" rx="8"/><text class="big b" x="109" y="256" text-anchor="middle">agent</text><text class="m" x="109" y="276" text-anchor="middle">retry charge(key = k1)</text>
<rect class="box" x="262" y="230" width="196" height="60" rx="8" stroke="#7fc97f"/><text class="big gr" x="360" y="256" text-anchor="middle">tool</text><text class="m gr" x="360" y="276" text-anchor="middle">k1 seen: return stored result</text>
<line class="arr" x1="194" y1="260" x2="254" y2="260"/>
<text class="m" x="490" y="256">same key, no second charge</text>
<text class="m" x="490" y="276">retry is safe by construction</text>

<rect class="box" x="24" y="316" width="672" height="56" rx="8" stroke="#f0b429"/>
<text class="big" x="360" y="340" text-anchor="middle">Without the key, the retry double-charges.</text>
<text class="m" x="360" y="360" text-anchor="middle">Every mutation carries an idempotency key. No key, no retry policy.</text>
</svg>
