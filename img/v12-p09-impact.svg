<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 227" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why Constitutional AI mattered"><rect x="22" y="14" width="916" height="199" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">This paper is why &quot;RLAIF&quot; exists as a term and a practice</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Legible values:</text><text x="199.6353125" y="94" font-size="13.5" fill="#a8a8a8">a written specification steers training as well as thousands of human judgments.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Arguable:</text><text x="159.0340625" y="125" font-size="13.5" fill="#a8a8a8">you can read the constitution and debate it instead of inferring values from weights.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Basis for Claude:</text><text x="213.474921875" y="156" font-size="13.5" fill="#a8a8a8">the training lineage runs through this paper.</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">The pattern spread:</text><text x="236.86156250000002" y="187" font-size="13.5" fill="#a8a8a8">&quot;model critiques itself against principles&quot; now appears in self-correction research</text><text x="80" y="206" font-size="13.5" fill="#a8a8a8">everywhere.</text></svg>