<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The pipeline bubble shrinks with microbatches</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">bubble = (p-1)/(m+p-1): with 4 stages, 8 microbatches waste 27%, 32 waste 9%</text>
<rect x="70" y="90" width="480" height="200" fill="#141414" stroke="#4a4a4a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="62" y="290" font-size="12" fill="#8a8a8a" text-anchor="end">bubble</text>
<text x="550" y="310" font-size="12" fill="#8a8a8a" text-anchor="end">microbatches m (p = 4 stages)</text>
