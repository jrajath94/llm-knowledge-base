<circle cx="114.13333333333333" cy="180.96969696969697" r="5" fill="#f0b429"/>
<text x="126.13333333333333" y="172.96969696969697" font-size="12" fill="#f0b429" text-anchor="start">m=8: 27% idle</text>
<circle cx="294.93333333333334" cy="258.93333333333334" r="5" fill="#f0b429"/>
<text x="306.93333333333334" y="250.93333333333334" font-size="12" fill="#f0b429" text-anchor="start">m=32: 9% idle</text>
<text x="570" y="130" font-size="12" fill="#ececec" text-anchor="start">Same bubble for GPipe</text>
<text x="570" y="152" font-size="12" fill="#ececec" text-anchor="start">and 1F1B. 1F1B&#x27;s win is</text>
<text x="570" y="174" font-size="12" fill="#ececec" text-anchor="start">activation memory: O(p)</text>
<text x="570" y="196" font-size="12" fill="#ececec" text-anchor="start">live microbatches per</text>
<text x="570" y="218" font-size="12" fill="#ececec" text-anchor="start">stage, not O(m).</text>
<text x="24" y="334" font-size="13" fill="#f0b429" text-anchor="start">Rule of thumb: keep microbatches much larger than stages, but tiny microbatches hurt GPU efficiency. There is a sweet spot.</text>
