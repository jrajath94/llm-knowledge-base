<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" style="max-width:760px" role="img" aria-label="Five reward bars with a dashed group-mean line: advantage is reward minus group mean over group std.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">GRPO: the group is the baseline, no critic</text>
<rect x="120" y="200.0" width="70" height="30.0" rx="4" fill="#e57373"/>
<text x="155" y="250" text-anchor="middle" class="m">r=0.2</text>
<rect x="240" y="95.0" width="70" height="135.0" rx="4" fill="#7fc97f"/>
<text x="275" y="250" text-anchor="middle" class="m">r=0.9</text>
<rect x="360" y="155.0" width="70" height="75.0" rx="4" fill="#e57373"/>
<text x="395" y="250" text-anchor="middle" class="m">r=0.5</text>
<rect x="480" y="125.0" width="70" height="105.0" rx="4" fill="#7fc97f"/>
<text x="515" y="250" text-anchor="middle" class="m">r=0.7</text>
<rect x="600" y="170.0" width="70" height="60.0" rx="4" fill="#e57373"/>
<text x="635" y="250" text-anchor="middle" class="m">r=0.4</text>
<line x1="100" y1="149.0" x2="700" y2="149.0" stroke="#f0b429" stroke-dasharray="6,4" stroke-width="2"/>
<text x="712" y="153.0" text-anchor="end" class="s">group mean</text>
<text x="24" y="300" text-anchor="start" class="s">advantage = (reward - group mean) / group std. Green beats the group, red trails it.</text>
</svg>