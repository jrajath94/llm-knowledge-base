<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 471" role="img" aria-label="The four monitoring layers">
<rect width="900" height="471" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The four monitoring layers</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Labels take weeks to arrive. A setup that only watches accuracy is blind for those weeks.</text>
<rect x="40.0" y="69.0" width="4.0" height="66.0" rx="6" fill="#2dd4bf" stroke="none" stroke-width="1"/>
<rect x="40.0" y="69.0" width="820.0" height="66.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="93.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Layer 1. Inputs</text>
<text x="60.0" y="115.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">feature distributions, null rates, freshness</text>
<text x="830.0" y="93.0" text-anchor="end" fill="#2dd4bf" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">alert in minutes</text>
<text x="830.0" y="115.0" text-anchor="end" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">is the pipe broken?</text>
<rect x="40.0" y="145.0" width="4.0" height="66.0" rx="6" fill="#4aa8ff" stroke="none" stroke-width="1"/>
<rect x="40.0" y="145.0" width="820.0" height="66.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="169.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Layer 2. Predictions</text>
<text x="60.0" y="191.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">distribution of model outputs</text>
<text x="830.0" y="169.0" text-anchor="end" fill="#4aa8ff" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">alert in minutes, needs no labels</text>
<text x="830.0" y="191.0" text-anchor="end" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">drift without labels, but ambiguous</text>
<rect x="40.0" y="221.0" width="4.0" height="66.0" rx="6" fill="#4caf50" stroke="none" stroke-width="1"/>
<rect x="40.0" y="221.0" width="820.0" height="66.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="245.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Layer 3. Outcomes</text>
<text x="60.0" y="267.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">ground-truth labels, the business metric</text>
<text x="830.0" y="245.0" text-anchor="end" fill="#4caf50" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">daily / weekly review</text>
<text x="830.0" y="267.0" text-anchor="end" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">slowest, most authoritative</text>
<rect x="40.0" y="297.0" width="4.0" height="66.0" rx="6" fill="#b388ff" stroke="none" stroke-width="1"/>
<rect x="40.0" y="297.0" width="820.0" height="66.0" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="321.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Layer 4. System</text>
<text x="60.0" y="343.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">latency, error rate, throughput, cost</text>
<text x="830.0" y="321.0" text-anchor="end" fill="#b388ff" font-size="11.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">alert in minutes</text>
<text x="830.0" y="343.0" text-anchor="end" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">can the model serve?</text>
<text x="40.0" y="401.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Disambiguation: Layer 2 is always available and therefore ambiguous. Layer 1 disambiguates a broken</text>
<text x="40.0" y="417.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">pipeline from a changed world. When Layer 3 disagrees with Layer 2, believe Layer 3. Never retrain</text>
<text x="40.0" y="433.4" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">into a data incident.</text>
</svg>
