<svg xmlns='http://www.w3.org/2000/svg' width='700' height='400' viewBox='0 0 700 400' font-family='DejaVu Sans'>
<rect width='700' height='400' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Log-space: products underflow, sums do not</text>
<rect x='60' y='70' width='280' height='230' rx='8' fill='none' stroke='#ff7b8a' stroke-width='1.5'/>
<text x='200' y='100' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>MULTIPLY RAW</text>
<text x='200' y='145' font-size='13' fill='#e8e8e8' text-anchor='middle'>p1 x p2 x ... x p100</text>
<text x='200' y='175' font-size='12' fill='#9a9a9a' text-anchor='middle'>each ~ 0.1</text>
<text x='200' y='210' font-size='13' fill='#e8e8e8' text-anchor='middle'>product ~ 1e-100</text>
<text x='200' y='240' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>float -> 0.0 underflow</text>
<rect x='360' y='70' width='280' height='230' rx='8' fill='none' stroke='#7fd08a' stroke-width='1.5'/>
<text x='500' y='100' font-size='13' fill='#7fd08a' text-anchor='middle' font-weight='bold'>SUM LOGS</text>
<text x='500' y='145' font-size='13' fill='#e8e8e8' text-anchor='middle'>log p1 + ... + log p100</text>
<text x='500' y='175' font-size='12' fill='#9a9a9a' text-anchor='middle'>each ~ -2.3</text>
<text x='500' y='210' font-size='13' fill='#e8e8e8' text-anchor='middle'>sum ~ -230</text>
<text x='500' y='240' font-size='13' fill='#7fd08a' text-anchor='middle' font-weight='bold'>a normal float</text>
<text x='350' y='345' font-size='12' fill='#9a9a9a' text-anchor='middle'>Naive Bayes chains hundreds of likelihoods. The log-odds habit starts here.</text>
</svg>