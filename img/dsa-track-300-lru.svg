<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 500" role="img" aria-label="Figure 50. The map finds, the list orders">
<rect width="900" height="500" fill="#0d0d0d"/>
<text x="450.0" y="26" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Figure 50. The map finds, the list orders</text>
<text x="450.0" y="50" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">LRU: hash map to the node (O(1) find), doubly linked list for recency (O(1) reorder)</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs>
<text x="120" y="120" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">hash map</text>
<rect x="60" y="150" width="120" height="40" rx="8" fill="#141414" stroke="#2a2a2a"/>
<text x="120" y="176" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">key 1</text>
<line x1="180" y1="170" x2="550" y2="168" stroke="#6aa8ff" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="206" width="120" height="40" rx="8" fill="#141414" stroke="#2a2a2a"/>
<text x="120" y="232" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">key 2</text>
<line x1="180" y1="226" x2="710" y2="168" stroke="#6aa8ff" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="262" width="120" height="40" rx="8" fill="#141414" stroke="#2a2a2a"/>
<text x="120" y="288" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">key 3</text>
<line x1="180" y1="282" x2="390" y2="168" stroke="#6aa8ff" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="560" y="120" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">recency list (head = newest)</text>
<rect x="330" y="140" width="120" height="56" rx="8" fill="#1a1a1a" stroke="#7fd08a" stroke-width="1.5"/>
<text x="390" y="168" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">node 3</text>
<text x="390" y="188" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">MRU</text>
<rect x="490" y="140" width="120" height="56" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="550" y="168" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">node 1</text>
<text x="550" y="188" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif"></text>
<rect x="650" y="140" width="120" height="56" rx="8" fill="#1a1a1a" stroke="#ff7b8a" stroke-width="1.5"/>
<text x="710" y="168" text-anchor="middle" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">node 2</text>
<text x="710" y="188" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">LRU</text>
<line x1="450" y1="168" x2="490" y2="168" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="490" y1="180" x2="450" y2="180" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="610" y1="168" x2="650" y2="168" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="650" y1="180" x2="610" y2="180" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="450" y="260" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">get(2): map finds the node, list moves it to the head. Both are O(1)</text>
<text x="450" y="290" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif">evict: drop the tail; the map deletes its key. Both are O(1)</text>
<text x="450.0" y="486" text-anchor="middle" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Research Engineer Curriculum, DSA Track: one structure cannot give both guarantees; the pair can. Source: original.</text>
</svg>
