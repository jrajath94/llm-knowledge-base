<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Sequential Bayes: posterior becomes the next prior">
<rect width="900" height="360" rx="12" fill="#0f1420"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9ff"/></marker>
<marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa4b8"/></marker></defs>
<text x="450" y="36" font-family="sans-serif" font-size="20" fill="#e8ecf4" text-anchor="middle" font-weight="bold">Sequential Bayes</text>
<text x="450" y="62" font-family="sans-serif" font-size="14" fill="#9aa4b8" text-anchor="middle" font-weight="normal">yesterday's posterior is today's prior</text>
<rect x="80" y="110" width="130" height="100" rx="8" fill="#182030" stroke="#9aa4b8" stroke-width="1.5"/>
<text x="145" y="145" font-family="sans-serif" font-size="14" fill="#9aa4b8" text-anchor="middle" font-weight="bold">prior</text>
<text x="145" y="170" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">flat</text>
<rect x="290" y="110" width="130" height="100" rx="8" fill="#182030" stroke="#5aa9ff" stroke-width="1.5"/>
<text x="355" y="145" font-family="sans-serif" font-size="14" fill="#5aa9ff" text-anchor="middle" font-weight="bold">+ data 1</text>
<text x="355" y="170" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">-&gt; posterior 1</text>
<rect x="500" y="110" width="130" height="100" rx="8" fill="#182030" stroke="#5fd08a" stroke-width="1.5"/>
<text x="565" y="145" font-family="sans-serif" font-size="14" fill="#5fd08a" text-anchor="middle" font-weight="bold">+ data 2</text>
<text x="565" y="170" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">-&gt; posterior 2</text>
<rect x="710" y="110" width="130" height="100" rx="8" fill="#182030" stroke="#ffb347" stroke-width="1.5"/>
<text x="775" y="145" font-family="sans-serif" font-size="14" fill="#ffb347" text-anchor="middle" font-weight="bold">+ data 3</text>
<text x="775" y="170" font-family="sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle" font-weight="normal">-&gt; posterior 3</text>
<line x1="210" y1="160" x2="290" y2="160" stroke="#5aa9ff" stroke-width="2" marker-end="url(#arr)"/>
<line x1="420" y1="160" x2="500" y2="160" stroke="#5aa9ff" stroke-width="2" marker-end="url(#arr)"/>
<line x1="630" y1="160" x2="710" y2="160" stroke="#5aa9ff" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="260" font-family="sans-serif" font-size="15" fill="#e8ecf4" text-anchor="middle" font-weight="normal">P(theta | data) prop. P(data | theta) x P(theta)</text>
<text x="450" y="300" font-family="sans-serif" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="normal">Each update sharpens the belief. With enough data, the prior washes out.</text>
</svg>