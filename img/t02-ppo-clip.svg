<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" width="100%" style="max-width:660px" role="img" aria-label="Unclipped line vs clipped objective with eps 0.2; the objective flattens past ratio 1.2">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="660" height="410" fill="none"/>
<text class="t" x="24" y="30">PPO clip: the trust region per step</text>
<line x1="80" y1="300" x2="640" y2="300" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="80" y1="300" x2="80" y2="60" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="m" x="360" y="332" text-anchor="middle">ratio = p_new / p_old</text>
<text class="m" x="60" y="180" text-anchor="middle">objective</text>
<text class="m" x="60" y="200" text-anchor="middle">(A = +1)</text>
<polyline points="80,280 91,276 102,272 114,268 125,264 136,260 147,256 158,252 170,248 181,244 192,240 203,236 214,232 226,228 237,224 248,220 259,216 270,212 282,208 293,204 304,200 315,196 326,192 338,188 349,184 360,180 371,176 382,172 394,168 405,164 416,160 427,156 438,152 450,148 461,144 472,140 483,136 494,132 506,128 517,124 528,120 539,116 550,112 562,108 573,104 584,100 595,96 606,92 618,88 629,84 640,80" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6,4"/>
<polyline points="80,280 91,276 102,272 114,268 125,264 136,260 147,256 158,252 170,248 181,244 192,240 203,236 214,232 226,228 237,224 248,220 259,216 270,212 282,208 293,204 304,200 315,196 326,192 338,188 349,184 360,180 371,176 382,172 394,168 405,164 416,160 427,156 438,152 450,148 461,144 472,140 483,140 494,140 506,140 517,140 528,140 539,140 550,140 562,140 573,140 584,140 595,140 606,140 618,140 629,140 640,140" fill="none" stroke="#6cb2ff" stroke-width="3"/>
<line x1="248" y1="60" x2="248" y2="300" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
<text class="m" x="240.00000000000003" y="318">0.8</text>
<line x1="360" y1="60" x2="360" y2="300" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
<text class="m" x="352.0" y="318">1.0</text>
<line x1="472" y1="60" x2="472" y2="300" stroke="#a8a8a8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
<text class="m" x="464.0" y="318">1.2</text>
<text class="m" x="130" y="110">unclipped: ratio x A</text>
<text class="num" x="130" y="134">clipped: min(ratio x A, 1.2 x A)</text>
<text class="num" x="24" y="362">eps = 0.2: the ratio is trusted in [0.8, 1.2]. Past 1.2 the objective goes flat.</text>
<text class="m" x="24" y="386">One lucky sample cannot move the policy without bound. The clip bounds the step, not the direction.</text>
</svg>
