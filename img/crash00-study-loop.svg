<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="100%" style="max-width:760px" role="img" aria-label="Four step loop: 50 minute blocks, do the lab, re-explain the hardest idea aloud from memory, pass the four done tests">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="236" fill="none"/>
<text class="t" x="24" y="30">The study loop: reading is not learning, explaining is</text>
<rect x="24" y="56" width="152" height="90" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.8"/>
<text class="big" x="40" y="88">50 / 10</text>
<text class="m" x="40" y="110"></text>
<text class="m" x="40" y="110">one volume at a time</text>
<path class="arr" d="M176 101 L206 101"/>
<rect x="206" y="56" width="152" height="90" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.8"/>
<text class="big" x="222" y="88">Do the lab</text>
<text class="m" x="222" y="110"></text>
<text class="m" x="222" y="110">even when the chapter</text>
<text class="m" x="222" y="128">feels easy</text>
<path class="arr" d="M358 101 L388 101"/>
<rect x="388" y="56" width="152" height="90" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.8"/>
<text class="big" x="404" y="88">Re-explain</text>
<text class="m" x="404" y="110"></text>
<text class="m" x="404" y="110">hardest idea, aloud,</text>
<text class="m" x="404" y="128">from memory</text>
<path class="arr" d="M540 101 L570 101"/>
<rect x="570" y="56" width="152" height="90" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.8"/>
<text class="big" x="586" y="88">4 done-tests</text>
<text class="m" x="586" y="110"></text>
<text class="m" x="586" y="110">define / rework</text>
<text class="m" x="586" y="128">numbers / explain</text>
<path class="arr" d="M722 101 L752 101"/>
<text class="num" x="24" y="190">Respect the dependency order: Math (1) -&gt; Deep Learning (3) -&gt; LLM Internals (4) -&gt; Pretraining (5) + Distributed (6) -&gt; Post-training (7) + Inference (8).</text>
<text class="m" x="24" y="214">Skipping ahead borrows understanding you will pay back with interest.</text>
</svg>
