<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="480" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The operator&#x27;s playbook</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">every failure has a signal and a rehearsed response; training at scale is operations</text>
<text x="24" y="84" font-size="12" fill="#8a8a8a" text-anchor="start">failure</text>
<text x="230" y="84" font-size="12" fill="#8a8a8a" text-anchor="start">signal</text>
<text x="470" y="84" font-size="12" fill="#8a8a8a" text-anchor="start">response</text>
<rect x="24" y="100" width="190" height="48" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="129" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">loss spike</text>
<text x="230" y="129" font-size="12" fill="#a8a8a8" text-anchor="start">vertical jump on the curve</text>
<text x="470" y="129" font-size="12" fill="#ececec" text-anchor="start">small: watch. large/repeated: roll back, skip data or lower LR</text>
<rect x="24" y="164" width="190" height="48" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="193" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">divergence</text>
<text x="230" y="193" font-size="12" fill="#a8a8a8" text-anchor="start">loss climbing steadily</text>
<text x="470" y="193" font-size="12" fill="#ececec" text-anchor="start">STOP the run. roll back. fix LR/schedule/data</text>
<rect x="24" y="228" width="190" height="48" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="257" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">hardware failure</text>
<text x="230" y="257" font-size="12" fill="#a8a8a8" text-anchor="start">dead GPU / NCCL timeout</text>
<text x="470" y="257" font-size="12" fill="#ececec" text-anchor="start">resume from checkpoint on spare nodes</text>
<rect x="24" y="292" width="190" height="48" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="321" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">data pipeline stall</text>
<text x="230" y="321" font-size="12" fill="#a8a8a8" text-anchor="start">steps slow, GPUs starve</text>
<text x="470" y="321" font-size="12" fill="#ececec" text-anchor="start">fix the loader: data throughput is a first-class metric</text>
<rect x="24" y="356" width="190" height="48" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="4" opacity="1"/>
<text x="34" y="385" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">grad-norm explosion</text>
<text x="230" y="385" font-size="12" fill="#a8a8a8" text-anchor="start">norm chart spikes before loss</text>
<text x="470" y="385" font-size="12" fill="#ececec" text-anchor="start">tighten clipping, check LR, consider rollback</text>
<text x="24" y="438" font-size="13" fill="#f0b429" text-anchor="start">Decided before launch, not during the 3am spike: checkpoint discipline, rollback criteria, escalation rules.</text>
</svg>