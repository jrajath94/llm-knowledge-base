<svg xmlns="http://www.w3.org/2000/svg" width="720" height="335" viewBox="0 0 720 335" role="img" aria-label="Threat model canvas">
<rect width="720" height="335" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The threat-model canvas: three axes</text>
<rect class="box" x="30" y="60" width="215" height="150" rx="8"/>
<line x1="30" y1="60" x2="30" y2="210" stroke="#f0b429" stroke-width="4"/>
<text x="137" y="92" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">adversary profile</text>
<text x="137" y="120" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">who: skill, motive,</text>
<text x="137" y="140" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">resources, patience</text>
<rect class="box" x="257" y="60" width="215" height="150" rx="8"/>
<line x1="257" y1="60" x2="257" y2="210" stroke="#58a6ff" stroke-width="4"/>
<text x="364" y="92" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">access</text>
<text x="364" y="120" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">what they can touch:</text>
<text x="364" y="140" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">API, tools, documents,</text>
<rect class="box" x="484" y="60" width="215" height="150" rx="8"/>
<line x1="484" y1="60" x2="484" y2="210" stroke="#3fb950" stroke-width="4"/>
<text x="591" y="92" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">goal</text>
<text x="591" y="120" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">what winning means:</text>
<text x="591" y="140" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">for them</text>
<rect class="box" x="130" y="240" width="460" height="70" rx="8"/>
<text x="360" y="268" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">one canvas per risk domain</text>
<text x="360" y="290" text-anchor="middle" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">the same model faces different adversaries for fraud, for weapons, for privacy</text>
</svg>