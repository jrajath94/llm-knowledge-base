<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img"><rect x="8" y="8" width="944" height="384" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="28" y="36" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">PAPER 2 · ROPE</text><text x="28" y="62" font-size="16" font-weight="700" fill="#ececec">Rotary position embedding: position becomes a rotation</text><rect x="60" y="88" width="260" height="280" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="190" y="116" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">position m = 0</text><circle cx="190" cy="235" r="78" fill="none" stroke="#2e2e2e" stroke-width="1.5"/><text x="190" y="327" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">rotate by m·θ = 0°</text><line x1="190" y1="235" x2="253" y2="205" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><line x1="190" y1="235" x2="253" y2="205" stroke="#6cb2ff" stroke-width="3"/><circle cx="253" cy="205" r="6" fill="#6cb2ff"/><circle cx="190" cy="235" r="4" fill="#a8a8a8"/><text x="190" y="147" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">q vector</text><line x1="330" y1="235" x2="340" y2="235" stroke="#a8a8a8" stroke-width="2"/><polygon points="340,235 331,231 331,239" fill="#a8a8a8"/><rect x="350" y="88" width="260" height="280" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="480" y="116" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">position m = 1</text><circle cx="480" cy="235" r="78" fill="none" stroke="#2e2e2e" stroke-width="1.5"/><text x="480" y="327" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">rotate by m·θ = 35°</text><line x1="480" y1="235" x2="543" y2="205" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><line x1="480" y1="235" x2="549" y2="247" stroke="#6cb2ff" stroke-width="3"/><circle cx="549" cy="247" r="6" fill="#6cb2ff"/><circle cx="480" cy="235" r="4" fill="#a8a8a8"/><text x="480" y="147" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">q vector</text><line x1="620" y1="235" x2="630" y2="235" stroke="#a8a8a8" stroke-width="2"/><polygon points="630,235 621,231 621,239" fill="#a8a8a8"/><rect x="640" y="88" width="260" height="280" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><text x="770" y="116" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">position m = 4</text><circle cx="770" cy="235" r="78" fill="none" stroke="#2e2e2e" stroke-width="1.5"/><text x="770" y="327" font-size="12.5" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">rotate by m·θ = 140°</text><line x1="770" y1="235" x2="833" y2="205" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><line x1="770" y1="235" x2="740" y2="298" stroke="#6cb2ff" stroke-width="3"/><circle cx="740" cy="298" r="6" fill="#6cb2ff"/><circle cx="770" cy="235" r="4" fill="#a8a8a8"/><text x="770" y="147" font-size="12" font-weight="400" fill="#a8a8a8" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">q vector</text><text x="480" y="356" font-size="13" font-weight="400" fill="#ececec" text-anchor="middle" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif">relative distance = angle difference: (m−n)·θ</text></svg>