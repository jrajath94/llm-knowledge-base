<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="t09cb-title t09cb-desc">
<title id="t09cb-title">Where the money goes: training is once, inference is forever</title>
<desc id="t09cb-desc">Two stacked bars. Training: one bar of $50,000 for a single training run. Inference: a bar of $12,000 per month, compounding. After 5 months, inference passes training. After 12 months, inference is 3x training. The lesson: optimize inference cost first.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="440" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">COST BREAKDOWN (12 MONTHS)</text>
<text x="30" y="100" class="dl">training (once)</text>
<rect x="220" y="80" width="300" height="34" rx="4" fill="#6ab0ff" stroke="#262626" stroke-width="1.5"/>
<text x="530" y="103" class="dl" fill="#a8a8a8">$50,000 once</text>
<text x="30" y="170" class="dl">inference</text>
<rect x="220" y="150" width="270" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="355.0" y="172" class="tl" fill="#0d0d0d">Q1</text>
<rect x="315" y="150" width="270" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="450.0" y="172" class="tl" fill="#0d0d0d">Q2</text>
<rect x="410" y="150" width="270" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="545.0" y="172" class="tl" fill="#0d0d0d">Q3</text>
<rect x="505" y="150" width="270" height="34" rx="4" fill="#f0b429" stroke="#262626" stroke-width="1.5"/>
<text x="640.0" y="172" class="tl" fill="#0d0d0d">Q4</text>
<text x="620" y="173" class="dl" fill="#a8a8a8">$12,000 / month</text>
<line x1="220" y1="220" x2="600" y2="220" stroke="#ff7a7a" stroke-width="2" stroke-dasharray="6,5"/>
<text x="230" y="245" class="dl" fill="#ff7a7a">month 5: inference passes training</text>
<text x="30" y="300" class="dl">After 12 months: training $50K, inference $144K. Inference wins 3 to 1.</text>
<text x="30" y="322" class="dl" fill="#7fd67f">Lesson: a 10 percent inference saving beats a 50 percent training saving.</text>
<text x="30" y="364" class="capl">How to read: bar length = dollars. Blue is one-time. Gold grows every month.</text>
</g>
<defs><marker id="t09cb-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>