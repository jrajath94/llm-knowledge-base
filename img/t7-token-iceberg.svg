<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 480' width='100%' role='img'>
<title>Token price fallacy iceberg</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The token-price fallacy: the iceberg</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The misunderstanding: Model A is $2 per million tokens and Model B is $10, so A is cheaper.</text>
<polygon points='330,140 630,140 480,440' fill='#1565c0' fill-opacity='0.18' stroke='#1565c0' stroke-width='2'/>
<line x1='280' y1='250' x2='680' y2='250' stroke='#8a8a8a' stroke-width='2' stroke-dasharray='7,5'/>
<text x='480' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='400' fill='#ececec' text-anchor='middle'>visible: token price</text>
<text x='480' y='215' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$2 vs $10 per million</text>
<text x='480' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#ececec' text-anchor='middle'>below the waterline:</text>
<text x='480' y='326' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>success rate, human review, rework,</text>
<text x='480' y='350' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>infra, amortized build</text>
<text x='480' y='236' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#8a8a8a' text-anchor='middle'>the waterline: what the invoice shows</text>
<text x='480' y='452' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: compare cost per successful outcome, never cost per token.</text>
</svg>