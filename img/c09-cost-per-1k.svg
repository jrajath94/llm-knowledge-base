<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 347" role="img" aria-label="Cost per prediction at the required quality: the unit to optimize">
<rect width="900" height="347" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Cost per prediction at the required quality: the unit to optimize</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Servers are not the product. Predictions are. Worked sketch; illustrative prices, not vendor quotes.</text>
<text x="40.0" y="89.0" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">TEACHER</text>
<text x="40.0" y="109.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">GPU box $3/hr, 36,000 preds/hr at the SLO</text>
<rect x="300.0" y="75.0" width="560.0" height="30.0" rx="6" fill="#e5484d" stroke="none" stroke-width="1"/>
<text x="848.0" y="97.0" text-anchor="end" fill="#0d0d0d" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">$0.0833 / 1k preds</text>
<text x="40.0" y="167.0" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">STUDENT</text>
<text x="40.0" y="187.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">CPU box $0.40/hr, 120,000 preds/hr (distilled)</text>
<rect x="300.0" y="153.0" width="22.2" height="30.0" rx="6" fill="#2dd4bf" stroke="none" stroke-width="1"/>
<text x="332.2" y="175.0" text-anchor="start" fill="#2dd4bf" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">$0.0033 / 1k preds</text>
<rect x="40.0" y="233.0" width="820.0" height="76.0" rx="6" fill="#101010" stroke="#f0b429" stroke-width="1"/>
<text x="60.0" y="259.0" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">student is 25x cheaper: at 50M predictions/month the gap is about $4,000/month</text>
<text x="60.0" y="283.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Redo the math before every launch, and redo it when traffic grows 10x: the right answer changes with scale.</text>
</svg>
