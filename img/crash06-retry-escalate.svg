<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.5. Retry vs escalate: the failure classifier</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">not every failure deserves another try</text>
<rect x="280" y="100" width="320" height="80" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="126" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">STEP FAILED</text>
<text x="440.0" y="144" font-size="11" fill="#a8a8a8" text-anchor="middle">classify before acting</text>
<line x1="440" y1="180" x2="240" y2="230" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="240,230 247.0823695595556,224.44661891980388 248.86250541381781,231.56716233685276" fill="#8a8a8a"/>
<line x1="440" y1="180" x2="440" y2="230" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,230 436.33015592246386,221.78219953718923 443.66984407753614,221.78219953718923" fill="#8a8a8a"/>
<line x1="440" y1="180" x2="640" y2="230" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="640,230 631.1374945861821,231.56716233685276 632.9176304404444,224.44661891980388" fill="#8a8a8a"/>
<rect x="60" y="230" width="320" height="110" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="220.0" y="256" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">TRANSIENT</text>
<text x="220.0" y="274" font-size="11" fill="#a8a8a8" text-anchor="middle">timeout, 429, blip; retry with backoff,</text>
<text x="220.0" y="289" font-size="11" fill="#a8a8a8" text-anchor="middle">then escalate after 2 failures</text>
<rect x="400" y="230" width="200" height="110" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="500.0" y="256" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">AGENT ERROR</text>
<text x="500.0" y="274" font-size="11" fill="#a8a8a8" text-anchor="middle">wrong args, bad plan; one</text>
<text x="500.0" y="289" font-size="11" fill="#a8a8a8" text-anchor="middle">self-correction, then</text>
<text x="500.0" y="304" font-size="11" fill="#a8a8a8" text-anchor="middle">escalate</text>
<rect x="640" y="230" width="180" height="110" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="730.0" y="256" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">STUCK</text>
<text x="730.0" y="274" font-size="11" fill="#a8a8a8" text-anchor="middle">3+ repeats of the same</text>
<text x="730.0" y="289" font-size="11" fill="#a8a8a8" text-anchor="middle">action; break the loop,</text>
<text x="730.0" y="304" font-size="11" fill="#a8a8a8" text-anchor="middle">never retry</text>
<rect x="240" y="400" width="400" height="90" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="426" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">ESCALATE</text>
<text x="440.0" y="444" font-size="11" fill="#a8a8a8" text-anchor="middle">to the next model tier or to a human; the loop does</text>
<text x="440.0" y="459" font-size="11" fill="#a8a8a8" text-anchor="middle">not grade its own homework</text>
<line x1="220" y1="340" x2="320" y2="400" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="320,400 311.0651750372493,398.9188418778888 314.84141343919566,392.6251112079782" fill="#8a8a8a"/>
<line x1="500" y1="340" x2="480" y2="400" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="480,400 479.11717689911865,391.0434033599503 486.0802164647349,393.36441654848903" fill="#8a8a8a"/>
<line x1="730" y1="340" x2="600" y2="400" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="600,400 605.9235508794601,393.2241941454579 608.9993072208623,399.8883328851625" fill="#8a8a8a"/>
<text x="24" y="530" font-size="12" fill="#a8a8a8" text-anchor="start">The stuck detector is the highest-value three lines in the harness: 3+ repeats means stop, not try harder.</text>
</svg>