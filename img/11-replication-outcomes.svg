<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Replication outcomes: what earns full marks">
<rect x="14" y="12" width="932" height="336" rx="10" fill="#141414" stroke="#2e2e2e"/>
<text x="32" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">CAPSTONE OUTCOMES</text>
<text x="32" y="72" font-size="16" font-weight="700" fill="#ececec">What earns full marks</text>
<text x="330" y="108" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Claim survives</text>
<text x="660" y="108" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Claim fails</text>
<text x="60" y="200" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Honest</text>
<text x="60" y="222" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">writeup</text>
<text x="60" y="300" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">Hidden</text>
<text x="60" y="322" font-size="13" font-weight="700" fill="#ececec" text-anchor="middle">problems</text>
<rect x="165" y="130" width="300" height="86" rx="8" fill="#1c1c1c" stroke="#3fae5a" stroke-width="1.6"/>
<text x="315" y="164" font-size="13.5" fill="#ececec" text-anchor="middle">Clean replication.</text>
<text x="315" y="190" font-size="13.5" font-weight="700" fill="#3fae5a" text-anchor="middle">Full marks.</text>
<rect x="495" y="130" width="300" height="86" rx="8" fill="#1c1c1c" stroke="#3fae5a" stroke-width="1.6"/>
<text x="645" y="164" font-size="13.5" fill="#ececec" text-anchor="middle">Clean refutation.</text>
<text x="645" y="190" font-size="13.5" font-weight="700" fill="#3fae5a" text-anchor="middle">Full marks. Bigger win.</text>
<rect x="165" y="250" width="300" height="86" rx="8" fill="#1c1c1c" stroke="#c05555" stroke-width="1.6"/>
<text x="315" y="284" font-size="13.5" fill="#ececec" text-anchor="middle">Confirmed, but the</text>
<text x="315" y="310" font-size="13.5" font-weight="700" fill="#c05555" text-anchor="middle">writeup hides gaps. Fail.</text>
<rect x="495" y="250" width="300" height="86" rx="8" fill="#1c1c1c" stroke="#c05555" stroke-width="1.6"/>
<text x="645" y="284" font-size="13.5" fill="#ececec" text-anchor="middle">Refuted, but the</text>
<text x="645" y="310" font-size="13.5" font-weight="700" fill="#c05555" text-anchor="middle">writeup hides it. Fail.</text>
<text x="32" y="378" font-size="12" fill="#a8a8a8">No expected outcome. The only failure is a writeup that hides what happened.</text>
</svg>
