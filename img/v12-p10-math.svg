<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="DPO: the derivation in three steps"><rect x="22" y="14" width="916" height="332" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The KL-constrained RL objective has a closed form. Use it.</text><rect x="38" y="96" width="235.890325" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Closed form</text><text x="54" y="144" font-size="12" fill="#a8a8a8">max E[r] - beta*KL has</text><text x="54" y="160" font-size="12" fill="#a8a8a8">optimal policy pi* = pi_ref *</text><text x="54" y="176" font-size="12" fill="#a8a8a8">exp(r/beta) / Z(x)</text><line x1="283.89032499999996" y1="152.0" x2="297.89032499999996" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="297.89032499999996,147.0 305.89032499999996,152.0 297.89032499999996,157.0" fill="#a8a8a8"/><rect x="313.89032499999996" y="96" width="237.42801249999997" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="333.89032499999996" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="333.89032499999996" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="353.89032499999996" y="123" font-size="13.5" font-weight="700" fill="#ececec">Invert it</text><text x="329.89032499999996" y="144" font-size="12" fill="#a8a8a8">solve for the reward: r =</text><text x="329.89032499999996" y="160" font-size="12" fill="#a8a8a8">beta * log(pi*/pi_ref) + beta</text><text x="329.89032499999996" y="176" font-size="12" fill="#a8a8a8">* log Z(x)</text><line x1="561.3183374999999" y1="152.0" x2="575.3183374999999" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="575.3183374999999,147.0 583.3183374999999,152.0 575.3183374999999,157.0" fill="#a8a8a8"/><rect x="591.3183374999999" y="96" width="245.05145781250002" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="611.3183374999999" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="611.3183374999999" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="631.3183374999999" y="123" font-size="13.5" font-weight="700" fill="#ececec">Plug into Bradley-Terry</text><text x="607.3183374999999" y="144" font-size="12" fill="#a8a8a8">P(yw &gt; yl) = sigma(r(yw) -</text><text x="607.3183374999999" y="160" font-size="12" fill="#a8a8a8">r(yl)): the Z(x) terms</text><text x="607.3183374999999" y="176" font-size="12" fill="#a8a8a8">cancel, same x for both</text><rect x="38" y="232" width="222.56664999999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="254" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="259" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="259" font-size="13.5" font-weight="700" fill="#ececec">Worked</text><text x="54" y="280" font-size="12" fill="#a8a8a8">beta=0.1, ratios 1.5 and</text><text x="54" y="296" font-size="12" fill="#a8a8a8">0.7: margin 0.076, loss</text><text x="54" y="312" font-size="12" fill="#a8a8a8">0.656; gradient pushes</text><text x="54" y="328" font-size="12" fill="#a8a8a8">chosen up, rejected down</text></svg>