<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="640" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The standard playbook, in order</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Each step earns the next; the eval loop governs all of them</text>
<rect x="60" y="94" width="780" height="76" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="122" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="middle">1. Start with SFT</text>
<text x="450" y="144" font-size="11" fill="#a8a8a8" text-anchor="middle">teaches the format; gives the</text>
<text x="450" y="160" font-size="11" fill="#a8a8a8" text-anchor="middle">reference policy for every later stage</text>
<rect x="60" y="180" width="780" height="76" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="208" font-size="14" font-weight="bold" fill="#6cb2ff" text-anchor="middle">2. Preference training</text>
<text x="450" y="230" font-size="11" fill="#a8a8a8" text-anchor="middle">when SFT plateaus on quality ranking;</text>
<text x="450" y="246" font-size="11" fill="#a8a8a8" text-anchor="middle">try DPO first: the cheapest experiment</text>
<rect x="60" y="266" width="780" height="76" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="294" font-size="14" font-weight="bold" fill="#b388ff" text-anchor="middle">3. PPO</text>
<text x="450" y="316" font-size="11" fill="#a8a8a8" text-anchor="middle">when DPO is not enough: online</text>
<text x="450" y="332" font-size="11" fill="#a8a8a8" text-anchor="middle">exploration, complex multi-turn</text>
<rect x="60" y="352" width="780" height="76" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="380" font-size="14" font-weight="bold" fill="#7dd87d" text-anchor="middle">4. Verifiable rewards</text>
<text x="450" y="402" font-size="11" fill="#a8a8a8" text-anchor="middle">math, code, checkable reasoning;</text>
<text x="450" y="418" font-size="11" fill="#a8a8a8" text-anchor="middle">highest signal per dollar</text>
<rect x="60" y="438" width="780" height="76" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="466" font-size="14" font-weight="bold" fill="#f0b429" text-anchor="middle">5. CAI / RLAIF</text>
<text x="450" y="488" font-size="11" fill="#a8a8a8" text-anchor="middle">when human labels are the bottleneck</text>
<text x="450" y="504" font-size="11" fill="#a8a8a8" text-anchor="middle">but the principles are writable</text>
<rect x="60" y="530" width="780" height="56" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6"/>
<text x="450.0" y="550.0" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">6. Never skip the eval loop</text>
<text x="450.0" y="572.0" font-size="11" fill="#a8a8a8" text-anchor="middle">Chapter 9&#x27;s loop: train one change, eval on a fixed suite, analyze failures, fix, repeat</text>
</svg>