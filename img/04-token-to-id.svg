<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Text becomes numbers in two hops</text><rect x='40' y='110' width='200' height='110' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2.5'/><text x='140' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>"Hello"</text><text x='140' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the text</text><line x1='240' y1='165' x2='278' y2='165' stroke='#8a8a8a' stroke-width='3'/><polygon points='278.0,165.0 270.3,169.6 270.3,160.4' fill='#8a8a8a'/><rect x='278' y='110' width='200' height='110' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2.5'/><text x='378' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>H  e  l  l  o</text><text x='378' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>character tokens</text><line x1='478' y1='165' x2='516' y2='165' stroke='#8a8a8a' stroke-width='3'/><polygon points='516.0,165.0 508.3,169.6 508.3,160.4' fill='#8a8a8a'/><rect x='516' y='110' width='200' height='110' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2.5'/><text x='616' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>72 101 108 108 111</text><text x='616' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>integer IDs (UTF-8)</text><line x1='716' y1='165' x2='754' y2='165' stroke='#8a8a8a' stroke-width='3'/><polygon points='754.0,165.0 746.3,169.6 746.3,160.4' fill='#8a8a8a'/><rect x='754' y='110' width='200' height='110' rx='10' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2.5'/><text x='854' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>[..] [..] [..] [..] [..]</text><text x='854' y='190' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>vectors from a table</text><text x='480' y='290' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The table is learned, not fixed: training moves each vector where it needs to be.</text><text x='480' y='320' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>BPE generalizes this: the tokens are learned pairs, not single characters.</text></svg>