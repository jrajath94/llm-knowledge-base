<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px" role="img" aria-label="Three question boxes in a column with two stop exits on the left: no claim means stop, nothing changes means stop.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">The 90-minute first pass: three questions, two stop rules</text>
<rect x="240" y="60" width="280" height="60" rx="8" class="pick"/>
<text x="380" y="85" text-anchor="middle" class="big">Q1: what is the claim?</text>
<text x="380" y="105" text-anchor="middle" class="m">a falsifiable sentence</text>
<path class="arr" d="M380 120 L380 138"/>
<rect x="240" y="138" width="280" height="60" rx="8" class="box"/>
<text x="380" y="163" text-anchor="middle" class="big">Q2: what is the evidence?</text>
<text x="380" y="183" text-anchor="middle" class="m">compute, ablations, seeds</text>
<path class="arr" d="M380 198 L380 216"/>
<rect x="240" y="216" width="280" height="60" rx="8" class="box"/>
<text x="380" y="241" text-anchor="middle" class="big">Q3: what changes for me?</text>
<text x="380" y="261" text-anchor="middle" class="m">if nothing, stop reading</text>
<path class="arr" d="M240 105 L120 105"/>
<text x="170" y="90" text-anchor="middle" class="s">no claim: stop</text>
<path class="arr" d="M240 261 L120 261"/>
<text x="170" y="246" text-anchor="middle" class="s">nothing changes: stop</text>
<text x="24" y="385" text-anchor="start" class="s">Answer Q1 before page 4. If Q1 has no answer, the paper has no claim to evaluate.</text>
</svg>