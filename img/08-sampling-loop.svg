<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="640" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The sampling loop</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">What the server does for every generated token</text>
<rect x="24" y="94" width="268" height="150" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="158" y="134" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="middle">1. Forward pass</text>
<text x="158" y="164" font-size="11" fill="#a8a8a8" text-anchor="middle">logits out</text>
<rect x="316" y="94" width="268" height="150" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="134" font-size="13" font-weight="bold" fill="#f0b429" text-anchor="middle">2. Divide by T</text>
<text x="450" y="164" font-size="11" fill="#a8a8a8" text-anchor="middle">rescale</text>
<rect x="608" y="94" width="268" height="150" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="742" y="134" font-size="13" font-weight="bold" fill="#b388ff" text-anchor="middle">3. Top-k / top-p</text>
<text x="742" y="164" font-size="11" fill="#a8a8a8" text-anchor="middle">cut the tail</text>
<rect x="24" y="284" width="268" height="150" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="158" y="324" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="middle">6. Append, repeat</text>
<text x="158" y="354" font-size="11" fill="#a8a8a8" text-anchor="middle">until stop token</text>
<rect x="316" y="284" width="268" height="150" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="324" font-size="13" font-weight="bold" fill="#7dd87d" text-anchor="middle">5. Draw one token</text>
<text x="450" y="354" font-size="11" fill="#a8a8a8" text-anchor="middle">random number generator</text>
<rect x="608" y="284" width="268" height="150" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="742" y="324" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="middle">4. Renormalize</text>
<text x="742" y="354" font-size="11" fill="#a8a8a8" text-anchor="middle">sum to 1</text>
<line x1="292" y1="169" x2="316" y2="169" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="316,169 307.78219953718923,172.66984407753614 307.78219953718923,165.33015592246386" fill="#8a8a8a"/>
<line x1="584" y1="169" x2="608" y2="169" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="608,169 599.7821995371892,172.66984407753614 599.7821995371892,165.33015592246386" fill="#8a8a8a"/>
<line x1="742" y1="244" x2="742" y2="284" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="742,284 738.3301559224639,275.78219953718923 745.6698440775361,275.78219953718923" fill="#8a8a8a"/>
<line x1="608" y1="359" x2="584" y2="359" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="584,359 592.2178004628108,355.33015592246386 592.2178004628108,362.66984407753614" fill="#8a8a8a"/>
<line x1="316" y1="359" x2="292" y2="359" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="292,359 300.21780046281077,355.33015592246386 300.21780046281077,362.66984407753614" fill="#8a8a8a"/>
<line x1="158" y1="284" x2="158" y2="244" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="158,244 161.66984407753614,252.21780046281077 154.33015592246386,252.21780046281077" fill="#8a8a8a"/>
<rect x="24" y="504" width="852" height="130" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="536" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Two details that matter</text>
<text x="48" y="566" font-size="11" fill="#a8a8a8" text-anchor="start">The RNG seed: fixed seed plus greedy decoding is how you make evals reproducible. And sampling never</text>
<text x="48" y="583" font-size="11" fill="#a8a8a8" text-anchor="start">touches the model weights: it only changes which path you walk through the probability tree.</text>
</svg>