<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A prompt is code, so it gets the code treatment"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">TESTING MODELS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Prompt and config changes pass the same gate as model changes:</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Versioned:</text><text x="165.98867187500002" y="94" font-size="13.5" fill="#a8a8a8">every prompt change is a diff you can roll back</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Reviewed:</text><text x="163.52703125" y="125" font-size="13.5" fill="#a8a8a8">a second pair of eyes before it ships</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Tested:</text><text x="139.97796875" y="156" font-size="13.5" fill="#a8a8a8">the golden set runs; regressions block the deploy</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">Why it matters:</text><text x="203.809765625" y="187" font-size="13.5" fill="#a8a8a8">an unversioned prompt change is as dangerous as an unversioned model change</text></svg>