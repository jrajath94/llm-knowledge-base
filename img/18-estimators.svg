<svg xmlns='http://www.w3.org/2000/svg' width='700' height='420' viewBox='0 0 700 420' font-family='DejaVu Sans'>
<rect width='700' height='420' fill='#0a0a0a'/>
<text x='350' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Why n-1: the mean you estimate costs one degree of freedom</text>
<rect x='60' y='80' width='280' height='240' rx='8' fill='none' stroke='#ff7b8a' stroke-width='1.5'/>
<text x='200' y='110' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>DIVIDE BY n</text>
<text x='200' y='150' font-size='12' fill='#9a9a9a' text-anchor='middle'>uses the true mean mu</text>
<text x='200' y='180' font-size='12' fill='#9a9a9a' text-anchor='middle'>but you only have</text>
<text x='200' y='205' font-size='12' fill='#9a9a9a' text-anchor='middle'>the sample mean xbar</text>
<text x='200' y='245' font-size='12' fill='#e8e8e8' text-anchor='middle'>xbar hugs the data:</text>
<text x='200' y='270' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>variance biased DOWN</text>
<rect x='360' y='80' width='280' height='240' rx='8' fill='none' stroke='#7fd08a' stroke-width='1.5'/>
<text x='500' y='110' font-size='13' fill='#7fd08a' text-anchor='middle' font-weight='bold'>DIVIDE BY n-1</text>
<text x='500' y='150' font-size='12' fill='#9a9a9a' text-anchor='middle'>corrects the bias</text>
<text x='500' y='180' font-size='12' fill='#9a9a9a' text-anchor='middle'>one degree of freedom</text>
<text x='500' y='205' font-size='12' fill='#9a9a9a' text-anchor='middle'>spent on xbar</text>
<text x='500' y='245' font-size='13' fill='#7fd08a' text-anchor='middle' font-weight='bold'>unbiased estimator</text>
<text x='500' y='270' font-size='12' fill='#9a9a9a' text-anchor='middle'>the lab default (ddof=1)</text>
<text x='350' y='360' font-size='12' fill='#9a9a9a' text-anchor='middle'>Then the 95% CI: xbar +/- 1.96 * s/sqrt(n). Coverage is a long-run property.</text>
</svg>