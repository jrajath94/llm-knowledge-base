<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 380' width='100%' role='img'><title>Hybrid retrieval pipeline</title><rect x='20' y='120' width='180' height='90' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/><text x='110.0' y='169.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>User query</text><line x1='200' y1='165' x2='240' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='233,161 240,165 233,169' fill='#8a8a8a'/><rect x='245' y='60' width='200' height='80' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/><text x='345.0' y='98.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Dense top-50</text><text x='345.0' y='122.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>meaning</text><rect x='245' y='200' width='200' height='80' rx='10' fill='#7b61b8' fill-opacity='0.22' stroke='#7b61b8' stroke-width='2'/><text x='345.0' y='238.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>BM25 top-50</text><text x='345.0' y='262.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>exact terms</text><line x1='445' y1='100' x2='485' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='478,161 485,165 478,169' fill='#8a8a8a'/><line x1='445' y1='240' x2='485' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='478,161 485,165 478,169' fill='#8a8a8a'/><rect x='490' y='120' width='170' height='90' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/><text x='575.0' y='163.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>RRF fuse</text><text x='575.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>k = 60, ranks only</text><line x1='660' y1='165' x2='700' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='693,161 700,165 693,169' fill='#8a8a8a'/><rect x='705' y='120' width='110' height='90' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/><text x='760.0' y='163.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Rerank 20</text><text x='760.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>300 ms</text><line x1='815' y1='165' x2='855' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='848,161 855,165 848,169' fill='#8a8a8a'/><rect x='860' y='120' width='80' height='90' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/><text x='900.0' y='163.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Keep 5</text><text x='900.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>~2K tok</text><text x='480' y='48' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>Each stage trades recall for precision; the reranker earns its 300 ms by being picky</text><text x='480' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>5 chunks at ~400 tokens each is ~2,000 tokens of context: a sane budget</text><text x='480' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Dense finds meaning; BM25 finds exact terms; RRF fuses by rank so the mixed scales do not matter</text></svg>