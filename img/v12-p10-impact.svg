<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 215" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why DPO mattered"><rect x="22" y="14" width="916" height="187" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Simpler won: the stack collapsed and the theory got cleaner</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Three stages to two:</text><text x="242.36703125" y="94" font-size="13.5" fill="#a8a8a8">SFT, then DPO: the reward model and PPO are gone.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">One loss function:</text><text x="222.77515625" y="125" font-size="13.5" fill="#a8a8a8">fine-tuning libraries added it and suddenly everyone could do preference</text><text x="80" y="144" font-size="13.5" fill="#a8a8a8">optimization on a single GPU.</text><path d="M 53.7 170.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="175" font-size="13.5" font-weight="700" fill="#ececec">Theory reframed:</text><text x="217.84765625" y="175" font-size="13.5" fill="#a8a8a8">the &quot;reward model&quot; was never a separate object, just a reparameterization of the</text><text x="80" y="194" font-size="13.5" fill="#a8a8a8">policy.</text></svg>