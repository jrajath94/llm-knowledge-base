<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628" width="100%" style="max-width:760px" role="img" aria-label="Thirteen memorized defaults: test cases, repeats, calibration, raters, kappa, bootstraps, eps, beta, sampling, safety">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="628" fill="none"/>
<text class="t" x="24" y="30">The small-number rules: working constants</text>
<text class="big" x="24" y="56">30</text>
<text class="num" x="110" y="56">minimum test cases per variant</text>
<text class="m" x="110" y="74">Central Limit Theorem kicking in</text>
<text class="big" x="24" y="100">3-5</text>
<text class="num" x="110" y="100">repeats per case</text>
<text class="m" x="110" y="118">average decoding noise</text>
<text class="big" x="24" y="144">20-50</text>
<text class="num" x="110" y="144">calibration-set size to license a judge</text>
<text class="m" x="110" y="162">rule of thumb</text>
<text class="big" x="24" y="188">2-3</text>
<text class="num" x="110" y="188">human raters per calibration item</text>
<text class="m" x="110" y="206">before kappa means anything</text>
<text class="big" x="24" y="232">0.8</text>
<text class="num" x="110" y="232">typical human-vs-human kappa ceiling</text>
<text class="m" x="110" y="250">practitioner writeups</text>
<text class="big" x="24" y="276">10,000</text>
<text class="num" x="110" y="276">bootstrap resamples</text>
<text class="m" x="110" y="294">Monte Carlo noise negligible</text>
<text class="big" x="24" y="320">1.96</text>
<text class="num" x="110" y="320">z for 95% normal approximation</text>
<text class="big" x="24" y="348">0.2</text>
<text class="num" x="110" y="348">PPO clip eps; ratio trusted in [0.8, 1.2]</text>
<text class="m" x="110" y="366">standard value</text>
<text class="big" x="24" y="392">0.1</text>
<text class="num" x="110" y="392">DPO beta starting point</text>
<text class="m" x="110" y="410">standard value</text>
<text class="big" x="24" y="436">8-64</text>
<text class="num" x="110" y="436">completions per prompt, rejection sampling</text>
<text class="m" x="110" y="454">practitioner range</text>
<text class="big" x="24" y="480">5-15%</text>
<text class="num" x="110" y="480">safety fraction of the SFT mix</text>
<text class="m" x="110" y="498">working range</text>
<text class="big" x="24" y="524">60%</text>
<text class="num" x="110" y="524">three-way agreement quarantine bar</text>
<text class="m" x="110" y="542">below this, quarantine</text>
<text class="big" x="24" y="568">0.75</text>
<text class="num" x="110" y="568">per-labeler agreement review bar</text>
<text class="m" x="110" y="586">starting point</text>
</svg>
