<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 316" role="img" aria-label="Retraining triggers: a fire alarm, not a calendar habit">
<rect width="900" height="316" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Retraining triggers: a fire alarm, not a calendar habit</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Retrain when the world has moved enough that the current artifact is the wrong model for the current data.</text>
<rect x="30.0" y="69.0" width="272.0" height="150.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="46.0" y="95.0" text-anchor="start" fill="#2dd4bf" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">THRESHOLD</text>
<text x="46.0" y="117.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">PSI above the per-feature line</text>
<text x="46.0" y="132.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">for K consecutive windows.</text>
<text x="46.0" y="150.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Or the business metric down by</text>
<text x="46.0" y="165.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">the agreed amount.</text>
<text x="46.0" y="183.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Thresholds come from history,</text>
<text x="46.0" y="198.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">not gut feel.</text>
<rect x="318.0" y="69.0" width="272.0" height="150.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="334.0" y="95.0" text-anchor="start" fill="#4aa8ff" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">SCHEDULED</text>
<text x="334.0" y="117.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Retrain every N days regardless.</text>
<text x="334.0" y="134.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Set N from measured decay: if</text>
<text x="334.0" y="149.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">AUC drops 1 point</text>
<text x="334.0" y="167.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">per month, monthly retraining</text>
<text x="334.0" y="182.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">holds the line.</text>
<rect x="606.0" y="69.0" width="272.0" height="150.0" rx="6" fill="#111111" stroke="#ff9f43" stroke-width="1.5"/>
<text x="622.0" y="95.0" text-anchor="start" fill="#ff9f43" font-size="14" font-family="Charis SIL, Georgia, serif" font-weight="bold">EVENT-DRIVEN</text>
<text x="622.0" y="117.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">Product launch, new market,</text>
<text x="622.0" y="132.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">pricing change,</text>
<text x="622.0" y="150.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">schema migration. These are</text>
<text x="622.0" y="165.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">calendar events,</text>
<text x="622.0" y="183.0" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">not statistical ones. Ask at</text>
<text x="622.0" y="198.5" text-anchor="start" fill="#ececec" font-size="11.5" font-family="Charis SIL, Georgia, serif">every launch.</text>
<text x="40.0" y="250.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Usually combined: scheduled as the floor, threshold as the alarm, event-driven at launches. And</text>
<text x="40.0" y="266.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">price the schedule: retraining costs compute and review time; staleness costs wrong predictions,</text>
<text x="40.0" y="282.4" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">priced by the error-cost math.</text>
</svg>
