<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="100%" style="max-width:760px" role="img" aria-label="From FP8 near-zero loss to the 4-bit perplexity trap; FP8 format choice; block-128 microscaling">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="548" fill="none"/>
<text class="t" x="24" y="30">Quantization accuracy deltas: what each method costs</text>
<rect x="24" y="56" width="712" height="76" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.5"/>
<text class="big" x="44" y="86">FP8 W8A8 on Hopper</text>
<text class="num" x="300" y="86">near-zero accuracy loss on most models</text>
<text class="m" x="44" y="110">the default serious quantization; vLLM reports up to 1.6x throughput</text>
<rect x="24" y="144" width="712" height="56" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.5"/>
<text class="big" x="44" y="174">int8 KV cache</text>
<text class="num" x="300" y="174">nearly lossless in production engines</text>
<rect x="24" y="212" width="712" height="56" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.5"/>
<text class="big" x="44" y="242">int4 KV</text>
<text class="num" x="300" y="242">increasingly available, minor trade-offs</text>
<rect x="24" y="280" width="712" height="76" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
<text class="big" x="44" y="310">4-bit weights</text>
<text class="num" x="300" y="310">flat perplexity, 6-point drop on math tasks</text>
<text class="m" x="44" y="334">the perplexity trap: cause is almost always calibration, not bit-width</text>
<rect x="24" y="368" width="712" height="56" rx="8" fill="#141414" stroke="#8a8a8a" stroke-width="1.5"/>
<text class="big" x="44" y="398">2-bit (KIVI-style)</text>
<text class="num" x="300" y="398">the research frontier</text>
<text class="num" x="24" y="450">FP8 formats: E4M3 (weights and activations, precision; overflow saturates)</text>
<text class="num" x="24" y="474">vs E5M2 (range; overflow becomes inf and poisons everything downstream).</text>
<text class="m" x="24" y="502">Block-128 microscaling quarantines outliers: per-tensor scaling erases ~100% of normal</text>
<text class="m" x="24" y="524">values to zero with one loud outlier; block-128 erases ~3%.</text>
</svg>
