<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 360' width='100%' role='img'><title>The agent loop</title><rect x='90' y='120' width='200' height='110' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/><text x='190.0' y='173.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Think</text><text x='190.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>one model call</text><rect x='380' y='120' width='200' height='110' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/><text x='480.0' y='173.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Act</text><text x='480.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>one tool call</text><rect x='670' y='120' width='200' height='110' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/><text x='770.0' y='173.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Observe</text><text x='770.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>read tool output</text><line x1='290' y1='175' x2='375' y2='175' stroke='#8a8a8a' stroke-width='2'/><polygon points='368,171 375,175 368,179' fill='#8a8a8a'/><line x1='580' y1='175' x2='665' y2='175' stroke='#8a8a8a' stroke-width='2'/><polygon points='658,171 665,175 658,179' fill='#8a8a8a'/><path d='M770,230 L770,290 L190,290 L190,235' fill='none' stroke='#8a8a8a' stroke-width='2'/><polygon points='183,242 190,230 197,242' fill='#8a8a8a'/><text x='480' y='310' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>loop repeats until the task is done or a stop rule fires</text><text x='480' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>One agent step = one model call + one tool call + one observation</text><text x='480' y='86' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The loop is the unit everything in this pack multiplies.</text></svg>