<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="440" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Eager vs XLA: why fusion matters on a TPU</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Same math, two executions. Gaps are launch overhead and memory round-trips.</text>
<text x="60" y="105" font-size="14" font-weight="bold" fill="#e06c75">Eager: one kernel launch per op</text>
<rect x="60" y="120" width="46" height="34" fill="#e06c75" rx="3"/><rect x="106" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="140" y="120" width="60" height="34" fill="#e06c75" rx="3"/><rect x="200" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="234" y="120" width="38" height="34" fill="#e06c75" rx="3"/><rect x="272" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="306" y="120" width="70" height="34" fill="#e06c75" rx="3"/><rect x="376" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="410" y="120" width="52" height="34" fill="#e06c75" rx="3"/><rect x="462" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="496" y="120" width="44" height="34" fill="#e06c75" rx="3"/><rect x="540" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="574" y="120" width="66" height="34" fill="#e06c75" rx="3"/><rect x="640" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="674" y="120" width="40" height="34" fill="#e06c75" rx="3"/><rect x="714" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="748" y="120" width="58" height="34" fill="#e06c75" rx="3"/><rect x="806" y="120" width="14" height="34" fill="#0d0d0d"/><rect x="840" y="120" width="48" height="34" fill="#e06c75" rx="3"/><rect x="888" y="120" width="14" height="34" fill="#0d0d0d"/><text x="106" y="172" font-size="11" fill="#8a8a8a" text-anchor="middle">gap: launch overhead</text>
<line x1="106" y1="158" x2="113" y2="158" stroke="#8a8a8a" stroke-width="1"/>
<text x="60" y="200" font-size="14" font-weight="bold" fill="#7dd87d">XLA: the whole graph fused into one binary</text>
<rect x="60" y="215" width="560" height="34" fill="#7dd87d" rx="3"/>
<text x="340" y="238" font-size="13" fill="#0d0d0d" text-anchor="middle" font-weight="bold">fused: matmul + bias + GeLU in one launch</text>
<text x="60" y="300" font-size="13" fill="#ececec">On a systolic array, launch overhead and memory round-trips dominate unless fusion removes them.</text>
<text x="60" y="326" font-size="13" fill="#ececec">XLA also shards the graph across the mesh for you (gSPMD) from your sharding annotations.</text>
<text x="24" y="390" font-size="13" fill="#f0b429">Rule of thumb: write TPU code for the compiler. Static shapes, no Python if on traced values.</text>
</svg>