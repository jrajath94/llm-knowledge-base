<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px" role="img" aria-label="Kernel A vector add far left of the ridge, memory bound at 8 percent of the roof; kernel B FP8 GEMM right of the ridge, compute bound at 60 percent">
<style>
