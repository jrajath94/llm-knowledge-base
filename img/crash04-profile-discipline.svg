<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Profiling the wrong thing: three misreads and the one tuning discipline</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">change one variable at a time; do not ship a win that sits inside the noise band</text>
<text x="24" y="110" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">Three misreads that waste weeks:</text>
<rect x="24" y="130" width="10" height="34" fill="#e57ea6" rx="2" opacity="1"/>
<text x="44" y="145" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">first-step noise</text>
<text x="44" y="161" font-size="11" fill="#a8a8a8" text-anchor="start">steps 1-N include compilation, autotuning, allocator warm-up; never profile step 1</text>
<rect x="24" y="182" width="10" height="34" fill="#f0b429" rx="2" opacity="1"/>
<text x="44" y="197" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">the average lie</text>
<text x="44" y="213" font-size="11" fill="#a8a8a8" text-anchor="start">50% MFU average can hide 90% on half the ranks and 10% on the rest; look at the</text>
<text x="44" y="230" font-size="11" fill="#a8a8a8" text-anchor="start">distribution</text>
<rect x="24" y="234" width="10" height="34" fill="#b388ff" rx="2" opacity="1"/>
<text x="44" y="249" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">profiler overhead</text>
<text x="44" y="265" font-size="11" fill="#a8a8a8" text-anchor="start">nsys itself slows the run; compare profiles to profiles, measure absolute step time</text>
<text x="44" y="282" font-size="11" fill="#a8a8a8" text-anchor="start">unprofiled</text>
<text x="24" y="302" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">The tuning order that usually pays:</text>
<rect x="24" y="320" width="158" height="72" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="103.0" y="346" font-size="11.5" font-weight="bold" fill="#ececec" text-anchor="middle">1. microbatch size</text>
<line x1="182" y1="356" x2="196" y2="356" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="196,356 187.78219953718923,359.66984407753614 187.78219953718923,352.33015592246386" fill="#8a8a8a"/>
<rect x="196" y="320" width="158" height="72" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="275.0" y="346" font-size="11.5" font-weight="bold" fill="#ececec" text-anchor="middle">2. gradient bucket size</text>
<line x1="354" y1="356" x2="368" y2="356" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="368,356 359.78219953718923,359.66984407753614 359.78219953718923,352.33015592246386" fill="#8a8a8a"/>
<rect x="368" y="320" width="158" height="72" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="447.0" y="346" font-size="11.5" font-weight="bold" fill="#ececec" text-anchor="middle">3. TP degree</text>
<text x="447.0" y="364" font-size="11" fill="#a8a8a8" text-anchor="middle">within the node</text>
<line x1="526" y1="356" x2="540" y2="356" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="540,356 531.7821995371892,359.66984407753614 531.7821995371892,352.33015592246386" fill="#8a8a8a"/>
<rect x="540" y="320" width="158" height="72" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="619.0" y="346" font-size="11.5" font-weight="bold" fill="#ececec" text-anchor="middle">4. NCCL knobs</text>
<text x="619.0" y="364" font-size="11" fill="#a8a8a8" text-anchor="middle">layout right first</text>
<line x1="698" y1="356" x2="712" y2="356" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="712,356 703.7821995371892,359.66984407753614 703.7821995371892,352.33015592246386" fill="#8a8a8a"/>
<rect x="712" y="320" width="158" height="72" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="791.0" y="346" font-size="11.5" font-weight="bold" fill="#ececec" text-anchor="middle">5. dataloader workers</text>
<text x="791.0" y="364" font-size="11" fill="#a8a8a8" text-anchor="middle">only if host starved</text>
<text x="24" y="428" font-size="12" fill="#a8a8a8" text-anchor="start">Each change gets a before/after measurement of step time and MFU, medians over enough steps, recorded</text>
<text x="24" y="445" font-size="12" fill="#a8a8a8" text-anchor="start">with the config.</text>
</svg>