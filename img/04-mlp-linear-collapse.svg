<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Without the kink, the MLP is one matrix</text><text x='240' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>No activation:</text><rect x='60' y='110' width='110' height='70' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='115.0' y='137.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>W1</text><text x='115.0' y='167.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>512 -&gt; 2048</text><rect x='220' y='110' width='110' height='70' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='275.0' y='137.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>W2</text><text x='275.0' y='167.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>2048 -&gt; 512</text><line x1='170' y1='145' x2='220' y2='145' stroke='#1565c0' stroke-width='3'/><polygon points='220.0,145.0 212.3,149.6 212.3,140.4' fill='#1565c0'/><text x='400' y='145' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='middle'>=</text><rect x='430' y='110' width='160' height='70' rx='10' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='2'/><text x='510.0' y='137.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>W2 W1</text><text x='510.0' y='167.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>512 -&gt; 512</text><text x='240' y='240' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>y = W2(W1 x) = (W2 W1) x</text><text x='240' y='268' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the 2048-wide middle buys nothing</text><line x1='480' y1='90' x2='480' y2='320' stroke='#3a3a3a' stroke-width='1.5'/><text x='720' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>With the kink:</text><rect x='570' y='110' width='110' height='70' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='625.0' y='137.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>W1</text><text x='625.0' y='167.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>512 -&gt; 2048</text><rect x='660' y='170' width='70' height='60' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='695.0' y='206.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>GELU</text><rect x='760' y='110' width='110' height='70' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='815.0' y='137.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>W2</text><text x='815.0' y='167.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>2048 -&gt; 512</text><line x1='680' y1='145' x2='672' y2='180' stroke='#f0b429' stroke-width='3'/><polygon points='672.0,180.0 669.2,171.4 678.2,173.5' fill='#f0b429'/><line x1='730' y1='200' x2='760' y2='160' stroke='#f0b429' stroke-width='3'/><polygon points='760.0,160.0 759.1,169.0 751.7,163.4' fill='#f0b429'/><text x='720' y='280' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the bend is what lets the middle layer</text><text x='720' y='304' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>carve space instead of stretching it</text></svg>