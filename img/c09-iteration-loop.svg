<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 497" role="img" aria-label="The iteration discipline: one hypothesis, one change, one run">
<rect width="900" height="497" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The iteration discipline: one hypothesis, one change, one run</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Two changes at once = zero knowledge. Failed experiments are written down, not silently deleted.</text>
<line x1="450.0" y1="80.0" x2="573.6" y2="169.8" stroke="#8a8a8a" stroke-width="2"/>
<line x1="573.6" y1="169.8" x2="564.8" y2="168.0" stroke="#8a8a8a" stroke-width="2"/>
<line x1="573.6" y1="169.8" x2="569.1" y2="162.0" stroke="#8a8a8a" stroke-width="2"/>
<line x1="573.6" y1="169.8" x2="526.4" y2="315.2" stroke="#8a8a8a" stroke-width="2"/>
<line x1="526.4" y1="315.2" x2="525.5" y2="306.2" stroke="#8a8a8a" stroke-width="2"/>
<line x1="526.4" y1="315.2" x2="532.4" y2="308.5" stroke="#8a8a8a" stroke-width="2"/>
<line x1="526.4" y1="315.2" x2="373.6" y2="315.2" stroke="#8a8a8a" stroke-width="2"/>
<line x1="373.6" y1="315.2" x2="381.8" y2="311.5" stroke="#8a8a8a" stroke-width="2"/>
<line x1="373.6" y1="315.2" x2="381.8" y2="318.8" stroke="#8a8a8a" stroke-width="2"/>
<line x1="373.6" y1="315.2" x2="326.4" y2="169.8" stroke="#8a8a8a" stroke-width="2"/>
<line x1="326.4" y1="169.8" x2="332.4" y2="176.5" stroke="#8a8a8a" stroke-width="2"/>
<line x1="326.4" y1="169.8" x2="325.4" y2="178.8" stroke="#8a8a8a" stroke-width="2"/>
<line x1="326.4" y1="169.8" x2="450.0" y2="80.0" stroke="#8a8a8a" stroke-width="2"/>
<line x1="450.0" y1="80.0" x2="445.5" y2="87.8" stroke="#8a8a8a" stroke-width="2"/>
<line x1="450.0" y1="80.0" x2="441.2" y2="81.9" stroke="#8a8a8a" stroke-width="2"/>
<circle cx="450.0" cy="80.0" r="56.0" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="450.0" y="74.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">form one</text>
<text x="450.0" y="90.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">hypothesis</text>
<circle cx="573.6" cy="169.8" r="56.0" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="573.6" y="163.8" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">change</text>
<text x="573.6" y="179.8" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">one thing</text>
<circle cx="526.4" cy="315.2" r="56.0" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="526.4" y="309.2" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">train</text>
<circle cx="373.6" cy="315.2" r="56.0" fill="#141414" stroke="#2dd4bf" stroke-width="2"/>
<text x="373.6" y="309.2" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">evaluate on a</text>
<text x="373.6" y="325.2" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">frozen test set</text>
<circle cx="326.4" cy="169.8" r="56.0" fill="#141414" stroke="#f0b429" stroke-width="2"/>
<text x="326.4" y="163.8" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">write it down</text>
<text x="450.0" y="216.0" text-anchor="middle" fill="#ececec" font-size="15" font-family="Charis SIL, Georgia, serif" font-weight="bold">1 variable</text>
<text x="450.0" y="236.0" text-anchor="middle" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">per experiment</text>
<text x="40.0" y="431.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">Check every win for leakage: a surprising jump in score is guilty until proven innocent. Tune on</text>
<text x="40.0" y="447.2" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">validation, report on test, touch the test set once per project milestone. Every peek at the test</text>
<text x="40.0" y="463.4" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">set spends a little of its honesty.</text>
</svg>
