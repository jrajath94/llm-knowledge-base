<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='100%' role='img'><rect x='0' y='0' width='960' height='330' rx='12' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>The capstone: one artifact grows through the volumes</text><text x='24' y='56' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>each lab starts from the last volume's output</text><rect x='20' y='110' width='138' height='130' rx='10' fill='#111111' stroke='#1565c0' stroke-width='2'/><text x='89.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 1</text><text x='89.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>autograd engine</text><line x1='158' y1='175' x2='178' y2='175' stroke='#a8a8a8' stroke-width='2'/><polygon points='178,175 169,170 169,180' fill='#a8a8a8'/><rect x='178' y='110' width='138' height='130' rx='10' fill='#111111' stroke='#1565c0' stroke-width='2'/><text x='247.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 4</text><text x='247.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>attention + BPE</text><line x1='316' y1='175' x2='336' y2='175' stroke='#a8a8a8' stroke-width='2'/><polygon points='336,175 327,170 327,180' fill='#a8a8a8'/><rect x='336' y='110' width='138' height='130' rx='10' fill='#111111' stroke='#2e7d32' stroke-width='2'/><text x='405.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 5</text><text x='405.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>tiny GPT</text><line x1='474' y1='175' x2='494' y2='175' stroke='#a8a8a8' stroke-width='2'/><polygon points='494,175 485,170 485,180' fill='#a8a8a8'/><rect x='494' y='110' width='138' height='130' rx='10' fill='#111111' stroke='#f0b429' stroke-width='2'/><text x='563.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 6</text><text x='563.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>parallel run</text><line x1='632' y1='175' x2='652' y2='175' stroke='#a8a8a8' stroke-width='2'/><polygon points='652,175 643,170 643,180' fill='#a8a8a8'/><rect x='652' y='110' width='138' height='130' rx='10' fill='#111111' stroke='#f0b429' stroke-width='2'/><text x='721.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 7</text><text x='721.0' y='197.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8' text-anchor='middle'>SFT, then DPO</text><line x1='790' y1='175' x2='810' y2='175' stroke='#a8a8a8' stroke-width='2'/><polygon points='810,175 801,170 801,180' fill='#a8a8a8'/><rect x='810' y='110' width='138' height='130' rx='10' fill='#111111' stroke='#2e7d32' stroke-width='2'/><text x='879.0' y='175.0' font-family='-apple-system,BlinkMacSystemFont, Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 8</text><text x=