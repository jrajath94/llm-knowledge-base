<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img'>
<title>Eval contract ladder</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>Evals as customer contracts: the measurement is the contract</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>How do you know it works on our data? Answer with an acceptance eval both sides agree to before launch.</text>
<rect x='140' y='120' width='680' height='60' rx='8' fill='#1565c0' fill-opacity='0.16' stroke='#1565c0' stroke-width='2'/>
<text x='480' y='146' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='400' fill='#ececec' text-anchor='middle'>Unit evals</text>
<text x='480' y='166' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>per-component checks</text>
<line x1='480' y1='180' x2='480' y2='196' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='476.3,187.8 480,196 483.7,187.8' fill='#8a8a8a'/>
<rect x='180' y='196' width='600' height='60' rx='8' fill='#f0b429' fill-opacity='0.16' stroke='#f0b429' stroke-width='2'/>
<text x='480' y='222' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='400' fill='#ececec' text-anchor='middle'>Regression suite</text>
<text x='480' y='242' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>no silent decay</text>
<line x1='480' y1='256' x2='480' y2='272' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='476.3,263.8 480,272 483.7,263.8' fill='#8a8a8a'/>
<rect x='220' y='272' width='520' height='60' rx='8' fill='#2e9e5b' fill-opacity='0.16' stroke='#2e9e5b' stroke-width='2'/>
<text x='480' y='298' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='400' fill='#ececec' text-anchor='middle'>Acceptance eval</text>
<text x='480' y='318' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the signed bar</text>
<line x1='480' y1='332' x2='480' y2='348' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='476.3,339.8 480,348 483.7,339.8' fill='#8a8a8a'/>
<rect x='260' y='348' width='440' height='60' rx='8' fill='#8e24aa' fill-opacity='0.16' stroke='#8e24aa' stroke-width='2'/>
<text x='480' y='374' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='400' fill='#ececec' text-anchor='middle'>UAT rounds</text>
<text x='480' y='394' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>humans sign off</text>
<text x='480' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: trust climbs the ladder. Each rung is a gate the next rung assumes.</text>
</svg>