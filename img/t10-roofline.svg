<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t10rl-title t10rl-desc">
<title id="t10rl-title">Roofline model: are you memory-bound or compute-bound?</title>
<desc id="t10rl-desc">Axes: arithmetic intensity (FLOPs per byte) left to right, performance (TFLOPs) bottom to top. A flat roof is the compute ceiling at 300 TFLOPs. A slanted roof is the memory bandwidth ceiling. Kernel A sits on the slant: memory-bound. Kernel B sits on the flat: compute-bound. The knee where they meet is the ridge point.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="470" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">ROOFLINE MODEL (ONE GPU)</text>
<line x1="130" y1="390" x2="750" y2="390" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="130" y1="390" x2="130" y2="90" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="440.0" y="418" class="capl">arithmetic intensity (FLOP / byte)</text>
<line x1="130" y1="390" x2="430" y2="130" stroke="#6ab0ff" stroke-width="2.5"/>
<line x1="430" y1="130" x2="750" y2="130" stroke="#ff7a7a" stroke-width="2.5"/>
<text x="250" y="270" class="dl" fill="#6ab0ff">memory-bound</text>
<text x="550" y="110" class="dl" fill="#ff7a7a">compute-bound</text>
<circle cx="280" cy="240" r="10" fill="#6ab0ff" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="295" y="230" class="tl" fill="#6ab0ff">kernel A</text>
<circle cx="610" cy="130" r="10" fill="#ff7a7a" stroke="#0d0d0d" stroke-width="1.5"/>
<text x="625" y="120" class="tl" fill="#ff7a7a">kernel B</text>
<text x="30" y="448" class="capl">How to read: under the slant, buy memory bandwidth. Under the flat, buy math.</text>
</g>
<defs><marker id="t10rl-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>