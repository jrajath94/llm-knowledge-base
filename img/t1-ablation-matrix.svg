<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 565" role="img" aria-label="The ablation matrix: read down columns, across rows">
<rect width="900" height="565" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">The ablation matrix: read down columns, across rows</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Change one factor at a time, compute-matched. The matrix separates main effects from interactions.</text>
<rect x="200.0" y="79.0" width="220.0" height="60.0" rx="6" fill="#101010" stroke="#4aa8ff" stroke-width="1"/>
<text x="310.0" y="115.0" text-anchor="middle" fill="#4aa8ff" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Old mix</text>
<rect x="430.0" y="79.0" width="220.0" height="60.0" rx="6" fill="#101010" stroke="#4aa8ff" stroke-width="1"/>
<text x="540.0" y="115.0" text-anchor="middle" fill="#4aa8ff" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">New mix</text>
<rect x="660.0" y="79.0" width="220.0" height="60.0" rx="6" fill="#101010" stroke="#4aa8ff" stroke-width="1"/>
<text x="770.0" y="115.0" text-anchor="middle" fill="#4aa8ff" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">New mix + filter</text>
<rect x="40.0" y="149.0" width="150.0" height="120.0" rx="6" fill="#101010" stroke="#4aa8ff" stroke-width="1"/>
<text x="115.0" y="214.0" text-anchor="middle" fill="#4aa8ff" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">Cosine schedule</text>
<rect x="200.0" y="149.0" width="220.0" height="120.0" rx="6" fill="#0f2b26" stroke="#2a2a2a" stroke-width="1"/>
<text x="310.0" y="216.0" text-anchor="middle" fill="#2dd4bf" font-size="16" font-family="Charis SIL, Georgia, serif" font-weight="bold">A (control)</text>
<rect x="430.0" y="149.0" width="220.0" height="120.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="540.0" y="216.0" text-anchor="middle" fill="#ececec" font-size="16" font-family="Charis SIL, Georgia, serif" font-weight="bold">C</text>
<rect x="660.0" y="149.0" width="220.0" height="120.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="770.0" y="216.0" text-anchor="middle" fill="#ececec" font-size="16" font-family="Charis SIL, Georgia, serif" font-weight="bold">E</text>
<rect x="40.0" y="279.0" width="150.0" height="120.0" rx="6" fill="#101010" stroke="#4aa8ff" stroke-width="1"/>
<text x="115.0" y="344.0" text-anchor="middle" fill="#4aa8ff" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">WSD schedule</text>
<rect x="200.0" y="279.0" width="220.0" height="120.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="310.0" y="346.0" text-anchor="middle" fill="#ececec" font-size="16" font-family="Charis SIL, Georgia, serif" font-weight="bold">B</text>
<rect x="430.0" y="279.0" width="220.0" height="120.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="540.0" y="346.0" text-anchor="middle" fill="#ececec" font-size="16" font-family="Charis SIL, Georgia, serif" font-weight="bold">D</text>
<rect x="660.0" y="279.0" width="220.0" height="120.0" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
<text x="770.0" y="346.0" text-anchor="middle" fill="#ececec" font-size="16" font-family="Charis SIL, Georgia, serif" font-weight="bold">F</text>
<text x="40.0" y="437.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">- Down each column: the effect of the data mix, holding the schedule fixed.</text>
<text x="40.0" y="461.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">- Across each row: the effect of the schedule, holding the mix fixed.</text>
<text x="40.0" y="485.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">- Interaction needs the full matrix: whether the schedule's win depends on the mix.</text>
<text x="40.0" y="509.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">- WSD (warmup-stable-decay) lets you continue training cheaply, so it pairs well with ablations.</text>
</svg>
