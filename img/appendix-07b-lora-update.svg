<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="800" height="500" fill="#0d0d0d"/>
<text x="400" y="36" text-anchor="middle" fill="#ececec" font-size="22" font-weight="700">LoRA: freeze W, learn a low-rank update</text>
<text x="400" y="60" text-anchor="middle" fill="#a8a8a8" font-size="14">W' = W + B x A. Only A and B train.</text>
<!-- W frozen -->
<rect x="60" y="130" width="200" height="200" fill="#262626" stroke="#a8a8a8" stroke-width="2"/>
<text x="160" y="220" text-anchor="middle" fill="#ececec" font-size="28" font-weight="700">W</text>
<text x="160" y="248" text-anchor="middle" fill="#a8a8a8" font-size="14">4096 x 4096</text>
<text x="160" y="272" text-anchor="middle" fill="#a8a8a8" font-size="14">frozen, never moves</text>
<!-- plus -->
<text x="290" y="240" text-anchor="middle" fill="#ececec" font-size="36" font-weight="700">+</text>
<!-- B -->
<rect x="330" y="130" width="60" height="200" fill="#6cb2ff" opacity="0.35" stroke="#6cb2ff" stroke-width="2"/>
<text x="360" y="220" text-anchor="middle" fill="#6cb2ff" font-size="24" font-weight="700">B</text>
<text x="360" y="248" text-anchor="middle" fill="#a8a8a8" font-size="12">4096 x r</text>
<!-- x -->
<text x="410" y="240" text-anchor="middle" fill="#ececec" font-size="28" font-weight="700">x</text>
<!-- A -->
<rect x="430" y="130" width="130" height="60" fill="#6cb2ff" opacity="0.35" stroke="#6cb2ff" stroke-width="2"/>
<text x="495" y="156" text-anchor="middle" fill="#6cb2ff" font-size="20" font-weight="700">A</text>
<text x="495" y="176" text-anchor="middle" fill="#a8a8a8" font-size="12">r x 4096</text>
<text x="495" y="230" text-anchor="middle" fill="#6cb2ff" font-size="14">trainable</text>
<text x="495" y="252" text-anchor="middle" fill="#a8a8a8" font-size="13">r = 8, 16, 64</text>
<text x="495" y="274" text-anchor="middle" fill="#a8a8a8" font-size="13">tiny rank</text>
<!-- equals -->
<text x="600" y="240" text-anchor="middle" fill="#ececec" font-size="36" font-weight="700">=</text>
<!-- W' -->
<rect x="640" y="130" width="120" height="200" fill="#2e9e5b" opacity="0.25" stroke="#7fd08a" stroke-width="2"/>
<text x="700" y="220" text-anchor="middle" fill="#7fd08a" font-size="24" font-weight="700">W'</text>
<text x="700" y="248" text-anchor="middle" fill="#a8a8a8" font-size="13">deployed</text>
<text x="700" y="270" text-anchor="middle" fill="#a8a8a8" font-size="13">merge at inference</text>
<!-- bottom notes -->
<text x="400" y="390" text-anchor="middle" fill="#ececec" font-size="15">B starts at zero, so step 0 is exactly the base model.</text>
<text x="400" y="416" text-anchor="middle" fill="#ececec" font-size="15">r x (4096 + 4096) params per matrix: 65,536 at r = 8, about 0.06% of 7B.</text>
<text x="400" y="448" text-anchor="middle" fill="#a8a8a8" font-size="14">No optimizer state for W. That is where the memory saving comes from.</text>
</svg>
