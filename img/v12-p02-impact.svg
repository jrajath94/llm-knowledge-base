<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 227" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why RoPE mattered"><rect x="22" y="14" width="916" height="199" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">RoPE became infrastructure: the entire long-context literature is RoPE tuning</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Default everywhere:</text><text x="240.46015625" y="94" font-size="13.5" fill="#a8a8a8">the position encoding for LLaMA, Mistral, Qwen, Gemma, DeepSeek.</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">Zero parameters:</text><text x="217.7421875" y="125" font-size="13.5" fill="#a8a8a8">and it composes with FlashAttention because it never touches the attention matrix.</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">Better extrapolation:</text><text x="245.68929687500003" y="156" font-size="13.5" fill="#a8a8a8">generalizes to longer sequences than learned absolute embeddings.</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">The long-context field:</text><text x="257.3646875" y="187" font-size="13.5" fill="#a8a8a8">position interpolation, NTK-aware scaling, YaRN are all ways of adjusting the</text><text x="80" y="206" font-size="13.5" fill="#a8a8a8">theta schedule.</text></svg>