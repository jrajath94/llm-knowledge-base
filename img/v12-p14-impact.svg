<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 249" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why DeepSeek-R1 mattered"><rect x="22" y="14" width="916" height="221" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">R1-Zero: the cleanest existence proof that reasoning emerges from RL without</text><text x="38" y="88" font-size="16" font-weight="700" fill="#ececec">imitation</text><path d="M 53.7 111.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="116" font-size="13.5" font-weight="700" fill="#ececec">No SFT, no demos:</text><text x="225.20937500000002" y="116" font-size="13.5" fill="#a8a8a8">the model still learned to verify and backtrack.</text><path d="M 53.7 142.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="147" font-size="13.5" font-weight="700" fill="#ececec">Reward paradigm shift:</text><text x="264.112578125" y="147" font-size="13.5" fill="#a8a8a8">from human preference (RLHF/DPO) to verifiable correctness for reasoning</text><text x="80" y="166" font-size="13.5" fill="#a8a8a8">tasks.</text><path d="M 53.7 192.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="197" font-size="13.5" font-weight="700" fill="#ececec">New scaling axis:</text><text x="216.58203125" y="197" font-size="13.5" fill="#a8a8a8">test-time compute (longer chains) sits beside training compute.</text><path d="M 53.7 223.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="228" font-size="13.5" font-weight="700" fill="#ececec">No label budgets:</text><text x="219.499296875" y="228" font-size="13.5" fill="#a8a8a8">a path to frontier reasoning where the reward is a script.</text></svg>