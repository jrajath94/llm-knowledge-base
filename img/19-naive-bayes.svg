<svg xmlns='http://www.w3.org/2000/svg' width='760' height='400' viewBox='0 0 760 400' font-family='DejaVu Sans'>
<rect width='760' height='400' fill='#0a0a0a'/>
<text x='380' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Multinomial Naive Bayes: counts, logs, argmax</text>
<rect x='40' y='100' width='140' height='110' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='110' y='128' font-size='13' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>docs</text>
<text x='110' y='158' font-size='11' fill='#e8e8e8' text-anchor='middle'>tokenize</text>
<rect x='220' y='100' width='140' height='110' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='290' y='128' font-size='13' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>counts</text>
<text x='290' y='158' font-size='11' fill='#e8e8e8' text-anchor='middle'>vocabulary</text>
<text x='290' y='178' font-size='11' fill='#e8e8e8' text-anchor='middle'>+ count matrix</text>
<rect x='400' y='100' width='140' height='110' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='470' y='128' font-size='13' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>log-probs</text>
<text x='470' y='158' font-size='11' fill='#e8e8e8' text-anchor='middle'>Laplace smoothing</text>
<text x='470' y='178' font-size='11' fill='#e8e8e8' text-anchor='middle'>log P(w|class)</text>
<rect x='580' y='100' width='140' height='110' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='650' y='128' font-size='13' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>predict</text>
<text x='650' y='158' font-size='11' fill='#e8e8e8' text-anchor='middle'>sum log-probs</text>
<text x='650' y='178' font-size='11' fill='#e8e8e8' text-anchor='middle'>argmax class</text>
<line x1='180' y1='155' x2='220' y2='155' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='220,155 212,151.5 212,158.5' fill='#e8e8e8'/>
<line x1='360' y1='155' x2='400' y2='155' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='400,155 392,151.5 392,158.5' fill='#e8e8e8'/>
<line x1='540' y1='155' x2='580' y2='155' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='580,155 572,151.5 572,158.5' fill='#e8e8e8'/>
<text x='380' y='270' font-size='12' fill='#9a9a9a' text-anchor='middle'>Generative: model P(words|class), then flip with Bayes. Log-space is not optional.</text>
<text x='380' y='300' font-size='12' fill='#9a9a9a' text-anchor='middle'>Raw products underflow; sums of logs do not. Inspect top tokens per class as error analysis.</text>
<text x='380' y='345' font-size='12' fill='#f0b429' text-anchor='middle'>Tokenization edge cases (case, punctuation) silently change the vocabulary.</text>
</svg>