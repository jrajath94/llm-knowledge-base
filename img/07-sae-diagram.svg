<text x="584" y="288" font-size="11" fill="#8a8a8a" text-anchor="middle">decode</text>
<rect x="604" y="114" width="272" height="380" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6"/>
<text x="740.0" y="309.0" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">Reconstruction</text>
<text x="740" y="214" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#a8a8a8" text-anchor="middle">x^ = W_dec f(x) + b</text>
<text x="740" y="236" font-size="12" fill="#a8a8a8" text-anchor="middle">residual = machinery</text>
<text x="740" y="258" font-size="12" fill="#a8a8a8" text-anchor="middle">the SAE did not capture</text>
<circle cx="36" cy="529" r="5" fill="#4fd1a5"/>
<text x="52" y="534" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">The L1 sparsity penalty is the whole trick.</text>
<text x="52" y="554" font-size="11" fill="#a8a8a8" text-anchor="start">Without it the network learns a wide identity map and every feature is mush.</text>
<circle cx="36" cy="580" r="5" fill="#6cb2ff"/>
<text x="52" y="585" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">Expansion 4x to 64x.</text>
<text x="52" y="605" font-size="11" fill="#a8a8a8" text-anchor="start">More features: finer concepts, more compute, harder to inspect them all.</text>
<circle cx="36" cy="631" r="5" fill="#f0b429"/>
<text x="52" y="636" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">Decoder columns: unit norm.</text>
<text x="52" y="656" font-size="11" fill="#a8a8a8" text-anchor="start">Stops features cheating the L1 penalty by shrinking activations and growing weights.</text>
<circle cx="36" cy="682" r="5" fill="#b388ff"/>
<text x="52" y="687" font-size="12" font-weight="bold" fill="#ececec" text-anchor="start">Read features by max-activating examples.</text>
<text x="52" y="707" font-size="11" fill="#a8a8a8" text-anchor="start">A feature whose top examples are all database errors is the database-error feature.</text>
</svg>