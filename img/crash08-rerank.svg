<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 1.3. Rerank or not: 20 x 15ms = 300ms for 5-15 points of precision</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">precision has a price tag</text>
<rect x="120" y="140" width="560" height="56" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="120" y="140" width="392.0" height="56" fill="#f0b429" rx="6" opacity="0.85"/>
<text x="316.0" y="175" font-size="13" font-weight="bold" fill="#0b0e13" text-anchor="middle">rerank: 300ms</text>
<text x="120" y="240" font-size="13" font-weight="bold" fill="#7dd87d" text-anchor="start">precision gain: +5 to +15 points</text>
<rect x="24" y="280" width="400" height="110" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="224.0" y="306" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">RERANK WHEN</text>
<text x="224.0" y="324" font-size="11" fill="#a8a8a8" text-anchor="middle">precision matters more than latency and the budget</text>
<text x="224.0" y="339" font-size="11" fill="#a8a8a8" text-anchor="middle">holds 300ms</text>
<rect x="456" y="280" width="400" height="110" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="656.0" y="306" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">SKIP WHEN</text>
<text x="656.0" y="324" font-size="11" fill="#a8a8a8" text-anchor="middle">the first-stage retriever already saturates, or TTFT</text>
<text x="656.0" y="339" font-size="11" fill="#a8a8a8" text-anchor="middle">is the binding constraint</text>
<text x="24" y="450" font-size="12" fill="#a8a8a8" text-anchor="start">Measure the gain on your queries before paying the latency: rerankers help most when the corpus is noisy.</text>
</svg>