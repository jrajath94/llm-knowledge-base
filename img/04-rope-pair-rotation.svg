<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 530' width='100%' role='img'><rect x='0' y='0' width='960' height='530' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>RoPE: position rotates each dimension pair</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>One pair (x1, x2), four positions. Angle for position m: m x theta.</text><circle cx='300' cy='300' r='150' fill='none' stroke='#8a8a8a' stroke-width='1.5' stroke-dasharray='6,5'/><line x1='120' y1='300' x2='480' y2='300' stroke='#8a8a8a' stroke-width='1'/><line x1='300' y1='120' x2='300' y2='480' stroke='#8a8a8a' stroke-width='1'/><text x='494' y='305' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>x1</text><text x='308' y='114' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>x2</text><line x1='300' y1='300' x2='450.0' y2='300.0' stroke='#1565c0' stroke-width='3'/><circle cx='450.0' cy='300.0' r='6' fill='#1565c0'/><text x='484.0' y='304.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1565c0' text-anchor='middle'>m=0</text><line x1='300' y1='300' x2='419.4125697823584' y2='209.22203913959407' stroke='#4db6ac' stroke-width='3'/><circle cx='419.4125697823584' cy='209.22203913959407' r='6' fill='#4db6ac'/><text x='446.4794189330263' y='192.64570134456872' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#4db6ac' text-anchor='middle'>m=1</text><line x1='300' y1='300' x2='340.1248242936881' y2='155.46627218742105' stroke='#f0b429' stroke-width='3'/><circle cx='340.1248242936881' cy='155.46627218742105' r='6' fill='#f0b429'/><text x='349.21978446692407' y='126.7052938832365' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#f0b429' text-anchor='middle'>m=2</text><line x1='300' y1='300' x2='244.47287529730693' y2='160.6560427494196' stroke='#9a7bd0' stroke-width='3'/><circle cx='244.47287529730693' cy='160.6560427494196' r='6' fill='#9a7bd0'/><text x='231.8867270313632' y='133.07141243928805' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#9a7bd0' text-anchor='middle'>m=3</text><text x='660' y='150' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>What the diagram shows</text><text x='660' y='180' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Each pair of dimensions is</text><text x='660' y='202' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>a 2-D plane.</text><text x='660' y='224' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Position m rotates the pair</text><text x='660' y='246' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>by angle m x theta.</text><text x='660' y='290' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Different pairs use different</text><text x='660' y='312' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>theta: fast pairs spin many</text><text x='660' y='334' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>times, slow pairs barely move.</text><text x='660' y='378' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Relative distance falls out of</text><text x='660' y='400' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>the angle difference: rotation</text><text x='660' y='422' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>by (m - n) x theta.</text><text x='480' y='500' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>No position vector is added. The position lives in the rotation itself.</text></svg>