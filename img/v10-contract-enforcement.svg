<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The same contract, enforced in three places"><rect x="22" y="14" width="916" height="180" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">VERIFICATION</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">A contract without verification is a wish. The eval harness enforces it everywhere:</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">At change time:</text><text x="205.85585937500002" y="94" font-size="13.5" fill="#a8a8a8">the golden set runs on every change; the judge scores</text><path d="M 53.7 120.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="125" font-size="13.5" font-weight="700" fill="#ececec">At deploy time:</text><text x="201.888125" y="125" font-size="13.5" fill="#a8a8a8">the canary is the contract enforced while rolling out</text><path d="M 53.7 151.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="156" font-size="13.5" font-weight="700" fill="#ececec">At runtime:</text><text x="171.88015625000003" y="156" font-size="13.5" fill="#a8a8a8">the monitor is the contract enforced on live traffic</text><path d="M 53.7 182.7 l 4.55 5.25 l 8.75 -10.5" stroke="#6cb2ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="187" font-size="13.5" font-weight="700" fill="#ececec">On the dashboard:</text><text x="226.591015625" y="187" font-size="13.5" fill="#a8a8a8">the SLO is tracked continuously against the budget</text></svg>