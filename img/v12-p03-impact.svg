<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 227" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Why FlashAttention mattered"><rect x="22" y="14" width="916" height="199" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WHY IT MATTERED</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">The canonical example of IO-aware algorithm design</text><path d="M 53.7 89.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" font-size="13.5" font-weight="700" fill="#ececec">Ended a subfield:</text><text x="216.685390625" y="94" font-size="13.5" fill="#a8a8a8">exactness plus speed removed the reason to accept quality loss from</text><text x="80" y="113" font-size="13.5" fill="#a8a8a8">approximations.</text><path d="M 53.7 139.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="144" font-size="13.5" font-weight="700" fill="#ececec">Long context practical:</text><text x="260.560390625" y="144" font-size="13.5" fill="#a8a8a8">8k, 32k, 128k training; memory cost linear instead of quadratic.</text><path d="M 53.7 170.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="175" font-size="13.5" font-weight="700" fill="#ececec">Serving feasible:</text><text x="213.285078125" y="175" font-size="13.5" fill="#a8a8a8">inference with a long KV cache works at all because of this.</text><path d="M 53.7 201.7 l 4.55 5.25 l 8.75 -10.5" stroke="#f0b429" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="206" font-size="13.5" font-weight="700" fill="#ececec">The lesson:</text><text x="171.513125" y="206" font-size="13.5" fill="#a8a8a8">same FLOPs, reorganized around the memory hierarchy, run 3x faster.</text></svg>