<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <defs><style>.t{font:bold 22px sans-serif;fill:#1a1a1a}.b{font:bold 14px sans-serif;fill:#fff}.l{font:12px sans-serif;fill:#333}.s{font:11px monospace;fill:#fff}</style></defs>
  <rect width="960" height="400" fill="#fafafa"/>
  <text x="480" y="35" text-anchor="middle" class="t">KV Cache Growth During Decode</text>
  <!-- Timeline -->
  <g>
    <text x="80" y="80" font-weight="bold" font-size="14">Step 1</text>
    <rect x="80" y="90" width="60" height="40" rx="4" fill="#1976d2"/><text x="110" y="115" text-anchor="middle" class="s">K1V1</text>
    <text x="110" y="150" text-anchor="middle" class="l">1 token</text>
    
    <text x="220" y="80" font-weight="bold" font-size="14">Step 10</text>
    <rect x="190" y="90" width="120" height="40" rx="4" fill="#1976d2"/><text x="250" y="115" text-anchor="middle" class="s">K1V1...K10V10</text>
    <text x="250" y="150" text-anchor="middle" class="l">10 tokens</text>
    
    <text x="380" y="80" font-weight="bold" font-size="14">Step 100</text>
    <rect x="340" y="90" width="180" height="40" rx="4" fill="#7b1fa2"/><text x="430" y="115" text-anchor="middle" class="s">100 tokens cached</text>
    <text x="430" y="150" text-anchor="middle" class="l">grows linearly</text>
    
    <text x="600" y="80" font-weight="bold" font-size="14">Step 4000</text>
    <rect x="560" y="90" width="240" height="40" rx="4" fill="#c2185b"/><text x="680" y="115" text-anchor="middle" class="s">4000 tokens: 1.3 GB</text>
    <text x="680" y="150" text-anchor="middle" class="l">GQA-8, 70B</text>
  </g>
  <g>
    <rect x="80" y="180" width="800" height="90" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="480" y="205" text-anchor="middle" font-weight="bold" font-size="15">Formula: 2 × layers × KV-heads × head-dim × bytes × seq-len</text>
    <text x="480" y="230" text-anchor="middle" class="l">70B GQA-8: 2 × 80 × 8 × 128 × 2 bytes = 0.33 MB per token</text>
    <text x="480" y="255" text-anchor="middle" class="l">At 128k context: 0.33 × 131072 = 43 GB per sequence</text>
  </g>
  <g>
    <rect x="80" y="290" width="380" height="80" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="270" y="315" text-anchor="middle" font-weight="bold" font-size="14">Eviction saves memory</text>
    <text x="270" y="340" text-anchor="middle" class="l">Keep sinks + heavy hitters.</text>
    <text x="270" y="360" text-anchor="middle" class="l">Lose exact recall.</text>
  </g>
  <g>
    <rect x="500" y="290" width="380" height="80" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <text x="690" y="315" text-anchor="middle" font-weight="bold" font-size="14">GQA saves memory</text>
    <text x="690" y="340" text-anchor="middle" class="l">8 KV heads, not 64.</text>
    <text x="690" y="360" text-anchor="middle" class="l">8x smaller cache.</text>
  </g>
</svg>
