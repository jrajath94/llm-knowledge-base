<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>One word, two meanings: context bends the vector</text><rect x='390' y='80' width='180' height='80' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='480.0' y='112.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>bank</text><text x='480.0' y='142.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>static vector</text><line x1='390' y1='140' x2='240' y2='220' stroke='#1565c0' stroke-width='3'/><polygon points='240.0,220.0 244.6,212.3 249.0,220.5' fill='#1565c0'/><line x1='570' y1='140' x2='720' y2='220' stroke='#1565c0' stroke-width='3'/><polygon points='720.0,220.0 711.0,220.5 715.4,212.3' fill='#1565c0'/><rect x='80' y='226' width='320' height='110' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='240' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>"river bank"</text><text x='240' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>vector bends toward water, shore</text><text x='240' y='314' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>land</text><rect x='560' y='226' width='320' height='110' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='720' y='262' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>"bank account"</text><text x='720' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>vector bends toward money, vault</text><text x='720' y='314' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>interest</text><text x='480' y='376' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Self-attention rewrites each token vector using its neighbors. That rewriting IS contextualization.</text></svg>