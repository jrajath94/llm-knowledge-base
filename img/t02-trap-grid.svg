<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="100%" style="max-width:760px" role="img" aria-label="Eight traps in the order they tend to find you, each with its signature and its fix">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="640" fill="none"/>
<text class="t" x="24" y="30">The eight post-training traps: signature and fix</text>
<rect x="24" y="52" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="38" y="80">T1: Reward hacking</text>
<text class="m" x="38" y="104">signature: proxy climbs, gold peaks then falls</text>
<text class="m" x="38" y="126">fix: early stop on gold; KL control</text>
<rect x="388" y="52" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="402" y="80">T2: Length bias</text>
<text class="m" x="402" y="104">signature: length climbs, quality flat</text>
<text class="m" x="402" y="126">fix: length-normalized win rates</text>
<rect x="24" y="168" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="38" y="196">T3: Preference-data leakage</text>
<text class="m" x="38" y="220">signature: benchmark jumps, human evals flat</text>
<text class="m" x="38" y="242">fix: hash prompts vs eval sets</text>
<rect x="388" y="168" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="402" y="196">T4: Alignment tax</text>
<text class="m" x="402" y="220">signature: refusals great, capabilities sag</text>
<text class="m" x="402" y="242">fix: safety at 5-15%; pair refusals</text>
<rect x="24" y="284" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="38" y="312">T5: DPO rejected-only gaming</text>
<text class="m" x="38" y="336">signature: loss down, chosen log-probs down</text>
<text class="m" x="38" y="358">fix: monitor chosen; raise beta</text>
<rect x="388" y="284" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="402" y="312">T6: Off-policy reward model</text>
<text class="m" x="402" y="336">signature: PPO reward up, humans flat</text>
<text class="m" x="402" y="358">fix: refresh RM on-policy</text>
<rect x="24" y="400" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="38" y="428">T7: Judge biases</text>
<text class="m" x="38" y="452">signature: win rates flip on reorder</text>
<text class="m" x="38" y="474">fix: randomize order; kappa license</text>
<rect x="388" y="400" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="402" y="428">T8: Underpowered gates</text>
<text class="m" x="402" y="452">signature: 54% on n=200 reads as signal</text>
<text class="m" x="402" y="474">fix: size with SE formula; slice</text>
</svg>
