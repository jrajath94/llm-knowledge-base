<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 455' width='100%' role='img'><rect x='0' y='0' width='960' height='455' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>LayerNorm vs RMSNorm: what each one removes</text><text x='24' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='start'>Both tame wild activations. RMSNorm skips the mean subtraction.</text><rect x='60' y='100' width='400' height='280' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='260' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>LayerNorm</text><text x='260' y='185' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>1. mean = average(x)</text><text x='260' y='225' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>2. var = average((x - mean)^2)</text><text x='260' y='265' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>3. y = (x - mean) / sqrt(var) * g + b</text><text x='260' y='305' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1565c0' text-anchor='middle'>Keeps: gain g, shift b</text><rect x='500' y='100' width='400' height='280' rx='10' fill='#0d0d0d' stroke='#4db6ac' stroke-width='2'/><text x='700' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>RMSNorm</text><text x='700' y='185' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>1. rms = sqrt(average(x^2))</text><text x='700' y='225' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>2. y = x / rms * g</text><text x='700' y='265' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>No mean subtraction.</text><text x='700' y='305' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#4db6ac' text-anchor='middle'>Keeps: gain g only</text><text x='480' y='425' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>RMSNorm is cheaper and works as well: LLaMA and most open models use it.</text></svg>