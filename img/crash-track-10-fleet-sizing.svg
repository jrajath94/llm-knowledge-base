<svg xmlns="http://www.w3.org/2000/svg" width="560" height="285" viewBox="0 0 560 285">
<rect width="560" height="285" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Size from measured S, not the brochure</text><text x='60' y='90' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>900 tok/s x 0.7 util = 630 tok/s usable per GPU</text><text x='60' y='125' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>100,000 / 630 = 158.7 -> 159 GPUs</text><text x='60' y='160' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#f0b429' text-anchor='start' font-weight='bold'>+ 2 spares = 161 GPUs</text><text x='60' y='205' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='start'>If the 900 was a brochure number, the whole answer is fiction.</text><text x='20' y='255' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Measure S on your fleet at the target batch and context mix.</text></svg>