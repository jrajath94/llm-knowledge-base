<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
<rect width="560" height="300" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Two burn-rate windows: page now, ticket soon</text><rect x='40' y='80' width='220' height='70' rx='8' fill='none' stroke='#e57ea6' stroke-width='1.5'/><text x='150.0' y='120.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='middle'>fast window</text><text x='150' y='172' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>pages: budget drains fast</text><rect x='300' y='80' width='220' height='70' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='410.0' y='120.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>slow window</text><text x='410' y='172' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>tickets: slow leak</text><text x='40' y='220' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>Threshold alerts ignore the budget. Burn-rate alerts spend it.</text><text x='20' y='270' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Error budget: the allowed failure slice of the SLO.</text></svg>