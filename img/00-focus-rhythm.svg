<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='100%' role='img'><rect x='0' y='0' width='960' height='330' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Attention management: the 50/10 rhythm</text><rect x='52' y='110' width='160' height='70' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='132.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>50 min focus</text><text x='132.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Read - hour 1</text><rect x='212' y='110' width='48' height='70' rx='8' fill='#141414' stroke='#3a3a3a' stroke-width='1.5'/><text x='236.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#a8a8a8' text-anchor='middle'>10</text><text x='236.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>break</text><rect x='266' y='110' width='160' height='70' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='346.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>50 min focus</text><text x='346.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Read - hour 2</text><rect x='426' y='110' width='48' height='70' rx='8' fill='#141414' stroke='#3a3a3a' stroke-width='1.5'/><text x='450.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#a8a8a8' text-anchor='middle'>10</text><text x='450.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>break</text><rect x='480' y='110' width='160' height='70' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='560.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>50 min focus</text><text x='560.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Lab - hour 3</text><rect x='640' y='110' width='48' height='70' rx='8' fill='#141414' stroke='#3a3a3a' stroke-width='1.5'/><text x='664.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#a8a8a8' text-anchor='middle'>10</text><text x='664.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>break</text><rect x='694' y='110' width='160' height='70' rx='8' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='774.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#ececec' text-anchor='middle'>50 min focus</text><text x='774.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>DSA - hour 4</text><rect x='854' y='110' width='48' height='70' rx='8' fill='#141414' stroke='#3a3a3a' stroke-width='1.5'/><text x='878.0' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#a8a8a8' text-anchor='middle'>10</text><text x='878.0' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#8a8a8a' text-anchor='middle'>break</text><text x='480' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Four 50-minute blocks fill the 4-hour day. Stand up, look away, reset.</text><text x='480' y='258' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>If a chapter feels easy, do its lab anyway. The lab is where understanding forms.</text><text x='480' y='296' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The day is not done until the re-explanation rule runs: say the hardest idea aloud, from memory.</text></svg>