<svg xmlns="http://www.w3.org/2000/svg" width="720" height="445" viewBox="0 0 720 445" role="img" aria-label="Runbook entry template with three pre-written traps">
<rect width="720" height="445" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The runbook entry: four write-downs plus three traps</text>
<rect class="box" x="60" y="55" width="600" height="52" rx="8"/>
<line x1="60" y1="55" x2="60" y2="107" stroke="#f0b429" stroke-width="4"/>
<text x="86" y="76" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">what changed</text>
<text x="86" y="95" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">deploy, config, traffic shift, model swap</text>
<rect class="box" x="60" y="117" width="600" height="52" rx="8"/>
<line x1="60" y1="117" x2="60" y2="169" stroke="#58a6ff" stroke-width="4"/>
<text x="86" y="138" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">the spike shape</text>
<text x="86" y="157" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">step, ramp, sawtooth, cliff</text>
<rect class="box" x="60" y="179" width="600" height="52" rx="8"/>
<line x1="60" y1="179" x2="60" y2="231" stroke="#3fb950" stroke-width="4"/>
<text x="86" y="200" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">first signal</text>
<text x="86" y="219" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">which metric moved first, and when</text>
<rect class="box" x="60" y="241" width="600" height="52" rx="8"/>
<line x1="60" y1="241" x2="60" y2="293" stroke="#8a8a8a" stroke-width="4"/>
<text x="86" y="262" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">the fix that worked</text>
<text x="86" y="281" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">rollback, drain, scale, re-queue</text>
<text x="360" y="320" text-anchor="middle" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">three traps to pre-write:</text>
<text x="360" y="346" text-anchor="middle" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">cache poisoning: the cache key includes the model version</text>
<text x="360" y="372" text-anchor="middle" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">thundering herd: stagger warmup, jitter retries</text>
<text x="360" y="398" text-anchor="middle" fill="#e5484d" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">retry storms: cap retries, fail fast on the client</text>
<text x="360" y="430" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a runbook entry is read at 3 AM. Write it so a tired human can act.</text>
</svg>