<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
<rect width="560" height="320" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Golden set size: what n buys you</text><text x='60' y='110' font-family='Charis SIL, Georgia, serif' font-size='16' fill='#e8e8e8' text-anchor='start' font-weight='bold'>n = 200</text><line x1='100' y1='105' x2='500' y2='105' stroke='#f0b429' stroke-width='3'/><line x1='300' y1='96' x2='300' y2='114' stroke='#f0b429' stroke-width='3'/><text x='300' y='132' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#f0b429' text-anchor='middle'>+/- 5 pts</text><text x='60' y='154' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>fast iteration: a 3-pt move is noise</text><text x='60' y='200' font-family='Charis SIL, Georgia, serif' font-size='16' fill='#e8e8e8' text-anchor='start' font-weight='bold'>n = 800</text><line x1='200' y1='195' x2='400' y2='195' stroke='#7bc98a' stroke-width='3'/><line x1='300' y1='186' x2='300' y2='204' stroke='#7bc98a' stroke-width='3'/><text x='300' y='222' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='middle'>+/- 2.5 pts</text><text x='60' y='244' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>release decisions: moves are real</text><text x='20' y='290' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Rule: 200 items for fast iteration, 800+ for release decisions.</text></svg>