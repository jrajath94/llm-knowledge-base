<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="460" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Drift watch: the eval rots when the world moves</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">new attacks, new slang, new model version: the golden set ages</text>
<rect x="24" y="110" width="832" height="200" fill="#141414" stroke="#8a8a8a" stroke-width="1.5" rx="6" opacity="1"/>
<text x="48" y="140" font-size="13" font-weight="bold" fill="#ececec" text-anchor="start">what drifts</text>
<text x="48" y="170" font-size="12" fill="#a8a8a8" text-anchor="start">• attack techniques evolve past the golden set</text>
<text x="48" y="200" font-size="12" fill="#a8a8a8" text-anchor="start">• language and slang shift under the classifiers</text>
<text x="48" y="230" font-size="12" fill="#a8a8a8" text-anchor="start">• each model update moves the decision boundary</text>
<text x="48" y="280" font-size="12" fill="#e57ea6" text-anchor="start">the symptom: pass rates creep up while real-world breaks do not fall</text>
<rect x="24" y="330" width="832" height="80" fill="#141414" stroke="#7dd87d" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="356" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE FIX: refresh on a schedule</text>
<text x="440.0" y="374" font-size="11" fill="#a8a8a8" text-anchor="middle">retire stale items, add fresh red-team finds quarterly; version the golden set like code</text>
</svg>