<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><title>Cost per successful outcome, five parts</title><text x='480' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>$3.95 per attempt / 0.92 success = $4.29 per successful task</text><rect x='40' y='110' width='23' height='70' rx='8' fill='#1565c0' fill-opacity='0.30' stroke='#1565c0' stroke-width='2'/><text x='51.54430379746835' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>model</text><text x='51.54430379746835' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$0.12</text><rect x='63' y='110' width='38' height='70' rx='8' fill='#7b61b8' fill-opacity='0.30' stroke='#7b61b8' stroke-width='2'/><text x='82.32911392405063' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>infra share</text><text x='82.32911392405063' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$0.20</text><rect x='102' y='110' width='48' height='70' rx='8' fill='#2e9e5b' fill-opacity='0.30' stroke='#2e9e5b' stroke-width='2'/><text x='125.62025316455697' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>build share</text><text x='125.62025316455697' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$0.25</text><rect x='150' y='110' width='29' height='70' rx='8' fill='#f0b429' fill-opacity='0.30' stroke='#f0b429' stroke-width='2'/><text x='164.1012658227848' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>maintenance</text><text x='164.1012658227848' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$0.15</text><rect x='179' y='110' width='333' height='70' rx='8' fill='#8a5a00' fill-opacity='0.30' stroke='#8a5a00' stroke-width='2'/><text x='344.9620253164557' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>review labor</text><text x='344.9620253164557' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$1.73</text><rect x='511' y='110' width='289' height='70' rx='8' fill='#c0392b' fill-opacity='0.30' stroke='#c0392b' stroke-width='2'/><text x='655.6962025316457' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>rework labor</text><text x='655.6962025316457' y='160' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>$1.50</text><text x='480' y='225' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec' text-anchor='middle'>per attempt $3.95</text><text x='480' y='255' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>dividing by the success rate is the step people skip</text><text x='480' y='292' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#f0b429' text-anchor='middle'>cost per successful outcome = per-attempt cost / success rate</text><text x='480' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Human review minutes are the most uncertain input: measure them in the pilot shadow.</text></svg>