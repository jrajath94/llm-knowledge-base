<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Retry budget and stuck detection">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Retry budget and stuck detection</text>
<text x="300" y="58" text-anchor="middle" class="xs">One retry per sub-task, then move on.</text>
<line x1="80" y1="150" x2="520" y2="150" stroke="#8a8a8a" stroke-width="2"/>
<circle cx="150" cy="150" r="28" fill="#6cb2ff" opacity="0.85"/>
<text x="150" y="156" text-anchor="middle" class="s b" style="fill:#1a1a1a">Try 1</text>
<circle cx="290" cy="150" r="28" fill="#f0b429" opacity="0.85"/>
<text x="290" y="156" text-anchor="middle" class="s b" style="fill:#1a1a1a">Retry 1</text>
<circle cx="430" cy="150" r="28" fill="#e57373" opacity="0.85"/>
<text x="430" y="156" text-anchor="middle" class="s b" style="fill:#1a1a1a">Stuck?</text>
<text x="300" y="210" text-anchor="middle" class="s">3+ repeats with no progress = stuck. Never retry a stuck loop.</text>
<text x="300" y="235" text-anchor="middle" class="xs">Unbounded retries burn budgets while looking busy.</text>
<rect x="80" y="260" width="440" height="44" rx="8" fill="#141414" stroke="#8a8a8a"/>
<text x="300" y="287" text-anchor="middle" class="s">Budget: one retry per sub-task, then escalate or move on.</text>
</svg>
