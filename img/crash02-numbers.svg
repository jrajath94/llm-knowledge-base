<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" style="max-width:760px" role="img" aria-label="Six rules: perplexity, the 95 percent CI ship line, paired units, four leakage species, three leak detectors, temperature scaling">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="none"/>
<text class="t" x="24" y="30">Experiment craft: the numbers that decide if a win is real</text>
<rect x="24" y="52" width="8" height="44" rx="4" fill="#6cb2ff"/>
<text class="big" x="44" y="72">Perplexity = e^(loss in nats)</text>
<text class="m" x="44" y="90">loss 2.0 -&gt; ppl 7.39: average surprise per token</text>
<rect x="24" y="104" width="8" height="44" rx="4" fill="#f0b429"/>
<text class="big" x="44" y="124">95% CI on the difference</text>
<text class="m" x="44" y="142">if it covers zero, the win is not proven: the ship line</text>
<rect x="24" y="156" width="8" height="44" rx="4" fill="#6cb2ff"/>
<text class="big" x="44" y="176">Paired units: examples or seeds</text>
<text class="m" x="44" y="194">a t-test on two accuracy numbers (n=2) is meaningless</text>
<rect x="24" y="208" width="8" height="44" rx="4" fill="#e57373"/>
<text class="big" x="44" y="228">4 leakage species</text>
<text class="m" x="44" y="246">target, split, temporal, preprocessing: memorize, then hunt</text>
<rect x="24" y="260" width="8" height="44" rx="4" fill="#e57373"/>
<text class="big" x="44" y="280">3 leak detectors</text>
<text class="m" x="44" y="298">single-feature scan, duplicate audit, hygiene checklist</text>
<rect x="24" y="312" width="8" height="44" rx="4" fill="#6cb2ff"/>
<text class="big" x="44" y="332">ECE fix: temperature scaling</text>
<text class="m" x="44" y="350">rescales confidence, never changes the predicted class</text>
</svg>
