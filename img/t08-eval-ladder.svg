<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t08el-title t08el-desc">
<title id="t08el-title">Eval ladder: from cheap checks to real users</title>
<desc id="t08el-desc">Four rungs. Rung 1: unit checks, seconds, free. Rung 2: golden set, minutes, cents. Rung 3: LLM judge, minutes, dollars. Rung 4: A/B test with users, days, the final grade. Arrows show cost rising and fidelity rising together.</desc>
<style>
  .k text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
  .k .lane { font-size: 13px; font-weight: bold; fill: #f0b429; letter-spacing: 2px; }
  .k .box { font-size: 14.5px; font-weight: bold; text-anchor: middle; }
  .k .d { font-size: 12px; fill: #a8a8a8; text-anchor: middle; }
  .k .dl { font-size: 12px; fill: #a8a8a8; }
  .k .cap { font-size: 12.5px; fill: #a8a8a8; text-anchor: middle; font-style: italic; }
  .k .capl { font-size: 12.5px; fill: #a8a8a8; font-style: italic; }
  .k .num { font-size: 13px; font-weight: bold; text-anchor: middle; }
  .k .tl { font-size: 12px; text-anchor: middle; }
</style>
<g class="k">
<rect x="0" y="0" width="940" height="470" fill="#0d0d0d"/>
<text x="30" y="40" class="lane">EVAL LADDER (CLIMB ONLY WHEN THE LOWER RUNG PASSES)</text>
<rect x="30" y="70" width="560" height="84" rx="10" fill="#111111" stroke="#7fd67f" stroke-width="1.5"/>
<text x="310.0" y="104" class="box" fill="#ececec">Rung 1: unit checks</text>
<text x="310.0" y="126" class="d">format valid, no crash</text>
<text x="310.0" y="144" class="d">time: seconds - cost: free</text>
<rect x="30" y="170" width="560" height="84" rx="10" fill="#111111" stroke="#6ab0ff" stroke-width="1.5"/>
<text x="310.0" y="204" class="box" fill="#ececec">Rung 2: golden set</text>
<text x="310.0" y="226" class="d">200 hand-written Q/A pairs</text>
<text x="310.0" y="244" class="d">time: minutes - cost: cents</text>
<rect x="30" y="270" width="560" height="84" rx="10" fill="#111111" stroke="#f0b429" stroke-width="1.5"/>
<text x="310.0" y="304" class="box" fill="#ececec">Rung 3: LLM judge</text>
<text x="310.0" y="326" class="d">model grades the answers</text>
<text x="310.0" y="344" class="d">time: minutes - cost: dollars</text>
<rect x="30" y="370" width="560" height="84" rx="10" fill="#111111" stroke="#ff7a7a" stroke-width="1.5"/>
<text x="310.0" y="404" class="box" fill="#ececec">Rung 4: A/B test</text>
<text x="310.0" y="426" class="d">real users vote</text>
<text x="310.0" y="444" class="d">time: days - cost: the final grade</text>
<text x="650" y="130" class="lane">cost</text>
<text x="650" y="400" class="lane">fidelity</text>
<line x1="700" y1="150" x2="700" y2="380" stroke="#ff7a7a" stroke-width="1.8" marker-end="url(#t08el-ah)"/>
<text x="715" y="270" class="dl" fill="#a8a8a8">both rise together</text>
<text x="30" y="452" class="dl">Never skip rungs: a model that fails unit checks wastes judge dollars.</text>
</g>
<defs><marker id="t08el-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a8a8a8"/></marker></defs>
</svg>