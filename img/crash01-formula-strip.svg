<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="100%" style="max-width:760px" role="img" aria-label="Nine formula cards: Bayes, variance scaling, Xavier and He init, chain rule, entropy, cross-entropy, KL divergence, and the uniform baseline">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="328" fill="none"/>
<text class="t" x="24" y="30">The math load-bearing formulas, one card each</text>
<rect class="box" x="24" y="52" width="232" height="76" rx="8"/>
<text class="big g" x="36" y="78">Bayes</text>
<text class="num" x="36" y="100">P(A|B) = P(B|A) P(A) / P(B)</text>
<text class="m" x="36" y="118">the update rule; watch the base rate</text>
<rect class="box" x="268" y="52" width="232" height="76" rx="8"/>
<text class="big g" x="280" y="78">Var(X+X)</text>
<text class="num" x="280" y="100">4 Var(X)</text>
<text class="m" x="280" y="118">correlated errors add super-linearly</text>
<rect class="box" x="512" y="52" width="232" height="76" rx="8"/>
<text class="big g" x="524" y="78">Xavier init</text>
<text class="num" x="524" y="100">2 / (fan_in + fan_out)</text>
<text class="m" x="524" y="118">right scale for tanh / sigmoid</text>
<rect class="box" x="24" y="140" width="232" height="76" rx="8"/>
<text class="big g" x="36" y="166">He init</text>
<text class="num" x="36" y="188">2 / fan_in</text>
<text class="m" x="36" y="206">the 2 compensates the half ReLU kills</text>
<rect class="box" x="268" y="140" width="232" height="76" rx="8"/>
<text class="big g" x="280" y="166">Chain rule</text>
<text class="num" x="280" y="188">dz/dx = dz/dy . dy/dx</text>
<text class="m" x="280" y="206">backprop = this + bookkeeping</text>
<rect class="box" x="512" y="140" width="232" height="76" rx="8"/>
<text class="big g" x="524" y="166">Entropy</text>
<text class="num" x="524" y="188">H = -sum p log p (bits)</text>
<text class="m" x="524" y="206">expected surprise</text>
<rect class="box" x="24" y="228" width="232" height="76" rx="8"/>
<text class="big g" x="36" y="254">Cross-entropy</text>
<text class="num" x="36" y="276">-log q(true token)</text>
<text class="m" x="36" y="294">identical to NLL; the pretraining loss</text>
<rect class="box" x="268" y="228" width="232" height="76" rx="8"/>
<text class="big g" x="280" y="254">KL divergence</text>
<text class="num" x="280" y="276">sum p log(p/q), directed</text>
<text class="m" x="280" y="294">extra cost of believing q over p</text>
<rect class="box" x="512" y="228" width="232" height="76" rx="8"/>
<text class="big g" x="524" y="254">Uniform baseline</text>
<text class="num" x="524" y="276">ln(32000) = 10.37 nats</text>
<text class="m" x="524" y="294">the uniform-guess loss, 32k vocab</text>
</svg>
