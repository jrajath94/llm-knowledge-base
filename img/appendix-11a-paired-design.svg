<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Diagram comparing unpaired testing (A and B on different batches) with paired testing (A and B on the same items).">
<rect width="800" height="560" fill="#0d0d0d"/>
<text x="400" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Paired design beats unpaired</text>
<text x="400" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Same items, per-item differences: the batch difficulty cancels out.</text>
<text x="220" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#e67e7e">Unpaired (noisy)</text>
<text x="580" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#7fd08a">Paired (clean)</text>
<text x="60" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">A on batch X</text>
<rect x="60" y="144" width="52" height="34" rx="6" fill="#7fd08a" opacity="0.85"/>
<rect x="118" y="144" width="52" height="34" rx="6" fill="#7fd08a" opacity="0.85"/>
<rect x="176" y="144" width="52" height="34" rx="6" fill="#e6a75a" opacity="0.85"/>
<rect x="234" y="144" width="52" height="34" rx="6" fill="#e6a75a" opacity="0.85"/>
<rect x="292" y="144" width="52" height="34" rx="6" fill="#e67e7e" opacity="0.85"/>
<text x="60" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">score = skill + batch luck</text>
<text x="60" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">B on batch Y</text>
<rect x="60" y="314" width="52" height="34" rx="6" fill="#e6a75a" opacity="0.85"/>
<rect x="118" y="314" width="52" height="34" rx="6" fill="#e6a75a" opacity="0.85"/>
<rect x="176" y="314" width="52" height="34" rx="6" fill="#e67e7e" opacity="0.85"/>
<rect x="234" y="314" width="52" height="34" rx="6" fill="#e67e7e" opacity="0.85"/>
<rect x="292" y="314" width="52" height="34" rx="6" fill="#e67e7e" opacity="0.85"/>
<text x="60" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">score = skill + batch luck</text>
<text x="420" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">A and B on the same items</text>
<rect x="420" y="144" width="52" height="34" rx="6" fill="#7fd08a" opacity="0.85"/>
<text x="446" y="166" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0d0d0d" font-weight="bold">A,B</text>
<rect x="478" y="144" width="52" height="34" rx="6" fill="#e6a75a" opacity="0.85"/>
<text x="504" y="166" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0d0d0d" font-weight="bold">A,B</text>
<rect x="536" y="144" width="52" height="34" rx="6" fill="#e67e7e" opacity="0.85"/>
<text x="562" y="166" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0d0d0d" font-weight="bold">A,B</text>
<rect x="594" y="144" width="52" height="34" rx="6" fill="#e6a75a" opacity="0.85"/>
<text x="620" y="166" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0d0d0d" font-weight="bold">A,B</text>
<rect x="652" y="144" width="52" height="34" rx="6" fill="#e67e7e" opacity="0.85"/>
<text x="678" y="166" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0d0d0d" font-weight="bold">A,B</text>
<text x="420" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">per-item difference d_i = A_i - B_i</text>
<text x="420" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a8a8">batch luck cancels in each difference</text>
<text x="420" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ececec">Verdict: A - B = 0.05, 95% CI [0.01, 0.09]</text>
<text x="420" y="324" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#7fd08a">A wins, and you know by how much</text>
<text x="60" y="520" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Lesson: one flat comparison confounds skill with batch difficulty. Pairing removes the batch effect.</text>
</svg>