<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260">
<rect width="560" height="260" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Exactly-once delivery is impossible: the Two Generals</text><rect x='40' y='80' width='130' height='56' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='105.0' y='113.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>sender</text><rect x='390' y='80' width='130' height='56' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='455.0' y='113.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>receiver</text><line x1='170' y1='100' x2='390' y2='100' stroke='#9a9a9a' stroke-width='2'/><polygon points='390,100 381,96 381,104' fill='#9a9a9a'/><text x='280' y='92' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#9a9a9a' text-anchor='middle'>message</text><line x1='390' y1='122' x2='170' y2='122' stroke='#e57ea6' stroke-width='2'/><polygon points='170,122 161,118 161,126' fill='#e57ea6'/><text x='280' y='148' font-family='Charis SIL, Georgia, serif' font-size='12' fill='#e57ea6' text-anchor='middle'>ack (can be lost)</text><text x='40' y='200' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e8e8e8' text-anchor='start'>The sender can never be sure the receiver got it exactly once.</text><text x='40' y='226' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#7bc98a' text-anchor='start'>No protocol fixes this. Name it honestly: effectively-once.</text></svg>