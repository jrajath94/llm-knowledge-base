<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Cost per completed task beats cost per token"><rect x="22" y="14" width="916" height="234" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">WORKED COST MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">2,000 tokens per step. Raw compute: $0.28 per 1M tokens.</text><text x="38" y="116" font-size="13" font-weight="700" fill="#f0b429">Plan</text><text x="303.2" y="116" font-size="13" font-weight="700" fill="#f0b429">Tokens</text><text x="509.46666666666664" y="116" font-size="13" font-weight="700" fill="#f0b429">Price</text><text x="715.7333333333333" y="116" font-size="13" font-weight="700" fill="#f0b429">Cost per task</text><line x1="38" y1="120" x2="922" y2="120" stroke="#2e2e2e"/><text x="38" y="148" font-size="13" font-weight="700" fill="#ececec">Agent: 8 steps</text><text x="303.2" y="148" font-size="13" fill="#a8a8a8">8 x 2,000 = 16,000</text><text x="509.46666666666664" y="148" font-size="13" fill="#a8a8a8">$0.28 / 1M tokens</text><text x="715.7333333333333" y="148" font-size="13" fill="#a8a8a8">$0.00448 per task</text><line x1="38" y1="160" x2="922" y2="160" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="188" font-size="13" font-weight="700" fill="#ececec">Workflow: 2 steps</text><text x="303.2" y="188" font-size="13" fill="#a8a8a8">2 x 2,000 = 4,000</text><text x="509.46666666666664" y="188" font-size="13" fill="#a8a8a8">$1.00 / 1M tokens</text><text x="715.7333333333333" y="188" font-size="13" fill="#a8a8a8">$0.00400 per task</text><line x1="38" y1="200" x2="922" y2="200" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="228" font-size="13" font-weight="700" fill="#ececec">Winner</text><text x="303.2" y="228" font-size="13" fill="#a8a8a8">fewer steps</text><text x="509.46666666666664" y="228" font-size="13" fill="#a8a8a8">higher token price,</text><text x="509.46666666666664" y="248" font-size="13" fill="#a8a8a8">lower task price</text><text x="715.7333333333333" y="228" font-size="13" fill="#a8a8a8">the workflow wins</text><line x1="38" y1="260" x2="922" y2="260" stroke="#2e2e2e" stroke-opacity="0.5"/></svg>