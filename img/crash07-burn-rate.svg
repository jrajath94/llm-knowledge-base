<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="520" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.3. Burn rate: observed errors over allowed errors</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">99.9% over 30 days is 43.2 minutes of budget</text>
<rect x="90" y="140" width="640" height="70" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="90" y="140" width="384.0" height="70" fill="#f0b429" rx="6" opacity="0.85"/>
<text x="282.0" y="180.0" font-size="12" font-weight="bold" fill="#0b0e13" text-anchor="middle">26 min burned</text>
<text x="740" y="180.0" font-size="12" fill="#a8a8a8" text-anchor="start">43.2 min allowed</text>
<text x="90" y="260" font-size="14" font-weight="bold" fill="#ececec" text-anchor="start">burn rate = 26 / 43.2 = 0.60</text>
<text x="90" y="292" font-size="12" fill="#a8a8a8" text-anchor="start">below 1.0: on track | above 1.0: the budget dies early</text>
<rect x="24" y="340" width="832" height="90" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="366" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">THE POLICY</text>
<text x="440.0" y="384" font-size="11" fill="#a8a8a8" text-anchor="middle">burn rate above 1.0 freezes non-urgent deploys; above 2.0 pages the on-call</text>
<text x="24" y="480" font-size="12" fill="#a8a8a8" text-anchor="start">Error budgets turn reliability arguments into arithmetic. The budget is spent by deploys, so gate the deploys</text>
<text x="24" y="497" font-size="12" fill="#a8a8a8" text-anchor="start">on the burn rate.</text>
</svg>