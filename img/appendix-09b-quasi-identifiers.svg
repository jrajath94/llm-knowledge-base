<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-label="Quasi-identifiers: harmless alone, identifying in combination">
<rect width="820" height="500" fill="#0d0d0d"/>
<text x="410" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="bold" fill="#ececec">Quasi-identifiers: harmless alone, identifying together</text>
<text x="410" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a8a8a8">Names are the easy part. The combinations below re-identify people without any name at all.</text>

<g font-family="system-ui,-apple-system,sans-serif">
<!-- Combo 1 -->
<rect x="30" y="90" width="150" height="60" rx="8" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.2"/>
<text x="105" y="115" text-anchor="middle" font-size="13" fill="#6cb2ff">Zip code</text>
<text x="105" y="135" text-anchor="middle" font-size="11" fill="#a8a8a8">e.g. 90210</text>
<text x="195" y="125" text-anchor="middle" font-size="18" fill="#555">+</text>
<rect x="215" y="90" width="150" height="60" rx="8" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.2"/>
<text x="290" y="115" text-anchor="middle" font-size="13" fill="#6cb2ff">Birth date</text>
<text x="290" y="135" text-anchor="middle" font-size="11" fill="#a8a8a8">e.g. 1988-03-14</text>
<text x="380" y="125" text-anchor="middle" font-size="18" fill="#555">+</text>
<rect x="400" y="90" width="150" height="60" rx="8" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.2"/>
<text x="475" y="115" text-anchor="middle" font-size="13" fill="#6cb2ff">Gender</text>
<text x="475" y="135" text-anchor="middle" font-size="11" fill="#a8a8a8">e.g. F</text>
<line x1="565" y1="120" x2="610" y2="120" stroke="#e08080" stroke-width="2"/>
<polygon points="610,120 602,114 602,126" fill="#e08080"/>
<rect x="610" y="90" width="180" height="60" rx="8" fill="#3a1f1f" stroke="#e08080" stroke-width="1.5"/>
<text x="700" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#e08080">re-identifies</text>
<text x="700" y="135" text-anchor="middle" font-size="12" fill="#e08080">most people</text>

<!-- Combo 2 -->
<rect x="30" y="180" width="150" height="60" rx="8" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.2"/>
<text x="105" y="205" text-anchor="middle" font-size="13" fill="#6cb2ff">Job title</text>
<text x="105" y="225" text-anchor="middle" font-size="11" fill="#a8a8a8">e.g. VP Eng</text>
<text x="195" y="215" text-anchor="middle" font-size="18" fill="#555">+</text>
<rect x="215" y="180" width="150" height="60" rx="8" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.2"/>
<text x="290" y="205" text-anchor="middle" font-size="13" fill="#6cb2ff">Employer</text>
<text x="290" y="225" text-anchor="middle" font-size="11" fill="#a8a8a8">e.g. Acme Bank</text>
<text x="380" y="215" text-anchor="middle" font-size="18" fill="#555">+</text>
<rect x="400" y="180" width="150" height="60" rx="8" fill="#1a1a1a" stroke="#6cb2ff" stroke-width="1.2"/>
<text x="475" y="205" text-anchor="middle" font-size="13" fill="#6cb2ff">City</text>
<text x="475" y="225" text-anchor="middle" font-size="11" fill="#a8a8a8">e.g. Austin</text>
<line x1="565" y1="210" x2="610" y2="210" stroke="#e08080" stroke-width="2"/>
<polygon points="610,210 602,204 602,216" fill="#e08080"/>
<rect x="610" y="180" width="180" height="60" rx="8" fill="#3a1f1f" stroke="#e08080" stroke-width="1.5"/>
<text x="700" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#e08080">does the rest</text>
<text x="700" y="225" text-anchor="middle" font-size="12" fill="#e08080">of the re-identifying</text>
</g>

<rect x="30" y="275" width="760" height="95" rx="10" fill="#141414" stroke="#f0b429" stroke-width="1"/>
<text x="410" y="305" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="bold" fill="#f0b429">The rule</text>
<text x="410" y="331" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">Real anonymization means handling quasi-identifiers too, or admitting the data is pseudonymous</text>
<text x="410" y="353" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ececec">(reversible with effort) and protecting it accordingly. When in doubt, treat scrubbed data as still sensitive.</text>

<text x="410" y="410" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">Removing names while keeping zip code and birth date still leaves the person identifiable.</text>
<text x="410" y="448" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" fill="#a8a8a8">All example values above are fictional.</text>
</svg>
