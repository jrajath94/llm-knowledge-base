<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" font-family="'Charis SIL',Georgia,serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" /></marker></defs>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">STAR Story Structure</text>
<rect x="50" y="80" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="115.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">S</text>
<text x="115.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Situation</text>
<rect x="200" y="80" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="265.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">T</text>
<text x="265.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Task</text>
<rect x="350" y="80" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="415.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">A</text>
<text x="415.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Action</text>
<rect x="500" y="80" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="565.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">R</text>
<text x="565.0" y="128" text-anchor="middle" font-size="11" fill="#a8a8a8">Result</text>
<line x1="180" y1="115" x2="200" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="330" y1="115" x2="350" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="480" y1="115" x2="500" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="350" y="200" text-anchor="middle" font-size="12" fill="#a8a8a8">Ownership stories use STAR. Research stories use SCAR (Challenge instead of Task).</text>
</svg>