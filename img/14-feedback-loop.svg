<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="sans-serif">
<rect width="600" height="400" fill="#ffffff"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Writing Feedback Loop</text>
<rect x="50" y="100" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="115.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Draft</text>
<text x="115.0" y="148" text-anchor="middle" font-size="11" fill="#555">Write fast</text>
<rect x="230" y="100" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="295.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Review</text>
<text x="295.0" y="148" text-anchor="middle" font-size="11" fill="#555">Get feedback</text>
<rect x="410" y="100" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="475.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Revise</text>
<text x="475.0" y="148" text-anchor="middle" font-size="11" fill="#555">Fix it</text>
<line x1="180" y1="135" x2="230" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="360" y1="135" x2="410" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="475" y1="170" x2="115" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="295" y="195" text-anchor="middle" font-size="11">Repeat</text>
</svg>
