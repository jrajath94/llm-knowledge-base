<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="'Charis SIL',Georgia,serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" /></marker></defs>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Writing Feedback Loop</text>
<rect x="50" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="115.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Draft</text>
<text x="115.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Write fast</text>
<rect x="230" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="295.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Review</text>
<text x="295.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Get feedback</text>
<rect x="410" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="475.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Revise</text>
<text x="475.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Fix it</text>
<line x1="180" y1="135" x2="230" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="360" y1="135" x2="410" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="475" y1="170" x2="115" y2="170" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="295" y="195" text-anchor="middle" font-size="11" style="fill:#ececec">Repeat</text>
</svg>