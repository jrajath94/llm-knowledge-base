<svg xmlns="http://www.w3.org/2000/svg" width="720" height="441" viewBox="0 0 720 441" role="img" aria-label="Agreement metric decision table">
<rect width="720" height="441" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Which agreement number, when</text>
<rect class="box" x="40" y="58" width="640" height="62" rx="8"/>
<line x1="40" y1="58" x2="40" y2="120" stroke="#f0b429" stroke-width="4"/>
<text x="66" y="82" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">accuracy</text>
<text x="66" y="102" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">use when classes are balanced   |   lies when one class dominates</text>
<rect class="box" x="40" y="130" width="640" height="62" rx="8"/>
<line x1="40" y1="130" x2="40" y2="192" stroke="#58a6ff" stroke-width="4"/>
<text x="66" y="154" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">Cohen's kappa</text>
<text x="66" y="174" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">use when binary or categorical verdicts   |   lies when a class is very rare</text>
<rect class="box" x="40" y="202" width="640" height="62" rx="8"/>
<line x1="40" y1="202" x2="40" y2="264" stroke="#3fb950" stroke-width="4"/>
<text x="66" y="226" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">Pearson / Spearman</text>
<text x="66" y="246" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">use when graded scores (1-5, 0-100)   |   lies when you need exact agreement</text>
<rect class="box" x="40" y="274" width="640" height="62" rx="8"/>
<line x1="40" y1="274" x2="40" y2="336" stroke="#8a8a8a" stroke-width="4"/>
<text x="66" y="298" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">mean absolute error</text>
<text x="66" y="318" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">use when graded scores, real stakes per point   |   lies when outliers dominate</text>
<text x="360" y="372" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">binary verdicts: report accuracy and kappa together, always</text>
<text x="360" y="394" text-anchor="middle" fill="#ececec" font-size="12" font-weight="700" font-family="Charis SIL, Georgia, serif">graded rubrics: report correlation and mean absolute error together</text>
<text x="360" y="416" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">one number is never the story</text>
</svg>