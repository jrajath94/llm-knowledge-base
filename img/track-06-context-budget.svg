<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 520' width='100%' role='img'>
<title>The context budget</title>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a8a8'/></marker></defs>
<text x='450' y='40' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The context budget</text>
<text x='450' y='64' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#a8a8a8' text-anchor='middle'>A 128k window is not 128k of free space. Budget every part.</text>
<rect x='60' y='180' width='93.6' height='70' fill='#1565c0' fill-opacity='0.55' stroke='#1565c0' stroke-width='1.5'/>
<text x='106.8' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>System prompt</text>
<text x='106.8' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>12%</text>
<rect x='153.6' y='180' width='140.4' height='70' fill='#f0b429' fill-opacity='0.55' stroke='#f0b429' stroke-width='1.5'/>
<text x='223.8' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Tool definitions</text>
<text x='223.8' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>18%</text>
<rect x='294.0' y='180' width='351.0' height='70' fill='#2e9e5b' fill-opacity='0.55' stroke='#2e9e5b' stroke-width='1.5'/>
<text x='469.5' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Conversation history</text>
<text x='469.5' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>45%</text>
<rect x='645.0' y='180' width='117.0' height='70' fill='#8e24aa' fill-opacity='0.55' stroke='#8e24aa' stroke-width='1.5'/>
<text x='703.5' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Scratchpad</text>
<text x='703.5' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>15%</text>
<rect x='762.0' y='180' width='78.0' height='70' fill='#00897b' fill-opacity='0.55' stroke='#00897b' stroke-width='1.5'/>
<text x='801.0' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Free space</text>
<text x='801.0' y='230' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>10%</text>
<line x1='60' y1='166' x2='840' y2='166' stroke='#c0392b' stroke-width='2' stroke-dasharray='6 4'/>
<text x='840' y='158' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#c0392b' text-anchor='end'>hard limit: 128k tokens</text>
<rect x='60' y='300' width='16' height='16' fill='#1565c0' fill-opacity='0.55'/>
<text x='86' y='313' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>System prompt (12%)</text>
<rect x='60' y='326' width='16' height='16' fill='#f0b429' fill-opacity='0.55'/>
<text x='86' y='339' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Tool definitions (18%)</text>
<rect x='60' y='352' width='16' height='16' fill='#2e9e5b' fill-opacity='0.55'/>
<text x='86' y='365' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Conversation history (45%)</text>
<rect x='60' y='378' width='16' height='16' fill='#8e24aa' fill-opacity='0.55'/>
<text x='86' y='391' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Scratchpad (15%)</text>
<rect x='60' y='404' width='16' height='16' fill='#00897b' fill-opacity='0.55'/>
<text x='86' y='417' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Free space (10%)</text>
<text x='480' y='480' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>History grows as the run continues. When free space hits zero, compact or stop.</text>
</svg>