<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="Constitutional AI critique-revision loop">
<rect width="720" height="430" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Constitutional AI: the model revises its own answer</text>
<rect class="box" x="30" y="60" width="160" height="100" rx="8"/>
<text class="t" x="110" y="84" text-anchor="middle">constitution</text>
<text class="s" x="110" y="104" text-anchor="middle">the written</text>
<text class="s" x="110" y="121" text-anchor="middle">principles</text>
<line x1="30" y1="60" x2="30" y2="160" stroke="#f0b429" stroke-width="4"/>
<path d="M190,110 L225,110" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="225" y="60" width="160" height="100" rx="8"/>
<text class="t" x="305" y="84" text-anchor="middle">draft</text>
<text class="s" x="305" y="104" text-anchor="middle">model writes</text>
<text class="s" x="305" y="121" text-anchor="middle">a first answer</text>
<line x1="225" y1="60" x2="225" y2="160" stroke="#58a6ff" stroke-width="4"/>
<path d="M385,110 L420,110" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="420" y="60" width="150" height="100" rx="8"/>
<text class="t" x="495" y="84" text-anchor="middle">critique</text>
<text class="s" x="495" y="104" text-anchor="middle">against the</text>
<text class="s" x="495" y="121" text-anchor="middle">constitution</text>
<line x1="420" y1="60" x2="420" y2="160" stroke="#e5484d" stroke-width="4"/>
<path d="M570,110 L660,110" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="570" y="60" width="120" height="100" rx="8"/>
<text class="t" x="630" y="84" text-anchor="middle">revision</text>
<text class="s" x="630" y="104" text-anchor="middle">rewrite to</text>
<text class="s" x="630" y="121" text-anchor="middle">satisfy it</text>
<line x1="570" y1="60" x2="570" y2="160" stroke="#3fb950" stroke-width="4"/>
<path d="M630,160 L630,200" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M630,200 L110,200" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M110,200 L110,160" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="360" y="222" text-anchor="middle" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">revised answer</text>
<rect class="box" x="230" y="250" width="260" height="100" rx="8"/>
<text class="t" x="360" y="274" text-anchor="middle">RLAIF training</text>
<text class="s" x="360" y="294" text-anchor="middle">train on the revised answers</text>
<text class="s" x="360" y="311" text-anchor="middle">the why becomes the policy</text>
<line x1="230" y1="250" x2="230" y2="350" stroke="#f0b429" stroke-width="4"/>
<text x="360" y="385" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">self-critique teaches the reasons behind refusals, not just the templates</text>
<text x="360" y="407" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">the constitution is explicit, so the policy stays auditable</text>
</svg>