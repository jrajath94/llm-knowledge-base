<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">The four memory residents</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">7B model, bf16 weights, AdamW: the optimizer states dwarf the model</text>
<rect x="60" y="94" width="70.0" height="46" fill="#6cb2ff" rx="4" opacity="1"/>
<text x="95.0" y="123" font-size="13" font-weight="bold" fill="#0d0d0d" text-anchor="middle">14 GB</text>
<rect x="130.0" y="94" width="70.0" height="46" fill="#4fd1a5" rx="4" opacity="1"/>
<text x="165.0" y="123" font-size="13" font-weight="bold" fill="#0d0d0d" text-anchor="middle">14 GB</text>
<rect x="200.0" y="94" width="280.0" height="46" fill="#e57ea6" rx="4" opacity="1"/>
<text x="340.0" y="123" font-size="13" font-weight="bold" fill="#0d0d0d" text-anchor="middle">56 GB</text>
<rect x="480.0" y="94" width="140.0" height="46" fill="#f0b429" rx="4" opacity="1"/>
<text x="550.0" y="123" font-size="13" font-weight="bold" fill="#0d0d0d" text-anchor="middle">28 GB</text>
<text x="60" y="166" font-size="12" fill="#6cb2ff" text-anchor="start">weights 14 GB</text>
<text x="220" y="166" font-size="12" fill="#4fd1a5" text-anchor="start">gradients 14 GB</text>
<text x="400" y="166" font-size="12" fill="#e57ea6" text-anchor="start">optimizer 56 GB</text>
<text x="600" y="166" font-size="12" fill="#f0b429" text-anchor="start">activations ~28 GB</text>
<line x1="60" y1="194" x2="460.0" y2="194" stroke="#7dd87d" stroke-width="3"/>
<text x="468.0" y="198" font-size="12" fill="#7dd87d" text-anchor="start">80 GB H100 ceiling</text>
<text x="60" y="228" font-size="13" fill="#ececec" text-anchor="start">~85 GB before a single activation: a 7B model does not fit on one 80 GB GPU.</text>
<text x="60" y="252" font-size="13" fill="#f0b429" text-anchor="start">This is exactly why ZeRO/FSDP exists: to split the 56 GB of optimizer states (Volume 6).</text>
</svg>