<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Backpropagation on a tiny graph with worked numbers">
<rect width="760" height="400" fill="#ffffff"/>
<style>text{font-family:Georgia,'Times New Roman',serif;fill:#1a1a1a} .lbl{font-size:17px} .sm{font-size:14px;fill:#444} .num{font-size:16px;font-weight:bold} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:#1a1a1a}</style>
<text x="380" y="32" text-anchor="middle" class="lbl" font-weight="bold">Backprop: forward computes values, backward assigns blame</text><text x="120" y="86" class="sm" font-weight="bold">forward</text><text x="88" y="250" class="sm" font-weight="bold" fill="#dc2626">backward</text><rect x="150" y="110" width="120" height="66" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="210" y="138" text-anchor="middle" class="num">x = 2</text><line x1="270" y1="143" x2="300" y2="143" stroke="#2563eb" stroke-width="2.5"/><polygon points="300,143 290,137 290,149" fill="#2563eb"/><rect x="300" y="110" width="120" height="66" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="360" y="138" text-anchor="middle" class="num">y = w*x = 6</text><text x="360" y="160" text-anchor="middle" class="sm">w = 3</text><line x1="420" y1="143" x2="470" y2="143" stroke="#2563eb" stroke-width="2.5"/><polygon points="470,143 460,137 460,149" fill="#2563eb"/><rect x="470" y="110" width="120" height="66" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="530" y="138" text-anchor="middle" class="num">L = (y-t)^2 = 4</text><text x="530" y="160" text-anchor="middle" class="sm">t = 4</text><text x="590" y="238" text-anchor="middle" class="sm" fill="#dc2626">dL/dL = 1</text><text x="420" y="238" text-anchor="middle" class="sm" fill="#dc2626">dL/dy = 2(y-t) = 4</text><text x="240" y="238" text-anchor="middle" class="sm" fill="#dc2626">dL/dw = 4 x 2 = 8</text><line x1="462" y1="215" x2="432" y2="215" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5"/><polygon points="432,215 442,209 442,221" fill="#dc2626"/><line x1="294" y1="215" x2="280" y2="215" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5"/><polygon points="280,215 290,209 290,221" fill="#dc2626"/><text x="380" y="300" text-anchor="middle" class="sm">local derivatives: dy/dw = x = 2;  dL/dy = 2(y - t) = 4</text><text x="380" y="328" text-anchor="middle" class="mono">chain rule: dL/dw = (dL/dy) x (dy/dw) = 4 x 2 = 8</text><text x="380" y="356" text-anchor="middle" class="sm">gradient positive, so w = 3 steps down: w = w - eta x 8</text><text x="380" y="384" text-anchor="middle" class="sm">one backward sweep computes every weight's gradient at once</text></svg>