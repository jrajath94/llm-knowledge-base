<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" width="100%" style="max-width:760px" role="img" aria-label="Twelve classic serving failure modes, each with its signature and its fix">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="760" height="528" fill="none"/>
<text class="t" x="24" y="30">Twelve ways serving stacks fail: signature and fix</text>
<rect x="24" y="52" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="38" y="80">1. Coordinated omission</text>
<text class="m" x="38" y="104">signature: generator waits; real p99 terrible</text>
<text class="m" x="38" y="126">fix: compare generator-send times</text>
<rect x="388" y="52" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="402" y="80">2. KV-cache OOM cliff</text>
<text class="m" x="402" y="104">signature: OOM scheduled at config time, not caused by traffic</text>
<text class="m" x="402" y="126">fix: do the 2.2 arithmetic first</text>
<rect x="24" y="168" width="352" height="104" rx="8" fill="#141414" stroke="#e57373" stroke-width="1.4"/>
<text class="big" x="38" y="196">3. Prefix-cache poisoning</text>
<text class="m" x="38" y="220">signature: one whitespace zeroes prefix hits overnight</text>
<text class="m" x="38" y="242">fix: pin template versions</text>
<rect x="388" y="168" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="402" y="196">4. Throughput vs goodput</text>
<text class="m" x="402" y="220">signature: preemption burns FLOPs for zero new tokens</text>
<text class="m" x="402" y="242">fix: track preemptions per minute</text>
<rect x="24" y="284" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="38" y="312">5. Perplexity-only quant eval</text>
<text class="m" x="38" y="336">signature: perplexity flat while math falls off a cliff</text>
<text class="m" x="38" y="358">fix: task metrics on traffic-like data</text>
<rect x="388" y="284" width="352" height="104" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.4"/>
<text class="big" x="402" y="312">6. Stale calibration scales</text>
<text class="m" x="402" y="336">signature: scales not portable across checkpoints</text>
<text class="m" x="402" y="358">fix: re-calibrate after every fine-tune</text>
<rect x="24" y="400" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="38" y="428">7. Symmetric K/V quant</text>
<text class="m" x="38" y="452">signature: one scheme for both: worst of both worlds</text>
<text class="m" x="38" y="474">fix: keys per-channel, values per-token</text>
<rect x="388" y="400" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="402" y="428">8. Static-batching stragglers</text>
<text class="m" x="402" y="452">signature: one long request holds the batch hostage</text>
<text class="m" x="402" y="474">fix: continuous batching</text>
<rect x="24" y="516" width="352" height="104" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="1.4"/>
<text class="big" x="38" y="544">9. Slow autoscaling</text>
<text class="m" x="38" y="568">signature: spot idle while reserved queues</text>
<text class="m" x="38" y="590">fix: compare spot vs reserved utilization</text>
<rect x="388" y="516" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="402" y="544">10. Shadow without comparator</text>
<text class="m" x="402" y="568">signature: logs nobody reads; 100% mirror doubles the bill</text>
<text class="m" x="402" y="590">fix: budget the shadow; read the comparator</text>
<rect x="24" y="632" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="38" y="660">11. Preemption storm</text>
<text class="m" x="38" y="684">signature: max-concurrency up: throughput down 40%, preemptions 20x</text>
<text class="m" x="38" y="706">fix: admit by the 2.2 arithmetic</text>
<rect x="388" y="632" width="352" height="104" rx="8" fill="#141414" stroke="#7fc97f" stroke-width="1.4"/>
<text class="big" x="402" y="660">12. Unmeasured disaggregation</text>
<text class="m" x="402" y="684">signature: 32k over IB: 215 ms transfer vs 50 ms interference</text>
<text class="m" x="402" y="706">fix: measure both sides (2.7)</text>
</svg>
