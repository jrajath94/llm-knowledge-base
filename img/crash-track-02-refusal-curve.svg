<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="100%" style="max-width:660px" role="img" aria-label="Refusal calibration is a curve: progress moves the whole curve up and left; sliding along the curve by turning the strictness knob is not progress">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Refusal calibration: move the curve, not along it</text>
<line class="ax" x1="80" y1="320" x2="630" y2="320"/><line class="ax" x1="80" y1="320" x2="80" y2="60"/>
<text class="m" x="355" y="350" text-anchor="middle">false refusals % (benign edges refused)</text>
<text class="m" x="46" y="190" text-anchor="middle" transform="rotate(-90 46 190)">true refusals %</text>
<polyline points="120,300 220,220 340,170 480,140 600,125" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
<text class="m" x="630" y="160" text-anchor="end">old curve</text>
<polyline points="120,250 220,170 340,120 480,92 600,80" fill="none" stroke="#7fc97f" stroke-width="2.5"/>
<text class="gr" x="560" y="108">new curve</text>
<circle cx="196" cy="243" r="6" fill="#6cb2ff"/>
<text class="m" x="208" y="252">start: 92% true, 6% false</text>
<circle cx="170" cy="205" r="6" fill="#7fc97f"/>
<text class="gr" x="250" y="292">progress: 97% true, 5% false (up-left)</text>
<circle cx="330" cy="122" r="6" fill="#e57373"/>
<text class="r" x="420" y="62">not progress: 97% true, 12% false</text>
<text class="m" x="420" y="82">(slid along the curve)</text>
<text class="m" x="24" y="378">Only curve moves count in the review. Turning the strictness knob buys safety with usefulness.</text></svg>
