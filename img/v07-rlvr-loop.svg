<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="760" fill="#0b0b0c"/>

  <!-- prompt -->
  <rect x="340" y="24" width="280" height="84" rx="22" fill="#e8a13d"/>
  <text x="480" y="78" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="600" letter-spacing="2">PROMPT</text>
  <text x="480" y="136" text-anchor="middle" fill="#9a9a9e" font-size="22">one math or code problem</text>

  <!-- arrow to policy -->
  <line x1="480" y1="146" x2="480" y2="188" stroke="#8a8a8e" stroke-width="4"/>
  <polygon points="480,200 466,184 494,184" fill="#8a8a8e"/>

  <!-- policy row -->
  <rect x="70" y="204" width="240" height="120" rx="18" fill="#1f9e9e"/>
  <text x="190" y="258" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="600">CORRECT</text>
  <text x="190" y="294" text-anchor="middle" fill="#e8f6f6" font-size="20">trace A</text>

  <rect x="360" y="204" width="240" height="120" rx="18" fill="#1f9e9e"/>
  <text x="480" y="258" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="600">CORRECT</text>
  <text x="480" y="294" text-anchor="middle" fill="#e8f6f6" font-size="20">trace B</text>

  <rect x="650" y="204" width="240" height="120" rx="18" fill="#e05757"/>
  <text x="770" y="258" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="600">WRONG</text>
  <text x="770" y="294" text-anchor="middle" fill="#fbe9e9" font-size="20">trace C</text>

  <text x="480" y="352" text-anchor="middle" fill="#9a9a9e" font-size="22">the policy samples completions; no human labels involved</text>

  <!-- arrows into verifier -->
  <line x1="190" y1="364" x2="330" y2="412" stroke="#8a8a8e" stroke-width="3"/>
  <line x1="480" y1="364" x2="480" y2="408" stroke="#8a8a8e" stroke-width="3"/>
  <line x1="770" y1="364" x2="630" y2="412" stroke="#8a8a8e" stroke-width="3"/>

  <!-- verifier -->
  <rect x="300" y="416" width="360" height="96" rx="20" fill="#3d3d42"/>
  <text x="480" y="458" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="600" letter-spacing="2">VERIFIER</text>
  <text x="480" y="492" text-anchor="middle" fill="#c9c9cc" font-size="21">answer matches? tests pass?</text>

  <!-- score badges -->
  <rect x="110" y="540" width="160" height="52" rx="26" fill="#1f9e9e"/>
  <text x="190" y="575" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">reward = 1</text>
  <rect x="400" y="540" width="160" height="52" rx="26" fill="#1f9e9e"/>
  <text x="480" y="575" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">reward = 1</text>
  <rect x="690" y="540" width="160" height="52" rx="26" fill="#e05757"/>
  <text x="770" y="575" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">reward = 0</text>

  <!-- update arrows -->
  <line x1="190" y1="604" x2="190" y2="648" stroke="#1f9e9e" stroke-width="5"/>
  <polygon points="190,662 176,646 204,646" fill="#1f9e9e"/>
  <line x1="480" y1="604" x2="480" y2="648" stroke="#1f9e9e" stroke-width="5"/>
  <polygon points="480,662 466,646 494,646" fill="#1f9e9e"/>
  <line x1="770" y1="604" x2="770" y2="648" stroke="#e05757" stroke-width="5"/>
  <polygon points="770,662 756,646 784,646" fill="#e05757"/>

  <text x="190" y="702" text-anchor="middle" fill="#1f9e9e" font-size="24" font-weight="600">push trace A up</text>
  <text x="480" y="702" text-anchor="middle" fill="#1f9e9e" font-size="24" font-weight="600">push trace B up</text>
  <text x="770" y="702" text-anchor="middle" fill="#e05757" font-size="24" font-weight="600">push trace C down</text>
  <text x="480" y="736" text-anchor="middle" fill="#9a9a9e" font-size="20">the clipped update re-weights traces; no reward model, no critic, no labelers</text>
</svg>
