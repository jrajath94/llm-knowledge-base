<svg xmlns='http://www.w3.org/2000/svg' width='760' height='380' viewBox='0 0 760 380' font-family='DejaVu Sans'>
<rect width='760' height='380' fill='#0a0a0a'/>
<text x='380' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>Backpropagation by hand: one chain, forward then reverse</text>
<rect x='90' y='100' width='130' height='70' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='155' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>affine</text>
<text x='155' y='150' font-size='11' fill='#e8e8e8' text-anchor='middle'>z = Xw</text>
<rect x='250' y='100' width='130' height='70' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='315' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>sigmoid</text>
<text x='315' y='150' font-size='11' fill='#e8e8e8' text-anchor='middle'>p = 1/(1+e^-z)</text>
<rect x='410' y='100' width='130' height='70' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='475' y='128' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>loss</text>
<text x='475' y='150' font-size='11' fill='#e8e8e8' text-anchor='middle'>BCE(p, y)</text>
<line x1='220' y1='135' x2='250' y2='135' stroke='#7fd08a' stroke-width='2'/>
<polygon points='250,135 242,131.5 242,138.5' fill='#7fd08a'/>
<line x1='380' y1='135' x2='410' y2='135' stroke='#7fd08a' stroke-width='2'/>
<polygon points='410,135 402,131.5 402,138.5' fill='#7fd08a'/>
<line x1='690' y1='200' x2='120' y2='200' stroke='#f0b429' stroke-width='2.5'/>
<polygon points='120,200 132,196 132,204' fill='#f0b429'/>
<text x='380' y='220' font-size='12' fill='#7fd08a' text-anchor='middle'>FORWARD: compute each op in order</text>
<text x='380' y='245' font-size='12' fill='#f0b429' text-anchor='middle'>BACKWARD: multiply each local gradient in reverse order</text>
<text x='380' y='300' font-size='12' fill='#9a9a9a' text-anchor='middle'>Binary cross-entropy gradient: X^T(p - y)/n, the core interview gradient.</text>
<text x='380' y='325' font-size='12' fill='#9a9a9a' text-anchor='middle'>Two classic bug sites: a missing constant (2/n) and a broadcasting shape mismatch.</text>
</svg>