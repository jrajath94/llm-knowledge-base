<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Loss landscape with a gradient descent path rolling into a valley">
<rect width="720" height="400" fill="#ffffff"/>
<style>text{font-family:Georgia,'Times New Roman',serif;fill:#1a1a1a} .lbl{font-size:17px} .sm{font-size:14px;fill:#444} .num{font-size:16px;font-weight:bold} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:#1a1a1a}</style>
<text x="360" y="32" text-anchor="middle" class="lbl" font-weight="bold">The loss landscape: training walks downhill</text><ellipse cx="330" cy="215" rx="190" ry="118" fill="none" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="330" cy="215" rx="150" ry="93" fill="none" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="330" cy="215" rx="112" ry="69" fill="none" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="330" cy="215" rx="76" ry="47" fill="none" stroke="#93c5fd" stroke-width="2"/><ellipse cx="330" cy="215" rx="42" ry="26" fill="none" stroke="#93c5fd" stroke-width="2"/><text x="120" y="90" class="sm">high loss</text><text x="300" y="221" class="sm">low loss valley</text><circle cx="505" cy="95" r="6" fill="#dc2626"/><circle cx="470" cy="120" r="4.5" fill="#dc2626" opacity="0.85"/><line x1="505" y1="95" x2="470" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/><circle cx="430" cy="150" r="4.5" fill="#dc2626" opacity="0.85"/><line x1="470" y1="120" x2="430" y2="150" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/><circle cx="395" cy="180" r="4.5" fill="#dc2626" opacity="0.85"/><line x1="430" y1="150" x2="395" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/><circle cx="365" cy="205" r="4.5" fill="#dc2626" opacity="0.85"/><line x1="395" y1="180" x2="365" y2="205" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/><circle cx="345" cy="222" r="4.5" fill="#dc2626" opacity="0.85"/><line x1="365" y1="205" x2="345" y2="222" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/><text x="540" y="90" class="sm">start: random weights</text><circle cx="296" cy="153" r="5" fill="#d97706"/><text x="308" y="157" class="sm" fill="#d97706">minimum</text><text x="360" y="350" text-anchor="middle" class="mono">each point = one full setting of all weights; height = loss</text><text x="360" y="376" text-anchor="middle" class="sm">the gradient points downhill; the optimizer steps that way (Chapters 4-6)</text></svg>