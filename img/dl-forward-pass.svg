<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Forward pass through a 3-2-1 network with worked numbers">
<rect width="760" height="440" fill="#ffffff"/>
<style>text{font-family:Georgia,'Times New Roman',serif;fill:#1a1a1a} .lbl{font-size:17px} .sm{font-size:14px;fill:#444} .num{font-size:16px;font-weight:bold} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;fill:#1a1a1a}</style>
<text x="380" y="32" text-anchor="middle" class="lbl" font-weight="bold">Forward pass: input -&gt; hidden layer -&gt; output</text><circle cx="100" cy="120" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="100" y="126" text-anchor="middle" class="num">1.0</text><circle cx="100" cy="210" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="100" y="216" text-anchor="middle" class="num">0.5</text><circle cx="100" cy="300" r="30" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="100" y="306" text-anchor="middle" class="num">-1.0</text><text x="100" y="370" text-anchor="middle" class="sm">input x</text><line x1="132" y1="120" x2="328" y2="165" stroke="#94a3b8" stroke-width="1.4"/><line x1="132" y1="210" x2="328" y2="165" stroke="#94a3b8" stroke-width="1.4"/><line x1="132" y1="300" x2="328" y2="165" stroke="#94a3b8" stroke-width="1.4"/><circle cx="360" cy="165" r="34" fill="#fff7e6" stroke="#d97706" stroke-width="2.5"/><text x="360" y="163" text-anchor="middle" class="sm">h1</text><text x="360" y="185" text-anchor="middle" class="num">0.2</text><line x1="132" y1="120" x2="328" y2="255" stroke="#94a3b8" stroke-width="1.4"/><line x1="132" y1="210" x2="328" y2="255" stroke="#94a3b8" stroke-width="1.4"/><line x1="132" y1="300" x2="328" y2="255" stroke="#94a3b8" stroke-width="1.4"/><circle cx="360" cy="255" r="34" fill="#fff7e6" stroke="#d97706" stroke-width="2.5"/><text x="360" y="253" text-anchor="middle" class="sm">h2</text><text x="360" y="275" text-anchor="middle" class="num">0.7</text><text x="360" y="370" text-anchor="middle" class="sm">hidden: z = Wx + b, ReLU</text><text x="250" y="96" text-anchor="middle" class="sm">W1 row 1 = [0.5, -0.2, 0.3], b = 0.1 -&gt; z = 0.2</text><text x="250" y="350" text-anchor="middle" class="sm">W1 row 2 = [0.1, 0.4, -0.5], b = -0.1 -&gt; z = 0.7</text><line x1="396" y1="165" x2="594" y2="210" stroke="#94a3b8" stroke-width="1.6"/><line x1="396" y1="255" x2="594" y2="210" stroke="#94a3b8" stroke-width="1.6"/><circle cx="630" cy="210" r="36" fill="#e6f7f3" stroke="#0d9488" stroke-width="2.5"/><text x="630" y="204" text-anchor="middle" class="sm">out</text><text x="630" y="226" text-anchor="middle" class="num">0.6</text><text x="630" y="370" text-anchor="middle" class="sm">output</text><text x="500" y="130" text-anchor="middle" class="sm">W2 = [0.9, 0.6], b = 0</text><text x="500" y="152" text-anchor="middle" class="sm">z = 0.9(0.2)+0.6(0.7) = 0.6</text><text x="380" y="408" text-anchor="middle" class="sm">one layer = one matrix multiply; the forward pass chains them</text></svg>