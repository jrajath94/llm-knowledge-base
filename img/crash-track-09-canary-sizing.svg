<svg xmlns="http://www.w3.org/2000/svg" width="560" height="310" viewBox="0 0 560 310">
<rect width="560" height="310" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Canary math: detection takes hours, not minutes</text><text x='60' y='100' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>5% of 10,000 req/h = 500 req/h in the canary</text><text x='60' y='130' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>need 2,000-5,000 samples to tell 1% from 2%</text><text x='60' y='175' font-family='Charis SIL, Georgia, serif' font-size='15' fill='#f0b429' text-anchor='start' font-weight='bold'>500 req/h  ->  several hours</text><text x='60' y='205' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#9a9a9a' text-anchor='start'>1% canary ->  a day or more</text><text x='60' y='230' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='start'>20% canary -> about an hour, but 4x the exposed users</text><text x='20' y='280' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Shrink the canary and detection slows. Grow it and exposure grows.</text></svg>