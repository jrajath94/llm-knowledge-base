<text x="381.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 3</text>
<text x="381.0" y="167.0" font-size="11" fill="#a8a8a8" text-anchor="middle">16k tokens</text>
<rect x="436" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="484.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 4</text>
<text x="484.0" y="167.0" font-size="11" fill="#a8a8a8" text-anchor="middle">16k tokens</text>
<rect x="539" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="587.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 5</text>
<text x="587.0" y="167.0" font-size="11" fill="#a8a8a8" text-anchor="middle">16k tokens</text>
<rect x="642" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="690.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 6</text>
<text x="690.0" y="167.0" font-size="11" fill="#a8a8a8" text-anchor="middle">16k tokens</text>
<rect x="745" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="793.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 7</text>
