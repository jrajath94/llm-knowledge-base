<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Sequence parallelism: cut the sequence itself</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">128k tokens across 8 GPUs: 16k each. The only strategy that shards a single long document</text>
<text x="24" y="94" font-size="13" fill="#a8a8a8" text-anchor="start">one 128k-token document</text>
<rect x="24" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="72.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 0</text>
<text x="72.0" y="167.0" font-size="11" fill="#a8a8a8" text-anchor="middle">16k tokens</text>
<rect x="127" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
<text x="175.0" y="145.0" font-size="12" font-weight="bold" fill="#ececec" text-anchor="middle">GPU 1</text>
<text x="175.0" y="167.0" font-size="11" fill="#a8a8a8" text-anchor="middle">16k tokens</text>
<rect x="230" y="108" width="96" height="90" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6"/>
