<line x1="448" y1="208" x2="448" y2="236" stroke="#f0b429" stroke-width="2"/>
<polygon points="448,236 444.33015592246386,227.78219953718923 451.66984407753614,227.78219953718923" fill="#f0b429"/>
<text x="448.0" y="214.0" font-size="11" fill="#f0b429" text-anchor="middle">attention needs keys/values from other GPUs</text>
<rect x="24" y="248" width="400" height="90" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6"/>
<text x="224.0" y="285.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">DeepSpeed-Ulysses</text>
<text x="224.0" y="307.0" font-size="11" fill="#a8a8a8" text-anchor="middle">2 all-to-alls per layer: flip sequence-sharded &lt;-&gt; head-sharded</text>
<rect x="456" y="248" width="400" height="90" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6"/>
<text x="656.0" y="285.0" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">Ring attention</text>
<text x="656.0" y="307.0" font-size="11" fill="#a8a8a8" text-anchor="middle">pass K/V blocks around a ring; comm overlaps compute</text>
<text x="24" y="364" font-size="13" fill="#f0b429" text-anchor="start">Stack with flash attention (removes the s^2 term) and checkpointing. No single trick suffices at 128k.</text>
</svg>