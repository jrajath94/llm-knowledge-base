<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="620" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">When DPO works, and when it does not</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">The default first try, and the three exits</text>
<rect x="24" y="84" width="420" height="440" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="234" y="118" font-size="16" font-weight="bold" fill="#4fd1a5" text-anchor="middle">DPO shines</text>
<text x="48" y="156" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">Clean preference data</text>
<text x="48" y="176" font-size="11" fill="#a8a8a8" text-anchor="start">no uncertainty model in the loss</text>
<text x="48" y="238" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">On-policy-ish pairs</text>
<text x="48" y="258" font-size="11" fill="#a8a8a8" text-anchor="start">compared responses from near the reference</text>
<text x="48" y="320" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">Single-turn judgment</text>
<text x="48" y="340" font-size="11" fill="#a8a8a8" text-anchor="start">tone, helpfulness, style, which-of-two</text>
<text x="48" y="402" font-size="13" font-weight="bold" fill="#4fd1a5" text-anchor="start">Verdict</text>
<text x="48" y="422" font-size="11" fill="#a8a8a8" text-anchor="start">simpler, more stable, cheaper than PPO</text>
<rect x="456" y="84" width="420" height="440" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="666" y="118" font-size="16" font-weight="bold" fill="#e57ea6" text-anchor="middle">DPO struggles</text>
<text x="480" y="144" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="start">Noisy labels</text>
<text x="480" y="164" font-size="11" fill="#a8a8a8" text-anchor="start">gradient weight is largest exactly when the</text>
<text x="480" y="181" font-size="11" fill="#a8a8a8" text-anchor="start">model disagrees with the label, which is</text>
<text x="480" y="198" font-size="11" fill="#a8a8a8" text-anchor="start">also when the label is most likely wrong.</text>
<text x="480" y="215" font-size="11" fill="#a8a8a8" text-anchor="start">PPO&#x27;s reward model averages noise first.</text>
<text x="480" y="238" font-size="11" fill="#f0b429" text-anchor="start">Fix: try PPO</text>
<text x="480" y="282" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="start">Distribution shift</text>
<text x="480" y="302" font-size="11" fill="#a8a8a8" text-anchor="start">offline on fixed pairs; the implicit reward</text>
<text x="480" y="319" font-size="11" fill="#a8a8a8" text-anchor="start">extrapolates badly far from the pair</text>
<text x="480" y="336" font-size="11" fill="#a8a8a8" text-anchor="start">distribution.</text>
<text x="480" y="359" font-size="11" fill="#f0b429" text-anchor="start">Fix: iterative DPO: re-sample, re-label, repeat</text>
<text x="480" y="403" font-size="13" font-weight="bold" fill="#e57ea6" text-anchor="start">Reasoning tasks</text>
<text x="480" y="423" font-size="11" fill="#a8a8a8" text-anchor="start">one preference judgment is a weak signal</text>
<text x="480" y="440" font-size="11" fill="#a8a8a8" text-anchor="start">next to right-or-wrong.</text>
<text x="480" y="463" font-size="11" fill="#f0b429" text-anchor="start">Fix: verifiable rewards (Ch 6)</text>
</svg>