<text x='320' y='325' font-size='12' fill='#9a9a9a' text-anchor='middle'>shuffled diffs (the null world)</text>
<text x='360' y='385' font-size='12' fill='#9a9a9a' text-anchor='middle'>If the observed diff sits far out, the effect is real. No scipy needed.</text>
