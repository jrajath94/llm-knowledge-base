<text x='140' y='108' font-size='12' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>observed diff</text>
<text x='140' y='132' font-size='12' fill='#e8e8e8' text-anchor='middle'>mean(A) - mean(B)</text>
<line x1='230' y1='125' x2='290' y2='125' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='290,125 282,121.5 282,128.5' fill='#e8e8e8'/>
