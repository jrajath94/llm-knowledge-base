<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='100%' role='img'>
<title>Hardening staircase</title>
<text x='480' y='44' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='21' font-weight='600' fill='#ececec' text-anchor='middle'>The prototype-to-production chasm: the hardening staircase</text>
<text x='480' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Demos die on real data. Work this list between prototype and pilot; every unchecked box is a future incident.</text>
<rect x='60' y='330' width='150' height='52' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/>
<text x='135' y='356' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Dirty-data pass</text>
<text x='135' y='376' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>500 real docs</text>
<line x1='210' y1='356' x2='228' y2='296' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='229.2,304.9 228,296 222.1,302.8' fill='#8a8a8a'/>
<rect x='228' y='270' width='150' height='52' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/>
<text x='303' y='296' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Input limits</text>
<text x='303' y='316' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>timeouts, max sizes</text>
<line x1='378' y1='296' x2='396' y2='236' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='397.2,244.9 396,236 390.1,242.8' fill='#8a8a8a'/>
<rect x='396' y='210' width='150' height='52' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/>
<text x='471' y='236' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Permission checks</text>
<text x='471' y='256' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>retrieval filters by user</text>
<line x1='546' y1='236' x2='564' y2='176' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='565.2,184.9 564,176 558.1,182.8' fill='#8a8a8a'/>
<rect x='564' y='150' width='150' height='52' rx='10' fill='#8e24aa' fill-opacity='0.22' stroke='#8e24aa' stroke-width='2'/>
<text x='639' y='176' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Auth + secrets</text>
<text x='639' y='196' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>no keys in code or logs</text>
<line x1='714' y1='176' x2='732' y2='116' stroke='#8a8a8a' stroke-width='2'/>
<polygon points='733.2,124.9 732,116 726.1,122.8' fill='#8a8a8a'/>
<rect x='732' y='90' width='150' height='52' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/>
<text x='807' y='116' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>Evals on real traffic</text>
<text x='807' y='136' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>acceptance bar re-run</text>
<text x='480' y='430' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>Takeaway: hardening is not a phase. It is the climb from demo to production, one gate at a time.</text>
</svg>