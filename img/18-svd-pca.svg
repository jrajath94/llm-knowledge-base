<svg xmlns='http://www.w3.org/2000/svg' width='760' height='420' viewBox='0 0 760 420' font-family='DejaVu Sans'>
<rect width='760' height='420' fill='#0a0a0a'/>
<text x='380' y='34' font-size='14' fill='#e8e8e8' text-anchor='middle' font-weight='bold'>SVD is PCA: center X, decompose, keep the top-k columns of V</text>
<rect x='40' y='90' width='130' height='170' rx='8' fill='none' stroke='#8fc7ff' stroke-width='1.5'/>
<text x='105' y='150' font-size='16' fill='#8fc7ff' text-anchor='middle' font-weight='bold'>X</text>
<text x='105' y='172' font-size='11' fill='#9a9a9a' text-anchor='middle'>(n x d)</text>
<text x='105' y='190' font-size='11' fill='#9a9a9a' text-anchor='middle'>centered</text>
<text x='195' y='180' font-size='20' fill='#e8e8e8' text-anchor='middle'>=</text>
<rect x='220' y='90' width='90' height='170' rx='8' fill='none' stroke='#7fd08a' stroke-width='1.5'/>
<text x='265' y='150' font-size='16' fill='#7fd08a' text-anchor='middle' font-weight='bold'>U</text>
<text x='265' y='172' font-size='11' fill='#9a9a9a' text-anchor='middle'>(n x d)</text>
<rect x='330' y='120' width='60' height='110' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/>
<text x='360' y='165' font-size='16' fill='#f0b429' text-anchor='middle' font-weight='bold'>S</text>
<text x='360' y='187' font-size='11' fill='#9a9a9a' text-anchor='middle'>(d x d)</text>
<rect x='410' y='90' width='130' height='170' rx='8' fill='none' stroke='#ff7b8a' stroke-width='1.5'/>
<text x='475' y='150' font-size='16' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>V^T</text>
<text x='475' y='172' font-size='11' fill='#9a9a9a' text-anchor='middle'>(d x d)</text>
<text x='475' y='205' font-size='11' fill='#ff7b8a' text-anchor='middle'>principal</text>
<text x='475' y='222' font-size='11' fill='#ff7b8a' text-anchor='middle'>directions</text>
<line x1='540' y1='175' x2='610' y2='175' stroke='#e8e8e8' stroke-width='2'/>
<polygon points='610,175 602,171.5 602,178.5' fill='#e8e8e8'/>
<rect x='610' y='130' width='110' height='90' rx='8' fill='none' stroke='#ff7b8a' stroke-width='1.5'/>
<text x='665' y='160' font-size='13' fill='#ff7b8a' text-anchor='middle' font-weight='bold'>top-k</text>
<text x='665' y='182' font-size='12' fill='#e8e8e8' text-anchor='middle'>columns of V</text>
<text x='665' y='202' font-size='11' fill='#9a9a9a' text-anchor='middle'>principal dirs</text>
<text x='380' y='310' font-size='12' fill='#9a9a9a' text-anchor='middle'>The singular vectors of centered X are the eigenvectors of the covariance matrix.</text>
<text x='380' y='335' font-size='12' fill='#9a9a9a' text-anchor='middle'>So PCA via SVD and PCA via eigendecomposition agree. SVD is not a black box.</text>
<text x='380' y='380' font-size='12' fill='#9a9a9a' text-anchor='middle'>sigma values in S: the square roots of the covariance eigenvalues.</text>
</svg>