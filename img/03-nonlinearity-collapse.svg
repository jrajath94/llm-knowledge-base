<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><rect x='0' y='0' width='960' height='400' fill='#0d0d0d'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>Depth without nonlinearity is decoration</text><text x='240' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>No kink: two layers collapse into one</text><rect x='110' y='110' width='100' height='70' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='160.0' y='151.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>W1</text><rect x='260' y='110' width='100' height='70' rx='10' fill='#0d0d0d' stroke='#1565c0' stroke-width='2'/><text x='310.0' y='151.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>W2</text><line x1='210' y1='145' x2='260' y2='145' stroke='#1565c0' stroke-width='3'/><polygon points='260.0,145.0 252.3,149.6 252.3,140.4' fill='#1565c0'/><text x='235' y='130' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>x</text><text x='480' y='135' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>y = W2(W1 x) = (W2 W1) x</text><text x='480' y='165' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the product W2 W1 is one matrix</text><rect x='400' y='200' width='160' height='60' rx='10' fill='#0d0d0d' stroke='#8a8a8a' stroke-width='2'/><text x='480.0' y='222.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>one matrix</text><text x='480.0' y='252.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>100 layers = 1</text><text x='240' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>A hundred linear layers have exactly</text><text x='240' y='322' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the expressive power of one.</text><line x1='480' y1='90' x2='480' y2='350' stroke='#3a3a3a' stroke-width='1.5'/><text x='720' y='70' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#a8a8a8' text-anchor='middle'>With kink: depth earns its keep</text><rect x='590' y='110' width='100' height='70' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='640.0' y='151.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>W1</text><rect x='700' y='160' width='60' height='60' rx='10' fill='#0d0d0d' stroke='#f0b429' stroke-width='2'/><text x='730.0' y='196.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#ececec' text-anchor='middle'>ReLU</text><rect x='800' y='110' width='100' height='70' rx='10' fill='#0d0d0d' stroke='#2e9e5b' stroke-width='2'/><text x='850.0' y='151.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>W2</text><line x1='690' y1='145' x2='700' y2='175' stroke='#f0b429' stroke-width='3'/><polygon points='700.0,175.0 693.2,169.2 702.0,166.2' fill='#f0b429'/><line x1='760' y1='190' x2='800' y2='155' stroke='#f0b429' stroke-width='3'/><polygon points='800.0,155.0 797.3,163.6 791.1,156.6' fill='#f0b429'/><text x='720' y='260' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>the bend breaks the collapse</text><text x='720' y='284' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>negatives become zero,</text><text x='720' y='308' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'>positives pass through</text></svg>