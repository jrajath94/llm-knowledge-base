<svg xmlns="http://www.w3.org/2000/svg" width="720" height="455" viewBox="0 0 720 455" role="img" aria-label="Five success metrics with healthy targets">
<rect width="720" height="455" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The role is measured in numbers, not narratives</text>
<rect class="box" x="90" y="58" width="540" height="60" rx="8"/>
<line x1="90" y1="58" x2="90" y2="118" stroke="#f0b429" stroke-width="4"/>
<text x="116" y="82" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">MFU</text>
<text x="116" y="102" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">GPU math efficiency  |  healthy: 50-65% on H100-class</text>
<rect class="box" x="90" y="128" width="540" height="60" rx="8"/>
<line x1="90" y1="128" x2="90" y2="188" stroke="#58a6ff" stroke-width="4"/>
<text x="116" y="152" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Goodput</text>
<text x="116" y="172" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">useful tokens/sec after all overhead  |  healthy: track weekly; trend must not decay</text>
<rect class="box" x="90" y="198" width="540" height="60" rx="8"/>
<line x1="90" y1="198" x2="90" y2="258" stroke="#3fb950" stroke-width="4"/>
<text x="116" y="222" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">MTBF</text>
<text x="116" y="242" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">hours between job failures  |  healthy: ~50 h at 1k GPUs is normal</text>
<rect class="box" x="90" y="268" width="540" height="60" rx="8"/>
<line x1="90" y1="268" x2="90" y2="328" stroke="#e5484d" stroke-width="4"/>
<text x="116" y="292" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Time to recovery</text>
<text x="116" y="312" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">minutes to productive training  |  healthy: under 10 minutes</text>
<rect class="box" x="90" y="338" width="540" height="60" rx="8"/>
<line x1="90" y1="338" x2="90" y2="398" stroke="#8a8a8a" stroke-width="4"/>
<text x="116" y="362" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Effective training time</text>
<text x="116" y="382" text-anchor="start" fill="#a8a8a8" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">fraction of wall clock training  |  healthy: above 90%</text>
<text x="360" y="430" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a run at 60% MFU with constant restarts loses to a 50% run that never stops</text>
</svg>