<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="MoE: the FLOP accounting per token (d = 4096, 8 experts, top-2)"><rect x="22" y="14" width="916" height="194" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">THE MATH</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">y = sum over top-2 of g_i * Expert_i(x), with g = softmax(router scores)</text><text x="38" y="116" font-size="13" font-weight="700" fill="#f0b429">Model</text><text x="303.2" y="116" font-size="13" font-weight="700" fill="#f0b429">Total params</text><text x="509.46666666666664" y="116" font-size="13" font-weight="700" fill="#f0b429">Active per token</text><text x="715.7333333333333" y="116" font-size="13" font-weight="700" fill="#f0b429">Inference cost</text><line x1="38" y1="120" x2="922" y2="120" stroke="#2e2e2e"/><text x="38" y="148" font-size="13" font-weight="700" fill="#ececec">Dense 47B-equivalent</text><text x="303.2" y="148" font-size="13" fill="#a8a8a8">47B</text><text x="509.46666666666664" y="148" font-size="13" fill="#a8a8a8">47B</text><text x="715.7333333333333" y="148" font-size="13" fill="#a8a8a8">~= 47B dense model</text><line x1="38" y1="160" x2="922" y2="160" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="188" font-size="13" font-weight="700" fill="#ececec">Mixtral MoE</text><text x="303.2" y="188" font-size="13" fill="#a8a8a8">46.7B</text><text x="509.46666666666664" y="188" font-size="13" fill="#a8a8a8">~12.9B (2 of 8 experts)</text><text x="715.7333333333333" y="188" font-size="13" fill="#a8a8a8">~= 13B dense;</text><text x="715.7333333333333" y="208" font-size="13" fill="#a8a8a8">capacity ~= 47B dense</text><line x1="38" y1="220" x2="922" y2="220" stroke="#2e2e2e" stroke-opacity="0.5"/></svg>