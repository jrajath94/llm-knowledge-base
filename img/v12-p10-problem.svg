<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 202" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Paper 10: the problem DPO solved"><rect x="22" y="14" width="435.0" height="174" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e07878">BEFORE</text><text x="38" y="64" font-size="15" font-weight="700" fill="#ececec">RLHF works but is painful to run</text><circle cx="44" cy="83.5" r="3.2" fill="#e07878"/><text x="56" y="88" font-size="13.5" fill="#a8a8a8">SFT, rankings, reward model, then finicky PPO</text><text x="56" y="106" font-size="13.5" fill="#a8a8a8">with KL tuning and value networks</text><circle cx="44" cy="127.5" r="3.2" fill="#e07878"/><text x="56" y="132" font-size="13.5" fill="#a8a8a8">each stage fails independently; the reward</text><text x="56" y="150" font-size="13.5" fill="#a8a8a8">model must stay calibrated</text><rect x="503.0" y="14" width="435.0" height="174" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="519.0" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">THE QUESTION</text><text x="519.0" y="64" font-size="15" font-weight="700" fill="#ececec">The KL-constrained RL objective has a</text><text x="519.0" y="84" font-size="15" font-weight="700" fill="#ececec">closed-form optimal policy. Can we skip</text><text x="519.0" y="104" font-size="15" font-weight="700" fill="#ececec">the reward model and the RL, and</text><text x="519.0" y="124" font-size="15" font-weight="700" fill="#ececec">optimize the policy directly on</text><text x="519.0" y="144" font-size="15" font-weight="700" fill="#ececec">preferences?</text><line x1="467.0" y1="101.0" x2="487.0" y2="101.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="487.0,96.0 495.0,101.0 487.0,106.0" fill="#a8a8a8"/></svg>