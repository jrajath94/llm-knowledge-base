<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="One enforceable system of contracts"><rect x="22" y="14" width="916" height="268" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6cb2ff">RELIABILITY CONTRACTS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">&quot;The model is good&quot; is not a contract. Written promises with measurements are.</text><rect x="38" y="96" width="220.48689999999996" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Budget</text><text x="54" y="144" font-size="12" fill="#a8a8a8">how much failure is</text><text x="54" y="160" font-size="12" fill="#a8a8a8">allowed: the error budget</text><line x1="268.4869" y1="136.0" x2="282.4869" y2="136.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="282.4869,131.0 290.4869,136.0 282.4869,141.0" fill="#a8a8a8"/><rect x="298.4869" y="96" width="225.38537499999998" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="318.4869" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="318.4869" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">2</text><text x="338.4869" y="123" font-size="13.5" font-weight="700" fill="#ececec">Verification</text><text x="314.4869" y="144" font-size="12" fill="#a8a8a8">how you prove it: evals as</text><text x="314.4869" y="160" font-size="12" fill="#a8a8a8">contracts</text><line x1="533.872275" y1="136.0" x2="547.872275" y2="136.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="547.872275,131.0 555.872275,136.0 547.872275,141.0" fill="#a8a8a8"/><rect x="563.872275" y="96" width="185.76835" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="583.872275" cy="118" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="583.872275" y="123" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">3</text><text x="603.872275" y="123" font-size="13.5" font-weight="700" fill="#ececec">Evidence</text><text x="579.872275" y="144" font-size="12" fill="#a8a8a8">traces: the proof per</text><text x="579.872275" y="160" font-size="12" fill="#a8a8a8">request</text><rect x="38" y="200" width="177.47368749999998" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="222" r="11" fill="#6cb2ff" fill-opacity="0.18" stroke="#6cb2ff"/><text x="58" y="227" font-size="13" font-weight="700" fill="#6cb2ff" text-anchor="middle">4</text><text x="78" y="227" font-size="13.5" font-weight="700" fill="#ececec">Replay</text><text x="54" y="248" font-size="12" fill="#a8a8a8">reproduce any past</text><text x="54" y="264" font-size="12" fill="#a8a8a8">decision</text></svg>