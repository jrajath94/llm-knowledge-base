<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 3.2. Cost per successful outcome: $3.95 / 0.92 = $4.29</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">divide by the success rate, not by the attempt count</text>
<rect x="120" y="150" width="600" height="56" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="6" opacity="1"/>
<text x="136" y="185" font-size="13" fill="#ececec" text-anchor="start">cost per attempt: $3.95</text>
<rect x="120" y="240" width="552.0" height="56" fill="#6cb2ff" rx="6" opacity="0.85"/>
<text x="136" y="275" font-size="13" font-weight="bold" fill="#0b0e13" text-anchor="start">success rate: 92%</text>
<text x="120" y="350" font-size="15" font-weight="bold" fill="#f0b429" text-anchor="start">cost per SUCCESS: $3.95 / 0.92 = $4.29</text>
<text x="24" y="400" font-size="12" fill="#a8a8a8" text-anchor="start">The attempt cost flatters; the success cost tells the truth. A cheap attempt with a 50% success rate costs</text>
<text x="24" y="418" font-size="12" fill="#a8a8a8" text-anchor="start">double per outcome.</text>
<text x="24" y="460" font-size="12" fill="#a8a8a8" text-anchor="start">Quote per successful outcome in every business case. The CFO will ask; have the number ready.</text>
</svg>