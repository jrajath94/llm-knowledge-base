<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 500' role='img'><rect x='0' y='0' width='880' height='500' fill='#0d0d0d' rx='8'/><text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>The Chinchilla ratio: about 20 tokens per parameter</text><text x='24' y='60' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#8a8a8a'>same compute, different split. the balanced split wins</text><rect x='60' y='100' width='360' height='150' fill='#1c1212' stroke='#e57373' stroke-width='2' rx='6'/><text x='240.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' fill='#ececec' text-anchor='middle'>Gopher</text><text x='240.0' y='185.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>280B params, 300B tokens</text><rect x='460' y='100' width='360' height='150' fill='#0f1c12' stroke='#7fd08a' stroke-width='2' rx='6'/><text x='640.0' y='165.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' fill='#ececec' text-anchor='middle'>Chinchilla</text><text x='640.0' y='185.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>70B params, 1.4T tokens</text><text x='24' y='296' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='start'>tokens per parameter</text><text x='24' y='332' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Gopher</text><rect x='160' y='316' width='31' height='32' fill='#e57373' rx='4'/><text x='201.12727272727273' y='338' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#e57373' text-anchor='start'>1.07</text><text x='24' y='392' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>Chinchilla</text><rect x='160' y='376' width='582' height='32' fill='#7fd08a' rx='4'/><text x='751.8181818181819' y='398' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#7fd08a' text-anchor='start'>20</text><text x='160' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='400' fill='#8a8a8a' text-anchor='start'>1 token / param</text><text x='800' y='440' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='400' fill='#8a8a8a' text-anchor='end'>22</text><text x='460' y='290' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#8a8a8a' text-anchor='middle'>Chinchilla won at equal compute despite being 4x smaller.</text></svg>