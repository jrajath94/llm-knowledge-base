<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="Mixed-data recipe for safety without collapse">
<rect width="720" height="410" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">The mixed-data recipe that holds both sides</text>
<rect class="box" x="90" y="60" width="540" height="58" rx="8"/>
<line x1="90" y1="60" x2="90" y2="118" stroke="#f0b429" stroke-width="4"/>
<text x="116" y="84" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">safety data: 5-15%</text>
<text x="116" y="104" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">enough to learn, never a majority</text>
<rect class="box" x="90" y="130" width="540" height="58" rx="8"/>
<line x1="90" y1="130" x2="90" y2="188" stroke="#58a6ff" stroke-width="4"/>
<text x="116" y="154" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">paired refusal + compliance</text>
<text x="116" y="174" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">every refusal paired with a close allowed twin</text>
<rect class="box" x="90" y="200" width="540" height="58" rx="8"/>
<line x1="90" y1="200" x2="90" y2="258" stroke="#3fb950" stroke-width="4"/>
<text x="116" y="224" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">capability data in every batch</text>
<text x="116" y="244" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">reasoning, coding, math stay mixed in</text>
<rect class="box" x="90" y="270" width="540" height="58" rx="8"/>
<line x1="90" y1="270" x2="90" y2="328" stroke="#8a8a8a" stroke-width="4"/>
<text x="116" y="294" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">fixed probe sets, tracked weekly</text>
<text x="116" y="314" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">refusal rate and false-refusal rate</text>
<text x="360" y="365" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">four numbers every week: refusal rate, false-refusal rate, capability scores, overoptimization gap</text>
<text x="360" y="387" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a safety gain that costs capability is a loss. The recipe keeps both visible.</text>
</svg>