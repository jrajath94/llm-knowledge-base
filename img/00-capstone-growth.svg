<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 460' width='100%' role='img'><text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec' text-anchor='start'>The capstone: one tiny LLM grown volume by volume</text><text x='20' y='52' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>Same model, every volume adds a layer. By Volume 8 you trained, aligned, and served it.</text><rect x='20' y='90' width='140' height='190' rx='10' fill='#1565c0' fill-opacity='0.18' stroke='#1565c0' stroke-width='2'/><text x='90.0' y='124' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 1</text><text x='90.0' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Autograd from</text><text x='90.0' y='172' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>scratch in NumPy</text><text x='90.0' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'></text><rect x='168' y='90' width='140' height='190' rx='10' fill='#f0b429' fill-opacity='0.18' stroke='#f0b429' stroke-width='2'/><text x='238.0' y='124' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 4</text><text x='238.0' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec