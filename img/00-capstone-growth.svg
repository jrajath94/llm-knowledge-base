ica,Arial,sans-serif' font-size='19' font-weight='600' fill='#ececec' text-anchor='middle'>Vol 8</text><text x='830.0' y='152' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>Serve with KV</text><text x='830.0' y='172' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#ececec' text-anchor='middle'>cache + quantize</text><text x='830.0' y='210' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='middle'></text><line x1='754' y1='185.0' x2='758' y2='185.0' stroke='#f0b429' stroke-width='3'/><polygon points='758,185.0 749,180.0 749,190.0' fill='#f0b429'/><text x='20' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='start'>What accumulates:</text><rect x='20' y='345' width='140' height='52' rx='9' fill='#0d0d0d' stroke='#1565c0' stroke-width='1.5'/><text x='90' y='377' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>differentiable code</text><rect x='170' y='345' width='140' height='52' rx='9' fill='#0d0d0d' stroke='#f0b429' stroke-width='1.5'/><text x='240' y='377' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>+ attention</text><rect x='320' y='345' width='140' height='52' rx='9' fill='#0d0d0d' stroke='#2e7d32' stroke-width='1.5'/><text x='390' y='377' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#a8a8a8' text-anchor='middle'>+ learned weights</text><rect 