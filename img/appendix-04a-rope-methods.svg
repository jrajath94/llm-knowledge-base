<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 460' width='100%' role='img' aria-label='Three ways to stretch RoPE past its training length'>
<rect x='0' y='0' width='960' height='460' fill='#0d0d0d'/>
<text x='24' y='36' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>Three ways to stretch RoPE past its training length</text>
<rect x='24' y='76' width='912' height='96' rx='10' fill='#141414' stroke='#6cb2ff' stroke-width='2'/>
<text x='48' y='112' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#6cb2ff' text-anchor='start'>Position interpolation (PI)</text>
<text x='48' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>changes: divide every position index by s</text>
<text x='48' y='162' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>effect: blurs high frequencies</text>
<rect x='24' y='188' width='912' height='96' rx='10' fill='#141414' stroke='#f0b429' stroke-width='2'/>
<text x='48' y='224' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#f0b429' text-anchor='start'>NTK-aware scaling</text>
<text x='48' y='252' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>changes: raise the RoPE base: b' = b * s^(D/(D-2))</text>
<text x='48' y='274' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>effect: protects high frequencies</text>
<rect x='24' y='300' width='912' height='96' rx='10' fill='#141414' stroke='#7fd08a' stroke-width='2'/>
<text x='48' y='336' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#7fd08a' text-anchor='start'>YaRN</text>
<text x='48' y='364' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#ececec' text-anchor='start'>changes: per-dimension ramps + temperature 1/t = 0.1 ln s + 1</text>
<text x='48' y='386' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#a8a8a8' text-anchor='start'>effect: sharpens flat attention</text>
<text x='24' y='428' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='start'>All three make positions beyond L look familiar again, without retraining the model from scratch.</text>
</svg>
