<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="Failure taxonomy">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Failure taxonomy</text>
<text x="300" y="58" text-anchor="middle" class="xs">Classify first. The class decides the action.</text>
<rect x="60" y="95" width="130" height="54" rx="6" fill="#e57373"/>
<text x="125" y="128" text-anchor="middle" class="s b" style="fill:#1a1a1a">STUCK</text>
<text x="210" y="118" class="s">Same action 3+ times, no progress</text>
<text x="210" y="136" class="xs">Never retry. Replan or escalate.</text>
<rect x="60" y="165" width="130" height="54" rx="6" fill="#f0b429"/>
<text x="125" y="198" text-anchor="middle" class="s b" style="fill:#1a1a1a">TRANSIENT</text>
<text x="210" y="188" class="s">Network timeout, rate limit</text>
<text x="210" y="206" class="xs">Retry with backoff.</text>
<rect x="60" y="235" width="130" height="54" rx="6" fill="#6cb2ff"/>
<text x="125" y="268" text-anchor="middle" class="s b" style="fill:#1a1a1a">AGENT ERROR</text>
<text x="210" y="258" class="s">Bad args, wrong tool</text>
<text x="210" y="276" class="xs">One self-correction, then escalate.</text>
<rect x="60" y="305" width="130" height="54" rx="6" fill="#8a8a8a"/>
<text x="125" y="338" text-anchor="middle" class="s b" style="fill:#1a1a1a">UNKNOWN</text>
<text x="210" y="328" class="s">Never seen before</text>
<text x="210" y="346" class="xs">Escalate. Unknown is not retryable.</text>
</svg>
