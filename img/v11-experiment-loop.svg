<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The six-stage experiment loop">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f0b429"/>
    </marker>
  </defs>
  <g font-size="14" text-anchor="middle">
    <rect x="280" y="16" width="120" height="58" rx="10" fill="#101010" stroke="#f0b429" stroke-width="1.5"/>
    <text x="340" y="40" fill="#ececec" font-weight="700">Observe</text>
    <text x="340" y="58" font-size="11" fill="#a8a8a8">notice a failure</text>
    <rect x="470" y="100" width="120" height="58" rx="10" fill="#101010" stroke="#3a3a3a"/>
    <text x="530" y="124" fill="#ececec" font-weight="700">Hypothesize</text>
    <text x="530" y="142" font-size="11" fill="#a8a8a8">if X, then Y, because Z</text>
    <rect x="470" y="286" width="120" height="58" rx="10" fill="#101010" stroke="#3a3a3a"/>
    <text x="530" y="310" fill="#ececec" font-weight="700">Design</text>
    <text x="530" y="328" font-size="11" fill="#a8a8a8">smallest killing test</text>
    <rect x="280" y="370" width="120" height="58" rx="10" fill="#101010" stroke="#3a3a3a"/>
    <text x="340" y="394" fill="#ececec" font-weight="700">Run</text>
    <text x="340" y="412" font-size="11" fill="#a8a8a8">preregistered</text>
    <rect x="90" y="286" width="120" height="58" rx="10" fill="#101010" stroke="#3a3a3a"/>
    <text x="150" y="310" fill="#ececec" font-weight="700">Analyze</text>
    <text x="150" y="328" font-size="11" fill="#a8a8a8">bigger than noise?</text>
    <rect x="90" y="100" width="120" height="58" rx="10" fill="#101010" stroke="#3a3a3a"/>
    <text x="150" y="124" fill="#ececec" font-weight="700">Update</text>
    <text x="150" y="142" font-size="11" fill="#a8a8a8">refine or restart</text>
  </g>
  <g stroke="#f0b429" stroke-width="2" fill="none">
    <path d="M 400 45 Q 460 60 478 100" marker-end="url(#arr3)"/>
    <path d="M 530 158 L 530 280" marker-end="url(#arr3)"/>
    <path d="M 470 315 Q 410 340 402 370" marker-end="url(#arr3)"/>
    <path d="M 280 399 Q 220 380 212 344" marker-end="url(#arr3)"/>
    <path d="M 150 286 L 150 164" marker-end="url(#arr3)"/>
    <path d="M 210 129 Q 270 100 278 74" marker-end="url(#arr3)"/>
  </g>
  <rect x="240" y="196" width="200" height="56" rx="10" fill="#0d0d0d" stroke="#3a3a3a" stroke-dasharray="5 4"/>
  <text x="340" y="219" font-size="12" fill="#a8a8a8" text-anchor="middle">one full turn = one testable claim</text>
  <text x="340" y="239" font-size="12" fill="#a8a8a8" text-anchor="middle">a paper is a few turns, told in order</text>
</svg>
