<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-label="Latency spike diagnosis tree">
  <style>
    .q { fill:#0d0d0d; stroke:#f0b429; stroke-width:1.5; }
    .a { fill:#0d0d0d; stroke:#3a3a3a; stroke-width:1.5; rx:8; }
    .t { font:600 13.5px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#ececec; }
    .s { font:400 12px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#a8a8a8; }
    .ln { stroke:#5a5a5a; stroke-width:1.5; fill:none; }
    .yn { font:700 12px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#f0b429; }
    .yn2 { font:700 12px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#a8a8a8; }
  </style>
  <text class="t" x="20" y="28" style="font-size:15px">Latency spike: check in order, top to bottom</text>

  <polygon class="q" points="360,50 470,95 360,140 250,95"/>
  <text class="t" x="360" y="90" text-anchor="middle">Traffic surge?</text>
  <text class="s" x="360" y="108" text-anchor="middle">RPS vs baseline</text>

  <line class="ln" x1="470" y1="95" x2="600" y2="95"/>
  <text class="yn" x="500" y="88">yes</text>
  <rect class="a" x="600" y="70" width="100" height="50" rx="8"/>
  <text class="s" x="650" y="90" text-anchor="middle">Scale out or</text>
  <text class="s" x="650" y="106" text-anchor="middle">shed load</text>

  <line class="ln" x1="360" y1="140" x2="360" y2="175"/>
  <text class="yn2" x="368" y="162">no</text>
  <polygon class="q" points="360,175 470,220 360,265 250,220"/>
  <text class="t" x="360" y="215" text-anchor="middle">Deploy in last hour?</text>
  <text class="s" x="360" y="233" text-anchor="middle">version markers</text>

  <line class="ln" x1="470" y1="220" x2="600" y2="220"/>
  <text class="yn" x="500" y="213">yes</text>
  <rect class="a" x="600" y="195" width="100" height="50" rx="8"/>
  <text class="s" x="650" y="215" text-anchor="middle">Roll back first,</text>
  <text class="s" x="650" y="231" text-anchor="middle">investigate second</text>

  <line class="ln" x1="360" y1="265" x2="360" y2="300"/>
  <text class="yn2" x="368" y="287">no</text>
  <polygon class="q" points="360,300 470,345 360,390 250,345"/>
  <text class="t" x="360" y="340" text-anchor="middle">Cache hit rate dropped?</text>
  <text class="s" x="360" y="358" text-anchor="middle">prefix cache metrics</text>

  <line class="ln" x1="470" y1="345" x2="600" y2="345"/>
  <text class="yn" x="500" y="338">yes</text>
  <rect class="a" x="600" y="320" width="100" height="50" rx="8"/>
  <text class="s" x="650" y="340" text-anchor="middle">Check prompt</text>
  <text class="s" x="650" y="356" text-anchor="middle">templates, routing</text>

  <line class="ln" x1="360" y1="390" x2="360" y2="425"/>
  <text class="yn2" x="368" y="412">no</text>
  <polygon class="q" points="360,425 470,470 360,515 250,470"/>
  <text class="t" x="360" y="465" text-anchor="middle">Preemptions rising?</text>
  <text class="s" x="360" y="483" text-anchor="middle">scheduler metrics</text>

  <line class="ln" x1="470" y1="470" x2="600" y2="470"/>
  <text class="yn" x="500" y="463">yes</text>
  <rect class="a" x="600" y="445" width="100" height="50" rx="8"/>
  <text class="s" x="650" y="465" text-anchor="middle">Cut admission,</text>
  <text class="s" x="650" y="481" text-anchor="middle">quantize KV</text>

  <line class="ln" x1="360" y1="515" x2="360" y2="545"/>
  <text class="yn2" x="368" y="535">no</text>
  <rect class="a" x="270" y="545" width="180" height="44" rx="8"/>
  <text class="s" x="360" y="563" text-anchor="middle">GPU clocks throttled?</text>
  <text class="s" x="360" y="579" text-anchor="middle">DCGM: clocks, temp, Xid</text>
</svg>
