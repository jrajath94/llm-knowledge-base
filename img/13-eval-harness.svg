<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Charis SIL',Georgia,serif">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#8a8a8a" />
</marker>
</defs>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" style="fill:#ececec">Eval Harness</text>
<rect x="50" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="115.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Dataset</text>
<text x="115.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">10k samples</text>
<rect x="230" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="295.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Model</text>
<text x="295.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Candidate</text>
<rect x="410" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="475.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Judge</text>
<text x="475.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">LLM or human</text>
<rect x="590" y="100" width="130" height="70" rx="8" fill="#141414" stroke="#6cb2ff" stroke-width="2" />
<text x="655.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ececec">Metrics</text>
<text x="655.0" y="148" text-anchor="middle" font-size="11" fill="#a8a8a8">Win rate</text>
<line x1="180" y1="135" x2="230" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="360" y1="135" x2="410" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="540" y1="135" x2="590" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowhead)" />
<text x="400" y="220" text-anchor="middle" font-size="12" fill="#a8a8a8">Calibrate the judge. Measure agreement with humans.</text>
<text x="400" y="245" text-anchor="middle" font-size="12" fill="#a8a8a8">Gate deploys on eval. No green eval, no ship.</text>
</svg>