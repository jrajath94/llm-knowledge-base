<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Capstone: replicate a scaling law at tiny scale"><rect x="22" y="14" width="916" height="332" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7fd08a">CAPSTONE LAB</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Feel the exponent yourself: four tiny runs, one fitted line, one prediction</text><rect x="38" y="96" width="239.95911249999997" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">1. Train four sizes</text><text x="54" y="144" font-size="12" fill="#a8a8a8">0.5M, 1M, 2M, 4M params.</text><text x="54" y="160" font-size="12" fill="#a8a8a8">Same data, same optimizer,</text><text x="54" y="176" font-size="12" fill="#a8a8a8">same token budget. FLOPs</text><text x="54" y="192" font-size="12" fill="#a8a8a8">~ 6 * N * D.</text><line x1="287.95911249999995" y1="152.0" x2="301.95911249999995" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="301.95911249999995,147.0 309.95911249999995,152.0 301.95911249999995,157.0" fill="#a8a8a8"/><rect x="317.95911249999995" y="96" width="235.86377499999998" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="337.95911249999995" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="337.95911249999995" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">2</text><text x="357.95911249999995" y="123" font-size="13.5" font-weight="700" fill="#ececec">2. Fit the power law</text><text x="333.95911249999995" y="144" font-size="12" fill="#a8a8a8">plot log(loss) vs log(FLOPs),</text><text x="333.95911249999995" y="160" font-size="12" fill="#a8a8a8">fit a line, read off your</text><text x="333.95911249999995" y="176" font-size="12" fill="#a8a8a8">exponent alpha_C</text><line x1="563.8228875" y1="152.0" x2="577.8228875" y2="152.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="577.8228875,147.0 585.8228875,152.0 577.8228875,157.0" fill="#a8a8a8"/><rect x="593.8228875" y="96" width="236.999340625" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="613.8228875" cy="118" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="613.8228875" y="123" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">3</text><text x="633.8228875" y="123" font-size="13.5" font-weight="700" fill="#ececec">3. Predict, then verify</text><text x="609.8228875" y="144" font-size="12" fill="#a8a8a8">extrapolate to 2x your</text><text x="609.8228875" y="160" font-size="12" fill="#a8a8a8">largest run, train it. Within</text><text x="609.8228875" y="176" font-size="12" fill="#a8a8a8">20% counts as replication.</text><rect x="38" y="232" width="237.07179999999997" height="112" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="254" r="11" fill="#7fd08a" fill-opacity="0.18" stroke="#7fd08a"/><text x="58" y="259" font-size="13" font-weight="700" fill="#7fd08a" text-anchor="middle">4</text><text x="78" y="259" font-size="13.5" font-weight="700" fill="#ececec">4. IsoFLOP extension</text><text x="54" y="280" font-size="12" fill="#a8a8a8">fix a compute budget; try</text><text x="54" y="296" font-size="12" fill="#a8a8a8">three (N, D) splits that each</text><text x="54" y="312" font-size="12" fill="#a8a8a8">spend it fully</text></svg>