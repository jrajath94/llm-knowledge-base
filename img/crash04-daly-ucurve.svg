<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="470" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Daly checkpoint interval: the U-curve is computed, not drawn</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">waste per hour = C/tau + tau/(2*mu); C = 200 s stall, mu = 50.7 h (1,000 GPUs)</text>
<line x1="90" y1="400" x2="750" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="90" y1="140" x2="90" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="36" y="270" font-size="12" fill="#a8a8a8" text-anchor="middle" transform="rotate(-90 36 270)">expected waste (% of run time)</text>
<rect x="110.0" y="156.57500000000002" width="62.57142857142857" height="243.42499999999998" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="141.28571428571428" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">15 min</text>
<text x="141.28571428571428" y="148.57500000000002" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">22.5%</text>
<rect x="198.57142857142856" y="274.3333333333333" width="62.57142857142857" height="125.66666666666667" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="229.85714285714283" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">30 min</text>
<text x="229.85714285714283" y="266.3333333333333" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">11.6%</text>
<rect x="287.1428571428571" y="329.15" width="62.57142857142857" height="70.85000000000001" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="318.4285714285714" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">60 min</text>
<text x="318.4285714285714" y="321.15" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">6.5%</text>
<rect x="375.7142857142857" y="349.3" width="62.57142857142857" height="50.699999999999996" fill="#7dd87d" rx="4" opacity="0.9"/>
<text x="407.0" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">142 min</text>
<text x="407.0" y="341.3" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">4.7%</text>
<rect x="464.2857142857143" y="342.2583333333333" width="62.57142857142857" height="57.74166666666667" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="495.57142857142856" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">240 min</text>
<text x="495.57142857142856" y="334.2583333333333" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">5.3%</text>
<rect x="552.8571428571429" y="307.05" width="62.57142857142857" height="92.95" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="584.1428571428572" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">480 min</text>
<text x="584.1428571428572" y="299.05" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">8.6%</text>
<rect x="641.4285714285714" y="225.25833333333333" width="62.57142857142857" height="174.74166666666667" fill="#6cb2ff" rx="4" opacity="0.9"/>
<text x="672.7142857142858" y="420" font-size="11" fill="#a8a8a8" text-anchor="middle">960 min</text>
<text x="672.7142857142858" y="217.25833333333333" font-size="11" font-weight="bold" fill="#ececec" text-anchor="middle">16.1%</text>
<line x1="100" y1="349.3" x2="740" y2="349.3" stroke="#7dd87d" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="756" y="353.3" font-size="12" fill="#7dd87d" text-anchor="start">optimum: 142 min</text>
<text x="120" y="156" font-size="12" fill="#f0b429" text-anchor="start">write tax dominates</text>
<text x="720" y="156" font-size="12" fill="#e57ea6" text-anchor="end">rework exposure dominates</text>
<text x="24" y="428" font-size="12" fill="#a8a8a8" text-anchor="start">The bottom is shallow: 60 min or 240 min costs only slightly more than the 142-min optimum. Do not</text>
<text x="24" y="445" font-size="12" fill="#a8a8a8" text-anchor="start">over-tune; C and mu are estimates anyway.</text>
</svg>