<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="430" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Loss as a predictable formula</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">on a log-log plot a power law is a straight line</text>
<rect x="80" y="90" width="480" height="220" fill="#141414" stroke="#4a4a4a" stroke-width="1.5" rx="4" opacity="1"/>
<text x="70" y="310" font-size="12" fill="#8a8a8a" text-anchor="end">log L</text>
<text x="560" y="330" font-size="12" fill="#8a8a8a" text-anchor="end">log x   (x = N params, D tokens, or C FLOPs)</text>
<line x1="100" y1="290" x2="530" y2="120" stroke="#6cb2ff" stroke-width="3"/>
<text x="330" y="130" font-size="13" font-weight="bold" fill="#6cb2ff" text-anchor="start">log L = log A - alpha log x</text>
<text x="330" y="154" font-size="12" fill="#a8a8a8" text-anchor="start">straighter = more predictable</text>
<text x="330" y="178" font-size="12" fill="#a8a8a8" text-anchor="start">steeper slope = faster gains</text>
<text x="580" y="130" font-size="12" fill="#ececec" text-anchor="start">Fit A and alpha on small</text>
<text x="580" y="152" font-size="12" fill="#ececec" text-anchor="start">runs (millions of dollars),</text>
<text x="580" y="174" font-size="12" fill="#ececec" text-anchor="start">extrapolate to the big</text>
<text x="580" y="196" font-size="12" fill="#ececec" text-anchor="start">run (hundreds of</text>
<text x="580" y="218" font-size="12" fill="#ececec" text-anchor="start">millions) before spending.</text>
<text x="24" y="354" font-size="13" fill="#f0b429" text-anchor="start">No sudden jumps in the studied range: loss is predictable, which is what makes billion-dollar runs plannable.</text>
</svg>