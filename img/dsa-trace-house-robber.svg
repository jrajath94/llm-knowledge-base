<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 344" role="img" aria-label="Chapter 13: House Robber — the worked example, traced">
<rect width="900" height="344" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 13: House Robber — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 39. nums = [2, 7, 9, 3, 1]. dp[i] = max money from houses 0..i. dp[i] = max(dp[i-1], dp[i-2] + nums[i]).</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="120.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=0</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">dp[0] = 2</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">only one house</text>
<text x="48.0" y="149.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=1</text>
<text x="128.0" y="150.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">dp[1] = max(2, 7) = 7</text>
<text x="488.0" y="150.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rob 1 or keep 2</text>
<rect x="40.0" y="159.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="178.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=2</text>
<text x="128.0" y="179.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">dp[2] = max(7, 2+9) = 11</text>
<text x="488.0" y="179.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">rob 0 and 2, or keep 7</text>
<text x="48.0" y="207.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=3</text>
<text x="128.0" y="208.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">dp[3] = max(11, 7+3) = 11</text>
<text x="488.0" y="208.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">robbing 3 adds nothing new</text>
<rect x="40.0" y="217.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="236.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">i=4</text>
<text x="128.0" y="237.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">dp[4] = max(11, 11+1) = 12</text>
<text x="488.0" y="237.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">answer 12: rob houses 0, 2, 4</text>
<line x1="40.0" y1="246.0" x2="860.0" y2="246.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="256.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="278.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">The recurrence is the whole solution: at each house, the best plan either skips it or robs it plus</text>
<text x="58.0" y="294.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">the best plan two doors down. Fill left to right.</text>
</svg>
