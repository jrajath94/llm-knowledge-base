<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 386" width="100%" style="max-width:700px" role="img" aria-label="Power law fit on small runs with a widening band; past 10x the largest fitted run, predictions are fiction">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="700" height="386" fill="none"/>
<text class="t" x="24" y="30">Rule 11: the extrapolation limit</text>
<line x1="90" y1="300" x2="660" y2="300" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="90" y1="300" x2="90" y2="60" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="m" x="375" y="332" text-anchor="middle">compute (log)</text>
<text class="m" x="46" y="180" text-anchor="middle">loss</text>
<circle cx="90" cy="274" r="6" fill="#6cb2ff"/>
<circle cx="176" cy="240" r="6" fill="#6cb2ff"/>
<circle cx="232" cy="214" r="6" fill="#6cb2ff"/>
<circle cx="318" cy="194" r="6" fill="#6cb2ff"/>
<text class="m" x="80.0" y="260.2857142857143">fitted runs</text>
<line x1="90" y1="274" x2="660" y2="86" stroke="#6cb2ff" stroke-width="2.5"/>
<polygon points="318,194 660,51 660,120 318,194" fill="#6cb2ff" opacity="0.15"/>
<text class="m" x="500" y="245">the band widens: report it</text>
<circle cx="375" cy="166" r="6" fill="#f0b429"/>
<line x1="375" y1="146" x2="375" y2="187" stroke="#f0b429" stroke-width="2.5"/>
<text class="m" x="373" y="144" text-anchor="end">hold-out error is a lower bound</text>
<line x1="461" y1="60" x2="461" y2="300" stroke="#e57373" stroke-width="2" stroke-dasharray="7,5"/>
<text class="r" x="470.79354876423463" y="80">10x past largest fitted run:</text>
<text class="r" x="470.79354876423463" y="100">predictions here are fiction</text>
<text class="num" x="24" y="362">Rule 11: past 10x, report a wide band and gather an intermediate point.</text>
</svg>
