<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 477" role="img" aria-label="Quorum overlap: W + R &gt; N is what makes read-your-writes real">
<rect width="900" height="477" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Quorum overlap: W + R &gt; N is what makes read-your-writes real</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Every successful write touches W nodes; every read asks R nodes. Overlap guarantees at least one node saw the latest write.</text>
<circle cx="200.0" cy="139.0" r="34.0" fill="#141414" stroke="#2dd4bf" stroke-width="2.5"/>
<text x="200.0" y="144.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N1</text>
<circle cx="200.0" cy="269.0" r="34.0" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="200.0" y="274.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N1</text>
<circle cx="330.0" cy="139.0" r="34.0" fill="#141414" stroke="#2dd4bf" stroke-width="2.5"/>
<text x="330.0" y="144.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N2</text>
<circle cx="330.0" cy="269.0" r="34.0" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="330.0" y="274.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N2</text>
<circle cx="460.0" cy="139.0" r="34.0" fill="#141414" stroke="#2dd4bf" stroke-width="2.5"/>
<text x="460.0" y="144.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N3</text>
<circle cx="460.0" cy="269.0" r="34.0" fill="#141414" stroke="#4aa8ff" stroke-width="2.5"/>
<text x="460.0" y="274.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N3</text>
<circle cx="590.0" cy="139.0" r="34.0" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="590.0" y="144.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N4</text>
<circle cx="590.0" cy="269.0" r="34.0" fill="#141414" stroke="#4aa8ff" stroke-width="2.5"/>
<text x="590.0" y="274.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N4</text>
<circle cx="720.0" cy="139.0" r="34.0" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="720.0" y="144.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N5</text>
<circle cx="720.0" cy="269.0" r="34.0" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="720.0" y="274.0" text-anchor="middle" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">N5</text>
<text x="60.0" y="144.0" text-anchor="start" fill="#2dd4bf" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">WRITE touches</text>
<text x="60.0" y="164.0" text-anchor="start" fill="#2dd4bf" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">W = 3</text>
<text x="60.0" y="274.0" text-anchor="start" fill="#4aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">READ asks</text>
<text x="60.0" y="294.0" text-anchor="start" fill="#4aa8ff" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">R = 2</text>
<line x1="460.0" y1="99.0" x2="460.0" y2="309.0" stroke="#f0b429" stroke-width="2" stroke-dasharray="6,4"/>
<text x="460.0" y="331.0" text-anchor="middle" fill="#f0b429" font-size="12" font-family="Charis SIL, Georgia, serif" font-weight="bold">overlap: N3</text>
<text x="460.0" y="349.0" text-anchor="middle" fill="#f0b429" font-size="11" font-family="Charis SIL, Georgia, serif">saw the write, answers the read</text>
<rect x="40.0" y="369.0" width="820.0" height="70.0" rx="6" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>
<text x="60.0" y="395.0" text-anchor="start" fill="#ececec" font-size="13" font-family="Charis SIL, Georgia, serif" font-weight="bold">W + R &gt; N  means the write set and the read set always intersect. 3 + 2 &gt; 5: at least one node overlaps.</text>
<text x="60.0" y="419.0" text-anchor="start" fill="#8a8a8a" font-size="11.5" font-family="Charis SIL, Georgia, serif">Slow but available: W=1, R=1. No overlap is claimed, and reads may return stale data. State your choice explicitly.</text>
</svg>
