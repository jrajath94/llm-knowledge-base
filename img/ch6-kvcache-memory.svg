<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='100%' role='img' aria-label='GPU memory budget: weights plus KV cache at two context lengths against an 80 GB card'>
<text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec'>The 80 GB budget: weights are fixed, the KV cache is what grows</text>
<text x='20' y='54' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>8B model, FP16, batch 16. Bytes per token = 2 x 32 layers x 4096 hidden x 2 bytes = 0.5 MB.</text>

<!-- axis: 10px per GB, 0..90 -->
<line x1='120' y1='300' x2='1020' y2='300' stroke='#262626' stroke-width='1'/>
<text x='120' y='96' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec'>4k context</text>
<rect x='120' y='108' width='160' height='40' rx='6' fill='#64b5f6'/>
<text x='200' y='133' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#000' text-anchor='middle'>weights 16 GB</text>
<rect x='280' y='108' width='344' height='40' fill='#f0b429'/>
<text x='452' y='133' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#000' text-anchor='middle'>KV cache 34.4 GB</text>
<text x='640' y='133' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#7bc96f'>= 50.4 GB, fits</text>

<text x='120' y='186' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec'>8k context</text>
<rect x='120' y='198' width='160' height='40' rx='6' fill='#64b5f6'/>
<text x='200' y='223' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#000' text-anchor='middle'>weights 16 GB</text>
<rect x='280' y='198' width='688' height='40' fill='#e06c60'/>
<text x='600' y='223' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#000' text-anchor='middle'>KV cache 68.8 GB</text>

<!-- 80GB line -->
<line x1='920' y1='96' x2='920' y2='260' stroke='#e06c60' stroke-width='2' stroke-dasharray='6,5'/>
<text x='920' y='86' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#e06c60' text-anchor='middle'>80 GB card limit</text>
<text x='700' y='280' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#e06c60'>8k total = 84.8 GB: OOM. The bar crosses the limit.</text>

<!-- ticks -->
<text x='120' y='320' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>0</text>
<text x='320' y='320' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>20 GB</text>
<text x='520' y='320' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>40 GB</text>
<text x='720' y='320' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>60 GB</text>
<text x='920' y='320' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>80 GB</text>

<rect x='20' y='338' width='920' height='72' rx='10' fill='#141414' stroke='#262626' stroke-width='1.5'/>
<text x='40' y='364' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8'>Doubling the context doubles the KV cache but leaves the weights untouched. The fleet sized for weights alone OOMs on the first long-context batch.</text>
<text x='40' y='388' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a8a8a8'>Fixes, cheapest first: smaller batch, shorter context, INT8 weights, then GQA/MQA variants that share key/value heads.</text>
</svg>
