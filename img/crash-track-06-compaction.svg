<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Compaction: before and after">
<style>text{font-family:'Charis SIL',Georgia,serif;fill:#ececec} .t{font-size:15px;font-weight:700} .s{font-size:12.5px} .xs{font-size:11px;fill:#a8a8a8} .b{font-weight:700}</style>
<text x="300" y="36" text-anchor="middle" class="t">Compaction: before and after</text>
<text x="300" y="58" text-anchor="middle" class="xs">Keep the load-bearing parts verbatim. Summarize the rest.</text>
<rect x="60" y="90" width="220" height="160" rx="8" fill="#e57373" opacity="0.15" stroke="#e57373" stroke-width="2"/>
<text x="170" y="115" text-anchor="middle" class="s b">Before: 8k tokens</text>
<rect x="80" y="130" width="180" height="30" fill="#7fc97f" opacity="0.85"/>
<text x="170" y="150" text-anchor="middle" class="xs" style="fill:#1a1a1a">task text (keep)</text>
<rect x="80" y="168" width="180" height="30" fill="#7fc97f" opacity="0.85"/>
<text x="170" y="188" text-anchor="middle" class="xs" style="fill:#1a1a1a">recent K steps (keep)</text>
<rect x="80" y="206" width="180" height="30" fill="#8a8a8a" opacity="0.4"/>
<text x="170" y="226" text-anchor="middle" class="xs" style="fill:#ececec">old history (summarize)</text>
<polygon points="300,160 330,175 300,190" fill="#8a8a8a"/>
<line x1="285" y1="175" x2="305" y2="175" stroke="#8a8a8a" stroke-width="2"/>
<rect x="350" y="90" width="190" height="160" rx="8" fill="#7fc97f" opacity="0.15" stroke="#7fc97f" stroke-width="2"/>
<text x="445" y="115" text-anchor="middle" class="s b">After: 3k tokens</text>
<rect x="370" y="130" width="150" height="30" fill="#7fc97f" opacity="0.85"/>
<text x="445" y="150" text-anchor="middle" class="xs" style="fill:#1a1a1a">task text</text>
<rect x="370" y="168" width="150" height="30" fill="#7fc97f" opacity="0.85"/>
<text x="445" y="188" text-anchor="middle" class="xs" style="fill:#1a1a1a">recent K steps</text>
<rect x="370" y="206" width="150" height="30" fill="#6cb2ff" opacity="0.5"/>
<text x="445" y="226" text-anchor="middle" class="xs" style="fill:#ececec">summary</text>
<text x="300" y="285" text-anchor="middle" class="xs">The art: choose what is load-bearing before you compress.</text>
</svg>
