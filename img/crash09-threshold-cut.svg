<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 300' width='100%' role='img' aria-label='Threshold cut: the cost-ratio cut at 0.0909 versus the 0.5 habit'>
<text x='20' y='32' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='20' font-weight='600' fill='#ececec'>The threshold is a price tag, not a convention</text>
<text x='20' y='58' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Churn score from 0 to 1. The cut sits where flagging costs less than staying silent: t* = C_fp / (C_fp + C_fn) = 20 / 220 = 0.0909.</text>
<line x1='60' y1='150' x2='900' y2='150' stroke='#555' stroke-width='3'/>
<line x1='60' y1='140' x2='60' y2='160' stroke='#555' stroke-width='3'/>
<line x1='900' y1='140' x2='900' y2='160' stroke='#555' stroke-width='3'/>
<text x='60' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>0</text>
<text x='900' y='182' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>1</text>
<rect x='136' y='128' width='764' height='44' fill='#2e7d32' opacity='0.25'/>
<text x='518' y='120' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>flag everyone above the cut</text>
<line x1='136' y1='110' x2='136' y2='190' stroke='#2e7d32' stroke-width='4'/>
<text x='136' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#2e7d32' text-anchor='middle'>t* = 0.0909</text>
<text x='136' y='238' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>cost-ratio cut: profit +$470,720</text>
<line x1='480' y1='110' x2='480' y2='190' stroke='#c62828' stroke-width='4'/>
<text x='480' y='216' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#c62828' text-anchor='middle'>0.5</text>
<text x='480' y='238' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8' text-anchor='middle'>the habit: profit -$307,080</text>
<text x='20' y='278' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Same model, same AUC. Only the cut moves, and the cut is what the business feels.</text>
</svg>
