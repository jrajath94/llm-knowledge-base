<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="PagedAttention maps logical token blocks to physical memory blocks">
<style>
.t { font:600 13px 'Charis SIL',Georgia,serif; fill: #ececec; }
.s { font:400 11px 'Charis SIL',Georgia,serif; fill: #a8a8a8; }
.b { font:700 12px 'Charis SIL',Georgia,serif; fill: #fff; }
.box { fill: #141414; stroke: #6cb2ff; stroke-width: 1.5; rx: 6; }
.box2 { fill: #141414; stroke: #7fc97f; stroke-width: 1.5; rx: 6; }
.box3 { fill: #141414; stroke: #f0b429; stroke-width: 1.5; rx: 6; }
.arr { stroke: #8a8a8a; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#8a8a8a" /></marker></defs>
<text x="20" y="28" class="t">PagedAttention: block tables kill fragmentation</text><text x="20" y="55" class="s">Logical view (what the model sees): one long sequence</text><rect x="20" y="65" width="66" height="36" class="box" /><text x="30" y="88" class="s">Blk 0</text><rect x="92" y="65" width="66" height="36" class="box" /><text x="102" y="88" class="s">Blk 1</text><rect x="164" y="65" width="66" height="36" class="box" /><text x="174" y="88" class="s">Blk 2</text><rect x="236" y="65" width="66" height="36" class="box" /><text x="246" y="88" class="s">Blk 3</text><rect x="308" y="65" width="66" height="36" class="box" /><text x="318" y="88" class="s">Blk 4</text><rect x="380" y="65" width="66" height="36" class="box" /><text x="390" y="88" class="s">Blk 5</text><rect x="452" y="65" width="66" height="36" class="box" /><text x="462" y="88" class="s">Blk 6</text><rect x="524" y="65" width="66" height="36" class="box" /><text x="534" y="88" class="s">Blk 7</text><text x="20" y="135" class="s">Physical view (GPU memory): blocks scattered, no waste</text><rect x="30" y="150" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="40" y="173" class="s">Blk 0</text><rect x="180" y="150" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="190" y="173" class="s">Blk 1</text><rect x="120" y="200" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="130" y="223" class="s">Blk 2</text><rect x="300" y="150" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="310" y="173" class="s">Blk 3</text><rect x="240" y="200" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="250" y="223" class="s">Blk 4</text><rect x="420" y="150" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="430" y="173" class="s">Blk 5</text><rect x="360" y="200" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="370" y="223" class="s">Blk 6</text><rect x="540" y="150" width="66" height="36" fill="#141414" stroke="#6cb2ff" rx="6" /><text x="550" y="173" class="s">Blk 7</text><text x="20" y="265" class="s">The block table maps logical block i to its physical slot.</text><text x="20" y="285" class="s">Sequences share blocks for common prefixes. Memory waste drops to one block per sequence.</text></svg>