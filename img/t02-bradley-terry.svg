<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" width="100%" style="max-width:660px" role="img" aria-label="Sigmoid curve with marked points at gaps 0, 1.7, 3.0; saturation past a gap of about 3">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="660" height="410" fill="none"/>
<text class="t" x="24" y="30">Bradley-Terry: the sigmoid of the score gap</text>
<line x1="80" y1="300" x2="640" y2="300" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="80" y1="300" x2="80" y2="60" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="m" x="360" y="332" text-anchor="middle">score gap (r_A - r_B)</text>
<text class="m" x="36" y="180" text-anchor="middle">P(A wins)</text>
<polyline points="80,296 87,295 94,295 101,294 108,294 115,293 122,292 129,291 136,291 143,290 150,289 157,287 164,286 171,285 178,283 185,282 192,280 199,278 206,276 213,274 220,271 227,269 234,266 241,263 248,260 255,256 262,253 269,249 276,244 283,240 290,235 297,231 304,226 311,220 318,215 325,209 332,204 339,198 346,192 353,186 360,180 367,174 374,168 381,162 388,156 395,151 402,145 409,140 416,134 423,129 430,125 437,120 444,116 451,111 458,107 465,104 472,100 479,97 486,94 493,91 500,89 507,86 514,84 521,82 528,80 535,78 542,77 549,75 556,74 563,73 570,71 577,70 584,69 591,69 598,68 605,67 612,66 619,66 626,65 633,65 640,64" fill="none" stroke="#6cb2ff" stroke-width="3"/>
<circle cx="360" cy="180" r="6" fill="#8a8a8a"/>
<line x1="360" y1="180" x2="360" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
<circle cx="479" cy="97" r="6" fill="#f0b429"/>
<line x1="479" y1="97" x2="479" y2="300" stroke="#f0b429" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
<circle cx="570" cy="71" r="6" fill="#7fc97f"/>
<line x1="570" y1="71" x2="570" y2="300" stroke="#7fc97f" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
<text class="m" x="430" y="120">gap 0 -&gt; 0.500: coin flip</text>
<text class="m" x="430" y="142">gap 1.7 -&gt; 0.846: strong, not certain</text>
<text class="m" x="430" y="164">gap 3.0 -&gt; 0.953: saturated</text>
<text class="num" x="24" y="362">Only the gap matters: add 100 to both scores and nothing changes.</text>
<text class="m" x="24" y="386">Loss = -log P. Gradient weight = (1 - p): hard pairs drive the update, easy pairs barely teach.</text>
</svg>
