<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" style="max-width:680px" role="img" aria-label="Reliability stack: 0.36 raw, 0.52 with checkpoint resume, 0.67 with retry-with-judgment on a 20-step task">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.big{font-size:13px;font-weight:700}
.ax{stroke:#5a5a5a;stroke-width:1.5}
</style>
<text class="t" x="24" y="32">Reliability is a stack, not a feature</text>
<text class="m" x="24" y="54">20-step task, per-step success 0.95. No single mechanism reaches 0.98 per step.</text>

<line class="ax" x1="80" y1="90" x2="80" y2="300"/>
<line class="ax" x1="80" y1="300" x2="620" y2="300"/>
<text class="m" x="56" y="305">0</text>
<text class="m" x="44" y="248">0.25</text>
<text class="m" x="50" y="193">0.5</text>
<text class="m" x="44" y="138">0.75</text>
<text class="m" x="56" y="95">1.0</text>

<rect class="r" x="140" y="222" width="110" height="78" opacity="0.85"/>
<text class="big" x="195" y="214" text-anchor="middle">0.36</text>
<rect class="b" x="300" y="192" width="110" height="108" opacity="0.85"/>
<text class="big" x="355" y="184" text-anchor="middle">0.52</text>
<rect class="gr" x="460" y="160" width="110" height="140" opacity="0.85"/>
<text class="big" x="515" y="152" text-anchor="middle">0.67</text>

<text class="m" x="195" y="322" text-anchor="middle">raw</text>
<text class="m" x="195" y="340" text-anchor="middle">0.95^20</text>
<text class="m" x="355" y="322" text-anchor="middle">+ checkpoint resume</text>
<text class="m" x="355" y="340" text-anchor="middle">0.9675^20</text>
<text class="m" x="515" y="322" text-anchor="middle">+ retry with judgment</text>
<text class="m" x="515" y="340" text-anchor="middle">0.98^20</text>

<text class="m" x="24" y="376">Checkpoint resume salvages 70% of the transient half of failures. Retry-with-judgment fixes half of the agent-error third.</text>
</svg>
