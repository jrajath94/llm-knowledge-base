<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px" role="img" aria-label="pass@k versus pass@1: three bars showing why repeated sampling inflates the headline number">
<style>
 text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
 .m{fill:#a8a8a8;font-size:12px}
 .t{font-size:14px;font-weight:700}
 .g{fill:#f0b429}
 .lbl{font-size:12.5px;fill:#a8a8a8}
 .big{font-size:26px;font-weight:700}
</style>
<rect x="0" y="0" width="760" height="400" fill="none"/>
<text class="t" x="30" y="30">pass@k flatters. Read the trio.</text>
<text class="m" x="30" y="50">10 tries per item, each try independently succeeds 70% of the time</text>
<!-- y axis: 0 at y=300, scale 3px per % -->
<g>
 <rect x="60" y="0" width="120" height="300" fill="#e57373" opacity="0.75"/>
 <rect x="230" y="90" width="120" height="210" fill="#6cb2ff" opacity="0.8"/>
 <rect x="400" y="291.6" width="120" height="8.4" fill="#7fd08a" opacity="0.85"/>
 <line x1="40" y1="300" x2="560" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
</g>
<text class="big" x="60" y="330" fill="#e57373">100%</text>
<text class="lbl" x="60" y="352">pass@10</text>
<text class="lbl" x="60" y="372">at least one of 10 tries</text>
<text class="big" x="230" y="330" fill="#6cb2ff">70%</text>
<text class="lbl" x="230" y="352">pass@1</text>
<text class="lbl" x="230" y="372">one try, the production number</text>
<text class="big" x="400" y="330" fill="#7fd08a">2.8%</text>
<text class="lbl" x="400" y="352">(pass@1)^10</text>
<text class="lbl" x="400" y="372">all 10 tries succeed</text>
<text class="lbl" x="570" y="150">The same model reads as 100% or 70%</text>
<text class="lbl" x="570" y="172">depending on the k you pick.</text>
<text class="lbl" x="570" y="194">Report all three. The third bar is the</text>
<text class="lbl" x="570" y="216">consistency check: a reliable model keeps</text>
<text class="lbl" x="570" y="238">it visible, a lucky one does not.</text>
</svg>
