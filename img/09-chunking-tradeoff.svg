<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-label="Chunk size tradeoff">
<rect width="800" height="350" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="400.0" y="28" text-anchor="middle" font-size="18" class="accent">Chunking: The Tradeoff</text>
<rect x="80" y="80" width="300" height="80" class="box" rx="4"/>
<text x="230.0" y="102" text-anchor="middle" font-size="14">Small Chunks</text>
<text x="230.0" y="120" text-anchor="middle" font-size="11" class="muted">precise, lose context</text>
<rect x="420" y="80" width="300" height="80" class="box" rx="4"/>
<text x="570.0" y="102" text-anchor="middle" font-size="14">Large Chunks</text>
<text x="570.0" y="120" text-anchor="middle" font-size="11" class="muted">keep context, dilute match</text>
<text x="400" y="200" text-anchor="middle" font-size="14">Tune with evals, not taste</text>
<text x="400" y="230" text-anchor="middle" font-size="12" class="muted">Overlap protects facts at boundaries</text>
<text x="400" y="250" text-anchor="middle" font-size="12" class="muted">One idea per chunk keeps retrieval precise</text>
</svg>