<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 315" role="img" aria-label="Chapter 10: Merge Intervals — the worked example, traced">
<rect width="900" height="315" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 10: Merge Intervals — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 36. intervals = [[1,3],[2,6],[8,10],[15,18]], sorted by start. One running 'current' interval.</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="120.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">cur = [1, 3]</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">next [2, 6]: 2 &lt;= 3</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">overlap: merge to [1, 6]</text>
<text x="48.0" y="149.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">cur = [1, 6]</text>
<text x="128.0" y="150.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">next [8, 10]: 8 &gt; 6</text>
<text x="488.0" y="150.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">gap: emit [1, 6]; cur = [8, 10]</text>
<rect x="40.0" y="159.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="178.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">cur = [8, 10]</text>
<text x="128.0" y="179.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">next [15, 18]: 15 &gt; 10</text>
<text x="488.0" y="179.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">gap: emit [8, 10]; cur = [15, 18]</text>
<text x="48.0" y="207.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">end</text>
<text x="128.0" y="208.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">emit cur [15, 18]</text>
<text x="488.0" y="208.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">answer [[1,6],[8,10],[15,18]]</text>
<line x1="40.0" y1="217.0" x2="860.0" y2="217.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="227.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="249.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">Sort by start first: then every interval either overlaps the running one or starts a new one. No</text>
<text x="58.0" y="265.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">interval is ever revisited.</text>
</svg>
