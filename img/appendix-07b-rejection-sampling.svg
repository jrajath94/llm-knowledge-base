<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="800" height="500" fill="#0d0d0d"/>
<text x="400" y="36" text-anchor="middle" fill="#ececec" font-size="22" font-weight="700">Rejection sampling: generate k, keep the passers</text>
<text x="400" y="60" text-anchor="middle" fill="#a8a8a8" font-size="14">One prompt, k = 8 candidates, checker decides</text>
<!-- prompt -->
<rect x="40" y="200" width="130" height="70" rx="8" fill="#262626" stroke="#a8a8a8" stroke-width="2"/>
<text x="105" y="230" text-anchor="middle" fill="#ececec" font-size="15" font-weight="700">prompt</text>
<text x="105" y="252" text-anchor="middle" fill="#a8a8a8" font-size="12">solve this</text>
<!-- fan out arrows -->
<line x1="170" y1="235" x2="230" y2="120" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="170" y1="235" x2="230" y2="180" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="170" y1="235" x2="230" y2="235" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="170" y1="235" x2="230" y2="290" stroke="#a8a8a8" stroke-width="1.5"/>
<line x1="170" y1="235" x2="230" y2="350" stroke="#a8a8a8" stroke-width="1.5"/>
<!-- candidates -->
<g font-size="12">
<rect x="230" y="100" width="120" height="40" rx="6" fill="#262626" stroke="#a8a8a8"/><text x="290" y="124" text-anchor="middle" fill="#ececec">candidate 1</text>
<rect x="230" y="160" width="120" height="40" rx="6" fill="#262626" stroke="#a8a8a8"/><text x="290" y="184" text-anchor="middle" fill="#ececec">candidate 2</text>
<rect x="230" y="215" width="120" height="40" rx="6" fill="#262626" stroke="#a8a8a8"/><text x="290" y="239" text-anchor="middle" fill="#ececec">candidate 3</text>
<rect x="230" y="270" width="120" height="40" rx="6" fill="#262626" stroke="#a8a8a8"/><text x="290" y="294" text-anchor="middle" fill="#ececec">candidate 4</text>
<rect x="230" y="330" width="120" height="40" rx="6" fill="#262626" stroke="#a8a8a8"/><text x="290" y="354" text-anchor="middle" fill="#ececec">candidate 5</text>
<text x="290" y="400" text-anchor="middle" fill="#a8a8a8">+ 3 more</text>
</g>
<!-- checker -->
<line x1="350" y1="235" x2="400" y2="235" stroke="#a8a8a8" stroke-width="1.5"/>
<rect x="400" y="200" width="130" height="70" rx="8" fill="#f0b429" opacity="0.2" stroke="#f0b429" stroke-width="2"/>
<text x="465" y="230" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="700">checker</text>
<text x="465" y="252" text-anchor="middle" fill="#a8a8a8" font-size="12">tests / judge</text>
<!-- kept -->
<line x1="530" y1="220" x2="580" y2="160" stroke="#7fd08a" stroke-width="2"/>
<line x1="530" y1="235" x2="580" y2="235" stroke="#7fd08a" stroke-width="2"/>
<line x1="530" y1="250" x2="580" y2="310" stroke="#7fd08a" stroke-width="2"/>
<rect x="580" y="140" width="110" height="40" rx="6" fill="#7fd08a" opacity="0.3" stroke="#7fd08a"/><text x="635" y="164" text-anchor="middle" fill="#7fd08a" font-size="12">kept</text>
<rect x="580" y="215" width="110" height="40" rx="6" fill="#7fd08a" opacity="0.3" stroke="#7fd08a"/><text x="635" y="239" text-anchor="middle" fill="#7fd08a" font-size="12">kept</text>
<rect x="580" y="290" width="110" height="40" rx="6" fill="#7fd08a" opacity="0.3" stroke="#7fd08a"/><text x="635" y="314" text-anchor="middle" fill="#7fd08a" font-size="12">kept</text>
<!-- discarded -->
<line x1="530" y1="235" x2="580" y2="400" stroke="#e08080" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="635" y="404" text-anchor="middle" fill="#e08080" font-size="12">5 discarded</text>
<text x="400" y="450" text-anchor="middle" fill="#ececec" font-size="15">The kept set trains the next round. The checker is the quality gate.</text>
<text x="400" y="476" text-anchor="middle" fill="#a8a8a8" font-size="13">Higher temperature gives diversity. The checker gives quality.</text>
</svg>
