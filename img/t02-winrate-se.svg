<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 436" width="100%" style="max-width:660px" role="img" aria-label="Standard error at n = 100, 200, 400, 800 for p = 0.54; detecting a 4-point effect needs n = 800">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="660" height="436" fill="none"/>
<text class="t" x="24" y="30">Win-rate standard error shrinks with n</text>
<line x1="80" y1="300" x2="640" y2="300" stroke="#5a5a5a" stroke-width="1.5"/>
<line x1="80" y1="300" x2="80" y2="60" stroke="#5a5a5a" stroke-width="1.5"/>
<text class="m" x="360" y="332" text-anchor="middle">judgments n</text>
<text class="m" x="36" y="180" text-anchor="middle">SE (points)</text>
<rect x="100" y="84" width="80" height="216" fill="#6cb2ff" opacity="0.85" rx="4"/>
<text class="num" x="140" y="74.19999999999999" text-anchor="middle">4.98</text>
<text class="m" x="140" y="318" text-anchor="middle">100</text>
<rect x="240" y="147" width="80" height="153" fill="#6cb2ff" opacity="0.85" rx="4"/>
<text class="num" x="280" y="137.46666666666667" text-anchor="middle">3.52</text>
<text class="m" x="280" y="318" text-anchor="middle">200</text>
<rect x="380" y="192" width="80" height="108" fill="#6cb2ff" opacity="0.85" rx="4"/>
<text class="num" x="420" y="182.1" text-anchor="middle">2.49</text>
<text class="m" x="420" y="318" text-anchor="middle">400</text>
<rect x="520" y="224" width="80" height="76" fill="#6cb2ff" opacity="0.85" rx="4"/>
<text class="num" x="560" y="213.73333333333335" text-anchor="middle">1.76</text>
<text class="m" x="560" y="318" text-anchor="middle">800</text>
<line x1="80" y1="213" x2="640" y2="213" stroke="#e57373" stroke-width="2" stroke-dasharray="7,5"/>
<text class="r" x="630" y="198" text-anchor="end">need 2SE &lt; effect: to detect 4 pts, n = 800</text>
<text class="num" x="24" y="362">SE = sqrt(p(1-p)/n). The 95% interval is roughly p +/- 2 SE.</text>
<text class="m" x="24" y="386">54% on n = 200: SE near 3.5 points. That win may be noise.</text>
<text class="m" x="24" y="410">This n is per decision: slice it and each slice needs its own n.</text>
</svg>
