<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img'><title>Model cascade with honest cost accounting</title><rect x='60' y='120' width='220' height='90' rx='10' fill='#1565c0' fill-opacity='0.22' stroke='#1565c0' stroke-width='2'/><text x='170.0' y='163.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Request</text><text x='170.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>cheap model first</text><line x1='280' y1='165' x2='330' y2='165' stroke='#8a8a8a' stroke-width='2'/><polygon points='323,161 330,165 323,169' fill='#8a8a8a'/><rect x='335' y='120' width='200' height='90' rx='10' fill='#f0b429' fill-opacity='0.22' stroke='#f0b429' stroke-width='2'/><text x='435.0' y='163.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Confidence high?</text><text x='435.0' y='187.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>graded on the golden set</text><line x1='535' y1='140' x2='600' y2='90' stroke='#8a8a8a' stroke-width='2'/><polygon points='593,86 600,90 593,94' fill='#8a8a8a'/><line x1='535' y1='190' x2='600' y2='250' stroke='#8a8a8a' stroke-width='2'/><polygon points='593,246 600,250 593,254' fill='#8a8a8a'/><rect x='605' y='45' width='295' height='90' rx='10' fill='#2e9e5b' fill-opacity='0.22' stroke='#2e9e5b' stroke-width='2'/><text x='752.5' y='88.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Return answer</text><text x='752.5' y='112.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>pays cheap cost only</text><rect x='605' y='205' width='295' height='90' rx='10' fill='#c0392b' fill-opacity='0.22' stroke='#c0392b' stroke-width='2'/><text x='752.5' y='248.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='600' fill='#ececec' text-anchor='middle'>Escalate to premium</text><text x='752.5' y='272.0' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#a8a8a8' text-anchor='middle'>pays BOTH calls</text><text x='480' y='300' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='16' font-weight='600' fill='#ececec' text-anchor='middle'>Honest cascade math: escalated requests pay for both calls</text><text x='480' y='330' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>30% escalation on the worked profile: $3.60 per 1K requests, a 64% cut from all-premium</text><text x='480' y='360' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#a8a8a8' text-anchor='middle'>The router must be graded on the golden set; ship only if the quality delta sits inside tolerance</text></svg>