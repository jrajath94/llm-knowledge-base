<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" style="max-width:680px" role="img" aria-label="Annotated roofline: batch-1 and batch-64 decode sit under the memory roof, prefill sits on the compute roof">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Roofline: bytes rule below the ridge, FLOPS rule above it</text>
<text class="m" x="24" y="52">Schematic. Ridge point for H100 BF16: 295 FLOP/byte.</text>
<line class="ax" x1="80" y1="350" x2="640" y2="350"/>
<line class="ax" x1="80" y1="350" x2="80" y2="70"/>
<text class="m" x="360" y="378" text-anchor="middle">arithmetic intensity (FLOP/byte)</text>
<text class="m" x="90" y="92">attainable TFLOPS</text>
<line x1="80" y1="330" x2="380" y2="150" stroke="#6cb2ff" stroke-width="2.5"/>
<line x1="380" y1="150" x2="640" y2="150" stroke="#6cb2ff" stroke-width="2.5"/>
<text class="b" x="130" y="282">memory roof</text>
<text class="b" x="560" y="174" text-anchor="middle">compute roof: 989 TFLOPS</text>
<circle cx="380" cy="150" r="6" fill="#f0b429"/>
<text class="g" x="368" y="126" text-anchor="end">ridge: 295 FLOP/byte</text>
<circle cx="120" cy="312" r="6" fill="#e57373"/>
<text class="r" x="134" y="306">batch-1 decode: 1 FLOP/B</text>
<text class="m" x="134" y="324">~3.35 TFLOPS, 0.34% of peak</text>
<circle cx="250" cy="245" r="6" fill="#f0b429"/>
<text class="g" x="264" y="239">batch-64 decode: 55.6 FLOP/B</text>
<text class="m" x="264" y="257">~186 TFLOPS, still memory-bound</text>
<circle cx="540" cy="150" r="6" fill="#7fc97f"/>
<text class="gr" x="630" y="104" text-anchor="end">prefill: 2033 FLOP/B,</text>
<text class="gr" x="630" y="122" text-anchor="end">compute-bound</text>
</svg>
