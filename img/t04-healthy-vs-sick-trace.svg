<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Healthy overlapped trace versus sick trace with exposed communication">
  <style>
    .t { font:600 14px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#ececec; }
    .s { font:400 12.5px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#a8a8a8; }
    .rl { font:400 11.5px -apple-system,"Segoe UI",Roboto,sans-serif; fill:#a8a8a8; }
    .gemm { fill:#6cb2ff; opacity:0.75; }
    .nccl { fill:#f0b429; opacity:0.75; }
    .adam { fill:#8a8a8a; opacity:0.75; }
    .idle { fill:#262626; }
  </style>

  <text class="t" x="20" y="28">Healthy: communication hides behind compute</text>
  <text class="rl" x="20" y="60">compute</text>
  <rect class="gemm" x="110" y="48" width="70" height="22"/><rect class="gemm" x="190" y="48" width="70" height="22"/>
  <rect class="gemm" x="270" y="48" width="70" height="22"/><rect class="gemm" x="350" y="48" width="70" height="22"/>
  <rect class="adam" x="430" y="48" width="60" height="22"/>
  <text class="s" x="130" y="64" fill="#0d0d0d">GEMM</text>
  <text class="s" x="440" y="64" fill="#0d0d0d">adam</text>
  <text class="rl" x="20" y="100">NCCL</text>
  <rect class="nccl" x="150" y="88" width="90" height="22"/><rect class="nccl" x="270" y="88" width="90" height="22"/>
  <rect class="nccl" x="390" y="88" width="90" height="22"/>
  <text class="s" x="165" y="104" fill="#0d0d0d">all-reduce</text>
  <text class="s" x="540" y="104">gradients sync while backward computes</text>

  <text class="t" x="20" y="150">Sick: one long all-reduce, nothing overlaps it</text>
  <text class="rl" x="20" y="182">compute</text>
  <rect class="gemm" x="110" y="170" width="70" height="22"/><rect class="gemm" x="190" y="170" width="70" height="22"/>
  <rect class="idle" x="270" y="170" width="330" height="22"/>
  <text class="rl" x="20" y="222">NCCL</text>
  <rect class="idle" x="110" y="210" width="150" height="22"/>
  <rect class="nccl" x="270" y="210" width="330" height="22"/>
  <text class="s" x="280" y="226" fill="#0d0d0d">all-reduce (nothing overlaps)</text>

  <text class="s" x="20" y="262">First question for any trace: is the communication overlapped, and if not, why not?</text>
  <text class="s" x="20" y="284">Usual answers: gradient buckets too large, bucketing misconfigured, or TP collectives exposed by tiny matmuls.</text>

  <rect x="560" y="36" width="14" height="14" class="gemm"/><text class="rl" x="580" y="48">compute (GEMM)</text>
  <rect x="560" y="58" width="14" height="14" class="nccl"/><text class="rl" x="580" y="70">communication</text>
  <rect x="560" y="80" width="14" height="14" class="idle"/><text class="rl" x="580" y="92">idle gap</text>
</svg>
