<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="560" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Figure 0.2. The agent loop: observe, think, act, repeat</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">every agent pattern is this loop with different furniture</text>
<circle cx="440" cy="240" r="130" fill="#141414" stroke="#6cb2ff" stroke-width="1.5"/>
<text x="440" y="232" font-size="16" font-weight="bold" fill="#ececec" text-anchor="middle">AGENT</text>
<text x="440" y="256" font-size="12" fill="#a8a8a8" text-anchor="middle">observe - think - act</text>
<rect x="350" y="45" width="180" height="70" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="71" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">TASK</text>
<rect x="610" y="205" width="180" height="70" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="700.0" y="231" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">TOOLS</text>
<rect x="350" y="365" width="180" height="70" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="440.0" y="391" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">MEMORY</text>
<rect x="90" y="205" width="180" height="70" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="180.0" y="231" font-size="13" font-weight="bold" fill="#ececec" text-anchor="middle">HUMAN</text>
<line x1="440" y1="115" x2="440" y2="140" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,140 436.33015592246386,131.78219953718923 443.66984407753614,131.78219953718923" fill="#8a8a8a"/>
<line x1="570" y1="240" x2="610" y2="240" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="610,240 601.7821995371892,243.66984407753614 601.7821995371892,236.33015592246386" fill="#8a8a8a"/>
<line x1="440" y1="370" x2="440" y2="345" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="440,345 443.66984407753614,353.21780046281077 436.33015592246386,353.21780046281077" fill="#8a8a8a"/>
<line x1="270" y1="240" x2="310" y2="240" stroke="#8a8a8a" stroke-width="2"/>
<polygon points="310,240 301.78219953718923,243.66984407753614 301.78219953718923,236.33015592246386" fill="#8a8a8a"/>
<text x="440" y="128" font-size="10" fill="#a8a8a8" text-anchor="middle">goal in</text>
<text x="590" y="228" font-size="10" fill="#a8a8a8" text-anchor="middle">calls</text>
<text x="440" y="358" font-size="10" fill="#a8a8a8" text-anchor="middle">recalls</text>
<text x="290" y="228" font-size="10" fill="#a8a8a8" text-anchor="middle">approves</text>
<text x="24" y="500" font-size="12" fill="#a8a8a8" text-anchor="start">ReAct, plan-and-execute, and multi-agent are all this loop: the difference is where the thinking happens and</text>
<text x="24" y="517" font-size="12" fill="#a8a8a8" text-anchor="start">who holds the plan.</text>
</svg>