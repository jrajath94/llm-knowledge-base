<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="560" fill="#0d0d0d"/>
<text x="450" y="34" text-anchor="middle" fill="#ececec" font-size="20" font-weight="600">Context parallelism: two designs</text>

<!-- LEFT: Ulysses -->
<text x="225" y="66" text-anchor="middle" fill="#f0b429" font-size="15" font-weight="600">Ulysses: transpose with all-to-all</text>
<text x="225" y="86" text-anchor="middle" fill="#a8a8a8" font-size="12">two all-to-alls per attention layer</text>

<!-- 4 GPUs with token shards -->
<g font-size="11">
<rect x="40" y="110" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="80" y="128" text-anchor="middle" fill="#ececec">GPU 0</text>
<rect x="48" y="138" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.85"/>
<text x="80" y="152" text-anchor="middle" fill="#0d0d0d">tokens 0-3</text>
<rect x="48" y="162" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.45"/>
<text x="80" y="176" text-anchor="middle" fill="#0d0d0d">heads 0-3</text>
<text x="80" y="200" text-anchor="middle" fill="#a8a8a8">all heads,</text>
<text x="80" y="214" text-anchor="middle" fill="#a8a8a8">few tokens</text>

<rect x="140" y="110" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="180" y="128" text-anchor="middle" fill="#ececec">GPU 1</text>
<rect x="148" y="138" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.85"/>
<text x="180" y="152" text-anchor="middle" fill="#0d0d0d">tokens 4-7</text>
<rect x="148" y="162" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.45"/>
<text x="180" y="176" text-anchor="middle" fill="#0d0d0d">heads 0-3</text>

<rect x="240" y="110" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="280" y="128" text-anchor="middle" fill="#ececec">GPU 2</text>
<rect x="248" y="138" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.85"/>
<text x="280" y="152" text-anchor="middle" fill="#0d0d0d">tokens 8-11</text>
<rect x="248" y="162" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.45"/>
<text x="280" y="176" text-anchor="middle" fill="#0d0d0d">heads 0-3</text>

<rect x="340" y="110" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="380" y="128" text-anchor="middle" fill="#ececec">GPU 3</text>
<rect x="348" y="138" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.85"/>
<text x="380" y="152" text-anchor="middle" fill="#0d0d0d">tokens 12-15</text>
<rect x="348" y="162" width="64" height="20" rx="3" fill="#6cb2ff" opacity="0.45"/>
<text x="380" y="176" text-anchor="middle" fill="#0d0d0d">heads 0-3</text>
</g>

<text x="230" y="258" text-anchor="middle" fill="#f0b429" font-size="12">all-to-all (transpose)</text>
<path d="M 120 246 L 100 190 M 220 246 L 200 190 M 320 246 L 300 190 M 380 246 L 360 190" stroke="#f0b429" stroke-width="1.5" marker-end="url(#arr)"/>

<g font-size="11">
<rect x="40" y="270" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="80" y="288" text-anchor="middle" fill="#ececec">GPU 0</text>
<rect x="48" y="298" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.85"/>
<text x="80" y="312" text-anchor="middle" fill="#0d0d0d">tokens 0-15</text>
<rect x="48" y="322" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.45"/>
<text x="80" y="336" text-anchor="middle" fill="#0d0d0d">head 0</text>
<text x="80" y="360" text-anchor="middle" fill="#a8a8a8">all tokens,</text>
<text x="80" y="374" text-anchor="middle" fill="#a8a8a8">one head</text>

<rect x="140" y="270" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="180" y="288" text-anchor="middle" fill="#ececec">GPU 1</text>
<rect x="148" y="298" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.85"/>
<text x="180" y="312" text-anchor="middle" fill="#0d0d0d">tokens 0-15</text>
<rect x="148" y="322" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.45"/>
<text x="180" y="336" text-anchor="middle" fill="#0d0d0d">head 1</text>

<rect x="240" y="270" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="280" y="288" text-anchor="middle" fill="#ececec">GPU 2</text>
<rect x="248" y="298" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.85"/>
<text x="280" y="312" text-anchor="middle" fill="#0d0d0d">tokens 0-15</text>
<rect x="248" y="322" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.45"/>
<text x="280" y="336" text-anchor="middle" fill="#0d0d0d">head 2</text>

<rect x="340" y="270" width="80" height="120" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="380" y="288" text-anchor="middle" fill="#ececec">GPU 3</text>
<rect x="348" y="298" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.85"/>
<text x="380" y="312" text-anchor="middle" fill="#0d0d0d">tokens 0-15</text>
<rect x="348" y="322" width="64" height="20" rx="3" fill="#7fd08a" opacity="0.45"/>
<text x="380" y="336" text-anchor="middle" fill="#0d0d0d">head 3</text>
</g>
<text x="230" y="418" text-anchor="middle" fill="#a8a8a8" font-size="12">attention runs locally per head shard</text>
<text x="230" y="438" text-anchor="middle" fill="#e08080" font-size="12">cost: each GPU briefly holds ALL tokens</text>

<!-- divider -->
<line x1="460" y1="60" x2="460" y2="450" stroke="#3a3a3a"/>

<!-- RIGHT: Ring attention -->
<text x="675" y="66" text-anchor="middle" fill="#6cb2ff" font-size="15" font-weight="600">Ring attention: pass K/V blocks around</text>
<text x="675" y="86" text-anchor="middle" fill="#a8a8a8" font-size="12">flat memory, point-to-point only</text>

<g font-size="11">
<rect x="545" y="130" width="110" height="70" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="600" y="150" text-anchor="middle" fill="#ececec">GPU 0</text>
<text x="600" y="166" text-anchor="middle" fill="#a8a8a8">Q block 0</text>
<text x="600" y="182" text-anchor="middle" fill="#6cb2ff">K/V block 0</text>

<rect x="700" y="130" width="110" height="70" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="755" y="150" text-anchor="middle" fill="#ececec">GPU 1</text>
<text x="755" y="166" text-anchor="middle" fill="#a8a8a8">Q block 1</text>
<text x="755" y="182" text-anchor="middle" fill="#6cb2ff">K/V block 1</text>

<rect x="545" y="290" width="110" height="70" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="600" y="310" text-anchor="middle" fill="#ececec">GPU 3</text>
<text x="600" y="326" text-anchor="middle" fill="#a8a8a8">Q block 3</text>
<text x="600" y="342" text-anchor="middle" fill="#6cb2ff">K/V block 3</text>

<rect x="700" y="290" width="110" height="70" rx="6" fill="#1a1a1a" stroke="#3a3a3a"/>
<text x="755" y="310" text-anchor="middle" fill="#ececec">GPU 2</text>
<text x="755" y="326" text-anchor="middle" fill="#a8a8a8">Q block 2</text>
<text x="755" y="342" text-anchor="middle" fill="#6cb2ff">K/V block 2</text>
</g>

<path d="M 655 165 L 700 165" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 755 200 L 755 290" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 700 325 L 655 325" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 600 290 L 600 205" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

<text x="677" y="158" text-anchor="middle" fill="#a8a8a8" font-size="11">send K/V</text>
<text x="768" y="248" text-anchor="middle" fill="#a8a8a8" font-size="11">send K/V</text>
<text x="677" y="318" text-anchor="middle" fill="#a8a8a8" font-size="11">send K/V</text>
<text x="587" y="248" text-anchor="middle" fill="#a8a8a8" font-size="11">send K/V</text>

<text x="675" y="400" text-anchor="middle" fill="#ececec" font-size="12">each GPU: compute attention on its own</text>
<text x="675" y="418" text-anchor="middle" fill="#ececec" font-size="12">Q block with one K/V block at a time</text>
<text x="675" y="440" text-anchor="middle" fill="#7fd08a" font-size="12">memory stays flat; send overlaps compute</text>

<text x="450" y="500" text-anchor="middle" fill="#a8a8a8" font-size="13">choose ring when the all-tokens spike would run the job out of memory</text>
<text x="450" y="524" text-anchor="middle" fill="#a8a8a8" font-size="13">choose Ulysses when sequences fit and two collectives are cheaper than N steps</text>

<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#a8a8a8"/>
</marker>
</defs>
</svg>
