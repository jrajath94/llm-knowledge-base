<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="880" height="500" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Majority vote: weak judges become a strong judge</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">three cheap graders outvote one expensive one, when they are independent</text>
<text x="24" y="132" font-size="13" fill="#ececec" text-anchor="start">3 judges at 75%</text>
<rect x="240" y="110" width="480" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<rect x="240" y="110" width="405.12" height="34" fill="#6cb2ff" rx="4" opacity="0.85"/>
<text x="653.12" y="133" font-size="12" fill="#6cb2ff" text-anchor="start">84.4% majority accuracy</text>
<text x="24" y="194" font-size="13" fill="#ececec" text-anchor="start">5 judges at 75%</text>
<rect x="240" y="172" width="480" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<rect x="240" y="172" width="430.08" height="34" fill="#4fd1a5" rx="4" opacity="0.85"/>
<text x="678.0799999999999" y="195" font-size="12" fill="#4fd1a5" text-anchor="start">89.6% majority accuracy</text>
<text x="24" y="256" font-size="13" fill="#ececec" text-anchor="start">3 judges at 60%</text>
<rect x="240" y="234" width="480" height="34" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="1"/>
<rect x="240" y="234" width="311.04" height="34" fill="#f0b429" rx="4" opacity="0.85"/>
<text x="559.04" y="257" font-size="12" fill="#f0b429" text-anchor="start">64.8% majority accuracy</text>
<text x="24" y="330" font-size="12" fill="#a8a8a8" text-anchor="start">The math assumes independent errors. Three copies of the same model making the same mistake do not vote: they</text>
<text x="24" y="348" font-size="12" fill="#a8a8a8" text-anchor="start">echo. Diversity of judges matters more than count.</text>
<text x="24" y="390" font-size="12" fill="#a8a8a8" text-anchor="start">When to use it: grading at scale where one flagship call per item is too expensive, but three mini-model calls</text>
<text x="24" y="408" font-size="12" fill="#a8a8a8" text-anchor="start">are cheap. When not to: the judges share a blind spot.</text>
</svg>