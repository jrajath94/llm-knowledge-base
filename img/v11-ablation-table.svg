<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A good ablation table: one row per component, one edit per row"><rect x="22" y="14" width="916" height="274" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">ABLATIONS</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">Change two things and you have proven nothing</text><text x="38" y="116" font-size="13" font-weight="700" fill="#f0b429">Variant</text><text x="303.2" y="116" font-size="13" font-weight="700" fill="#f0b429">What changed</text><text x="612.5999999999999" y="116" font-size="13" font-weight="700" fill="#f0b429">What it proves</text><line x1="38" y1="120" x2="922" y2="120" stroke="#2e2e2e"/><text x="38" y="148" font-size="13" font-weight="700" fill="#ececec">Full method</text><text x="303.2" y="148" font-size="13" fill="#a8a8a8">nothing: the reference</text><text x="612.5999999999999" y="148" font-size="13" fill="#a8a8a8">the number to beat</text><line x1="38" y1="160" x2="922" y2="160" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="188" font-size="13" font-weight="700" fill="#ececec">Minus module A</text><text x="303.2" y="188" font-size="13" fill="#a8a8a8">exactly one component removed</text><text x="612.5999999999999" y="188" font-size="13" fill="#a8a8a8">did A cause the gain?</text><line x1="38" y1="200" x2="922" y2="200" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="228" font-size="13" font-weight="700" fill="#ececec">Minus loss term</text><text x="303.2" y="228" font-size="13" fill="#a8a8a8">exactly one component removed</text><text x="612.5999999999999" y="228" font-size="13" fill="#a8a8a8">did the loss cause the gain?</text><line x1="38" y1="240" x2="922" y2="240" stroke="#2e2e2e" stroke-opacity="0.5"/><text x="38" y="268" font-size="13" font-weight="700" fill="#ececec">Dumb baseline</text><text x="303.2" y="268" font-size="13" fill="#a8a8a8">component replaced by a trivial</text><text x="303.2" y="288" font-size="13" fill="#a8a8a8">version</text><text x="612.5999999999999" y="268" font-size="13" fill="#a8a8a8">was the sophistication needed?</text><line x1="38" y1="300" x2="922" y2="300" stroke="#2e2e2e" stroke-opacity="0.5"/></svg>