<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Quantization ladder: fewer bits per weight, smaller model, more risk">
<style>
.t { font: 600 13px system-ui, sans-serif; fill: #1a1a1a; }
.s { font: 400 11px system-ui, sans-serif; fill: #444; }
.b { font: 700 12px system-ui, sans-serif; fill: #fff; }
.box { fill: #f5f7fa; stroke: #2a6db5; stroke-width: 1.5; rx: 6; }
.box2 { fill: #eef6ee; stroke: #2e7d32; stroke-width: 1.5; rx: 6; }
.box3 { fill: #fff8e6; stroke: #b7791f; stroke-width: 1.5; rx: 6; }
.arr { stroke: #333; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#333"/></marker></defs>
<rect width="640" height="340" fill="#ffffff"/>
<text x="20" y="28" class="t">The quantization ladder: bits per weight vs risk</text><rect x="20" y="50" width="300" height="46" fill="#2e7d32" opacity="0.85" rx="6"/><text x="30" y="70" class="b">fp16 / bf16 (16 bits)</text><text x="30" y="88" class="s" fill="#fff">Safe default. Negligible loss.</text><text x="340" y="78" class="s">Model size: ~160 GB per 70B (illustrative)</text><rect x="20" y="112" width="240" height="46" fill="#2a6db5" opacity="0.85" rx="6"/><text x="30" y="132" class="b">int8 (8 bits)</text><text x="30" y="150" class="s" fill="#fff">Usually fine with per-channel scales.</text><text x="340" y="140" class="s">Model size: ~80 GB per 70B (illustrative)</text><rect x="20" y="174" width="180" height="46" fill="#b7791f" opacity="0.85" rx="6"/><text x="30" y="194" class="b">int4 (GPTQ/AWQ) (4 bits)</text><text x="30" y="212" class="s" fill="#fff">Needs good method + calibration.</text><text x="340" y="202" class="s">Model size: ~40 GB per 70B (illustrative)</text><rect x="20" y="236" width="120" height="46" fill="#c62828" opacity="0.85" rx="6"/><text x="30" y="256" class="b">sub-4-bit (2-3 bits)</text><text x="30" y="274" class="s" fill="#fff">Breaks reasoning first.</text><text x="340" y="264" class="s">Model size: ~20 GB per 70B (illustrative)</text><text x="20" y="315" class="s">Each step down needs a method that earns it. The KV cache is a separate lever.</text></svg>