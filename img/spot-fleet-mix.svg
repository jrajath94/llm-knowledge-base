<svg xmlns='http://www.w3.org/2000/svg' width='100%' viewBox='0 0 680 200' style='max-width:680px;background:#111111;border:1px solid #3a3a3a;border-radius:8px' role='img'><text x='20' y='28' font-size='14' fill='#ececec' text-anchor='start' font-weight='bold' font-family='system-ui,sans-serif'>Spot vs reserved: size reserved for the floor, peaks on spot</text><line x1='60' y1='150' x2='640' y2='150' stroke='#3a3a3a'/><text x='600' y='168' font-size='11' fill='#9a9a9a' text-anchor='middle' font-weight='normal' font-family='system-ui,sans-serif'>time</text><text x='28' y='150' font-size='11' fill='#9a9a9a' text-anchor='middle' font-weight='normal' font-family='system-ui,sans-serif'>load</text><rect x='60' y='110' width='580' height='40' fill='#6cb2ff' opacity='0.35'/><text x='350' y='135' font-size='12' fill='#ececec' text-anchor='middle' font-weight='normal' font-family='system-ui,sans-serif'>reserved: sized for the 10th-percentile load (never disappears)</text><rect x='120' y='60' width='90' height='50' rx='4' fill='#f0b429' opacity='0.5'/><rect x='330' y='60' width='130' height='50' rx='4' fill='#f0b429' opacity='0.5'/><rect x='540' y='60' width='70' height='50' rx='4' fill='#f0b429' opacity='0.5'/><text x='350' y='88' font-size='12' fill='#ececec' text-anchor='middle' font-weight='normal' font-family='system-ui,sans-serif'>spot peaks: 50-70% cheaper, can vanish with minutes of notice</text><text x='20' y='190' font-size='12' fill='#9a9a9a' text-anchor='start' font-weight='normal' font-family='system-ui,sans-serif'>When spot vanishes: queue, shed low-priority traffic, or cascade to a smaller model.</text></svg>