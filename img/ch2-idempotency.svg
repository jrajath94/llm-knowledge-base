<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='100%' role='img' aria-label='Idempotency flow: a retried request returns the stored result instead of running twice'>
<text x='20' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#ececec'>Idempotency: the retry runs once, even when sent twice</text>
<text x='20' y='54' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>The key comes from the client, because the server may never have seen the first attempt.</text>

<!-- client -->
<rect x='20' y='90' width='180' height='90' rx='10' fill='#141414' stroke='#262626' stroke-width='1.5'/>
<text x='110' y='120' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec' text-anchor='middle'>client</text>
<text x='110' y='144' font-family='monospace,monospace' font-size='11' fill='#a8a8a8' text-anchor='middle'>generates key</text>
<text x='110' y='162' font-family='monospace,monospace' font-size='11' fill='#f0b429' text-anchor='middle'>job-9f31</text>

<text x='222' y='140' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' fill='#a8a8a8' text-anchor='middle'>&#8594;</text>
<text x='222' y='160' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>POST + key</text>

<!-- server decision -->
<rect x='264' y='90' width='220' height='90' rx='10' fill='#141414' stroke='#64b5f6' stroke-width='1.5'/>
<text x='374' y='120' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#64b5f6' text-anchor='middle'>key in table?</text>
<text x='374' y='144' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>yes &#8594; return stored</text>
<text x='374' y='164' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>no &#8594; run the job</text>

<text x='506' y='122' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' fill='#a8a8a8' text-anchor='middle'>&#8594;</text>
<text x='506' y='160' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='20' fill='#a8a8a8' text-anchor='middle'>&#8594;</text>

<!-- stored result path -->
<rect x='528' y='80' width='180' height='60' rx='10' fill='#7bc96f' fill-opacity='0.10' stroke='#7bc96f' stroke-width='1.5'/>
<text x='618' y='104' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='600' fill='#7bc96f' text-anchor='middle'>return stored result</text>
<text x='618' y='124' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>no re-run, no double bill</text>

<!-- run job path -->
<rect x='528' y='150' width='412' height='60' rx='10' fill='#141414' stroke='#262626' stroke-width='1.5'/>
<text x='734' y='174' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#ececec' text-anchor='middle'>run job, <tspan font-weight='600' fill='#f0b429'>store result under key first</tspan>, then return</text>
<text x='734' y='194' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#a8a8a8' text-anchor='middle'>store-then-return: a crash in between is the documented edge</text>

<!-- retry timeline -->
<rect x='20' y='230' width='920' height='130' rx='10' fill='#141414' stroke='#262626' stroke-width='1.5'/>
<text x='40' y='258' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#ececec'>the retry, drawn as a timeline</text>
<text x='40' y='288' font-family='monospace,monospace' font-size='12' fill='#a8a8a8'>t0  client sends POST key=job-9f31  &#8594;  server runs job, stores result, returns it</text>
<text x='40' y='312' font-family='monospace,monospace' font-size='12' fill='#e06c60'>t1  network drops the response; client cannot tell whether the job ran</text>
<text x='40' y='336' font-family='monospace,monospace' font-size='12' fill='#7bc96f'>t2  client retries with the SAME key  &#8594;  server finds the key, returns the stored result</text>

<text x='20' y='388' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#a8a8a8'>Keys expire after 24 to 72 hours: long enough for every realistic retry, short enough that the table stays small.</text>
</svg>
