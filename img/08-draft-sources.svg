<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="900" height="680" fill="#0d0d0d" rx="8"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#ececec">Where the draft comes from</text>
<text x="24" y="60" font-size="13" fill="#8a8a8a">Cheapest first; the draft must share the target&#x27;s vocabulary</text>
<rect x="24" y="94" width="414" height="160" fill="#141414" stroke="#4fd1a5" stroke-width="1.5" rx="6" opacity="1"/>
<text x="231" y="130" font-size="14" font-weight="bold" fill="#4fd1a5" text-anchor="middle">1. Smaller sibling model</text>
<text x="231" y="164" font-size="11" fill="#a8a8a8" text-anchor="middle">a 1B draft for a 70B target;</text>
<text x="231" y="186" font-size="11" fill="#a8a8a8" text-anchor="middle">the classic pairing</text>
<rect x="462" y="94" width="414" height="160" fill="#141414" stroke="#6cb2ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="669" y="130" font-size="14" font-weight="bold" fill="#6cb2ff" text-anchor="middle">2. Distilled draft</text>
<text x="669" y="164" font-size="11" fill="#a8a8a8" text-anchor="middle">trained to mimic the target;</text>
<text x="669" y="186" font-size="11" fill="#a8a8a8" text-anchor="middle">cheap and well matched</text>
<rect x="24" y="284" width="414" height="160" fill="#141414" stroke="#b388ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="231" y="320" font-size="14" font-weight="bold" fill="#b388ff" text-anchor="middle">3. Self-speculation</text>
<text x="231" y="354" font-size="11" fill="#a8a8a8" text-anchor="middle">extra heads on the target itself</text>
<text x="231" y="376" font-size="11" fill="#a8a8a8" text-anchor="middle">predict 2-3 tokens ahead; no separate model</text>
<rect x="462" y="284" width="414" height="160" fill="#141414" stroke="#f0b429" stroke-width="1.5" rx="6" opacity="1"/>
<text x="669" y="320" font-size="14" font-weight="bold" fill="#f0b429" text-anchor="middle">4. N-gram / retrieval</text>
<text x="669" y="354" font-size="11" fill="#a8a8a8" text-anchor="middle">copy from the prompt;</text>
<text x="669" y="376" font-size="11" fill="#a8a8a8" text-anchor="middle">great when the answer repeats the context, useless otherwise</text>
<rect x="24" y="494" width="852" height="76" fill="#141414" stroke="#e57ea6" stroke-width="1.5" rx="6" opacity="1"/>
<text x="450" y="526" font-size="14" font-weight="bold" fill="#ececec" text-anchor="middle">The constraint</text>
<text x="450" y="550" font-size="11" fill="#a8a8a8" text-anchor="middle">The draft must share the target&#x27;s vocabulary, or the probabilities are not comparable.</text>
<text x="24" y="596" font-size="11" fill="#8a8a8a" text-anchor="start">Three traps: speculative decoding provably does not change the output distribution (identical in distribution to the target</text>
<text x="24" y="613" font-size="11" fill="#8a8a8a" text-anchor="start">alone). It helps memory-bound decode, not compute-bound prefill. And speedup is bounded: even a perfect draft is capped by the</text>
<text x="24" y="630" font-size="11" fill="#8a8a8a" text-anchor="start">draft&#x27;s own cost and the gamma you chose.</text>
</svg>