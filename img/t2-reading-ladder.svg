<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="Part 2 three-tier reading ladder">
<rect width="720" height="370" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Part 2 reading path: three tiers, in order</text>
<rect class="box" x="150" y="60" width="420" height="74" rx="8"/>
<line x1="150" y1="60" x2="150" y2="134" stroke="#f0b429" stroke-width="4"/>
<text x="176" y="84" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Tier 1: the core (do not skip)</text>
<text x="176" y="104" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">T.1 reward modeling, T.2 PPO/DPO/GRPO, T.3 data quality</text>
<text x="176" y="122" text-anchor="start" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">the interview spine</text>
<path d="M360,134 L360,146" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="150" y="146" width="420" height="74" rx="8"/>
<line x1="150" y1="146" x2="150" y2="220" stroke="#58a6ff" stroke-width="4"/>
<text x="176" y="170" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Tier 2: supporting</text>
<text x="176" y="190" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">T.4 evals done right, T.5 safety tension</text>
<text x="176" y="208" text-anchor="start" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">read after the core</text>
<path d="M360,220 L360,232" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect class="box" x="150" y="232" width="420" height="74" rx="8"/>
<line x1="150" y1="232" x2="150" y2="306" stroke="#8a8a8a" stroke-width="4"/>
<text x="176" y="256" text-anchor="start" fill="#ececec" font-size="14" font-weight="700" font-family="Charis SIL, Georgia, serif">Tier 3: on demand</text>
<text x="176" y="276" text-anchor="start" fill="#a8a8a8" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">T.6 frontier, constitutional, T.7 production</text>
<text x="176" y="294" text-anchor="start" fill="#8a8a8a" font-size="11" font-weight="400" font-family="Charis SIL, Georgia, serif">when the chapter calls for it</text>
<text x="360" y="345" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">T.1 leans on Vol 7 ch 4. T.2 assumes ch 4-6. T.4 needs App 11A.</text>
</svg>