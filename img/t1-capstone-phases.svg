<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 663" role="img" aria-label="Capstone: the six phases of one reproduction">
<rect width="900" height="663" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Capstone: the six phases of one reproduction</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Reproduce the Chinchilla scaling result at small scale. Each phase feeds the next.</text>
<rect x="40.0" y="79.0" width="820.0" height="84.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="60.0" y="121.0" text-anchor="start" fill="#2dd4bf" font-size="26" font-family="Charis SIL, Georgia, serif" font-weight="bold">0</text>
<text x="105.0" y="107.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Restate the claims</text>
<text x="105.0" y="129.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">C1: 20 tokens per parameter at fixed compute. C2: isoFLOP minima fittable as a parabola.</text>
<text x="105.0" y="143.8" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">C3: small-many-tokens beats big-few-tokens.</text>
<line x1="60.0" y1="163.0" x2="60.0" y2="171.0" stroke="#2dd4bf" stroke-width="2"/>
<rect x="40.0" y="171.0" width="820.0" height="84.0" rx="6" fill="#111111" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="60.0" y="213.0" text-anchor="start" fill="#2dd4bf" font-size="26" font-family="Charis SIL, Georgia, serif" font-weight="bold">1</text>
<text x="105.0" y="199.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Data</text>
<text x="105.0" y="221.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Dedupe (MinHash), decontaminate eval overlap, fix the mix and do not touch it: the mix</text>
<text x="105.0" y="235.8" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">is a confounder for C1.</text>
<line x1="60.0" y1="255.0" x2="60.0" y2="263.0" stroke="#2dd4bf" stroke-width="2"/>
<rect x="40.0" y="263.0" width="820.0" height="84.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="60.0" y="305.0" text-anchor="start" fill="#4aa8ff" font-size="26" font-family="Charis SIL, Georgia, serif" font-weight="bold">2</text>
<text x="105.0" y="291.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">The isoFLOP sweep</text>
<text x="105.0" y="313.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">12-18 runs: fixed FLOPs budgets, varying sizes. Tokens per run = budget / 6ND. The 6ND</text>
<text x="105.0" y="327.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">identity prices every run.</text>
<line x1="60.0" y1="347.0" x2="60.0" y2="355.0" stroke="#4aa8ff" stroke-width="2"/>
<rect x="40.0" y="355.0" width="820.0" height="84.0" rx="6" fill="#111111" stroke="#4aa8ff" stroke-width="1.5"/>
<text x="60.0" y="397.0" text-anchor="start" fill="#4aa8ff" font-size="26" font-family="Charis SIL, Georgia, serif" font-weight="bold">3</text>
<text x="105.0" y="383.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Fit and predict</text>
<text x="105.0" y="405.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Parabola against log-parameters per budget, read the minima; optima line slope near 1;</text>
<text x="105.0" y="419.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">then the C3 head-to-head.</text>
<line x1="60.0" y1="439.0" x2="60.0" y2="447.0" stroke="#4aa8ff" stroke-width="2"/>
<rect x="40.0" y="447.0" width="820.0" height="84.0" rx="6" fill="#111111" stroke="#ff9f43" stroke-width="1.5"/>
<text x="60.0" y="489.0" text-anchor="start" fill="#ff9f43" font-size="26" font-family="Charis SIL, Georgia, serif" font-weight="bold">4</text>
<text x="105.0" y="475.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">The compute budget</text>
<text x="105.0" y="497.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Total FLOPs -&gt; GPU-hours at given MFU. Pad 30-50%: proxy runs hit lower MFU than large</text>
<text x="105.0" y="511.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">ones.</text>
<line x1="60.0" y1="531.0" x2="60.0" y2="539.0" stroke="#ff9f43" stroke-width="2"/>
<rect x="40.0" y="539.0" width="820.0" height="84.0" rx="6" fill="#111111" stroke="#b388ff" stroke-width="1.5"/>
<text x="60.0" y="581.0" text-anchor="start" fill="#b388ff" font-size="26" font-family="Charis SIL, Georgia, serif" font-weight="bold">5</text>
<text x="105.0" y="567.0" text-anchor="start" fill="#ececec" font-size="13.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">Failure modes + 'reproduced'</text>
<text x="105.0" y="589.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Optima may shift with your corpus: that is direction, not refutation. Reproduced = clear</text>
<text x="105.0" y="603.9" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">minima, moving as predicted, C3 wins, within your noise.</text>
</svg>
