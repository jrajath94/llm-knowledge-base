<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" style="max-width:680px" role="img" aria-label="Chunked prefill: a long prefill split into chunks interleaved with running decode steps">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}
.t{font-size:15px;font-weight:700}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.lbl{font-size:12px;fill:#a8a8a8}
.big{font-size:13px;font-weight:700}
.num{font-size:13px}
.ax{stroke:#5a5a5a;stroke-width:1.5}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.cell{font-size:13px;font-weight:700}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text class="t" x="24" y="30">Chunked prefill: interleave, do not stall</text>
<text class="m" x="24" y="52">A whole long prefill would stall running decodes. Split it into chunks, one per step.</text>
<text class="lbl" x="185" y="88" text-anchor="middle">t1</text>
<text class="lbl" x="241" y="88" text-anchor="middle">t2</text>
<text class="lbl" x="297" y="88" text-anchor="middle">t3</text>
<text class="lbl" x="353" y="88" text-anchor="middle">t4</text>
<text class="lbl" x="409" y="88" text-anchor="middle">t5</text>
<text class="lbl" x="465" y="88" text-anchor="middle">t6</text>
<text class="lbl" x="521" y="88" text-anchor="middle">t7</text>
<text class="lbl" x="577" y="88" text-anchor="middle">t8</text>
<rect x="157" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="181" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="213" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="237" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="269" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="293" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="325" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="349" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="381" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="405" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="437" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="461" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="493" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="517" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="549" y="100" width="48" height="34" rx="5" fill="#7fc97f" opacity="0.85"/>
<text class="cell" x="573" y="123" text-anchor="middle" fill="#101010" font-size="11">dec</text>
<rect x="157" y="142" width="48" height="34" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="181" y="165" text-anchor="middle" fill="#101010" font-size="11">P1</text>
<rect x="269" y="142" width="48" height="34" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="293" y="165" text-anchor="middle" fill="#101010" font-size="11">P2</text>
<rect x="381" y="142" width="48" height="34" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="405" y="165" text-anchor="middle" fill="#101010" font-size="11">P3</text>
<rect x="493" y="142" width="48" height="34" rx="5" fill="#6cb2ff" opacity="0.85"/>
<text class="cell" x="517" y="165" text-anchor="middle" fill="#101010" font-size="11">P4</text>
<text class="m" x="24" y="122">running decodes</text>
<text class="m" x="24" y="164">prefill chunks</text>
<rect class="box" x="24" y="210" width="632" height="110" rx="8"/>
<text class="big" x="40" y="238">Chunk size is the knob.</text>
<text class="m" x="40" y="260">Bigger chunks: lower TTFT, lumpier TPOT. The running decodes keep streaming.</text>
<text class="m" x="40" y="282">Smaller chunks: smoother TPOT, slower TTFT. Tune it against the p99 you promised.</text>
<text class="m" x="40" y="304">Without chunking, one 2k-token prefill stalls every decode ~0.3 s.</text>
</svg>
