<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 192" font-family="Charis SIL, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The human instrument&#x27;s operating manual"><rect x="22" y="14" width="916" height="164" rx="10" fill="#141414" stroke="#2e2e2e"/><text x="38" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f0b429">APPENDIX 11B</text><text x="38" y="66" font-size="16" font-weight="700" fill="#ececec">A preference label is a measurement made by a human instrument</text><rect x="38" y="96" width="203.33781249999998" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="58" cy="118" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="58" y="123" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">1</text><text x="78" y="123" font-size="13.5" font-weight="700" fill="#ececec">Train labelers</text><text x="54" y="144" font-size="12" fill="#a8a8a8">teach the rubric before</text><text x="54" y="160" font-size="12" fill="#a8a8a8">anyone labels</text><line x1="251.33781249999998" y1="136.0" x2="265.3378125" y2="136.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="265.3378125,131.0 273.3378125,136.0 265.3378125,141.0" fill="#a8a8a8"/><rect x="281.3378125" y="96" width="242.43794218750003" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="301.3378125" cy="118" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="301.3378125" y="123" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">2</text><text x="321.3378125" y="123" font-size="13.5" font-weight="700" fill="#ececec">Handle disagreements</text><text x="297.3378125" y="144" font-size="12" fill="#a8a8a8">adjudicate: the rubric or the</text><text x="297.3378125" y="160" font-size="12" fill="#a8a8a8">task may be broken</text><line x1="533.7757546875" y1="136.0" x2="547.7757546875" y2="136.0" stroke="#a8a8a8" stroke-width="2.2"/><polygon points="547.7757546875,131.0 555.7757546875,136.0 547.7757546875,141.0" fill="#a8a8a8"/><rect x="563.7757546875" y="96" width="224.7326875" height="80" rx="8" fill="#1d1d1d" stroke="#2e2e2e"/><circle cx="583.7757546875" cy="118" r="11" fill="#f0b429" fill-opacity="0.18" stroke="#f0b429"/><text x="583.7757546875" y="123" font-size="13" font-weight="700" fill="#f0b429" text-anchor="middle">3</text><text x="603.7757546875" y="123" font-size="13.5" font-weight="700" fill="#ececec">Design the pool</text><text x="579.7757546875" y="144" font-size="12" fill="#a8a8a8">so it does not silently bias</text><text x="579.7757546875" y="160" font-size="12" fill="#a8a8a8">your reward model</text></svg>