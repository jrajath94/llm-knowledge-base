<text x="634" y="120" font-size="12" fill="#ececec" text-anchor="start">Healthy: both fall</text>
<text x="634" y="140" font-size="12" fill="#ececec" text-anchor="start">together, gap stays</text>
<text x="634" y="160" font-size="12" fill="#ececec" text-anchor="start">small and steady.</text>
