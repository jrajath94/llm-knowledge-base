<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330">
<rect width="560" height="330" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>Three retrain triggers</text><rect x='30' y='70' width='170' height='52' rx='8' fill='none' stroke='#f0b429' stroke-width='1.5'/><text x='115.0' y='101.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#f0b429' text-anchor='middle'>SCHEDULED</text><text x='220' y='102' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>every N days, N from measured decay</text><rect x='30' y='140' width='170' height='52' rx='8' fill='none' stroke='#7bc98a' stroke-width='1.5'/><text x='115.0' y='171.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#7bc98a' text-anchor='middle'>THRESHOLD</text><text x='220' y='172' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>PSI above the line K windows running</text><rect x='30' y='210' width='170' height='52' rx='8' fill='none' stroke='#e57ea6' stroke-width='1.5'/><text x='115.0' y='241.0' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e57ea6' text-anchor='middle'>EVENT-DRIVEN</text><text x='220' y='242' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>launch, new market, schema change</text><text x='20' y='300' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Usually the team combines all three.</text></svg>