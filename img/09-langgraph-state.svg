<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="LangGraph state graph with checkpointing">
<rect width="800" height="400" fill="#141414"/>
<style>text { font-family: Charis SIL, serif; fill: #e8e8e8; } .accent { fill: #f0b429; } .muted { fill: #888888; } .box { fill: none; stroke: #f0b429; stroke-width: 1.5; } .line { stroke: #888888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#888888" stroke-width="1.5"/></marker></defs>
<text x="400.0" y="28" text-anchor="middle" font-size="18" class="accent">LangGraph: State, Cycles, Checkpoints</text>
<rect x="80" y="120" width="150" height="70" class="box" rx="4"/>
<text x="155.0" y="142" text-anchor="middle" font-size="14">Agent</text>
<text x="155.0" y="160" text-anchor="middle" font-size="11" class="muted">calls model</text>
<rect x="325" y="120" width="150" height="70" class="box" rx="4"/>
<text x="400.0" y="142" text-anchor="middle" font-size="14">Tools</text>
<text x="400.0" y="160" text-anchor="middle" font-size="11" class="muted">runs tools</text>
<line x1="230" y1="155" x2="325" y2="155" class="line"/>
<line x1="400" y1="190" x2="400" y2="240" class="line"/>
<line x1="325" y1="155" x2="230" y2="155" class="line"/>
<text x="400" y="270" text-anchor="middle" font-size="12" class="muted">Checkpointer saves state after every node</text>
<text x="400" y="295" text-anchor="middle" font-size="12" class="muted">interrupt() pauses for human approval</text>
<text x="400" y="320" text-anchor="middle" font-size="12" class="muted">thread_id keys the run for resume</text>
</svg>