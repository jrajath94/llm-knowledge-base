<svg xmlns="http://www.w3.org/2000/svg" width="720" height="397" viewBox="0 0 720 397" role="img" aria-label="Six attack families">
<rect width="720" height="397" fill="#0d0d0d"/>
<style>
.box{fill:#0d0d0d;stroke:#3a3a3a;stroke-width:1.5}
.t{font:600 14px 'Charis SIL',Georgia,serif;fill:#ececec}
.s{font:400 12px 'Charis SIL',Georgia,serif;fill:#a8a8a8}
.ss{font:400 11px 'Charis SIL',Georgia,serif;fill:#8a8a8a}
.arr{stroke:#f0b429;stroke-width:2;fill:none;marker-end:url(#ah)}
.arr2{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah2)}
.num{font:700 15px 'Charis SIL',Georgia,serif;fill:#f0b429}
</style><defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#f0b429" stroke-width="2"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8" fill="none" stroke="#e5484d" stroke-width="2"/></marker>
</defs>
<text x="360" y="30" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif">Six attack families: learn them, then generate probes</text>
<rect class="box" x="30" y="60" width="333" height="84" rx="8"/>
<line x1="30" y1="60" x2="30" y2="144" stroke="#f0b429" stroke-width="4"/>
<text x="50" y="90" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">direct requests</text>
<text x="50" y="114" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">"tell me the vault combination" - the baseline</text>
<rect class="box" x="375" y="60" width="333" height="84" rx="8"/>
<line x1="375" y1="60" x2="375" y2="144" stroke="#58a6ff" stroke-width="4"/>
<text x="395" y="90" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">roleplay and persona</text>
<text x="395" y="114" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">refusal would break character: the screenwriter trick</text>
<rect class="box" x="30" y="156" width="333" height="84" rx="8"/>
<line x1="30" y1="156" x2="30" y2="240" stroke="#3fb950" stroke-width="4"/>
<text x="50" y="186" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">encoding and translation</text>
<text x="50" y="210" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">base64, leetspeak, another language</text>
<rect class="box" x="375" y="156" width="333" height="84" rx="8"/>
<line x1="375" y1="156" x2="375" y2="240" stroke="#8a8a8a" stroke-width="4"/>
<text x="395" y="186" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">multi-turn buildup</text>
<text x="395" y="210" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">harmless questions first, then a slow pivot</text>
<rect class="box" x="30" y="252" width="333" height="84" rx="8"/>
<line x1="30" y1="252" x2="30" y2="336" stroke="#e5484d" stroke-width="4"/>
<text x="50" y="282" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">instruction smuggling</text>
<text x="50" y="306" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">malicious text hidden in tool output or documents</text>
<rect class="box" x="375" y="252" width="333" height="84" rx="8"/>
<line x1="375" y1="252" x2="375" y2="336" stroke="#c678dd" stroke-width="4"/>
<text x="395" y="282" text-anchor="start" fill="#ececec" font-size="13" font-weight="700" font-family="Charis SIL, Georgia, serif">automated search</text>
<text x="395" y="306" text-anchor="start" fill="#a8a8a8" font-size="10" font-weight="400" font-family="Charis SIL, Georgia, serif">Garak-style libraries, PyRIT-style orchestrators</text>
<text x="360" y="372" text-anchor="middle" fill="#ececec" font-size="12" font-weight="400" font-family="Charis SIL, Georgia, serif">a healthy probe library covers all six families for every high-risk goal</text>
</svg>