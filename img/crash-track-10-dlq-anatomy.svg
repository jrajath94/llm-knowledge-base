<svg xmlns="http://www.w3.org/2000/svg" width="520" height="285" viewBox="0 0 520 285">
<rect width="520" height="285" fill="#0d0d0d"/><text x='20' y='32' font-family='Charis SIL, Georgia, serif' font-size='17' fill='#e8e8e8' text-anchor='start' font-weight='bold'>The DLQ is a queue with an owner, not a grave</text><circle cx='46' cy='70' r='6' fill='#7bc98a'/><text x='62' y='75' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>human-readable payload</text><circle cx='46' cy='110' r='6' fill='#7bc98a'/><text x='62' y='115' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>daily reader or digest</text><circle cx='46' cy='150' r='6' fill='#7bc98a'/><text x='62' y='155' font-family='Charis SIL, Georgia, serif' font-size='14' fill='#e8e8e8' text-anchor='start'>age alert</text><text x='20' y='230' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#e57ea6' text-anchor='start'>Without these it becomes a silent backlog.</text><text x='20' y='254' font-family='Charis SIL, Georgia, serif' font-size='13' fill='#9a9a9a' text-anchor='start'>Data loss gets discovered during an audit.</text></svg>