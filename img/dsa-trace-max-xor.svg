<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 373" role="img" aria-label="Chapter 8: Maximum XOR of Two Numbers — the worked example, traced">
<rect width="900" height="373" fill="#0d0d0d"/>
<text x="450.0" y="20" text-anchor="middle" fill="#ececec" font-size="17" font-family="Charis SIL, Georgia, serif" font-weight="bold">Chapter 8: Maximum XOR of Two Numbers — the worked example, traced</text>
<text x="450.0" y="46" text-anchor="middle" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif">Figure 34. nums = [3, 10, 5, 25, 2, 8]. Trie of 5-bit numbers. For x = 5 (00101), always prefer the opposite bit.</text>
<line x1="40.0" y1="75.0" x2="860.0" y2="75.0" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="48.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">step</text>
<text x="128.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">state</text>
<text x="488.0" y="93.0" text-anchor="start" fill="#8a8a8a" font-size="11" font-family="Charis SIL, Georgia, serif" font-weight="bold">decision</text>
<rect x="40.0" y="101.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="120.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">bit 4 (16s)</text>
<text x="128.0" y="121.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">x has 0: prefer 1</text>
<text x="488.0" y="121.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">25 has 1: go right, score 16</text>
<text x="48.0" y="149.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">bit 3 (8s)</text>
<text x="128.0" y="150.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">x has 0: prefer 1</text>
<text x="488.0" y="150.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">25 has 1: go right, score 24</text>
<rect x="40.0" y="159.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="178.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">bit 2 (4s)</text>
<text x="128.0" y="179.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">x has 1: prefer 0</text>
<text x="488.0" y="179.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">25 has 0: go left, score 28</text>
<text x="48.0" y="207.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">bit 1 (2s)</text>
<text x="128.0" y="208.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">x has 0: prefer 1</text>
<text x="488.0" y="208.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">25 has 0: no 1-branch, stay, score 28</text>
<rect x="40.0" y="217.0" width="820.0" height="29.0" rx="6" fill="#101010" stroke="none" stroke-width="1"/>
<text x="48.0" y="236.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">bit 0 (1s)</text>
<text x="128.0" y="237.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">x has 1: prefer 0</text>
<text x="488.0" y="237.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">25 has 1: no 0-branch, stay, score 28</text>
<text x="48.0" y="265.5" text-anchor="start" fill="#f0b429" font-size="12.5" font-family="Charis SIL, Georgia, serif" font-weight="bold">result</text>
<text x="128.0" y="266.0" text-anchor="start" fill="#ececec" font-size="12" font-family="Charis SIL, Georgia, serif">5 xor 25 = 28</text>
<text x="488.0" y="266.0" text-anchor="start" fill="#8a8a8a" font-size="12" font-family="Charis SIL, Georgia, serif">the max over all x is 28</text>
<line x1="40.0" y1="275.0" x2="860.0" y2="275.0" stroke="#2a2a2a" stroke-width="1.5"/>
<rect x="40.0" y="285.0" width="820.0" height="52.0" rx="6" fill="#0f0f0f" stroke="#2dd4bf" stroke-width="1"/>
<text x="58.0" y="307.0" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">Greedy works because bits are decided high to low: winning bit 4 beats any combination of lower</text>
<text x="58.0" y="323.9" text-anchor="start" fill="#ececec" font-size="12.5" font-family="Charis SIL, Georgia, serif">bits. The trie makes 'prefer opposite' a walk, not a search.</text>
</svg>
