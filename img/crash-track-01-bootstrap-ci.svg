<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" style="max-width:760px" role="img" aria-label="Two confidence intervals: the plus 2 point delta excludes zero and is real, the plus 0.15 delta includes zero and is noise.">
<style>
text{font-family:'Charis SIL',Georgia,serif;fill:#ececec}
.m{fill:#a8a8a8;font-size:12px}.s{fill:#a8a8a8;font-size:11px}
.t{font-size:15px;font-weight:700}.big{font-size:13px;font-weight:700}.num{font-size:13px}
.g{fill:#f0b429}.b{fill:#6cb2ff}.gr{fill:#7fc97f}.r{fill:#e57373}
.box{fill:#141414;stroke:#3a3a3a;stroke-width:1.5}
.pick{fill:#141414;stroke:#f0b429;stroke-width:2}
.arr{stroke:#8a8a8a;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.lbl{font-size:12px;fill:#a8a8a8}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/></marker></defs>
<text x="24" y="30" text-anchor="start" class="t">Paired bootstrap: zero inside means noise</text>
<line x1="120" y1="210" x2="680" y2="210" stroke="#8a8a8a"/>
<text x="213.33333333333331" y="232" text-anchor="middle" class="m">0</text>
<text x="400.0" y="232" text-anchor="middle" class="m">+1</text>
<text x="586.6666666666667" y="232" text-anchor="middle" class="m">+2</text>
<line x1="213.33333333333331" y1="80" x2="213.33333333333331" y2="210" stroke="#e57373" stroke-dasharray="5,4"/>
<text x="213.33333333333331" y="70" text-anchor="middle" class="s">zero</text>
<line x1="482.1333333333333" y1="150" x2="610.9333333333333" y2="150" stroke="#7fc97f" stroke-width="10" stroke-linecap="round"/>
<text x="90" y="155" text-anchor="start" class="num">+2.0 delta</text>
<text x="545.6000000000001" y="132" text-anchor="middle" class="big">REAL</text>
<line x1="179.73333333333335" y1="180" x2="304.8" y2="180" stroke="#e57373" stroke-width="10" stroke-linecap="round"/>
<text x="90" y="185" text-anchor="start" class="num">+0.15 delta</text>
<text x="243.2" y="218.0" text-anchor="middle" class="big">noise</text>
<text x="24" y="285" text-anchor="start" class="s">Green interval excludes zero: the delta is real. Red interval includes zero: the delta is noise.</text>
</svg>